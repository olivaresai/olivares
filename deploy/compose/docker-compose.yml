#
# One-command single-node deployment of the Olivares AI control plane (SCP-05).
# This base file runs the engine with the embedded, pure-Go SQLite store — zero
# external dependencies, air-gap-ready, installable in one command (INSTALL.md).
#
#   docker compose -f deploy/compose/docker-compose.yml up --wait --wait-timeout 120
#   docker compose -f deploy/compose/docker-compose.yml logs olivares | sed -n '/FIRST-BOOT SETUP/,/========================/p'
#
# For the Postgres (multi-tenant) topology, layer the override:
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.postgres.yml up --wait --wait-timeout 120
#
# Supply chain: PIN THE IMAGE BY DIGEST in production. Set OLIVARES_IMAGE to
# docker.io/olivaresai/olivares@sha256:<digest> (the OFFICIAL registry) and verify
# it with cosign before running (scripts/verify-release.sh / cosign verify). The
# ghcr.io/olivaresai/olivares fallback carries the SAME digest, signatures and
# attestations — swap the host if Docker Hub is unreachable or its anonymous-pull
# rate limit bites (ghcr.io does not rate-limit anonymous pulls). See .env.example.
services:
  olivares:
    image: ${OLIVARES_IMAGE:-docker.io/olivaresai/olivares:latest}
    # :8443 inside the container asks Go for dual-stack (IPv4+IPv6; IPv4 still
    # works on IPv6-disabled kernels); the published port below controls exposure.
    command:
      - serve
      - --listen=:8443
      - --grpc-listen=:8444
      - --data-dir=/var/lib/olivares
      - --checkpoint-interval=1h
    environment:
      # The address a BROWSER reaches this console at. The command above binds
      # :8443 inside the container, which is a bind and not an address — so
      # without this the first-boot banner can only offer the same-machine URL,
      # and the passkey relying party has nothing to be derived from.
      #
      # Inert when unset: the engine treats an empty value as "no declared
      # address" and behaves exactly as it did before. Set it in .env (see
      # .env.example) to the https:// URL your operators type. Start-time only:
      # `docker compose up -d` again after changing it.
      #
      # This changes no bind and no TLS posture: the published ports below are
      # still loopback-only by default.
      OLIVARES_PUBLIC_URL: "${OLIVARES_PUBLIC_URL:-}"
    ports:
      # Bind to localhost on the HOST by default — expose deliberately.
      - "127.0.0.1:8443:8443"   # HTTPS: REST API + web UI
      - "127.0.0.1:8444:8444"   # gRPC: ControlPlane/ingest API
    volumes:
      # Holds the audit signing key, TLS material and the SQLite store — persist it.
      - olivares-data:/var/lib/olivares
    # --- hardening (mirrors the distroless image + docs/SECURITY-HARDENING.md) ---
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource ceilings (honored by `docker compose up`); match the Helm defaults.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    restart: unless-stopped
    # Direct exec: the distroless image needs no shell, curl or wget. The probe
    # trusts the engine's own first-boot certificate from the persistent data
    # volume and returns 0 ready, 1 not-ready, 2 unable-to-measure.
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/olivares
        - readyz
        - --server=https://127.0.0.1:8443
        - --ca-cert=/var/lib/olivares/tls.crt
        - --timeout=3s
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  olivares-data:
