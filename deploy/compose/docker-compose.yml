#
# One-command single-node deployment of the Olivares AI control plane (SCP-05).
# This base file runs the engine with the embedded, pure-Go SQLite store — zero
# external dependencies, air-gap-ready, installable in one command (INSTALL.md).
#
#   docker compose -f deploy/compose/docker-compose.yml up --wait --wait-timeout 120
#
# Then finish setup and inspect the running service:
#
#   docker compose -f deploy/compose/docker-compose.yml exec olivares olivares first-boot
#   docker compose -f deploy/compose/docker-compose.yml logs olivares | sed -n '/FIRST-BOOT SETUP/,/========================/p'
#   docker compose -f deploy/compose/docker-compose.yml ps
#   docker compose -f deploy/compose/docker-compose.yml down
#
# EVERY ONE OF THEM NEEDS THE -f. Compose looks for a compose file in the working
# directory, and this one lives in deploy/compose/, so a bare `docker compose ps`
# at the repository root answers "no configuration file provided". Export
# COMPOSE_FILE=deploy/compose/docker-compose.yml once if you would rather not
# repeat it.
#
# For the Postgres (multi-tenant) topology, layer the override:
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.postgres.yml up --wait --wait-timeout 120
#
# Supply chain: PIN THE IMAGE BY DIGEST in production. Set OLIVARES_IMAGE to
# docker.io/olivaresai/olivares@sha256:<digest> (the OFFICIAL registry) and verify
# it with cosign before running (scripts/verify-release.sh / cosign verify). The
# ghcr.io/olivaresai/olivares fallback carries the SAME digest, signatures and
# attestations — swap the host if Docker Hub is unreachable or its anonymous-pull
# rate limit bites (ghcr.io does not rate-limit anonymous pulls). See .env.example.

# The project is named here rather than inherited from this directory. Without it
# Compose names the project after the directory it found the file in — "compose" —
# and the container comes out as `compose-olivares-1`, which is the name of a
# directory and not of a product. With it, the engine is `olivares`, the Postgres
# and backup services of the overrides are `olivares-postgres-1` and
# `olivares-backup-1`, and the volumes and network carry the same prefix.
#
# `docker compose -p <name>` still wins over this line: CI uses that to run several
# copies of this stack on one shared daemon.
name: olivares

services:
  olivares:
    # release
    image: ${OLIVARES_IMAGE:-docker.io/olivaresai/olivares:0.1}
    # /release
    # A FIXED NAME, so the documented next step is one argv an operator can type:
    #   docker exec olivares olivares first-boot
    # The cost is deliberate and worth stating: two copies of this stack cannot run
    # on one host at the same time without `-p` and a container_name override,
    # because a container name is unique per daemon. A memorable name for the
    # single-node deployment this file IS beats a second concurrent copy of it.
    container_name: olivares
    # :8443 inside the container asks Go for dual-stack (IPv4+IPv6; IPv4 still
    # works on IPv6-disabled kernels); the published port below controls exposure.
    command:
      - serve
      - --listen=:8443
      - --grpc-listen=:8444
      - --data-dir=/var/lib/olivares
      - --checkpoint-interval=1h
    environment:
      # The address a BROWSER reaches this console at. The command above binds
      # :8443 inside the container, which is a bind and not an address — so
      # without this the first-boot banner can only offer the same-machine URL,
      # and the passkey relying party has nothing to be derived from.
      #
      # Inert when unset: the engine treats an empty value as "no declared
      # address" and behaves exactly as it did before. Set it in .env (see
      # .env.example) to the https:// URL your operators type. Start-time only:
      # `docker compose up -d` again after changing it.
      #
      # This changes no bind and no TLS posture: it only decides what the banner
      # prints and what the passkey relying party is derived from.
      OLIVARES_PUBLIC_URL: "${OLIVARES_PUBLIC_URL:-}"
      HOME: /var/lib/olivares/home
      # The directory the command above serves, so a bare `olivares first-boot` finds it.
      OLIVARES_DATA_DIR: /var/lib/olivares
    ports:
      # PUBLISHED ON EVERY HOST INTERFACE BY DEFAULT. This is a server: the console
      # answers over TLS with a self-signed first-boot certificate and no default
      # credentials, and hiding it from the machine it was installed on buys
      # nothing. Set OLIVARES_BIND=127.0.0.1 in .env to restrict it to the host
      # itself (or an address of one interface to pick just that one).
      #
      # ONE THING TO KNOW, because it surprises people: a published Docker port is
      # reached through Docker's own DNAT rules, which are consulted BEFORE a host
      # firewall's INPUT chain — so an `ufw deny 8443` does not close this. Restrict
      # it with OLIVARES_BIND, or filter in the DOCKER-USER chain.
      - "${OLIVARES_BIND:-0.0.0.0}:8443:8443"   # HTTPS: REST API + web UI
      - "${OLIVARES_BIND:-0.0.0.0}:8444:8444"   # gRPC: ControlPlane/ingest API
    volumes:
      # Holds engine state, managed tools, account homes and session folders — persist it.
      - olivares-data:/var/lib/olivares
      # The ONE project mount, at /project, read-write: the host folder whose absolute path
      # is in OLIVARES_PROJECT_DIR (.env or the shell). Unset, /project is the empty
      # olivares-project volume, never the directory you run `docker compose` from: the
      # documented commands run from the Olivares checkout, whose deploy/compose/ holds the
      # DR passphrase and the Postgres .env. A session started in /project is confined to it
      # like any session folder, and can change everything in it: never point the variable
      # at your home directory. Compose 2 can create a missing folder as root: check the path.
      # The container user is UID 65532, so on a Linux host it needs write access to the
      # folder (deploy/compose/README.md, "Work on a host project folder").
      - "${OLIVARES_PROJECT_DIR:-olivares-project}:/project"
    # Agent dependencies are in the image; installations and caches stay in the volume.
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # AppArmor 4 hosts: load the shipped profile as the README shows before up.
      - apparmor=${OLIVARES_APPARMOR_PROFILE:-docker-default}
      # Docker's default profile plus the user and network namespaces that confine
      # a record-bound Claude Code or Codex session to its provider; nothing else is added.
      - seccomp=../seccomp/olivares-sessions.json
    # Memory ceiling for the engine plus the first agent session. There is no CPU limit:
    # a Docker daemon refuses a CPU limit above its CPU count, so any limit above 1 would
    # stop `up` on a 1-CPU host. The host's CPUs bound the engine; to cap it lower, add
    # deploy.resources.limits.cpus (at most the host's CPU count) in a Compose override.
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 256M
    restart: unless-stopped
    # Direct exec: readiness uses the engine binary. The probe
    # trusts the engine's own first-boot certificate from the persistent data
    # volume and returns 0 ready, 1 not-ready, 2 unable-to-measure.
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/olivares
        - readyz
        - --server=https://127.0.0.1:8443
        - --ca-cert=/var/lib/olivares/tls.crt
        - --timeout=3s
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  olivares-data:
  olivares-project:
