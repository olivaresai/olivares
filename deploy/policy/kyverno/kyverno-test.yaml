# `kyverno test deploy/policy/kyverno` driver. It runs the three ClusterPolicies
# against the good/bad fixtures and asserts the expected pass/fail outcome for
# each (policy, rule, resource) pair. Conformant resources pass; violating
# resources fail. Resources a rule does not match are simply not listed (they
# would report `skip`).
#
# Schema verified against https://kyverno.io/docs/kyverno-cli/ (the `test`
# subcommand): name, policies[], resources[], results[].{policy,rule,resource,kind,result}.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: olivares-governance-gate
policies:
  - disallow-inline-secrets.yaml
  - require-run-as-non-root.yaml
  - require-governance-labels.yaml
resources:
  - testdata/good.yaml
  - testdata/bad.yaml
results:
  # disallow-inline-secrets (matches Pod)
  - policy: olivares-disallow-inline-secrets
    rule: no-inline-sensitive-env
    resource: good-pod
    kind: Pod
    result: pass
  - policy: olivares-disallow-inline-secrets
    rule: no-inline-sensitive-env
    resource: bad-pod
    kind: Pod
    result: fail
  # require-run-as-non-root (matches Pod)
  - policy: olivares-require-run-as-non-root
    rule: run-as-non-root
    resource: good-pod
    kind: Pod
    result: pass
  - policy: olivares-require-run-as-non-root
    rule: run-as-non-root
    resource: bad-pod
    kind: Pod
    result: fail
  # require-governance-labels (matches Deployment)
  - policy: olivares-require-governance-labels
    rule: governance-labels
    resource: good-deploy
    kind: Deployment
    result: pass
  - policy: olivares-require-governance-labels
    rule: governance-labels
    resource: bad-deploy
    kind: Deployment
    result: fail
