# Kyverno ClusterPolicy — the "no inline secrets" gate, mirroring
# conftest/policy/deny_inline_secret.rego for clusters that admit Kyverno rather
# than (or alongside) a pre-merge Conftest gate. Enforce => admission is denied.
#
# It rejects a Pod-bearing workload whose container env sets a sensitive-named
# variable (password / secret / token / apikey / api-key / api_key) to an INLINE
# literal value. An env var sourced from a Secret uses `valueFrom` and carries
# no `value:` key, so the (X-)anchor pattern below never matches it and the rule
# passes. This is the client-side binding of the deny-by-default posture, not the
# control-plane PDP (Cedar+OPA).
#
# The check uses a deny rule (a foreach with a conditions block over a JMESPath
# count) rather than an overlay pattern, so it works uniformly for every
# sensitive name without enumerating one anchor per name.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: olivares-disallow-inline-secrets
  annotations:
    policies.kyverno.io/title: Disallow inline secrets
    policies.kyverno.io/category: Olivares Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A credential must be referenced from a Kubernetes Secret
      (valueFrom.secretKeyRef), never pasted as an inline literal into a
      manifest. An inline credential is committed to Git and persists in history
      — a standing exfiltration path. Mirrors the Olivares minimal-data posture.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-inline-sensitive-env
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: >-
          Container env vars whose name matches (password|secret|token|apikey)
          must source their value from a Kubernetes Secret
          (valueFrom.secretKeyRef), not an inline literal. No inline credentials.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: >-
                      {{ element.env[?value != null && (contains(to_lower(name), 'password') || contains(to_lower(name), 'secret') || contains(to_lower(name), 'token') || contains(to_lower(name), 'apikey') || contains(to_lower(name), 'api_key') || contains(to_lower(name), 'api-key'))] | length(@) }}
                    operator: GreaterThan
                    value: 0
