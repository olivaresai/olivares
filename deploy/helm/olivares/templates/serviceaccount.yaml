{{- /*
SPDX-FileCopyrightText: 2026 Olivares.AI
SPDX-License-Identifier: AGPL-3.0-only

The engine needs NO Kubernetes API privileges, so the ServiceAccount is bound to
no Role/ClusterRole and the API token is not auto-mounted. Least privilege.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "olivares.serviceAccountName" . }}
  labels:
    {{- include "olivares.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
