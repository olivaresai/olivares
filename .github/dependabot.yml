#
# Keeps SHA-pinned GitHub Actions current (SCP-07). The github-actions ecosystem
# updates BOTH the pinned 40-char SHA AND the trailing `# vX.Y.Z` comment in one
# PR, so Scorecard's Pinned-Dependencies stays green without manual SHA bumps.
# Keep one clean `# vX.Y.Z` comment on the same line as each `uses: …@<sha>` so
# Dependabot can find and rewrite it. Also tracks Go modules and the web npm tree.
# Until 1.0, defer major and pinned prerelease version updates. Security updates
# remain immediate: update-types ignores and version-update groups do not apply
# to security updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # The SLSA reusable workflows are pinned by SEMVER TAG (slsa-verifier validates
    # the builder ID against the tag); let Dependabot bump the tag, not a SHA.

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Hold this tagged prerelease's version updates until 1.0.
      - dependency-name: "github.com/antithesishq/antithesis-sdk-go"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The manifest pins a dev release; hold its version updates until 1.0.
      - dependency-name: "onnxruntime-web"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Bumps the pinned distroless base digest (FROM …@sha256:…) when upstream rebuilds
  # the nonroot image with CVE fixes — the automated half of SCP-11's base pin.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # Upgrade Go builders together with go.work and the module toolchain pins.
    ignore:
      - dependency-name: "golang"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
