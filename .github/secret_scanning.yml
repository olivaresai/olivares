# Synthetic secret FIXTURES (test files + testdata) are excluded from secret-scanning
# alerts. They are non-functional example tokens used to test this product's OWN
# secret redaction / DLP detectors — never real credentials. The authoritative
# secret gate is gitleaks in mainline-ci (with .gitleaks.toml allowlisting these
# same fixtures). Source files carry no real-pattern secret literals by design.
paths-ignore:
  - "**/*_test.go"
  - "**/testdata/**"
