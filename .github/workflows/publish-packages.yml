#
# Production package-repository publication. Dispatch is inert until the
# packages-publish environment reviewer approves it. R2 is staged and reread;
# clean native clients bind the staged bytes before signed roots become stable.
name: publish-packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified public release tag (vYY.M.PATCH)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-packages-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, "${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'self-hosted' }}"]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bind.outputs.version }}
      source_epoch: ${{ steps.bind.outputs.source_epoch }}
      valid_until: ${{ steps.bind.outputs.valid_until }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: bind public repo, main, release and deterministic publication time
        id: bind
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_REPOSITORY: olivaresai/olivares
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || {
            echo "::error::publish-packages runs only in $EXPECTED_REPOSITORY"
            exit 2
          }
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo "::error::dispatch must select main, got $GITHUB_REF"
            exit 2
          }
          [[ "$RELEASE_TAG" =~ ^v(2[6-9]|[3-9][0-9])\.([1-9]|1[0-2])\.[0-9]+$ ]] || {
            echo "::error::release_tag must be production CalVer vYY.M.PATCH"
            exit 2
          }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo '::error::checkout differs from the dispatched commit'
            exit 1
          }
          release="$(gh release view "$RELEASE_TAG" --repo "$EXPECTED_REPOSITORY" --json tagName,publishedAt,isDraft,url)"
          jq -e --arg tag "$RELEASE_TAG" --arg url "https://github.com/${EXPECTED_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            '.tagName == $tag and .url == $url and .isDraft == false and (.publishedAt | type == "string")' \
            <<<"$release" >/dev/null
          run="$(gh api "repos/${EXPECTED_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          created_at="$(jq -er '.created_at | select(type == "string")' <<<"$run")"
          source_epoch="$(date -u -d "$created_at" +%s)"
          [[ "$source_epoch" =~ ^[0-9]+$ ]] || exit 2
          version="${RELEASE_TAG#v}"
          {
            printf 'version=%s\n' "$version"
            printf 'source_epoch=%s\n' "$source_epoch"
            printf 'valid_until=%s\n' "$((source_epoch + 31536000))"
          } >>"$GITHUB_OUTPUT"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: packages-publish
      url: https://packages.olivares.ai
    env:
      CLOUDFLARE_ACCOUNT_ID: 8763fa9c803b42fb43ffe6e5ad64815e
      PACKAGE_BUCKET: olivares-packages
      PACKAGE_ORIGIN: https://packages.olivares.ai
      STAGING_ID: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: require the reviewed environment shape before reading signing inputs
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVIEWER_ID: '106011039'
        run: |
          set -euo pipefail
          environment="$(gh api "repos/${GITHUB_REPOSITORY}/environments/packages-publish")"
          jq -e --argjson reviewer_id "$EXPECTED_REVIEWER_ID" '
            .name == "packages-publish" and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([.protection_rules[] | select(.type == "required_reviewers") |
              .reviewers[]] | length) == 1 and
            ([.protection_rules[] | select(.type == "required_reviewers") |
              .reviewers[] | select(.type == "User" and .reviewer.id == $reviewer_id)] | length) == 1
          ' <<<"$environment" >/dev/null
          policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/packages-publish/deployment-branch-policies")"
          jq -e '.total_count == 1 and (.branch_policies | length) == 1 and
            ([.branch_policies[] | select(.name == "main" and .type == "branch")] | length) == 1' \
            <<<"$policies" >/dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        with:
          node-version-file: .node-version

      - name: install and assert reviewed wrangler
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --global wrangler@4.100.0
          [[ "$(wrangler --version | awk 'NR==1{print $1}')" == 4.100.0 ]]
          printf 'OLIVARES_WRANGLER_BIN=%s\n' "$(command -v wrangler)" >>"$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        timeout-minutes: 5
        with:
          cosign-release: 'v2.6.4'

      - name: assert the installed cosign binary before release authentication
        timeout-minutes: 2
        run: bash scripts/assert-cosign-binary.sh --isolate

      - name: prove producer, verifier and wrong-key mutant before custody
        timeout-minutes: 4
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/test-package-repositories.sh

      - name: fetch and authenticate public release package assets
        id: release
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          dist="${RUNNER_TEMP}/package-release"
          mkdir -m 0700 "$dist"
          gh release download "$tag" --repo olivaresai/olivares --dir "$dist" \
            --pattern checksums.txt --pattern checksums.txt.sig --pattern checksums.txt.pem \
            --pattern "olivares_${RELEASE_VERSION}_linux_*.deb" \
            --pattern "olivares_${RELEASE_VERSION}_linux_*.rpm" \
            --pattern "olivares_${RELEASE_VERSION}_linux_*.apk"
          identity="https://github.com/olivaresai/olivares/.github/workflows/release.yml@refs/tags/${tag}"
          bash scripts/cosign-verified.sh verify-blob \
            --certificate "$dist/checksums.txt.pem" --signature "$dist/checksums.txt.sig" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$dist/checksums.txt"
          printf 'dist=%s\n' "$dist" >>"$GITHUB_OUTPUT"

      - name: materialize encrypted repository key against tracked anchors
        id: key
        timeout-minutes: 3
        env:
          SIGNING_BUNDLE: ${{ secrets.OLIVARES_REPO_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.OLIVARES_REPO_SIGNING_PASSPHRASE }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SIGNING_BUNDLE" && -n "$SIGNING_PASSPHRASE" ]] || {
            echo '::error::repository signing custody is incomplete'
            exit 2
          }
          printf '%s' "$SIGNING_BUNDLE" >"${RUNNER_TEMP}/repository-key.b64"
          printf '%s' "$SIGNING_PASSPHRASE" >"${RUNNER_TEMP}/repository-key.passphrase"
          bash scripts/materialize-package-repository-key.sh \
            --bundle-base64-file "${RUNNER_TEMP}/repository-key.b64" \
            --passphrase-file "${RUNNER_TEMP}/repository-key.passphrase" \
            --descriptor "$GITHUB_WORKSPACE/packaging/repositories/production-key-descriptor.json" \
            --out "${RUNNER_TEMP}/repository-key" --github-output "$GITHUB_OUTPUT"

      - name: render and verify stable and security with the production key
        timeout-minutes: 15
        env:
          DIST: ${{ steps.release.outputs.dist }}
          KEY_DIR: ${{ steps.key.outputs.key_dir }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
          TMPDIR: ${{ runner.temp }}
          VALID_UNTIL: ${{ needs.preflight.outputs.valid_until }}
        run: |
          set -euo pipefail
          export OLIVARES_PACKAGE_REPO_KEY_DESCRIPTOR_FILE="$KEY_DIR/descriptor.json"
          export OLIVARES_PACKAGE_REPO_OPENPGP_SECRET_KEY_FILE="$KEY_DIR/openpgp-secret.asc"
          export OLIVARES_PACKAGE_REPO_APK_PRIVATE_KEY_FILE="$KEY_DIR/apk-private.pem"
          export OLIVARES_PACKAGE_REPO_OPENPGP_PASSPHRASE_FILE="$KEY_DIR/passphrase"
          export OLIVARES_PACKAGE_REPO_APK_PASSPHRASE_FILE="$KEY_DIR/passphrase"
          for channel in stable security; do
            output="${RUNNER_TEMP}/package-repository-${channel}"
            python3 scripts/render-package-repositories.py \
              --checksums "$DIST/checksums.txt" --artifact-dir "$DIST" \
              --version "$RELEASE_VERSION" --channel "$channel" \
              --source-date-epoch "$SOURCE_EPOCH" --valid-until-epoch "$VALID_UNTIL" \
              --out "$output"
            python3 scripts/verify-package-repositories.py \
              --repo-root "$output" --checksums "$DIST/checksums.txt" --artifact-dir "$DIST" \
              --version "$RELEASE_VERSION" --channel "$channel" \
              --openpgp-key "$KEY_DIR/olivares-packages.asc" \
              --apk-key "$KEY_DIR/${{ steps.key.outputs.apk_public_key_name }}"
          done
          python3 scripts/assemble-package-repository-publish-tree.py \
            --stable "${RUNNER_TEMP}/package-repository-stable" \
            --security "${RUNNER_TEMP}/package-repository-security" \
            --key-dir "$KEY_DIR" --out "${RUNNER_TEMP}/package-publish-tree"

      - name: stage every R2 byte and read it back
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLIVARES_PACKAGE_PUBLISH_APPROVED: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bash scripts/publish-package-repositories.sh --mode stage --apply \
            --bucket "$PACKAGE_BUCKET" --tree "${RUNNER_TEMP}/package-publish-tree" \
            --staging-id "$STAGING_ID"
          mkdir -m 0700 "${RUNNER_TEMP}/package-evidence"

      - name: clean apt client verifies staged HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family apt
          --image debian:stable-slim@sha256:04634311a8d5fc442b6eb06d792293c4f3e2268652ca7634e00ce8ef5cc0a28a
          --repository-url "$PACKAGE_ORIGIN/staging/$STAGING_ID"
          --assets "${{ steps.release.outputs.dist }}" --version "${{ needs.preflight.outputs.version }}"
          --evidence-file "${RUNNER_TEMP}/package-evidence/apt.ok" --staging-id "$STAGING_ID"

      - name: clean rpm client verifies staged HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family rpm
          --image fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          --repository-url "$PACKAGE_ORIGIN/staging/$STAGING_ID"
          --assets "${{ steps.release.outputs.dist }}" --version "${{ needs.preflight.outputs.version }}"
          --evidence-file "${RUNNER_TEMP}/package-evidence/rpm.ok" --staging-id "$STAGING_ID"

      - name: clean APK client verifies staged HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family apk
          --image alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          --repository-url "$PACKAGE_ORIGIN/staging/$STAGING_ID"
          --assets "${{ steps.release.outputs.dist }}" --version "${{ needs.preflight.outputs.version }}"
          --evidence-file "${RUNNER_TEMP}/package-evidence/apk.ok" --staging-id "$STAGING_ID"

      - name: promote content then signed discovery roots with rollback
        timeout-minutes: 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OLIVARES_PACKAGE_PUBLISH_APPROVED: '1'
          TMPDIR: ${{ runner.temp }}
        run: >-
          bash scripts/publish-package-repositories.sh --mode promote --apply
          --bucket "$PACKAGE_BUCKET" --tree "${RUNNER_TEMP}/package-publish-tree"
          --staging-id "$STAGING_ID" --evidence-dir "${RUNNER_TEMP}/package-evidence"

      - name: clean apt client verifies promoted HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family apt
          --image debian:stable-slim@sha256:04634311a8d5fc442b6eb06d792293c4f3e2268652ca7634e00ce8ef5cc0a28a
          --repository-url "$PACKAGE_ORIGIN" --assets "${{ steps.release.outputs.dist }}"
          --version "${{ needs.preflight.outputs.version }}"

      - name: clean rpm client verifies promoted HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family rpm
          --image fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          --repository-url "$PACKAGE_ORIGIN" --assets "${{ steps.release.outputs.dist }}"
          --version "${{ needs.preflight.outputs.version }}"

      - name: clean APK client verifies promoted HTTPS repository
        timeout-minutes: 20
        run: >-
          bash scripts/package-repository-client-ci.sh --family apk
          --image alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          --repository-url "$PACKAGE_ORIGIN" --assets "${{ steps.release.outputs.dist }}"
          --version "${{ needs.preflight.outputs.version }}"

      - name: bind published root key to the reviewed key bytes
        timeout-minutes: 2
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' \
            "$PACKAGE_ORIGIN/olivares-packages.gpg" -o "${RUNNER_TEMP}/published-packages.gpg"
          cmp -s "${RUNNER_TEMP}/published-packages.gpg" \
            "${{ steps.key.outputs.key_dir }}/olivares-packages.gpg"

      - name: erase decrypted signing material
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for target in \
            "${RUNNER_TEMP}/repository-key.b64" \
            "${RUNNER_TEMP}/repository-key.passphrase" \
            "${RUNNER_TEMP}/repository-key/openpgp-secret.asc" \
            "${RUNNER_TEMP}/repository-key/apk-private.pem" \
            "${RUNNER_TEMP}/repository-key/passphrase"; do
            if [[ -f "$target" ]]; then shred -u -- "$target"; fi
          done
