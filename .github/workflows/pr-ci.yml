# SPDX-FileCopyrightText: 2026 Olivares.AI
# SPDX-License-Identifier: AGPL-3.0-only
# Pull-request checks for the public repository.

name: pr-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One live run per pull request. Cancelling a superseded run is right here and wrong in a
# publisher: nothing in this workflow writes anything anywhere.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Job conditions cannot read env, so they repeat the public repository literal.
  # scripts/check-pr-ci-regime.sh checks those literals against this value.
  # The release-profile condition names no private repository because this workflow
  # is exported. Only a repository that declares the profile can select that condition.
  PUBLIC_REPO: olivaresai/olivares

jobs:
  pr-lint:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod' || vars.OLIVARES_DEV_CI == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: DCO required and attribution trailers refused
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/check-commit-trailers.sh --range "$PR_BASE..$PR_HEAD"
          bash scripts/test-commit-trailers.sh
      - name: source text uses US English
        env:
          SOURCE_LANGUAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/test-source-language.py
          python3 scripts/check-source-language.py --base "$SOURCE_LANGUAGE_BASE"
          python3 scripts/check-source-language.py --public-tooling .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}   # self-hosted runners keep the Go caches on local disk
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      - name: Third-party license gate
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          python3 scripts/test-license-gates.py
          python3 scripts/test-license-gate-integration.py
          python3 scripts/license-gate.py --tags release
      - name: licence headers, the AGPL boundary and PR job guards
        run: task lint:spdx lint:boundary lint:pr-ci-regime lint:pr-ci-regime:selftest
      - name: migration history is immutable on the PR head
        env:
          OLIVARES_MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/check-migrations.sh
          python3 scripts/test-migration-immutability.py
          bash scripts/test-migrations-coverage.sh
      - name: mainline failure reporter regression tests
        run: python3 scripts/test-mainline-ci-report.py
      - name: the pre-push hook checks what a push changes
        run: bash scripts/test-pre-push.sh
      - name: the end-of-work ratchet tells its verdicts apart
        run: bash scripts/test-kept-checks.sh
      - name: Cosign installers do not share a writable bootstrap
        run: python3 scripts/test-cosign-install-isolation.py
      - name: native packaging uses the candidate checkout
        run: python3 -m unittest discover -s scripts/userspace -p test_package_setup.py -v
      - name: browser setup works without sudo on self-hosted runners
        run: python3 -m unittest discover -s scripts/userspace -p test_browser_setup.py -v
      - name: published worktree setup survives runner reuse
        run: python3 -m unittest discover -s scripts/userspace -p test_worktree_setup.py -v

      # ⛔ THE SHARD GATE RUNS HERE, AND UNTIL NOW IT RAN NOWHERE A PULL REQUEST COULD MEET
      # IT. It was a leg of the local pre-push hook only, so a fork, a web edit or any push
      # that did not go through that hook landed with the partition unchecked: a package in
      # no shard, a test in no group or a matrix out of step with the file would have arrived
      # with every required check green. That is the exact failure the gate was written for,
      # and it was not armed on the side that decides.
      #
      # THIS JOB, AND NOT A NEW ONE. Both legs need the Go toolchain for `go list` — and only
      # for `go list`, which reads package metadata and compiles nothing. This job already
      # sets up Go above, for `lint:boundary`, whose own check refuses to run without it, and
      # it already builds Go code in the SDK step below. So the two legs cost this job their
      # own seconds and no new setup. Measured locally, with the module metadata already
      # cached: 3.8 s for the gate over the 12 workspace modules and 13.4 s for its 40-case
      # battery, of which the battery's one real-tree case is most of the walk. The hosted
      # figure is to be read off the first two runs of this job, not assumed from these.
      - name: the shard partition is the whole suite, and every test is in exactly one group
        run: task lint:pr-suite-shards lint:pr-suite-shards:selftest

      # Capture the existing generator's outputs on the hosted runner.
      - name: record the generation inputs
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/sdk-generation"
          mkdir -p "$receipt"
          git rev-parse HEAD > "$receipt/checkout.sha"
          printf '%s\n' "$PR_HEAD" > "$receipt/pr-head.sha"
          go version > "$receipt/toolchain.txt"
          sha256sum go.work go.work.sum web/openapi/openapi.json web/openapi/openapi.beta.json \
            clients/generator/*.go clients/generator/go.mod > "$receipt/inputs.sha256"
      - name: regenerate the SDKs with their existing generator
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/sdk-generation"
          if go run ./clients/generator -spec web/openapi/openapi.json \
            -beta web/openapi/openapi.beta.json -out clients > "$receipt/generator.log" 2>&1; then
            printf '0\n' > "$receipt/generator.exit"
          else
            rc=$?
            printf '%s\n' "$rc" > "$receipt/generator.exit"
            cat "$receipt/generator.log"
            exit "$rc"
          fi
          paths=(
            clients/go/operations.gen.go clients/go/version.gen.go
            clients/python/src/olivares_client/_operations.py
            clients/typescript/src/operations.gen.ts clients/typescript/src/version.gen.ts
            clients/java/src/main/java/ai/olivares/client/Client.java
            clients/java/src/main/java/ai/olivares/client/ApiMetadata.java
          )
          # A recreated untracked file is invisible to git diff. Every fixed
          # output must exist in the reviewed index before its patch is usable.
          if ! git ls-files --error-unmatch -- "${paths[@]}" > /dev/null; then
            echo "::error::a declared SDK output is absent from the committed index"
            exit 1
          fi
          sha256sum "${paths[@]}" > "$receipt/outputs.sha256"
          git diff --binary -- "${paths[@]}" > "$receipt/generated-sdk.patch"
          if git diff --quiet -- "${paths[@]}"; then
            :
          else
            rc=$?
            if [[ "$rc" -ne 1 ]]; then
              echo "::error::could not compare generated SDKs with their committed snapshots"
              exit 2
            fi
            echo "::error::generated SDKs differ from their committed snapshots; inspect the generation artifact"
            exit 1
          fi
      - name: Preserve evidence on the runner
        if: always()
        continue-on-error: true
        uses: ./.github/actions/ci-evidence
        with:
          name: sdk-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-generation/
      - name: retain generation evidence, including a stale-output patch
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-generation/
          retention-days: 1
          if-no-files-found: error

  pr-build:
    needs: pr-web
    if: always() && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod' || vars.OLIVARES_DEV_CI == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: require the console producer to succeed
        run: test '${{ needs.pr-web.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: download the console built by pr-web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pr-web.outputs.bundle-artifact }}
          path: ${{ runner.temp }}/web-generation-artifact
      - name: embed the verified console output
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          cd "$RUNNER_TEMP/web-generation-artifact"
          sha256sum -c SHA256SUMS
          jq -e --arg head "$PR_HEAD" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            .schema == "olivares.web-generation/v1" and
            .checkout_sha == $head and .pr_head_sha == $head and
            .repository == $repository and .run_id == $run and .run_attempt == $attempt
          ' manifest.json > /dev/null
          tar -xzf dist.tar.gz -C "$GITHUB_WORKSPACE/core/internal/webui"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}   # self-hosted runners keep the Go caches on local disk
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      - name: build the development CLI with its first-party connectors
        run: task build:bin
      # build:bin compiles with CGO_ENABLED=0 -trimpath (scripts/lib/build-bin.sh). The same
      # flags here reuse every package the binary already compiled, so Go is compiled once;
      # with default flags this step recompiled all of it (hosted medians 6.5 + 3.4 min).
      - name: every other workspace module compiles
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -trimpath
        run: task build:go
      - name: the core session journey works on this build
        run: bash scripts/session-journey-smoke.sh --binary bin/olivares --label pr-build
      - name: verify and package the development CLI
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/cli-development-verification"
          mkdir -p "$bundle"
          checkout_sha="$(git rev-parse HEAD)"
          expected_commit="$(git rev-parse --short HEAD)"
          if [[ "$checkout_sha" != "$PR_HEAD" || ! "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the checkout or PR identity is not the expected Actions candidate"
            exit 1
          fi
          if ! git diff --exit-code --name-only HEAD --; then
            echo "::error::the build changed tracked inputs; commit the generated changes before packaging"
            exit 1
          fi
          test -s bin/olivares
          test -x bin/olivares
          install -m 0755 bin/olivares "$bundle/olivares"
          # Read the retained executable's stamp; never replace it with a declared SHA.
          timeout 30s "$bundle/olivares" --output json version > "$bundle/version.json"
          target_os="$(go env GOOS)"
          target_arch="$(go env GOARCH)"
          if ! jq -e -s --arg commit "$expected_commit" --arg os "$target_os" --arg arch "$target_arch" '
            length == 1 and (.[0] |
              type == "object" and .commit == $commit and .os == $os and .arch == $arch
              and (.version | type == "string" and length > 0)
              and (.date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and (.go | type == "string" and startswith("go")))
          ' "$bundle/version.json" > /dev/null; then
            echo "::error::the executable does not report the expected development build stamp"
            exit 1
          fi
          go version > "$bundle/toolchain.txt"
          (cd "$bundle" && go version -m ./olivares) > "$bundle/buildinfo.txt"
          binary_sha="$(sha256sum "$bundle/olivares" | cut -d ' ' -f 1)"
          jq -n --arg checkout "$checkout_sha" --arg pr_head "$PR_HEAD" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha256 "$binary_sha" \
            --slurpfile version "$bundle/version.json" '{
              schema: "olivares.cli-development-verification/v1",
              qualification: "development verification only; not a signed release",
              build_task: "task build:bin",
              checkout_sha: $checkout, pr_head_sha: $pr_head,
              repository: $repository, run_id: $run, run_attempt: $attempt,
              binary: {path: "olivares", sha256: $sha256, version: $version[0]}
            }' > "$bundle/manifest.json"
          (
            cd "$bundle"
            sha256sum olivares manifest.json version.json toolchain.txt buildinfo.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          # The tar preserves executable mode; only these fixed files enter the artifact.
          tar -czf "$RUNNER_TEMP/cli-development-verification.tar.gz" -C "$bundle" \
            olivares manifest.json version.json toolchain.txt buildinfo.txt SHA256SUMS
      - name: retain the verified development CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-development-verification
          path: ${{ runner.temp }}/cli-development-verification.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      # Use this job's already-built candidate and the release's canonical payload.
      # Container package matrices stub systemd; this hosted runner starts the real unit.
      - name: package the candidate for the native service journey
        timeout-minutes: 5
        run: bash scripts/package-service-candidate.sh
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        timeout-minutes: 3
        with:
          cosign-release: 'v2.6.4'
          # Concurrent self-hosted runners may share HOME, but not runner.temp.
          install-dir: ${{ runner.temp }}/cosign
      - name: assert reviewed release verifier bytes
        run: bash scripts/assert-cosign-binary.sh --isolate
      - name: install, start, upgrade and uninstall DEB and RPM packages
        # needs a disposable runner (sudo dpkg, a global service); shared self-hosted runners skip it
        if: runner.environment == 'github-hosted'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Both native package managers run on this disposable systemd host.
          # RPM is exercised here on Ubuntu; Fedora qualification remains separate.
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          proof="$RUNNER_TEMP/package-service"
          [[ "$(ps -p 1 -o comm=)" == systemd ]]
          trap 'sudo systemctl stop olivares.service 2>/dev/null || true' EXIT
          ready() {
            # Never restart here: an upgrade must start the new binary itself.
            for _ in {1..60}; do
              if [[ "$(sudo curl -sS --max-time 2 --cacert /var/lib/olivares/tls.crt \
                --output "$proof/logs/$fmt-$1-readyz.json" --write-out '%{http_code}' \
                https://127.0.0.1:8443/readyz 2>/dev/null || true)" == 200 ]]; then
                echo "$fmt $1: packaged service /readyz 200"
                return 0
              fi
              sleep 1
            done
            sudo journalctl -u olivares.service --no-pager -n 80 | \
              sed -E 's/olst_[A-Z2-7]{52}/[setup token redacted]/g'
            return 1
          }
          install_package() {
            case "$fmt" in
              # A kept operator edit of a conffile never waits for an answer.
              deb) sudo dpkg --force-confold -i "$1" ;;
              # Ubuntu's OS providers are tracked by dpkg, not the RPM database.
              rpm) sudo rpm -Uvh --nodeps "$1" ;;
            esac
          }
          remove_package() {
            case "$fmt" in
              deb) sudo dpkg --purge olivares ;;
              rpm) sudo rpm -e olivares ;;
            esac
            # Assert on the exact ActiveState, not an inverted exit code: `! cmd` never
            # aborted (errexit skips inversions, shellcheck SC2251), and is-active's
            # non-zero exits fold inactive, failed and could-not-check into one answer.
            # A purged unit shows ActiveState=inactive (systemd reports ghost units for
            # not-loaded units); anything else — active, failed, unreadable — is named
            # and fails the job.
            state="$(sudo systemctl show --property ActiveState --value olivares.service)" || {
              echo "pr-ci: could not read olivares.service ActiveState after $fmt removal" >&2
              exit 1
            }
            if [ "$state" != inactive ]; then
              echo "pr-ci: olivares.service ActiveState='$state' after $fmt removal (want inactive)" >&2
              exit 1
            fi
            [[ ! -e /usr/bin/olivares ]]
          }
          candidate_version="$(sh scripts/build-ldflags.sh --version)"
          python3 scripts/userspace/resolve_baseline.py --candidate-version "$candidate_version" > "$proof/baseline.json"
          baseline="$(jq -r '.tag_name // empty' "$proof/baseline.json")"
          if [[ -n "$baseline" ]]; then
            base="https://github.com/olivaresai/olivares/releases/download/$baseline"
            for asset in checksums.txt checksums.txt.sig checksums.txt.pem; do
              curl -fSL --retry 2 --max-time 90 "$base/$asset" -o "$proof/$asset"
            done
            "$OLIVARES_COSIGN_BIN" verify-blob --certificate "$proof/checksums.txt.pem" \
              --signature "$proof/checksums.txt.sig" \
              --certificate-identity "https://github.com/olivaresai/olivares/.github/workflows/release.yml@refs/tags/$baseline" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$proof/checksums.txt"
          fi
          for fmt in deb rpm; do
            # Reset only this disposable runner's product fixture between formats.
            sudo rm -rf /var/lib/olivares /etc/systemd/system/olivares.service.d
            install_package "$proof/candidate.$fmt"
            # Same assertion as remove_package, exact ActiveState instead of the inert
            # `!` one-liner: the package must not auto-start, so inactive is the only
            # passing state — a unit that auto-started and crashed to failed fails here
            # instead of folding into is-active's non-zero.
            state="$(sudo systemctl show --property ActiveState --value olivares.service)" || {
              echo "pr-ci: could not read olivares.service ActiveState after $fmt install" >&2
              exit 1
            }
            if [ "$state" != inactive ]; then
              echo "pr-ci: olivares.service ActiveState='$state' after $fmt install (want inactive: the package must not auto-start)" >&2
              exit 1
            fi
            # The env file carries listen, TLS and DSN flags: root:olivares 0640, as doctor requires.
            [[ "$(stat -c '%a %U:%G' /etc/olivares/olivares.env)" == '640 root:olivares' ]]
            sudo systemctl start olivares.service
            ready fresh
            doctor_rc=0
            sudo /usr/bin/olivares doctor --data-dir /var/lib/olivares --output json | \
              tee "$proof/logs/$fmt-doctor-fresh.json" > /dev/null || doctor_rc=$?
            [[ "$doctor_rc" -le 1 ]]
            jq -e '[.checks[] | select(.name == "configuration" and .status == "pass")] | length == 1' \
              "$proof/logs/$fmt-doctor-fresh.json" > /dev/null
            # The package unit lives in /usr/lib/systemd/system; doctor must measure it, not report the shell installer's path.
            jq -e '([.checks[] | select(.name == "service-unit" and .status == "pass" and (.detail | startswith("/usr/lib/systemd/system/olivares.service")))] | length == 1)
              and ([.checks[] | select(.name == "install-manifest" and .status == "pass")] | length == 1)
              and ([.checks[] | select(.name == "ownership" and .status == "pass")] | length == 1)' \
              "$proof/logs/$fmt-doctor-fresh.json" > /dev/null
            pid="$(sudo systemctl show --property MainPID --value olivares.service)"
            sudo cmp bin/olivares "/proc/$pid/exe"
            remove_package
            sudo rm -rf /var/lib/olivares
            if [[ -z "$baseline" ]]; then
              echo "PASS: $fmt first stable fresh service and uninstall; no predecessor upgrade applies"
              continue
            fi
            old="olivares_${baseline}_linux_amd64.$fmt"
            curl -fSL --retry 2 --max-time 90 "$base/$old" -o "$proof/$old"
            awk -v name="$old" '$2 == name {print; count++} END {if (count != 1) exit 1}' \
              "$proof/checksums.txt" > "$proof/old-checksum.txt"
            (cd "$proof" && sha256sum --check old-checksum.txt)
            install_package "$proof/$old"
            sudo systemctl start olivares.service
            ready previous
            old_pid="$(sudo systemctl show --property MainPID --value olivares.service)"
            sudo env PACKAGE_BASELINE="$baseline" python3 - <<'PY'
          import os, sqlite3
          with sqlite3.connect('/var/lib/olivares/olivares.db') as db:
              db.execute('CREATE TABLE package_upgrade_witness (version TEXT)')
              db.execute("INSERT INTO package_upgrade_witness VALUES (?)", (os.environ["PACKAGE_BASELINE"],))
          PY
            sudo mkdir -p /etc/systemd/system/olivares.service.d
            printf '[Service]\nProtectHome=tmpfs\n# operator edit: retain my policy\n' | \
              tee "$proof/edited-dropin.conf" | \
              sudo tee /etc/systemd/system/olivares.service.d/agentops.conf > /dev/null
            # Preserve an operator edit of the baseline package environment.
            printf '# operator edit: retain my flags\n' | sudo tee -a /etc/olivares/olivares.env > /dev/null
            install_package "$proof/candidate.$fmt"
            cmp "$proof/edited-dropin.conf" /etc/systemd/system/olivares.service.d/agentops.conf
            ready upgrade
            pid="$(sudo systemctl show --property MainPID --value olivares.service)"
            [[ "$pid" != "$old_pid" ]]
            sudo cmp bin/olivares "/proc/$pid/exe"
            sudo env PACKAGE_BASELINE="$baseline" python3 - <<'PY' | tee "$proof/logs/$fmt-snapshot.txt"
          import hashlib, os, pathlib, sqlite3
          snapshots = list(pathlib.Path('/var/lib/olivares/backups/pre-upgrade').glob('*/olivares.db'))
          assert len(snapshots) == 1, snapshots
          snapshot = snapshots[0]
          assert snapshot.stat().st_mode & 0o777 == 0o600
          with sqlite3.connect(f'file:{snapshot}?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone() == ('ok',)
              assert db.execute('SELECT version FROM package_upgrade_witness').fetchone() == (os.environ["PACKAGE_BASELINE"],)
          print('PASS: published', os.environ['PACKAGE_BASELINE'], 'data in snapshot', snapshot.name, hashlib.file_digest(snapshot.open('rb'), 'sha256').hexdigest())
          PY
            doctor_rc=0
            sudo /usr/bin/olivares doctor --data-dir /var/lib/olivares --output json | \
              tee "$proof/logs/$fmt-doctor.json" > /dev/null || doctor_rc=$?
            [[ "$doctor_rc" -le 1 ]]
            grep -Fq 'overrides the base service unit' "$proof/logs/$fmt-doctor.json"
            # The upgrade keeps the edited env file and closes it.
            sudo grep -qx '# operator edit: retain my flags' /etc/olivares/olivares.env
            [[ "$(stat -c '%a %U:%G' /etc/olivares/olivares.env)" == '640 root:olivares' ]]
            jq -e '[.checks[] | select(.name == "configuration" and .status == "pass")] | length == 1' \
              "$proof/logs/$fmt-doctor.json" > /dev/null
            # The package unit lives in /usr/lib/systemd/system; doctor must measure it, not report the shell installer's path.
            jq -e '([.checks[] | select(.name == "service-unit" and .status == "pass" and (.detail | startswith("/usr/lib/systemd/system/olivares.service")))] | length == 1)
              and ([.checks[] | select(.name == "install-manifest" and .status == "pass")] | length == 1)
              and ([.checks[] | select(.name == "ownership" and .status == "pass")] | length == 1)' \
              "$proof/logs/$fmt-doctor.json" > /dev/null
            sha256sum "$proof/candidate.$fmt" "$proof/$old" | tee "$proof/logs/$fmt-artifacts.sha256"
            remove_package
            echo "PASS: $fmt fresh service, automatic $baseline upgrade restart and snapshot, edited drop-in retained, uninstall stops service"
          done
      - name: Preserve evidence on the runner
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: ./.github/actions/ci-evidence
        with:
          name: package-service-journey
          path: ${{ runner.temp }}/package-service/logs/
      - name: retain native package journey output
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-service-journey
          path: ${{ runner.temp }}/package-service/logs/
          retention-days: 1
          if-no-files-found: error

  # ⛔ THE SUITE IS SPLIT BY A DECLARED LIST, AND THAT IS THE WHOLE CHANGE. Measured on
  # the hosted 4-vCPU runner over two runs of the same tree: 264 packages green and the
  # step ceiling cut the suite at 60 minutes, both times. Splitting it by PACKAGE fixed
  # that and then reached its own floor, which is one package: on 2026-09-20 cmd/olivares
  # hit `panic: test timed out after 45m0s` at 2700.093 s, and core/internal/store/sqlstore
  # hit the same clock at 2700.024 s — each on a change that does not touch it, and with
  # the same shards passing on the changes either side. Raising the ceiling makes the
  # suite PASS; it does not make the answer ARRIVE, and every contribution waits for it.
  #
  # So those two packages are now split by TEST NAME: a `group` record in the same file
  # sends the tests whose name begins with a declared letter to one shard, and a closing
  # REMAINDER group takes every name no other group claims, so that a test added tomorrow
  # is in the partition the day it is written. `go test -run` over an expression that
  # selects nothing EXITS 0, which is why the remainder is computed from the source rather
  # than written by hand, and why the gate below counts tests and not only packages.
  #
  # The partition lives in ci/pr-suite-shards.txt, in one file, readable by a person:
  # which shard owns which packages and which test names, and why each one is where it is.
  # It is NOT a hash — a hash balances nothing when one package is 27 % of the clock, and
  # it cannot be read either: whoever adds a test cannot tell where it landed.
  #
  # scripts/check-pr-suite-shards.sh proves the union of the shards is exactly the set
  # of test-bearing packages, that no package is in two, that every test of a partitioned
  # package is in exactly one group, and that this matrix is the shard list of that file.
  # A package or a test that belongs to no shard would otherwise be SILENT: every shard
  # green, the required check green, and nothing testing it.
  pr-test-shard:
    needs: pr-web
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    strategy:
      # `fail-fast: false`: a red shard must not cancel its siblings. A cancelled
      # sibling publishes no verdict at all, so one failure would hide the state of the
      # rest of the suite — which is the report the author needs most at that moment.
      fail-fast: false
      matrix:
        shard: [root-a, root-b, root-c, root-d, root-e, root-f, root-g, root-h, root-rest, root-core, store-a, store-b, store-rest, sessions, modules]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # The gate pins these ceilings to ci/pr-suite-shards.txt. Hosted root-rest
    # exhausted 35m twice; allow the measured 1.8x variation over its 19.8m cmd group
    # plus whole packages: 45m per Go binary, 55m per step, 65m per job.
    timeout-minutes: 65
    # `task test:functional` is fail-closed on the Postgres posture (scripts/pg-test-env.sh):
    # without the DSN pair it refuses rather than skipping. The first real run of this job on
    # the public repository (PR #31, 2026-09-17) died exactly there, because the job had no
    # Postgres at all. Same two services and the same resolver script as the mainline
    # functional job: two servers on ephemeral host ports (the failover test needs a second,
    # distinct one). Each shard gets its OWN pair, so the shards do not share a database and
    # the contention that a single job had between its packages is gone.
    env:
      OLIVARES_REQUIRE_WEB_BUNDLE: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
      postgres_other:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: download the console built by pr-web
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.pr-web.outputs.bundle-artifact }}
          path: ${{ runner.temp }}/web-generation-artifact
      - name: embed the verified console output
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          cd "$RUNNER_TEMP/web-generation-artifact"
          sha256sum -c SHA256SUMS
          jq -e --arg head "$PR_HEAD" --arg repository "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '
            .schema == "olivares.web-generation/v1" and
            .checkout_sha == $head and .pr_head_sha == $head and
            .repository == $repository and .run_id == $run and .run_attempt == $attempt
          ' manifest.json > /dev/null
          tar -xzf dist.tar.gz -C "$GITHUB_WORKSPACE/core/internal/webui"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}   # self-hosted runners keep the Go caches on local disk
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # Several suites build and EXECUTE a helper. A hardened /tmp is noexec, and the failure
        # reads as a test defect rather than as a mount option.
        run: |
          mkdir -p "$RUNNER_TEMP/exec"
          echo "TMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
      - name: resolve the ephemeral Postgres ports into the test DSNs
        env:
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
          PGPORT_OTHER: ${{ job.services.postgres_other.ports['5432'] }}
        run: |
          set -euo pipefail
          bash scripts/ci-postgres-service.sh resolve
          # No OLIVARES_TEST_PG_EXPECT_MAJOR here, on purpose: that variable declares a
          # Postgres MAJOR-MATRIX pass and the matrix tests then REQUIRE
          # OLIVARES_TEST_POSTGRES_MAJOR_DSNS (guardmajormatrix_pg_test.go refuses an
          # incomplete declaration instead of skipping). This job is the single-major
          # PR suite; the matrix is pg-majors.yml, which sets both. Declaring the major
          # here failed nine sqlstore tests on every PR (run 35283849584, 2026-09-17).
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        env:
          PGPASSWORD: postgres
        run: bash scripts/ci-postgres-service.sh provision
      - name: one shard of the Go suite, without the race detector
        timeout-minutes: 55
        env:
          OLIVARES_TEST_SHARD: ${{ matrix.shard }}
        # Record sampled host resources after normal exit or TERM when the shell can run
        # the trap and its log reaches GitHub. Shutdown-signal/143 observations on 2026-09-19
        # did not identify their cause. These host samples are not process RSS; neither a
        # missing report nor a low sampled peak proves or excludes OOM. SIGKILL, host loss
        # or lost logs can prevent publication. Explicit unavailable-data paths in the
        # witness print COULD NOT LOOK and return zero; the test command owns its verdict.
        run: |
          set -euo pipefail
          WITNESS="$RUNNER_TEMP/resource-witness-${{ matrix.shard }}.txt"
          bash scripts/ci-resource-witness.sh start "$WITNESS" >/dev/null
          witness_said=""
          witness() {
            if [ -z "$witness_said" ]; then
              witness_said=yes
              bash scripts/ci-resource-witness.sh report "$WITNESS"
            fi
          }
          trap witness EXIT TERM
          task test:functional:shard

  # ⛔ THE ONE NAME THE BRANCH PROTECTION ASKS FOR, AND IT MUST BE ABLE TO SAY NO.
  # A matrix job does not report under its job id: it reports `pr-test-shard (root-a)`,
  # `pr-test-shard (store-b)`, one context per value, and the set changes whenever the shard
  # list changes — as it did with this partition, which replaced four one-letter names.
  # A required context that names a job id nothing publishes waits for a status that never
  # arrives, which is how the public profile was unsatisfiable before
  # 2026-08-27. So the required name stays `pr-test` and this job is what carries it.
  #
  # `always()` is not decoration. Without it, a failed shard SKIPS this job — and a
  # skipped job SATISFIES a required check, so the red would land as green. With it, the
  # job runs whatever the shards did and the step below turns their results into a
  # verdict. `needs.<job>.result` for a matrix job is the aggregate of every value:
  # `success` only when every shard succeeded, and `fail-fast: false` does not soften
  # that — it stops the siblings from being cancelled and folds their verdicts in all the
  # same.
  pr-test:
    needs: [pr-test-shard]
    if: always() && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: every shard of the functional suite must have succeeded
        timeout-minutes: 4
        env:
          RESULT: ${{ needs.pr-test-shard.result }}
        run: |
          echo "pr-test-shard result: $RESULT"
          # AN EMPTY RESULT IS THE `missing` CASE AND IT IS RED. The expression expands to
          # the empty string when the job id does not exist — a rename, a deletion, a bad
          # merge — and an empty string matching no arm would fall through a `case` with no
          # default. It has one, and this names the state instead of inheriting it.
          case "$RESULT" in
            success)
              echo "every shard of the functional suite passed." ;;
            "")
              echo "::error::pr-test-shard reported NO result at all — the job id does not exist in this workflow, so nothing ran the functional suite."
              exit 1 ;;
            skipped)
              echo "::error::pr-test-shard was SKIPPED, so this pull request carries NO functional verdict. A green check that quietly stopped checking is worse than no check."
              exit 1 ;;
            cancelled)
              echo "::error::pr-test-shard was CANCELLED (a newer push superseded this run), so this run carries no functional verdict — read it off the run that replaced it."
              exit 1 ;;
            *)
              echo "::error::pr-test-shard did not succeed ($RESULT) — open the shard jobs to see which packages failed."
              exit 1 ;;
          esac

  pr-web:
    outputs:
      bundle-artifact: web-generation-${{ github.run_id }}-${{ github.run_attempt }}
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod' || vars.OLIVARES_DEV_CI == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 30 + the two generated-reference gates below (their step ceilings, 15 + 10).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # NODE FIRST: pnpm/action-setup installs pnpm THROUGH npm, so it needs a node on PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          standalone: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}   # self-hosted runners keep the Go caches on local disk
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      # Build once from this checkout and retain that complete output.
      # Product acceptance still requires a journey on the release binary.
      - name: verify the capture helper with isolated fake build fixtures
        run: |
          timeout 60s python3 scripts/test-web-build.py
          timeout 60s python3 scripts/test-capture-web-generation.py
          timeout 60s bash scripts/test-check-web-bundle-freshness.sh
      - name: generate and capture the complete console bundle
        id: web-generation
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/capture-web-generation.py
      - name: retain the generated console bundle
        if: success() && steps.web-generation.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-generation-artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: formatting debt does not grow
        run: task lint:format-ratchet
      - name: the console checks (the bundle was already built and verified)
        run: task check:web
      # The generated CLI reference (seven locale pages) and the console/gRPC/upgrade guides are
      # otherwise checked only after merge, in mainline-ci control-plane; public-generation writes
      # them but is dispatched. Each gate runs its own red battery first, then the check.
      - name: the generated CLI reference matches the olivares command tree
        timeout-minutes: 15
        run: |
          TMPDIR="$PWD/.cli-ref-docs-tmp" bash scripts/check-cli-ref-docs.sh --self-test
          TMPDIR="$PWD/.cli-ref-docs-tmp" bash scripts/check-cli-ref-docs.sh
      - name: the console/gRPC references and the upgrade guide match the tree
        timeout-minutes: 10
        run: task lint:guide-docs

  userspace-compat:
    needs: pr-build
    if: always() && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_DEV_CI == 'true')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: userspace-test-only
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: require the existing PR build to succeed
        run: test '${{ needs.pr-build.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: cli-development-verification
          path: ${{ runner.temp }}/userspace-input
      - name: bind the existing binary to this candidate
        timeout-minutes: 2
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          out="$RUNNER_TEMP/userspace"
          mkdir -m 700 "$out"
          echo "USERSPACE_OUT=$out" >> "$GITHUB_ENV"
          python3 scripts/userspace/extract_build.py \
            "$RUNNER_TEMP/userspace-input/cli-development-verification.tar.gz" "$out/candidate-bin"
          cp "$out/candidate-bin/manifest.json" "$out/identity.json"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}   # self-hosted runners keep the Go caches on local disk
          cache-dependency-path: go.work.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        timeout-minutes: 5
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          standalone: true
      - name: install the existing browser test tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pnpm --dir web install --frozen-lockfile
          # Self-hosted images must supply system libraries; the runner has no sudo.
          deps=()
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            deps=(--with-deps)
          fi
          # The upgrade fixture changes HOME; installation and launch must share a cache.
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/userspace-browsers"
          pnpm --dir web exec playwright install "${deps[@]}" chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=$PWD/web/node_modules" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        timeout-minutes: 5
        with:
          cosign-release: v2.6.4
          install-dir: ${{ runner.temp }}/cosign
      - name: authenticate the verifier
        timeout-minutes: 2
        run: bash scripts/assert-cosign-binary.sh --isolate
      - name: preserve published contracts and upgrade both stores
        timeout-minutes: 40
        env:
          USERSPACE_POSTGRES_DSN: postgres://postgres:userspace-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: bash scripts/userspace/compat.sh "$USERSPACE_OUT/candidate-bin/olivares"
      - name: remove the published source worktree
        if: always() && env.USERSPACE_OUT != ''
        timeout-minutes: 2
        run: |
          set -euo pipefail
          registered="$(git worktree list --porcelain)"
          if grep -Fx "worktree $USERSPACE_OUT/published-source" <<< "$registered"; then
            git worktree remove --force "$USERSPACE_OUT/published-source"
          fi
      - name: Preserve evidence on the runner
        if: always() && env.USERSPACE_OUT != ''
        continue-on-error: true
        uses: ./.github/actions/ci-evidence
        with:
          name: userspace-compat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.USERSPACE_OUT }}/identity.json
            ${{ env.USERSPACE_OUT }}/baseline.json
            ${{ env.USERSPACE_OUT }}/published.json
            ${{ env.USERSPACE_OUT }}/candidate.json
            ${{ env.USERSPACE_OUT }}/findings.json
            ${{ env.USERSPACE_OUT }}/sqlite/result.json
            ${{ env.USERSPACE_OUT }}/sqlite/*.log
            ${{ env.USERSPACE_OUT }}/postgres/result.json
            ${{ env.USERSPACE_OUT }}/postgres/*.log
      - name: retain contract findings and redacted upgrade results
        if: always() && env.USERSPACE_OUT != ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: userspace-compat-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ env.USERSPACE_OUT }}/identity.json
            ${{ env.USERSPACE_OUT }}/baseline.json
            ${{ env.USERSPACE_OUT }}/published.json
            ${{ env.USERSPACE_OUT }}/candidate.json
            ${{ env.USERSPACE_OUT }}/findings.json
            ${{ env.USERSPACE_OUT }}/sqlite/result.json
            ${{ env.USERSPACE_OUT }}/sqlite/*.log
            ${{ env.USERSPACE_OUT }}/postgres/result.json
            ${{ env.USERSPACE_OUT }}/postgres/*.log
