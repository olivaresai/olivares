# SPDX-License-Identifier: AGPL-3.0-only
#
# pr-ci — THE PULL-REQUEST REGIME OF THE PUBLIC REPOSITORY, and of nothing else.
#
# ⛔ WHY IT EXISTS. Measured 2026-08-27: no workflow in this tree had a `pull_request`
# trigger that a change to core/, modules/, cmd/ or web/ would fire — the only three that
# carry one are path-filtered to deploy/aws, the operator and the terraform provider. At the
# same time scripts/apply-branch-protection.sh's `public` profile requires TEN contexts
# (classify, control-plane, race-hot, web, examples, fips, secrets, sast, fuzz, helm-render)
# plus one approval. Those are `mainline-ci` job ids, and `mainline-ci` runs on
# `workflow_dispatch` and on `push` to main — never on a pull request, and `workflow_dispatch`
# cannot run against a fork ref at all. So on the day the repository opens, the FIRST external
# contribution would be born with no checks and permanently unmergeable, with the merge button
# saying "Expected — waiting for status to be reported" about jobs that can never report.
#
# ⛔ WHY IT IS A SEPARATE WORKFLOW AND NOT `pull_request` ADDED TO mainline-ci. Because that
# would WEAKEN branch protection instead of equipping the public repository. Branch
# protection requires four mainline-ci contexts (classify, control-plane, race-hot, web). They
# never report on a PR, so they cannot be satisfied by accident. Give mainline-ci a
# `pull_request` trigger and those four jobs would report on a PR as SKIPPED — and a job
# skipped by a job-level `if:` does NOT block a required check (measured 2026-08-01
# and written into apply-branch-protection.sh). The whole required set would evaporate into
# green. A regime for the public repository must not weaken that gate.
#
# ⛔ AND WHY EVERY JOB CARRIES A REPOSITORY GUARD. Automatic CI on every pull request is not
# wanted at the volume of changes this project carries, so the guard keeps the jobs inert
# outside the public repository. With the
# guard, a pull request elsewhere creates a run in which every job is skipped: no runner is
# occupied, no minute is billed, nothing is superseded. In the public repository the guard is
# true and the jobs run. The guard is not free of hazard — a rename would silently disable the
# whole regime — so it is not left to vigilance: scripts/check-pr-ci-regime.sh pins that every
# job carries it, that it names the same repository the export targets, and that the public
# branch-protection profile requires exactly these job ids and no others.
#
# ⛔ HOSTED RUNNERS, DELIBERATELY. A `pull_request` from a fork runs UNTRUSTED code. It must
# never reach the self-hosted runners, which share a host with this project's own builds — so
# no job here reads `vars.CI_RUNNER`. The event is `pull_request` and not
# `pull_request_target`, so the workflow runs from the PR's own tree with a read-only token and
# no access to secrets; that is the correct trade and the reason the heavy legs are not here.
#
# WHAT THIS DOES NOT COVER, said plainly rather than implied: the race detector, fuzzing, FIPS,
# the SAST and secret sweeps, the examples matrix and the Helm render stay in `mainline-ci`,
# which a maintainer dispatches on the merge candidate. The public profile's required contexts
# were lowered to what CAN report on a pull request — the alternative was leaving a list that
# is impossible to satisfy, and an impossible gate is answered with an admin override, which is
# not a gate. docs/RELEASE-GO-LIVE-RUNBOOK.md §4 carries the maintainer step.

name: pr-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One live run per pull request. Cancelling a superseded run is right here and wrong in a
# publisher: nothing in this workflow writes anything anywhere.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The one place the public repository is named in this file — y esto NO lo lee el guard.
  # Un `if:` de job no puede leer el contexto `env`, asi que los cuatro guards llevan el literal
  # y quien lo compara contra este valor es `scripts/check-pr-ci-regime.sh`. El comentario
  # anterior decia que el guard lo leia; era falso desde que existe, y se corrige aqui.
  #
  # ⛔ Y LA SEGUNDA RAMA DEL GUARD NO NOMBRA NINGUN REPOSITORIO, a proposito: este fichero viaja
  # al arbol publico. `vars.OLIVARES_RELEASE_PROFILE` solo existe EN el repositorio que declara ese perfil,
  # asi que en el publico esa rama no puede alcanzarse.
  PUBLIC_REPO: olivaresai/olivares

jobs:
  pr-lint:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        run: |
          # ⛔ LA GUARDA DE ABAJO YA ESTABA; FALTABAN LAS DOS QUE EVITAN EL FALLO EN VEZ DE
          # NOMBRARLO. La guarda dice que `task` no se alcanza; `GOBIN` explicito y su `bin` en el
          # PATH hacen que se alcance. En un runner auto-alojado PERSISTENTE, `go install` honra un
          # GOBIN que venga del entorno del servicio POR ENCIMA de $GOPATH/bin y deja el binario
          # fuera del PATH del job — sin fallar, porque instalar si instalo (medido en
          # `ci-runner-3` el 2026-08-29, corrida 33278242758).
          export GOBIN="$RUNNER_TEMP/gopath/bin"
          echo "GOBIN=$GOBIN" >> "$GITHUB_ENV"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          # Installing is not reaching: a step that installs a tool without checking it is on
          # PATH moves its own failure to whatever runs next.
          command -v task || { echo "::error::go install reported OK and task is not on PATH"; exit 1; }
      - name: licence headers and the AGPL boundary
        run: task lint:spdx lint:boundary

  pr-build:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        run: |
          # ⛔ LA GUARDA DE ABAJO YA ESTABA; FALTABAN LAS DOS QUE EVITAN EL FALLO EN VEZ DE
          # NOMBRARLO. La guarda dice que `task` no se alcanza; `GOBIN` explicito y su `bin` en el
          # PATH hacen que se alcance. En un runner auto-alojado PERSISTENTE, `go install` honra un
          # GOBIN que venga del entorno del servicio POR ENCIMA de $GOPATH/bin y deja el binario
          # fuera del PATH del job — sin fallar, porque instalar si instalo (medido en
          # `ci-runner-3` el 2026-08-29, corrida 33278242758).
          export GOBIN="$RUNNER_TEMP/gopath/bin"
          echo "GOBIN=$GOBIN" >> "$GITHUB_ENV"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          command -v task || { echo "::error::go install reported OK and task is not on PATH"; exit 1; }
      - name: every workspace module compiles
        run: task build:go

  # ⛔ THE SUITE IS SPLIT BY A DECLARED PACKAGE LIST, AND THAT IS THE WHOLE CHANGE.
  # Measured on the hosted 4-vCPU runner over two runs of the same tree: 264 packages
  # green and the step ceiling cut the suite at 60 minutes, both times. Two packages
  # carry most of the clock — core/internal/store/sqlstore at 1457 s and cmd/olivares
  # at 1358 s — and they ran one after the other, because the suite walks the workspace
  # one module at a time. Raising the ceiling makes the suite PASS; it does not make the
  # answer ARRIVE, and every contribution waits for the answer.
  #
  # The partition lives in ci/pr-suite-shards.txt, in one file, readable by a person:
  # which shard owns which packages, and why each one is where it is. It is NOT a hash
  # of the package name — a hash balances nothing when one package is 27 % of the clock,
  # and it cannot be read either: whoever adds a package cannot tell where it landed.
  #
  # scripts/check-pr-suite-shards.sh proves the union of the shards is exactly the set
  # of test-bearing packages, that no package is in two, and that this matrix is the
  # shard list of that file. A package that belongs to no shard would otherwise be
  # SILENT: every shard green, the required check green, and nothing testing it.
  pr-test-shard:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    strategy:
      # `fail-fast: false`: a red shard must not cancel the other two. A cancelled
      # sibling publishes no verdict at all, so one failure would hide the state of the
      # rest of the suite — which is the report the author needs most at that moment.
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    runs-on: ubuntu-latest
    # The ceilings are the ones ci/pr-suite-shards.txt declares, and the gate above pins
    # that they are the same numbers. The slowest shard is predicted between 24.8 and
    # 26.5 minutes — a RANGE, because the two complete runs of the same tree an hour apart
    # disagree by up to 16 % on the very package that bounds it. 45 minutes for the step
    # leaves at least 70 % of headroom over the top of that range and 55 for the job stays
    # above it. They are a prediction until a run measures them; the file says so.
    timeout-minutes: 65
    # `task test:functional` is fail-closed on the Postgres posture (scripts/pg-test-env.sh):
    # without the DSN pair it refuses rather than skipping. The first real run of this job on
    # the public repository (PR #31, 2026-09-17) died exactly there, because the job had no
    # Postgres at all. Same two services and the same resolver script as the mainline
    # functional job: two servers on ephemeral host ports (the failover test needs a second,
    # distinct one). Each shard gets its OWN pair, so the shards do not share a database and
    # the contention that a single job had between its packages is gone.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
      postgres_other:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        run: |
          # ⛔ LA GUARDA DE ABAJO YA ESTABA; FALTABAN LAS DOS QUE EVITAN EL FALLO EN VEZ DE
          # NOMBRARLO. La guarda dice que `task` no se alcanza; `GOBIN` explicito y su `bin` en el
          # PATH hacen que se alcance. En un runner auto-alojado PERSISTENTE, `go install` honra un
          # GOBIN que venga del entorno del servicio POR ENCIMA de $GOPATH/bin y deja el binario
          # fuera del PATH del job — sin fallar, porque instalar si instalo (medido en
          # `ci-runner-3` el 2026-08-29, corrida 33278242758).
          export GOBIN="$RUNNER_TEMP/gopath/bin"
          echo "GOBIN=$GOBIN" >> "$GITHUB_ENV"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          command -v task || { echo "::error::go install reported OK and task is not on PATH"; exit 1; }
      - name: TMPDIR where an extracted binary can actually run
        # Several suites build and EXECUTE a helper. A hardened /tmp is noexec, and the failure
        # reads as a test defect rather than as a mount option.
        run: |
          mkdir -p "$RUNNER_TEMP/exec"
          echo "TMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
      - name: resolve the ephemeral Postgres ports into the test DSNs
        env:
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
          PGPORT_OTHER: ${{ job.services.postgres_other.ports['5432'] }}
        run: |
          set -euo pipefail
          bash scripts/ci-postgres-service.sh resolve
          # No OLIVARES_TEST_PG_EXPECT_MAJOR here, on purpose: that variable declares a
          # Postgres MAJOR-MATRIX pass and the matrix tests then REQUIRE
          # OLIVARES_TEST_POSTGRES_MAJOR_DSNS (guardmajormatrix_pg_test.go refuses an
          # incomplete declaration instead of skipping). This job is the single-major
          # PR suite; the matrix is pg-majors.yml, which sets both. Declaring the major
          # here failed nine sqlstore tests on every PR (run 35283849584, 2026-09-17).
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        env:
          PGPASSWORD: postgres
        run: bash scripts/ci-postgres-service.sh provision
      - name: one shard of the Go suite, without the race detector
        timeout-minutes: 55
        env:
          OLIVARES_TEST_SHARD: ${{ matrix.shard }}
        run: task test:functional:shard

  # FIXED IDENTITY-SECURITY CASES, AND ONLY THE ONES A REGISTRY NAMES. Per registered family
  # (today only `workspace`) the runner executes a declared clean selection, a race selection, and
  # every production mutant three times: before, mutated and restored.
  # ci/iam-qualification/<family>.json declares each test leaf, allowed skip, mutant patch,
  # expected failing assertion, pinned input digest and phase ceiling before anything runs.
  # The runner takes no package, command, patch or ref from a caller, and an unregistered
  # family is neither run nor reported as qualified.
  #
  # The workspace phase ceilings total 330 minutes. The 335-minute step keeps the runner's fixed
  # per-family bound (330 minutes of phases plus setup) inside the 360-minute job. These are
  # ceilings, not measured durations.
  pr-iam-qualification:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        family: [workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
      postgres_other:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 10
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: go.work.sum
      - name: executable temporary directory
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/exec"
          echo "TMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/exec" >> "$GITHUB_ENV"
      - name: resolve owned PostgreSQL services
        timeout-minutes: 1
        env:
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
          PGPORT_OTHER: ${{ job.services.postgres_other.ports['5432'] }}
        run: bash scripts/ci-postgres-service.sh resolve
      - name: provision isolated PostgreSQL roles
        timeout-minutes: 5
        env:
          PGPASSWORD: postgres
        run: bash scripts/ci-postgres-service.sh provision
      - name: clean, race, fixed mutants and restored controls
        timeout-minutes: 335
        env:
          IAM_FAMILY: ${{ matrix.family }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/ci-iam-qualification.py "$IAM_FAMILY"
      - name: preserve partial or complete qualification evidence
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iam-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iam-qualification-${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 14

  # ⛔ THE ONE NAME THE BRANCH PROTECTION ASKS FOR, AND IT MUST BE ABLE TO SAY NO.
  # A matrix job does not report under its job id: it reports `pr-test-shard (a)`,
  # `pr-test-shard (b)`, one context per value, and the set changes whenever the shard
  # list changes. A required context that names a job id nothing publishes waits for a
  # status that never arrives, which is how the public profile was unsatisfiable before
  # 2026-08-27. So the required name stays `pr-test` and this job is what carries it.
  #
  # `always()` is not decoration. Without it, a failed shard SKIPS this job — and a
  # skipped job SATISFIES a required check, so the red would land as green. With it, the
  # job runs whatever the shards did and the step below turns their results into a
  # verdict. `needs.<job>.result` for a matrix job is the aggregate of every value:
  # `success` only when every shard succeeded, and `fail-fast: false` does not soften
  # that — it stops the siblings from being cancelled and folds their verdicts in all the
  # same.
  pr-test:
    needs: [pr-test-shard, pr-iam-qualification]
    if: always() && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard of the functional suite and every registered IAM family must have succeeded
        timeout-minutes: 4
        env:
          RESULT: ${{ needs.pr-test-shard.result }}
          IAM_RESULT: ${{ needs.pr-iam-qualification.result }}
        run: |
          echo "pr-iam-qualification result: $IAM_RESULT"
          # The same rule as the shards below: only `success` passes. Only the `workspace` family is
          # registered, so this verdict says nothing about any other identity family.
          case "$IAM_RESULT" in
            success)
              echo "the registered IAM qualification family (workspace) passed." ;;
            "")
              echo "::error::pr-iam-qualification reported NO result at all — the job id does not exist in this workflow, so no fixed identity case ran."
              exit 1 ;;
            *)
              echo "::error::pr-iam-qualification did not succeed ($IAM_RESULT). A skipped or cancelled qualification carries no verdict; open the job and its iam-workspace artifact."
              exit 1 ;;
          esac
          echo "pr-test-shard result: $RESULT"
          # AN EMPTY RESULT IS THE `missing` CASE AND IT IS RED. The expression expands to
          # the empty string when the job id does not exist — a rename, a deletion, a bad
          # merge — and an empty string matching no arm would fall through a `case` with no
          # default. It has one, and this names the state instead of inheriting it.
          case "$RESULT" in
            success)
              echo "every shard of the functional suite passed." ;;
            "")
              echo "::error::pr-test-shard reported NO result at all — the job id does not exist in this workflow, so nothing ran the functional suite."
              exit 1 ;;
            skipped)
              echo "::error::pr-test-shard was SKIPPED, so this pull request carries NO functional verdict. A green check that quietly stopped checking is worse than no check."
              exit 1 ;;
            cancelled)
              echo "::error::pr-test-shard was CANCELLED (a newer push superseded this run), so this run carries no functional verdict — read it off the run that replaced it."
              exit 1 ;;
            *)
              echo "::error::pr-test-shard did not succeed ($RESULT) — open the shard jobs to see which packages failed."
              exit 1 ;;
          esac

  pr-web:
    if: github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NODE FIRST: pnpm/action-setup installs pnpm THROUGH npm, so it needs a node on PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          standalone: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        run: |
          # ⛔ LA GUARDA DE ABAJO YA ESTABA; FALTABAN LAS DOS QUE EVITAN EL FALLO EN VEZ DE
          # NOMBRARLO. La guarda dice que `task` no se alcanza; `GOBIN` explicito y su `bin` en el
          # PATH hacen que se alcance. En un runner auto-alojado PERSISTENTE, `go install` honra un
          # GOBIN que venga del entorno del servicio POR ENCIMA de $GOPATH/bin y deja el binario
          # fuera del PATH del job — sin fallar, porque instalar si instalo (medido en
          # `ci-runner-3` el 2026-08-29, corrida 33278242758).
          export GOBIN="$RUNNER_TEMP/gopath/bin"
          echo "GOBIN=$GOBIN" >> "$GITHUB_ENV"
          echo "$GOBIN" >> "$GITHUB_PATH"
          export PATH="$GOBIN:$PATH"
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          command -v task || { echo "::error::go install reported OK and task is not on PATH"; exit 1; }
      - name: the console checks, and the embedded bundle matches its sources
        run: task check:web web:check
