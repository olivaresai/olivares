name: secrets-weekly
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  secrets:
    runs-on: ${{ vars.CI_RUNNER_SECRETS || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 92
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/olivares-tool-cache
        timeout-minutes: 5
        with:
          gitleaks: "true"
      - name: scan full HEAD history
        timeout-minutes: 82
        env:
          OLIVARES_SECRETS_SCOPE: head
          GOMAXPROCS: '4'
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 80m bash scripts/check-secrets.sh
          rc=$?
          set -e
          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo "check-secrets: 2 UNVERIFIED — the secrets scan does not fit in 80 min."
            exit 2
          fi
          exit "$rc"
