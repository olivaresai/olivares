#
# appliance-selinux — builds and checks the appliance's SELinux policy module (appliance/selinux) on Fedora 44, the
# base the appliance image uses, in a container pinned by digest with the selinux-policy version the image recipe
# pins. In order: the unit tests of the generator, the spec and the comparison; the committed module against the
# generator's output; the module and its declarations alone compiled with Fedora's policy Makefile and converted to
# CIL; SELint; the compiled rules compared with the rows, and a negative control in which one extra allow must fail
# that comparison; the olivares-selinux package built from its spec, installed into the container's policy store
# (no policy is loaded in a container: the module is written at priority 200 and the port records are written
# without a reload), the installed policy checked row by row and against denied.tsv, a per-domain sesearch listing
# kept as evidence; and the package erased, with its port records and module gone.
#
# It compiles and inspects policy; it boots nothing. Whether the appliance runs AVC-free under enforcing is measured
# on the real image, not here. Step durations are not measured yet: this is the workflow's first version.
name: appliance-selinux

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - appliance/selinux/**
      - .github/workflows/appliance-selinux.yml
  push:
    branches: [main]
    paths:
      - appliance/selinux/**
      - .github/workflows/appliance-selinux.yml

permissions:
  contents: read

concurrency:
  group: appliance-selinux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The selinux-policy the image recipe pins (selinux-policy-targeted 44.10-1.fc44, by its signed Koji build and
  # sha256); the base and devel packages of the same build are pinned the same way, because Fedora's updates repository
  # keeps only the newest build.
  SELINUX_POLICY_KOJI: https://kojipkgs.fedoraproject.org/packages/selinux-policy/44.10/1.fc44/data/signed/6d9f90a6/noarch

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # registry.fedoraproject.org/fedora:44, linux/amd64, the digest the image recipe's builder pins.
      image: registry.fedoraproject.org/fedora:44@sha256:111c574c9647d837ae22edf3204b670d5a151bcbb1cf2d13928c215b8e6488c4
    steps:
      - name: install the pinned SELinux toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail
          command -v curl >/dev/null || dnf -y install curl
          pins="$RUNNER_TEMP/pins"
          mkdir -p "$pins"
          while read -r sha rpm; do
            curl -fsSL --retry 3 -o "$pins/$rpm" "$SELINUX_POLICY_KOJI/$rpm"
            echo "$sha  $pins/$rpm" | sha256sum -c -
          done <<'PINS'
          dd86ac4b3e3e82bf1881eb306af6f0a2fdb9c11e17933d56263e04a6504cdb8a selinux-policy-44.10-1.fc44.noarch.rpm
          a3fcaf43c0d5ff344daabb9d905d53607898ac9491c6542abdcb2a693d8e1615 selinux-policy-targeted-44.10-1.fc44.noarch.rpm
          42c3c0840cd5a4644edfedb54db5eabf8e0262c2b8de9002919694567c0fb4c9 selinux-policy-devel-44.10-1.fc44.noarch.rpm
          PINS
          dnf -y --setopt=install_weak_deps=False install "$pins"/selinux-policy-*.rpm \
            policycoreutils policycoreutils-python-utils setools-console selint rpm-build dnf5-plugins git-core \
            python3 make bzip2
          # The toolchain around the pinned policy comes from Fedora 44's repositories; its versions are recorded here.
          rpm -q selinux-policy selinux-policy-targeted selinux-policy-devel policycoreutils policycoreutils-python-utils \
            setools-console selint rpm-build
          grep -x 'SELINUXTYPE=targeted' /etc/selinux/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unit tests of the generator, the spec and the comparison
        run: python3 -m unittest discover -s appliance/selinux -p 'test_*.py' -v
      - name: the committed module is the generator's output
        run: python3 appliance/selinux/generate.py --check
      - name: compile the module and its declarations alone, and convert both to CIL
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selinux"
          mkdir -p "$work/module" "$work/baseline"
          cp appliance/selinux/olivares.te appliance/selinux/olivares.fc appliance/selinux/olivares.if "$work/module/"
          python3 appliance/selinux/generate.py --declarations-only --out "$work/baseline"
          for dir in "$work/module" "$work/baseline"; do
            make -C "$dir" NAME=targeted -f /usr/share/selinux/devel/Makefile olivares.pp
            /usr/libexec/selinux/hll/pp "$dir/olivares.pp" "$dir/olivares.cil"
          done
          echo "WORK=$work" >>"$GITHUB_ENV"
      - name: SELint
        run: |
          set -euo pipefail
          selint --version
          selint --context=/usr/share/selinux/devel/include --level=W --summary --fail \
            appliance/selinux/olivares.te appliance/selinux/olivares.if appliance/selinux/olivares.fc
      - name: the compiled module holds exactly the rows
        run: python3 appliance/selinux/compare_rules.py cil --module "$WORK/module/olivares.cil" --baseline "$WORK/baseline/olivares.cil"
      - name: negative control, one extra allow fails the comparison
        run: |
          set -euo pipefail
          neg="$WORK/negative"
          mkdir -p "$neg"
          cp appliance/selinux/olivares.te appliance/selinux/olivares.fc appliance/selinux/olivares.if "$neg/"
          # etc_t and file read are already required by the module; no row lets the console read an etc_t file.
          printf '\n# negative control: an allow no row asks for\nallow olivares_portal_t etc_t:file read;\n' >>"$neg/olivares.te"
          make -C "$neg" NAME=targeted -f /usr/share/selinux/devel/Makefile olivares.pp
          /usr/libexec/selinux/hll/pp "$neg/olivares.pp" "$neg/olivares.cil"
          rc=0
          out=$(python3 appliance/selinux/compare_rules.py cil --module "$neg/olivares.cil" --baseline "$WORK/baseline/olivares.cil") || rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 1 ] || ! grep -qF 'in the module but in no row: allow olivares_portal_t etc_t:file read' <<<"$out"; then
            echo "::error::the comparison did not refuse a module with one extra allow (exit $rc)"
            exit 1
          fi
      - name: build the olivares-selinux package
        run: |
          set -euo pipefail
          dnf -y builddep appliance/selinux/olivares-selinux.spec
          rpmbuild -bb --define "_topdir $WORK/rpmbuild" --define "_sourcedir $PWD/appliance/selinux" \
            appliance/selinux/olivares-selinux.spec
          rpm -qlp "$WORK"/rpmbuild/RPMS/noarch/olivares-selinux-*.rpm
          rpm -qp --scripts "$WORK"/rpmbuild/RPMS/noarch/olivares-selinux-*.rpm
      - name: install the package into the container's policy store
        run: |
          set -euo pipefail
          dnf -y install "$WORK"/rpmbuild/RPMS/noarch/olivares-selinux-*.rpm
          semodule -lfull | tee "$WORK/modules.txt"
          grep -Eq '^200 olivares[[:space:]]' "$WORK/modules.txt"
          semanage port -l -C | tee "$WORK/ports.txt"
          for want in 'olivares_console_port_t tcp 8443' 'olivares_grpc_port_t tcp 8444' \
            'olivares_portal_port_t tcp 9443' 'olivares_model_runtime_port_t tcp 11434'; do
            read -r type proto port <<<"$want"
            if ! grep -Eq "^${type}[[:space:]]+${proto}[[:space:]]+${port}[[:space:]]*\$" "$WORK/ports.txt"; then
              echo "::error::no port record $want after installation"
              exit 1
            fi
          done
      - name: the installed policy grants every row and none of denied.tsv
        run: |
          set -euo pipefail
          policy=$(find /etc/selinux/targeted/policy -name 'policy.*' | sort -V | tail -n 1)
          python3 appliance/selinux/compare_rules.py policy --policy "$policy"
          for domain in olivares_portal_t olivares_repair_console_t olivares_helper_power_t olivares_helper_bundle_t \
            olivares_snapshotcore_t olivares_firstboot_t olivares_t olivares_cli_t olivares_net_guard_t \
            olivares_helper_netrestore_t olivares_helper_netprobe_t; do
            echo "== sesearch -A -ds -s $domain"
            sesearch -A -ds -s "$domain" "$policy" | tee -a "$WORK/sesearch.txt"
          done
          echo "== sesearch -T -s unconfined_t -t olivares_cli_exec_t -c process"
          sesearch -T -s unconfined_t -t olivares_cli_exec_t -c process "$policy" | tee "$WORK/cli-entry.txt" \
            | tee -a "$WORK/sesearch.txt"
          test "$(grep -c . "$WORK/cli-entry.txt")" -eq 1
          grep -qxE '\s*type_transition unconfined_t olivares_cli_exec_t:process olivares_cli_t;\s*' "$WORK/cli-entry.txt"
      - name: erase the package
        run: |
          set -euo pipefail
          dnf -y remove olivares-selinux
          if semanage port -l -C | grep -q 'olivares_'; then
            echo "::error::a port record survived the erase"
            exit 1
          fi
          if semodule -l | grep -Eq '^olivares([[:space:]]|$)'; then
            echo "::error::the module survived the erase"
            exit 1
          fi
      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appliance-selinux-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/module/olivares.cil
            ${{ env.WORK }}/baseline/olivares.cil
            ${{ env.WORK }}/rpmbuild/RPMS/noarch/*.rpm
            ${{ env.WORK }}/*.txt
          if-no-files-found: warn
          retention-days: 14
