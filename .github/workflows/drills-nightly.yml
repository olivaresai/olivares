#
# Drills-nightly. The DR and PSIRT runbooks are only trustworthy if their
# happy paths are exercised on a cadence — `task dr:drill` (DR-RUNBOOK.md §8) and
# `task security:drill` (PSIRT-RUNBOOK.md §7) are CI-safe round trips that touch no
# real data, yet NO workflow ran them: they were green in local dev and nowhere else.
# A broken drill means the documented recovery/advisory path is broken, so a non-zero
# exit here is an OPERATIONAL INCIDENT and opens a tracking issue.
#
# Both drills run even if the first fails (independent steps capturing their own exit
# code), so one incident never masks the other. The tracking issue is deduplicated
# PER DRILL by a stable title: while an issue for `dr`/`security` stays open, later
# nightly failures append a comment instead of spawning a new issue every night;
# distinct drills get distinct issues; close the issue once the drill is green again.
#
# POSIX cron, UTC. Nightly 04:00 UTC — ahead of the weekly Scorecard/patch-velocity
# cadence so a fresh drill signal is available each morning.
name: drills-nightly

on:
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drills:
    # Scheduled runs only where the repository opts in with CI_NIGHTLIES=true. The public
    # repository changes only at a release, so a schedule there re-tests unchanged code
    # (manual `gh workflow run <file>` always works).
    if: github.event_name == 'workflow_dispatch' || vars.CI_NIGHTLIES == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 20 -> 40: el paseo de consola añade un build de Go, la instalación de chromium y 55
    # pantallas contra un motor vivo. Un límite que corta a mitad no da «hallazgos», da un
    # nocturno rojo que nadie sabe leer.
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write # open/update the drill-failure tracking issue
    services:
      # The PostgreSQL server the DR drill restores into (a throwaway database with
      # its own roles, removed afterwards). Same digest the pg-majors matrix pins.
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 30s --health-start-period 60s --health-start-interval 1s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          standalone: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      # Each drill runs in its own step and never aborts the job on failure, so a DR
      # incident does not hide a PSIRT incident (and vice versa). pipefail makes the
      # task exit code — not tee's — decide `failed`.
      - name: resolve the PostgreSQL service port into the scratch DSN
        env:
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
        run: bash scripts/ci-postgres-service.sh resolve
      - name: DR round-trip drill (task dr:drill)
        id: dr
        env:
          # The drill also runs on PostgreSQL and prints its RTO next to the SQLite one.
          DR_DRILL_SCRATCH_DSN: env:OLIVARES_TEST_POSTGRES_SUPERUSER_DSN
        run: |
          set -uo pipefail
          if task dr:drill 2>&1 | tee "$RUNNER_TEMP/drill-dr.log"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ⛔ THE QUICKSTART IS A DRILL TOO, AND ITS CLAIM WAS THE UNTRUE ONE.
      # The seven READMEs we publish say "CI walks the same path: `task smoke:quickstart` boots
      # this demo estate against the real binary and asserts its access-map and drift counts".
      # It was wired into mainline-ci — which is `on: workflow_dispatch` and nothing else, so a
      # human has to press a button for it to happen. That is not what "CI walks the same path"
      # says to a reader, and this file's own header names exactly that defect for the other two
      # drills: "green in local dev and nowhere else".
      #
      # A nightly is the honest cadence: the numbers are asserted every day without spending a
      # runner on every push, which is why mainline-ci is dispatch-only in the first place.
      - name: quickstart contract drill (task smoke:quickstart)
        id: quickstart
        run: |
          set -uo pipefail
          if task smoke:quickstart 2>&1 | tee "$RUNNER_TEMP/drill-quickstart.log"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ⛔ EL PASEO DE CONSOLA NO TENÍA LLAMANTE (C15-P9), y es el ÚNICO instrumento del
      # repositorio que abre un navegador de verdad contra un motor de verdad. `test:web` corre
      # la consola contra mocks y `web:check` sólo prueba que el bundle commiteado casa con sus
      # fuentes: un cliente TIPADO llamando a un endpoint que el motor NUNCA registra es
      # invisible para los dos —la consola pregunta, el motor contesta 404, y todo el unitario
      # sigue verde porque el mock contestó—. Sin llamante, ese hueco lo cubría que alguien se
      # acordara.
      #
      # Un nocturno es la cadencia honesta, por lo mismo que el quickstart: necesita un motor
      # arrancado y un navegador, y no cabe en un lint rápido.
      #
      # ⚠ LA SECUENCIA DE ABAJO ESTÁ TRANSCRITA DE UNA CORRIDA REAL, no compuesta a partir de la
      # documentación: el 2026-08-18 se arrancó el binario en 127.0.0.1:18080, se tomó el token
      # de un solo uso de su propia salida y se pasearon **55 pantallas con 0 hallazgos**. Un
      # trabajo de CI que nadie ha visto correr es exactamente lo que esta jornada ha estado
      # corrigiendo en otros sitios.
      #
      # ⛔ `task -x`, NO `task`: medido el 2026-08-07, `task` a secas aplasta TODO código de
      # fallo a 201, lo que funde «encontré defectos» (1) con «no he podido mirar» (2) — la única
      # distinción para la que este instrumento existe. Con `-x` pasan 1→1 y 2→2, y por eso el
      # veredicto de abajo separa los dos.
      - name: console walk against a live engine (task -x console:walk)
        # ⚠ SIN MEDIDA: este workflow sale `skipped` en las cinco ultimas corridas, asi que no hay
        # duracion de la que leerlo. Se guarda el paso que MAS puede colgarse —el unico que conduce un
        # navegador contra un motor vivo— y el numero se declara como cota, no como medida. Cuando
        # corra de verdad, releelo con `task ci:timeout-headroom --fetch` y ajustalo.
        timeout-minutes: 20
        id: walk
        run: |
          set -uo pipefail
          # The browser and JavaScript driver must come from the same locked web
          # dependency. A root npx download leaves the walk unable to load its driver.
          # Self-hosted images must supply system libraries; the runner has no sudo.
          deps=()
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            deps=(--with-deps)
          fi
          if ! { task build:web &&
            pnpm --dir web exec playwright install "${deps[@]}" chromium &&
            go build -o "$RUNNER_TEMP/olivares" ./cmd/olivares;
          } 2>&1 | tee "$RUNNER_TEMP/drill-console-walk.log"; then
            echo "::error::console-walk: console, browser, or engine build failed; nothing was measured."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/walk-estate"
          (cd "$RUNNER_TEMP/walk-estate" && exec env OLIVARES_DATA_DIR="$RUNNER_TEMP/walk-estate" \
            "$RUNNER_TEMP/olivares" quickstart --listen 127.0.0.1:18080 \
            > "$RUNNER_TEMP/walk-engine.log" 2>&1) &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true; wait "$engine_pid" 2>/dev/null || true' EXIT
          # El motor imprime su token de un solo uso al arrancar; se espera a que aparezca en vez
          # de dormir a ciegas — un sleep fijo convierte una caja lenta en un falso «no he podido
          # mirar».
          # An engine that exits (a busy port, the regression) ends the wait at once, and a missing
          # token reaches the report below with the engine's own error instead of ending the
          # step under bash -e and pipefail.
          for _ in $(seq 1 60); do
            grep -qoE 'olst_[A-Z0-9]+' "$RUNNER_TEMP/walk-engine.log" && break
            kill -0 "$engine_pid" 2>/dev/null || break
            sleep 2
          done
          TOK="$(grep -oE 'olst_[A-Z0-9]+' "$RUNNER_TEMP/walk-engine.log" | head -1 || true)"
          if [ -z "$TOK" ]; then
            echo "::error::console-walk: the engine did not print a first-start token; the check cannot run without it."
            sed -n '1,40p' "$RUNNER_TEMP/walk-engine.log"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # GitHub invokes bash with -e. Guard the pipeline so result 1 or 2
          # reaches classification instead of aborting this and the remaining drills.
          if OLIVARES_WALK_BASE=https://127.0.0.1:18080 OLIVARES_WALK_TOKEN="$TOK" \
            task -x console:walk 2>&1 | tee -a "$RUNNER_TEMP/drill-console-walk.log"; then
            rc=0
          else
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "::error::console-walk: could not retain the walk log."
              rc=2
            fi
          fi
          # 0 limpio · 1 hallazgos · 2 no he podido mirar. Los dos últimos abren incidencia: un
          # paseo que no pudo mirar NO es un paseo limpio, y ésa es la razón de usar `-x`.
          if [ "$rc" -eq 0 ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "console-walk exited $rc (1 findings; 2 unable to check)"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PSIRT advisory-pipeline drill (task security:drill)
        id: sec
        run: |
          set -uo pipefail
          if task security:drill 2>&1 | tee "$RUNNER_TEMP/drill-security.log"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # Open (or update) one tracking issue PER failing drill, deduplicated by an
      # exact stable title so recurring failures append rather than multiply.
      - name: open/update tracking issue on any drill failure
        if: vars.CI_NIGHTLIES == 'true' && (steps.dr.outputs.failed == 'true' || steps.sec.outputs.failed == 'true' || steps.quickstart.outputs.failed == 'true' || steps.walk.outputs.failed == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DR_FAILED: ${{ steps.dr.outputs.failed }}
          SEC_FAILED: ${{ steps.sec.outputs.failed }}
          QUICKSTART_FAILED: ${{ steps.quickstart.outputs.failed }}
          WALK_FAILED: ${{ steps.walk.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The dev runners have no gh CLI (exit 127 on 2026-10-30), so the REST API is
          # called with curl and python3. The token stays in a 0600 header file, never argv.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="$RUNNER_TEMP/drill-api-auth"
          (umask 077 && printf 'Authorization: Bearer %s\n' "$GH_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          api_post() {
            curl -fsS -X POST -H "@$auth" -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' --data-binary @- "$1" >/dev/null
          }
          find_open_issue() {
            curl -fsS -H "@$auth" -H 'Accept: application/vnd.github+json' \
              "$api/issues?labels=drills-nightly&state=open&per_page=100" \
              | python3 -c 'import json,sys; t=sys.argv[1]; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == t and "pull_request" not in i), ""))' "$1"
          }
          # printf (not a heredoc) builds the body so YAML block-scalar indentation
          # can never swallow a heredoc terminator; the backticks are literal.
          open_or_update() {
            local key="$1" desc="$2" log="$3"
            local title="drills-nightly: ${key} drill failed"
            local tail_log body existing
            tail_log="$(tail -40 "$log" 2>/dev/null || printf '(no log captured)')"
            # shellcheck disable=SC2016 # Backticks are literal Markdown in the issue body.
            body="$(printf '%s\n\n- Run: %s\n- Commit: `%s`\n\nLast 40 lines of drill output:\n\n```\n%s\n```\n\n_%s_\n' \
              "The nightly **${desc}** FAILED — a broken drill means the documented runbook path is broken (operational incident)." \
              "${RUN_URL}" "${COMMIT_SHA}" "${tail_log}" \
              "This issue is auto-deduplicated: while it stays open, subsequent nightly failures of this same drill append a comment instead of opening a new issue. Close it once the drill is green again.")"
            existing="$(find_open_issue "$title")"
            if [ -n "$existing" ]; then
              python3 -c 'import json,sys; print(json.dumps({"body": sys.stdin.read()}))' <<<"$body" \
                | api_post "$api/issues/$existing/comments"
            else
              python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "labels": ["drills-nightly"], "body": sys.stdin.read()}))' "$title" <<<"$body" \
                | api_post "$api/issues" \
                || python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "body": sys.stdin.read()}))' "$title" <<<"$body" \
                  | api_post "$api/issues"
            fi
          }
          if [ "${DR_FAILED}" = "true" ]; then
            open_or_update "dr" "Disaster-recovery drill (task dr:drill, DR-RUNBOOK.md §8)" "$RUNNER_TEMP/drill-dr.log"
          fi
          if [ "${SEC_FAILED}" = "true" ]; then
            open_or_update "security" "PSIRT advisory-pipeline drill (task security:drill, PSIRT-RUNBOOK.md §7)" "$RUNNER_TEMP/drill-security.log"
          fi
          if [ "${QUICKSTART_FAILED}" = "true" ]; then
            open_or_update "quickstart" "Quickstart contract drill (task smoke:quickstart, the numbers the seven READMEs publish)" "$RUNNER_TEMP/drill-quickstart.log"
          fi
          if [ "${WALK_FAILED}" = "true" ]; then
            open_or_update "console-walk" "Console walk against a live engine (task -x console:walk, 55 screens)" "$RUNNER_TEMP/drill-console-walk.log"
          fi

      # Keep the run RED when any drill failed, after the issue is filed.
      - name: fail the run if any drill failed
        if: steps.dr.outputs.failed == 'true' || steps.sec.outputs.failed == 'true' || steps.quickstart.outputs.failed == 'true' || steps.walk.outputs.failed == 'true'
        run: |
          echo "::error::a nightly drill failed — see the tracking issue(s)"
          exit 1

  # Point-in-time recovery on every supported PostgreSQL major (docs/DR-RUNBOOK.md
  # §6-7). The PITR path (WAL archiving, pg_basebackup, recovery to an instant, then
  # `dr restore` of the companion) is the near-zero-RPO tier the runbook promises, and
  # it was exercised nowhere. The test starts its own server per major from the
  # server binaries, so this job installs them and starts no service container.
  pitr:
    if: github.event_name == 'workflow_dispatch' || vars.CI_NIGHTLIES == 'true'
    runs-on: ${{ vars.CI_RUNNER_DB || vars.CI_RUNNER || 'ubuntu-latest' }}
    # Bound, not measured: four majors, each an initdb, a seeded estate, a base backup,
    # a WAL replay and two engine boots. Re-read it from a real run.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: install go-task (pinned)
        uses: ./.github/actions/olivares-tool-cache
      # task dr:pitr FAILS, not skips, when a major is missing.
      - name: install the PostgreSQL 15-18 server binaries
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          # The packages would create and start a cluster per major; the test starts its own.
          sudo sed -i 's/^#\?create_main_cluster.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-15 postgresql-16 postgresql-17 postgresql-18
      # Self-hosted runners have no PostgreSQL 15-18 under /usr/lib/postgresql and no sudo to add them.
      # The helper unpacks the pinned PGDG packages into this job's scratch (the bsdtar pattern) and
      # prints the two lines the drill needs; they reach the next step through $GITHUB_ENV.
      - name: provide the PostgreSQL 15-18 server binaries (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          set -euo pipefail
          bash scripts/ensure-pitr-pg-binaries.sh --dest "$RUNNER_TEMP/pitr-pg" >> "$GITHUB_ENV"
      - name: point-in-time recovery drill (task dr:pitr)
        # The four tests ran in about 8 minutes on one build host; the step bound keeps
        # the job's failure reporter alive if one wedges.
        timeout-minutes: 50
        run: task dr:pitr

  report-pitr-failure:
    needs: pitr
    if: always() && needs.pitr.result == 'failure' && github.event_name == 'schedule' && vars.CI_NIGHTLIES == 'true'
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: failure telemetry (scheduled runs have no PR to report to)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # No gh CLI on the dev runners (exit 127 on 2026-10-30): REST via curl, token in a 0600 header file.
          auth="$RUNNER_TEMP/pitr-api-auth"
          (umask 077 && printf 'Authorization: Bearer %s\n' "$GH_TOKEN" > "$auth")
          trap 'rm -f "$auth"' EXIT
          python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "labels": ["drills-nightly"], "body": sys.argv[2]}))' \
            "drills-nightly: PostgreSQL point-in-time recovery drill failed ($(date -u +%F))" \
            "Run: ${RUN_URL}. A broken PITR drill means the documented near-zero-RPO recovery path is broken (docs/DR-RUNBOOK.md §6-7)." \
            | curl -fsS -X POST -H "@$auth" -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' --data-binary @- \
              "https://api.github.com/repos/${GH_REPO}/issues" >/dev/null
