#
# mainline-20b3-observe-context — the accepted context instrument (mainline-20b3-context, sha256
# 3279bb41…, measured in run 35946931349) plus ONE variable, for two test failures retained from ONE
# exact commit, 20b3d0b1c632e8d4bef7b4ce15f4960293cc6e86. DIAGNOSTIC ONLY: it runs from the branch
# diag/mainline-20b3-observe-context, which adds this one file and is never merged. It mocks nothing,
# weakens no assertion and changes no product byte.
#
# THE ONE VARIABLE is the evidence-only observation. After identity proves the pristine tree, one
# step applies two pinned test-only patches (OBS_PATCH_A / OBS_PATCH_B: sha256 and resulting blobs
# pinned; any drift is an inability for the arm). Their OUTPUT is failure-only: A reads which ladder
# attempt holds the extra grant, inside the failure branch before the unchanged t.Fatalf (prefix
# REPRO_OBS_A); B snapshots the advisory rows once, after the unchanged count, predicate and t.Errorf
# (prefix REPRO_OBS_B). Patch A's attempt custody (the subject local and one slice append per ladder
# attempt) runs on EVERY iteration, green ones included. A passing arm is therefore predicted, not
# measured, to behave as in the context run.
# Line map of the patched files (message text unchanged): a named :677 -> :681, witness :688 -> :692,
# observation :680; b named :337 -> :338, witness :318 -> :319, observation :338.
#
# The execution context, inherited unchanged: ONCE per arm, the complete original command that went
# red, with the same source, clocks, flags, race mode, PostgreSQL services, roles and pins. It has no
# trials loop, no retry and no narrowing:
#   a  the control-plane functional leg for the cmd/olivares module, with no -run filter:
#      scripts/with-pg-env.sh scripts/go-work-each.sh go test -count=1 -timeout 45m ./...
#      (Taskfile test:functional), restricted to that module by the helper's own GO_WORK_EACH_ONLY.
#      Every package of the module runs, concurrently, as it did. -json is the one added flag (output
#      format only), so every test result keeps its name. Origin: step 120 min, job 320 min, 45m per
#      binary.
#   b  race-core partition 3 of 4, exactly as the shard ran it:
#      scripts/with-pg-env.sh scripts/core-race-partition.sh go test -race -count=1 -p 1 -timeout 90m
#      (Taskfile test:race-hot:core) with OLIVARES_CORE_RACE_PARTITION=3 and _PARTITIONS=4. The
#      sqlstore entry shard therefore uses its own 317-entry -run selector, followed by the 15 other
#      packages of the partition. The helpers accept no output flag, so the chain runs byte for byte
#      and its own -v stream is converted to events afterwards. Origin: step 180 min, job 190 min,
#      90m per binary.
#   Excluded, stated rather than implied: the jobs' earlier lint and build steps and the other
#   workspace modules, all of which ran before these tests and never alongside them.
#
# ATTRIBUTION (binding). Every test result keeps its own name: the whole stream is kept, and
# results.tsv lists every test. The arm verdict (target.tsv, verdicts.tsv) speaks ONLY about the
# named target symptom:
#   1  the named assertion failed with the target test (a: communicationchannelhistorywrites_http_test.go:681
#      "a committed grant at budget"; b: drdestinationauthority_pg_test.go:338 "advisory holders/waiters
#      leaked" in TestDRDestinationHolderLossCannotCommit/after_DDL). An observation line is never
#      counted as the named line.
#   0  the target test passed, with its witness line.
#   2  INABILITY for the target, when the target could not be measured: the process ended outside
#      exit 0/1; the target package did not build; the Go timeout fired in the target package before
#      the target completed; the target skipped, or has no result; the target failed at another
#      assertion; a target observation line off its exact file:line or beside a passing target; an
#      observation line with no failure to belong to (a passing, skipped or unfinished test, a
#      failing ancestor, or no test at all). An observation line belongs to the test whose output
#      carries it: one inside another failing test is that test's evidence (its other_failures.tsv
#      note and <arm>.observations.tsv) and never changes the target verdict. The target's own lines
#      are in <arm>.observation.txt and summarised in target.tsv (observation_summary); no
#      observation line ever decides a 1.
# ANY OTHER failing test, and any data race report, cluster-state line or timeout elsewhere, is written
# SEPARATELY to other_failures.tsv (kind, package, test, first and last file:line line). It is its own
# observation: never attributed to the target, never hidden, and it never turns the verdict into 1. It
# makes the verdict 2 only when it kept the target from completing. A single run proves nothing
# about the rate: a 0 does not close an intermittent failure, and a 1 is one observation.
name: mainline-20b3-observe-context

# Triggers. workflow_dispatch chooses the arms, and its sha must be the bound source. The push trigger is
# scoped to the one diagnostic branch that carries this file; a push run measures both arms.
on:
  push:
    branches:
      - diag/mainline-20b3-observe-context
  workflow_dispatch:
    inputs:
      sha:
        description: The bound source. Only 20b3d0b1c632e8d4bef7b4ce15f4960293cc6e86 is accepted; any other value is refused before checkout.
        required: true
        default: 20b3d0b1c632e8d4bef7b4ce15f4960293cc6e86
        type: string
      arms:
        description: Which arms to run, once each.
        required: true
        default: both
        type: choice
        options:
          - both
          - a
          - b

permissions:
  contents: read

# One run per dispatch; a running measurement is never cancelled, because a cancelled run carries
# no verdict at all.
concurrency:
  group: mainline-20b3-observe-context-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PINNED_SHA: 20b3d0b1c632e8d4bef7b4ce15f4960293cc6e86
  PINNED_FUNCTIONAL_TEST: cmd/olivares/communicationchannelhistorywrites_http_test.go
