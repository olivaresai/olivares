      # Hacia `git remote prune origin` y publicaba un antes/despues. La justificaba la incidencia
      # #1499 (2026-08-21): gitleaks recorrio 9 264 commits, 1 590 ajenos a este ref (17,2 %), y ese
      # residuo fue el ORIGEN de un hallazgo «NOT reachable from HEAD» que acuso a una rama que nunca
      # lo llevo. Las tres razones por las que se va, cada una con su medida:
      #
      # 1. NUNCA PODO — NACIO ROTA, no se rompio despues. El checkout de arriba usa
      #    `persist-credentials: false` —correcto en un clon persistente— y ya estaba puesto cuando
      #    el paso se creo (d07d34f28, 2026-08-21). Sin credencial, `git remote prune origin` muere
      #    con `fatal: could not read Username for 'https://github.com'` y el `|| true` se lo tragaba.
      #    Ocho corridas de main medidas por su log, del 26-08 al 03-09: el fatal aparece en LAS OCHO
      #    y todas dicen «podadas: 0» —519, 552, 562, 593, 596, 596, 642, 626 refs—, con los refs
      #    creciendo y sin que las duraciones del job (70,4 · 87,2 · 59,9 · 68,3 · 72,2 min) se
      #    degradaran con ellos. Devolverle credencial a un runner persistente cuesta superficie de
      #    seguridad para ganar 11 refs: el remoto tiene 615 ramas vivas y el runner tenia 626.
      #
