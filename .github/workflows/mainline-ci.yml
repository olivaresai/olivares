        # sobre lo medido y queda MUY por debajo del techo de job (90), que es el punto: un techo de
        # job cancela los pasos que quedan y el reportero no publica. Aqui el que muerde reporta.
        # ⛔ 82 = 80 (reloj interior) + 1 (--kill-after=60s) + 1 de margen. CONTRA QUE SE COMPARA:
        # contra el `timeout --signal=TERM --kill-after=60s 80m` de este mismo paso, NO contra lo que
        # tarda el barrido. Con 60 el que mordia era GitHub y el paso moria MUDO; con 82 muerde el
        # reloj interior y el guion llega a decir «2 · NO PUDE MIRAR: el barrido no cabe». Cabe bajo
        # The scan keeps 82 minutes within the job's 112-minute declared step budget.
        timeout-minutes: 82
        id: gitleaks
