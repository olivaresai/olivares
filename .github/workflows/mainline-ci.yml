    # Y lo que NO era la causa, medido antes de tocar nada para no perseguir la mitad
    # equivocada: la deuda de ramas. Hay 409 ramas en origin y 80 estan totalmente fusionadas
    # en `main`, pero esas 80 aportan CERO commits que main no tenga —son ancestros suyos— y
    # el barrido deduplica por commit. Borrarlas habria sido neutro en cobertura Y en tiempo.
