    # 30 -> 45 el 2026-08-19 porque el job no habia terminado ni una vez en nueve corridas
    # (28,7 · 28,9 · 30,4 · 30,4 min, todas agotando el limite de 30). Aquella nota decia
    # «si estas duraciones bajan, este numero baja con ellas». No bajaron: SUBIERON.
    #
    # Medido el 2026-08-22 sobre las catorce ultimas corridas: NUEVE murieron en 45,4 min
    # clavados y cinco terminaron en 37,8 · 37,9 · 39,6 · 44,4 min. O sea que el gate de
    # secretos —bloqueante, de historia completa— NO DABA VEREDICTO EN EL 64 % de las
    # corridas de un dia, y nadie lo veia porque GitHub etiqueta el agotamiento del limite
    # como `cancelled`, que se lee como supersesion.
    #
    # ⇒ SUBIR EL TECHO NO ES EL ARREGLO, y por eso va acompanado de la cota interna del paso
    # de abajo. El barrido recorre la historia ENTERA y la historia solo crece: hoy son 12.538
    # commits alcanzables desde los refs de origin, 9.750 de ellos en `main`. Un techo fijo
    # sobre trabajo que crece de forma monotona falla por calendario, no por azar.
