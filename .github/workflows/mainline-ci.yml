    # Bound setup and reporting explicitly: 127 declared minutes (10 + 5 + 25 + 82 + 5) fit within
    # 135. It was «112 within 120» until the secrets-gate battery cap went 10 -> 25 on 2026-09-16
    # (sized from the measured runs); `lint:ci-timeout-arithmetic` refused the unchanged 120
    # against the new sum (secrets techo 120, suma de pasos 127), which is exactly its job.
    # These provisional budgets preserve the scan's 80-minute diagnostic timeout.
