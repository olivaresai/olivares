        timeout-minutes: 10
        run: task manifests:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-manifests.log" && rm "$RUNNER_TEMP/ci-fail-manifests.log"
      - name: build every workspace module
        id: build-go
        timeout-minutes: 20
        run: task build:go 2>&1 | tee "$RUNNER_TEMP/ci-fail-build-go.log" && rm "$RUNNER_TEMP/ci-fail-build-go.log"
      # NOTE: the -tags enterprise surface (multi-IdP SSO, content firewall, server-tool
      # egress, incident close-loop, threat-intel, hook hardening, Conjur, seats) moved to
      # the private enterprise distribution; it is no longer buildable from this repo.
      - name: build + test the -tags release trust-anchor seams
        id: release-seams
        timeout-minutes: 20
        # The tag-less gate never compiles embedded_release.go; exercise it here.
        # test:release runs the no-key (license-key=none) safe-degradation path; the
        # build:release mints two THROWAWAY public keys (no production private key in
        # CI) to prove the two independent -X injections compile. The domain test
        # then proves neither corresponding private key crosses into the other trust
        # domain and exercises the embedded community OTA anchor end-to-end.
        # EVERY command in this group is &&-CHAINED, and that is load-bearing
        # (2026-08-01). The `&& rm` suffix puts the whole pipeline inside an
        # AND-list, which SUSPENDS errexit for its left operand — so a newline-
        # separated group ran on after a failure and the step was graded by its
        # LAST command alone. Measured, with `bash -e -o pipefail`:
        #   { false; echo SECOND; } | cat && echo PASSED    -> SECOND, PASSED, 0
        #   { false; echo SECOND; } | cat                   -> 1
        #   { false && echo SECOND; } | cat && echo PASSED  -> 1
        # Five verifications hung on that: a failing `task test:release` was
        # invisible whenever `task test:archive-gate` passed. The intent of the
        # suffix (drop the log on success, keep it for the failure reporter) is
        # unchanged; it just no longer disarms the group it decorates.
        #
        # The two keygens are ASSIGNED and then exported separately, because
        # `export X="$(cmd)"` reports EXPORT's status — always 0 — while a bare
        # assignment propagates the substitution's. Also measured today.
        run: |
          {
            task test:release &&
            OLIVARES_LICENSE_PUBKEY="$(go run ./cmd/olivares license keygen | awk '/public_key/{print $2}')" &&
            OLIVARES_OTA_PUBKEY="$(go run ./cmd/olivares license keygen | awk '/public_key/{print $2}')" &&
            export OLIVARES_LICENSE_PUBKEY OLIVARES_OTA_PUBKEY &&
            task build:release &&
            task test:key-domains &&
            # And that the OTA phase-2 archive gate rejects a substituted archive BEFORE
            # anything out of it executes (the circular-bootstrap regression).
            task test:archive-gate
          } 2>&1 | tee "$RUNNER_TEMP/ci-fail-release-seams.log" && rm "$RUNNER_TEMP/ci-fail-release-seams.log"
