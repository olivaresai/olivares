        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          bin="$(bash scripts/ensure-goreleaser.sh --dest "$RUNNER_TEMP/goreleaser-2.17.0")" || {
            echo "::error::ensure-goreleaser could not provide a digest-verified goreleaser v2.17.0"
            exit 1
