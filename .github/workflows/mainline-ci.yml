    # reads CI_RUNNER_SECRETS, so its placement can move without moving any other job; unset, the
    # fallback is exactly the previous `vars.CI_RUNNER || 'ubuntu-latest'`. It moves placement only —
    # checkout, captured subject, rules, the 80m inner clock and 0/1/2 stay — and no runner choice
    # guarantees CPU. R73 finished in 75.4 min on a shared host; ~0.64 cores is inferred, not measured.
