#
# ⛔ TRIGGERS, AS OF 2026-08-23: the `on:` block of THIS FILE carries `workflow_dispatch:` AND
# `push: branches: [main]`. This file DOES run by itself on every push to `main`.
#
# ⛔ AND NO LINE NUMBER, ON PURPOSE — I broke this rule while writing this very comment. My first
# version said "`:145-148`, the line number that is actually true", and adding these seventeen
# lines moved the block to `:162`. A header CANNOT cite a line number of its own file: any edit
# above the target invalidates it, and the edits above are usually the header itself growing. That
# is also how the old comment ended up pointing at `:94-95` — nobody moved the `on:` block to
# deceive; the file simply grew above it.
#
#     grep -n '^on:' .github/workflows/mainline-ci.yml     <- one command, never stale
#
# ⛔ WHAT THIS BLOCK USED TO SAY, and why it is kept rather than deleted. Until today it read:
#
#     «THIS FILE IS `on: workflow_dispatch` AND NOTHING ELSE (:94-95). READ THAT FIRST. […]
#      NOTHING here runs by itself. Somebody dispatches it, per branch, by hand. […] `pull_request`
#      and `push` TRIGGERS THAT DO NOT EXIST»
#
# Every word of that was TRUE when written, and that is exactly what made it dangerous: there was
# nothing to disprove in it, only a date it did not carry. `892f22620` restored the push trigger on
# 2026-08-21 — on the condition wrote for its return — and the header kept asserting the
# opposite in the present tense, WITH the authority of "READ THAT FIRST", and pointing at `:94-95`,
# which is not even where the `on:` block lives any more.
#
# This is the same shape that cost three contributors a retraction each on 2026-08-23 with
# `scripts/check-emitted-urls.sh`: a header stating a measured fact in the present, outliving the
# fact. When three independent readers get it wrong the same day, the defect is in the text.
#
# ⇒ THE AUTHORITY FOR TRIGGERS IS THE `on:` BLOCK AT `:145`, NOT THIS COMMENT. If they ever
# disagree again, the block wins and this comment is the thing to fix.
#
# The `paths-filter` reasoning further down was written when the triggers did NOT exist and is kept
# for the same reason it was kept then: the reasoning is right.
#
# What that costs, measured 2026-08-14: main's protection requires control-plane, race-hot, web and
# classify, so a PR cannot merge until somebody dispatches this workflow for its branch — and with
# `strict` also on, a trunk that moves invalidates the run and it must be dispatched again. And the
# seven READMEs' "CI walks the same path: `task smoke:quickstart`" pointed HERE, so the sentence
# was true only when a human remembered. That claim now lives in drills-nightly.yml, which has a
# schedule, and scripts/check-readme-task-claims.sh refuses a workflow with no automatic trigger.
#
# Mainline CI — the green gate a PR needs, dispatched per branch by the maintainer:
# the structural lints, full build, the FULL no-race test suite plus the
# concurrency-hot -race leg (test:functional + test:race-hot). This is a
# DELIBERATE race-detection reduction on the slow cmd/olivares e2e tail, not
# equivalent coverage — the full -race sweep runs WEEKLY in race-full.yml (and
# locally by the pre-push hook), so nothing is permanently unraced.
#
# golangci-lint (lint:go / lint:web) is intentionally NOT run here, and the reason
# written here until 2026-08-16 was FALSE: it said v2 "cannot typecheck under Go 1.26
# yet, so it exits non-zero with 0 issues" — a toolchain excuse. Measured 2026-08-07
# with golangci-lint 2.12.2 (built with go1.26.5) over the eleven go.work modules:
# 473 findings in NINE of them (misspell 217, staticcheck 100, unused 74, revive 54,
#
# ⛔ Y ESOS 473 SON UN TECHO, NO UN RECUENTO — corregido el 2026-08-18. golangci-lint
# recorta por defecto en max-issues-per-linter: 50 y max-same-issues: 3, y .golangci.yml
# no fijaba ninguno, asi que la medida de arriba se tomo con los dos puestos. Con los
# topes a 0: 1426 hallazgos (misspell 966, staticcheck 194, errcheck 87, unused 84,
# revive 78, ineffassign 11, goimports 5, govet 1). Descontando cloud/control-plane —201,
# un modulo que no estaba en el workspace entonces— son 1225 frente a 473: 2,6x solo por
# los topes. Y ya no son once modulos, son doce. Los topes estan a 0 desde ese dia; el
# detalle, en an internal design note (not shipped)
#
# NO copies el desglose de misspell a mano: `bash scripts/misspell-census.sh` lo re-deriva y
# FALLA si sus filas dejan de sumar. La version tecleada de ese desglose vivio medio dia
# diciendo 817 apariciones con filas que sumaban 1022, y se propago a tres ficheros.
# errcheck 11, goimports 9, ineffassign 8). It is THE CODE, and it is not "0 issues".
# The old attribution had a cost that outlived it: while the cause was believed to be
# the toolchain there was nothing to fix, so 473 findings read as expected noise.
# It stays out of this workflow because clearing them is a campaign of its own, not
# because a tool is broken. The structural lints (SPDX headers, AGPL/Apache boundary),
# a full build, the split test gate, govulncheck, and a full-history gitleaks scan are
# all green and are what we gate on. Actions are SHA-pinned; tools version-pinned.
name: mainline-ci

# NO paths filter on `pull_request`: a path filter there makes required status
# checks a DEADLOCK — a docs-only PR skips every job, so a required `control-plane`/…
# check never reports and GitHub blocks the PR forever waiting for it. If
# minute-efficiency ever matters on PRs, replace this with an INTERNAL changes-filter
# gate plus an always-running aggregate `ci-required` job — never a workflow-level
# paths-ignore under required checks.
#
# NO paths-ignore on `push` EITHER — corrected 2026-07-30, same day it was added. The
# first version ignored journal-only pushes (`sessions/**`, `an internal design note (not shipped)**`,
# `ESTADO-PROYECTO.md`) on the premise that "no job here compiles, embeds or lints
# those paths against anything". That premise was FALSE, and the refutation is in this
# very file: the `secrets` job checks out FULL history and runs `task lint:secrets` —
# gitleaks over every commit reachable from HEAD — and `.gitleaks.toml` deliberately does NOT allowlist
# `an internal design note (not shipped)**` (its own comment: allowlisting it "would stop scanning a directory
# where command output is routinely pasted") nor `ESTADO-PROYECTO.md`. A skipped
# journal push therefore skipped a REAL security consumer of exactly the paths most
# likely to carry pasted secrets, with `secrets` not in the required checks and
# enforce_admins off, so no PR-side net covers a direct push. (Only `sessions/**` is
# gitleaks-allowlisted, and an ignore restricted to it saves almost nothing: the
# journal-heavy pushes go to an internal design note (not shipped))
#
# The efficiency goal moved to where always said it belongs: the INTERNAL
# `classify` job below. Every push starts a run; `secrets` (and any future consumer of
# journal paths) runs UNCONDITIONALLY; only the expensive code-input jobs skip when the
# push touched nothing but the journal. The gate cannot skip itself — it has no path
# filter and every failure mode inside it resolves to "run everything" — and
# `pull_request` keeps no filter of any kind.
#
# RUNNERS AND TRIGGERS. Three standing choices keep the gate honest and affordable
# on any runner pool:
#   1. runs-on is a vars-driven fallback chain in EVERY workflow, ending in
#      'ubuntu-latest'. Every job here leads with `vars.CI_RUNNER`, so all of our
#      runners are eligible for all of them. A per-class split (`CI_RUNNER_DB` for
#      the Postgres-backed jobs, `CI_RUNNER_CPU` for the rest) was written and then
#      NOT adopted: its premise was that two Postgres-backed jobs collide on the
#      host's 5432, and the ephemeral-port change below removed that collision.
#      Measured 2026-07-31: two Postgres-backed jobs overlapped on one self-hosted
#      host, the second's "Initialize containers" landing inside the first's window,
#      and neither died. With no exclusive resource left, partitioning only shrinks
#      the pool each class can draw from. `CI_RUNNER_DB` survives for the one job
#      that DOES own something exclusive: e2e-operator-kind, which takes the host's
#      Docker daemon and a fixed-name kind cluster. With nothing set, the gate runs
#      hosted — "GitHub Actions
#      usage is free for self-hosted runners" (docs.github.com,
#      about-billing-for-github-actions). That is the real fix; 2 and 3 are what make
#      the hosted runner affordable when no self-hosted runner exists. release*.yml
#      stays on plain `ubuntu-latest`: SLSA provenance derives its trust from
#      hosted-runner isolation.
#   2. `push` on main IS a trigger (since 2026-07-30; it was removed under the billed
#      regime). The old premise — "a PR already gates the exact tree that merges" —
#      was measured false: #447 and #448 merged 12 seconds apart from the same base
#      and left main red in sdk:check with no run ever testing the combination. With
#      CI_RUNNER=self-hosted the push run costs nothing, and it is the ONLY check
#      that sees the post-merge tree. The per-job concurrency groups cancel a
#      superseded push's jobs: only the newest state of main needs a verdict.
#   3. The -race legs run on EVERY PR since 2026-07-30 (the opt-in died with the
#      billed-minutes regime). race-full.yml remains the full pre-release sweep.
# MANUAL-ONLY REGIME (2026-08-02): per-push runs superseded each other and wasted
# the three runners during the relaunch burst. The maintainer dispatches runs when a
# verdict is actually needed; the automatic triggers return when release prep starts.
# ⛔ EL DISPARADOR DE `push` VUELVE, Y LA CONDICION QUE LO PERMITE ES DE FRAN, NO MIA.
#
# El regimen manual lo fijo el 2026-08-02 CON SU PROPIA CONDICION DE VUELTA, escrita cuatro
# lineas mas abajo: «the automatic triggers return when release prep starts». Esa condicion esta
# OBJETIVAMENTE cumplida por una orden POSTERIOR suya, del 2026-08-20, registrada en
# `an internal design note (not shipped):18-21`:
#
#   «⛔ OBJETIVO Y PLAZO (orden de 2026-08-20): la version es `v26.8.0` y hay DIEZ DIAS»
#
# Una version con numero y un plazo con fecha ES la preparacion del release. No es una inferencia
# sobre lo que querria: es una orden suya, posterior, en el registro.
#
# ⇒ LA EVIDENCIA QUE LO HACE URGENTE, medida el 2026-08-21: el job `race-rest` llevaba CUARENTA
# HORAS rojo —verde por ultima vez el 08-20T03:41Z, rojo en las SIETE corridas siguientes— con OCHO
# tests fallando en `olivares-commerce/cmd/commerce` y SIETE incidencias automaticas que nadie
# abrio. Nadie lo vio porque nadie despachaba. Un gate que solo corre cuando alguien se acuerda no
# es un gate: es una consulta.
#
# ⚠ SOLO `main`, y a proposito. Es el unico evento que ve el ARBOL POST-MERGE —el punto 2 de la
# nota de abajo lo mide con #447 y #448, que se fusionaron con doce segundos de diferencia desde la
# misma base y dejaron `main` roja sin que ninguna corrida probara la combinacion—. Los PR siguen en
# despacho manual: esto resuelve el rojo invisible de `main`, no cambia el regimen de las ramas.
#
# Y NO satura: el job `classify` existe precisamente para esto y hoy esta DORMIDO. Su primera linea
# es `if [ "$EVENT" != "push" ]; then verdict true`, asi que con solo `workflow_dispatch` clasifica
# SIEMPRE como codigo y corre todo. Con el push, un commit de solo-bitacora se clasifica
# `code=false` y las patas pesadas se saltan. La maquinaria llevaba escrita desde antes que el
# disparador que la usa.
#
# REVERSION: un commit que quite estas dos lineas. Si considera que la preparacion del release
# aun no ha empezado a su juicio, esta decision se retira sin dejar deuda.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Every main push starts this workflow. Classify may skip expensive code jobs
    # on remaining journal prefixes; it does not skip the run or the secrets job.

permissions:
  contents: read

# Without this, GitHub runs every `run:` step as `bash -e {0}` — WITHOUT pipefail —
# so a step written as `task test:functional 2>&1 | tee "$LOG" && rm "$LOG"` exits with
# `tee`'s status, which is always 0. That is not hypothetical: on 2026-07-24 run
# 30120996419 reported step 20 "test (functional, no -race)" as SUCCESS while its own
# log printed `FAIL github.com/olivaresai/olivares/core/internal/store/sqlstore`, and
# the failure-reporter step was skipped. A total Postgres boot outage therefore sat on
# `main` from 2026-07-08 behind a green check. Declaring the shell explicitly makes
# GitHub use `bash -e -o pipefail {0}`, so the exit status is the task's, not tee's.
defaults:
  run:
    shell: bash

# CONCURRENCY IS JOB-LEVEL NOW, not workflow-level — a consequence of the internal
# classify gate. Under a workflow-level group, a journal-only push (which now always
# starts a run) would CANCEL the in-flight run of the previous CODE push and then skip
# every code job itself, leaving the newest code state of main with no completing
# verdict — the exact regression the old paths-ignore note promised to avoid. With the
# group on each expensive job instead, a run whose code jobs are SKIPPED never enters
# their groups: journal-only runs cancel nothing, while a newer code push still cancels
# the superseded code jobs (bounding minutes on rapid merge trains, as before). The
# `secrets` job carries its own group too: a newer full-history gitleaks scan strictly
# subsumes the one it cancels.

# ⛔ CONCURRENCIA A NIVEL DE WORKFLOW (r25, 2026-08-26). Implementa la doctrina que la cabecera
# de este mismo fichero YA declara en su punto 2 —«The per-job concurrency groups cancel a
# superseded push's jobs: only the newest state of main needs a verdict»— en el caso en que esos
# grupos NO pueden cumplirla.
#
# EL HUECO, MEDIDO HOY: una corrida encolada ANTES de que existan sus jobs no tiene ningun job que
# cancelar, asi que los grupos por-job no la tocan. Se acumulan. Medidas cinco a la vez, las cinco
# superseded (ninguna casaba con la punta), y CADA UNA iba a crear ~14 jobs para gatear un arbol
# que ya no existe. Y no se pueden limpiar a mano: la API responde 409 «Cannot cancel a workflow
# run that has not been queued yet» sobre corridas que `gh run view` reporta como `queued`.
#
# LA ARITMETICA QUE LO HACE INEVITABLE: main avanza 418 commits/24 h (1 cada 3,4 min) y una
# corrida dura 3-4 h. Durante UNA corrida main avanza ~60-70 commits ⇒ toda corrida de `main`
# NACE superseded. Sin esto, el pool se gasta en veredictos cuyo sujeto ya no existe.
#
# ALCANCE: el grupo discrimina por evento a proposito. Un `workflow_dispatch` sobre una rama —que
# es como el integrador pide veredicto de un lote— no comparte grupo con los push a `main`: si el
# grupo fuese ciego al evento, despachar el lote N+1 mataria el gate del lote N.
#
# ⛔ La primera version de este bloque ponia `cancel-in-progress: true` para los push a `main`, y
# MEDIDO el 2026-08-26 eso garantizaba que `main` NO DIERA VEREDICTO NUNCA: la mediana entre pushes
# a `main` es de 60,6 min (20 corridas, ventana de 76,7 h) y una corrida completa tarda 180-240 min,
# o sea que llegan ~3 pushes DENTRO de cada corrida y cada uno habria matado a la anterior. En un
# repositorio donde `race-hot` es un check REQUERIDO que solo puede ponerse verde desde una corrida
# de `main`, eso no es ahorro: es dejar el check inalcanzable por construccion.
#
# Con `cancel-in-progress: false` sale el ahorro sin ese coste, y es comportamiento documentado
# (docs.github.com/actions · workflow-syntax#concurrency, verificado el 2026-08-26):
#   «any existing `pending` job or workflow in the same concurrency group will be canceled and the
#    new queued job or workflow will take its place»
# ⇒ la corrida EN CURSO termina (puede haber veredicto) y las PENDIENTES colapsan a una sola.
# ⚠ EL AHORRO DE COLA ES HIPOTESIS, NO RESULTADO, y se declara asi a proposito. `main` tenia 3
# corridas encoladas a la vez (17:36, 17:38, 18:30) mas una en curso, y con este bloque DEBERIAN
# quedar 1+1 — pero las encoladas figuran en `status=queued` y la doc habla de cancelar lo
# `pending`, que no se ha demostrado que sea el mismo estado aqui: en la prueba con señuelo la
# corrida encolada NO se cancelo. Se mide en vivo con dos push seguidos a `main` y se corrige esta
# nota con el numero. Lo aterrizable de este commit NO depende de esto: el arreglo del `run_id` se
# sostiene solo. (Precision de the planner sobre el diff.)
concurrency:
  group: mainline-ci-run-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # --- The INTERNAL change gate (replacement for the push paths-ignore).
  # Classifies the push as journal-only vs code and gates ONLY the expensive code-input
  # jobs below. Design properties, in order of importance:
  #   1. `secrets` does NOT depend on this job — gitleaks consumes the journal paths
  #      (the refuted premise in the header), so it runs on every push, period.
  #   2. FAIL-CLOSED to "code=true": pull_request and workflow_dispatch events, a new
  #      branch (before=0…0), a force push, an unreachable compare API, missing tools
  #      on the runner, a truncated file list (the compare API caps at 300 files) — all
  #      resolve to running everything. The step itself never exits nonzero on those
  #      paths, so dependents are never skipped BY ACCIDENT: only an explicit
  #      journal-only verdict skips them.
  #   3. It cannot skip itself: no path filter exists on the workflow anymore.
  # The journal set below must stay a SUBSET of paths no gated job consumes; design/ at
  # large is NOT listed on purpose (lint-commerce reads an internal design note (not shipped)).
  classify:
    # CI_RUNNER_LIGHT FIRST (2026-08-01). This job gates every other one through
    # `needs`, so a run cannot start while it queues — and measured today, it was
    # queueing: the three Hetzner runners busy=true, 19 jobs waiting, and srv17
    # busy=false because NOTHING in this repository ever asked for `ci-light`, the only
    # label it carries. The chain only GROWS the pool (all three Hetzner runners carry
    # ci-light too); it moves nothing off them.
    #
    # Safe here for a reason specific to this job: it needs no checkout and no toolchain,
    # and every path it cannot complete — curl or jq missing, the compare API
    # unreachable — already ends in the fail-closed verdict code=true. A runner that can
    # do nothing costs a full run, not a wrong answer.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - name: classify push (journal-only vs code)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          SHA: ${{ github.sha }}
        run: |
          # NO set -e: every path must end in an explicit verdict, and the fail-closed
          # verdict is code=true. This step succeeding is load-bearing for the gate.
          set -uo pipefail
          verdict() { echo "code=$1" >>"$GITHUB_OUTPUT"; echo "classify: code=$1 ($2)"; }
          if [ "$EVENT" != "push" ]; then verdict true "event=$EVENT"; exit 0; fi
          if [ "${FORCED}" = "true" ]; then verdict true "force push — compare basis unreliable"; exit 0; fi
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            verdict true "new branch or missing before-SHA"; exit 0
          fi
          if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            verdict true "curl/jq unavailable on this runner"; exit 0
          fi
          files="$(curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${SHA}" \
            | jq -r '.files[].filename' 2>/dev/null)" || { verdict true "compare API unreachable"; exit 0; }
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then verdict true "empty/unparseable file list"; exit 0; fi
          # The compare API caps the files array at 300 entries; at the cap the list
          # may be truncated, so the only safe verdict is to run everything.
          if [ "$count" -ge 300 ]; then verdict true "file list at the 300-entry API cap"; exit 0; fi
          journal_only=true
          while IFS= read -r f; do
            case "$f" in
            # docs/ai-context/* entro el 2026-08-23, y la razon NO es la que su autor publico
            # primero. Lo dejo escrito porque el numero equivocado ya viajo a cinco buzones.
            #
            # ⛔ FALSO: "docs/ai-context/ tiene CERO referencias ejecutables". Tiene QUINCE.
            #    check-connector-inventory.sh:36  DOC="${OLIVARES_CONNECTOR_INVENTORY:-docs/ai-context/CONNECTORS.md}"
            #    check-public-counts.sh:287-290   lee docs/ai-context/STATE.md
            #    test-prepush-refclass.sh:1417-1527  lee WORKFLOW.md y AFIRMA su contenido
            #                                     (grep -q 'prepush-refclass', 'pure-deletion push')
            #    La sonda que dijo cero partia la salida de `git grep -n` por ':' y destrozaba
            #    toda linea cuyo CONTENIDO llevara dos puntos — que son casi todas. Devolvio el
            #    cero comodo.
            #
            # ✅ VERDADERO, y es lo que sostiene la excepcion: los TRES lectores son fast-lints.
            #    Resolviendo hook -> `task lint:X` -> Taskfile -> scripts/ (574 scripts), los tres
            #    salen dentro. Los fast-lints corren en TODO push, gateado o no, asi que `classify`
            #    no los apaga: perdonar esta familia no deja de mirar nada.
            #
            # ⛔ Y `design/*` NO entra, aunque suene simetrico. 457 rutas distintas de design/ viven
            # en 1734 lineas EJECUTABLES de scripts/, y las de an internal design note (not shipped) (2) y
            # an internal design note (not shipped) (7) las leen gates que SI dependen de estos jobs. Perdonarlo
            # habria saltado los nueve jobs sobre esos ficheros en dos dias distintos — en silencio,
            # porque el job se SALTA: no se pone rojo. Medido sobre los 13 pushes a main del 08-22/23.
            # Keep only the remaining audited code-job exemptions.
            design/audits/* | docs/ai-context/* | ESTADO-PROYECTO.md) ;;
            *) journal_only=false; break ;;
            esac
          done <<<"$files"
          if [ "$journal_only" = true ]; then
            verdict false "all ${count} changed file(s) are dev-journal paths"
          else
            verdict true "code paths changed"
          fi
  control-plane:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    # ⛔ `-${{ github.run_id }}` NO es decorativo: sin el, este grupo es ciego a la CORRIDA y dos
    # corridas del MISMO ref se matan los jobs entre si. MEDIDO el 2026-08-26 sobre la corrida
    # 32994056948 de `main`: su job `secrets` fue cancelado a las 17:36:44Z, el MISMO SEGUNDO en
    # que arrancaba el primer job de la corrida 32995184312; otros cinco murieron a las
    # 18:20:36Z con la siguiente arrancando a las 18:19:01Z. DOCE jobs cancelados en una sola
    # corrida. Con `main` recibiendo un push cada 60,6 min de mediana (20 corridas, 76,7 h) y
    # una corrida durando 180-240 min, esto hacia que `main` NO TERMINARA NUNCA — y `race-hot`
    # es un check REQUERIDO que solo puede ponerse verde desde una corrida de `main`. El
    # superseding real lo hace el bloque de nivel de CORRIDA.
    #
    # ⛔ Y QUE QUEDE DICHO LO QUE ESTE GRUPO **NO** HACE, porque la primera version de esta nota
    # prometia que «evita duplicados dentro de su propia corrida» y eso es FALSO: el workflow tiene
    # CERO `strategy:` y CERO `matrix:` (verificado con el YAML cargado, no con un grep), asi que
    # dentro de una misma corrida NO PUEDE haber dos jobs del mismo nombre y este grupo no colapsa
    # nada nunca. Con el `run_id` queda INERTE a proposito: su valor entero es desactivar el
    # fratricidio ENTRE corridas. Lo cazo the planner revisando el diff; sin la correccion, alguien
    # citaria dentro de un mes una proteccion que no existe.
    concurrency:
      group: mainline-ci-control-plane-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Hard spend cap — absolute backstop only; the hang guards are the STEP
    # timeouts below (a JOB-level timeout cancels remaining steps, so the
    # failure reporter never posts — silent red). The -race leg lives in its own
    # parallel `race-hot` job (2026-07-24: it alone exceeds 45 min on a 2-vCPU
    # runner); what is left here measures ~50 min on a bad day.
    #
    # ⛔ 75 -> 180 EL 2026-08-22, Y LO QUE LO OBLIGA ES ARITMETICA DE ESTE MISMO BLOQUE.
    # El comentario de arriba dice que este techo es un backstop y que las guardas reales son
    # los `timeout-minutes` de PASO, porque un timeout de JOB cancela los pasos que quedan y
    # el reportero no publica: un rojo MUDO. Pues sus pasos sumaban 150 min y el backstop era
    # 75, asi que tenia GARANTIZADO dispararse primero, en todas las corridas. No era un
    # backstop: era el limite efectivo, y el unico que no sabe reportar.
    #
    # Medido sobre las catorce ultimas corridas: CERO exitos, NUEVE clavadas en 75,4 min. Y
    # este job es uno de los CUATRO contextos que la proteccion de rama EXIGE, asi que `main`
    # llevaba dias con una proteccion insatisfacible y nada lo decia. El «~50 min en un mal
    # dia» de arriba queda como historia: la ultima corrida completo 1.754 paquetes y seguia
    # dentro de `olivares.test` cuando la mataron.
    #
    # 180 = los 150 de sus pasos + margen para los CUARENTA pasos sin guarda (checkout, setup,
    # docker, servicios). Un techo no RESERVA tiempo, solo acota: pasarse por arriba no cuesta
    # nada y quedarse corto cuesta el veredicto entero.
    # Lo sostiene `task lint:ci-timeout-arithmetic`, que rehusa si vuelve a bajar de la suma.
    # ⛔ 180 -> 240 el 2026-08-23, ATADO a que su paso funcional pase de 45 a 120: la suma de los
    # techos de paso sube de 150 a 225 y `lint:ci-timeout-arithmetic` exige que el del job quede
    # POR ENCIMA. Los tres números se mueven juntos, igual que en race-modules.
    # ⛔ 240 -> 255 el 2026-08-28, y por la MISMA regla, que yo acababa de romper: este lote añade
    # el paso `compliance catalog export drift` con techo 15, así que la suma de pasos pasó de 225
    # a 240 y quedó EXACTAMENTE en el techo del job. Igual no es «por encima»: con headroom cero,
    # el que muerde primero es el del JOB, y ése es el único que no sabe reportar — cancela los
    # pasos que faltan, el reportero de fallos no llega a publicar, y GitHub lo etiqueta
    # `cancelled`, que es la palabra de la supersesión. El rojo saldría MUDO. 255 devuelve los 15
    # minutos de holgura que el job tenía antes de que yo le añadiera un paso.
    # Keep the job deadline above the 302-minute sum of bounded steps.
    # The uninstall mutation battery has a 20-minute step deadline.
    timeout-minutes: 320
    # pull-requests/issues write is ONLY for the on-failure pr-failure-report
    # step — the workflow token cannot read Actions logs, so the PR comment (or, on a
    # main push, the issue it opens) is the telemetry.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # A real Postgres so the HA leader-election / failover and expand-contract
    # migration tests run BY EXECUTION, not just the fake-backend unit tests.
    # The store integration tests and the two-elector failover test self-skip
    # unless OLIVARES_TEST_POSTGRES_DSN is set, which the env below provides.
    services:
      postgres:
        # pgvector/pgvector = the official postgres image + the compiled vector
        # extension (pinned by digest, tag pg16, 2026-07-30). B5: docs call pgvector
        # the self-host production default, yet no gate ever executed it — the real
        # integration test gates on OLIVARES_TEST_VECTOR_DSN below.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # EPHEMERAL HOST PORT (2026-07-30). `5432:5432` reserved the HOST's 5432;
          # a second job on the SAME host died in "Initialize containers" with
          #   Bind for :::5432 failed: port is already allocated
          # (measured: run 30541550811, job 90901999419, dead in 10 s). This host
          # runs THREE runner installations, so the repo trips over itself. A bare
          # container port lets Docker pick a free host port; it is read below with
          # job.services.postgres.ports['5432'] from a STEP — the `job` context
          # does NOT exist in jobs.<id>.env (actionlint availability.go, case
          # "jobs.<job_id>.env").
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
      # SECOND, job-owned cluster for TestDRDestinationUnrelatedCluster
      # (core/internal/store/sqlstore/drdestinationauthority_pg_test.go:185). That test needs
      # TWO UNRELATED clusters: it re-points pgtest's superuser DSN at this one to build its B
      # fixture and then asserts the two pg_control_system() system_identifiers DIFFER. Two
      # databases on ONE server share a system_identifier, so a second database would NOT
      # satisfy it -- and the test says so by failing, which is the guard, not a formality.
      # Until this service existed the test could only ever t.Fatal with "a second owned real
      # cluster is required": run 34731376655 did exactly that, at line 187.
      #
      # Same pinned image and the same BARE container port as the primary, so Docker picks a
      # free ephemeral host port here too; the resolver refuses if it is empty, out of range,
      # or EQUAL to the primary's. Isolated CI test resource, never a production destination.
      postgres_other:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
    env:
      # The four OLIVARES_TEST_*_DSN CANNOT live here: they depend on the ephemeral
      # host port, and the `job` context is not available in jobs.<id>.env
      # (actionlint availability.go: jobs.<job_id>.env → github, inputs, matrix,
      # needs, secrets, strategy, vars — no `job`). The first step, "resolve the
      # ephemeral Postgres port into the test DSNs", writes them to $GITHUB_ENV.
      # Promotion regime (2026-07-30): this job provisions real Postgres, so a
      # PG-less partial pass here could only mean the service died — fail, not skip.
      OLIVARES_GATE_STRICT_PG: "1"
      # Pinned Helm, used only to render the chart for the install-manifest drift gate.
      HELM_VERSION: "3.21.0"
      HELM_SHA256: "0093eb572e3d2380f094df162ddb525e219249de88957afe24cfbb19632acd36"
    steps:
      - name: resolve the ephemeral Postgres port into the test DSNs
        id: pg-port
        env:
          # `job` is only available in steps.env/steps.run/steps.with.
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
          PGPORT_OTHER: ${{ job.services.postgres_other.ports['5432'] }}
        run: |
          set -euo pipefail
          case "${PGPORT_HOST:-}" in
            '' | *[!0-9]*)
              echo "::error::mapped host port for services.postgres:5432 is empty or non-numeric (got '${PGPORT_HOST:-}')" >&2
              exit 1 ;;
          esac
          # The port MUST come from THIS runner's kernel ephemeral range. Not a
          # cosmetic assertion: if Docker ever handed back 5432, the helper
          # scripts/pg-test-env.sh would reject it further down (its anti-5432
          # guard), so an out-of-range port has to die HERE, with a message that
          # says why, and not six steps later with an opaque error.
          read -r LOPORT HIPORT < /proc/sys/net/ipv4/ip_local_port_range
          if [ "$PGPORT_HOST" -lt "$LOPORT" ] || [ "$PGPORT_HOST" -gt "$HIPORT" ]; then
            echo "::error::docker published Postgres on ${PGPORT_HOST}, outside this host's ephemeral range ${LOPORT}-${HIPORT}; refusing to continue" >&2
            exit 1
          fi
          # The SECOND cluster, present only in the jobs that run the unrelated-cluster test.
          case "${PGPORT_OTHER:-}" in
            '' | *[!0-9]*)
              echo "::error::mapped host port for services.postgres_other:5432 is empty or non-numeric (got '${PGPORT_OTHER:-}')" >&2
              exit 1 ;;
          esac
          if [ "$PGPORT_OTHER" -lt "$LOPORT" ] || [ "$PGPORT_OTHER" -gt "$HIPORT" ]; then
            echo "::error::docker published the SECOND Postgres on ${PGPORT_OTHER}, outside this host's ephemeral range ${LOPORT}-${HIPORT}; refusing to continue" >&2
            exit 1
          fi
          # Equal ports would mean ONE server behind two names; the test would then fail on the
          # system_identifier comparison with a confusing message. Die here, where it is nameable.
          if [ "$PGPORT_OTHER" = "$PGPORT_HOST" ]; then
            echo "::error::both Postgres services resolved to host port ${PGPORT_HOST}; they must be two distinct servers" >&2
            exit 1
          fi
          {
            echo "PGHOSTPORT=127.0.0.1:${PGPORT_HOST}"
            # app = NOSUPERUSER NOBYPASSRLS owner of olivares (FORCE-RLS genuinely
            # exercised); admin = NOSUPERUSER BYPASSRLS for cross-tenant reads. The
            # superuser (maintenance) DSN targets /postgres, NOT /olivares: pgtest
            # only CREATE/DROP DATABASEs through it, and PostgreSQL refuses to drop
            # the database the session is connected to (scripts/pg-test-env.sh:64).
            echo "OLIVARES_TEST_POSTGRES_DSN=postgres://olivares_app:apppw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
            echo "OLIVARES_TEST_POSTGRES_ADMIN_DSN=postgres://olivares_admin:adminpw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
            echo "OLIVARES_TEST_POSTGRES_SUPERUSER_DSN=postgres://postgres:postgres@127.0.0.1:${PGPORT_HOST}/postgres?sslmode=disable"
            # The SECOND cluster, for TestDRDestinationUnrelatedCluster only. Maintenance DSN
            # targets /postgres for the same reason the primary superuser DSN does: pgtest
            # CREATEs and DROPs databases through it. The primary least-privilege app/admin
            # fixtures above are untouched -- this ADDS a cluster, it does not re-point one.
            echo "OLIVARES_TEST_POSTGRES_OTHER_DSN=postgres://postgres:postgres@127.0.0.1:${PGPORT_OTHER}/postgres?sslmode=disable"
            # This job HAS a Postgres service, so an unreachable server here is a broken
            # job — not an absence to skip past. `pgtest.Available` only learns that from the
            # RUN (core/internal/pgtest/pgtest.go:88-96): without this line the reachability
            # probe answers `false` and the whole Postgres leg vanishes QUIETLY, which is the
            # failure that probe was added to end. The declaration belongs to whoever
            # provisioned the server, and that is this job.
            echo "OLIVARES_TEST_POSTGRES_REQUIRED=1"
            # B5 (2026-07-30): the REAL pgvector integration test runs in this job —
            # the service image ships the extension and provisioning creates it. Docs
            # may call pgvector the self-host default only while this stays wired.
            echo "OLIVARES_TEST_VECTOR_DSN=postgres://olivares_app:apppw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
            # ⛔ CLOUD/CONTROL-PLANE (2026-08-16). Sus 21 tests de integración, el E2E de
            # staging y el test del pooler se SALTABAN en TODAS partes: `CLOUD_CP_*` y
            # `DATABASE_MIGRATOR_URL` daban CERO coincidencias en `.github/`. El mejor
            # instrumento anti-skip del repo estaba apagado, y un skip silencioso y un verde
            # se escriben igual. Este job ya provisiona Postgres real, así que la declaración
            # le corresponde a él, exactamente como la de OLIVARES_TEST_POSTGRES_REQUIRED.
            #
            # REQUIRE y no sólo el DSN, y el motivo lo escribe el propio módulo: «A GATE must
            # instead use CLOUD_CP_REQUIRE_INTEGRATION=1, which refuses to skip». Con
            # CLOUD_CP_INTEGRATION basta para EJECUTARLOS; si el DSN faltara volverían a saltar
            # en silencio. Con REQUIRE, un DSN ausente es un FALLO que NOMBRA la variable.
            # ⛔ AQUÍ NO SE EXPORTA `DATABASE_MIGRATOR_URL` (retirada el 2026-08-17). La ponía yo
            # apuntando al SUPERUSUARIO y ése era el fallo: la migración 009 hace
            # `SET ROLE cloud_cp_migrator` y deja de serlo, chocando con el esquema que crearon las
            # anteriores. La correcta la exporta el paso de bootstrap de roles, con la contraseña que
            # ese mismo paso genera. Dejar las dos funcionaba sólo por el ORDEN de los pasos, y una
            # verdad que depende del orden es la que se rompe cuando alguien reordena.
            echo "CLOUD_CP_INTEGRATION=1"
            echo "CLOUD_CP_REQUIRE_INTEGRATION=1"
          } >> "$GITHUB_ENV"
          echo "resolved Postgres host port: ${PGPORT_HOST} (ephemeral range ${LOPORT}-${HIPORT})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ⛔ HISTORIA COMPLETA, Y NO ES PRECAUCION: sin esto este job sale ROJO por un gate que
          # NO PUEDE MIRAR. `task lint:addon-sets` corre dos guiones que derivan su base caminando
          # la historia — scripts/check-alc-ver-programs-prep.sh y check-c13-07-ar-remeasure.sh:
          #
          #     DERIVED_HUB="$(git log --follow --diff-filter=A --format=%P -- <fichero>)"
          #     [[ "$DERIVED_HUB" =~ ^[0-9a-f]{40}$ ]] || cannot "derived baseline is not …"
          #
          # En el clon superficial que `actions/checkout` hace por defecto esa historia no existe,
          # asi que la cadena sale VACIA y el gate contesta `exit 2` — la tercera respuesta, «no he
          # podido mirar». Medido clonando ESTE repositorio de las dos formas:
          #
          #     --depth 1  ->  DERIVED_HUB = ''                                          -> exit 2
          #     completo   ->  DERIVED_HUB = '9c02e0094c3d21fcde626a2f8d3608d92f4afcda'  -> verde
          #
          # Y `task lint:addon-sets` sobre el SHA exacto que salio rojo (e5b216ade) da rc=0 en un
          # worktree local. Misma tarea, mismo arbol, distinto entorno.
          #
          # ⛔ LO QUE LO HACIA INTERMITENTE: `actions/checkout` NO borra el clon entre jobs en un
          # runner autoalojado (lo dice este mismo fichero mas abajo), asi que a veces la historia
          # estaba ahi de una corrida anterior y el gate pasaba. El veredicto dependia del RESIDUO
          # de la caja, no del arbol — y eso no se reproduce ni se diagnostica.
          #
          # El coste es tiempo de clonado. La alternativa barata seria `|| true` sobre el gate, que
          # convierte un rojo ruidoso en un verde silencioso: prohibido aqui, y con ficha propia.
          # `lint:ci-history-depth` impide que esta pareja se vuelva a separar.
          fetch-depth: 0
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      # NODE, EXPLICIT AND EARLY (P0, 2026-07-30). Five steps of this job run node
      # scripts through task (lint:i18n, lint:i18n-anchors, lint:docs-parity,
      # lint:adr-not-published, docs anchors) long before the openapi block that used to carry
      # the ONLY setup-node — placed there when "the runner brings node preinstalled"
      # was true of ubuntu-latest. On a self-hosted runner that assumption is dead:
      # one run failed 'console i18n parity' in 58s with node missing, and no
      # mainline-ci run concluded after CI_RUNNER moved to a self-hosted box, so the
      # required contexts could never report and NOTHING could merge. Every tool a
      # job invokes must be installed BY THE JOB, pinned — hosted preinstallation is
      # a convenience, never a contract. scripts/check-workflow-node-setup.sh now
      # pins this class (wired into task lint:actions).
      # NODE FIRST, AND THAT ORDER IS THE FIX (2026-08-05). pnpm/action-setup installs pnpm
      # THROUGH npm, so it needs a node on PATH — and it used to sit ABOVE setup-node because
      # setup-node's `cache: pnpm` needs pnpm to already exist. On the Hetzner runners, which
      # ship no node, that cycle cannot be satisfied: mainline-ci 30982224609 lost `web` on
      # ci-runner-1 and `control-plane` on ci-runner-3, both at that step, with
      # `npm ERR! ... paths[0] ... received undefined`. `standalone: true` did NOT help and the
      # action's own docs say why: it installs @pnpm/exe, which is still an npm package.
      # So node is installed FIRST and `cache: pnpm` is dropped — a store cache is worth less
      # than a job that runs at all, and these runners keep their disk between jobs anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        id: pnpm
        with:
          # ⛔ `dest` EXPLICITO. Sin el, la accion se auto-instala en `~/setup-pnpm`, y el servicio
          # del runner corre con HOME=/root: el 2026-08-19 murio ahi dos veces, primero con
          # ERR_PNPM_BROKEN_PNPM_INSTALL (127) y luego con «ENOENT … chmod
          # '/root/setup-pnpm/node_modules/.bin/store/v11/links/…'» (254). Fijar PNPM_HOME NO basta:
          # no cambia donde la ACCION se instala a si misma, solo donde pnpm guarda sus binarios.
          dest: ${{ runner.temp }}/setup-pnpm
          # standalone installs @pnpm/exe, which does not need a node at RUN time. It is kept
          # for that reason only: it does NOT remove the node this step needs to INSTALL, which
          # is why the setup-node above it is the actual fix and must stay above it.
          standalone: true
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # ⛔ MEDIDO, no preventivo: `core/runtime` fallo en este job con «the binary never
        # executed despite a matching digest», y su log enseña el plugin arrancando desde
        # /tmp. Los tests usan t.TempDir(), que honra TMPDIR y cae en /tmp — montado NOEXEC
        # en varias de estas maquinas. El test no mide lo que cree medir: mide el montaje.
        # Mismo remedio que el smoke de examples, y por la misma razon.
        run: |
          # ⛔ EJECUTABLE **Y CORTO**, y lo segundo lo aprendi rompiendolo. Al apuntar TMPDIR a
          # $RUNNER_TEMP la ruta crecio hasta 118 caracteres:
          #   …/_work/_temp/citests.XXXXXX/TestGatherDocker…/001/d.sock
          # y `sun_path` de un socket unix admite 108 → `bind: invalid argument`. Arreglar la
          # ejecucion de plugins rompio un test de sockets: las dos condiciones son reales.
          corto=""
          # ⛔ Y DICE POR QUE descarta cada candidato. La primera version solo avisaba «sin candidato
          # CORTO» y eso no es accionable: en ci-runner-7 los tres fallaron y el aviso no decia si era
          # por no existir, por no poder escribir o por no poder ejecutar. Un aviso que no nombra la
          # causa obliga a reproducir el entorno para saber que mirar.
          # ⛔ DISCO ANTES QUE /dev/shm, MEDIDO el 2026-09-16 (run 35076921214, `race-hot-manifest`
          # p3 en ci-runner-3): `go build` murio con «vet.cfg: no space left on device» bajo
          # /dev/shm/olv…/go-build…, y `race-modules` p3/p4 y el paso proto de `control-plane`
          # cayeron por lo mismo mientras dos particiones hermanas pasaban en el MISMO host: quien
          # llega primero se lleva la RAM. /dev/shm es UN tmpfs compartido por los doce runners
          # del host ci-runner-1, cada job con -race le mete gigas de arbol intermedio de Go, y
          # nadie borraba /dev/shm/olv$$ al acabar, asi que cada job cancelado dejaba el suyo.
          # $HOME es disco y sigue siendo CORTO (/home/runner/olv1234567 = 23 <= 24). Y /var/tmp DETRAS,
          # porque en los runners Hetzner HOME NO ESTA DEFINIDA (medido: run 35081963451, race-hot p1 en
          # ci-runner-8 salto el primer candidato y volvio a /dev/shm con 18187 MiB libres de 32039):
          # /var/tmp es el disco del host que si existe, mide 8 y la sonda de abajo decide si ejecuta.
          # Barrido de huerfanos ANTES de elegir: un olv* mas viejo que el timeout-minutes mayor
          # de este fichero (320) no puede pertenecer a un job vivo. Mide mtime del directorio,
          # que Go renueva al crear cada go-build*, y lo limita al usuario del runner.
          # Y MIDE el espacio libre de cada candidato antes de probarlo: el «no space left» de hoy
          # salio tres pasos mas abajo, dentro de `go build`; con la cifra aqui se lee en este paso.
          # ⛔ EL BARRIDO VA EN SU PROPIO BUCLE, y es una correccion MEDIDA: F2 de la revision
          # independiente del 2026-09-16 (an internal design note (not shipped)).
          # Dentro del bucle de seleccion solo alcanzaba a los candidatos probados ANTES del `break`,
          # asi que con /var/tmp elegido /dev/shm NO SE BARRIA NUNCA — justo el tmpfs cuyo residuo
          # tumbo la corrida 35076921214 y que en la 35081963451, con el barrido ya enviado, seguia
          # al 43 % (18187 MiB libres de 32039). Reproducido aqui: con el barrido dentro del bucle
          # los arboles viejos de /dev/shm y /run/user sobreviven; con este bucle aparte, no.
          # ⛔ Y BARRE TAMBIEN `olv-exec-<pid>` (F5). Censo de los nombres que los guiones de este
          # repositorio crean DENTRO de un candidato: `olv$$`, este paso; y `olv-exec-$$`, la sonda
          # `probar` de `hook-only-legs` en mainline-ci.yml. El respaldo `olivares_pick_exec_workdir o`
          # crea `o.XXXXXX` y NO se barre a proposito: el patron `o.??????` casaria nombres ajenos
          # (`o.config` mide exactamente seis), y un barrido solo se amplia a patrones que no puedan
          # casar lo que no es nuestro. Los parentesis del `find` NO son decorativos: sin ellos `-o`
          # reparte los predicados, el `-exec` cuelga solo de la segunda rama y llega a borrar
          # FICHEROS que no son directorios. Medido en las dos formas antes de elegir esta.
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -n "$c" ] && [ -d "$c" ]; then
              find "$c" -maxdepth 1 -mindepth 1 -type d \( -name 'olv[0-9]*' -o -name 'olv-exec-[0-9]*' \) -user "$(id -un)" -mmin +360 -exec rm -rf {} + 2>/dev/null || true
            fi
          done
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -z "$c" ]; then echo "  candidato <vacio>: variable sin definir"; continue; fi
            if [ ! -d "$c" ]; then echo "  candidato $c: NO EXISTE"; continue; fi
            # ⛔ `|| true` AL FINAL, y es una correccion MEDIDA: F3 de la revision independiente del
            # 2026-09-16. El bloque corre bajo `bash --noprofile --norc -eo pipefail` (asi ejecuta
            # GitHub un `run:` con `defaults.run.shell: bash`), asi que un `df` que falle sobre un
            # montaje que se va entre el `[ -d ]` y esta linea MATA EL PASO — y con el, el respaldo
            # `exec-workdir.sh` de abajo, que es lo que convierte esto en degradacion suave.
            # Reproducido con esa misma shell: la tuberia aborta el bucle, no imprime nada y el
            # texto posterior al bucle no se alcanza (rc 1). Una MEDIDA no decide el paso.
            df -Pk "$c" 2>/dev/null | awk -v c="$c" 'NR==2{printf "  candidato %s: %d MiB libres de %d en %s\n", c, $4/1024, $2/1024, $1}' || true
            d="$c/olv$$"
            if ! mkdir -p "$d" 2>/dev/null; then echo "  candidato $c: no puedo crear dentro"; continue; fi
            if ! printf '#!/bin/sh\nexit 7\n' >"$d/.p" 2>/dev/null; then echo "  candidato $c: no puedo escribir"; rm -rf "$d"; continue; fi
            chmod +x "$d/.p" 2>/dev/null || { echo "  candidato $c: chmod falla"; rm -rf "$d"; continue; }
            # ⛔ EL `\n` VA CON UNA BARRA, NO CON DOS, y hasta el 2026-08-29 iba con dos EN LOS
            # TRES SITIOS de este fichero (:669, :1499, :1732). No es cosmetico: con `\\n` dentro
            # de comillas SIMPLES, `printf` emite una BARRA-N LITERAL, asi que el senuelo queda en
            # UNA sola linea —`#!/bin/sh\nexit 7\n`— y el nucleo busca un interprete llamado
            # `/bin/sh\nexit`. Medido: el senuelo malo sale **127**, el bueno sale **7**.
            #
            # ⇒ el bucle exige 7, asi que RECHAZABA TODOS los candidatos SIEMPRE y caia siempre al
            # `exec-workdir.sh` de abajo. Un bucle que no ha elegido nunca nada, y que nadie leyo
            # porque el respaldo funciona. Peor: su propio mensaje dice «126 = noexec o sin
            # permiso» mientras el rc real era 127 — **nombraba una causa que no era la suya**, que
            # es justo lo que manda a investigar el sitio equivocado.
            rc=0; "$d/.p" 2>/dev/null || rc=$?
            rm -f "$d/.p"
            if [ "$rc" -ne 7 ]; then echo "  candidato $c: NO EJECUTA (rc=$rc; 126 = noexec o sin permiso)"; rm -rf "$d"; continue; fi
            if [ "${#d}" -gt 24 ]; then echo "  candidato $c: ejecuta pero la ruta mide ${#d} (>24)"; rm -rf "$d"; continue; fi
            corto="$d"; break
          done
          if [ -n "$corto" ]; then
            echo "TMPDIR=$corto" >> "$GITHUB_ENV"
            echo "TMPDIR corto y ejecutable: $corto (${#corto} caracteres)"
          else
            . scripts/lib/exec-workdir.sh
            d="$(olivares_pick_exec_workdir o)" || {
              echo "::error::ningun directorio permite ejecutar un binario"
              exit 1
            }
            echo "TMPDIR=$d" >> "$GITHUB_ENV"
            echo "::warning::sin candidato CORTO; uso $d (${#d} caracteres): un socket unix puede pasarse de 108"
          fi
      # ⛔ ESTE PASO ERA EL 48 DE 49 DEL JOB (el 50 de 51 tal y como los numera Actions), Y ESO LE
      # COSTO TRECE HORAS DE CEGUERA A `main`. Sube aqui el 2026-08-29 (a repository gate / a repository gate). NO cambia
      # QUE comprueba: cambia CUANDO lo dice — la forma de a repository gate, aplicada al lado de CI.
      #
      # LA MEDIDA QUE LO ORDENA, y salio de medir otra cosa: `fc293ba65` (2026-08-29 07:06:01+02)
      # cambio modules/compliance/capabilities.go —fuente que el propio artefacto declara— sin
      # regenerar compliance.catalog.json, cuyo ultimo commit era de la vispera a las 17:43. La
      # deriva es DETERMINISTA (dos regeneraciones seguidas dan el mismo blob, distinto del
      # commiteado) y viaja en el SHA candidato. Y nadie la vio: tres corridas salieron `cancelled`
      # y la cuarta iba por el paso 46 con este PENDING. **Un rojo temprano es una cortina; uno
      # tardio ni siquiera llega a serlo, porque no llega.**
      #
      # ⇒ LA REGLA, y no es de estilo: el ORDEN de los pasos dentro de un job es una decision de
      # COSTE. Una comprobacion barata detras de cuarenta y seis pasos cuesta la latencia de los
      # cuarenta y seis, y ninguna paridad de LISTAS entre el gancho y CI puede ver eso.
      #
      # SIGUE AQUI Y NO EN LOS FAST-LINTS, por la razon que este paso YA TENIA ESCRITA —**compila
      # Go**, que el carril rapido deliberadamente no hace— y por una segunda medida del
      # 2026-08-29 sobre un arbol limpio: el CHECK **regenera compliance.catalog.json dentro del
      # arbol de quien lo corre** (`git status` lo deja modificado). Una pata del gancho que
      # reescribe un fichero trackeado a mitad de un push de horas deja residuo que despues mata a
      # otra pata y parece un defecto suyo.
      #
      # QUE VIGILA: compliance.catalog.json es el dato detras de las tres URLs olivares.ai
      # /compliance/* que modules/compliance SELLA en paquetes de evidencia OSCAL. Un control
      # anadido a frameworks.go con el export rancio deja la pagina que ve un auditor y el
      # documento firmado diciendo cosas distintas.
      - name: compliance catalog export drift
        id: compliance-catalog-check
        # ⛔ LA GUARDA NO ES DECORATIVA AQUI, Y LA CONDICION QUE CIERRA ES REAL: este paso necesita
        # checkout, Go y go-task, y NADA MAS — `task compliance:catalog:check` corre
        # `go run ./modules/compliance/catalogexport`, sin DSN, sin cliente Postgres y sin red
        # (verificado por el contraste `sol max`, §4 de su informe). Delante suyo corren el
        # resolutor del puerto de Postgres (:1), `setup-node` (:5) y `pnpm/action-setup` (:6), que
        # NO le hacen falta: sin guarda, un Postgres enfermo o un pnpm roto lo SALTAN, y su
        # veredicto desaparece por una razon que no es la suya.
        #
        # Es exactamente la cortina que este mismo lote esta corrigiendo dos pasos mas abajo en
        # `sdk-check` y `openapi-check`, en miniatura: no basta con adelantar un paso barato: hay
        # que desacoplarlo TAMBIEN de lo que no necesita. Subirlo del 48 al 9 fue la mitad.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 15
        run: task compliance:catalog:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-compliance-catalog.log" && rm "$RUNNER_TEMP/ci-fail-compliance-catalog.log"
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        id: pg-roles
        env:
          PGPASSWORD: postgres
        run: |
          # Hosted ubuntu images ship psql; a self-hosted runner may not be
          # Debian-based at all — install the client only when it's missing.
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client; }
          # The app role + olivares DB it owns (NOSUPERUSER NOBYPASSRLS).
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 \
            -v app_password=apppw -f deploy/postgres/01-app-role.sql
          # The cross-tenant admin role (BYPASSRLS, NOSUPERUSER) + read grants, incl.
          # default privileges so it can read tables the engine creates later.
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "DROP ROLE IF EXISTS olivares_admin; CREATE ROLE olivares_admin LOGIN PASSWORD 'adminpw' NOSUPERUSER BYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE olivares TO olivares_admin;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SCHEMA public TO olivares_admin; ALTER DEFAULT PRIVILEGES FOR ROLE olivares_app IN SCHEMA public GRANT SELECT ON TABLES TO olivares_admin;"
          # pgvector (B5): the extension is not trusted, so the app role cannot create
          # it — the superuser does, once per database; the backend's own
          # CREATE EXTENSION IF NOT EXISTS then no-ops harmlessly.
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector;"
      # ⛔ EL BOOTSTRAP DE ROLES DEL CLOUD, que faltaba y que YO dejé faltando (2026-08-16). Al
      # encender los tests de integración del control plane (a repository gate: CLOUD_CP_INTEGRATION=1,
      # CLOUD_CP_REQUIRE_INTEGRATION=1, DATABASE_MIGRATOR_URL) cablée la mitad que los ENCIENDE y no
      # la que los deja pasar. Resultado en CI, con su mensaje exacto:
      #
      #     RunMigrations: run migrations: Dirty database version 9. Fix and force version.
      #
      # La 009 (`cloud/control-plane/migrations/009_cloud_control_rls.up.sql`) declara en su primera
      # línea que *«role bootstrap must run first; this migration and the owner/runtime split are one
      # deployment unit»*, y aborta si `cloud_cp_owner` no existe como NOLOGIN/NOSUPERUSER/
      # NOBYPASSRLS. El paso de arriba provisiona los roles del CORE (`olivares_app`,
      # `olivares_admin`), que son otros. Sin `cloud_cp_*` la 009 lanza la excepción, golang-migrate
      # marca la base SUCIA y todo lo posterior falla con un mensaje que no menciona los roles.
      #
      # Es el defecto que el propio gate encontró el primer día que se encendió, y ésa es la
      # diferencia entre un gate rojo que sobra y uno que hace su trabajo.
      - name: provision cloud control-plane roles (the 009 RLS migration refuses without them)
        id: pg-roles-cloud
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # El guion exige UNA contraseña por rol LOGIN (diez), y las GENERA esta corrida en vez de
          # llevarlas escritas: son roles de un contenedor efímero al que nadie se conecta con
          # ellas por red. Una contraseña
          # literal en un workflow es una contraseña publicada aunque el servidor muera en 20
          # minutos, y `-X` evita que un `.psqlrc` del runner cambie lo que se ejecuta.
          # ⛔ LAS CONTRASEÑAS SE GENERAN **Y SE CONSERVAN**, porque los tests necesitan una DSN POR
          # CAPACIDAD, no sólo la del migrador. Medido el 2026-08-17 reproduciendo el fallo de CI
          # contra un Postgres real: con la DSN correcta los fallos bajan de 14 a 6 y los «Dirty
          # database version 9» a 0, y los seis que quedan lo dicen ellos mismos —
          # «missing capability DSNs [DATABASE_TENANT_URL DATABASE_SWEEPER_URL …]».
          # ⛔ GUARDA DE SUJETO, y no es defensiva: es un BLOQUEANTE DE PUBLICACIÓN medido.
          # Este workflow VIAJA al export; `cloud/control-plane` NO (export-public.sh lo retira
          # entero y lo anuncia al correr). En el árbol publicado este paso moría con
          # «psql: error: cloud/control-plane/deploy/cloud-control-roles.sql: No such file or
          # directory» — medido el 2026-08-30 en el primer T3-A real sobre olivares.preprod,
          # corrida 33286085437. Ningún gate nuestro lo veía: en el hub el fichero SÍ está, y
          # `lint:export-closure` enumera rutas de GUIONES en bloques `run:`, no un argumento
          # `-f` de `psql`.
          #
          # La guarda dice EN QUÉ MODO mira, que es la doctrina de este árbol: sin el módulo no
          # hay sujeto que probar, así que se declara y se sale limpio; con él, se ejecuta igual
          # que siempre. No se silencia nada en el hub.
          #
          # ⛔ EL PREDICADO ES EL DIRECTORIO, NO EL FICHERO — corregido el 2026-08-30 sobre la
          # guarda de #2155, cuyo comentario de arriba ya dice lo correcto («sin el MÓDULO no hay
          # sujeto que probar») mientras el `[ ! -f ]` preguntaba por el guion. No es lo mismo: con
          # el módulo presente y el `.sql` borrado o renombrado dentro del hub, el `-f` también
          # respondía NOT APPLICABLE y tapaba un defecto real con la excusa del export. Lo que
          # separa «árbol público» de «guion roto» es la ausencia del módulo, que es justo lo que
          # el export retira.
          # ⛔ LA DECLARACION QUE LA GUARDA DE ABAJO NECESITA para que el gate la reconozca.
          # La guarda existe desde #2155 y su predicado por directorio desde lo que
          # faltaba era DECIRLO en la forma que `check-export-closure.sh` lee, y hasta hoy
          # `scan_workflow` ni siquiera recogia declaraciones. En UNA linea a proposito: el
          # patron exige ruta y razon juntas y una razon partida en dos no se reconoce.
          # export-closure: hub-only cloud/control-plane/deploy/cloud-control-roles.sql — el modulo no viaja al export y el paso se declara NOT APPLICABLE sin el
          if [ ! -d cloud/control-plane ]; then
            echo "::notice::cloud-control-roles: NOT APPLICABLE — cloud/control-plane no viaja en este árbol (export curado); no hay roles que provisionar."
            # El marcador existe porque el `exit 0` deja pasos POSTERIORES que sí necesitan las once
            # DSN de capacidad: sin él se saltarían mudos o morirían sin decir por qué.
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "cloud-control-roles: NOT APPLICABLE (cloud/control-plane not exported)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "provisioned=true" >> "$GITHUB_OUTPUT"
          # ⛔ CCI1: THE CLOUD PLANE IS BOOTSTRAPPED INTO ITS OWN DATABASE, NOT INTO `postgres`.
          # `cloud-control-roles.sql:309-312` revokes CONNECT, CREATE and TEMPORARY from PUBLIC
          # on `pg_catalog.current_database()`, and the file's own comment states the premise:
          # "This database is dedicated to the cloud control plane". Connected to `postgres`
          # that REVOKE lands on the maintenance database, which is also the one
          # `OLIVARES_TEST_POSTGRES_SUPERUSER_DSN` names (line 515) and therefore the one every
          # `core/internal/pgtest` maintenance connection and every `sqlstore` role-lab fixture
          # reaches through: the lab's first non-superuser connection is then refused.
          #
          # Only the SQL file's DATABASE-scoped half (309-391) moves. The cluster-scoped half
          # (41-307: the roles, their attributes and their memberships) still lands on this same
          # job-owned server, so maintenance-ACL equality below proves that `postgres` was not
          # touched — it does NOT prove cluster-wide noninterference, and does not claim to.
          #
          # The name is step-local ON PURPOSE. `CLOUD_CP_*` is the prefix `checkcienvreach`
          # polices across jobs, and no later step needs the database name: the eleven capability
          # DSNs are composed here, in the same step that creates the database.
          #
          # LIFETIME: the job-owned service container, which is GitHub's documented disposal
          # boundary for a service, not a runtime receipt. There is no DROP in this step. The
          # object must exist across BOTH cluster-state snapshots of `clusterstateleak_test.go`
          # so it can never read as a delta, and a drop would need `WITH (FORCE)` to survive a
          # pool left open by a failed test — authority this step does not need and must not take.
          CP_DB=cloudcp
          CP_MAINT_DB=postgres
          CP_URI_MAINT="postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/${CP_MAINT_DB}"
          CP_URI_TARGET="postgres://postgres@${PGHOSTPORT}/${CP_DB}"
          # A private observation directory this invocation owns. Cleanup is restricted to it
          # (SDD 06 §6) and can only turn a success into a failure, never hide a causal one:
          # claiming a cleanup that did not happen is the other half of that rule.
          CP_OBS="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP unset - this step needs a private observation directory}/cloud-cp-obs.XXXXXX")"
          cp_cleanup() {
            local rc=$?
            if [ -d "$CP_OBS" ] && ! rm -rf "$CP_OBS"; then
              echo "::error::cloud-cp: could not remove the private observation directory"
              if [ "$rc" -eq 0 ]; then rc=1; fi
            fi
            exit "$rc"
          }
          trap cp_cleanup EXIT
          # THE READER, and it is strict on purpose: a mock that answers "1" to everything makes
          # every boolean comparison in this step pass. One observation is exactly ONE compact
          # JSON object on ONE line. `json_build_object` escapes the raw `datacl` text, so
          # neither a delimiter nor a newline inside an ACL can be read as structure, and a NULL
          # `datacl` stays distinguishable from an explicit one instead of both printing empty.
          cat > "$CP_OBS/validate.py" <<'PY'
          import argparse
          import json
          import os
          import sys

          CEILING = 65536
          DB_KEYS = ("oid", "database", "owner", "datacl_is_null", "datacl",
                     "public_connect", "public_create", "public_temporary")


          def fail(message):
              # Written through the byte stream with backslashreplace, so a catalog value the
              # log encoding cannot represent is escaped instead of raising out of the error
              # path. A failure must stay a named failure, not become a traceback.
              text = "::error::cloud-cp: " + message + "\n"
              stream = getattr(sys.stderr, "buffer", None)
              if stream is None:
                  sys.stderr.write(text)
              else:
                  stream.write(text.encode("utf-8", "backslashreplace"))
                  stream.flush()
              raise SystemExit(1)


          def _pairs(pairs):
              names = [name for name, _ in pairs]
              if len(set(names)) != len(names):
                  raise ValueError("duplicate key in the catalog projection")
              return dict(pairs)


          def observation(path, keys, kind):
              """Exactly one line, one JSON object, exactly `keys`. Anything else is a failure."""
              try:
                  size = os.path.getsize(path)
              except OSError:
                  fail("the %s observation is unreadable" % kind)
              if size > CEILING:
                  fail("the %s observation is %d bytes, above the %d byte ceiling"
                       % (kind, size, CEILING))
              # STRICT UTF-8, and this is a correction with a measured cause. Reading with
              # errors="replace" mapped EVERY invalid byte to the same U+FFFD, so two
              # different malformed ACLs decoded to one string and the maintenance
              # comparison passed on inputs whose bytes differ. Replacement decoding is
              # silent normalisation of exactly the value this step must preserve exactly.
              # Undecodable bytes are a malformed observation, which the contract already
              # requires this reader to reject; they are classified here through the same
              # fixed diagnostic as every other malformation, and are never echoed.
              # Valid non-ASCII catalog names and ACLs decode normally and are unaffected.
              try:
                  with open(path, encoding="utf-8") as handle:
                      raw = handle.read()
              except OSError:
                  fail("the %s observation is unreadable" % kind)
              except UnicodeDecodeError:
                  fail("the %s observation is not valid UTF-8; undecodable catalog bytes are"
                       " a malformed observation and are not reproduced here" % kind)
              body = raw[:-1] if raw.endswith("\n") else raw
              if not body:
                  fail("the %s observation is empty: the catalog returned no row" % kind)
              if "\n" in body:
                  fail("the %s observation carries %d lines; exactly one row is required"
                       % (kind, body.count("\n") + 1))
              try:
                  value = json.loads(body, object_pairs_hook=_pairs)
              except ValueError:
                  fail("the %s observation is not one valid JSON object" % kind)
              if not isinstance(value, dict):
                  fail("the %s observation is not a JSON object" % kind)
              missing = [key for key in keys if key not in value]
              unexpected = [key for key in value if key not in keys]
              if missing or unexpected:
                  fail("the %s observation has the wrong keys (missing: %s; unexpected: %s)"
                       % (kind, ",".join(missing) or "none", ",".join(unexpected) or "none"))
              return value


          def flag(value, key, kind):
              if not isinstance(value[key], bool):
                  fail("%s: %s is not a JSON boolean" % (kind, key))
              return value[key]


          def database(value, kind, name, owner):
              oid = value["oid"]
              if isinstance(oid, bool) or not isinstance(oid, int):
                  fail("%s: oid is not a JSON integer" % kind)
              if oid <= 0:
                  fail("%s: oid %r is not a positive catalog identifier" % (kind, oid))
              for key in ("database", "owner"):
                  if not isinstance(value[key], str):
                      fail("%s: %s is not a JSON string" % (kind, key))
              if value["database"] != name:
                  fail("%s: the row names database %r, not %r" % (kind, value["database"], name))
              if value["owner"] != owner:
                  fail("%s: the database is owned by %r, not %r" % (kind, value["owner"], owner))
              is_null = flag(value, "datacl_is_null", kind)
              if is_null and value["datacl"] is not None:
                  fail("%s: datacl_is_null is true while datacl carries a value" % kind)
              if not is_null and not isinstance(value["datacl"], str):
                  fail("%s: datacl_is_null is false while datacl is not a string" % kind)
              for key in ("public_connect", "public_create", "public_temporary"):
                  flag(value, key, kind)
              return value


          def main(argv):
              parser = argparse.ArgumentParser(add_help=False)
              sub = parser.add_subparsers(dest="command", required=True)
              one = sub.add_parser("database", add_help=False)
              one.add_argument("--file", required=True)
              one.add_argument("--kind", required=True)
              one.add_argument("--database", required=True)
              one.add_argument("--owner", required=True)
              one.add_argument("--match")
              one.add_argument("--identical")
              one.add_argument("--public-false", action="store_true")
              one.add_argument("--print", dest="print_key", choices=("oid",))
              many = sub.add_parser("flags", add_help=False)
              many.add_argument("--file", required=True)
              many.add_argument("--kind", required=True)
              many.add_argument("--keys", required=True)
              many.add_argument("--expect", required=True, choices=("true", "false"))
              args = parser.parse_args(argv)

              if args.command == "flags":
                  keys = tuple(key for key in args.keys.split(",") if key)
                  value = observation(args.file, keys, args.kind)
                  expected = args.expect == "true"
                  wrong = [key for key in keys if flag(value, key, args.kind) != expected]
                  if wrong:
                      fail("%s: %s is not %s" % (args.kind, ",".join(wrong), args.expect))
                  return 0

              value = database(observation(args.file, DB_KEYS, args.kind),
                               args.kind, args.database, args.owner)
              if args.public_false:
                  for key in ("public_connect", "public_create", "public_temporary"):
                      if value[key]:
                          fail("%s: PUBLIC still holds %s on %s"
                               % (args.kind, key.split("_", 1)[1].upper(), value["database"]))
              if args.match:
                  kind = args.kind + " (bound identity)"
                  bound = database(observation(args.match, DB_KEYS, kind), kind,
                                   args.database, args.owner)
                  for key in ("oid", "database", "owner"):
                      if value[key] != bound[key]:
                          fail("%s: %s moved from %r to %r; the object under this name is not the one"
                               " this step bound" % (args.kind, key, bound[key], value[key]))
              if args.identical:
                  kind = args.kind + " (before)"
                  before = database(observation(args.identical, DB_KEYS, kind), kind,
                                    args.database, args.owner)
                  for key in DB_KEYS:
                      if value[key] != before[key]:
                          fail("%s: %s changed while the cloud plane was bootstrapped (%r -> %r)"
                               % (args.kind, key, before[key], value[key]))
              if args.print_key:
                  sys.stdout.write("%d\n" % value[args.print_key])
              return 0


          raise SystemExit(main(sys.argv[1:]))
          PY
          # `aclexplode` returns one ROW PER PRIVILEGE, so emitting its rows would contradict the
          # one-row rule. The PUBLIC flags are aggregated with EXISTS over the EFFECTIVE ACL —
          # `COALESCE(datacl, acldefault(...))` — because a NULL `datacl` is not "no privileges":
          # it is the built-in default, which for a database gives PUBLIC CONNECT and TEMPORARY.
          cp_public_flag() { # <privilege> -> the EXISTS predicate for PUBLIC (grantee 0)
            printf '%s' "EXISTS(SELECT 1 FROM aclexplode(COALESCE(d.datacl, acldefault('d'::\"char\", d.datdba))) AS a(grantor, grantee, privilege_type, is_grantable) WHERE a.grantee = 0 AND a.privilege_type = '$1')"
          }
          # The owner is read as `pg_roles.rolname` joined on `datdba`, never as a comparison
          # between an owner OID and a role name, and never as `current_user`: this step does not
          # SET ROLE, and `current_user` would not notice if it ever did.
          cp_sql_database() { # <exact datname> -> the one-row identity/ACL projection
            printf '%s' "SELECT json_build_object('oid', d.oid::bigint, 'database', d.datname::text, 'owner', r.rolname::text, 'datacl_is_null', (d.datacl IS NULL), 'datacl', CASE WHEN d.datacl IS NULL THEN NULL ELSE d.datacl::text END, 'public_connect', $(cp_public_flag CONNECT), 'public_create', $(cp_public_flag CREATE), 'public_temporary', $(cp_public_flag TEMPORARY))::text FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE d.datname = '$1'"
          }
          # `pg_namespace` and `pg_class` are DATABASE-scoped: this projection only means
          # something when it is read ON the cloud database. EXISTS everywhere, so a join can
          # never multiply rows.
          cp_sql_target_objects() {
            printf '%s' "SELECT json_build_object('cloud_control_present', EXISTS(SELECT 1 FROM pg_namespace n WHERE n.nspname = 'cloud_control'), 'cloud_control_owned_by_owner', EXISTS(SELECT 1 FROM pg_namespace n JOIN pg_roles r ON r.oid = n.nspowner WHERE n.nspname = 'cloud_control' AND r.rolname = 'cloud_cp_owner'), 'schema_migrations_present', EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = 'schema_migrations' AND c.relkind = 'r'), 'schema_migrations_owned_by_migrator', EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace JOIN pg_roles r ON r.oid = c.relowner WHERE n.nspname = 'public' AND c.relname = 'schema_migrations' AND c.relkind = 'r' AND r.rolname = 'cloud_cp_migrator'))::text"
          }
          # Read ON the maintenance database, for the same reason. A `public.schema_migrations`
          # is a CLOUD finding only when a cloud role owns it: an unrelated migration table of
          # that name is not this step's business. The settings term is bound to the maintenance
          # database's own OID, so a setting for another database cannot be read as one here.
          cp_sql_maintenance_objects() { # <maintenance database OID>
            printf '%s' "SELECT json_build_object('cloud_control_present', EXISTS(SELECT 1 FROM pg_namespace n WHERE n.nspname = 'cloud_control'), 'cloud_schema_migrations_present', EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace JOIN pg_roles r ON r.oid = c.relowner WHERE n.nspname = 'public' AND c.relname = 'schema_migrations' AND c.relkind = 'r' AND r.rolname IN ('cloud_cp_migrator', 'cloud_cp_owner')), 'cloud_role_settings_present', EXISTS(SELECT 1 FROM pg_db_role_setting s JOIN pg_roles r ON r.oid = s.setrole WHERE s.setdatabase = $1 AND r.rolname LIKE 'cloud\_cp\_%'))::text"
          }
          # `pg_db_role_setting` is cluster-visible, so it is read from the maintenance
          # connection, but it is matched on the BOUND database OID and on the exact role OID
          # (through `rolname` joined on `setrole`), never on a name pattern.
          cp_sql_settings() { # <cloud database OID>
            printf '%s' "SELECT json_build_object('migrator_role_setting_ok', EXISTS(SELECT 1 FROM pg_db_role_setting s JOIN pg_roles r ON r.oid = s.setrole WHERE s.setdatabase = $1 AND r.rolname = 'cloud_cp_migrator' AND s.setconfig @> ARRAY['role=cloud_cp_owner']), 'migrator_search_path_ok', EXISTS(SELECT 1 FROM pg_db_role_setting s JOIN pg_roles r ON r.oid = s.setrole WHERE s.setdatabase = $1 AND r.rolname = 'cloud_cp_migrator' AND s.setconfig @> ARRAY['search_path=public']))::text"
          }
          # THE PRODUCER IS CHECKED BEFORE ANY READER OPENS THE FILE. A query that failed can
          # still leave a well-formed line behind — a previous file, a partial write — and valid
          # JSON must never erase a nonzero exit. psql's own diagnostics go to the step log;
          # this step never echoes a connection string or a generated password.
          cp_query() { # <label> <connect uri> <sql>
            if ! psql "$2" -X -v ON_ERROR_STOP=1 -tAc "$3" > "$CP_OBS/$1.json"; then
              echo "::error::cloud-cp: the ${1} catalog observation did not complete (psql exited nonzero)"
              return 1
            fi
          }
          # 1/7 — the maintenance database exactly as it is BEFORE anything is created.
          cp_query maint-pre "$CP_URI_MAINT" "$(cp_sql_database "$CP_MAINT_DB")"
          CP_MAINT_OID="$(python3 "$CP_OBS/validate.py" database --file "$CP_OBS/maint-pre.json" \
            --kind "the maintenance database before CREATE" --database "$CP_MAINT_DB" --owner postgres --print oid)"
          # 2/7 — preflight. A maintenance database that ALREADY carries cloud objects or cloud
          # per-database role settings is a finding, not something this step adopts and then
          # reports as unchanged: "equal before and after" is worthless if "before" was dirty.
          cp_query maint-objects-pre "$CP_URI_MAINT" "$(cp_sql_maintenance_objects "$CP_MAINT_OID")"
          python3 "$CP_OBS/validate.py" flags --file "$CP_OBS/maint-objects-pre.json" \
            --kind "cloud objects on the maintenance database before CREATE" \
            --keys cloud_control_present,cloud_schema_migrations_present,cloud_role_settings_present --expect false
          # 3/7 — CREATE, once. No IF NOT EXISTS, no retry, no adoption branch and no DROP: a
          # refused, duplicate or ambiguous CREATE ends the step. `TEMPLATE template0` is the
          # documented pristine template and the in-repo precedent
          # (`privilege_posture_test.go:84-86`); the owner stays the container superuser, because
          # database ownership would hand `cloud_cp_owner` implicit rights that the ACL file
          # grants explicitly at 313-316 — which is the least-privilege property the nine
          # capability roles exist to exercise.
          psql "$CP_URI_MAINT" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${CP_DB} TEMPLATE template0 OWNER postgres"
          # 4/7 — bind the object by CATALOG identity before using it. A statement that returned
          # is not custody: an absent row, two rows, a null OID or an owner that is not the
          # administrator all stop here, before the bootstrap and long before any export.
          cp_query target-pre "$CP_URI_MAINT" "$(cp_sql_database "$CP_DB")"
          CP_TARGET_OID="$(python3 "$CP_OBS/validate.py" database --file "$CP_OBS/target-pre.json" \
            --kind "the created cloud database" --database "$CP_DB" --owner postgres --print oid)"
          args=()
          for r in migrator tenant sweeper admin_ro metering_poller notifier billing \
                   customer_resolver exporter webhook_idempotency; do
            pw="$(openssl rand -hex 16)"
            args+=(-v "cloud_cp_${r}_password=${pw}")
            eval "PW_${r}=\$pw"
          done
          # 5/7 — the unchanged ACL file, applied to the bound cloud database. The file itself is
          # not edited: only its connect target moves, which is what carries its database-scoped
          # half (309-391) out of `postgres` and leaves its cluster-scoped half where it was.
          psql "$CP_URI_TARGET" \
            -X -v ON_ERROR_STOP=1 "${args[@]}" -f cloud/control-plane/deploy/cloud-control-roles.sql
          # CONTROL POSITIVO, y no es ceremonia: el guion tenia un fail-open — `\quit` IGNORA su
          # argumento, asi que `\quit 3` avisaba y salia con codigo 0. Un llamante que olvidara una
          # variable veia EXITO habiendo creado CERO roles, y el fallo reaparecia 200 lineas despues
          # como «Dirty database version 9», que no menciona roles. El guion ya esta arreglado en
          # este mismo commit; esta comprobacion existe para que este paso no pueda volver a pasar
          # sin haber hecho nada, venga el guion como venga.
          # Sigue leyendose en `/postgres` A PROPOSITO: `pg_roles` es de CLUSTER, y este control
          # mide el efecto de la mitad del guion que NO se ha movido de sitio.
          psql "$CP_URI_MAINT" -X -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='cloud_cp_owner' AND NOT rolcanlogin AND NOT rolsuper AND NOT rolbypassrls" \
            > "$RUNNER_TEMP/cloud_cp_owner.txt"
          # Se compara el fichero, no `| grep -q`: esa forma devuelve 141 bajo pipefail cuando
          # ACIERTA (SIGPIPE), y hoy mismo ha costado una jornada en check-egress-claims.sh. Aqui el
          # productor emite una linea y no podria morder, pero escribir el patron el mismo dia que
          # se ratchetea seria predicar sin aplicar.
          [ "$(cat "$RUNNER_TEMP/cloud_cp_owner.txt")" = "1" ] || { echo "::error::el bootstrap de roles no dejo cloud_cp_owner con la forma que exige la migracion 009"; exit 1; }
          # 6/7 — the postconditions on the cloud database. The identity must still be the OID,
          # name and owner this step bound (a moved OID means the object under this name is not
          # the one that was created), and PUBLIC must hold none of CONNECT, CREATE or TEMPORARY,
          # which is what 309-312 is for. The ACL is expected to have CHANGED, so it is not
          # compared with the fresh default.
          cp_query target-post "$CP_URI_MAINT" "$(cp_sql_database "$CP_DB")"
          python3 "$CP_OBS/validate.py" database --file "$CP_OBS/target-post.json" \
            --kind "the cloud database after bootstrap" --database "$CP_DB" --owner postgres \
            --match "$CP_OBS/target-pre.json" --public-false
          cp_query target-objects "$CP_URI_TARGET" "$(cp_sql_target_objects)"
          python3 "$CP_OBS/validate.py" flags --file "$CP_OBS/target-objects.json" \
            --kind "the cloud plane objects inside ${CP_DB}" \
            --keys cloud_control_present,cloud_control_owned_by_owner,schema_migrations_present,schema_migrations_owned_by_migrator --expect true
          cp_query target-settings "$CP_URI_MAINT" "$(cp_sql_settings "$CP_TARGET_OID")"
          python3 "$CP_OBS/validate.py" flags --file "$CP_OBS/target-settings.json" \
            --kind "the migrator's per-database settings on ${CP_DB}" \
            --keys migrator_role_setting_ok,migrator_search_path_ok --expect true
          # 7/7 — and the maintenance database, read with the IDENTICAL query, must be identical:
          # same OID, name, owner, null state, raw ACL text and effective PUBLIC privileges. A
          # boolean CONNECT alone could not prove the whole ACL was untouched, and a NULL `datacl`
          # replaced by an explicit ACL with the same effective privileges is still a change.
          cp_query maint-post "$CP_URI_MAINT" "$(cp_sql_database "$CP_MAINT_DB")"
          python3 "$CP_OBS/validate.py" database --file "$CP_OBS/maint-post.json" \
            --kind "the maintenance database after bootstrap" --database "$CP_MAINT_DB" --owner postgres --identical "$CP_OBS/maint-pre.json"
          cp_query maint-objects-post "$CP_URI_MAINT" "$(cp_sql_maintenance_objects "$CP_MAINT_OID")"
          python3 "$CP_OBS/validate.py" flags --file "$CP_OBS/maint-objects-post.json" \
            --kind "cloud objects on the maintenance database after bootstrap" \
            --keys cloud_control_present,cloud_schema_migrations_present,cloud_role_settings_present --expect false
          # ⛔ Y LA DSN DEL MIGRADOR ES `cloud_cp_migrator`, NO `postgres`. Ése era EL fallo, y era
          # mío: la puse apuntando al superusuario. La migración 009 hace `SET ROLE
          # cloud_cp_migrator` y a partir de ahí ya NO es superusuario, así que choca con el esquema
          # que crearon las migraciones anteriores: `must be owner of schema cloud_control`.
          # golang-migrate marca la base SUCIA y todo lo posterior sale «Dirty database version 9»,
          # que no menciona ni el rol ni la propiedad. Su propio comentario lo decía: «a migrator
          # connection normally starts as cloud_cp_owner».
          # ⛔ AND THEY ARE PUBLISHED LAST, only once every postcondition above has passed. All
          # eleven name the same database: `OpenPools` refuses a MISSING capability DSN but has no
          # check that the eleven agree on one database, so a partial retarget would not be caught
          # at boot — they move together or not at all.
          {
            # ⛔ LOS NOMBRES DE ROL SE LEYERON DEL CLUSTER, no se dedujeron de las variables. Mi
            # primer intento los derivó del nombre de la DSN —`cloud_cp_sweeper`,
            # `cloud_cp_webhook_idempotency`— y esos roles NO EXISTEN: los de sólo-lectura llevan
            # sufijo `_ro`. El error era `FATAL: role ... does not exist`, cortado en el log a
            # «FATAL: role », que no dice cuál. Los reales, consultados con
            # `SELECT rolname FROM pg_roles WHERE rolname LIKE 'cloud_cp%'`, son los de abajo.
            echo "DATABASE_MIGRATOR_URL=postgres://cloud_cp_migrator:${PW_migrator}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_TENANT_URL=postgres://cloud_cp_tenant:${PW_tenant}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            # DIRECT target, not a pooled one: this job declares one service, `postgres`, and no
            # pooler. `CLOUD_CP_POOLER`/`CLOUD_CP_REQUIRE_POOLER` are unset everywhere, so
            # `pooler_test.go` skips; retargeting this DSN with the other ten claims no pooler test.
            echo "DATABASE_TENANT_POOLED_URL=postgres://cloud_cp_tenant:${PW_tenant}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_SWEEPER_URL=postgres://cloud_cp_sweeper_ro:${PW_sweeper}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_ADMIN_URL=postgres://cloud_cp_admin_ro:${PW_admin_ro}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_POLLER_URL=postgres://cloud_cp_metering_poller_ro:${PW_metering_poller}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_NOTIFIER_URL=postgres://cloud_cp_notifier_ro:${PW_notifier}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_BILLING_URL=postgres://cloud_cp_billing:${PW_billing}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_RESOLVER_URL=postgres://cloud_cp_customer_resolver:${PW_customer_resolver}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_EXPORTER_URL=postgres://cloud_cp_exporter_ro:${PW_exporter}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
            echo "DATABASE_IDEMPOTENCY_URL=postgres://cloud_cp_webhook_idempotency_ro:${PW_webhook_idempotency}@${PGHOSTPORT}/${CP_DB}?sslmode=disable"
          } >> "$GITHUB_ENV"
      # ⛔ a repository gate, CABLEADO EL 2026-08-16 tras MEDIR que su bloqueo ya no existe. Este workflow decía
      # (línea ~454) que `lint:pg-env` «cannot come here YET: its battery … is not hermetic against
      # ambient environment on main», y que el arreglo estaba en el PR #457 — «wire it here after
      # that merges, not before». Medido hoy en el árbol del hub:
      #
      #   OLIVARES_GATE_STRICT_PG=1                        -> 3 FAIL («no superuser DSN supplied»)
      #   OLIVARES_GATE_STRICT_PG=1 + superuser DSN vivo   -> 146 passed, 0 skipped, 0 failed
      #
      # Es decir: la batería SÍ es hermética —`test-pg-test-env.sh:83` desactiva la variable y sólo
      # conserva el valor capturado para UNA decisión: que bajo régimen de promoción una fila NO
      # EJECUTADA no se cuente como pase, que es exactamente lo correcto— y lo que le faltaba no era
      # un arreglo, era **un job con Postgres**. Éste lo tiene: servicio pgvector:pg16 y
      # OLIVARES_TEST_POSTGRES_SUPERUSER_DSN exportado por el paso de provisión de arriba.
      #
      # Va DESPUÉS de esa provisión y ANTES de los tests: si el contrato de entorno PG está roto, el
      # veredicto de los tests que dependen de él no significa nada.
      - name: pg env contract (three regimes; the promotion regime needs a live server, and has one)
        id: lint-pg-env
        run: task lint:pg-env
      # ⛔ a repository gate: el contrato proto deja de derivar en silencio (2026-08-16). `release.yml:250` y
      # `mainline-ci.yml:1253` lo declaraban ungated «by the same mechanism» que dejó stale el
      # cliente web — y medido: `proto:check` tenía CERO llamantes de gate, sólo citas en comentarios.
      #
      # Va en ESTE job y no en uno propio, y no es preferencia: los contextos requeridos en `main`
      # son exactamente `control-plane`, `race-hot`, `web` y `classify`. Un job nuevo NO está en esa
      # lista —como ya demuestran `sast`, `secrets` y `fuzz`— así que sacarlo aquí fuera sería
      # quitarle el carácter bloqueante y llamarlo mejora.
      #
      # NO va al hook local: `buf generate` ESCRIBE código generado durante un push, y `buf` sólo
      # consta en el PATH del hub — cablearlo allí enrojecería a cualquier carril sin la herramienta.
      #
      # Encadenado con `&&` por la razón que este mismo fichero ya tiene escrita en el paso de
      # govulncheck: una herramienta que falló al INSTALARSE no puede ser calificada por la tarea que
      # entonces no pudo ejecutarla.
      #
      # ⛔ Y `GOPATH/bin` VA EN EL PATH EXPLÍCITAMENTE, porque no lo estaba. Primera corrida con este
      # paso: `task proto:tools` salió 0 y `proto:generate` murió con
      # `"buf": executable file not found in $PATH` (exit 127). `go install` deja el binario en
      # `$(go env GOPATH)/bin`, y ese directorio NO está en el PATH de este job — lo que despistaba
      # es que `task` sí se encuentra, así que parecía que sí lo estaba: `task` se resuelve desde
      # otra ubicación del runner, no desde ahí.
      #
      # Es el mismo modo de fallo que el `&&` de al lado existe para nombrar, un paso más abajo: la
      # herramienta se instaló bien y lo que falló fue poder EJECUTARLA.
      # ⛔ ESTE PASO SE MOVIÓ AQUÍ EL 2026-08-22, Y NO ES ORDEN COSMÉTICO.
      # Estaba en la posición 45 de 56 y el job se agota a los 75 min: en las 12 últimas corridas
      # de main salió `failure` 7 veces y `skipped` 5 — y las 5 `skipped` son corridas que se
      # QUEDARON SIN TIEMPO antes de llegar. Medido sobre el job real: la suite cuesta **24
      # segundos**, y por delante tenía **41,5 min de lints de documentación y recuentos** (el 55 %
      # del presupuesto; `public counts` sola son 14,6 min). Un rojo permanente parecía
      # intermitente según dónde cayera el corte.
      # Todo lo que necesita está provisionado en el paso 13: DSN (3), go-task (9), TMPDIR (10)
      # y los roles (11 y 12). Aquí su veredicto cuesta 24 s y no depende de que sobre tiempo.
      # ⛔ EL UNICO CONSUMIDOR REAL de las once DSN de capacidad que escribe `pg-roles-cloud`, y
      # se dice cual NO lo es porque la pregunta se hizo y se miro: `lint:pg-env` (arriba) usa la
      # DSN de SUPERUSUARIO, que la exporta otro paso; y `test:functional` (abajo) ya nombra por si
      # mismo lo que le falta —«missing capability DSNs [DATABASE_TENANT_URL …]»— en vez de callarse.
      # Este no: sin los roles muere sin decir por que, y por eso es el que se degrada.
      - name: cloud control-plane suite (the job that HAS its environment finally runs it)
        id: test-cloud-norace
        if: ${{ success() && steps.pg-roles-cloud.outputs.provisioned == 'true' }}
        # CN1 (2026-09-10): the nine-capability composite (cloud/control-plane/ninepools_test.go)
        # runs only when requested, and its required form makes TestMain fail a run in which the
        # composite did not run. The roles step above publishes the nine capability DSNs, so this
        # consumer declares both switches below instead of depending on an ambient runner
        # variable. Step-scoped on purpose: race-rest and race-full run `test:cloud` without the
        # nine roles, and the public export has no module (the NOT APPLICABLE step below).
        # The variable names appear only as keys: lint:ci-env-reach counts any mention in a job.
        env:
          CLOUD_CP_NINE_POOLS: "1"
          CLOUD_CP_REQUIRE_NINE_POOLS: "1"
        # ⛔ EL HALLAZGO DE a repository gate, y no es que faltaran flags: es que estaban en OTRO JOB.
        # Medido el 2026-08-18 sobre el arbol entero del workflow:
        #   race-rest      EJECUTA los tests del cloud (`test:cloud`) y NO fija CLOUD_CP_INTEGRATION,
        #                  ni CLOUD_CP_REQUIRE_INTEGRATION, ni las DSN por capacidad, ni provisiona
        #                  los roles cloud_cp_*.
        #   control-plane  fija los flags, provisiona los roles y escribe las diez DSN — y NO
        #                  ejecuta ninguno de esos tests.
        # Asi que «los 21 TestIntegration* ya no se saltan» era falso: el cableado y la ejecucion
        # vivian en jobs distintos, y las variables de GITHUB_ENV no cruzan de un job a otro.
        # Aqui el entorno YA existe —el servicio Postgres directo (este job no tiene pooler), roles y
        # DSN— asi que la suite corre donde esta su entorno en vez de mudar ochenta lineas de
        # provisionamiento al otro job.
        run: task test:cloud:norace
      # Un `skipped` es MUDO: quien lea el resumen vera un paso que no corrio, sin saber si fue por
      # PARTIAL o por un rojo anterior. La cualificacion parcial se dice con palabras, y se dice al
      # FINAL ademas de al principio — que es lo que la hace legible sin abrir el log entero.
      - name: NOT APPLICABLE notice — the cloud control-plane suite did not run
        if: ${{ !cancelled() && steps.pg-roles-cloud.outputs.provisioned == 'false' }}
        run: |
          echo "cloud-control-roles: NOT APPLICABLE (cloud/control-plane not exported)"
          echo "skipped 'cloud control-plane suite' (task test:cloud:norace) - it needs the capability DSNs"
      - name: proto contract (generated code matches the .proto sources)
        id: proto-check
        run: |
          # ⛔ SE FIJA `GOBIN`, no se adivina dónde cae el binario — segundo intento, y el primero
          # falló por adivinar. Puse `PATH="$(go env GOPATH)/bin:$PATH"` y `buf` SIGUIÓ sin
          # aparecer (`exit 127`, misma línea), lo que descarta que ése sea el directorio: `go
          # install` honra `GOBIN` cuando está puesto, y este runner lo tiene apuntando a otro
          # sitio. Preguntar `go env GOBIN` y caer a GOPATH/bin sería un tercer intento de
          # adivinar la máquina.
          #
          # Fijándolo aquí, instalación y búsqueda usan el MISMO directorio por construcción, y
          # deja de depender de cómo esté configurado el runner. `command -v buf` queda impreso
          # para que, si algún día vuelve a fallar, el log diga si el problema es la instalación o
          # la resolución — que es la distinción que me costó dos corridas.
          export GOBIN="${RUNNER_TEMP}/proto-bin"
          mkdir -p "$GOBIN"
          export PATH="$GOBIN:$PATH"
          task proto:tools
          echo "buf resuelto en: $(command -v buf || echo 'NO ENCONTRADO')"
          task proto:check
      - name: SPDX headers
        id: lint-spdx
        run: task lint:spdx
      # ⛔ LAS SIETE QUE SALIERON DE SOLO-GANCHO. Estaban SOLO en el gancho y quedaron anotadas
      # en an internal design note (not shipped) a lo largo del 2026-08-31 con la misma clase: HUECO,
      # no diseño. Son baterias `bash` sin dependencia de maquina, de clon hermano ni de red, asi
      # que corren igual aqui que alli, y una pata que solo vive en el gancho enrojece `main` sin
      # que CI lo vea. No se movieron entonces porque añadir patas a CI a mitad de acto se paga en
      # todas las cajas a la vez; el acto cerro y esta es la deuda que dejo.
      #
      # ⚠ Y NO son las nueve del registro: `purge-scratch:selftest` se queda fuera A PROPOSITO
      # —su autor documento que construye repositorios y sockets unix, trabajo de sistema de
      # ficheros local sin valor añadido en un runner: es CORRECTA por construccion, no un hueco—
      # y `claim-safety:selftest` es ajena, su razon corresponde a quien la movio.
      - name: c03-11 phase-R battery
        id: lint-c03-11-fase-r
        run: task lint:c03-11-fase-r:selftest
      - name: mute-pipefail ratchet
        id: lint-mute-pipefail
