  # R112/HR1 — the cmd/olivares HOT MANIFEST, four cost-balanced partitions, its own job.
  #
  # WHY IT LEFT race-rest. Job 103739990067 of run 34763378851 died at `panic: test timed out
  # after 15m0s` naming TestOrchCadencePumpRunOncePassesAllBusinessTenants, which had been
  # running 1m23s. The retained diagnosis
  # (an internal design note (not shipped)) measured the alarm dump and the
  # binary's own internal timestamps: 28 goroutines, exactly two of them blocked as long as a
  # minute, one runnable holder in flight, and every live goroutine descended from the running
  # test's goroutine — while roughly eight full composition-root estate boots at 67-80s each had
  # already spent about two thirds of the 15-minute BINARY budget. The panic names the entry in
  # flight; the selection as a whole spends the budget.
  #
  # THAT EVIDENCE SUPPORTS CUMULATIVE COST. It does not categorically refute every possible leak
  # or deadlock — it refutes the ones that dump and that run could exhibit — so this job is a
  # scheduling correction, not a certificate that nothing else can ever hang here. Go's 15-minute
  # per-binary timeout still fires, still dumps, and a partition that really hangs still goes red.
  #
  # WHAT IS AND IS NOT CHANGED. Every one of the 115 top-level entries of the fail-closed manifest
  # still runs, exactly once, under -race -count=1 with the SAME 15-minute cap. Nothing is removed,
  # skipped, quarantined or reordered, and no cap is raised. What changed is that the selection is
  # divided across four runners by scripts/race-hot-tests.sh, so each partition gets a whole
  # budget instead of a quarter of one.
  #
  # WHY A MATRIX HERE, when the 2026-07-30 note above says two DIFFERENT legs must not share one:
  # that note is about different work in one scheduling unit, where the expensive leg waits for the
  # cheap one. These four are instances of ONE leg over disjoint entry sets, each with its own
  # runner, Postgres service, step budget and concurrency group — the same shape race-sessions and
  # race-modules already use. Nothing waits for anything.
  #
  # The Postgres service, the port resolution, the cache placement, the pinned toolchain, the
  # executable TMPDIR and the role provisioning are race-rest's, unchanged and in the same order:
  # this leg has always run with that posture and moving it must not quietly give it another.
  race-hot-manifest:
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    strategy:
      # fail-fast: false for the reason race-modules and race-sessions carry it: under the
      # default the first partition to fail cancels the others, and a cancelled leg reports
      # NOTHING about the entries it was racing. The aggregate is red either way, so cancelling
      # the siblings only destroys evidence.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    name: race-hot-manifest (partition ${{ matrix.partition }})
    # The group names the partition. A job-level concurrency group is per job instance, so four
    # matrix legs sharing one string with cancel-in-progress would supersede each other.
    concurrency:
      group: mainline-ci-race-hot-manifest-${{ matrix.partition }}-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # ARITHMETIC, not a guess, and `task lint:ci-timeout-arithmetic` enforces it: the steps with
    # an explicit ceiling sum to 45 (25 precompilation + 20 run) and the job ceiling has to stay
    # above that sum plus the unmeasured setup, or GitHub kills the job before the step that
    # overran can name itself and before the failure reporter can publish. 75 leaves 30 minutes
    # for checkout, port resolution, setup-go, go-task, TMPDIR and role provisioning — the same
    # 30-minute margin race-sessions carries over its own step ceiling.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    services:
      postgres:
        # pgvector/pgvector = the official postgres image + the compiled vector
        # extension (pinned by digest, tag pg16, 2026-07-30). B5: docs call pgvector
        # the self-host production default, yet no gate ever executed it — the real
        # integration test gates on OLIVARES_TEST_VECTOR_DSN below.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # EPHEMERAL HOST PORT (2026-07-30). `5432:5432` reserved the HOST's 5432;
          # a second job on the SAME host died in "Initialize containers" with
          #   Bind for :::5432 failed: port is already allocated
          # (measured: run 30541550811, job 90901999419, dead in 10 s). This host
          # runs THREE runner installations, so the repo trips over itself. A bare
          # container port lets Docker pick a free host port; it is read below with
          # job.services.postgres.ports['5432'] from a STEP — the `job` context
          # does NOT exist in jobs.<id>.env (actionlint availability.go, case
          # "jobs.<job_id>.env").
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
    env:
      OLIVARES_GATE_STRICT_PG: "1"
      # The selectors are PAIRED and the count is strategy.job-total, not a literal: a
      # hand-written count that drifted from the matrix length would leave entries unowned, and
      # the helper refuses half a pair rather than guessing which half to believe.
      OLIVARES_HOT_RACE_PARTITION: ${{ matrix.partition }}
      OLIVARES_HOT_RACE_PARTITIONS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: resolve the ephemeral Postgres port into the test DSNs
        id: pg-port
        env:
          # `job` is only available in steps.env/steps.run/steps.with.
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
        run: bash scripts/ci-postgres-service.sh resolve
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # ⛔ MEDIDO, no preventivo: `core/runtime` fallo en este job con «the binary never
        # executed despite a matching digest», y su log enseña el plugin arrancando desde
        # /tmp. Los tests usan t.TempDir(), que honra TMPDIR y cae en /tmp — montado NOEXEC
        # en varias de estas maquinas. El test no mide lo que cree medir: mide el montaje.
        # Mismo remedio que el smoke de examples, y por la misma razon.
        run: |
          # ⛔ EJECUTABLE **Y CORTO**, y lo segundo lo aprendi rompiendolo. Al apuntar TMPDIR a
          # $RUNNER_TEMP la ruta crecio hasta 118 caracteres:
          #   …/_work/_temp/citests.XXXXXX/TestGatherDocker…/001/d.sock
          # y `sun_path` de un socket unix admite 108 → `bind: invalid argument`. Arreglar la
          # ejecucion de plugins rompio un test de sockets: las dos condiciones son reales.
          corto=""
          # ⛔ Y DICE POR QUE descarta cada candidato. La primera version solo avisaba «sin candidato
          # CORTO» y eso no es accionable: en ci-runner-7 los tres fallaron y el aviso no decia si era
          # por no existir, por no poder escribir o por no poder ejecutar. Un aviso que no nombra la
          # causa obliga a reproducir el entorno para saber que mirar.
          # ⛔ DISCO ANTES QUE /dev/shm, MEDIDO el 2026-09-16 (run 35076921214, `race-hot-manifest`
          # p3 en ci-runner-3): `go build` murio con «vet.cfg: no space left on device» bajo
          # /dev/shm/olv…/go-build…, y `race-modules` p3/p4 y el paso proto de `control-plane`
          # cayeron por lo mismo mientras dos particiones hermanas pasaban en el MISMO host: quien
          # llega primero se lleva la RAM. /dev/shm es UN tmpfs compartido por los doce runners
          # del host ci-runner-1, cada job con -race le mete gigas de arbol intermedio de Go, y
          # nadie borraba /dev/shm/olv$$ al acabar, asi que cada job cancelado dejaba el suyo.
          # $HOME es disco y sigue siendo CORTO (/home/runner/olv1234567 = 23 <= 24). Y /var/tmp DETRAS,
          # porque en los runners Hetzner HOME NO ESTA DEFINIDA (medido: run 35081963451, race-hot p1 en
          # ci-runner-8 salto el primer candidato y volvio a /dev/shm con 18187 MiB libres de 32039):
          # /var/tmp es el disco del host que si existe, mide 8 y la sonda de abajo decide si ejecuta.
          # Barrido de huerfanos ANTES de elegir: un olv* mas viejo que el timeout-minutes mayor
          # de este fichero (320) no puede pertenecer a un job vivo. Mide mtime del directorio,
          # que Go renueva al crear cada go-build*, y lo limita al usuario del runner.
          # Y MIDE el espacio libre de cada candidato antes de probarlo: el «no space left» de hoy
          # salio tres pasos mas abajo, dentro de `go build`; con la cifra aqui se lee en este paso.
          # ⛔ EL BARRIDO VA EN SU PROPIO BUCLE, y es una correccion MEDIDA: F2 de la revision
          # independiente del 2026-09-16 (an internal design note (not shipped)).
          # Dentro del bucle de seleccion solo alcanzaba a los candidatos probados ANTES del `break`,
          # asi que con /var/tmp elegido /dev/shm NO SE BARRIA NUNCA — justo el tmpfs cuyo residuo
          # tumbo la corrida 35076921214 y que en la 35081963451, con el barrido ya enviado, seguia
          # al 43 % (18187 MiB libres de 32039). Reproducido aqui: con el barrido dentro del bucle
          # los arboles viejos de /dev/shm y /run/user sobreviven; con este bucle aparte, no.
          # ⛔ Y BARRE TAMBIEN `olv-exec-<pid>` (F5). Censo de los nombres que los guiones de este
          # repositorio crean DENTRO de un candidato: `olv$$`, este paso; y `olv-exec-$$`, la sonda
          # `probar` de `hook-only-legs` en mainline-ci.yml. El respaldo `olivares_pick_exec_workdir o`
          # crea `o.XXXXXX` y NO se barre a proposito: el patron `o.??????` casaria nombres ajenos
          # (`o.config` mide exactamente seis), y un barrido solo se amplia a patrones que no puedan
          # casar lo que no es nuestro. Los parentesis del `find` NO son decorativos: sin ellos `-o`
          # reparte los predicados, el `-exec` cuelga solo de la segunda rama y llega a borrar
          # FICHEROS que no son directorios. Medido en las dos formas antes de elegir esta.
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -n "$c" ] && [ -d "$c" ]; then
              find "$c" -maxdepth 1 -mindepth 1 -type d \( -name 'olv[0-9]*' -o -name 'olv-exec-[0-9]*' \) -user "$(id -un)" -mmin +360 -exec rm -rf {} + 2>/dev/null || true
            fi
          done
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -z "$c" ]; then echo "  candidato <vacio>: variable sin definir"; continue; fi
            if [ ! -d "$c" ]; then echo "  candidato $c: NO EXISTE"; continue; fi
            # ⛔ `|| true` AL FINAL, y es una correccion MEDIDA: F3 de la revision independiente del
            # 2026-09-16. El bloque corre bajo `bash --noprofile --norc -eo pipefail` (asi ejecuta
            # GitHub un `run:` con `defaults.run.shell: bash`), asi que un `df` que falle sobre un
            # montaje que se va entre el `[ -d ]` y esta linea MATA EL PASO — y con el, el respaldo
            # `exec-workdir.sh` de abajo, que es lo que convierte esto en degradacion suave.
            # Reproducido con esa misma shell: la tuberia aborta el bucle, no imprime nada y el
            # texto posterior al bucle no se alcanza (rc 1). Una MEDIDA no decide el paso.
            df -Pk "$c" 2>/dev/null | awk -v c="$c" 'NR==2{printf "  candidato %s: %d MiB libres de %d en %s\n", c, $4/1024, $2/1024, $1}' || true
            d="$c/olv$$"
            if ! mkdir -p "$d" 2>/dev/null; then echo "  candidato $c: no puedo crear dentro"; continue; fi
            if ! printf '#!/bin/sh\nexit 7\n' >"$d/.p" 2>/dev/null; then echo "  candidato $c: no puedo escribir"; rm -rf "$d"; continue; fi
            chmod +x "$d/.p" 2>/dev/null || { echo "  candidato $c: chmod falla"; rm -rf "$d"; continue; }
            rc=0; "$d/.p" 2>/dev/null || rc=$?
            rm -f "$d/.p"
            if [ "$rc" -ne 7 ]; then echo "  candidato $c: NO EJECUTA (rc=$rc; 126 = noexec o sin permiso)"; rm -rf "$d"; continue; fi
            if [ "${#d}" -gt 24 ]; then echo "  candidato $c: ejecuta pero la ruta mide ${#d} (>24)"; rm -rf "$d"; continue; fi
            corto="$d"; break
          done
          if [ -n "$corto" ]; then
            echo "TMPDIR=$corto" >> "$GITHUB_ENV"
            echo "TMPDIR corto y ejecutable: $corto (${#corto} caracteres)"
          else
            . scripts/lib/exec-workdir.sh
            d="$(olivares_pick_exec_workdir o)" || {
              echo "::error::ningun directorio permite ejecutar un binario"
              exit 1
            }
            echo "TMPDIR=$d" >> "$GITHUB_ENV"
            echo "::warning::sin candidato CORTO; uso $d (${#d} caracteres): un socket unix puede pasarse de 108"
          fi
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        id: pg-roles
        env:
          PGPASSWORD: postgres
        run: bash scripts/ci-postgres-service.sh provision
      - name: prove the partition before spending the Postgres
        id: partition-control
        # The union control and its battery, on the exact tree being raced. An entry no
        # partition owns is never raced while all four legs stay green, which is the one
        # failure here that a red cannot warn about. The push gate runs the same battery.
        # No timeout-minutes on purpose — a step with one is a "leg" to
        # scripts/check-ci-sibling-legs.sh, and this job's leg is the race below.
        run: task lint:hot-race-partition
      # Precompile the shared cache before ordinary Go tests; each step has its own diagnostic.
      # The 25-minute compile ceiling is provisional. The runner's compile duration is unknown.
      # Keep the 20-minute run ceiling above the unchanged 15-minute test timeout.
      #
      # The precompilation is NOT partition-aware and must not become so: it builds the one
      # dependency closure all four partitions share, so each leg warms its own runner's cache.
      - name: race (cmd/olivares hot manifest, cache precompilation)
        id: race-hot-manifest-build
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.pg-roles.outcome == 'success' && steps.partition-control.outcome == 'success' }}
        timeout-minutes: 25
        env:
          RACE_HOT_BIN: ${{ runner.temp }}/race-hot.test
        run: task test:race-hot:hot:build 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-hot-build-${{ matrix.partition }}.log" && rm "$RUNNER_TEMP/ci-fail-race-hot-build-${{ matrix.partition }}.log"
      - name: race (cmd/olivares hot manifest, one anchored cost-balanced partition)
        id: race-hot-manifest
        # It runs the CANONICAL task — ordinary `go test` under the Postgres wrapper, through the
        # reviewed argv-runner helper — and takes its speed from the cache the step above warmed.
        # There is no alternate binary runner: the executable the wrapper runs stays statically
        # namable, which is what keeps cmd/olivares/tools/checkpgwiring able to answer at all.
        # The partition comes from the job env above, not from the command.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.pg-roles.outcome == 'success' && steps.partition-control.outcome == 'success' && steps.race-hot-manifest-build.outcome == 'success' }}
        timeout-minutes: 20
        run: task test:race-hot:hot 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-hot-manifest-${{ matrix.partition }}.log"
      # The hot leg was the one -race leg in race-rest whose log was teed and then deleted
      # without ever being measured, while race-workspace, race-core and race-sessions fed
      # theirs to this census. A leg at 100% of its cap reads identical to one at 40% until it
      # dies.
      #
      # `if: always()` because the measurement matters MOST when the step above failed.
      # `continue-on-error: true` because this instrument warns and must never decide the job:
      # the Go test result stays authoritative and the headroom verdict stays diagnostic.
      - name: timeout headroom census (warns above 75%, does not block)
        if: always()
        continue-on-error: true
        run: bash scripts/check-test-timeout-headroom.sh --raw race-hot-manifest "$RUNNER_TEMP/ci-fail-race-hot-manifest-${{ matrix.partition }}.log"
      # ⛔ NOTHING DELETES THE LOG. The neighbouring legs used to end their census with `&& rm`, which
      # previously kept the file only when the checker answered nonzero — so a run that failed BELOW the
      # warning threshold, a detected data race at 40% of budget, has its log removed by the
      # success of the very step that was supposed to preserve it. The log is uploaded here on
      # both outcomes, and `.github/actions/pr-failure-report` still tails it in place on
      # failure, so it always reaches a consumer before anything can remove it.
      - name: retain the partition log (both outcomes; a below-threshold failure keeps it too)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-hot-manifest-${{ matrix.partition }}-log
          path: ${{ runner.temp }}/ci-fail-race-hot-manifest-${{ matrix.partition }}.log
          if-no-files-found: warn
          retention-days: 14
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  #the aggregator that KEEPS `race-hot` a single, stable required-check
  # context. scripts/apply-branch-protection.sh requires the context `race-hot` and
  # its header states the invariant it relies on — "the check context is the job id
  # … so every job always reports". The -race work therefore lives in the
  # `race-modules` / `race-rest` jobs above, and this job re-exposes the old
  # context name. It must FAIL when either leg fails: `needs` alone would skip
  # it, and a skipped required check does not block.
  race-hot:
    # Seconds-long aggregator (measured 5s on ci-runner-3, run 30728347248): it must
    # never wait behind hour-long race legs for a HEAVY runner slot. All four runners
    # carry ci-light (srv17 included), so this is strictly more capacity — and the
    # verdict semantics below (red on failure/cancelled/skipped) are untouched.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [classify, race-modules, race-rest, race-core, race-sessions, race-hot-manifest]
    # always() so a FAILED leg still produces the aggregate verdict below — but gated
    # on the classify answer: a journal-only push runs no -race legs on purpose, and
    # this aggregate skipping WITH them is the honest shape (its own `skipped` alarm
    # below is for legs that vanish while code DID change).
    if: ${{ always() && needs.classify.outputs.code == 'true' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `race-modules` has been four jobs since 2026-09-11 and this loop did not have to
      # change, which is worth writing down because "it still parses" is not the same claim
      # as "it still judges". `needs.<job>.result` for a matrix job is the aggregate of all
      # its legs: the dependent job does not start until every leg has finished, and the
      # value is `success` only when every leg succeeded. One failing partition makes it
      # `failure` and a cancelled one makes it `cancelled`; both fall into the red arms
      # below. `fail-fast: false` does not soften that — it only stops the siblings from
      # being cancelled, and their verdicts are still folded into this one value.
      - name: every -race job must have succeeded (or be honestly reported as not run)
        env:
          RESULT_MODULES: ${{ needs.race-modules.result }}
          RESULT_REST: ${{ needs.race-rest.result }}
          RESULT_CORE: ${{ needs.race-core.result }}
          RESULT_SESSIONS: ${{ needs.race-sessions.result }}
          # R112/HR1. MANDATORY, not advisory: the hot manifest moved out of race-rest into its
          # own four-way matrix, so without this line the aggregate would have gone green with
          # the entire cmd/olivares root manifest unraced. `needs.<job>.result` for a matrix job
          # is the aggregate of ALL its legs — `success` only when every partition succeeded —
          # so one failed, cancelled or vanished partition lands in a red arm below, and
          # `fail-fast: false` does not soften that: it stops the siblings from being cancelled
          # and their verdicts are still folded into this one value.
          RESULT_HOT_MANIFEST: ${{ needs.race-hot-manifest.result }}
        run: |
          verdict=0
          for pair in "race-modules=$RESULT_MODULES" "race-rest=$RESULT_REST" "race-core=$RESULT_CORE" "race-sessions=$RESULT_SESSIONS" "race-hot-manifest=$RESULT_HOT_MANIFEST"; do
            job="${pair%%=*}"; result="${pair#*=}"
            echo "$job result: $result"
            # AN EMPTY RESULT IS THE `missing` CASE AND IT IS RED. `needs.<job>.result` expands
            # to the empty string when the job id does not exist — a rename, a deletion, a bad
            # merge — and an empty string matching no arm would have fallen through a `case`
            # with no default. It has one, and this names the state instead of inheriting it.
            case "$result" in
              success) ;;
              "")
                echo "::error::$job reported NO result at all — the job id does not exist in this workflow, so nothing raced those packages."; verdict=1 ;;
              # Since 2026-07-30 the -race legs are UNCONDITIONAL, so `skipped` can only
              # mean the workflow was edited or the job failed to schedule. Either way
              # this run carries no race verdict, and a green check that quietly stopped
              # checking is worse than no check: fail, do not warn.
              skipped)
                echo "::error::$job was SKIPPED, but the -race legs are unconditional since 2026-07-30 — this run carries NO race verdict for it."; verdict=1 ;;
              # Still red — a run without a race verdict must never read green — but
              # named for what it is. `cancelled` means concurrency superseded this
              # run, so the verdict belongs to the run that cancelled it; saying
              # "did not succeed" sends whoever reads it hunting a race that isn't there.
              cancelled)
                echo "::error::$job was CANCELLED (a newer push superseded this run), so this run carries no race verdict — read the verdict off the run that replaced it."; verdict=1 ;;
              *) echo "::error::$job did not succeed ($result)"; verdict=1 ;;
            esac
          done
          [ "$verdict" -eq 0 ] || exit 1
          echo "-race legs passed."

  # The embedded console's own gate: typecheck (tsc -b), DTCG token
  # freshness, and the vitest unit/component suite — the console's structural
  # guards (a11y route coverage, i18n usage, icon uniqueness) previously ran in
  # NO gate. The console is
  # go:embed'd into the binary, so a red suite means a release ships it broken.
  a11y:
    # `at:gate` (axe-core WCAG 2.2 A+AA sobre las 59 rutas, dos temas) existia escrito y NO lo
    # ejecutaba nadie: medido el 2026-08-24, su UNICA mencion en hooks y workflows era un
    # COMENTARIO en .githooks/pre-push:1146 — el que cuenta lo que cuesta un gate jamas ejecutado,
    # citandolo a el como ejemplo. Corrido esa noche por primera vez encontro una ruta que caia al
    # error boundary sin medirse y, al hacerla renderizar, un `heading-order` REAL que el crash
    # tapaba. Un gate que nadie corre no es neutro: certifica.
    #
    # ⛔ VA EN JOB PROPIO Y NO DENTRO DE `web`, y la razon esta escrita en el propio `web` unas
    # lineas mas abajo: es uno de los CUATRO contextos REQUERIDOS por la proteccion de rama, viene
    # pasando en 44,3 min contra un techo de 75 —11 % de margen— y su paso de vitest no tiene
    # guarda propia, asi que ese techo es el unico y al dispararse cancela lo que queda y el rojo
    # sale MUDO. Añadirle ~6 min a un contexto con esa historia seria cambiar cobertura nueva por
    # el riesgo de volver a tumbar el que ya es obligatorio.
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    concurrency:
      group: mainline-ci-a11y-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # MEDIDO, no elegido: `task at:gate` tardo 343 s (5,7 min) en un contenedor de desarrollo, mas
    # el build de web y la instalacion de deps. El techo se pone sobre la duracion medida CON
    # HOLGURA y no pegado a ella — la leccion que el job `web` pago nueve corridas seguidas, donde
    # un timeout se reporta como `cancelled` y se lee como flake durante dias.
    #
    # ⛔ 30 -> 45, y lo pidio el gate, no yo. Al añadir el paso de `console:walk` la suma de las
    # guardas de paso llego a 30 —exactamente el techo—, y `lint:ci-timeout-arithmetic` lo rechazo:
    # «techo 30, suma de pasos 30 (+7 paso(s) sin guarda). Reparacion: sube el techo del job por
    # encima de la suma, o baja los de sus pasos». Tenia razon: con techo == suma, el primer paso
    # que agote su guarda deja al job sin margen para los SIETE sin guardar (checkout, node, pnpm,
    # deps, navegador, subida del informe), y el fallo lo cobraria el techo del JOB, que GitHub
    # reporta como `cancelled` y se lee como flake. 45 deja 15 min para esos siete.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # VA ANTES DE setup-node/setup-go: estos runners pueden no tener $HOME, y un arreglo colocado
      # DESPUES del paso que falla sale verde donde ya funcionaba y sigue rojo donde no.
      - name: caches under RUNNER_TEMP (this runner may have no $HOME)
        run: |
          echo "PNPM_HOME=$RUNNER_TEMP/pnpm" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NODE FIRST: pnpm/action-setup instala pnpm A TRAVES de npm, asi que necesita un node en
      # PATH. El orden inverso es lo que tumbo `web` y `control-plane` en los runners Hetzner.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # `dest` EXPLICITO: sin el la accion se auto-instala en ~/setup-pnpm y el servicio del
          # runner corre con HOME=/root, donde ya murio dos veces.
          dest: ${{ runner.temp }}/setup-pnpm
          standalone: true
      - name: install web deps (frozen lockfile)
        id: a11y-deps
        run: pnpm --dir web install --frozen-lockfile
      # ⛔ DOS capas de la MISMA trampa, y la segunda me mordio despues de arreglar la primera.
      #    (1) El paso decia «same form as drills-nightly», y ESA forma nunca se ha ejecutado:
      #        drills-nightly sale `skipped` en todas sus corridas (`vars.CI_NIGHTLIES` no existe).
      #        Ademas corria `npx playwright install` desde la RAIZ, con las deps en web/.
      #    (2) Lo cambie a `pnpm --dir web run e2e:install` por ser «el script de casa» — y ESE
      #        script (web/package.json:24) lleva `--with-deps`, que intenta instalar librerias de
      #        sistema con sudo. El runner NO tiene sudo sin contrasena:
      #            «sudo: a terminal is required to read the password» -> Failed to install browsers
      #        Ese script tampoco se habia ejercitado NUNCA en CI.
      #    La forma que SI esta ejercitada es esta, y la documentan CUATRO guiones de casa
      #    (web-e2e.sh:27, web-visual-e2e.sh:16, docs-captures.sh:17, web-e2e-demo.sh:14) mas
      #    console-walk.mjs:242: `playwright install chromium`, SIN --with-deps, desde web/.
      - name: install the chromium playwright drivers (web/, pinned by the project)
        id: a11y-browser
        run: pnpm --dir web exec playwright install chromium
      # `task at:gate` es exactamente estos dos pasos, y se escriben aqui en vez de instalar go-task
      # solo para invocarlos: menos piezas que puedan fallar por su cuenta en el runner.
      - name: axe-core WCAG 2.2 A+AA over both themes
        id: a11y-gate
        # GUARDA DE PASO, y no es adorno: `lint:ci-timeout-arithmetic` cuenta cuantos jobs con techo
        # la tienen (18 de 23 al escribir esto) porque un techo de JOB se reporta como `cancelled`,
        # se lee como flake y cancela los pasos siguientes sin decir cual murio — asi estuvo `web`
        # nueve corridas seguidas. Con esta guarda, si el barrido se cuelga el rojo sale AQUI y con
        # nombre. 20 sobre 5,7 min medidos deja holgura sin llegar al techo del job.
        timeout-minutes: 20
        # ⛔ TRES RESPUESTAS, NO DOS, y la del medio es la que este paso existe para no tapar.
        # El veredicto de PRODUCTO lo lleva axe, que mide DENTRO de la pagina y funciona: si axe
        # reporta violaciones, esto es rojo y no hay matiz. La pasada de CONTRASTE es un
        # instrumento aparte, y hoy tiene un defecto abierto (REL-69): sobre un bundle recien
        # construido devuelve el `--foreground` para las dos lecturas y las 1 247 parejas salen
        # con fg == bg y ratio 1, mientras axe no ve ni una violacion. Reproducido en local el
        # 2026-08-31: contra el dist commiteado, 9 fallos; contra el reconstruido —CSS byte a
        # byte identico salvo un `12`->`7`— 1 247 de 1 247, en los dos temas.
        #
        # Sin este reparto solo caben dos finales, y los dos son malos: 1 247 rojos falsos que
        # nadie investiga, o un verde callado que esconde que el instrumento no midio. Aqui la
        # negativa de la guarda (rc=3) sale como AVISO con sus cifras y con el numero de la fila
        # que la sigue. Un «no he podido medir» se convierte en verde RUIDOSO, nunca en silencio.
        #
        # ⛔ rc=0 SE MIRA ANTES DE LOS GREP. Corrida 33926027726 (f1f530e96, 2026-09-04):
        # at:gate escribió «0 blocking issue(s)» en oscuro y en claro, axeBlock=0 en 59×2,
        # crashedRoutes=0, y este paso salió 1. Causa: tras capturar rc=0, el diagnostic
        # `grep -oE 'parejas miden fg == bg' | head -1` bajo pipefail — un log limpio no
        # trae esa línea (es el síntoma REL-69), grep sale 1, head cierra, y set -e pinta
        # de rojo un gate verde. Misma clase que `cmd | head`. Los grep son del
        # camino rc=3; no se corren si el producto ya contestó 0. Y el que queda no usa
        # tubería a head: `grep -c` con 0 coincidencias ya iba con `|| true`.
        run: |
          set +e
          pnpm --dir web run at:gate 2>&1 | tee "$RUNNER_TEMP/ci-fail-a11y.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "0" ]; then
            rm -f "$RUNNER_TEMP/ci-fail-a11y.log"
            exit 0
          fi
          axe=$(grep -c 'axeBlock=1' "$RUNNER_TEMP/ci-fail-a11y.log" || true)
          degenerado=$(grep -oE '[0-9]+ de [0-9]+ parejas miden fg == bg' "$RUNNER_TEMP/ci-fail-a11y.log" || true)
          degenerado=${degenerado%%$'\n'*}
          if [ "$rc" = "3" ] && [ "${axe:-0}" -eq 0 ]; then
            echo "::warning title=a11y: contraste NO MEDIDO (REL-69)::La guarda se nego a dar veredicto de contraste (${degenerado:-parejas degeneradas}). axe no reporta violaciones, asi que el veredicto de PRODUCTO es limpio; el que falta es el del INSTRUMENTO. Defecto abierto: la sonda devuelve el mismo color para primer plano y fondo sobre un bundle recien construido. Seguimiento en REL-69."
            rm -f "$RUNNER_TEMP/ci-fail-a11y.log"
            exit 0
          fi
          if [ "$rc" = "3" ]; then
            echo "::error title=a11y::axe reporta violaciones Y el contraste no se pudo medir: el rojo lo manda axe."
          fi
          exit "$rc"
      # `test:console-walk`: 15 casos contra binarios y respuestas SENUELO, no contra un motor vivo
      # — comprueba que `console:walk` distingue sus tres respuestas (stream vs stall vs 404) y que
      # su «no pude mirar» dice DONDE mira. Era otro de los ocho gates que el censo de encontro
      # sin alcanzar por nadie, y su motivo de seguir ciego es el mismo que el de `at:gate`: necesita
      # las deps de web. Medido el 2026-08-24: en un arbol SIN `web/node_modules` sale rc=1 diciendo
      # «the walk could not look (exit 2). That is not a clean run and not a verdict» —contrato de
      # tres respuestas, bien dado— y con las deps, rc=0. Por eso va AQUI y no en el carril rapido:
      # colgarlo del hook amurallaria cualquier caja sin instalar el web.
      - name: console:walk tells its three answers apart (decoys, no live engine)
        id: a11y-console-walk
        # Guarda de paso, misma razon que la del barrido: un techo de JOB se reporta `cancelled`.
        timeout-minutes: 10
        # `task test:console-walk` seria `task: command not found` aqui: este job no instala
        # go-task, por la razon escrita doce lineas mas arriba. Se invoca su guion, que es lo que
        # la tarea hace (`Taskfile.yml:4609`).
        run: bash scripts/test-console-walk.sh 2>&1 | tee "$RUNNER_TEMP/ci-fail-console-walk.log" && rm "$RUNNER_TEMP/ci-fail-console-walk.log"
      # El informe se sube SIEMPRE. Su valor no esta solo en el rojo: lleva `crashedRoutes`, que es
      # la lista de rutas cuyo resultado describe una pagina de error y no su contenido — un dato
      # que el codigo de salida NO refleja, porque el `exit` depende solo de `blocking.length`.
      - name: keep the report (it carries crashedRoutes, which the exit code does not)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: at-report-${{ github.run_id }}
          path: web/e2e-visual/__at__/*.json
          if-no-files-found: warn
          retention-days: 14

  web:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-web-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # ⛔ SUBIDO DE 20 A 35 EL 2026-08-19, y no por comodidad: este job NO HABIA
    # TERMINADO NI UNA VEZ en las ultimas nueve corridas. Duraciones: 19,6 · 20,4 · 20,4 min medidos, TODAS agotando el limite de 20.
    # GitHub reporta un timeout de job como `cancelled`, asi que se leia como
    # flake o cancelacion manual durante dias — un rojo cronico disfrazado de ruido.
    # Y en el caso de `web` importa el doble: es uno de los CUATRO contextos REQUERIDOS
    # por la proteccion de rama, asi que no podia satisfacerse nunca.
    # La causa probable es contencion: nueve runners sobre menos maquinas fisicas ejecutan
    # mas jobs a la vez. Si estas duraciones bajan, este numero baja con ellas.
    # 35 → 50 el 2026-08-19, MEDIDO: con 35 paso en **34,3 min**, o sea a 42 SEGUNDOS del
    # limite. Eso no es margen, es suerte: el mismo job con un runner mas cargado vuelve a
    # morir, y volveria a leerse como `cancelled` — que es como estuvo NUEVE corridas.
    # Un limite se pone sobre la duracion medida con holgura, no pegado a ella.
    # ⛔ 50 -> 75 el 2026-08-22. Es contexto REQUERIDO y venia pasando en 44,3 min: 11 % de margen.
    # Ademas su paso de vitest NO tiene guarda propia, asi que este techo es el unico, y este techo
    # no reporta: al dispararse cancela los pasos que quedan y el rojo sale mudo.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    steps:
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NODE FIRST, AND THAT ORDER IS THE FIX (2026-08-05). pnpm/action-setup installs pnpm
      # THROUGH npm, so it needs a node on PATH — and it used to sit ABOVE setup-node because
      # setup-node's `cache: pnpm` needs pnpm to already exist. On the Hetzner runners, which
      # ship no node, that cycle cannot be satisfied: mainline-ci 30982224609 lost `web` on
      # ci-runner-1 and `control-plane` on ci-runner-3, both at that step, with
      # `npm ERR! ... paths[0] ... received undefined`. `standalone: true` did NOT help and the
      # action's own docs say why: it installs @pnpm/exe, which is still an npm package.
      # So node is installed FIRST and `cache: pnpm` is dropped — a store cache is worth less
      # than a job that runs at all, and these runners keep their disk between jobs anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # ⛔ `dest` EXPLICITO. Sin el, la accion se auto-instala en `~/setup-pnpm`, y el servicio
          # del runner corre con HOME=/root: el 2026-08-19 murio ahi dos veces, primero con
          # ERR_PNPM_BROKEN_PNPM_INSTALL (127) y luego con «ENOENT … chmod
          # '/root/setup-pnpm/node_modules/.bin/store/v11/links/…'» (254). Fijar PNPM_HOME NO basta:
          # no cambia donde la ACCION se instala a si misma, solo donde pnpm guarda sus binarios.
          dest: ${{ runner.temp }}/setup-pnpm
          # standalone installs @pnpm/exe, which does not need a node at RUN time. It is kept
          # for that reason only: it does NOT remove the node this step needs to INSTALL, which
          # is why the setup-node above it is the actual fix and must stay above it.
          standalone: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: install go-task (pinned) — web:check is a Task, so the runner needs it
        # MEASURED 2026-09-14 (run 34854565361): compiling go-task with `go install` cost 4–6 min
        # per job; the composite action installs the pinned, SHA-256-verified release tarball
        # from the runner tool cache and proves it is reachable.
        id: web-tools
        uses: ./.github/actions/olivares-tool-cache
      - name: install web deps (frozen lockfile)
        id: web-deps
        run: pnpm --dir web install --frozen-lockfile
      - name: typecheck the embedded console (tsc -b)
        id: web-typecheck
        run: pnpm --dir web run typecheck 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-typecheck.log" && rm "$RUNNER_TEMP/ci-fail-web-typecheck.log"
      # THE npm HALF OF THE SUPPLY-CHAIN STORY, and until 2026-08-07 it did not exist:
      # measured, zero occurrences of npm audit / pnpm audit / osv-scanner / dependency-review
      # anywhere in .github/workflows or the Taskfile, while `govulncheck` had guarded the Go
      # half for months. The console these packages BUILD is embedded in the published binary
      # (core/internal/webui/dist), so a compromised build-time dependency travels inside the
      # very artifact whose signature the README advertises.
      #
      # IT LIVES IN THIS JOB ON PURPOSE, and not in a tidy job of its own. The required
      # contexts on `main` are exactly control-plane, race-hot, web and classify; a new job
      # would NOT be one of them (as sast, secrets and fuzz already demonstrate), so the neat
      # split would have produced a release-blocking gate that branch protection ignores.
      # `web` is required, so here it is enforced.
      #
      # `!cancelled()` for the same reason the Go vuln-gate carries it: a vulnerability verdict
      # that goes silent whenever an earlier step failed is missing exactly when it matters.
      - name: npm/JS dependency vulnerabilities (findings block; unavailable registry is advisory)
        id: web-npm-vuln
        # An observed high/critical advisory remains red. Only rc=2 (registry/tool could not look)
        # is advisory in mainline; direct/release callers retain the gate's fail-closed contract.
        # ⛔ Y ADEMAS exige que la cadena de herramientas EXISTA. `!cancelled()` sola hace que
        # este gate corra cuando un paso anterior fallo o se SALTO, y entonces canta
        # «task: command not found» — que es la consecuencia. Medido 2026-08-18: pnpm murio
        # en el paso 3, los pasos 4-7 se saltaron (incluida la instalacion de go-task) y el
        # rojo lo cobro este, mandando a investigar el PATH en vez de pnpm.
        if: ${{ !cancelled() && steps.web-tools.outcome == 'success' }}
        timeout-minutes: 15
        run: bash scripts/run-network-observation.sh npm-advisory-registry -- bash scripts/npm-vuln-gate.sh 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-npm-vuln.log" && rm "$RUNNER_TEMP/ci-fail-web-npm-vuln.log"
      - name: DTCG design-token freshness (committed tokens.css matches sources)
        id: web-tokens
        run: pnpm --dir web run tokens:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-tokens.log" && rm "$RUNNER_TEMP/ci-fail-web-tokens.log"
      # THE FORMATTING RATCHET, AND IT RUNS ON THE PR, not only when a change lands. `prettier
      # --check` sits in `format:check`, which hangs off `lint:web` (this gate skips it on purpose)
      # and off `fmt:check` — and until today NO workflow invoked either, so 191 files under
      # web/ did not pass the formatter and nothing in the repository said so. It prints the
      # census on every run and fails ONLY when the set of offenders grows: the control exists from
      # day one without blocking anyone behind a 191-file batch. The baseline is a LIST and not a
      # count, because a count lets substitution through — one file fixed, another broken, total
      # unchanged, ratchet silent.
      - name: Formatting ratchet (census printed; fails only if the debt rises)
        id: web-format-ratchet
        run: task lint:format-ratchet 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-format-ratchet.log" && rm "$RUNNER_TEMP/ci-fail-web-format-ratchet.log"
      # THE CONSOLE'S PERMISSION CHECKS MUST AGREE WITH THE ENGINE (reshaped by).
      # web/src/lib/auth/rbac.ts USED to re-implement RoleGrants in TypeScript, and the copy was
      # the more permissive of the two, so the console offered actions the backend answers 403
      # to. Since the engine hands each grant its effective permission set in whoami and
      # can() is set membership — which MOVES the failure mode: a string the engine declares
      # nowhere can now be in no set, so the action is hidden for every role, forever, with no
      # 403 to notice it by. The gate still catches it, and it also catches can() growing verb
      # arithmetic back on top of the lookup. This is the load-bearing
      # placement: the pre-push hook runs it too, but a hook is a client and --no-verify skips
      # it. THIS job is where both halves exist — the console's own TypeScript from the pnpm
      # install above, and the Go toolchain the check needs to run the engine (`go run
      # ./tools/permsdump`) rather than model it. It is deliberately not in the Go-only jobs:
      # without node_modules the check exits 2 by design and would report a red that is about
      # the environment, not the code.
      - name: console permission checks agree with the engine
        id: web-console-perms
        run: task lint:console-perms 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-console-perms.log" && rm "$RUNNER_TEMP/ci-fail-web-console-perms.log"
      # Full ESLint stays out while unrelated pre-existing react-hooks errors
      # remain. The Vitest suite still runs the exact no-raw-palette ESLint rule
      # over features/ and filters only that rule's findings, so the new guard is
      # load-bearing without hiding or expanding the existing lint debt.
      - name: web unit/component tests (vitest)
        id: web-test
        # --maxWorkers=2 bounds the suite's aggregate memory: vitest defaults to one
        # worker per core, and on the self-hosted runner that footprint OOM-killed
        # the runner service itself mid-suite (repeated "shutdown signal" failures).
        # Invoke vitest directly: `pnpm run test -- --maxWorkers=2` renders as
        # `vitest run -- --maxWorkers=2`, and behind `--` vitest treats the flag as a
        # name filter — the cap silently never applied (proven in run 30214868317).
        run: pnpm --dir web exec vitest run --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-test.log" && rm "$RUNNER_TEMP/ci-fail-web-test.log"
      # THE PRODUCTION BUILD ITSELF (2026-07-29). Until now this job typechecked
      # and unit-tested the console but never ran `vite build` — and no other gate
      # did either: the hook and this workflow call `build:go` (Taskfile.yml:118-130),
      # which does NOT depend on `build:web` (:112-116); only the `build` task
      # (:49-53) does, and no gate invokes it.
      #
      # So the one artifact that actually ships — core/internal/webui/dist, which is
      # `//go:embed all:dist` into the binary — was never produced by any gate.
      # tsc and vitest do not cover what a production build covers: rollup
      # resolution, asset handling, chunking, the vite config itself.
      #
      # This step closes the BUILD half. The STALENESS half — the committed bundle
      # drifting from web/src, which is measurable today (bundle dated 2026-07-25,
      # 13 web/src files changed since) — needs the Vite build to be byte-reproducible
      # before a `git diff --exit-code` check like proto:check (Taskfile.yml:661-665)
      # can be trusted not to flake.
      #
      # ⛔ «That measurement is in flight» YA NO ES CIERTO — 2026-08-18, y la condición
      # que esta nota pone POR ESCRITO está satisfecha por partida doble:
      #   * the orchestrator: dos `pnpm run build` consecutivos en un worktree desechable,
      #     mismo node_modules, dieron 224/224 con el MISMO SHA-256 (41 s y 39 s).
      #   * el mantenedor, sobre un árbol con base `main` y `pnpm install
      #     --frozen-lockfile`: el build reescribió los 224 ficheros de
      #     core/internal/webui/dist y `git status` sobre esa ruta salió VACÍO — el
      #     bundle commiteado es byte a byte lo que produce el fuente de hoy.
      #
      # ⇒ Eso contesta además la pregunta que la nota daba por abierta: el bundle NO
      # está caducado. La comparación que sugería lo contrario (135 ficheros distintos
      # en una rama, 199 en main) se hizo con `web/pnpm-lock.yaml` y `web/package.json`
      # DISTINTOS entre los dos árboles: medía el árbol de dependencias equivocado, no
      # la deriva del bundle.
      #
      # Lo que queda no es la medición: es DECIDIR si un doble build permanente vale
      # ~80 s por corrida para re-demostrar una propiedad ya estable, cuando la mitad
      # de staleness que esta nota condiciona ya existe en `web:check`. Es decisión del
      # INTEGRADOR (INT-17); el check no ha aterrizado por eso, no por falta de dato.
      - name: build the embedded console and fail if the committed bundle is stale
        id: web-build
        # `task web:check` builds and then diffs, because the console is a COMMITTED
        # build artifact (core/internal/webui/dist, //go:embed all:dist). Measured
        # 2026-07-29: the committed bundle was 214 files, a rebuild produced 213, and
        # `otlp_log_record` appeared 9 times in the rebuild and ZERO times in the
        # committed bundle — a reviewed, unit-tested feature absent from the console
        # that ships. Two builds from a clean snapshot were byte-identical across all
        # 213 files, so this diff is signal, not build nondeterminism.
        run: task web:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-web-build.log" && rm "$RUNNER_TEMP/ci-fail-web-build.log"
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # THE LICENCE WORKER'S OWN NET. `task test:license-worker` existed but NO gate ran it —
  # its own description said so ("Not in the Go gate: the worker is TypeScript and changes
  # rarely — run this whenever ... changes"), and `grep -rn license-worker .github/workflows/`
  # returned nothing. That made every guarantee in commercial/license-worker a HABIT: it held
  # only while a human remembered to type the command.
  #
  # Measured cost of that: a mutation removing the zero-length-HMAC-key guard
  # (`whsec_` alone -> a key anyone can reproduce, and in the Worker a THROWN DataError, i.e.
  # a 500 rather than a 401) left all 15 unit tests green; only the Go conformance runner,
  # which nothing scheduled, saw it. And `npm run typecheck` was RED on main with ten errors
  # that no one was looking at.
  #
  # Deliberately UNFILTERED by path. A path filter here would be the same deadlock
  # documented for required checks, and the inputs are not only this directory: the Go
  # conformance vectors come from commercial/commerce/internal/inbox/testdata and the wire
  # format from core/license. The job is a few minutes of Node; it runs.
  license-worker:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-license-worker-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    # ⛔ GOCACHE EXPLICITO, Y NO ES OPTIMIZACION: SIN EL, ESTE JOB MUERE EN `go env`.
    # Medido el 2026-08-18, dos veces, en `ci-runner-4`: `setup-go` instala bien —«Successfully set
    # up Go version 1.26.6»— y el comando siguiente cae con
    #   build cache is required, but could not be located: GOCACHE is not defined and neither
    #   $XDG_CACHE_HOME nor $HOME are defined
    # Ese runner corre SIN `$HOME`. Cualquier job de Go que aterrice ahi muere en lo PRIMERO que
    # hace `setup-go` despues de instalar, y el fallo no se parece en nada a su causa.
    #
    # Se fija con `runner.temp`, que es POR JOB y POR RUNNER a proposito: este repositorio ya midio
    # que tres runners compartiendo una GOCACHE colisionan, asi que una ruta comun cambiaria un
    # fallo ruidoso por uno silencioso. Esto no TAPA el aprovisionamiento —los runners 4..9 siguen
    # sin entorno completo y eso sigue escalado (INT-07)—: quita una dependencia IMPLICITA de $HOME
    # que este job nunca declaro tener.
    steps:
      - name: Go caches under RUNNER_TEMP (this runner has no $HOME)
  # ⛔ Y GOPATH TAMBIEN, porque el primer arreglo se quedo corto y el error nuevo lo dijo exacto:
  #   initializing sumdb.Client: could not locate sumdb file: missing $GOPATH: HOME is not set
  # GOCACHE y GOMODCACHE arreglaron la cache de build; el cliente de sumdb resuelve su fichero por
  # GOPATH, que por defecto cuelga de $HOME. Sin las tres, `go install` muere al VERIFICAR el modulo,
  # no al compilarlo — y ese mensaje no se parece en nada al anterior aunque la causa sea la misma.
        # ⛔ COMO PASO Y NO COMO `env:` DE JOB, y lo cazó `lint:actions` veinte minutos despues de que yo
        # empujara la version equivocada: el contexto `runner` NO existe a nivel de job —«context "runner"
        # is not allowed here»— asi que aquel YAML era invalido. Aqui si existe.
        #
        # POR QUE HACE FALTA: medido dos veces el 2026-08-18 en ci-runner-4, `setup-go` instala bien y el
        # comando siguiente muere con «GOCACHE is not defined and neither $XDG_CACHE_HOME nor $HOME are
        # defined». Ese runner corre SIN $HOME. RUNNER_TEMP es por job y por runner a proposito: este
        # repositorio ya midio que tres runners compartiendo GOCACHE colisionan.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      # `npm ci`, not `npm install`: the lockfile is the pin. In the PUBLIC export this
      # directory does not exist, and private-leg.sh answers NOT APPLICABLE for the task
      # below — so this step is guarded the same way rather than failing on a missing dir.
      - name: install worker deps (locked)
        id: worker-deps
        run: |
          if [ -d commercial/license-worker ]; then
            npm --prefix commercial/license-worker ci --no-audit --no-fund
          else
            echo "commercial/license-worker is absent (public export); nothing to install"
          fi
      # typecheck + conformance (Go-authored vectors) + unit tests + hermetic E2E.
      - name: licence Worker gate (typecheck · Go↔TS conformance · units · hermetic E2E)
        id: worker-gate
        run: task test:license-worker 2>&1 | tee "$RUNNER_TEMP/ci-fail-license-worker.log" && rm "$RUNNER_TEMP/ci-fail-license-worker.log"
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # The examples/ directory is the self-serve adopter's copy-paste path. Each
  # example's smoke.sh runs its documented commands against the REAL binary and
  # asserts the outcome — governed Claude Code tool-calls (allow/deny/rewrite), the
  # OpenTelemetry GenAI ingest → FinOps cost path, and the connector scaffold
  # (build + lifecycle test + license boundary). A broken example is worse than none,
  # so this gates them: if an example's README stops being true, main goes red.

  # ⛔ LAS BATERIAS DE LOS SDK NO LAS CORRIA NADIE. Medido el 2026-08-26: existen
  # `sdk:test:python`, `sdk:test:ts` y `sdk:test:java` y las TRES tienen cero invocaciones
  # —hook 0, FAST_LINTS 0, workflows 0, `deps:` 0—. La unica que si corre es `sdk:check`, y
  # NO ejecuta tests: su cuerpo es un `git diff --exit-code` contra el codigo generado, o sea
  # que comprueba RANCIEDAD, no comportamiento. Su nombre invita a contarla como cobertura.
  #
  # Lo que mas expone: `clients/java` son 11 ficheros y 14 084 lineas, con `pom.xml`
  # (`ai.olivares:olivares-client`) — es decir, un ARTEFACTO PUBLICABLE — y 39 commits en 30
  # dias. Ninguna caja de la flota tiene JDK ni Maven, asi que nadie ha podido correrla nunca:
  # ni el contraste del sol ni el integrador. No se sabe si pasa. Eso es lo que este job
  # contesta.
  #
  # ⚠ NO ESTA EN LOS CHECKS REQUERIDOS A PROPOSITO, y no es timidez: una bateria que no se ha
  # ejecutado JAMAS puede salir roja el primer dia, y ponerla como requerida convertiria un
  # hallazgo en un bloqueo del tronco para los cinco carriles. Sale ROJA de verdad —no es un
  # aviso que no puede fallar, que es justo el antipatron que este repositorio persigue— pero
  # no cierra la puerta hasta que se sepa su color. Cuando este verde de forma estable, se
  # promueve a requerida y se anota la fecha del primer run real en
  # `docs/contracts-tests-terraform.md:13`, cuya frase «already had thorough test
  # suites» es CIERTA y engaña: existir una bateria y ejecutarse una bateria son dos hechos.
  #
  # ⭐ YA SE SABE SU COLOR, y la parte de arriba que decia «no se sabe si pasa» queda en pasado.
  # Medido el 2026-09-05 en el worktree java-sdk con herramienta LOCAL de la tarea (Temurin
  # 17.0.20.1+1 y Apache Maven 3.9.16, los dos verificados por checksum): `mvn -B clean test`
  # da BUILD SUCCESS con 33 tests —JsonTest 14 y ClientTest 19— y cero fallos. ⇒ el rojo de la
  # corrida 33951517673 era del ENTORNO y no de la suite. Lo que sigue faltando para promoverla
  # a requerida es lo que esta linea siempre pidio: un run REAL en CI, no una medida local.
  sdk-tests:
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    concurrency:
      group: mainline-ci-sdk-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: redirect caches out of HOME (the runner service runs with HOME=/root)
        run: |
          # Agrupado por DESTINO, que es lo que SC2129 pide y además lo hace legible: dos
          # ficheros distintos, dos bloques, en vez de seis redirecciones sueltas alternando.
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          {
            echo "$RUNNER_TEMP/gopath/bin"
            echo "$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      # NODE ANTES QUE PNPM: pnpm/action-setup instala pnpm A TRAVES de npm, asi que necesita
      # un node en PATH. En los runners de Hetzner, que no traen node, el orden inverso no se
      # puede satisfacer. Y `dest` explicito, o la accion se auto-instala en ~/setup-pnpm con
      # HOME=/root y muere. Las dos trampas estan medidas en el job `control-plane`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      # Pin VERIFICADO contra la API el 2026-08-26: v6.0.0 (publicado el 08-24).
      # El primer SHA que escribi salio de memoria y, aunque existia, era un commit
      # cualquiera y no un tag de release. Un pin de accion no se teclea de memoria.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      # Shared task runner must be installed before Maven: a Java download failure
      # must leave the Python and TypeScript suites runnable under if: always().
      - name: install go-task
        run: go install github.com/go-task/task/v3/cmd/task@v3.45.4
      # MAVEN NO LO TRAE `setup-java`, Y ESTE PASO ES EL ARREGLO DE UN ROJO MEDIDO.
      # Corrida 33951517673, job sdk-tests, paso "sdk tests - java": murio en UN segundo con
      #
      #     "mvn": executable file not found in $PATH
      #     task: Failed to run task "sdk:test:java": exit status 127
      #
      # aplastado por `task` a 201, que no se distingue de una suite rota sin abrir el log.
      # `actions/setup-java` instala el JDK y NO instala Maven: en las imagenes github-hosted
      # `mvn` viene preinstalado y por eso esto nunca se noto, pero los runners self-hosted a
      # los que apunta CI_RUNNER no lo traen (esta corrida murio en ci-runner-6). Es la misma
      # clase que `check-workflow-node-setup.sh` fija para node — "el runner trae la
      # herramienta" es una comodidad del runner hospedado, nunca un contrato.
      #
      # Fijado por VERSION y por CHECKSUM, y el digest no se teclea de memoria: el .sha512 se
      # verifico el 2026-09-05 contra las DOS fuentes de Apache (dlcdn y archive), que
      # devolvieron el mismo valor. El espejo dlcdn solo guarda la version corriente, asi que
      # archive.apache.org va de respaldo permanente cuando 3.9.16 deje de ser la ultima.
      - name: install Maven (pinned + checksum)
        env:
          MAVEN_VERSION: '3.9.16'
          MAVEN_SHA512: '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6'
        run: |
          dest="$RUNNER_TEMP/maven-$MAVEN_VERSION"
          tgz="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          rel="maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$tgz" "https://dlcdn.apache.org/$rel" ||
            curl -fsSL --retry 3 --retry-all-errors -o "$tgz" "https://archive.apache.org/dist/$rel"
          echo "$MAVEN_SHA512  $tgz" | sha512sum -c -
          mkdir -p "$dest"
          tar -xzf "$tgz" -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"
      # INSTALAR NO ES ALCANZAR, y esta casa ya lo pago: un `go install` salio VERDE y tres
      # pasos despues la herramienta no estaba en el PATH, asi que el rojo lo cobro un gate
      # ajeno. Se comprueba USANDO la herramienta, y en un paso APARTE porque `$GITHUB_PATH`
      # solo surte efecto en los pasos SIGUIENTES: comprobarlo dentro del que instala mide
      # otro PATH que el que veran las suites.
      - name: Maven reachable on PATH
        run: |
          command -v mvn || { echo "::error::Maven se instalo y no esta en el PATH (PATH=$PATH)"; exit 1; }
          mvn -v
      # Cada bateria en SU PASO: si van juntas, la primera que falle esconde a las otras dos y
      # el primer veredicto de tres suites que nunca han corrido es justo el que hay que ver
      # entero. `if: always()` para que las tres hablen aunque una muera.
      - name: sdk tests — python
        if: always()
        run: task sdk:test:python
      - name: sdk tests — typescript
        if: always()
        run: task sdk:test:ts
      - name: sdk tests — java
        if: always()
        run: task sdk:test:java

  examples:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-examples-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 30 -> 60 el 2026-08-22. ⚠ Y ESTE JOB NO ESTABA FALLANDO: the orchestrator midio su historial
    # —21 · 22 · 24 min contra el techo de 30, siempre verde— y tiene razon en que la aritmetica
    # SOLA lo habria reportado como si mordiera. NO muerde. Lo que se arregla aqui es su MODO DE
    # FALLO el dia que muerda: con 30 sobre una suma de pasos de 45, el primero en disparar seria
    # el techo del JOB, que cancela los pasos restantes y sale MUDO, en vez de la guarda del paso,
    # que nombra cual se colgo.
    #
    # ⇒ Y el arreglo MEJOR no es este: es apretar los `timeout-minutes` de sus PASOS hasta cerca de
    # lo observado, que satisface la invariante Y sigue matando pronto un cuelgue de verdad. No lo
    # hago hoy porque no tengo las duraciones POR PASO, solo la del job, y apretar una guarda sin
    # su medida fabrica rojos falsos. Subir el techo no puede producir ninguno: un techo acota, no
    # reserva. Cuando alguien mida los pasos, este numero debe BAJAR.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: pick a temp dir where an extracted binary can actually run
        # ⛔ NO ES PREVENTIVO. Medido el 2026-08-18 en ci-runner-6 y ci-runner-7: el smoke de
        # otel-genai muere con «fork/exec …: permission denied» sobre un plugin que el extractor
        # deja en 0700 A PROPOSITO (cmd/olivares/firstparty/embed.go:90). El bit esta puesto: lo
        # que falla es que `_work` esta montado NOEXEC en esas maquinas, y ahi cae por defecto
        # `$ROOT/.examples-tmp`. El ejemplo NO se toca —es artefacto publico y ya honra la
        # variable—: el conocimiento del entorno es del CI, y aqui vive.
        #
        # El directorio no se elige, se PRUEBA: lib/exec-workdir.sh crea un ejecutable de verdad
        # y lo ejecuta. Si ningun candidato sirve, este paso falla NOMBRANDO la causa, que es
        # mucho mejor que un deny-closed tres capas mas abajo diciendo «source not wired».
        run: |
          . scripts/lib/exec-workdir.sh
          # ⛔ --traversable-by-others, y NO es una precaucion de mas. El smoke arranca el motor,
          # que si corre como root baja cada plugin a un uid DEDICADO no-root: «yo puedo ejecutar
          # aqui» y «puede ejecutar aqui ese uid» son preguntas distintas. Medido en ci-runner-7:
          # la sonda pasaba —somos el dueño— y el plugin no arrancaba porque /home/runner es
          # -rwx------ y el hijo no puede ATRAVESARLO. El fallo salia tres capas mas abajo como
          # «source not wired», y solo se supo por la pista del loader, que nombra el ancestro.
          d="$(olivares_pick_exec_workdir examples-smoke --traversable-by-others)" || {
            echo "::error::ningun directorio candidato es ejecutable Y atravesable por otro uid (RUNNER_TEMP, TMPDIR, /tmp, HOME). El smoke lanza plugins bajo un uid dedicado y no puede correr aqui."
            exit 1
          }
          echo "OLIVARES_SMOKE_TMPDIR=$d" >> "$GITHUB_ENV"
          echo "cadena de $d:"
          p="$d"; while :; do printf '  %s %s\n' "$(stat -c '%a' "$p")" "$p"; [ "$p" = "/" ] && break; p="$(dirname "$p")"; done
      - name: examples smoke (governed hooks · OTel GenAI · connector scaffold)
        id: smoke
        timeout-minutes: 25
        run: task smoke:examples 2>&1 | tee "$RUNNER_TEMP/ci-fail-examples.log" && rm "$RUNNER_TEMP/ci-fail-examples.log"
      # ⛔ THE SEVEN READMEs WE PUBLISH SAY "CI walks the same path: `task smoke:quickstart`",
      # AND UNTIL NOW NOTHING IN .github/ REFERENCED IT. The task exists and works; it was simply
      # never wired, so the quickstart's install→value path and its drift numbers were unwatched.
      # The numbers were true — what was false is that anything was keeping them true.
      #
      # It runs HERE rather than in a job of its own because it needs the same thing the examples
      # smoke needs (a built binary and go-task) and shares its 30-minute budget, and because the
      # two are the same promise: a documented path that still works.
      - name: quickstart smoke (the path the READMEs promise CI walks)
        id: smoke-quickstart
        timeout-minutes: 20
        run: task smoke:quickstart 2>&1 | tee "$RUNNER_TEMP/ci-fail-quickstart.log" && rm "$RUNNER_TEMP/ci-fail-quickstart.log"
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # The FIPS-mode build was only ever exercised on a v* release tag (goreleaser),
  # so a change that broke GOFIPS140=v1.0.0 would land on main unnoticed.
  # This builds the olivares in native FIPS 140-3 mode and runs the full
  # self-check (module #5247 linked, runtime toggle, `version` self-report).
  fips:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-fips-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
