      # ramas VIVAS de otros carriles. Y `an internal design note (not shipped)` ya lo midio antes que
      # yo: misma carga, 2,7x de dispersion entre corridas ⇒ el coste de este job es CONTENCION del
      # runner, no alcance. Recortar refs no era la palanca.
      #
      # ⚠ Si alguien reintroduce una poda: `git remote prune` NO es el `git prune`/`git gc` que el
      # repositorio prohibe sobre el clon compartido de desarrollo, donde lo «inalcanzable» es trabajo
      # sin publicar y habria borrado 417 commits el 2026-08-20. La prohibicion protege un CONTENIDO,
      # no un comando. Pero necesita credencial: reintroducirla exige medida que la pague, y una
      # salida que distinga «no habia nada» de «no pude».
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
