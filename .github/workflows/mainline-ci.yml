      #
      # `actions/checkout` NO borra el clon entre jobs en un runner autoalojado, asi que las ramas
      # de otros carriles se acumulan como refs de seguimiento. Medido el 2026-08-21 en el informe
      # del propio gate (incidencia #1499): gitleaks recorrio **9 264 commits**, de los que **1 590
      # NO son de este ref** — el **17,2 %** del barrido. Y ese residuo no es solo coste: es el
      # ORIGEN del quinto hallazgo de aquel dia, uno «NOT reachable from HEAD» que el propio gate
      # manda arreglar «limpiando el clon del runner, NO eximiendolo desde una rama».
      #
      # El job vive a ~39 min con un tope de 45. Quitar el 17 % de un trabajo que se pasa por un 1 %
      # es la diferencia entre un gate que a veces termina y uno que termina siempre.
      #
      # ⚠ ESTE `prune` NO ES EL QUE EL REPOSITORIO PROHIBE. Aquel es `git prune`/`git gc` sobre el
      # CLON COMPARTIDO DE DESARROLLO, donde lo «inalcanzable» es trabajo sin publicar de otros
      # carriles (habria borrado 417 commits el 2026-08-20). Aqui es `git remote prune`, que borra
      # solo refs de SEGUIMIENTO que ya no existen en el servidor, en un checkout de CI donde no
      # hay trabajo de nadie. **La prohibicion protege un CONTENIDO, no un comando.**
      #
      # No falla nunca: es una optimizacion, no un control. Y IMPRIME el antes y el despues, para
      # que la proxima corrida diga si compro margen en vez de que haya que suponerlo.
      - name: prune tracking refs other branches left in this persistent clone
