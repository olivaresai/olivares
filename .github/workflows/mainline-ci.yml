      #    nada que podar como si la poda murio. Un contador de diferencias no distingue «limpio» de
      #    «no pude mirar» — que es justo la tercera respuesta que este gate si sabe dar.
      #
      # 2. LA CORRECCION YA NO DEPENDE DE ESTO. La acusacion falsa de #1499 la cura hoy el propio
      #    guion: `scripts/check-secrets.sh:355-360` sale 0 cuando NINGUN hallazgo es alcanzable desde
      #    HEAD, y `:304-316` imprime la columna «reachability» de cada uno. Por eso el paso de abajo
      #    se llama «charges only what HEAD reaches». La poda defendia coste, no verdad.
