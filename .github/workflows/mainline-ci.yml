      # The flat install manifest is GENERATED from the chart (C5) but its drift
      # gate never ran in CI — Bumped the chart to 0.2.0 and the committed
      # install.yaml kept 0.1.0 labels unnoticed. Helm is installed
      # pinned + checksum-verified (same pattern as provider-ci's OpenTofu).
      - name: install helm (pinned, checksum-verified)
        id: helm
        run: |
          # No sudo: self-hosted runners prompt for a password. RUNNER_TEMP/bin +
          # GITHUB_PATH keeps the checksum-pinned binary and works on any runner.
          url="https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "${url}"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install-manifest drift (chart vs deploy/manifests/install.yaml)
