      # development documentation does not ship publicly). This is the ratchet that replaced
      # `lint:adr-sync` — it fails if any ADR page, ADR-shaped filename, live link to the
      # withdrawn route or the generator itself returns to docs-site.
      - name: ADR section stays off the public docs site
        id: lint-adr-not-published
        run: task lint:adr-not-published
      # ⛔ `-x` PARA QUE EL ROJO SEA ATRIBUIBLE (2026-08-16). Esta tarea encadena CUATRO guiones
      # (`check-docs-honesty.sh`, `check-format-docs.sh --selftest`, `check-format-docs.sh`,
      # `check-ocsf-claims.sh`) y `task` sólo dice «Failed to run task "lint:docs-honesty"». Medido
      # ese día: el job `control-plane` —contexto REQUERIDO— salió rojo aquí y el log NO permite
      # saber cuál de los cuatro falló; los cuatro pasan por separado en el hub (rc=0 cada uno) y la
      # tarea entera también, así que la causa vive en CI y desde el hub no se ve.
      #
      # `-x` hace que `task` imprima cada comando antes de ejecutarlo, así que el último eco antes
      # del fallo NOMBRA al culpable. No duplica la lista en el workflow —que sería la desigualdad
      # declarado/ejecutado que este repositorio lleva todo el día pagando—: sigue siendo la tarea
      # la que decide qué corre.
      - name: documentation honesty (capability and supply-chain wording)
        id: lint-docs-honesty
        run: task -x lint:docs-honesty
      - name: security.txt RFC 9116 honesty/freshness (presence, unexpired, contact in sync)
        id: lint-security-txt
        run: task lint:security-txt
      # Commercial canon consistency. ENFORCING, and this comment says so because
      # for a while it said the opposite. It claimed REPORT MODE and told the reader to
      # set COMMERCE_LINT_MODE=-strict to harden it. Both halves were false by
      # 2026-08-02: the task runs -strict and a divergence is a red build (the canon's
      # own rule — "el paquete commerce añade el lint al export gate: divergencia =
      # build rojo"), and COMMERCE_LINT_MODE no longer exists. That variable was REMOVED
      # deliberately: it was interpolated as shell text, so the mode was caller-
      # selectable from the environment (sol-max B14). A comment pointing the next
      # reader at a variable whose existence was the defect is worse than no comment.
      # The mode is pinned in Taskfile lint:commerce; use lint:commerce:report to
      # inspect without failing.
      - name: commercial canon consistency (public surfaces vs design/PRICING-CANON.md)
        id: lint-commerce
        run: task lint:commerce
      # The add-on set derivation and its battery. Both were reachable ONLY from the pre-push hook,
      # a client-side file anyone can bypass with --no-verify or core.hooksPath — so the one place
      # where the answer is binding never asked the question. A contrast measured what that costs:
      # a canon re-indent made the deriver emit a HOLD-GATED module as shipping, exit 0, no warning.
      #
      # ⚠ THE TWO DO NOT GUARD THE SAME THING, and the difference is measured, not assumed. With the
      # refusal deleted from the deriver, `lint:addon-sets` still exits 0 — the real canon carries no
      # offending key, so a weakened refusal changes nothing it can see. `lint:addon-sets-gate`
      # exits non-zero, because its witnesses feed the shapes the canon does not have yet.
      #
      # So: the GATE is the safety property, and the deriver is the canary for the canon we actually
      # ship. Dropping either leaves a real hole — and dropping the gate is the one that would let a
      # gated module through in silence.
      - name: add-on sets still derive from today's canon (the canary)
        id: lint-addon-sets
        run: task lint:addon-sets
      - name: the add-on set battery — the refusal's own witnesses (the safety property)
        id: lint-addon-sets-gate
        run: task lint:addon-sets-gate
      # Public-export gate: the #1 publication blocker, made non-regressable. Fails
      # if any tracked path is unclassified (leak-by-default) or any internal ref/identity
      # leaks into the curated public tree. This is the enforcement that a local `git push
      # --no-verify` cannot skip. Runner /tmp is exec-capable; the task points TMPDIR at a
      # repo-local dir regardless (harmless here, required in the noexec dev container).
      - name: public-export leak gate (classification + internal-ref sweep)
        id: lint-export
        run: task lint:export
      # The flat install manifest is GENERATED from the chart (C5) but its drift
      # gate never ran in CI — Bumped the chart to 0.2.0 and the committed
      # install.yaml kept 0.1.0 labels unnoticed. Helm is installed
      # pinned + checksum-verified (same pattern as provider-ci's OpenTofu).
      - name: install helm (pinned, checksum-verified)
        id: helm
        run: |
          # No sudo: self-hosted runners prompt for a password. RUNNER_TEMP/bin +
          # GITHUB_PATH keeps the checksum-pinned binary and works on any runner.
          url="https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" "${url}"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/helm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install-manifest drift (chart vs deploy/manifests/install.yaml)
        id: manifests-check
        timeout-minutes: 10
        run: task manifests:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-manifests.log" && rm "$RUNNER_TEMP/ci-fail-manifests.log"
      - name: build every workspace module
        id: build-go
        timeout-minutes: 20
        run: task build:go 2>&1 | tee "$RUNNER_TEMP/ci-fail-build-go.log" && rm "$RUNNER_TEMP/ci-fail-build-go.log"
      # NOTE: the -tags enterprise surface (multi-IdP SSO, content firewall, server-tool
      # egress, incident close-loop, threat-intel, hook hardening, Conjur, seats) moved to
      # the private enterprise distribution; it is no longer buildable from this repo.
      - name: build + test the -tags release trust-anchor seams
        id: release-seams
        timeout-minutes: 20
        # The tag-less gate never compiles embedded_release.go; exercise it here.
        # test:release runs the no-key (license-key=none) safe-degradation path; the
        # build:release mints two THROWAWAY public keys (no production private key in
        # CI) to prove the two independent -X injections compile. The domain test
        # then proves neither corresponding private key crosses into the other trust
        # domain and exercises the embedded community OTA anchor end-to-end.
        # EVERY command in this group is &&-CHAINED, and that is load-bearing
        # (2026-08-01). The `&& rm` suffix puts the whole pipeline inside an
        # AND-list, which SUSPENDS errexit for its left operand — so a newline-
        # separated group ran on after a failure and the step was graded by its
        # LAST command alone. Measured, with `bash -e -o pipefail`:
        #   { false; echo SECOND; } | cat && echo PASSED    -> SECOND, PASSED, 0
        #   { false; echo SECOND; } | cat                   -> 1
        #   { false && echo SECOND; } | cat && echo PASSED  -> 1
        # Five verifications hung on that: a failing `task test:release` was
        # invisible whenever `task test:archive-gate` passed. The intent of the
        # suffix (drop the log on success, keep it for the failure reporter) is
        # unchanged; it just no longer disarms the group it decorates.
        #
        # The two keygens are ASSIGNED and then exported separately, because
        # `export X="$(cmd)"` reports EXPORT's status — always 0 — while a bare
        # assignment propagates the substitution's. Also measured today.
        run: |
          {
            task test:release &&
            OLIVARES_LICENSE_PUBKEY="$(go run ./cmd/olivares license keygen | awk '/public_key/{print $2}')" &&
            OLIVARES_OTA_PUBKEY="$(go run ./cmd/olivares license keygen | awk '/public_key/{print $2}')" &&
            export OLIVARES_LICENSE_PUBKEY OLIVARES_OTA_PUBKEY &&
            task build:release &&
            task test:key-domains &&
            # And that the OTA phase-2 archive gate rejects a substituted archive BEFORE
            # anything out of it executes (the circular-bootstrap regression).
            task test:archive-gate
          } 2>&1 | tee "$RUNNER_TEMP/ci-fail-release-seams.log" && rm "$RUNNER_TEMP/ci-fail-release-seams.log"
      # Split race gate (2026-07-24): the full -race suite is wall-clock-bound by
      # cmd/olivares's long-poll e2e tail (~36m on a generous box, more on a 2-vCPU
      # runner — over the per-binary go-test ceiling). On push we run the FULL suite
      # without -race (correctness, no coverage lost) plus -race on the concurrency-hot
      # paths (every module but the cmd/olivares root + the root's hot tests via the
      # fail-closed scripts/race-hot-tests.sh manifest). The full -race sweep runs
      # WEEKLY in race-full.yml. Bounded CI minutes, no silent race gap.
      - name: test (functional, no -race)
        id: test-functional
        # ⛔ 45 -> 120 el 2026-08-23. Este paso NO se pasó de largo: TOPÓ. Duró **2713 s contra un
        # techo de 2700** —trece segundos— en la corrida 32605874242, así que fue CORTADO, y por
        # tanto la lista de tests fallidos que publicó era el PREFIJO de una corrida truncada, no
        # el inventario. Es la misma forma que convirtió «cinco rojos heredados» en OCHO el 08-22.
        #
        # Y debajo mordía un SEGUNDO techo, el del binario: cuatro paquetes murieron en el mismo
        # número —`panic: test timed out after 15m0s`, 900,09x s— con un quinto al 88 %. Ése sube a
        # 45m en el Taskfile, en este mismo commit; sin subir también ÉSTE, el paso seguiría
        # cortando antes de que el presupuesto nuevo sirviera para nada.
        #
        # `control-plane` es uno de los cuatro contextos que la protección de `main` EXIGE: mientras
        # los dos techos muerdan no puede dar veredicto completo ni ponerse verde. 120 es COTA, no
        # medida — ninguno de los cuatro paquetes ha TERMINADO nunca en esta pata.
        timeout-minutes: 120
        # ⛔ Y EL PASO PUBLICA SUS PROPIAS CIFRAS DE MAQUINA, TAMBIEN CUANDO MUERE. El 2026-09-19
        # este paso acabo en `The runner has received a shutdown signal` y exit 143 a los 19 min
        # de entrar en el paquete raiz, con el log mudo: ni memoria, ni procesos, ni disco. El
        # trap salta con el TERM del propio paso —la senal que manda el runner al irse— asi que
        # las tres cifras sobreviven justo a la muerte que las necesita. El testigo nunca tumba
        # un paso: responde COULD NOT LOOK y sale 0.
        #
        # `set -euo pipefail` y el `rm` en su propia linea conservan la disciplina que esta
        # cabecera ya exige (:181): el estado de salida es el de `task` y no el del `tee`, y el
        # log de fallo solo se borra cuando el paso ha ido bien.
        run: |
          set -euo pipefail
          WITNESS="$RUNNER_TEMP/resource-witness-functional.txt"
          bash scripts/ci-resource-witness.sh start "$WITNESS" >/dev/null
          witness_said=""
          witness() {
            if [ -z "$witness_said" ]; then
              witness_said=yes
              bash scripts/ci-resource-witness.sh report "$WITNESS"
            fi
          }
          trap witness EXIT TERM
          task test:functional 2>&1 | tee "$RUNNER_TEMP/ci-fail-test-functional.log"
          rm "$RUNNER_TEMP/ci-fail-test-functional.log"
      # NOTE: test:race-hot moved to the parallel `race-hot` job (2026-07-24) —
      # the workspace -race leg alone exceeded this job's old budget.
      - name: client SDK codegen drift (snapshot → Go/Python/TS operation layers)
        id: sdk-check
        # ⛔ MISMA GUARDA QUE `vuln-gate` CUARENTA LINEAS ABAJO, Y POR LA MISMA RAZON — que ya
        # esta escrita alli (:1242-1250) y que este paso no habia recogido: «RUNS EVEN IF AN
        # EARLIER STEP FAILED … la diferencia entre un veredicto rancio y ninguno».
        #
        # MEDIDO EL 2026-08-29, cuatro corridas de `push` sobre CUATRO SHA distintos —
        # 33243672255 (08:39Z, e07ecaf78), 33251264671 (11:55Z, 466da5b67), 33254801927
        # (13:21Z, e4b49eb5b) y 33263227272 (16:32Z, 59db1e733)— y las cuatro identicas:
        #
        #     paso 46  test (functional, no -race)  FAILURE
        #     paso 47  client SDK codegen drift     SKIPPED   <- sin guarda
        #     paso 48  dependency vulnerabilities   SUCCESS   <- CON guarda: hablo igual
        #     paso 49  OpenAPI snapshot + drift     SKIPPED   <- sin guarda
        #     paso 50  compliance catalog drift     SKIPPED   <- sin guarda
        #
        # El paso 48 es el control positivo de que la guarda funciona: el UNICO de los cuatro
        # que dio veredicto es el unico que la lleva. ⇒ tres comprobaciones llevan TODO EL DIA
        # sin medirse sobre ninguno de esos arboles, y ninguna estaba rota: estaban tapadas.
        # `!cancelled()` y no `always()`, por lo mismo que dice el paso 48.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 15
        run: task sdk:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-sdk-check.log" && rm "$RUNNER_TEMP/ci-fail-sdk-check.log"
      - name: dependency vulnerabilities (findings block; unavailable live DB is advisory here)
        id: vuln-gate
        # RUNS EVEN IF AN EARLIER STEP FAILED, and that is not tidiness — it is the
        # difference between a stale verdict and none at all. This is step 36 of 45 in a
        # job that takes ~28 minutes, so ANY earlier failure used to muzzle it: measured
        # `skipped` in runs 31102617448 and 31079028250, which means the freshest CI run
        # carried NO vulnerability verdict while looking like it had one. A release-blocking
        # gate that goes quiet exactly when the build is unhealthy is the wrong way round.
        #
        # Mainline is allowed to report the live database as unavailable because a runner's route
        # is not a tree verdict; an observed called vulnerability still blocks. Release and
        # rehearsal invoke the gate directly and remain fail-closed.
        # `!cancelled()` and not `always()`: a cancelled run must stay cancelled rather than
        # spend 15 minutes producing a verdict nobody asked for.
        #
        # ⚠ WHY NOT ITS OWN JOB, which is the obvious move and is a TRAP: the required
        # contexts on `main` are exactly control-plane, race-hot, web and classify
        # (`gh api repos/.../branches/main/protection`). A new job is NOT one of them — as
        # `sast`, `secrets` and `fuzz` already demonstrate — so moving this step out would
        # take a release-blocking gate OFF the required set and call it an improvement.
        # Splitting it needs to add the context first; this line does not.
        # ⛔ Y ADEMAS exige que la cadena de herramientas EXISTA. `!cancelled()` sola hace que
        # este gate corra cuando un paso anterior fallo o se SALTO, y entonces canta
        # «task: command not found» — que es la consecuencia. Medido 2026-08-18: pnpm murio
        # en el paso 3, los pasos 4-7 se saltaron (incluida la instalacion de go-task) y el
        # rojo lo cobro este, mandando a investigar el PATH en vez de pnpm.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          {
            # &&-chained: see the release-seams step for the measurement. A tool
            # that failed to INSTALL must never be graded by the task that then
            # could not have run it.
            go install golang.org/x/vuln/cmd/govulncheck@v1.3.0 &&
            bash scripts/run-network-observation.sh govulncheck-live-db -- bash scripts/govulncheck-gate.sh
          } 2>&1 | tee "$RUNNER_TEMP/ci-fail-vuln-gate.log" && rm "$RUNNER_TEMP/ci-fail-vuln-gate.log"
      #the console's typed client comes from the SAME snapshot as the SDKs
      # above but via openapi-typescript (node), so openapi:check needs BOTH
      # toolchains — and it was wired into no gate. sdk:check cannot stand in: its
      # diff lists only clients/ outputs (Taskfile.yml:587-591). The snapshots ARE
      # covered there (the generator binds both files' bytes into SPEC_HASH,
      # clients/generator/main.go:135); the web client is not. That is how 4863ca00
      # added seven console routes, regenerated clients/, and still left
      # web/src/lib/api/openapi.gen.ts stale with main green. NOTE: proto:check
      # (Taskfile.yml:539-543) is ungated by the same mechanism — a separate change,
      # it needs the pinned buf/protoc toolchain budgeted.
      - name: OpenAPI snapshot + web client codegen drift
        id: openapi-check
        # ⛔ MISMA GUARDA QUE `vuln-gate` CUARENTA LINEAS ABAJO, Y POR LA MISMA RAZON — que ya
        # esta escrita alli (:1242-1250) y que este paso no habia recogido: «RUNS EVEN IF AN
        # EARLIER STEP FAILED … la diferencia entre un veredicto rancio y ninguno».
        #
        # MEDIDO EL 2026-08-29, cuatro corridas de `push` sobre CUATRO SHA distintos —
        # 33243672255 (08:39Z, e07ecaf78), 33251264671 (11:55Z, 466da5b67), 33254801927
        # (13:21Z, e4b49eb5b) y 33263227272 (16:32Z, 59db1e733)— y las cuatro identicas:
        #
        #     paso 46  test (functional, no -race)  FAILURE
        #     paso 47  client SDK codegen drift     SKIPPED   <- sin guarda
        #     paso 48  dependency vulnerabilities   SUCCESS   <- CON guarda: hablo igual
        #     paso 49  OpenAPI snapshot + drift     SKIPPED   <- sin guarda
        #     paso 50  compliance catalog drift     SKIPPED   <- sin guarda
        #
        # El paso 48 es el control positivo de que la guarda funciona: el UNICO de los cuatro
        # que dio veredicto es el unico que la lleva. ⇒ tres comprobaciones llevan TODO EL DIA
        # sin medirse sobre ninguno de esos arboles, y ninguna estaba rota: estaban tapadas.
        # `!cancelled()` y no `always()`, por lo mismo que dice el paso 48.
        #
        # ⛔ Y EL PREDICADO SE RE-DERIVA AL COPIAR LA GUARDA, corregido el 2026-08-30: hasta
        # hoy esta línea llevaba SOLO `steps.tools`, que es el predicado de `vuln-gate` —
        # correcto ALLÍ (go install govulncheck) y falso AQUÍ, donde la herramienta que hace
        # el trabajo es `openapi-typescript`, de `web/node_modules/.bin`, que instala
        # `openapi-web-deps`. La guarda cumplió su mitad (dar veredicto pese a un rojo ajeno)
        # y rompió la otra (correr sin herramienta). Control positivo de que la guarda en sí
        # funciona: en esa misma corrida `sdk:check` la lleva, no depende de pnpm y dio VERDE.
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.openapi-web-deps.outcome == 'success' }}
        timeout-minutes: 15
        run: task openapi:check 2>&1 | tee "$RUNNER_TEMP/ci-fail-openapi-check.log" && rm "$RUNNER_TEMP/ci-fail-openapi-check.log"
      # PAT-blind observability: on a PR failure, say WHICH step failed + attach
      # the tail of any teed heavy-step log (see .github/actions/pr-failure-report).
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # The push gate's -race legs (split from control-plane 2026-07-24: the
  # workspace sub-leg alone exceeds 45 min on a 2-vCPU runner; sharded 2026-07-25
  # after run 30138745627 crossed the 70-minute step ceiling with sdk/* and
  # terraform-provider-olivares still UNRACED — measured per-module wall in that
  # run: modules 47m27s, core 15m39s, connectors 4m04s, operator 2m23s, clients
  # 36s, so ./modules alone is two thirds of it; independent JOBS since
  # 2026-07-30). ALWAYS-ON since 2026-07-29: an opt-OUT of race detection is
  # not a knob this project wants. Every test:race-hot sub-leg still runs
  # exactly once, so no
  # test is dropped and nothing is unraced.
  #
  # WHY TWO JOBS AND NOT A MATRIX (2026-07-30): the former race-hot-shard matrix
  # ran both legs in lockstep on one runner, so ./modules — two thirds of the
  # -race wall on its own — could not start until a slot for the whole matrix
  # existed. Independent jobs let the two legs run concurrently on two runners
  # and give each its own step budget. That reason is unchanged.
  #
  # Since 2026-09-11 ./modules is a matrix again, so this paragraph has to say which part of
  # it still holds. The 2026-07-30 note is about putting DIFFERENT legs in one matrix:
  # ./modules and the workspace remainder are different work, and a shared scheduling unit
  # made the expensive one wait for the cheap one. They are still separate jobs —
  # race-modules, race-rest and race-core — and that is untouched. The matrix below is four
  # instances of one leg over disjoint package sets, each with its own runner, Postgres
  # service, step budget and concurrency group. Nothing waits for anything.
  #
  # THE OTHER REASON IS GONE, AND THE TRIPWIRE IS WHAT SAID SO (2026-08-01).
  # This job was ALSO split out because the modules leg used no Postgres —
  # measured 2026-07-30: zero files under ./modules referenced
  # pgtest/POSTGRES_DSN, jackc/pgx was `// indirect` in modules/go.mod.
  # unit H then landed 12 writer-fence ENFORCEMENT tests in modules/eventing
  # that need a real server (a NOBYPASSRLS app role, a separate DDL owner, real
  # concurrency — none of which SQLite models), and the fail-closed sweep in
  # scripts/test-pg-test-env.sh turned red on them. That is the job it was
  # written for, and the premise it protected really was broken.
  #
  # WHAT THIS JOB ACTUALLY ADDS, corrected the same day it landed. The first
  # version of this comment said those 12 tests "would have SKIPPED forever",
  # and reported that NO CI job ran ./modules with Postgres. That
  # was FALSE, and it was reported as measured. What had been measured was
  # race-modules and race-rest; it never opened control-plane. Measured
  # properly afterwards:
  #
  #   control-plane      has services: pgvector/pgvector:pg16, exports
  #                      OLIVARES_TEST_POSTGRES_SUPERUSER_DSN and
  #                      OLIVARES_GATE_STRICT_PG=1, and runs `task test:functional`
  #   test:functional    with-pg-env.sh + go-work-each.sh over ./... and sets NO
  #                      GO_WORK_EACH_SKIP, so it traverses EVERY workspace
  #                      module — ./modules included (Taskfile.yml, and
  #                      scripts/go-work-each.sh defaults SKIP to empty)
  #
  # So those 12 tests DO execute against a real Postgres on every PR, in
  # control-plane. The gap this job closes is narrower and worth stating
  # exactly: RACE DETECTION over those Postgres-backed paths at PR time. The
  # -race legs are the only jobs that run with -race, and race-modules was the
  # one racing ./modules with no server, so under it — and only under it —
  # those tests skipped. The weekly race-full sweep did cover them.
  #
  # A narrower benefit than first claimed, and still a real one: a data race in
  # a fence trigger's Go side would be found weekly instead of on the PR that
  # introduced it. The cost is one more Postgres container on the heaviest job.
  #
  # This job provisions Postgres IDENTICALLY to race-rest: same digest-pinned
  # image, same ephemeral host port, same roles, same four DSNs. Deliberately
  # identical, not minimally sufficient — the unit H tests only read the
  # superuser DSN, but a DSN exported in one -race leg and absent in the other
  # is a test that runs in one job and silently skips in the other, which is
  # the same pathology one layer down. lint:pg-env asserts the two legs agree,
  # including on the image digest.
  #
  # On 2026-09-11 this job ran out of clock and became four. Job 103097824594 of run
  # 34545731818 (ci-runner-2) was killed by the 210-minute step ceiling with 28 packages
  # green (governance 6291.626s, finops 5283.827s, compliance 4415.238s), `modules/sessions`
  # still alive and five packages never reported. Those 28 sum 31545 s of package wall inside
  # 12600 s of step wall — average concurrency 2.5 — so the leg did not hang: it did not fit.
  #
  # What that establishes, and what it does not: the 28 packages that reported were green,
  # which is not evidence that the packages which never ran would pass, and this split is not
  # a demonstrated repair of that failure. It is a schedule that gives the same work four
  # runners instead of one. The first run that completes is the first evidence either way.
  #
  # The partition is derived, never typed. scripts/modules-race-partition.sh cuts the
  # `go list ./...` inventory of ./modules into N partitions, so a package added tomorrow has
  # an owner without anybody editing this file, and `task lint:modules-race-partition` (a step
  # of this job, below) proves the four are a partition of that inventory before the race
  # starts. With no selector the same task races `./...`, which is still the complete local
  # gate.
  race-modules:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    strategy:
      # fail-fast: false, because the evidence is the point. Under the default the first
      # partition to fail cancels the other three, and three cancelled legs report nothing
      # about the packages they were racing. The aggregate is red either way, so all
      # fail-fast buys here is the loss of three failure reports.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    name: race-modules (partition ${{ matrix.partition }})
    # The group names the partition, and without that the matrix cancels itself: a job-level
    # `concurrency` group is per job instance, so four matrix legs sharing one group string
    # with cancel-in-progress supersede each other — three die as `cancelled` and the
    # aggregate verdict comes from whichever survived. The ${{ github.run_id }} keeps a run
    # from cancelling its own legs across pushes (see the concurrency note above the jobs
    # block); the matrix value keeps it from cancelling them against each other.
    # scripts/test-modules-race-partition.sh mutates this line away and demands a red.
    concurrency:
      group: mainline-ci-race-modules-${{ matrix.partition }}-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Step timeouts are the hang guard (a job-level timeout cancels remaining
    # steps, so the failure reporter never posts — silent red); the job cap is
    # the absolute backstop. 85, not the old shard's 100: this job runs ONE leg,
    # measured 47m27s worst-case on the 2-vCPU fallback runner (run 30138745627)
    # — the 75m step ceiling plus checkout/setup headroom.
    # 115 y no 85: la receta lleva `-timeout 90m` por binario desde el 2026-08-21 (la medida,
    # en el Taskfile). Un techo de PASO por debajo del presupuesto de go convierte el arreglo
    # en decorativo: el paso mataria antes de que el presupuesto sirviera para nada.
    # ⛔ 115 -> 200 el 2026-08-22. Su unico paso tenia 105 y NO HA TERMINADO NI UNA VEZ: seis
    # corridas medidas en 110,3 · 110,8 · 111,9 · 112,2 · 112,5 · 112,6 min, todas agotando los 105.
    # Y `race-hot` —contexto REQUERIDO por la proteccion de rama— agrega este resultado, asi que
    # tampoco podia satisfacerse. El techo del job sube con el del paso para que siga siendo un
    # backstop y no el limite (lo exige `task lint:ci-timeout-arithmetic`).
    # ⛔ 200 -> 240 el 2026-08-23 (r24), y va ATADO a subir el `-timeout` del binario de 90m a 150m:
    # los tres numeros se mueven JUNTOS o el de en medio no sirve. Medido sobre la corrida
    # 32598987269 por PASOS, que es lo que el job no dice: el paso `race` tardo 129,1 min y dentro
    # de el `modules/sessions` agoto 90,0 de 90 (100 %, y es el UNICO de 584 paquetes por encima
    # del 75 %). Darle 150m al binario mueve el paso a ~189 min proyectados (129,1 - 90 + 150), que
    # SE PASA del techo de paso de 180 ⇒ subir solo el `-timeout`, que es lo que parecia tocar,
    # habria devuelto la muerte MUDA que el 08-22 se acababa de quitar.
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    services:
      postgres:
        # IDENTICAL to race-rest's service, digest included, and lint:pg-env
        # asserts that equality: two -race legs pinned to different Postgres
        # images is a test that passes in one job and fails in the other for a
        # reason nobody would look for. Change one, change both.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # EPHEMERAL HOST PORT — see race-rest for the measured collision this
          # avoids (run 30541550811). checkciports (task lint:ci-ports) refuses
          # a `5432:5432` mapping anywhere in this tree.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
    env:
      # Promotion regime: this job provisions a real server, so a PG-less
      # partial pass could only mean the service died — fail, not skip. The 12
      # writer-fence enforcement tests in modules/eventing are precisely the
      # ones that would otherwise self-skip into a green.
      OLIVARES_GATE_STRICT_PG: "1"
      # The pair the task validates: both, or it races everything. One alone, a non-decimal,
      # an out-of-range index or a value too wide for shell arithmetic is refused rather than
      # guessed at (scripts/modules-race-partition.sh).
      # R111-SR1: modules/sessions has a job of its own (race-sessions). It is excluded HERE
      # and owned THERE; race-hot requires both, so an exclusion without its owner is a red.
      OLIVARES_MODULES_RACE_DEDICATED: github.com/olivaresai/olivares/modules/sessions
      OLIVARES_MODULES_RACE_PARTITION: ${{ matrix.partition }}
      # Derived from the matrix, not typed beside it: `strategy.job-total` is the number of
      # legs this matrix produces, so adding a fifth entry above cannot leave this saying
      # four. A count that says four while five legs run means the fifth partition's packages
      # are raced by nobody, silently, with every leg green.
      OLIVARES_MODULES_RACE_PARTITIONS: ${{ strategy.job-total }}
    steps:
      - name: resolve the ephemeral Postgres port into the test DSNs
        id: pg-port
        env:
          # `job` is only available in steps.env/steps.run/steps.with.
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          case "${PGPORT_HOST:-}" in
            '' | *[!0-9]*)
              echo "::error::mapped host port for services.postgres:5432 is empty or non-numeric (got '${PGPORT_HOST:-}')" >&2
              exit 1 ;;
          esac
          read -r LOPORT HIPORT < /proc/sys/net/ipv4/ip_local_port_range
          if [ "$PGPORT_HOST" -lt "$LOPORT" ] || [ "$PGPORT_HOST" -gt "$HIPORT" ]; then
            echo "::error::docker published Postgres on ${PGPORT_HOST}, outside this host's ephemeral range ${LOPORT}-${HIPORT}; refusing to continue" >&2
            exit 1
          fi
          {
            echo "PGHOSTPORT=127.0.0.1:${PGPORT_HOST}"
            echo "OLIVARES_TEST_POSTGRES_DSN=postgres://olivares_app:apppw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
            echo "OLIVARES_TEST_POSTGRES_ADMIN_DSN=postgres://olivares_admin:adminpw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
            echo "OLIVARES_TEST_POSTGRES_SUPERUSER_DSN=postgres://postgres:postgres@127.0.0.1:${PGPORT_HOST}/postgres?sslmode=disable"
            # This job HAS a Postgres service, so an unreachable server here is a broken
            # job — not an absence to skip past. `pgtest.Available` only learns that from the
            # RUN (core/internal/pgtest/pgtest.go:88-96): without this line the reachability
            # probe answers `false` and the whole Postgres leg vanishes QUIETLY, which is the
            # failure that probe was added to end. The declaration belongs to whoever
            # provisioned the server, and that is this job.
            echo "OLIVARES_TEST_POSTGRES_REQUIRED=1"
            echo "OLIVARES_TEST_VECTOR_DSN=postgres://olivares_app:apppw@127.0.0.1:${PGPORT_HOST}/olivares?sslmode=disable"
          } >> "$GITHUB_ENV"
          echo "resolved Postgres host port: ${PGPORT_HOST} (ephemeral range ${LOPORT}-${HIPORT})"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # ⛔ MEDIDO, no preventivo: `core/runtime` fallo en este job con «the binary never
        # executed despite a matching digest», y su log enseña el plugin arrancando desde
        # /tmp. Los tests usan t.TempDir(), que honra TMPDIR y cae en /tmp — montado NOEXEC
        # en varias de estas maquinas. El test no mide lo que cree medir: mide el montaje.
        # Mismo remedio que el smoke de examples, y por la misma razon.
        run: |
          # ⛔ EJECUTABLE **Y CORTO**, y lo segundo lo aprendi rompiendolo. Al apuntar TMPDIR a
          # $RUNNER_TEMP la ruta crecio hasta 118 caracteres:
          #   …/_work/_temp/citests.XXXXXX/TestGatherDocker…/001/d.sock
          # y `sun_path` de un socket unix admite 108 → `bind: invalid argument`. Arreglar la
          # ejecucion de plugins rompio un test de sockets: las dos condiciones son reales.
          corto=""
          # ⛔ Y DICE POR QUE descarta cada candidato. La primera version solo avisaba «sin candidato
          # CORTO» y eso no es accionable: en ci-runner-7 los tres fallaron y el aviso no decia si era
          # por no existir, por no poder escribir o por no poder ejecutar. Un aviso que no nombra la
          # causa obliga a reproducir el entorno para saber que mirar.
          # ⛔ DISCO ANTES QUE /dev/shm, MEDIDO el 2026-09-16 (run 35076921214, `race-hot-manifest`
          # p3 en ci-runner-3): `go build` murio con «vet.cfg: no space left on device» bajo
          # /dev/shm/olv…/go-build…, y `race-modules` p3/p4 y el paso proto de `control-plane`
          # cayeron por lo mismo mientras dos particiones hermanas pasaban en el MISMO host: quien
          # llega primero se lleva la RAM. /dev/shm es UN tmpfs compartido por los doce runners
          # del host ci-runner-1, cada job con -race le mete gigas de arbol intermedio de Go, y
          # nadie borraba /dev/shm/olv$$ al acabar, asi que cada job cancelado dejaba el suyo.
          # $HOME es disco y sigue siendo CORTO (/home/runner/olv1234567 = 23 <= 24). Y /var/tmp DETRAS,
          # porque en los runners Hetzner HOME NO ESTA DEFINIDA (medido: run 35081963451, race-hot p1 en
          # ci-runner-8 salto el primer candidato y volvio a /dev/shm con 18187 MiB libres de 32039):
          # /var/tmp es el disco del host que si existe, mide 8 y la sonda de abajo decide si ejecuta.
          # Barrido de huerfanos ANTES de elegir: un olv* mas viejo que el timeout-minutes mayor
          # de este fichero (320) no puede pertenecer a un job vivo. Mide mtime del directorio,
          # que Go renueva al crear cada go-build*, y lo limita al usuario del runner.
          # Y MIDE el espacio libre de cada candidato antes de probarlo: el «no space left» de hoy
          # salio tres pasos mas abajo, dentro de `go build`; con la cifra aqui se lee en este paso.
          # ⛔ EL BARRIDO VA EN SU PROPIO BUCLE, y es una correccion MEDIDA: F2 de la revision
          # independiente del 2026-09-16 (an internal design note (not shipped)).
          # Dentro del bucle de seleccion solo alcanzaba a los candidatos probados ANTES del `break`,
          # asi que con /var/tmp elegido /dev/shm NO SE BARRIA NUNCA — justo el tmpfs cuyo residuo
          # tumbo la corrida 35076921214 y que en la 35081963451, con el barrido ya enviado, seguia
          # al 43 % (18187 MiB libres de 32039). Reproducido aqui: con el barrido dentro del bucle
          # los arboles viejos de /dev/shm y /run/user sobreviven; con este bucle aparte, no.
          # ⛔ Y BARRE TAMBIEN `olv-exec-<pid>` (F5). Censo de los nombres que los guiones de este
          # repositorio crean DENTRO de un candidato: `olv$$`, este paso; y `olv-exec-$$`, la sonda
          # `probar` de `hook-only-legs` en mainline-ci.yml. El respaldo `olivares_pick_exec_workdir o`
          # crea `o.XXXXXX` y NO se barre a proposito: el patron `o.??????` casaria nombres ajenos
          # (`o.config` mide exactamente seis), y un barrido solo se amplia a patrones que no puedan
          # casar lo que no es nuestro. Los parentesis del `find` NO son decorativos: sin ellos `-o`
          # reparte los predicados, el `-exec` cuelga solo de la segunda rama y llega a borrar
          # FICHEROS que no son directorios. Medido en las dos formas antes de elegir esta.
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -n "$c" ] && [ -d "$c" ]; then
              find "$c" -maxdepth 1 -mindepth 1 -type d \( -name 'olv[0-9]*' -o -name 'olv-exec-[0-9]*' \) -user "$(id -un)" -mmin +360 -exec rm -rf {} + 2>/dev/null || true
            fi
          done
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -z "$c" ]; then echo "  candidato <vacio>: variable sin definir"; continue; fi
            if [ ! -d "$c" ]; then echo "  candidato $c: NO EXISTE"; continue; fi
            # ⛔ `|| true` AL FINAL, y es una correccion MEDIDA: F3 de la revision independiente del
            # 2026-09-16. El bloque corre bajo `bash --noprofile --norc -eo pipefail` (asi ejecuta
            # GitHub un `run:` con `defaults.run.shell: bash`), asi que un `df` que falle sobre un
            # montaje que se va entre el `[ -d ]` y esta linea MATA EL PASO — y con el, el respaldo
            # `exec-workdir.sh` de abajo, que es lo que convierte esto en degradacion suave.
            # Reproducido con esa misma shell: la tuberia aborta el bucle, no imprime nada y el
            # texto posterior al bucle no se alcanza (rc 1). Una MEDIDA no decide el paso.
            df -Pk "$c" 2>/dev/null | awk -v c="$c" 'NR==2{printf "  candidato %s: %d MiB libres de %d en %s\n", c, $4/1024, $2/1024, $1}' || true
            d="$c/olv$$"
            if ! mkdir -p "$d" 2>/dev/null; then echo "  candidato $c: no puedo crear dentro"; continue; fi
            if ! printf '#!/bin/sh\nexit 7\n' >"$d/.p" 2>/dev/null; then echo "  candidato $c: no puedo escribir"; rm -rf "$d"; continue; fi
            chmod +x "$d/.p" 2>/dev/null || { echo "  candidato $c: chmod falla"; rm -rf "$d"; continue; }
            rc=0; "$d/.p" 2>/dev/null || rc=$?
            rm -f "$d/.p"
            if [ "$rc" -ne 7 ]; then echo "  candidato $c: NO EJECUTA (rc=$rc; 126 = noexec o sin permiso)"; rm -rf "$d"; continue; fi
            if [ "${#d}" -gt 24 ]; then echo "  candidato $c: ejecuta pero la ruta mide ${#d} (>24)"; rm -rf "$d"; continue; fi
            corto="$d"; break
          done
          if [ -n "$corto" ]; then
            echo "TMPDIR=$corto" >> "$GITHUB_ENV"
            echo "TMPDIR corto y ejecutable: $corto (${#corto} caracteres)"
          else
            . scripts/lib/exec-workdir.sh
            d="$(olivares_pick_exec_workdir o)" || {
              echo "::error::ningun directorio permite ejecutar un binario"
              exit 1
            }
            echo "TMPDIR=$d" >> "$GITHUB_ENV"
            echo "::warning::sin candidato CORTO; uso $d (${#d} caracteres): un socket unix puede pasarse de 108"
          fi
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        id: pg-roles
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 \
            -v app_password=apppw -f deploy/postgres/01-app-role.sql
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "DROP ROLE IF EXISTS olivares_admin; CREATE ROLE olivares_admin LOGIN PASSWORD 'adminpw' NOSUPERUSER BYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE olivares TO olivares_admin;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SCHEMA public TO olivares_admin; ALTER DEFAULT PRIVILEGES FOR ROLE olivares_app IN SCHEMA public GRANT SELECT ON TABLES TO olivares_admin;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: prove the partition before spending the Postgres
        id: partition-control
        # The union control and its battery. It runs in every partition and on the exact
        # tree being raced: a package that no partition owns is never raced and all four
        # legs still go green, which is the one failure here that a red cannot warn about.
        # No timeout-minutes on purpose — a step with one is a "leg" to
        # scripts/check-ci-sibling-legs.sh, and this job's single leg is the race below.
        run: task lint:modules-race-partition
      - name: race (./modules partition ${{ matrix.partition }}, on Postgres)
        id: race-modules
        # Subido de 105 a 180 el 2026-08-22: a los 105 morian las seis corridas medidas sin terminar,
        # asi que el tiempo REAL que necesita no se conoce — no hay ni un exito del que leerlo. 180 se
        # elige por encima del suelo observado, y la primera corrida verde dara el numero de verdad.
        # ⛔ 180 -> 210 el 2026-08-23 (r24). Los ~189 min de arriba son una PROYECCION, no una medida:
        # `modules/sessions` no ha terminado NUNCA bajo -race, asi que su duracion real sigue sin
        # conocerse y 150m es una COTA, no un dato. 210 deja 21 min por encima de la proyeccion.
        # ⚠ Y el arreglo de fondo NO es este numero: `modules/sessions` sumo +128 681 lineas en
        # catorce dias y corre 769 tests con solo 18 `t.Parallel()`. Subir el tope ya se probo tres
        # veces (20m -> 45m -> 90m) y cada vez compro semanas. El numero de verdad lo dara la primera
        # corrida que TERMINE; leedlo de `task ci:timeout-headroom --fetch`, nunca de esta linea.
        # 210 stays, and that is a decision too (2026-09-11). The four-way split changes the
        # work each leg does, not its budget: the three clocks remain 150m per binary < 210m
        # per step < 240m per job, the relationship `lint:ci-inner-clocks` and
        # `lint:ci-timeout-arithmetic` enforce. Lowering them now would derive a number from
        # a run that has never finished, which is what this block has refused three raises in
        # a row to do. The first run that completes gives the number; until then the ceiling
        # stays and the slack is the cheap side to be wrong on.
        timeout-minutes: 210
        # The log carries the partition in its name. `.github/actions/pr-failure-report`
        # assembles its report by tailing every $RUNNER_TEMP/ci-fail-*.log and titles it with
        # `github.job`, which is the job id and identical in all four legs, so the file name
        # is the only thing in that report that says which partition is being read.
        run: task test:race-hot:modules 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-modules-${{ matrix.partition }}.log" && rm "$RUNNER_TEMP/ci-fail-race-modules-${{ matrix.partition }}.log"
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # The Postgres-backed -race legs: workspace minus cmd/olivares root and
  # ./modules, the root's cheap subpackages, the hot manifest, and cloud.
  # Service, env and role provisioning mirror control-plane so the store
  # integration tests race BY EXECUTION here too instead of silently
  # self-skipping.
  race-rest:
    # Gated by the internal change gate: journal-only pushes skip this code-input job.
    # On pull_request / dispatch the classify job always answers code=true (no
    # PR-side filtering of any kind).
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-race-rest-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Los techos de los pasos de este job suman mas que el del job — 110 antes de tocar nada, con
    # el job en 100 — de modo que el job moria antes de que sus pasos pudieran gastar lo que
    # declaran. Con race-workspace en 60 la suma es 125; el job sube a 135 para que el limite que
    # decida sea el del paso que se pase, no el del job, que no dice cual fue.
    # ⛔ 135 -> 175 el 2026-08-22, para dar sitio al primer paso (60 -> 90, abajo). Sus pasos suman
    # entonces 155 y este techo tiene que quedar por encima: lo exige `task lint:ci-timeout-arithmetic`.
    #
    # ⛔ 120 → 150 EL 2026-09-12, PORQUE EL PASO DE COMPILACION SUBIO LA SUMA A 135.
    #    Separar compilacion y ejecucion anadio un paso de 25 min, y `check-ci-timeout-arithmetic.sh`
    #    lo caza: «techo 120 · suma de pasos 135». Ese guion corre en `.githooks/pre-push`, asi que
    #    la rama no se puede empujar por debajo de la suma — y el modo de fallo que describe es el
    #    mismo que esta correccion intenta quitar, un nivel mas arriba: al vencer el techo del JOB,
    #    GitHub cancela los pasos restantes, el reportero de fallos no llega a publicar y la corrida
    #    sale etiquetada `cancelled`. El rojo sale MUDO otra vez.
    #    150 deja el margen que usaron las entradas del 2026-08-22, y la realidad medida da sitio:
    #    la corrida que fallo (34678296981) gasto 49,2 min de sus 120.
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    services:
      postgres:
        # pgvector/pgvector = the official postgres image + the compiled vector
        # extension (pinned by digest, tag pg16, 2026-07-30). B5: docs call pgvector
        # the self-host production default, yet no gate ever executed it — the real
        # integration test gates on OLIVARES_TEST_VECTOR_DSN below.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          # EPHEMERAL HOST PORT (2026-07-30). `5432:5432` reserved the HOST's 5432;
          # a second job on the SAME host died in "Initialize containers" with
          #   Bind for :::5432 failed: port is already allocated
          # (measured: run 30541550811, job 90901999419, dead in 10 s). This host
          # runs THREE runner installations, so the repo trips over itself. A bare
          # container port lets Docker pick a free host port; it is read below with
          # job.services.postgres.ports['5432'] from a STEP — the `job` context
          # does NOT exist in jobs.<id>.env (actionlint availability.go, case
          # "jobs.<job_id>.env").
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory=1g
          --memory-swap=1536m
          --cpus=2
          --pids-limit=512
    env:
      # The four OLIVARES_TEST_*_DSN CANNOT live here: they depend on the ephemeral
      # host port, and the `job` context is not available in jobs.<id>.env
      # (actionlint availability.go: jobs.<job_id>.env → github, inputs, matrix,
      # needs, secrets, strategy, vars — no `job`). The first step, "resolve the
      # ephemeral Postgres port into the test DSNs", writes them to $GITHUB_ENV.
      # Promotion regime (2026-07-30): this job provisions real Postgres, so a
      # PG-less partial pass here could only mean the service died — fail, not skip.
      OLIVARES_GATE_STRICT_PG: "1"
    steps:
      # Checkout precedes resolve/provision: scripts/ci-postgres-service.sh lives in the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: resolve the ephemeral Postgres port into the test DSNs
        id: pg-port
        env:
          # `job` is only available in steps.env/steps.run/steps.with.
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
        run: bash scripts/ci-postgres-service.sh resolve
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO. La primera version de este
        # paso iba DESPUES, y habria sido inutil: cuando se etiqueto `ci-runner-4` el 2026-08-18
        # el job no murio en `go install`, murio dentro de `setup-go` con «GOCACHE is not
        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # ⛔ MEDIDO, no preventivo: `core/runtime` fallo en este job con «the binary never
        # executed despite a matching digest», y su log enseña el plugin arrancando desde
        # /tmp. Los tests usan t.TempDir(), que honra TMPDIR y cae en /tmp — montado NOEXEC
        # en varias de estas maquinas. El test no mide lo que cree medir: mide el montaje.
        # Mismo remedio que el smoke de examples, y por la misma razon.
        run: |
          # ⛔ EJECUTABLE **Y CORTO**, y lo segundo lo aprendi rompiendolo. Al apuntar TMPDIR a
          # $RUNNER_TEMP la ruta crecio hasta 118 caracteres:
          #   …/_work/_temp/citests.XXXXXX/TestGatherDocker…/001/d.sock
          # y `sun_path` de un socket unix admite 108 → `bind: invalid argument`. Arreglar la
          # ejecucion de plugins rompio un test de sockets: las dos condiciones son reales.
          corto=""
          # ⛔ Y DICE POR QUE descarta cada candidato. La primera version solo avisaba «sin candidato
          # CORTO» y eso no es accionable: en ci-runner-7 los tres fallaron y el aviso no decia si era
          # por no existir, por no poder escribir o por no poder ejecutar. Un aviso que no nombra la
          # causa obliga a reproducir el entorno para saber que mirar.
          # ⛔ DISCO ANTES QUE /dev/shm, MEDIDO el 2026-09-16 (run 35076921214, `race-hot-manifest`
          # p3 en ci-runner-3): `go build` murio con «vet.cfg: no space left on device» bajo
          # /dev/shm/olv…/go-build…, y `race-modules` p3/p4 y el paso proto de `control-plane`
          # cayeron por lo mismo mientras dos particiones hermanas pasaban en el MISMO host: quien
          # llega primero se lleva la RAM. /dev/shm es UN tmpfs compartido por los doce runners
          # del host ci-runner-1, cada job con -race le mete gigas de arbol intermedio de Go, y
          # nadie borraba /dev/shm/olv$$ al acabar, asi que cada job cancelado dejaba el suyo.
          # $HOME es disco y sigue siendo CORTO (/home/runner/olv1234567 = 23 <= 24). Y /var/tmp DETRAS,
          # porque en los runners Hetzner HOME NO ESTA DEFINIDA (medido: run 35081963451, race-hot p1 en
          # ci-runner-8 salto el primer candidato y volvio a /dev/shm con 18187 MiB libres de 32039):
          # /var/tmp es el disco del host que si existe, mide 8 y la sonda de abajo decide si ejecuta.
          # Barrido de huerfanos ANTES de elegir: un olv* mas viejo que el timeout-minutes mayor
          # de este fichero (320) no puede pertenecer a un job vivo. Mide mtime del directorio,
          # que Go renueva al crear cada go-build*, y lo limita al usuario del runner.
          # Y MIDE el espacio libre de cada candidato antes de probarlo: el «no space left» de hoy
          # salio tres pasos mas abajo, dentro de `go build`; con la cifra aqui se lee en este paso.
          # ⛔ EL BARRIDO VA EN SU PROPIO BUCLE, y es una correccion MEDIDA: F2 de la revision
          # independiente del 2026-09-16 (an internal design note (not shipped)).
          # Dentro del bucle de seleccion solo alcanzaba a los candidatos probados ANTES del `break`,
          # asi que con /var/tmp elegido /dev/shm NO SE BARRIA NUNCA — justo el tmpfs cuyo residuo
          # tumbo la corrida 35076921214 y que en la 35081963451, con el barrido ya enviado, seguia
          # al 43 % (18187 MiB libres de 32039). Reproducido aqui: con el barrido dentro del bucle
          # los arboles viejos de /dev/shm y /run/user sobreviven; con este bucle aparte, no.
          # ⛔ Y BARRE TAMBIEN `olv-exec-<pid>` (F5). Censo de los nombres que los guiones de este
          # repositorio crean DENTRO de un candidato: `olv$$`, este paso; y `olv-exec-$$`, la sonda
          # `probar` de `hook-only-legs` en mainline-ci.yml. El respaldo `olivares_pick_exec_workdir o`
          # crea `o.XXXXXX` y NO se barre a proposito: el patron `o.??????` casaria nombres ajenos
          # (`o.config` mide exactamente seis), y un barrido solo se amplia a patrones que no puedan
          # casar lo que no es nuestro. Los parentesis del `find` NO son decorativos: sin ellos `-o`
          # reparte los predicados, el `-exec` cuelga solo de la segunda rama y llega a borrar
          # FICHEROS que no son directorios. Medido en las dos formas antes de elegir esta.
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -n "$c" ] && [ -d "$c" ]; then
              find "$c" -maxdepth 1 -mindepth 1 -type d \( -name 'olv[0-9]*' -o -name 'olv-exec-[0-9]*' \) -user "$(id -un)" -mmin +360 -exec rm -rf {} + 2>/dev/null || true
            fi
          done
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -z "$c" ]; then echo "  candidato <vacio>: variable sin definir"; continue; fi
            if [ ! -d "$c" ]; then echo "  candidato $c: NO EXISTE"; continue; fi
            # ⛔ `|| true` AL FINAL, y es una correccion MEDIDA: F3 de la revision independiente del
            # 2026-09-16. El bloque corre bajo `bash --noprofile --norc -eo pipefail` (asi ejecuta
            # GitHub un `run:` con `defaults.run.shell: bash`), asi que un `df` que falle sobre un
            # montaje que se va entre el `[ -d ]` y esta linea MATA EL PASO — y con el, el respaldo
            # `exec-workdir.sh` de abajo, que es lo que convierte esto en degradacion suave.
            # Reproducido con esa misma shell: la tuberia aborta el bucle, no imprime nada y el
            # texto posterior al bucle no se alcanza (rc 1). Una MEDIDA no decide el paso.
            df -Pk "$c" 2>/dev/null | awk -v c="$c" 'NR==2{printf "  candidato %s: %d MiB libres de %d en %s\n", c, $4/1024, $2/1024, $1}' || true
            d="$c/olv$$"
            if ! mkdir -p "$d" 2>/dev/null; then echo "  candidato $c: no puedo crear dentro"; continue; fi
            if ! printf '#!/bin/sh\nexit 7\n' >"$d/.p" 2>/dev/null; then echo "  candidato $c: no puedo escribir"; rm -rf "$d"; continue; fi
            chmod +x "$d/.p" 2>/dev/null || { echo "  candidato $c: chmod falla"; rm -rf "$d"; continue; }
            rc=0; "$d/.p" 2>/dev/null || rc=$?
            rm -f "$d/.p"
            if [ "$rc" -ne 7 ]; then echo "  candidato $c: NO EJECUTA (rc=$rc; 126 = noexec o sin permiso)"; rm -rf "$d"; continue; fi
            if [ "${#d}" -gt 24 ]; then echo "  candidato $c: ejecuta pero la ruta mide ${#d} (>24)"; rm -rf "$d"; continue; fi
            corto="$d"; break
          done
          if [ -n "$corto" ]; then
            echo "TMPDIR=$corto" >> "$GITHUB_ENV"
            echo "TMPDIR corto y ejecutable: $corto (${#corto} caracteres)"
          else
            . scripts/lib/exec-workdir.sh
            d="$(olivares_pick_exec_workdir o)" || {
              echo "::error::ningun directorio permite ejecutar un binario"
              exit 1
            }
            echo "TMPDIR=$d" >> "$GITHUB_ENV"
            echo "::warning::sin candidato CORTO; uso $d (${#d} caracteres): un socket unix puede pasarse de 108"
          fi
      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        id: pg-roles
        env:
          PGPASSWORD: postgres
        run: bash scripts/ci-postgres-service.sh provision
      # ⛔ EL TECHO DEL PASO TIENE QUE SER MAYOR QUE EL DE `go test`, O EL DIAGNOSTICO DE GO ES
      # INALCANZABLE. Medido el 2026-08-19 en ci-runner-7: este paso valia 45 y el comando de
      # dentro es `go test -race -timeout 45m` (Taskfile.yml:302). Los dos relojes arrancan casi a
      # la vez, asi que Go nunca llega a disparar el suyo — y el suyo es el unico que NOMBRA el
      # paquete colgado y vuelca sus goroutines. Lo que salio fue
      # «The action … has timed out after 45 minutes», sin una sola pista.
      #
      # ⚠ Y 60 NO ES UNA MEDIDA: es una COTA. Este paso nunca ha terminado, asi que su duracion
      # real se desconoce; lo unico medido es que 45 no basta. Si vuelve a agotarse, la cifra
      # siguiente sale de ese dato, y si un modulo se cuelga, ahora el -timeout de Go dispara
      # primero y dice cual.
      - name: race (workspace minus cmd/olivares root, ./modules and ./core)
        id: race-workspace
        # Subido de 60 a 90 el 2026-08-22. Medido sobre doce corridas: pasa cuando cabe (66,8 y 74,2 min
        # de job) y se agota cuando no (65-67 min de job, con este paso muriendo en 60). O sea que estaba
        # JUSTO en la frontera, y del lado malo mas veces que del bueno. Cuando agota, los CUATRO pasos
        # siguientes salen `skipped` y esa parte del veredicto no existe, sin decirlo.
        timeout-minutes: 45
        run: task test:race-hot:workspace 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-workspace.log"
      # ⛔ EL CENSO DE HOLGURA, DENTRO DEL PROPIO JOB Y JUSTO DESPUES DEL PASO QUE MIDE.
      #
      # Existe porque el gate ya estaba escrito y NADIE lo corria: `lint:timeout-headroom` en el
      # hook ejecuta su BATERIA, no la medida, y la medida (`ci:timeout-headroom`) era manual. Un
      # control que nadie ejecuta no falla: calla. Y el 2026-08-26 callo mientras TRES paquetes
      # —core/api, core/auth y sqlstore— morian al 100,0 % de su tope de 45 min en corrida tras
      # corrida, con CERO aserciones rotas.
      #
      # Va con `--raw` y no con `--fetch` por una razon medida, no por gusto: `--fetch` usa
      # `gh run view --log`, que exige la corrida ENTERA terminada, asi que NO PUEDE medir la suya.
      # `--raw` lee el fichero que el paso de arriba acaba de dejar con `tee`, sin red.
      #
      # `if: always()` porque el censo sirve JUSTO cuando el paso anterior ha fallado: es entonces
      # cuando hay que saber si murio por su tope o por otra cosa.
      #
      # `continue-on-error` y NO `|| true`: avisa, no bloquea — pero se VE. Una tarea silenciada
      # con `|| true` da cero proteccion y cobra el precio entero, que es un defecto que este
      # repositorio ya pago en el propio pre-push.
      - name: timeout headroom census (warns above 75%, does not block)
        if: always()
        continue-on-error: true
        env:
          RACE_OUTCOME: ${{ steps.race-workspace.outcome }}
        run: |
          bash scripts/check-test-timeout-headroom.sh --raw race-rest "$RUNNER_TEMP/ci-fail-race-workspace.log"
          if [ "$RACE_OUTCOME" = success ]; then
            rm "$RUNNER_TEMP/ci-fail-race-workspace.log"
          fi
      - name: race (cmd/olivares subpackages)
        id: race-root
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.pg-roles.outcome == 'success' }}
        timeout-minutes: 15
        run: task test:race-hot:root 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-root.log" && rm "$RUNNER_TEMP/ci-fail-race-root.log"
      - name: race (cloud control plane)
        id: race-cloud
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.pg-roles.outcome == 'success' }}
        timeout-minutes: 15
        run: task test:cloud 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-cloud.log" && rm "$RUNNER_TEMP/ci-fail-race-cloud.log"
      # ⛔ ESTE PASO FALTABA, y la ausencia empujaba el trabajo al sitio equivocado. Medido el
      # 2026-08-17 cruzando el gate local contra los jobs: de las once tareas pesadas del hook, DIEZ
      # están duplicadas en CI — pero `test:commerce-core` **con `-race`** no lo estaba: aquí sólo
      # corría la variante `:norace` (dentro de `test:functional`). Es decir, el único sitio donde el
      # dominio de comercio se ejercitaba bajo el detector de carreras era el gate LOCAL de quien
      # empujara, en una máquina de desarrollo.
      #
      # El módulo son 30 ficheros y necesita Postgres, que este job ya tiene: el DSN de superusuario
      # se exporta más arriba en este mismo job, así que el paso mide de verdad en vez de saltarse
      # ruidosamente. Ponerlo aquí es la mitad correcta de "no corras en local lo que el runner puede
      # correr": primero que el runner PUEDA.
      - name: race (commerce domain)
        id: race-commerce
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.pg-roles.outcome == 'success' }}
        timeout-minutes: 15
        run: task test:commerce-core 2>&1 | tee "$RUNNER_TEMP/ci-fail-race-commerce.log" && rm "$RUNNER_TEMP/ci-fail-race-commerce.log"
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}

  # Run core separately, with one package binary at a time. Coverage and
  # PostgreSQL remain required. Hosted CI must qualify the revised budgets.
  race-core:
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    strategy:
      # fail-fast: false for the same reason race-modules carries it: under the default the
      # first partition to fail cancels the others, and a cancelled leg reports nothing about
      # the packages it was racing. The aggregate is red either way.
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    name: race-core (partition ${{ matrix.partition }})
    # The group names the partition. A job-level concurrency group is per job instance, so
    # four matrix legs sharing one string with cancel-in-progress supersede each other.
    concurrency:
      group: mainline-ci-race-core-${{ matrix.partition }}-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 190
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
