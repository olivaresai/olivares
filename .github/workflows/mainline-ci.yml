  secrets:
    # DELIBERATELY NOT gated by classify: gitleaks consumes the journal paths (see
    # the header). Every push gets a full-history secrets verdict.
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-secrets-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # ⛔ SEGUNDA SUBIDA EN TRES DIAS, Y ESO ES EL HALLAZGO, NO EL REMEDIO.
    # 30 -> 45 el 2026-08-19 porque el job no habia terminado ni una vez en nueve corridas
    # (28,7 · 28,9 · 30,4 · 30,4 min, todas agotando el limite de 30). Aquella nota decia
    # «si estas duraciones bajan, este numero baja con ellas». No bajaron: SUBIERON.
    #
    # Medido el 2026-08-22 sobre las catorce ultimas corridas: NUEVE murieron en 45,4 min
    # clavados y cinco terminaron en 37,8 · 37,9 · 39,6 · 44,4 min. O sea que el gate de
    # secretos —bloqueante, de historia completa— NO DABA VEREDICTO EN EL 64 % de las
    # corridas de un dia, y nadie lo veia porque GitHub etiqueta el agotamiento del limite
    # como `cancelled`, que se lee como supersesion.
    #
    # ⇒ SUBIR EL TECHO NO ES EL ARREGLO, y por eso va acompanado de la cota interna del paso
    # de abajo. El barrido recorre la historia ENTERA y la historia solo crece: hoy son 12.538
    # commits alcanzables desde los refs de origin, 9.750 de ellos en `main`. Un techo fijo
    # sobre trabajo que crece de forma monotona falla por calendario, no por azar.
    #
    # Y lo que NO era la causa, medido antes de tocar nada para no perseguir la mitad
    # equivocada: la deuda de ramas. Hay 409 ramas en origin y 80 estan totalmente fusionadas
    # en `main`, pero esas 80 aportan CERO commits que main no tenga —son ancestros suyos— y
    # el barrido deduplica por commit. Borrarlas habria sido neutro en cobertura Y en tiempo.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
