        # defined and neither $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado
        # despues del paso que falla no arregla nada — sale verde en los runners que ya
        # funcionaban y sigue rojo en los seis que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe todo lo que se instala con `go install`.
          # Medido en CI: con GOPATH redirigido y sin esta linea, helm-render fallo con
          # "check-helm-render: kubeconform not found on PATH". La herramienta SI se instalaba,
          # en $RUNNER_TEMP/gopath/bin, que no esta en PATH — mientras que el $HOME/go/bin de
          # antes si lo estaba. El arreglo del $HOME introdujo esa regresion, y este la cierra.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
          # Y pnpm IGUAL, por la misma causa y con otro sintoma. Medido en ci-runner-9: el
          # servicio corre con HOME=/root, asi que pnpm/action-setup se auto-instalo en
          # /root/setup-pnpm y murio con ERR_PNPM_BROKEN_PNPM_INSTALL (exit 127). Ese fallo
          # SALTA los pasos siguientes —incluida la instalacion de go-task— y entonces un
          # gate posterior canta "task: command not found", que es la CONSECUENCIA y manda a
          # investigar el PATH en vez de pnpm.
          {
            echo "PNPM_HOME=$RUNNER_TEMP/pnpm"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
      - name: install go-task (pinned)
        id: tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          # Instalar no es alcanzar. Medido 2026-08-18 en ci-runner-2: este paso salio VERDE y
          # tres pasos despues `task` no existia, asi que el rojo lo cobro un gate de Postgres
          # que no tenia nada que ver. Un paso que instala una herramienta y no comprueba que
          # se alcanza traslada su propio fallo a otro sitio.
          command -v task || { echo "::error::go install dijo OK y task no esta en PATH (GOBIN=$GOBIN, PATH=$PATH)"; exit 1; }
      - name: install gitleaks (pinned)
        id: gitleaks-install
        run: |
          {
            # &&-chained: see the release-seams step for the measurement. A tool
            # that failed to INSTALL must never be graded by the task that then
            # could not have run it.
            go install github.com/zricethezav/gitleaks/v8@v8.30.1 &&
            gitleaks version
          } 2>&1 | tee "$RUNNER_TEMP/ci-fail-gitleaks-install.log" && rm "$RUNNER_TEMP/ci-fail-gitleaks-install.log"
      - name: secrets-gate battery (the gate has to be able to name what it finds)
        id: gitleaks-selftest
        # Runs HERE and nowhere else: this is the one place gitleaks is guaranteed present,
        # so the battery has no "skipped because the tool is missing" path — which is the
        # shape that turns a self-test into a decoration. It builds throwaway repositories
        # in RUNNER_TEMP and never touches this checkout.
        run: |
          task lint:secrets-gate 2>&1 | tee "$RUNNER_TEMP/ci-fail-gitleaks-selftest.log" && rm "$RUNNER_TEMP/ci-fail-gitleaks-selftest.log"
      # ⛔ AQUÍ, Y SÓLO AQUÍ, EL BARRIDO DE TODOS LOS REFS (2026-08-16). Este paso se llamaba
      # "gitleaks (full history)" y llamaba a `task lint:secrets`, que desde hoy va acotado a HEAD:
      # el nombre prometía un barrido que no ocurría en ninguna parte. Se le da su llamante real.
      #
      # Por qué el barrido vive en CI y no en el hook: medido en el árbol del hub, 345 s contra
      # 239 s, y los 9 hallazgos que añade son los buzones de refs/remotes/origin/status* — nueve
      # avisos en cada push de cada carril sobre los que nadie actuaría. Aquí se paga una vez.
      # Y es el sitio correcto además por el sujeto: el checkout del runner self-hosted PERSISTE
      # entre jobs, así que los restos de otras ramas están precisamente en ESTA máquina.
      # No bloquea por ellos: el barrido sólo cobra lo alcanzable desde HEAD y el resto lo NOMBRA.
      - name: gitleaks (sweep over every ref, charges only what HEAD reaches)
        # Medido 32,1 min en la corrida 32598987269 (el job entero, 40,4). 60 da 87 % de holgura
        # sobre lo medido y queda MUY por debajo del techo de job (90), que es el punto: un techo de
        # job cancela los pasos que quedan y el reportero no publica. Aqui el que muerde reporta.
        # ⛔ 82 = 80 (reloj interior) + 1 (--kill-after=60s) + 1 de margen. CONTRA QUE SE COMPARA:
        # contra el `timeout --signal=TERM --kill-after=60s 80m` de este mismo paso, NO contra lo que
        # tarda el barrido. Con 60 el que mordia era GitHub y el paso moria MUDO; con 82 muerde el
        # reloj interior y el guion llega a decir «2 · NO PUDE MIRAR: el barrido no cabe». Cabe bajo
        # el techo del job (90) porque la suma de pasos queda en 82.
        timeout-minutes: 82
        id: gitleaks
        env:
          OLIVARES_SECRETS_SCOPE: all
        run: |
          # ⛔ COTA INTERNA, POR DEBAJO DEL TECHO DEL JOB. Sin ella, quedarse sin tiempo mata el
          # job y GitHub lo llama `cancelled` — indistinguible de una supersesion, que es como
          # nueve de catorce corridas del 2026-08-22 pasaron por rojas cronicas sin que nadie
          # las leyera. Con ella, no caber es la TERCERA respuesta que este gate YA tiene
          # escrita en su contrato (`check-secrets.sh`: 2 = NO PUDE MIRAR) y sale roja CON su
          # motivo, que es justo lo que un control de seguridad debe hacer al no poder mirar.
          #
          # El codigo se toma de PIPESTATUS[0] y no del pipe: `| tee` devuelve SU codigo, y
          # leerlo convertiria un barrido agotado en un verde. Es el antipatron que este
          # repositorio tiene documentado y que ya colo un push fallido por bueno.
          set +e
          timeout --signal=TERM --kill-after=60s 80m \
            task lint:secrets 2>&1 | tee "$RUNNER_TEMP/ci-fail-gitleaks.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
            echo "check-secrets: 2 NO PUDE MIRAR — el barrido de historia completa no cabe en 80 min."
            echo "check-secrets:   No es un flake ni una supersesion: el trabajo crece y el techo no."
            echo "check-secrets:   Historia al escribir esto: 12.538 commits desde los refs de origin."
            exit 2
          fi
          if [ "$rc" = "0" ]; then rm -f "$RUNNER_TEMP/ci-fail-gitleaks.log"; fi
          exit "$rc"
