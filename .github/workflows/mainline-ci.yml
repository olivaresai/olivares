      # all-ref sweep remains `OLIVARES_SECRETS_SCOPE=all` / `--all-refs` for an explicit
      # whole-repository audit. Observation difference: leftover-ref findings that the
      # all-ref sweep NAMES (and does not charge) are not observed here. Do not describe
      # this step as all-ref coverage.
