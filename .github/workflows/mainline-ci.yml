  # --- a repository gate · LAS PATAS QUE SOLO VIVEN EN EL GANCHO -----------------------------------------
  # ⛔ POR QUE EXISTE, y es una medida del 2026-08-29, no una precaucion. La paridad
  # gancho<->`mainline-ci` va en los DOS sentidos, y el sentido caro es el que nadie mapeo:
  # medido sobre `origin/main` 112dc483d con el MISMO extractor que usa
  # scripts/check-taskfile-graph.sh (pela sangrado y prefijos de entorno; aqui ademas `run:` y
  # las banderas de `task -x`):
  #
  #     .githooks/pre-push ..... 184 tareas
  #     mainline-ci ............  60   (56 como `task X` + 4 que CI ejecuta SIN `task`)
  #     en AMBOS ...............  34   <- control positivo: con 0, la comparacion no mide nada
  #     solo en CI .............  26   <- el punto ciego del PUSH  (a repository gate parte 3)
  #     solo en el GANCHO ...... 150   <- el punto ciego de CI     (este job)
  #
  # ⚠ La primera version de este bloque decia 56/32/24/152, y le faltaba la CUARTA equivalencia sin
  # `task` (`tokens:check`, que CI corre como `pnpm --dir web run tokens:check`). the kernel owner r4
  # llego a `solo-CI 26` por otro camino y con otro sujeto — descubriendo que ocho de sus 34 las
  # invoca el gancho en su carril PESADO. Dos rutas, el mismo 26.
  #
  # Una pata que solo vive en el gancho y se pone roja sobre `main` no la ve NADIE hasta que el
  # siguiente carril empuja: entonces la descubre un push de horas, y la descubren TODOS a la vez,
  # porque el gancho corre las mismas patas en todas las cajas. El 2026-08-29 paso cuatro veces en
  # una jornada y tres de las cuatro muertes del lote fueron eso.
  #
  # QUE ENTRA AQUI, Y POR QUE NO ENTRA TODO. No son las 152: son las patas del CARRIL RAPIDO
  # (las que paga cada push de cada rama) que hoy enrojecieron `main` sin que CI las viera. El
  # resto sigue en el gancho a proposito — este job no es un segundo gate pesado. El criterio por
  # el que entran ESTAS cuatro y no las otras 148, y lo que este job NO cierra, estan escritos en
  # an internal design note (not shipped) §2.3.
  #
  # ⚠ LO QUE NO ENTRA PORQUE YA ESTABA, y se dice para que nadie lo anada dos veces: una llamada
  # duplicada deja el gate sin mutante — si dos sitios corren la misma pata, quitar uno no pone
  # nada rojo. Ya corren, y se citan por el `id:` del paso PORQUE UN NUMERO DE LINEA CADUCA CON EL
  # PROPIO DIFF QUE LO ESCRIBE (esta rama movio un paso y desplazo veinte lineas de sus propias
  # citas; las de abajo estan re-derivadas DESPUES de la ultima edicion):
  #
  #     lint-addon-sets            control-plane   `run: task lint:addon-sets`        (:1134)
  #     lint-addon-sets-gate       control-plane   `run: task lint:addon-sets-gate`   (:1137)
  #     (docs-honesty)             control-plane   `run: task -x lint:docs-honesty`   (:1101)
  #     web-test                   web             `pnpm --dir web exec vitest run`   (:2228)
  #                                                = `test:web`, y con el el testigo de techos
  #                                                  `registry.list-ceilings.test.ts`
  #
  # ⚠ Y ESO ES EL SEGUNDO HALLAZGO DE METODO: TRES comprobaciones corren en CI SIN escribirse como
  # `task X` — `at:gate` (`pnpm --dir web run at:gate`, :2028), `test:console-walk`
  # (`bash scripts/test-console-walk.sh`, :2044) y `test:web` (:2228). El motivo esta escrito al
  # lado en :2041: el job `a11y` NO instala go-task. Un censo que solo casa `task ` las cuenta
  # como «solo-gancho» y son falsos positivos.
  #
  # ⛔ Y la equivalencia no basta con LISTARLA: hay que verificar que el comando sigue en el
  # fichero. the kernel owner lo midio en su propio gate — las encontraba en los COMENTARIOS del
  # workflow, asi que borrando la invocacion real seguia en rc=0: verde por accidente. Una lista
  # de excepciones sin testigo caduca en silencio, igual que caduco la comparacion por nombre
  # corto que dio «64 de 64». El registro de la paridad NO vive en esta rama: es
  # an internal design note (not shipped), artefacto DERIVADO de scripts/check-gate-parity.sh, y los
  # dos viajan en la rama de the kernel owner. Una lista sin su generador es un fichero que nadie lee.
  hook-only-legs:
    # Gated by the internal change gate, like every other code-input job: journal-only pushes
    # skip it. Eso es correcto aqui porque ninguno de los cuatro guiones CONSUME una ruta del
    #
    # COMPROBADO, no supuesto — y con su unica salvedad dicha: `check-export-closure.sh` menciona
    # `an internal design note (not shipped)` DOS veces (`:65` y `:1377`) y las dos son PROSA — un comentario que cita la
    # auditoria que lo origino y el texto de un mensaje de error. No lee ese directorio. Los otros
    # tres no la mencionan siquiera.
    #
    # Y quien lo vigila no es esta frase: es `task lint:classify-allowlist`, que rehusa una entrada
    # del allowlist que algo gateado consuma. Verde sobre esta rama.
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    # Job-level superseding (see the concurrency note above the jobs block).
    concurrency:
      group: mainline-ci-hook-only-legs-${{ github.ref }}-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # 40 contra una SUMA de pasos de 39 (16 pasos; 10 con guarda `!cancelled()`): `lint:ci-timeout-arithmetic`
    # exige techo > suma, porque los pasos corren en SERIE y un techo por debajo de la suma no es
    # un respaldo sino el limite efectivo — y el techo de JOB cancela los pasos que quedan, asi
    # que el informador de fallos no publica y el rojo sale MUDO.
    #
    # ⚠ Y esa suma NO es el peor caso del job, aunque sea el sujeto del gate. Corregido tras el
    # contraste `sol max` (J-02): `check-ci-timeout-arithmetic.sh:92-101` suma **solo los pasos
    # que declaran `timeout-minutes`** y deja fuera el resto por diseno. Aqui quedan fuera
    # checkout, las cachos de Go, `setup-go`, la instalacion de go-task, la sonda de TMPDIR y el
    # informador: seis pasos SIN acotar. ⇒ el techo de 35 protege contra que una PATA se cuelgue,
    # no contra que se cuelgue la infraestructura del job.
    #
    # LAS CUATRO PATAS, MEDIDAS (no estimadas) el 2026-08-29 en un contenedor de desarrollo con
    # la caja cargada. Y las CONDICIONES van enteras porque una duracion sin ellas no es
    # comparable con otra maquina — ni con esta misma otro dia:
    #
    #     load1 18,03 · 16 cpu VISIBLES · cuota del cgroup 4 cpu (cpu.max 400000/100000)
    #     ocho carriles vivos · TMPDIR propio · GOCACHE compartida y caliente
    #
    # ⛔ La primera version de esta linea decia «sobre 8 cpu» y era FALSO en las dos direcciones:
    # `nproc` da 16 y la CUOTA es 4. Con 18 de carga sobre una cuota de 4 el numero significa algo
    # muy distinto que sobre 8, asi que una condicion mal puesta no adorna una medida: la vuelve
    # enganosa. Se corrigio leyendo /sys/fs/cgroup/cpu.max, no de memoria.

    #
    #     lint:phone-home-claims          1 s  + su bateria  39 s
    #     lint:export-closure           204 s
    #     lint:int-12-no-land             1 s  + su bateria   8 s
    #     lint:list-truncation-witness   13 s  + su bateria  25 s
    #     ------------------------------------------------ TOTAL  291 s (4 min 51 s)
    #
    # Los techos de paso de abajo son 3-7x esas medidas a proposito: una duracion sin su carga no
    # es comparable con otra maquina, y estos runners no son esta caja. Si alguien los ajusta,
    # que re-mida y publique la carga, como manda el canon.
    #
    # ⛔ SUBIDO DE 35 A 40 EL 2026-08-30 porque `lint:ci-timeout-arithmetic` lo exigio: la pata
    # `leg-run-block-syntax` (a repository gate) llevo la suma de 33 a 36 y el techo era 35. **El gate lo
    # dijo antes que yo**, que es exactamente para lo que esta: un techo por debajo de la suma no
    # es un respaldo, es el limite efectivo, y cancela los pasos que quedan dejando el rojo mudo.
    # ⛔ Y LA BATERIA DE a repository gate LA SUBIO OTRA VEZ, de 36 a 39 — que es la parte que hay que leer:
    # el commit anterior AFIRMABA haber re-derivado estas cifras del fichero y NO lo hizo, porque
    # anadi el paso `leg-run-block-syntax-selftest` despues de escribirlas. `lint:ci-timeout-arithmetic`
    # siguio VERDE (39 < 40), asi que **su verde explicaba el techo y no validaba estas cifras**: un
    # gate solo responde por su propia pregunta. Lo cazo la lectura de the planner.
    #
    # ⛔ Y AL RE-DERIVARLAS APARECIO UN DESACUERDO DE PREDICADO, que se resuelve nombrandolo en vez
    # de elegir un numero: **10** pasos llevan `!cancelled()`; **11** llevan un `if:` de cualquier
    # clase, porque el informador de fallos lleva `failure()`, que es una guarda pero no esa. Las dos
    # cuentas son correctas sobre universos distintos. La cifra de esta linea es la primera, y por eso
    # dice el predicado: es la que le importa a `ci-timeout-arithmetic`.
    #
    # Se re-derivan con: python3 -c "import yaml;j=yaml.safe_load(open('.github/workflows/mainline-ci.yml'))
    # ['jobs']['hook-only-legs'];print(len(j['steps']),sum(int(x.get('timeout-minutes',0)) for x in j['steps']))"
    #
    # ⛔ EL ORDEN DE LAS PATAS, Y EL CRITERIO EN UNA LINEA: **pares gate+bateria, ordenados por el
    # coste EN FRIO EN EL RUNNER** — el que este job paga de verdad. La bateria viaja PEGADA a su
    # gate porque una bateria roja lejos de lo que prueba se lee como un rojo suelto, y partir el par
    # ahorra milisegundos.
    #
    # ⛔ LAS MEDIDAS EN CALIENTE DE UNA CAJA DE DESARROLLO **NO ORDENAN**: se escriben como condicion
    # y nada mas. `gate-parity` es el caso que lo demuestra y por eso va con nombre: **47 s en frio**
    # (the kernel owner r4) frente a **355 ms** en caliente. Ordenarla por la caliente la habria subido seis
    # puestos con el metro equivocado.
    #
    # ⛔⛔ Y LA MISMA NOCHE, DOS HORAS DESPUES, ESA CIFRA CALIENTE SE DESMINTIO SOLA: `gate-parity` dio
    # **171 s** en esta caja con load1 9,65, frente a los 355 ms de load1 7,6. **Un factor 480 en la
    # misma maquina y el mismo dia.** No es que la caliente sea peor metro que la fria: es que a esta
    # carga **no es un metro**. La cifra caliente se queda escrita porque es el dato que prueba esto,
    # no porque sirva para ordenar.
    #
    # ⛔ MEDIDO EN FRIO EL 2026-08-30 EN LA PRIMERA CORRIDA REAL DE ESTE JOB, y hasta hoy no existia
    # ninguna: `hook-only-legs` murio en su paso `tmpdir` en TODAS las corridas anteriores. Corrida
    # **33291332689** sobre `e6a278bc8`, job 99205867152, 04:21:40Z-04:40:56Z (19 min 16 s):
    #
    #   int-12 2 s (+bateria 2 s) · phone-home 5 s (+10 s) · list-truncation 24 s (+64 s) ·
    #   gate-parity 230 s · export-closure 453 s · y el paso `install go-task` 299 s
    #
    # ⛔⛔ LOS «47 s EN FRIO» DE `gate-parity` NO SE SOSTIENEN: son **230 s**, casi 5x. Esa cifra
    # justificaba su posicion y venia atribuida a otra sesion; no digo que midiera mal —pudo medir en
    # otras condiciones—, digo que la del RUNNER es de otro orden. En la primera corrida real dio
    # **230 s** y en la segunda **212 s**: el criterio de este job manda usar la del runner, y con
    # dos medidas ya se ve que la cifra util es el ORDEN DE MAGNITUD, no el numero.
    #
    # ✅ Y EL ORDEN DECLARADO SOBREVIVE A LA MEDIDA FRIA, que era lo que habia que comprobar y no
    # dar por bueno: 2 s < 5 s < 24 s < 230 s < 453 s reproduce exactamente el orden que las cifras
    # calientes habian sugerido. Coincidir no era obligatorio y por eso se comprueba.
    #
    # ✅ LA FILA QUE ESTE COMENTARIO DEJO ABIERTA ESTA CERRADA. Decia que de `run-block-syntax` y su
    # bateria «no hay medida en frio de nadie» y pedia re-medirlas en la primera corrida real. Esa
    # corrida ocurrio: **33296406847** (job 99217883639, sobre `f13bc7ddb`, el primer arbol de `main`
    # con las diez patas) las midio en **3 s** y **7 s**. Ya no queda nada provisional, y las cifras
    # calientes de una caja de desarrollo estan retiradas de los nombres: no eran un metro
    # —`gate-parity` dio 355 ms y 171 s la misma noche— y dejarlas invitaba a citarlas.
    #
    # ⛔ LAS DIEZ CIFRAS SON DE UNA SOLA CORRIDA, QUE NO ES LO MISMO QUE «LA» CIFRA. Contra la
    # anterior (`33291332689`, ocho patas, otro arbol): gate-parity **230 → 212 s**, export-closure
    # **453 → 384 s**, list-truncation **24 → 21 s**, phone-home **5 → 2 s**. Entre un **12 % y un
    # 60 %** entre dos corridas FRIAS del MISMO runner.
    #
    # ⇒ **La fria ORDENA; la fria no PREDICE.** Decide el orden de las patas, que es para lo que este
    # job la usa, y no promete cuanto tardara la proxima. Lo que se sostiene son los ordenes de
    # magnitud, y el orden declarado los respeta en las DOS corridas: 1 < 2 < 3 < 21 < 212 < 384.
    # Quien necesite una duracion la RE-MIDE y cita su corrida; extrapolar de aqui es inventar.
    # ⛔ EL TECHO DEL JOB TIENE QUE SUPERAR LA SUMA DE SUS PASOS, que corren EN SERIE: esa suma es
    # el peor caso. Con el techo por debajo, el que muerde primero es SIEMPRE el del job — y ese es
    # el unico que no sabe reportar: cancela los pasos que quedan, el reportero de fallos no llega a
    # publicar, y GitHub lo etiqueta `cancelled`. El rojo sale MUDO.
    # Este lote anade OCHO pasos a este job (contrato del publicador y su selftest, export-closure y
    # el suyo, disk-residue, y los de las porciones de DIST-24): en origin/main son 20 pasos que suman
    # 48, y aqui son 28 que suman 80. 60 -> 100, con margen para los DIEZ pasos que no declaran techo
    # propio y por tanto NO entran en esa suma pero si tardan.
    timeout-minutes: 100
    permissions:
      contents: read
      pull-requests: write # on-failure pr-failure-report only
      issues: write # the push-run form of the same reporter opens an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ⛔ HISTORIA COMPLETA, Y NO ES PRECAUCION: `check-int-12-no-land.sh:115` cuenta
          # `git rev-list --count <pin58>..<overlay-main-pin>` sobre ESTE repositorio, y despues
          # exige ancestry con `merge-base --is-ancestor` (:127-130). Con el clon superficial que
          # `actions/checkout` hace por defecto esos objetos no existen, el conteo falla y el
          # guion contesta la TERCERA respuesta (exit 2, «no he podido mirar»), que aqui saldria
          # como un rojo que no es del codigo. Reproducido en un clon superficial aislado:
          #
          #     rev-parse --is-shallow-repository  ->  true
          #     check-int-12-no-land.sh            ->  "could not count int-12-pin..overlay-main-pin
          #                                             in this tree"   rc=2
          #
          # ⚠ Y `0` es SUFICIENTE, no la unica forma suficiente — acotado tras el contraste
          # `sol max` (F-01). Lo demostrado es «depth 1 falla, depth 0 funciona»: el guion necesita
          # los DOS objetos y su relacion de ancestry, y eso lo daria tambien una profundidad
          # finita bastante o un fetch dirigido. Si aqui va `0` no es porque sea lo unico que
          # sirve, es porque es lo unico que `lint:ci-history-depth` acepta hoy (:145-151) — una
          # POLITICA, no una necesidad de `rev-list`. Se dice para que nadie lea «0 o se rompe».
          fetch-depth: 0
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # VA ANTES DE `setup-go`, igual que en los demas jobs: cuando se etiqueto `ci-runner-4`
        # el 2026-08-18 un job murio DENTRO de `setup-go` con «GOCACHE is not defined and neither
        # $XDG_CACHE_HOME nor $HOME are defined». Un arreglo colocado despues del paso que falla
        # sale verde en los runners que ya funcionaban y sigue rojo en los que no.
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: false
      # NODE FIRST, and in THIS job: `task lint:js-lexer` (a node consumer) runs below, and the
      # self-hosted runner ships no node — the same P0 that `check-workflow-node-setup` pins for
      # every other job. Without this step `lint:actions` is red on main and, being a fast-lane leg,
      # kills every branch push of every contributor (measured 2026-08-31 03:1xZ, KERNEL).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: install go-task (pinned)
        # MEASURED 2026-09-14 (run 34854565361): `go install …/task@v3.51.1` compiled the tool in
        # every job, 4m00s–6m20s each on ci-runner-1..9. The composite action installs the pinned
        # release tarball (SHA-256 verified) into the runner tool cache and proves it is reachable.
        id: tools
        uses: ./.github/actions/olivares-tool-cache
      - name: TMPDIR where an extracted binary can actually run
        # Mismo remedio y misma razon que en `control-plane`: /tmp esta montado NOEXEC en varias
        # de estas maquinas, y las patas de abajo escriben ahi sus arboles de prueba.
        #
        # ⛔ CORREGIDO ANTES DE PUBLICAR, porque la primera version de este comentario decia «el
        # gancho exporta un TMPDIR propio» Y ES FALSO: `.githooks/pre-push` no exporta ninguno —
        # HONRA el que traiga el entorno (`${TMPDIR:-/tmp}` en :141, :200, :220, :496), y quien lo
        # pone es el CARRIL, por la regla del canon §8 («`export TMPDIR=…` en cada comando que
        # lance un gate»). Ademas, algunas tareas se lo fijan a su propio guion: sin el, la de
        # :1354-1357 salia «3 de 15» con los senuelos sin arrancar y 15/0 con TMPDIR ejecutable.
        # ⇒ correrlas aqui sin fijarlo no seria «la misma pata en CI»: seria otra pata, y lo que
        # mediria seria el MONTAJE.
        #
        # ⛔ LLEVA `id:` PORQUE LA GUARDA DE ABAJO LO NOMBRA, y sin eso el parrafo anterior seria
        # una costumbre y no un testigo: con `!cancelled()` los pasos siguientes corren aunque
        # este falle, y correrian con el TMPDIR por defecto — midiendo otra cosa y diciendo que
        # miden esta. La forma de dos condiciones es la que `race-rest` ya usa con `pg-roles`
        # (:1814).
        id: tmpdir
        run: |
          # ⛔ SE COMPRUEBA EJECUTANDO, NO ASIGNANDO. La primera version de este paso solo escribia
          # la variable, y el contraste `sol max` (J-01) lo llamo por su nombre: su `success`
          # probaba que la ASIGNACION se escribio, no que el directorio admita ejecutar un binario
          # — que es literalmente lo que el nombre del paso promete. Con la guarda de abajo
          # colgando de ese outcome, un `$RUNNER_TEMP` noexec habria dado paso VERDE y las cuatro
          # patas habrian medido el MONTAJE creyendo medir el arbol.
          #
          # ⛔ Y EL PRECEDENTE TIENE DOS CONDICIONES, NO UNA. Lo cazo the kernel owner r4 revisando esta
          # rama: yo copie de `control-plane` (:647-687) la mitad EJECUTABLE y me deje la CORTA.
          # Su razon esta escrita alli (:654-658) y es medida: apuntar TMPDIR a $RUNNER_TEMP hizo
          # crecer la ruta a 118 caracteres y rompio un test de sockets — `sun_path` de un socket
          # unix admite 108, y sale `bind: invalid argument`. Por eso aquel paso exige ademas
          # `${#d} -le 24` y avisa cuando no hay candidato corto.
          #
          # NO es alcanzable hoy —ninguna de las cuatro patas de este job abre un socket, grepeado
          # por KERNEL y por mi— y por eso esto no bloquea nada. Es una bomba de relojeria para la
          # siguiente pata que alguien cuelgue aqui, y cuesta cinco lineas. **Del precedente se
          # copia la doctrina entera, no la mitad que resuelve tu caso.**
          probar() {   # <dir> -> 0 si ejecuta binarios
            local d="$1/olv-exec-$$"
            mkdir -p "$d" 2>/dev/null || return 1
            printf '#!/bin/sh\nexit 7\n' > "$d/probe" 2>/dev/null || { rm -rf "$d"; return 1; }
            chmod +x "$d/probe" 2>/dev/null || { rm -rf "$d"; return 1; }
            local rc=0; "$d/probe" 2>/dev/null || rc=$?
            rm -rf "$d"
            # 7 es el codigo que el senuelo devuelve A PROPOSITO: un 0 significaria que se ejecuto
            # OTRA cosa, y 126 es el sintoma clasico de noexec o de permiso denegado.
            [ "$rc" -eq 7 ]
          }
          elegido=""
          # ⛔ DISCO ANTES QUE /dev/shm, MEDIDO el 2026-09-16 (run 35076921214, `race-hot-manifest`
          # p3 en ci-runner-3): `go build` murio con «vet.cfg: no space left on device» bajo
          # /dev/shm/olv…/go-build…, y `race-modules` p3/p4 y el paso proto de `control-plane`
          # cayeron por lo mismo mientras dos particiones hermanas pasaban en el MISMO host: quien
          # llega primero se lleva la RAM. /dev/shm es UN tmpfs compartido por los doce runners
          # del host ci-runner-1, cada job con -race le mete gigas de arbol intermedio de Go, y
          # nadie borraba /dev/shm/olv$$ al acabar, asi que cada job cancelado dejaba el suyo.
          # $HOME es disco y sigue siendo CORTO (/home/runner/olv1234567 = 23 <= 24). Y /var/tmp DETRAS,
          # porque en los runners Hetzner HOME NO ESTA DEFINIDA (medido: run 35081963451, race-hot p1 en
          # ci-runner-8 salto el primer candidato y volvio a /dev/shm con 18187 MiB libres de 32039):
          # /var/tmp es el disco del host que si existe, mide 8 y la sonda de abajo decide si ejecuta.
          # Barrido de huerfanos ANTES de elegir: un olv* mas viejo que el timeout-minutes mayor
          # de este fichero (320) no puede pertenecer a un job vivo. Mide mtime del directorio,
          # que Go renueva al crear cada go-build*, y lo limita al usuario del runner.
          # Y MIDE el espacio libre de cada candidato antes de probarlo: el «no space left» de hoy
          # salio tres pasos mas abajo, dentro de `go build`; con la cifra aqui se lee en este paso.
          # ⛔ EL BARRIDO VA EN SU PROPIO BUCLE, y es una correccion MEDIDA: F2 de la revision
          # independiente del 2026-09-16 (an internal design note (not shipped)).
          # Dentro del bucle de seleccion solo alcanzaba a los candidatos probados ANTES del `break`,
          # asi que con /var/tmp elegido /dev/shm NO SE BARRIA NUNCA — justo el tmpfs cuyo residuo
          # tumbo la corrida 35076921214 y que en la 35081963451, con el barrido ya enviado, seguia
          # al 43 % (18187 MiB libres de 32039). Reproducido aqui: con el barrido dentro del bucle
          # los arboles viejos de /dev/shm y /run/user sobreviven; con este bucle aparte, no.
          # ⛔ Y BARRE TAMBIEN `olv-exec-<pid>` (F5). Censo de los nombres que los guiones de este
          # repositorio crean DENTRO de un candidato: `olv$$`, este paso; y `olv-exec-$$`, la sonda
          # `probar` de `hook-only-legs` en mainline-ci.yml. El respaldo `olivares_pick_exec_workdir o`
          # crea `o.XXXXXX` y NO se barre a proposito: el patron `o.??????` casaria nombres ajenos
          # (`o.config` mide exactamente seis), y un barrido solo se amplia a patrones que no puedan
          # casar lo que no es nuestro. Los parentesis del `find` NO son decorativos: sin ellos `-o`
          # reparte los predicados, el `-exec` cuelga solo de la segunda rama y llega a borrar
          # FICHEROS que no son directorios. Medido en las dos formas antes de elegir esta.
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            if [ -n "$c" ] && [ -d "$c" ]; then
              find "$c" -maxdepth 1 -mindepth 1 -type d \( -name 'olv[0-9]*' -o -name 'olv-exec-[0-9]*' \) -user "$(id -un)" -mmin +360 -exec rm -rf {} + 2>/dev/null || true
            fi
          done
          for c in "${HOME:-}" /var/tmp /dev/shm /run/user/"$(id -u)"; do
            # shellcheck disable=SC2015 # Continue unless this candidate is non-empty and a directory.
            [ -n "$c" ] && [ -d "$c" ] || continue
            # ⛔ `|| true` AL FINAL, y es una correccion MEDIDA: F3 de la revision independiente del
            # 2026-09-16. El bloque corre bajo `bash --noprofile --norc -eo pipefail` (asi ejecuta
            # GitHub un `run:` con `defaults.run.shell: bash`), asi que un `df` que falle sobre un
            # montaje que se va entre el `[ -d ]` y esta linea MATA EL PASO — y con el, el respaldo
            # `exec-workdir.sh` de abajo, que es lo que convierte esto en degradacion suave.
            # Reproducido con esa misma shell: la tuberia aborta el bucle, no imprime nada y el
            # texto posterior al bucle no se alcanza (rc 1). Una MEDIDA no decide el paso.
            df -Pk "$c" 2>/dev/null | awk -v c="$c" 'NR==2{printf "  candidato %s: %d MiB libres de %d en %s\n", c, $4/1024, $2/1024, $1}' || true
            [ "${#c}" -le 24 ] || { echo "  candidato $c: ejecutable o no, la ruta mide ${#c} (>24)"; continue; }
            if probar "$c"; then elegido="$c"; break; fi
            echo "  candidato $c: NO ejecuta binarios"
          done
          if [ -n "$elegido" ]; then
            echo "TMPDIR=$elegido" >> "$GITHUB_ENV"
            echo "TMPDIR corto y ejecutable verificado: $elegido (${#elegido} caracteres)"
          else
            probar "$RUNNER_TEMP" || { echo "::error::$RUNNER_TEMP NO ejecuta binarios (126 = noexec o sin permiso) y no hay candidato corto"; exit 1; }
            echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
            echo "TMPDIR ejecutable verificado: $RUNNER_TEMP (${#RUNNER_TEMP} caracteres)"
            [ "${#RUNNER_TEMP}" -le 24 ] || echo "::warning::sin candidato CORTO; uso \$RUNNER_TEMP (${#RUNNER_TEMP} caracteres): una pata que abra un socket unix puede pasarse de los 108 de sun_path"
          fi
      # ⛔ LAS DIEZ PATAS QUE SIGUEN LLEVAN `!cancelled()` A PROPOSITO — **seis comprobaciones y
      # cuatro baterias**, re-derivado del fichero y no contado a ojo — y es la doctrina que
      # `lint:ci-sibling-legs` ya impone en los jobs `race*`: sin el, un rojo en la primera pata
      # SALTA las tres siguientes y su cobertura se pierde sin mensaje — medido el 2026-08-24
      # sobre las corridas 32741025007 y 32753234715. Aqui duele mas que en otros sitios: el job
      # existe para que un rojo heredado de `main` se vea ENTERO en una corrida, no de uno en uno
      # a razon de un push de horas por pata.
      # Y la guarda de DOS condiciones evita el ruido contrario: si `task` no se instalo, las
      # diez dirian «command not found» y ninguna mediria nada; si el TMPDIR no se fijo,
      # correrian sobre /tmp —NOEXEC en varias de estas maquinas— y un fallo del MONTAJE se leeria
      # como un fallo de la pata. Las dos nombran pasos con `id:`; no confian en el orden.
      - name: INT-12 refusal, in the CI environment — 1 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-int-12
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⚠ AQUI CI MIDE MENOS QUE EL GANCHO, Y SE DICE EN VEZ DE FINGIRLO. Sin clon hermano y sin
        # OLIVARES_ENT_DIR el guion imprime `NOTICE — live overlay remasure skipped` y sale CLEAN
        # (`check-int-12-no-land.sh:145-160`): lo estatico —el acta, su coherencia y la distancia
        # de regresion contada sobre ESTE repositorio— si se comprueba; la re-medida contra el
        # overlay vivo, no. La paridad que este paso compra es que CI vea el lado estatico, que es
        # justo el que hoy enrojece a todos los carriles. El lado vivo sigue siendo del gancho.
        # Medido 2026-08-29: 1 s el gate, 8 s su bateria.
        timeout-minutes: 2
        env:
          # Este runner no recibe una credencial para el repositorio enterprise privado. El opt-in
          # conserva la medida estatica y hace explicita la unica mitad que aqui no puede medirse.
          OLIVARES_INT12_ALLOW_NO_OVERLAY: '1'
        # ⛔ EL PASO DICE **CUAL DE LAS DOS MITADES** MIDIO, y no es adorno: sin esto, un verde que
        # se salto la remedida viva y un verde que comprobo las DOS se ven IGUAL en la interfaz.
        # Lo levanto the kernel owner r4 revisando esta rama, aplicandome mi propia acotacion: la
        # asimetria vivia en el comentario de arriba, y **un requisito que vive en un comentario es
        # una suposicion sobre alguien que puede no existir**. Esta misma noche llevamos tres casos
        # de `SKIPPED` satisfaciendo un contexto requerido sin medir nada.
        #
        # NO es un `grep -q` que EXIJA el NOTICE: eso se pondria rojo el dia que CI GANE un clon
        # hermano, o sea castigaria una mejora. Lo que hace es DISTINGUIR, y solo rehusa cuando no
        # puede saber cual de las dos ocurrio — la tercera respuesta de siempre.
        run: |
          set -o pipefail
          # ⛔ LA FORMA `if`, Y NO UNA ASIGNACION SUELTA. Medido en la corrida 33685919433 (job
          # 100433314803): este paso salio con `exit code 2` y **CERO lineas de salida** — ni la del
          # guion, ni ninguno de los tres `::notice`, ni el `::error` del `else`. La causa no es el
          # gate: es que GitHub corre el `run:` con `bash --noprofile --norc -e -o pipefail`, y bajo
          # `-e` una ASIGNACION cuya sustitucion de comandos falla **aborta el shell en esa linea**.
          # `rc=$?` no llega a ejecutarse, el `printf` tampoco, y las cuatro ramas de abajo —escritas
          # justamente para decir QUE MITAD se midio— no corren nunca. Es decir: el diagnostico se
          # perdia exactamente cuando hacia falta, y el log solo mostraba el ECO del guion, que se
          # lee como si el `::error` se hubiera emitido.
          #
          # Reproducido fuera de CI:
          #   bash -e -o pipefail -c 'x="$(bash -c "echo hola; exit 2")"; echo LLEGUE'  -> nada, rc 2
          #   bash -e -o pipefail -c 'if x="$(…)"; then rc=0; else rc=$?; fi; echo LLEGUE' -> LLEGUE
          #
          # Un comando en la condicion de un `if` esta exento de `-e` por definicion, asi que esta
          # forma captura el rc, imprime la salida y deja que las ramas decidan. El veredicto no
          # cambia: `exit $rc` al final sigue siendo el del gate.
          if salida="$(task -x lint:int-12-no-land 2>&1)"; then rc=0; else rc=$?; fi
          printf '%s\n' "$salida"
          # ⛔ HERE-STRING, NO TUBERIA, en los cinco. Aqui habia `printf … | grep -q` bajo
          # `pipefail`, y `grep -q` cierra el tubo EN CUANTO ACIERTA: el `printf` de la izquierda se
          # lleva un SIGPIPE y la tuberia devuelve **141 justo en el caso bueno**. Lo levanto el
          # contraste `sol max` (CI-LARGE-141). Cuatro venian de antes y la quinta la anadi yo al
          # curar este paso — o sea que reintroduje, dentro de la cura, la clase que este carril
          # lleva el dia entero cerrando en los guiones.
          if grep -q 'check-int-12-no-land: SCOPED' <<<"$salida"; then
            # TERCERA RAMA (2026-08-31). En el arbol publico curado el acta INT-12 no viaja, y sin
            # esta rama el paso caia al `else` y salia 2: cuando el guion no ha medido NADA no aparece
            # ni el NOTICE de omision ni la linea de la remedida viva. Rojo DETERMINISTA en el primer
            # push a olivaresai/olivares, reproducido por el pre-mortem ALTO-1 de Codex sol max.
            # NO afloja las otras dos: es un tercer caso con su propia cadena, y el `else` sigue
            # rehusando cuando no se puede saber cual de las dos mitades se midio.
            echo "::notice::INT-12: NO APLICABLE — el acta vive solo en el hub y el export la cura fuera; no hay nada que medir aqui"
          elif grep -q 'live overlay remasure skipped' <<<"$salida"; then
            echo "::warning::INT-12: lado ESTATICO medido; la remedida VIVA contra el overlay NO SE HA MEDIDO en este runner (no hay clon hermano ni credencial para clonarlo). Esa mitad sigue siendo del gancho."
          elif grep -q 'behind overlay-main pin' <<<"$salida"; then
            echo "::notice::INT-12: las DOS mitades medidas (hay clon hermano alcanzable)"
          elif grep -q 'COULD NOT LOOK' <<<"$salida"; then
            # ⛔ LA TERCERA RESPUESTA DEL GUION, DICHA CON SU CAUSA. `check-int-12-no-land.sh` tiene
            # su propio «no he podido mirar» con motivo (`cannot()`), y hasta hoy caia en el `else`,
            # que anunciaba «no puedo saber que mitad se midio» — falso: el guion SI lo habia dicho.
            # Un paso que reetiqueta una causa nombrada como «no se» manda al lector a buscar lo que
            # ya estaba escrito. Se repite su linea y se sale con su codigo.
            echo "::error::INT-12: el gate no pudo mirar, y dijo por que: $(grep -m1 'COULD NOT LOOK' <<<"$salida")"
          else
            echo "::error::INT-12: no puedo saber que mitad se midio — ni el NOTICE de omision ni la linea de la remedida viva"
            exit 2
          fi
          exit $rc
      - name: INT-12 — its own battery (land-as-is, compile premise, gated Snapshot) — 2 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-int-12-selftest
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # Esta bateria NO la corre el gancho: llama a la pata (`.githooks/pre-push:1473`) y no a
        # su selftest. Es la unica asimetria a favor de CI de este job, y esta declarada como tal
        # en an internal design note (not shipped) (registro de KERNEL, en su rama).
        timeout-minutes: 2
        run: task lint:int-12-no-land:selftest
      - name: phone-home promises on live surfaces — 2 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-phone-home
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # Medido 2026-08-29 (load1 18, 8 carriles): el trinquete 1 s, su bateria 39 s. Es una de
        # las cinco patas que hoy heredaron rojo de `main` y que descubrio un push de 3,5 h, no
        # CI. La bateria va con el trinquete y no aparte: un patron multilingue sin un control
        # POR IDIOMA es una suposicion — asi se encontro que la alternativa rusa no disparaba
        # nunca.
        timeout-minutes: 3
        run: task lint:phone-home-claims
      - name: phone-home ratchet — its own battery (a control per published locale) — 10 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-phone-home-selftest
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⛔ PASO APARTE, NO `&&`. Con `A && B` un rojo en el trinquete SALTA su bateria, que es el
        # mismo defecto que `!cancelled()` cierra ENTRE pasos y que yo habia reintroducido DENTRO
        # de uno. Y las dos no dicen lo mismo: el trinquete dice si el arbol tiene una promesa
        # nueva; la bateria dice si el trinquete SIGUE SABIENDO CAZARLA — asi se encontro que la
        # alternativa rusa no disparaba nunca. Perder la segunda porque fallo la primera es
        # perder justo la que explica a la primera.
        timeout-minutes: 3
        run: task lint:phone-home-claims:selftest
      - name: PyYAML alcanzable — la pata siguiente parsea YAML y DOS runners no lo traen · <1 s
        id: pyyaml
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        # ⛔ a repository gate, medido el 2026-09-02 sobre corridas reales. `check-run-block-syntax.sh` contesta
        # `2 NO HE PODIDO MIRAR: no puedo importar yaml` -> rc 201 -> job ROJO. Y el arbol es inocente:
        #
        #     run 33574829101  hook-only-legs = success   runner ci-runner-3   (296 bloques parsean)
        #     run 33571311254  hook-only-legs = FAILURE    runner srv17
        #     run 33542575488  hook-only-legs = FAILURE    runner ci-runner-6
        #
        # Mismas etiquetas en todo el pool y distinto entorno: el MISMO commit da dos veredictos segun
        # que maquina lo coja, y un re-run "lo arregla" cayendo en otra. Un job que SUPONE un paquete
        # del runner no es reproducible; uno que lo DECLARA si.
        #
        # ⛔ INSTALAR NO ES ALCANZAR — la misma disciplina que el paso de go-task, que existe porque
        # un `go install` salio VERDE y tres pasos despues `task` no estaba en PATH. Aqui se comprueba
        # IMPORTANDO, que es lo que hace la pata, y no mirando el rc de pip.
        timeout-minutes: 2
        run: |
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML ya presente: $(python3 -c 'import yaml; print(yaml.__version__)')"
            exit 0
          fi
          echo "PyYAML ausente en $RUNNER_NAME — se instala"
          python3 -m pip install --quiet --disable-pip-version-check --user pyyaml \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyyaml \
            || { echo "::error::no pude instalar PyYAML en $RUNNER_NAME"; exit 1; }
          python3 -c 'import yaml; print("PyYAML tras instalar:", yaml.__version__)' \
            || { echo "::error::pip dijo OK y yaml SIGUE sin importar en $RUNNER_NAME"; exit 1; }
      - name: every workflow `run:` block parses (279 bloques) — 3 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-run-block-syntax
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⛔ ESTA PATA EXISTE POR ESTE JOB, y por eso corre aqui ademas de en el gancho (a repository gate).
        # Su estreno real murio en el paso `tmpdir` con exit 2 y NI UNA LINEA: un `if … else …` sin
        # `fi`. Bash sale 2 ante un error de sintaxis y no imprime nada del guion, asi que el log
        # ensena el script y luego «Process completed with exit code 2»; el job midio 1 de 14 pasos.
        #
        # Y `lint:actions` estuvo VERDE todo el rato — actionlint valida el WORKFLOW, no el shell de
        # dentro de `run:` —, asi que el gate que se citaba como testigo de ese paso no podia ver la
        # clase. Un control se coloca donde su fallo ocurre: el gancho lo caza antes de empujar, y
        # este job lo caza en el entorno donde el fallo se manifesto.
        #
        # COLOCADA POR COSTE, Y LA REGLA DEL JOB ES: **pares gate+bateria, ordenados por el coste
        # del GATE; la bateria viaja PEGADA** porque una bateria roja lejos de su gate se lee como un
        # rojo suelto, y partir el par ahorra milisegundos. Este par (1,295 s + 1,792 s, 279 bloques) va detras
        # del de `phone-home` (725 ms + 3,308 s) y delante del de `list-truncation` (6,660 s).
        #
        # ⛔ LA VERSION ANTERIOR DE ESTE COMENTARIO AFIRMABA UNA POSICION QUE EL FICHERO NO TENIA
        # —«va entre phone-home y su bateria»— y unas cifras que no eran de este arbol. Lo cazo la
        # lectura de the planner, no un gate: **ningun control compara la prosa de un comentario con
        # el orden real de los pasos**, asi que una posicion afirmada en texto es una promesa sin
        # testigo. Se re-deriva a mano en cada cambio, o se cae otra vez.
        #
        # ⚠ Y LAS DURACIONES OSCILAN CON LA CARGA: esta misma pata dio **1 908 ms** a las 01:5xZ y
        # **1 295 ms** a las 02:56Z con load1 7,6. Por eso el nombre lleva la condicion. El orden por
        # coste entre patas VECINAS no es estable; el que se sostiene es el de ordenes de magnitud.
        timeout-minutes: 3
        run: task lint:run-block-syntax
      - name: and its battery (12 casos, la no-descarga incluida) — 7 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-run-block-syntax-selftest
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # La bateria viaja CON su gate, como int-12 y list-truncation, y no por simetria: sin ella
        # este job dice «los bloques parsean» cuando lo que ha comprobado es que el guion no revento.
        # El caso que la justifica es el de la no-descarga — `${{ }}` dentro de un heredoc y como
        # comando entero—, que es donde un parser ingenuo se rompe y llama sucio a lo limpio.
        #
        # LA ANADE EL GATE, NO YO: `lint:gate-parity` salio rc=1 al publicar a repository gate porque
        # `run-block-syntax:selftest` vivia solo en el gancho. Anadi la pata y no su bateria, que es
        # exactamente el descuido que ese registro existe para no dejar pasar en silencio.
        timeout-minutes: 3
        run: task lint:run-block-syntax:selftest
      - name: list-truncation witness (console views over a live list) — 21 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-list-truncation
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # El «testigo de recorte» de la jornada del 08-29. Vive en el carril RAPIDO del gancho
        # (.githooks/pre-push:1305-1306) y en ningun job: un rojo suyo sobre `main` lo cobra el
        # siguiente push de cualquier caja.
        # ⚠ Su `desc:` del Taskfile (:2232) sigue diciendo «NO ESTA EN EL GATE DE PUSH, Y ES
        # DELIBERADO». Eso caduco: el gancho la llama en el carril RAPIDO desde :1305. La prosa
        # que describe donde corre una pata es una tercera representacion y deriva en silencio;
        # queda anotada en an internal design note (not shipped) §3 para que se corrija donde vive.
        # Medido 2026-08-29: 13 s el gate, 25 s su bateria.
        timeout-minutes: 3
        run: task lint:list-truncation-witness
      - name: list-truncation witness — its own battery (six cells, both directions) — 55 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-list-truncation-selftest
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # Su primera corrida cazo que el guion era ciego por un `| grep -q` bajo pipefail, que
        # devuelve 141 EN EXITO. Una bateria que solo corre cuando su gate esta verde nunca habria
        # visto eso.
        timeout-minutes: 3
        run: task lint:list-truncation-witness:selftest
      # ⛔ TECHO SUBIDO DE 5 A 10 EL 2026-09-01, y el motivo NO es que 212 s se quedaran cortos.
      #
      # La corrida 33534949283 murio aqui con `has timed out after 5 minutes` DESPUES de imprimir
      # su resultado (`gancho=234 ci=81 ambas=51 solo-ci=30 solo-gancho=183`): el gate hizo su
      # trabajo y el techo lo mato al publicarlo. Un rojo asi se lee como hallazgo de paridad y no
      # lo es, asi que la razon vive aqui y no solo en el registro.
      #
      # ⚠ LO QUE NO SE SABE, dicho porque el numero se elige a pesar de ello: los 212 s son EN
      # FRIO y el coste BAJO CARGA es «>300 s», valor desconocido — el paso se mato antes de
      # terminar, asi que nadie lo ha medido. El techo se calibra por la PROPORCION de sus
      # vecinos, no por un coste real que no tenemos: en este mismo job, 55 s lleva 3 min (3,3x) y
      # 384 s lleva 12 min (1,9x), mientras este llevaba 1,4x — el mas justo de los once.
      #
      # INVARIANTE DE `lint:ci-timeout-arithmetic`: el techo del JOB (60) debe superar la SUMA de
      # los pasos, que pasa de 41 a 46. Margen 14 min.
      - name: rescue backlog census — its battery, because nobody else runs it
        id: leg-rescue-backlog
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⛔ AQUI Y NO EN EL GANCHO, Y ES UNA DECISION, NO UN OLVIDO. `check-rescue-backlog.sh`
        # (a repository gate) cuesta 4-25 s por ref —137 s sobre 14 medidos— y su SUJETO son los refs del
        # REMOTO, no el arbol que se empuja: cobrarle dos minutos a cada carril por algo que no
        # depende de su cambio es lo que esta casa ya retiro con `lint:unpublished-work`.
        #
        # Pero dejarlo sin nadie que lo corra es peor, y me lo dijo el gate de esta misma casa:
        # `lint:orphan-batteries` rechazo mi lote con «un banco que nadie corre no corta, y su
        # verde se lee como cobertura» — la clase que este job entero existe para cortar, cometida
        # por quien acababa de escribir el gate. Aqui SI se ejecuta, periodicamente, que es la
        # cadencia que un censo necesita.
        #
        # Solo la BATERIA: el censo en si es informativo (sale 1 si hay rescates pendientes, y hoy
        # hay 8 con 60 parches) y no debe enrojecer el CI hasta que esa cola este vacia.
        run: task lint:rescue-backlog:selftest

      - name: lot-heads — adopted battery
        id: leg-lot-heads
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # El banco usa un repositorio y una API loopback propios. No recibe github.token: así prueba
        # el parser de `head.sha` sin red y no puede enviar una credencial real a su servidor.
        run: task lint:lot-heads:selftest
      - name: prep-gate-pins — adopted battery
        id: leg-prep-gate-pins
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # Paso propio para que un rojo de lot-heads no oculte esta bateria bajo `bash -e`.
        run: task lint:prep-gate-pins:selftest

      # `test:key-domains` ya corre en control-plane/release-seams despues de `task build:release`,
      # que puebla los binarios requeridos por `-tags release`. La copia que habia aqui carecia de
      # esa precondicion y duplicaba la misma asercion; se conserva una sola autoridad efectiva.

      - name: gate parity (hook vs mainline-ci) — 212 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-gate-parity
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⛔ HUNK CONJUNTO CON the kernel owner r4 (a repository gate). Su gate compara lo que corre el gancho con lo
        # que corre este workflow, en los DOS sentidos, y hasta hoy no lo ejecutaba nadie: vivia en
        # el Taskfile y en ningun job. Un control que nadie ejecuta CALLA, y callar se lee como
        # verde — que es literalmente la clase que este job entero existe para cortar.
        #
        # ⚠ POSICION 7 DE 8, Y ES LA QUE YO HABIA PEDIDO — pero solo despues de que el job se
        # ordenara por coste. La historia importa porque explica por que el hunk conjunto la puso
        # en la 3: mis dos condiciones eran «detras de todas las sub-segundo» y «delante de las
        # caras», y KERNEL midio que en el orden de ENTONCES **no habia sitio que cumpliera las
        # dos** —`int-12` y su bateria iban DETRAS de los 112 s de `export-closure`—, asi que la 3
        # cumplia la que importaba. Con las patas ordenadas por coste, las dos se cumplen a la vez:
        # va detras de las seis mas baratas y delante de la unica mas cara.
        #
        # ⇒ una restriccion «insatisfacible» puede serlo por el ORDEN y no por las condiciones. Sus
        # medidas, que sustituyen a los techos —un `timeout-minutes` es un limite configurado, no
        # una duracion—:
        #
        #     phone-home 705 ms · su selftest 2,1 s · export-closure 112 s · int-12 227 ms
        #     su selftest 589 ms · list-truncation 3,8 s · su selftest 10,1 s · gate-parity 46,7 s
        #
        # Y el coste va EN EL NOMBRE del paso, no en un comentario: quien lea la interfaz ve lo que
        # cuesta sin abrir el fichero.
        #
        # El reorden por coste llego en su propio claim, ENCIMA de este hunk, por lo que decia esta
        # misma nota: un reorden mueve las lineas que el hunk toca, asi que no podian viajar juntos.
        timeout-minutes: 10
        run: task lint:gate-parity
      - name: JS lexer unit table (the layer where the defect lives)
        id: leg-js-lexer
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # Va JUSTO ANTES de export-closure porque es el orden del gancho, y porque mide la capa de
        # DENTRO del guion que la siguiente pata ejercita entera. No la sustituye: el 2026-08-30 el
        # banco de punta a punta estuvo en 118 verdes mientras un cambio de ese lexer descartaba
        # TODO guion node ejecutable del arbol — ningun fixture suyo llevaba shebang, division ni
        # regex, porque cada caso alli cuesta un arbol, un manifiesto y un Taskfile. Aqui un caso es
        # una linea. Dos capas, dos preguntas.
        #
        # Techo 2 y no menos por costumbre: la tabla es bash puro, sin arbol ni manifiesto, y corre
        # en ~1 s, asi que 2 son 120x. Y no mas, porque la suma de pasos acotados de este job pasa
        # de 28 a 30 contra un techo de JOB de 35: `lint:ci-timeout-arithmetic` exige techo > suma.
        timeout-minutes: 2
        run: task lint:js-lexer
      - name: public-export closure (the net over the known break patterns) — 384 s EN FRIO · corrida 33296406847 · 2026-08-30T06:49:49Z
        id: leg-export-closure
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tmpdir.outcome == 'success' }}
        # ⚠ NO ES LA PATA QUE YA CORRE EN CI, Y LA CONFUSION ES FACIL PORQUE COMPARTEN NOMBRE.
        # `lint:export` —que ya esta en `control-plane`:1145— pregunta si SOBRA algo: «todo camino
        # trackeado esta clasificado (allow/block) y ningun ref interno se filtra»
        # (Taskfile.yml:5839). `lint:export-closure` pregunta lo contrario, y lo dice su propia
        # cabecera: «a NET over the KNOWN ways the PUBLIC export stops containing what the PUBLIC
        # export RUNS … every path invoked from a PUBLISHED script … should itself be published»
        # (scripts/check-export-closure.sh:6-9). Uno mira lo que sobra, el otro lo que FALTA: un
        # verde del primero no dice nada del segundo, y sustituir uno por otro es un punto ciego
        # con aspecto de cobertura.
        # Run 34605535943 passed all 125 assertions after 12m05s, then hit
        # the old 12-minute deadline before cleanup finished. Allow cleanup
        # margin; the complete runtime remains to be measured.
        timeout-minutes: 20
        run: task lint:export-closure
      - name: leg-disk-residue-selftest
        # La bateria del vigia de residuo. Llego con el arreglo del vigia y NADIE la invocaba: su
        # unica tarea era `disk:residue`, de operaciones, que el gancho no alcanza — asi que
        # `lint:orphan-batteries` la conto como huerfana. Al cablearla en el gancho paso a
        # SOLO-GANCHO y `lint:gate-parity` lo marco como lo que es, una DECISION. Se cablea aqui en
        # vez de declararse asimetrica porque el gancho es de cliente y se salta: este vigia decide
        # si el carril sigue corriendo un gate, y su bateria no puede depender de que nadie usara
        # `--no-verify`.
        timeout-minutes: 6
        run: task lint:disk-residue:selftest
      - name: leg-export-closure-selftest
        # El banco del gate anterior. Monta su propio arbol de laboratorio: no toca el repositorio,
        # ni la red, ni AWS, y tarda menos de un segundo — el techo va holgado a proposito, porque
        # una pata barata que agota su plazo se lee como rota.
        timeout-minutes: 4
        run: task lint:export-closure:selftest
      - name: leg-publisher-contract
        # ⛔ NO ES SOLO-GANCHO, y la razon es la que decide `lint:gate-parity`: esta pata mide EL
        # COMMIT, no el arbol de trabajo. En el gancho lo consigue materializando los tips de
        # `OLIVARES_PUSH_REFS_FILE`; aqui no hace falta, porque en un runner el checkout YA ES el
        # commit aterrizado y su camino de reserva —medir el worktree— mide exactamente eso.
        #
        # Y hace falta aqui aunque el gancho la corra: el gancho es de cliente y se salta
        # (`--no-verify`, `core.hooksPath`, un barrido que empuje la rama de otro). El contrato
        # gobierna las claves de S3 con las que se publica el 28.º artefacto; si deriva de su
        # generador, el publicador sube a la ruta vieja, informa exito y el comprador recibe 404.
        # Eso no puede depender de que nadie se saltara un hook.
        timeout-minutes: 6
        run: task lint:publisher-contract
      - name: leg-publisher-contract-selftest
        # La bateria del gate, por la misma razon que el gate: sus guardas cierran silencios (un
        # generador que sale 0 sin escribir, un consumidor derivado, una ausencia sin clasificar),
        # y un gate cuyo modo de fallo es decir que todo esta bien no se verifica solo.
        timeout-minutes: 6
        run: task lint:publisher-contract:selftest
      - name: leg-aws-iam-phase2-selftest
        # Corre contra un `aws` FALSO: no toca AWS ni necesita credenciales. Va en CI porque el
        # gancho es de cliente y se salta, y esta herramienta decide como se estrecha el rol de IAM
        # con el que se aplica el estate. Sin esta pata la bateria seria hub-only y `gate-parity`
        # lo diria con razon.
        timeout-minutes: 5
        run: task lint:aws-iam-phase2:selftest
      - name: leg-roles-oneshot
        # ⛔ ESTA PATA ES DE (CLOUD-06b) Y LA CABLEO YO, que no es lo habitual. Su tarea
        # `lint:roles-oneshot` existia y NADIE la alcanzaba: `lint:orphan-batteries` la declara
        # huerfana NUEVA, o sea que en cuanto la tanda 5 aterrice enrojece el carril rapido de
        # TODAS las cajas. Medida antes de cablearla: 29 casos, 8 s, rc 0, y sus llamadas van
        # contra dobles — no toca AWS. Un banco que nadie corre no corta, y su verde se lee como
        # cobertura.
        timeout-minutes: 5
        run: task lint:roles-oneshot

      - name: leg-ci-int12-step-selftest
        # El banco del PASO de arriba. Corre contra un `task` falso y no construye nada. Va en CI
        # porque el defecto que vigila es de CI: el `run:` de un paso solo se comporta asi bajo el
        # shell que GitHub le pone.
        run: task lint:ci-int12-step:selftest

      - name: leg-refs-file-readers-selftest
        # Los bancos de los dos sujetos que leian `OLIVARES_PUSH_REFS_FILE` sin tener ninguno.
        # Montan clones de laboratorio: no tocan el clon compartido, y uno de los sujetos hace
        # `git fetch --all`, que en un almacen compartido mata los pushes que estan corriendo.
        timeout-minutes: 5
        run: task lint:refs-file-readers:selftest
      - name: leg-pre-verify-tanda-selftest
        # El banco de la herramienta de pre-verificacion. Monta su propio arbol de laboratorio con
        # un Taskfile y un gate falsos: no corre ninguna pata de verdad, no construye y no coge el
        # mutex. Tarda segundos.
        timeout-minutes: 4
        run: task lint:pre-verify-tanda:selftest
      - name: report failure (PR comment, or issue on a main push; PAT-blind)
        if: ${{ failure() }}
        uses: ./.github/actions/pr-failure-report
        with:
          steps-json: ${{ toJSON(steps) }}
