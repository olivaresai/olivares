  # 103686207033, with no assertion or race failure: one package that does not fit one runner.
  # This job owns it, split by ENTRY POINT under an anchored -run. Its four legs are required
  # by race-hot, so removing the package from race-modules cannot silently drop it.
  race-sessions:
    needs: [classify]
    if: needs.classify.outputs.code == 'true'
    strategy:
      # fail-fast: false for the same reason race-modules carries it: under the default the
      # first partition to fail cancels the others, and a cancelled leg reports nothing about
      # the packages it was racing. The aggregate is red either way.
      fail-fast: false
