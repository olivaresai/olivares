      # ⚠ THE TWO DO NOT GUARD THE SAME THING, and the difference is measured, not assumed. With the
      # refusal deleted from the deriver, `lint:addon-sets` still exits 0 — the real canon carries no
      # offending key, so a weakened refusal changes nothing it can see. `lint:addon-sets-gate`
      # exits non-zero, because its witnesses feed the shapes the canon does not have yet.
      #
      # So: the GATE is the safety property, and the deriver is the canary for the canon we actually
      # ship. Dropping either leaves a real hole — and dropping the gate is the one that would let a
      # gated module through in silence.
      - name: add-on sets still derive from today's canon (the canary)
        id: lint-addon-sets
        run: task lint:addon-sets
      - name: the add-on set battery — the refusal's own witnesses (the safety property)
        id: lint-addon-sets-gate
        run: task lint:addon-sets-gate
