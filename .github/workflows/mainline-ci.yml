      # cmd/olivares's long-poll e2e tail (~36m on a generous box, more on a 2-vCPU
      # runner — over the per-binary go-test ceiling). On push we run the FULL suite
      # without -race (correctness, no coverage lost) plus -race on the concurrency-hot
      # paths (every module but the cmd/olivares root + the root's hot tests via the
      # fail-closed scripts/race-hot-tests.sh manifest). The full -race sweep runs
      # WEEKLY in race-full.yml. Bounded CI minutes, no silent race gap.
      - name: test (functional, no -race)
        id: test-functional
        # ⛔ 45 -> 120 el 2026-08-23. Este paso NO se pasó de largo: TOPÓ. Duró **2713 s contra un
        # techo de 2700** —trece segundos— en la corrida 32605874242, así que fue CORTADO, y por
        # tanto la lista de tests fallidos que publicó era el PREFIJO de una corrida truncada, no
        # el inventario. Es la misma forma que convirtió «cinco rojos heredados» en OCHO el 08-22.
        #
        # Y debajo mordía un SEGUNDO techo, el del binario: cuatro paquetes murieron en el mismo
        # número —`panic: test timed out after 15m0s`, 900,09x s— con un quinto al 88 %. Ése sube a
        # 45m en el Taskfile, en este mismo commit; sin subir también ÉSTE, el paso seguiría
        # cortando antes de que el presupuesto nuevo sirviera para nada.
        #
        # `control-plane` es uno de los cuatro contextos que la protección de `main` EXIGE: mientras
        # los dos techos muerdan no puede dar veredicto completo ni ponerse verde. 120 es COTA, no
        # medida — ninguno de los cuatro paquetes ha TERMINADO nunca en esta pata.
        timeout-minutes: 120
        run: task test:functional 2>&1 | tee "$RUNNER_TEMP/ci-fail-test-functional.log" && rm "$RUNNER_TEMP/ci-fail-test-functional.log"
