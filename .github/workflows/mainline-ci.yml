          antes=$(git for-each-ref --format='%(refname)' refs/remotes/ | grep -c . || true)
          git remote prune origin || true
          despues=$(git for-each-ref --format='%(refname)' refs/remotes/ | grep -c . || true)
          alcanzables=$(git rev-list --count HEAD || echo '?')
          todas=$(git rev-list --count --all --no-merges || echo '?')
          echo "secrets-prune: refs de seguimiento ${antes} -> ${despues} (podadas: $((antes - despues)))"
          echo "secrets-prune: commits alcanzables desde HEAD=${alcanzables} · en todas las refs=${todas}"
          echo "secrets-prune: si la segunda sigue MUY por encima de la primera, quedan ramas VIVAS"
          echo "               de otros carriles; eso no lo arregla el prune y no es un fallo."
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
