        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: install go-task (pinned)
        id: tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          # Instalar no es alcanzar. Medido 2026-08-18 en ci-runner-2: este paso salio VERDE y
          # tres pasos despues `task` no existia, asi que el rojo lo cobro un gate de Postgres
          # que no tenia nada que ver. Un paso que instala una herramienta y no comprueba que
          # se alcanza traslada su propio fallo a otro sitio.
          command -v task || { echo "::error::go install dijo OK y task no esta en PATH (GOBIN=$GOBIN, PATH=$PATH)"; exit 1; }
