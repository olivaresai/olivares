      # la que decide qué corre.
      - name: documentation honesty (capability and supply-chain wording)
        id: lint-docs-honesty
        run: task -x lint:docs-honesty
      - name: security.txt RFC 9116 honesty/freshness (presence, unexpired, contact in sync)
        id: lint-security-txt
        run: task lint:security-txt
      # Commercial canon consistency. ENFORCING, and this comment says so because
