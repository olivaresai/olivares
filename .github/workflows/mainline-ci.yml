            echo "check-secrets: 2 NO PUDE MIRAR — the HEAD-history sweep does not fit in 80 min."
            echo "check-secrets:   Not a flake and not a supersession: the work grew and the ceiling did not."
            echo "check-secrets:   This is inability-to-inspect (exit 2), not a clean verdict."
            exit 2
          fi
          if [ "$rc" = "0" ]; then rm -f "$RUNNER_TEMP/ci-fail-gitleaks.log"; fi
          exit "$rc"
