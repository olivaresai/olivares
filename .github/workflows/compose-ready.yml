#
# Compose and agent-runtime qualification on the repository's runner pool (vars.CI_RUNNER),
# or a GitHub-hosted runner where the repository has no pool, as on the public repository,
# whose release tags would otherwise queue with no runner. It builds this checkout locally
# and exercises the reference Compose files; it never logs into a registry or
# publishes bytes.
# It runs nightly on development main and on every release tag before publication (the
# release candidate); a maintainer can also dispatch it on a PR branch. Keep pull requests
# on hosted runners, as pr-ci.yml requires; a pool Docker daemon is trusted CI.
#
# A pool runner's Docker daemon is shared with other runs, workflows and repositories. Both
# Compose projects (with their volumes and networks) and the local image tag are owned by
# this repository, run and attempt; a CI-only final layer removes every published host
# port; cleanup removes only those owned resources. The concurrency group below only
# supersedes runs of the same ref in this repository; it isolates nothing on the host.
name: compose-ready

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: compose-ready-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qualify-compose-ready:
    # The nightly is for development main, where changes land every day; public main only
    # changes on a release export, whose tag runs this job anyway.
    if: >-
      vars.OLIVARES_DEV_CI == 'true' ||
      (github.event_name != 'schedule' &&
      (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 115
    # The owned identities, spelled once. Every step that touches Docker validates them with
    # `check-compose-ready.sh owner` first. Build metadata stays the source commit.
    env:
      READY_POSITIVE_PROJECT: olivares-ready-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-positive
      READY_NEGATIVE_PROJECT: olivares-ready-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-negative
      OLIVARES_IMAGE: olivares-compose-ready:${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: go.work
          # Self-hosted runners keep the module and build caches on local disk between jobs;
          # uploading them to the Actions cache costs minutes and buys nothing.
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum

      # Use the verified release installer and its following-step PATH check.
      # Keep this version explicit so the readiness contract detects default drift.
      - name: install go-task (pinned)
        timeout-minutes: 10
        uses: ./.github/actions/olivares-tool-cache
        with:
          task_version: "3.51.1"
      - name: hermetic readiness contract and always-yes mutant
        timeout-minutes: 3
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          task lint:compose-ready
          task lint:compose-ready:selftest

      - name: build this checkout locally (never publish)
        timeout-minutes: 35
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          source_epoch="$(git show -s --format=%ct HEAD)"
          docker build \
            --build-arg VERSION="$(sh scripts/build-ldflags.sh --version)-compose-ready-ci" \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg SOURCE_DATE_EPOCH="$source_epoch" \
            --tag "$OLIVARES_IMAGE" .

      - name: agent dependencies work with a read-only rootfs and fresh volume
        timeout-minutes: 3
        run: |
          bash scripts/check-compose-ready.sh owner
          bash scripts/qualify-container-agent-runtime.sh "$OLIVARES_IMAGE" \
            "${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-source"

      - name: reference SQLite Compose reaches healthy
        timeout-minutes: 4
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          files=(
            -f deploy/compose/docker-compose.yml
            -f deploy/compose/docker-compose.ready-no-ports.ci.yml
          )
          compose_version="$(docker compose version --short)"
          bash scripts/check-compose-ready.sh compose-version "$compose_version"
          config="$RUNNER_TEMP/$READY_POSITIVE_PROJECT.config.json"
          docker compose -p "$READY_POSITIVE_PROJECT" "${files[@]}" config --format json >"$config"
          bash scripts/check-compose-ready.sh effective-config "$config" "$READY_POSITIVE_PROJECT" "$OLIVARES_IMAGE" \
            olivares
          docker compose -p "$READY_POSITIVE_PROJECT" "${files[@]}" \
            up --wait --wait-timeout 120
          cid="$(docker compose -p "$READY_POSITIVE_PROJECT" "${files[@]}" ps -q olivares)"
          test -n "$cid"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$cid")" = healthy
          # Run from the checkout root like the README: /project exists and is not the checkout,
          # whose deploy/compose/ holds dr-pass and .env on a Compose install.
          docker exec "$cid" test -d /project -a ! -e /project/deploy/compose/docker-compose.yml

      - name: remove positive fixture
        if: ${{ always() }}
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          docker compose -p "$READY_POSITIVE_PROJECT" \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.ready-no-ports.ci.yml \
            down --volumes --remove-orphans

      - name: running Postgres standby makes compose wait return one
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          POSTGRES_SUPERUSER_PASSWORD: compose-ready-fixture-superuser
          OLIVARES_DB_PASSWORD: compose-ready-fixture-app
          OLIVARES_ADMIN_PASSWORD: compose-ready-fixture-admin
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          files=(
            -f deploy/compose/docker-compose.yml
            -f deploy/compose/docker-compose.postgres.yml
            -f deploy/compose/docker-compose.standby-not-ready.ci.yml
            -f deploy/compose/docker-compose.ready-no-ports.ci.yml
          )
          compose_version="$(docker compose version --short)"
          bash scripts/check-compose-ready.sh compose-version "$compose_version"
          config="$RUNNER_TEMP/$READY_NEGATIVE_PROJECT.config.json"
          docker compose -p "$READY_NEGATIVE_PROJECT" "${files[@]}" config --format json >"$config"
          bash scripts/check-compose-ready.sh effective-config "$config" "$READY_NEGATIVE_PROJECT" "$OLIVARES_IMAGE" \
            olivares olivares-standby postgres
          # Name the assertion that fails and show what the standby was doing: the probe's
          # own output (HTTP 503 only if the engine answered) and the engine's last lines.
          # This log can be public. A fresh engine prints its one-time setup token, and a line that
          # starts with :: would be read by the runner as a workflow command, so each line is indented.
          redact() { sed -E -e 's/olst_[A-Za-z0-9_-]+/olst_REDACTED/g' -e 's/^/| /'; }
          fail() {
            echo "::error::standby negative step: $*" >&2
            docker ps --all --filter "label=com.docker.compose.project=$READY_NEGATIVE_PROJECT" >&2 || true
            if [ -n "${cid:-}" ]; then
              docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}{{with .State.Health}} health={{.Status}}{{range .Log}} probe exit={{.ExitCode}}: {{.Output}}{{end}}{{end}}' "$cid" >&2 || true
              docker logs --tail 40 "$cid" 2>&1 | redact >&2 || true
            fi
            # up --wait also exits 1 for a leader that never became healthy.
            docker logs --tail 40 "$(docker ps --all -q --filter "label=com.docker.compose.project=$READY_NEGATIVE_PROJECT" --filter "label=com.docker.compose.service=olivares")" 2>&1 | redact >&2 || true
            exit 1
          }
          set +e
          docker compose -p "$READY_NEGATIVE_PROJECT" "${files[@]}" \
            up --wait --wait-timeout 90
          rc=$?
          set -e
          cid="$(docker compose -p "$READY_NEGATIVE_PROJECT" "${files[@]}" ps --all -q olivares-standby)" || cid=
          [ "$rc" -eq 1 ] || fail "expected compose up --wait rc=1 for a running /readyz=503 standby; got rc=$rc"
          [ -n "$cid" ] || fail "compose has no olivares-standby container"
          running="$(docker inspect --format '{{.State.Running}}' "$cid")" || fail "cannot inspect olivares-standby"
          [ "$running" = true ] || fail "olivares-standby is not running (State.Running=$running)"
          health="$(docker inspect --format '{{with .State.Health}}{{.Status}}{{else}}none{{end}}' "$cid")" || fail "cannot inspect olivares-standby health"
          probes="$(docker inspect --format '{{with .State.Health}}{{range .Log}}{{.Output}}{{end}}{{end}}' "$cid")" || fail "cannot read olivares-standby health log"
          [ "$health" = unhealthy ] || fail "olivares-standby health is '$health', want unhealthy"
          grep -qF 'HTTP 503' <<<"$probes" || fail "no health probe of olivares-standby reported HTTP 503, so /readyz was not answered by a running standby"

      - name: remove negative fixture
        if: ${{ always() }}
        env:
          POSTGRES_SUPERUSER_PASSWORD: compose-ready-fixture-superuser
          OLIVARES_DB_PASSWORD: compose-ready-fixture-app
          OLIVARES_ADMIN_PASSWORD: compose-ready-fixture-admin
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          docker compose -p "$READY_NEGATIVE_PROJECT" \
            -f deploy/compose/docker-compose.yml \
            -f deploy/compose/docker-compose.postgres.yml \
            -f deploy/compose/docker-compose.standby-not-ready.ci.yml \
            -f deploy/compose/docker-compose.ready-no-ports.ci.yml \
            down --volumes --remove-orphans

      - name: release, FIPS and STIG contexts support agents (never publish)
        timeout-minutes: 40
        run: |
          bash scripts/check-compose-ready.sh owner
          bash scripts/qualify-container-release.sh "$OLIVARES_IMAGE" \
            "${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # Only this run's exact local tag, after both owned projects are down.
      # No force, no prune, no image ID: a tag still in use fails here and stays a
      # failure, and an image that was never built is reported instead of removed.
      - name: remove this run's image tag
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          bash scripts/check-compose-ready.sh owner
          if ! listed="$(docker image ls --filter "reference=$OLIVARES_IMAGE" --format '{{.Repository}}:{{.Tag}}')"; then
            echo "::error::could not inspect local image $OLIVARES_IMAGE" >&2
            exit 1
          fi
          if ! grep -qxF -- "$OLIVARES_IMAGE" <<<"$listed"; then
            echo "image $OLIVARES_IMAGE was never built or is already absent; nothing to remove"
            exit 0
          fi
          docker image rm "$OLIVARES_IMAGE"
          if ! remaining="$(docker image ls --filter "reference=$OLIVARES_IMAGE" --format '{{.Repository}}:{{.Tag}}')"; then
            echo "::error::could not re-inspect local image $OLIVARES_IMAGE after removal" >&2
            exit 1
          fi
          if grep -qxF -- "$OLIVARES_IMAGE" <<<"$remaining"; then
            echo "::error::image tag $OLIVARES_IMAGE is still present after removal" >&2
            exit 1
          fi
