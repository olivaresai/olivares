#
# Manual-dispatch only: packaging + verification; publishing stays manual per
# docs/PSIRT-RUNBOOK.md §3.
name: security-feed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Packaging mode
        required: true
        type: choice
        default: selftest
        options:
          - selftest
          - package
      draft_path:
        description: Repository-relative advisory draft path used in package mode
        required: true
        type: string
        default: cmd/olivares/fixtures/security-drill/draft-advisories.json

permissions:
  contents: read

jobs:
  package-and-verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.work.sum
      - name: Selftest with ephemeral TEST keys
        if: ${{ inputs.mode == 'selftest' }}
        run: sh scripts/package-security-feed.sh --selftest
      - name: Package and verify the signed feed
        if: ${{ inputs.mode == 'package' }}
        env:
          DRAFT_PATH: ${{ inputs.draft_path }}
          SECURITY_FEED_SIGN_KEY: ${{ secrets.SECURITY_FEED_SIGN_KEY }}
          SECURITY_FEED_PUBKEY: ${{ vars.SECURITY_FEED_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${SECURITY_FEED_SIGN_KEY:-}" ]; then
            echo "error: SECURITY_FEED_SIGN_KEY secret is empty" >&2
            exit 1
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 0600 "$key_file"
          printf '%s' "$SECURITY_FEED_SIGN_KEY" > "$key_file"
          sh scripts/package-security-feed.sh \
            --draft "$DRAFT_PATH" \
            --sign-key "$key_file" \
            --pubkey "$SECURITY_FEED_PUBKEY" \
            --out-dir dist/security-feed
      - name: Upload packaged security feed
        if: ${{ inputs.mode == 'package' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-feed
          path: dist/security-feed
          if-no-files-found: error
