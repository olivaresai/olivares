name: mainline-ci-report

on:
  workflow_run:
    workflows: [mainline-ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: mainline-ci-report
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'olivaresai/olivares' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # workflow_run checks out default-branch code, never the triggering run's code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-mainline-ci-report.py
      - run: python3 scripts/mainline-ci-report.py
        env:
          GH_TOKEN: ${{ github.token }}
