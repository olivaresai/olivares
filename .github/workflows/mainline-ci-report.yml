name: mainline-ci-report

on:
  workflow_run:
    workflows: [mainline-ci, merge-gate-check]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

# One group per triggering event: a push report never displaces a scheduled battery report.
concurrency:
  group: mainline-ci-report-${{ github.event.workflow_run.event }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Tracking issues for mainline-ci only where the repository opts in with CI_NIGHTLIES=true.
    # The scheduled merge-gate-check run is reported wherever that workflow exists.
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((vars.CI_NIGHTLIES == 'true' && github.event.workflow_run.event == 'push') ||
       (startsWith(github.event.workflow_run.name, 'merge-gate-check') && github.event.workflow_run.event == 'schedule'))
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # workflow_run checks out default-branch code, never the triggering run's code or artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/test-mainline-ci-report.py
      - run: python3 scripts/mainline-ci-report.py
        env:
          GH_TOKEN: ${{ github.token }}
