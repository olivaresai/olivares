#
# docs-site-artifact — builds docs-site and publishes its `dist/` as a run artifact.
#
# Retain a qualified, inspectable docs build for the deployment owner. The artifact
# carries the checkout SHA in its name; consumers bind its run and hash before use.
# This workflow has no deployment credential and performs no live publication.
# The full docs test command includes the build. Both this workflow and the deploy
# guard pages and the exact serving policy files before accepting dist/.
# Dispatch only: select the intended source ref explicitly.
name: docs-site-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # `npm ci`, never `npm install`: the lockfile is the input. The same call mainline-ci makes.
      - name: install docs-site deps (locked)
        run: npm --prefix docs-site ci

      - name: build docs-site AND run its full gate suite
        run: npm --prefix docs-site test

      # Keep this content guard identical to the deployment guard.
      - name: refuse an incomplete build or changed serving policy
        run: |
          set -u
          if [ ! -d docs-site/dist ]; then
            echo "::error::docs-site/dist does not exist after a build that exited 0. Nothing to publish."
            exit 1
          fi
          n="$(find docs-site/dist -type f | wc -l)"
          if [ "$n" -lt 100 ]; then
            echo "::error::docs-site/dist has only ${n} file(s). The site is ~1000 pages; that is a"
            echo "::error::broken build reported as a pass, and publishing it would delete the site."
            exit 1
          fi
          # ⛔ A FILE COUNT IS NOT A SITE. A hundred hashed assets with no page among them would
          # have passed the check above and published an empty site over a working one. Name the
          # pages whose absence means the build is broken, and DERIVE the section list from the
          # content tree rather than typing it, so a new section is demanded automatically.
          missing=""
          for must in index.html 404.html; do
            [ -f "docs-site/dist/$must" ] || missing="$missing $must"
          done
          while IFS= read -r seccion; do
            [ -n "$seccion" ] || continue
            [ -f "docs-site/dist/$seccion/index.html" ] || missing="$missing $seccion/index.html"
          done <<SECCIONES
          $(cd docs-site/src/content/docs && for d in */; do
              d="${d%/}"
              if [ -f "$d/index.md" ] || [ -f "$d/index.mdx" ]; then echo "$d"; fi
            done)
          SECCIONES
          if [ -n "$missing" ]; then
            echo "::error::docs-site/dist has ${n} files but is MISSING pages the tree declares:${missing}"
            echo "::error::That is a broken build with enough assets to look like a whole site."
            exit 1
          fi
          # Astro copies both serving policies from public/ without transformation.
          for must in _headers _redirects; do
            if [ ! -f "docs-site/dist/$must" ] || [ -L "docs-site/dist/$must" ] ||
               ! cmp -s "docs-site/public/$must" "docs-site/dist/$must"; then
              echo "::error::docs-site/dist/$must must be a regular copy of docs-site/public/$must."
              exit 1
            fi
          done
          echo "docs-site/dist: ${n} files, _headers and _redirects verified"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-dist-${{ github.sha }}
          path: docs-site/dist
          if-no-files-found: error
          retention-days: 1
