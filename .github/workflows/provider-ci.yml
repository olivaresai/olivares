#
# Provider CI. terraform-provider-olivares is a SEPARATE Go
# module (a pure REST client, no /core or /sdk import), so it gets its own build +
# test + docs gate, distinct from the control-plane CI. This runs on every push/PR
# that touches the provider — it does NOT publish anything (that is the tag-gated,
# the manually-triggered release-provider.yml).
#
# It also gates the AUTOGENERATED Registry docs: the committed docs/ must match a
# fresh tfplugindocs render of the schema + examples/. tfplugindocs needs a
# Terraform-compatible CLI to export the schema; we install a PINNED OpenTofu (the
# OSS default per) by SHA-256 — no unpinned third-party action.
name: provider-ci

on:
  push:
    branches: ["**"]
    paths:
      - "terraform-provider-olivares/**"
      - ".github/workflows/provider-ci.yml"
  pull_request:
    paths:
      - "terraform-provider-olivares/**"
      - ".github/workflows/provider-ci.yml"

permissions:
  contents: read

env:
  PROVIDER_DIR: terraform-provider-olivares
  # Pinned OpenTofu used only to export the provider schema for tfplugindocs.
  TOFU_VERSION: "1.12.1"
  TOFU_SHA256: "1fc9af962e3632b7cd0ba27076cd9f1ced177567defe9e331ac37f5a40468575"

jobs:
  build-test-docs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go caches under RUNNER_TEMP (this runner may have no $HOME)
        # ⛔ VA ANTES DE `setup-go`, Y ESE ORDEN ES EL ARREGLO — el mismo paso que
        # `mainline-ci.yml` ya lleva tres veces, y que este workflow nunca recibio.
        #
        # Medido hoy (2026-08-24, job 97367227554, runner `actions-runner-6`): setup-go
        # instala Go bien y muere en el `go env` que corre a continuacion, con
        #   build cache is required, but could not be located:
        #   GOCACHE is not defined and neither $XDG_CACHE_HOME nor $HOME are defined
        # Un arreglo colocado DESPUES de setup-go no arregla nada: el paso que falla es
        # el 3 de 12 y todo lo demas queda saltado.
        #
        # ⛔ Y SOLO CUANDO HACE FALTA. `$RUNNER_TEMP` se borra entre corridas, asi que
        # reubicar SIEMPRE convierte la cache de modulos persistente del runner en una fria:
        # medido en este mismo workflow, 64 `go: downloading` por corrida. En `e2e-operator-kind`
        # esa misma reubicacion incondicional volvio ROJO un paso que estaba verde, porque su
        # espera de 120 s no da para bajar 184 modulos y compilar. Reubicar es la cura de un
        # `$HOME` ausente; no es algo que hacer cuando `$HOME` esta.
        run: |
          # ⛔ `$HOME` ESCRIBIBLE NO GARANTIZA QUE GO SEA UTILIZABLE, y esta guarda la afino un
          # contraste externo. Tres caminos en los que `$HOME` pasa y Go no:
          #   · un `GOPATH` RELATIVO heredado del entorno: Go lo rechaza ANTES de ejecutar el
          #     subcomando, asi que el `go env` de `setup-go` muere igual. La version que
          #     reubicaba siempre lo sobrescribia sin querer, y por eso no se veia.
          #   · `$HOME/go` no escribible aunque `$HOME` si lo sea.
          #   · `$HOME/.cache` no escribible, que es de donde sale GOCACHE por omision.
          # No puedo preguntarle a `go`: este paso corre ANTES de `setup-go` y puede que Go no
          # exista todavia. Asi que se comprueban las TRES condiciones sin el.
          reubicar=""
          [ -n "${HOME:-}" ] && [ -w "${HOME:-/nonexistent}" ] || reubicar="sin \$HOME utilizable"
          case "${GOPATH:-}" in
            "" ) : ;;
            /* ) : ;;
            *  ) reubicar="GOPATH relativo heredado (${GOPATH}): go lo rechaza antes del subcomando" ;;
          esac
          if [ -z "$reubicar" ]; then
            for d in "$HOME/go" "$HOME/.cache"; do
              [ -e "$d" ] || continue
              [ -w "$d" ] || reubicar="$d existe y no es escribible"
            done
          fi
          if [ -z "$reubicar" ]; then
            echo "HOME usable ($HOME), GOPATH sano: dejo GOCACHE/GOMODCACHE por omision — la cache del runner PERSISTE"
            exit 0
          fi
          echo "reubico las cachés de Go bajo RUNNER_TEMP: $reubicar"
          {
            echo "GOCACHE=$RUNNER_TEMP/gocache"
            echo "GOMODCACHE=$RUNNER_TEMP/gomodcache"
            echo "GOPATH=$RUNNER_TEMP/gopath"
          # Y su `bin` AL PATH, o mover GOPATH rompe lo que se instale con `go install`
          # (este workflow instala tfplugindocs). Es la regresion que el arreglo del
          # $HOME introdujo en mainline-ci y que alli ya esta cerrada.
            echo "GOBIN=$RUNNER_TEMP/gopath/bin"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gopath/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          # ⛔ `go.work` Y NO EL `go.mod` DEL MODULO, aunque lo segundo parezca lo correcto.
          #
          # El provider ESTA en el workspace (`go.work:33` lo lista en `use`), asi que un
          # build dentro del repo lee `../go.work` — y ese exige `go >= 1.26.6` mientras el
          # `go.mod` del provider declara `1.26.5`. Con el `GOTOOLCHAIN=local` que pone
          # setup-go, Go no se descarga la version que falta: se planta. Medido hoy sobre
          # esta misma rama (job de `provider-ci`, paso 5 `build`):
          #   go: ../go.work requires go >= 1.26.6 (running go 1.26.5; GOTOOLCHAIN=local)
          #
          # Estaba TAPADO: hasta ahora el job moria en el paso 3 (`setup-go` sin $HOME), asi
          # que nunca se llegaba a compilar. Un paso que falla temprano no protege lo de
          # abajo, lo esconde — y esto llevaba 20 corridas sin un solo exito.
          #
          # Y es el UNICO workflow del repo que no apunta a `go.work`: mainline-ci (x3),
          # bench-nightly, drills-nightly y race-full lo hacen todos. El `go.mod` del
          # provider sigue declarando 1.26.5 como su minimo para quien lo consuma; lo que
          # cambia es con que cadena de herramientas lo compila ESTE repo, que es la suya.
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ env.PROVIDER_DIR }}/go.sum

      - name: build
        working-directory: ${{ env.PROVIDER_DIR }}
        run: go build ./...

      - name: test (race)
        working-directory: ${{ env.PROVIDER_DIR }}
        run: go test -race -count=1 ./...

      - name: gofmt check
        working-directory: ${{ env.PROVIDER_DIR }}
        run: |
          unformatted="$(gofmt -l internal/ main.go)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt needed on:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      # Install a PINNED OpenTofu (verified by SHA-256) so tfplugindocs can export
      # the schema from the locally-built binary — never the public Registry.
      - name: install OpenTofu (pinned, checksum-verified)
        run: |
          # Installed WITHOUT sudo, into a runner-writable directory. `sudo unzip ... -d
          # /usr/local/bin` worked on ubuntu-latest and dies on this project's self-hosted
          # runners, whose user has no passwordless sudo: the step failed with "sudo: a
          # terminal is required to read the password" and provider-ci had been red on every
          # branch since. Same class as the preinstalled-tools trap — a job written for a
          # GitHub-hosted image assuming a privilege the bare runner does not grant.
          url="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSL -o "${RUNNER_TEMP}/tofu.zip" "${url}"
          echo "${TOFU_SHA256}  ${RUNNER_TEMP}/tofu.zip" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          unzip -o -q "${RUNNER_TEMP}/tofu.zip" tofu -d "${RUNNER_TEMP}/bin"
          chmod +x "${RUNNER_TEMP}/bin/tofu"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/tofu" version

      - name: provider docs are up to date (tfplugindocs)
        working-directory: ${{ env.PROVIDER_DIR }}
        run: bash scripts/gen-docs.sh --check
