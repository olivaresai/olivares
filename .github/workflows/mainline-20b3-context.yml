            tee "$OUT/postgres-settings.txt"
          psql "$OLIVARES_TEST_POSTGRES_SUPERUSER_DSN" -X -v ON_ERROR_STOP=1 -AtF ' ' \
            -c "SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname IN ('olivares_app', 'olivares_admin') ORDER BY rolname" |
            tee "$OUT/roles.txt"
          case "$(cat "$OUT/postgres-version.txt")" in 16*) : ;; *) fail "the primary server is not PostgreSQL 16" ;; esac
          [ "$(awk '$1 == "olivares_app" {print $2, $3, $4, $5}' "$OUT/roles.txt")" = "f f f f" ] || fail "the application role is privileged"
          [ "$(awk '$1 == "olivares_admin" {print $2, $3, $4, $5}' "$OUT/roles.txt")" = "f t f f" ] || fail "the admin role is not BYPASSRLS-only"
      - name: record the toolchain
        id: toolchain
        timeout-minutes: 2
