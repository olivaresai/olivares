      - name: provision postgres roles (least-privilege app role + BYPASSRLS admin)
        env:
          PGPASSWORD: postgres
        run: |
          # Conditional like mainline-ci: on a self-hosted runner with
          # postgresql-client preinstalled this step needs NO sudo at all — the
          # runner user deliberately has none (2026-07-30).
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 \
            -v app_password=apppw -f deploy/postgres/01-app-role.sql
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "DROP ROLE IF EXISTS olivares_admin; CREATE ROLE olivares_admin LOGIN PASSWORD 'adminpw' NOSUPERUSER BYPASSRLS NOCREATEROLE NOCREATEDB NOREPLICATION;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/postgres" -v ON_ERROR_STOP=1 -c \
            "GRANT CONNECT ON DATABASE olivares TO olivares_admin;"
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SCHEMA public TO olivares_admin; ALTER DEFAULT PRIVILEGES FOR ROLE olivares_app IN SCHEMA public GRANT SELECT ON TABLES TO olivares_admin;"
          # pgvector (B5): the extension is not trusted, so the app role cannot create
          # it — the superuser does, once per database; the backend's own
          # CREATE EXTENSION IF NOT EXISTS then no-ops harmlessly.
          psql "postgres://postgres@${PGHOSTPORT:?PGHOSTPORT unset - the resolver step must run first}/olivares" -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: race this root shard
        # ⛔ EL TECHO Y EL `-timeout` SALEN DE LA SPEC (45 / 35), no se teclean aqui, y la
        # formula es la MISMA que la de los grupos: el reloj de `-timeout` de Go arranca
        # DESPUES de compilar con -race, asi que igualarlo al techo del paso garantiza que
        # gane el techo y que el volcado de goroutines —lo unico que dice DONDE colgo— no
        # llegue a imprimirse. Es como murio race-root a los 152 min, mudo; y como volvio a
        # morir en una corrida alojada del 2026-08-31, pasando de 132 min con el reloj en 130.
        #
        # `-json` para que el paso no muera mudo, `pipefail` porque sin el el rc de la
        # tuberia es el del awk —que siempre sale 0— y un FAIL se publicaria verde.
        timeout-minutes: 45
        run: |
          set -euo pipefail
          bash scripts/race-groups.sh root-run "${{ matrix.shard }}" \
            | tee "$RUNNER_TEMP/race-root-${{ matrix.shard }}.jsonl" \
            | awk -F'"' '
                # ⛔ LAS LINEAS DEL FALLO PASAN, y esto lo escribo por una medida: la primera
                # version imprimia SOLO «ACCION NOMBRE» y se comia la salida del test. El primer
                # fallo real de la race-full publica dejo un log donde se leia
                # `FAIL TestMCPDurableTask…` y NADA MAS: el motivo —`open ../../design/…: no such
                # file`— sólo estaba en el .jsonl, y hubo que descargar el artefacto para saber
                # que no era un flake sino una ruta ausente. Un progreso que oculta el motivo
                # convierte cada rojo en una descarga.
                #
                # Pasan solo las que traen `fichero.go:linea` o el `--- FAIL`, para que el log
                # siga siendo legible: el volcado entero es lo que el artefacto ya guarda.
                /"Action":"output"/ && (/\.go:[0-9]/ || /--- FAIL/) {
                  sub(/^.*"Output":"/, ""); sub(/"}[ \t]*$/, "");
                  gsub(/\\n$/, ""); gsub(/\\t/, "  ");
                  printf "    | %s\n", $0; fflush(); next;
                }
                /"Action":"(pass|fail|skip)"/ && /"Test":/ {
                  for (i = 1; i < NF; i++) {
                    if ($i == "Action") a = $(i + 2);
                    if ($i == "Test")   n = $(i + 2);
                  }
                  printf "%s %s\n", toupper(a), n;
                  fflush();
                }'
      - name: keep the per-test timings even when the step died
        # `if: always()`: el caso en que estas medidas valen MAS es el del timeout, y un
        # upload condicionado al exito las perderia exactamente ahi. El nombre lleva el
        # turno porque dos artefactos no pueden llamarse igual en la misma corrida — y
        # ademas es lo que permite recalibrar el reparto turno a turno.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-root-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/race-root-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 7
