# SPDX-FileCopyrightText: 2026 Olivares.AI
# SPDX-License-Identifier: AGPL-3.0-only
# Release tags build a draft with signed binaries, archives, checksums, SBOMs,
# OpenVEX and SLSA provenance. OTA manifests carry expiry and artifact digests.
# A protected dispatch signs the stable OTA manifest, verifies the complete
# candidate with the shipped binary and publishes it.
# Verify releases with scripts/verify-release.sh. Air-gap consumers use
# scripts/airgap-bundle.sh.
name: release

on:
  push:
    # Preflight validates bare MAJOR.MINOR release tags; malformed
    # numeric tags trigger its explicit refusal.
    tags: ["[0-9]*.[0-9]*"]
  # Phase 2 signs, verifies and publishes the selected draft. Approving
  # the `ota-release-ceremony` environment for this run
  # authorizes PUBLICATION of the release named by `release_tag` at the commit named by
  # `release_commit`.
  # Keep the OTA key in the protected environment. Write it with umask 077
  # under RUNNER_TEMP, pass it by @path and remove it after signing.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "PUBLISH this draft release tag (bare MAJOR.MINOR — no v prefix). Approving the protected environment makes it public."
        required: true
        type: string
      release_commit:
        description: "Full 40-hex commit OID the tag pointed at when phase 1 ran. Sign, verify and PUBLISH that exact candidate."
        required: true
        type: string

# Serialize both phases of each release; different tags may run in parallel.
# Never cancel an active publisher.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/olivaresai/olivares

jobs:
  # Read-only preflight validates every tag-push profile before dependent jobs
  # receive write permissions or an OIDC token. Mutating jobs use its outputs.
  # Run this check in every repository so invalid targets fail instead of skipping.
  # Phase 2 has its own protected approval and candidate verification.
  preflight:
    if: github.event_name == 'push'
    # Repository variables may override the runner for this read-only check.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      release_mode: ${{ steps.profile.outputs.release_mode }}
      release_github_repo: ${{ steps.profile.outputs.release_github_repo }}
      release_github_owner: ${{ steps.profile.outputs.release_github_owner }}
      release_github_name: ${{ steps.profile.outputs.release_github_name }}
      oci_image_repo: ${{ steps.profile.outputs.oci_image_repo }}
      mirror_image_repo: ${{ steps.profile.outputs.mirror_image_repo }}
      homebrew_tap_owner: ${{ steps.profile.outputs.homebrew_tap_owner }}
      homebrew_tap_name: ${{ steps.profile.outputs.homebrew_tap_name }}
      source_repository_url: ${{ steps.profile.outputs.source_repository_url }}
      release_tag: ${{ steps.profile.outputs.release_tag }}
      release_version: ${{ steps.profile.outputs.release_version }}
      cosign_mode: ${{ steps.profile.outputs.cosign_mode }}
      cosign_tlog_upload: ${{ steps.profile.outputs.cosign_tlog_upload }}
      publish_latest: ${{ steps.profile.outputs.publish_latest }}
      publish_dockerhub: ${{ steps.profile.outputs.publish_dockerhub }}
      publish_homebrew: ${{ steps.profile.outputs.publish_homebrew }}
      publish_ota_stable: ${{ steps.profile.outputs.publish_ota_stable }}
      run_slsa: ${{ steps.profile.outputs.run_slsa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: preflight — validate the release profile (fail-closed)
        id: profile
        # Preflight validates the release profile and destinations from repository
        # variables.
        env:
          RELEASE_MODE: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && 'preprod' || 'production' }}
          RELEASE_GITHUB_REPO: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && vars.OLIVARES_PREPROD_EXPECTED_REPO || 'olivaresai/olivares' }}
          OCI_IMAGE_REPO: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && vars.OLIVARES_PREPROD_EXPECTED_OCI || env.IMAGE_REPO }}
          SOURCE_REPOSITORY_URL: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && vars.OLIVARES_PREPROD_EXPECTED_SOURCE || 'https://github.com/olivaresai/olivares' }}
          # Preprod uses a mirror below the validated OCI namespace and a dedicated
          # Homebrew repository under the running owner.
          MIRROR_IMAGE_REPO: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && format('{0}/mirror', vars.OLIVARES_PREPROD_EXPECTED_OCI) || 'docker.io/olivaresai/olivares' }}
          HOMEBREW_TAP_REPO: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && format('{0}/homebrew-preprod', github.repository_owner) || 'olivaresai/homebrew-tap' }}
          # Compare expected and declared repository, OCI and source coordinates
          # separately.
          # An empty expected value must fail preflight even when the declared
          # expression
          # falls back to a production coordinate.
          OLIVARES_PREPROD_EXPECTED_REPO: ${{ vars.OLIVARES_PREPROD_EXPECTED_REPO }}
          OLIVARES_PREPROD_EXPECTED_OCI: ${{ vars.OLIVARES_PREPROD_EXPECTED_OCI }}
          OLIVARES_PREPROD_EXPECTED_SOURCE: ${{ vars.OLIVARES_PREPROD_EXPECTED_SOURCE }}
          RELEASE_TAG: ${{ github.ref_name }}
          # Preprod and production use the same keyless signing and transparency log.
          # Preflight enforces both settings.
          COSIGN_MODE: keyless
          COSIGN_TLOG_UPLOAD: "true"
          PUBLISH_LATEST: "true"
          # Production retains auto publishing. Preprod exercises both publishers
          # against isolated destinations.
          PUBLISH_DOCKERHUB: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && 'true' || 'auto' }}
          PUBLISH_HOMEBREW: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && 'true' || 'auto' }}
          PUBLISH_OTA_STABLE: "true"
          RUN_SLSA: "true"
          # Preprod must acknowledge public SLSA records naming the running repository.
          ACKNOWLEDGE_PUBLIC_SLSA_LOG: ${{ vars.OLIVARES_RELEASE_PROFILE == 'preprod' && 'true' || '' }}
          OLIVARES_LICENSE_PUBKEY: ${{ vars.OLIVARES_LICENSE_PUBKEY }}
          OLIVARES_OTA_PUBKEY: ${{ vars.OLIVARES_OTA_PUBKEY }}
          # Presence-only inputs enforce the credential pair; never print them.
          # Prefer a username variable so secret masking cannot suppress public
          # coordinates.
          # Keep tokens in secrets; the username secret remains a compatibility
          # fallback.
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          HOMEBREW_PREPROD_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_PREPROD_TAP_GITHUB_TOKEN }}
        run: bash scripts/release-preflight.sh

  release-environment-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: environment admission policy — offline controls
        run: bash scripts/test-release-environment-tag-policy.sh
      - name: verify MAJOR.MINOR tag admission before protected signing
        if: github.repository == 'olivaresai/olivares'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-environment-tag-policy.sh

  goreleaser:
    # The mutating job accepts the production repository or a validated preprod
    # profile. Preflight validates destinations before this repository guard runs.
    needs: [preflight, release-environment-policy]
    # Use the validated release profile and destinations.
    if: github.event_name == 'push' && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod')
    # Build and sign on a GitHub-hosted runner to keep provenance isolated.
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the DRAFT release + upload assets
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign (Fulcio) + attestations
      actions: read # read race-full's run history for the pre-release evidence gate
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      # Use preflight outputs for destinations, signing modes and version.
      # Missing values fail GoReleaser template rendering.
      RELEASE_GITHUB_OWNER: ${{ needs.preflight.outputs.release_github_owner }}
      RELEASE_GITHUB_NAME: ${{ needs.preflight.outputs.release_github_name }}
      OCI_IMAGE_REPO: ${{ needs.preflight.outputs.oci_image_repo }}
      HOMEBREW_TAP_OWNER: ${{ needs.preflight.outputs.homebrew_tap_owner }}
      HOMEBREW_TAP_NAME: ${{ needs.preflight.outputs.homebrew_tap_name }}
      SOURCE_REPOSITORY_URL: ${{ needs.preflight.outputs.source_repository_url }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
      COSIGN_MODE: ${{ needs.preflight.outputs.cosign_mode }}
      COSIGN_TLOG_UPLOAD: ${{ needs.preflight.outputs.cosign_tlog_upload }}
      PUBLISH_HOMEBREW: ${{ needs.preflight.outputs.publish_homebrew }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the release tag and its history
          persist-credentials: false
      - name: phase 1 guard 1 — straight after checkout
        run: |
          set -euo pipefail
          # NOTHING has touched the tree yet; this is the baseline every later window compares against.
          # A guard belongs after EACH `uses:` window and before the next `run`: the previous
          # single guard sat after setup-go, setup-node, pnpm/action-setup, `install go-task`
          # and two preflight steps that already read .node-version, the lockfile and the
          # Taskfile and executed against this checkout (the model, R2 third follow-up).
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            exit 1
          fi
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${head_oid}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: HEAD is ${head_oid}, not the triggering commit (${GITHUB_SHA})." >&2
            exit 1
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 1 guard 1 — straight after checkout)." >&2
            exit 1
          }
          if [ -n "${status_raw}" ]; then
            echo "ERROR: the checkout was modified before this window consumed it." >&2
            printf '%s\n' "${status_raw}" >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          fi
          echo "checkout verified: phase 1 guard 1 — straight after checkout"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
      # Install Node before pnpm, which uses npm to install. Both are needed
      # by GoReleaser's before hook to build the embedded web UI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Check generated OpenAPI types against tagged sources before the build.
      # This does not run proto:check; protobuf consistency needs its own gate.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Standalone pnpm does not need Node at runtime; installing it still needs
          # the Node setup above.
          standalone: true
      - name: phase 1 guard 2 — after the setup actions, before the first script
        run: |
          set -euo pipefail
          # setup-go, setup-node and pnpm/action-setup have run; they read .node-version and the lockfile.
          # A guard belongs after EACH `uses:` window and before the next `run`: the previous
          # single guard sat after setup-go, setup-node, pnpm/action-setup, `install go-task`
          # and two preflight steps that already read .node-version, the lockfile and the
          # Taskfile and executed against this checkout (the model, R2 third follow-up).
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            exit 1
          fi
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${head_oid}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: HEAD is ${head_oid}, not the triggering commit (${GITHUB_SHA})." >&2
            exit 1
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 1 guard 2 — after the setup actions, before the first script)." >&2
            exit 1
          }
          if [ -n "${status_raw}" ]; then
            echo "ERROR: the checkout was modified before this window consumed it." >&2
            printf '%s\n' "${status_raw}" >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          fi
          echo "checkout verified: phase 1 guard 2 — after the setup actions, before the first script"
      - name: install go-task (pinned)
        timeout-minutes: 10
        uses: ./.github/actions/olivares-tool-cache
        with:
          gitleaks: "true"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: prepare built-artifact secret scanning
        run: |
          python3 -c 'from compression import zstd'
          nfpm_bin=$(bash scripts/ensure-nfpm.sh --dest "$RUNNER_TEMP/artifact-nfpm")
          echo "OLIVARES_NFPM_DIR=$RUNNER_TEMP/artifact-nfpm" >> "$GITHUB_ENV"
          dirname "$nfpm_bin" >> "$GITHUB_PATH"
          echo "OLIVARES_REAL_DOCKER=$(command -v docker)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/artifact-scan-bin" >> "$GITHUB_PATH"
      - name: built-artifact scanner canaries (no credentials)
        run: |
          python3 scripts/test-artifact-secrets.py
          python3 scripts/test-native-package-publication.py
      - name: preflight — OpenAPI snapshot + web client codegen freshness
        timeout-minutes: 15
        run: |
          pnpm --dir web install --frozen-lockfile
          task openapi:check
      # 0.1 only (2026-10-10: 0.1 ships when it compiles and the README Compose starts the
      # engine). A failure of this gate or of the race-full gate below is logged and does not stop
      # 0.1; every later tag keeps both gates blocking.
      - name: preflight — the release container first hour passed on this exact commit
        continue-on-error: ${{ github.ref_name == '0.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-first-hour-evidence.sh

      # Require a successful race-full run whose head equals the tagged commit.
      # An ancestor's result cannot qualify this release.
      - name: preflight — a green race-full ran on the EXACT tagged SHA
        continue-on-error: ${{ github.ref_name == '0.1' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          match="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/race-full.yml/runs?status=success&per_page=100" \
                  --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\")] | length")"
          # A count, or a refusal. `[ "" -eq 0 ]` is an error that an `if` reads as FALSE, so a
          # non-numeric answer skipped both branches below and printed the success line.
          if ! [[ "${match}" =~ ^[0-9]+$ ]]; then
            echo "::error::race-full run history answered '${match}', not a count; could not look is not evidence."
            exit 1
          fi
          equal="${match}"
          # The ONE admitted non-equality: a green race-full on a commit whose diff to the tagged
          # SHA touches only .github/workflows/ (the race sweep tests Go code; a workflow-only
          # change cannot alter its result). Named loudly, with the SHA and the file list, so it
          # is evidence and not a silent pass. Anything outside .github/workflows/ keeps the
          # equality rule. (2026-09-17: v26.9.0 re-tagged after this file's runs-on change;
          # ported from olivaresai/olivares 7263d082e8 + 37da5b582a.)
          #
          # Two defects of that first form, both measured on the real commits (2026-09-17, a
          # local clone of 1d84bd1788 with the v26.8.0 green f443e0844d as the only candidate):
          # · `printf | grep -qvE` under pipefail ADMITTED a 2,986-file diff as "workflow-only".
          #   grep -q exits at the first non-workflow name; above the pipe buffer printf then
          #   dies of SIGPIPE, the pipeline answers 141, and `!` reads 141 as "no other file".
          #   git filters the paths here instead: no pipe, no early reader.
          # · `git fetch --depth=1` into this fetch-depth: 0 checkout made it SHALLOW (10 commits
          #   visible before, 5 after). Run 35237680006 shows the effect: goreleaser logged
          #   "running against a shallow clone", found no tag before v26.9.0 although v26.8.0 is
          #   an ancestor, and wrote previous_tag "" into dist/metadata.json. The full checkout
          #   already holds every branch and tag; only a missing object is fetched, never shallow.
          if [ "${match}" -eq 0 ]; then
            for green in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/race-full.yml/runs?status=success&per_page=100" --jq '.workflow_runs[].head_sha'); do
              [[ "${green}" =~ ^[0-9a-f]{40}$ ]] || continue
              if ! git cat-file -e "${green}^{commit}" 2>/dev/null; then
                git fetch -q origin "${green}" 2>/dev/null || continue
              fi
              changed="$(git diff --name-only "${green}" HEAD)"
              [ -n "${changed}" ] || { echo "race-full evidence: green run on ${green}; tree identical to ${GITHUB_SHA}"; match=1; break; }
              # ROOT-ANCHORED (':/' + exclude,top), not `.`: a pathspec relative to the working
              # directory would answer "nothing outside the workflows" for any diff whose files
              # all sit outside that directory, which is an admission, not a filter.
              outside="$(git diff --name-only "${green}" HEAD -- ':/' ':(exclude,top).github/workflows/')"
              if [ -z "${outside}" ]; then
                echo "race-full evidence: green run on ${green}; diff to ${GITHUB_SHA} is workflow-only:"; printf '%s\n' "${changed}" | sed 's/^/  /'
                match=1; break
              fi
            done
          fi
          if [ "${match}" -eq 0 ]; then
            newest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/race-full.yml/runs?status=success&per_page=1" \
                    --jq '.workflow_runs[0].head_sha // "none"')"
            echo "::error::no successful race-full run exists on the tagged SHA ${GITHUB_SHA} (newest green: ${newest}). An ancestor green does not cover the diff after it — dispatch race-full on this exact commit, wait for green, and re-tag."
            exit 1
          fi
          # GoReleaser reads the previous tag from this history (checkout
          # fetch-depth: 0). A shallow clone does not fail the build; it publishes wrong metadata.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::the release checkout is shallow; GoReleaser would compute the previous tag from a truncated history."
            exit 1
          fi
          if [ "${equal}" -gt 0 ]; then
            echo "race-full evidence exists for the exact tagged SHA ${GITHUB_SHA}"
          fi
      # syft on PATH for goreleaser's `sboms`; cosign for `signs`/`docker_signs`.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v2.6.4 for the signature/certificate outputs and flags checked by
          # scripts/check-cosign-contract.sh. A v3 bundle migration must update signers
          # and verifiers together.
          cosign-release: 'v2.6.4'
      # Check the workspace after setup actions and before any tracked script runs.
      - name: assert the checkout is untouched before phase 1 runs any script
        run: |
          set -euo pipefail
          # ⛔ ONE GUARD PER WINDOW. "After the last uses:" is only true of a window, and this
          # job has two: setup actions, then two TRACKED scripts, then the docker actions, then
          # the build. The guard further down covers the second window; without this one the
          # first window ran scripts/assert-cosign-binary.sh and scripts/check-cosign-contract.sh
          # straight after setup-node, pnpm, syft and cosign-installer — any of which can
          # rewrite them — with no dirt detection in between (the model, R2 follow-up).
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            exit 1
          fi
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${head_oid}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: HEAD is ${head_oid}, not the triggering commit (${GITHUB_SHA})." >&2
            exit 1
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 1 pre-script guard)." >&2
            exit 1
          }
          if [ -n "${status_raw}" ]; then
            echo "ERROR: the checkout was modified before this phase ran any of its scripts." >&2
            printf '%s\n' "${status_raw}" >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          fi
          echo "checkout verified before phase 1 runs any tracked script"
      - name: assert the cosign binary is the reviewed artifact
        run: bash scripts/assert-cosign-binary.sh --isolate
      # Exercise cosign flags and output files before building or publishing.
      # The temporary-key test disables the transparency log and blocks Rekor/Fulcio;
      # verify-blob may still fetch TUF roots. Invoke the tracked script with Bash.
      - name: cosign signing-contract check (no publication)
        run: bash scripts/check-cosign-contract.sh
      # Multi-arch image build + push to ghcr.io.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: assert the checkout is untouched before anything consumes it (phase 1)
        run: |
          set -euo pipefail
          # ⛔ EARLY, BECAUSE A LATE REFUSAL DOES NOT UNBIND WHAT ALREADY HAPPENED. The guard
          # further down runs immediately before the release rule is read, which is right and
          # is not enough: by then this job has already built, signed, generated and uploaded.
          # Refusing there leaves those effects standing and merely declines to add one more.
          # This step runs after the LAST setup `uses:` and before the first thing that
          # consumes the tree, so a tampered checkout stops the phase before it produces
          # anything at all (the model, report 56aeafd4c, R2).
          #
          # STRICTEST FORM: at this point the job has generated nothing, so NOTHING untracked,
          # modified or staged is acceptable. The permitted-artifact list belongs to the later
          # guard, where those artifacts legitimately exist.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            echo "An earlier action put another git ahead of it. Nothing has been consumed yet." >&2
            exit 1
          fi
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${head_oid}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: HEAD is ${head_oid}, not the commit this run was triggered for (${GITHUB_SHA})." >&2
            exit 1
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 1 early guard)." >&2
            exit 1
          }
          if [ -n "${status_raw}" ]; then
            echo "ERROR: the checkout was modified before this phase consumed it." >&2
            printf '%s\n' "${status_raw}" >&2
            echo "Nothing has been built, generated or uploaded. Stopping here." >&2
            exit 1
          fi
          echo "checkout verified before phase 1 consumes it"
      # Create release-commit.txt inside GoReleaser's before hook, after dirty-tree
      # validation. Keep it visible to Git and bind its bytes to GITHUB_SHA.
      # Free unused runner tools before building; preserve the installed Go and Node
      # versions and refuse insufficient disk space before compiling.
      - name: make room on the runner (and say how much)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          before=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          echo "::group::before"; df -h /; echo "::endgroup::"
          # The list is the enterprise overlay's, which measured 36 886 MB freed on
          # the same hosted image, minus nothing this job uses: release.yml here
          # names no `pwsh`, `gcloud`, `java`, `mono`, `swift`, `julia` or `graalvm`
          # (all measured at 0), and every `uses:` is Go/Node/docker/cosign/syft/
          # goreleaser/slsa. The floor below is the same 20 GiB, so a shorter list
          # does not fail safe — it fails the floor, in public, on a `v*` tag.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/lib/jvm /usr/lib/mono /usr/lib/google-cloud-sdk \
                      /usr/local/graalvm /usr/local/julia /usr/share/swift \
                      /usr/local/share/powershell || true
          after=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          echo "::group::after"; df -h /; echo "::endgroup::"
          echo "==> freed $(( after - before )) MB; ${after} MB left"
          # Fail-closed floor, and it is NOT derived from the output size — deriving it that
          # way is what made the first version of this comment a mine: a correct number with
          # a false derivation invites the next reader to "fix" it downwards. 8 binaries here
          # (~1 GB of output) and 72 in the overlay (~8 GB), and yet a hosted runner ran out
          # at 94 % of that build. The consumer is Go's cache plus the per-target plugin
          # builds, not the output, which is why 20 GiB and not "twice the output".
          # ⛔ UN `df` QUE TIENE EXITO Y NO TRAE DIGITOS PASABA EL SUELO. Medido el 2026-08-31
          # (REL-56) con un `df` señuelo que imprime `Avail\n-\n`: `tr -dc '0-9'` deja `after`
          # VACIO, el pipeline sale 0 —asi que ni `pipefail` ni `set -e` lo ven—, y
          # `[ "" -lt 20480 ]` escribe «integer expression expected» en stderr y devuelve 2. Un
          # estado != 0 en la CONDICION de un `if` no dispara `set -e`: se toma la rama `else`,
          # y el suelo queda satisfecho por una medida que no existe. En un runner alojado eso
          # es justo el fallo que este bloque existe para impedir, disfrazado de verde.
          #
          # Un `df` que FALLA si estaba cubierto (pipefail + set -e; medido: rc 1), y el control
          # positivo con un numero por debajo del suelo tambien rehusa. El unico hueco era el
          # exito sin digitos, y por eso la guarda pregunta por la FORMA del valor, no por el rc.
          if ! printf '%s' "$after" | grep -qE '^[0-9]+$'; then
            echo "::error title=could not read free disk::\`df\` succeeded but produced no usable number, so the 20480 MB floor could not be evaluated. Refusing: not knowing how much disk there is is not the same as having enough." >&2
            exit 1
          fi
          if [ "$after" -lt 20480 ]; then
            echo "::error title=not enough disk to build::${after} MB left, floor is 20480 MB. Refusing before compiling rather than dying at minute 21 disguised as a compiler error." >&2
            exit 1
          fi

      - name: render release notes from CHANGELOG
        run: |
          python3 scripts/render-release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: goreleaser release (build + SBOM + cosign-sign, into a DRAFT)
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin the exact GoReleaser version for reproducible release behavior.
          version: "v2.17.0"
          # Set GoReleaser's own pipeline deadline with --timeout; the job limit is
          # separate.
          args: release --release-notes "${{ runner.temp }}/release-notes.md" --clean --timeout 3h
        env:
          # Templates use the validated job environment; missing values must fail
          # rendering before publication.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build with distinct licence and OTA public keys. Reject empty, malformed
          # or equal anchors before compilation.
          OLIVARES_LICENSE_PUBKEY: ${{ vars.OLIVARES_LICENSE_PUBKEY }}
          OLIVARES_OTA_PUBKEY: ${{ vars.OLIVARES_OTA_PUBKEY }}
          # Select the publishing token only after preflight. Preprod requires its
          # scoped token; production retains optional-token auto semantics.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ needs.preflight.outputs.release_mode == 'preprod' && secrets.HOMEBREW_PREPROD_TAP_GITHUB_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: exact-version native packages and complete signed draft checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-native-release-packages.sh

      - name: verify the preprod Homebrew publication by bytes, not API status
        if: needs.preflight.outputs.release_mode == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_PREPROD_TAP_GITHUB_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ format('{0}/{1}', needs.preflight.outputs.homebrew_tap_owner, needs.preflight.outputs.homebrew_tap_name) }}
        run: |
          set -euo pipefail
          local_cask="dist/homebrew/Casks/olivares.rb"
          remote_cask="${RUNNER_TEMP}/olivares.remote.rb"
          [ -s "${local_cask}" ] || {
            echo "::error::GoReleaser did not produce ${local_cask}; nothing can be verified." >&2
            exit 1
          }
          gh api "repos/${HOMEBREW_TAP_REPO}/contents/Casks/olivares.rb" --jq .content \
            | base64 -d >"${remote_cask}"
          cmp "${local_cask}" "${remote_cask}" || {
            echo "::error::the cask in ${HOMEBREW_TAP_REPO} is not the cask this run produced." >&2
            exit 1
          }
          echo "preprod Homebrew cask bytes: $(sha256sum "${remote_cask}" | cut -d' ' -f1)"

      # Phase 1 creates the stable manifest when the validated profile enables it.
      # The pipeline signature binds its bytes; phase 2 adds the OTA signature.

      # Report remaining disk space even when the build fails.
      - name: the disk AFTER building (always, pass or fail)
        if: always()
        run: |
          df -h /
          echo "==> free: $(df -BM --output=avail / | tail -1 | tr -dc '0-9') MB"
          du -sh dist 2>/dev/null || true
      - name: assert GoReleaser left the checkout intact before anything is uploaded
        run: |
          set -euo pipefail
          # ⛔ THE BUILD IS ALSO AN ACTION. GoReleaser runs as a pinned `uses:` and executes
          # this repository's own build, hooks and SBOM tooling in this workspace. The guard
          # above ran BEFORE it; the next steps run `go run ./cmd/olivares release manifest`
          # and upload the result. Between those two points nothing looked at the tree, so a
          # build that rewrote a tracked file — or an action that did — reached the producers
          # and the uploads unchallenged (the model, R2 second follow-up).
          #
          # ALLOW-LIST, exact: the only untracked path this job has legitimately created by now
          # is the evidence file, written by GoReleaser's own first `before` hook
          # (scripts/release-commit-evidence.sh) AFTER its dirty validation — which is why the
          # build could start at all. `dist/` is the one directory the repository already
          # ignores, so GoReleaser's own output never appears here; anything else does.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            exit 1
          fi
          # ⛔ AND RE-BIND THE HEAD. Every other guard in this job checks that the checkout is
          # still the triggering commit; this one only asked whether the tree was CLEAN, and a
          # clean tree at a different commit is exactly what a pivot leaves behind. Measured on
          # the extracted block: GITHUB_SHA=A, HEAD=B, tree clean, release-commit.txt=A —
          # rc=0, "producers and uploads may run" (the model, exact audit of 533563e48).
          #
          # The evidence check below compares those bytes against GITHUB_SHA, so on its own it
          # is satisfied by a pivot that never touched the file. Identity has to be asserted
          # about the CHECKOUT, not only about what the checkout claims.
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${head_oid}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: HEAD is ${head_oid}, not the commit this run builds (${GITHUB_SHA})." >&2
            echo "The build already ran: its artefacts and the draft exist. This step performs" >&2
            echo "no rollback. What it stops is every producer and upload that follows." >&2
            exit 1
          fi
          # THE TAG CONTRACT IS DENY-CLOSED, and until 2026-08-18 it was not.
          #
          # This read used to be `rev-parse ... 2>/dev/null || tag_oid=""`, and an empty
          # tag_oid skipped the comparison entirely. That collapses TWO different answers
          # into one: "the tag is not there", which is legitimate before it is cut, and
          # "I could not read it", which is a refusal. NOT KNOWING WAS WRITTEN THE SAME
          # WAY AS AGREEING — a corrupt object, an unreadable ref, a git that fails for
          # any reason at all, and this guard waved the build through to every producer
          # and upload below.
          #
          # Now the two are separated. `tag --list` answers the existence question and
          # its own failure is a refusal; only when the tag EXISTS is it resolved, and a
          # resolution that fails on a tag we just saw is a refusal too, never an empty
          # string. The legitimate case — no tag yet — still proceeds, so the permit
          # direction is unchanged.
          # HOW THE THREE ANSWERS ARE TOLD APART, and this had to be MEASURED because git
          # does not make it obvious. For refs/tags/<T>, with the ref BROKEN vs ABSENT:
          #
          #   state    rev-parse --verify --quiet   rev-parse --verify   tag --list stderr
          #   sound    0                            0                    (empty)
          #   BROKEN   1                            128                  warning: ignoring broken ref
          #   ABSENT   1                            128                  (empty)
          #
          # The exit codes are IDENTICAL for broken and absent. The only signal that
          # separates "there is no tag" from "there is a tag and I cannot read it" is a
          # warning on STDERR — so that warning is what this guard reads, and any output
          # there is a refusal. A first attempt at this used `tag --list` stdout alone and
          # was wrong in the dangerous direction: git prints NOTHING to stdout for a broken
          # ref, so a corrupt tag read as "absent" and sailed through. Its own battery case
          # caught that, which is the only reason this comment is right.
          #
          # 2>&1 >/dev/null, and the order is the whole point: stderr is duplicated onto the
          # capture FIRST and only then stdout is sent to /dev/null. The other order sends
          # both to /dev/null and captures an empty string forever.
          tag_err="$("${GIT_BIN}" tag --list "${RELEASE_TAG}" 2>&1 >/dev/null)" || {
            echo "ERROR: could not enumerate tags to check ${RELEASE_TAG}." >&2
            echo "This is NOT the same as the tag being absent: the check could not be" >&2
            echo "performed, so nothing below it may run." >&2
            exit 1
          }
          if [ -n "${tag_err}" ]; then
            echo "ERROR: reading refs/tags/${RELEASE_TAG} produced a diagnostic:" >&2
            printf '%s\n' "${tag_err}" >&2
            echo "A tag that cannot be read is a refusal, not an absence. Deny-closed on any" >&2
            echo "output here is deliberate: a warning we do not recognise is still a warning." >&2
            exit 1
          fi
          tag_listed="$("${GIT_BIN}" tag --list "${RELEASE_TAG}")"
          if [ -n "${tag_listed}" ]; then
            tag_oid="$("${GIT_BIN}" rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" || {
              echo "ERROR: ${RELEASE_TAG} is listed but could not be resolved to a commit." >&2
              echo "A tag that exists and cannot be read is a refusal, not an absence." >&2
              exit 1
            }
            if [ "${tag_oid}" != "${GITHUB_SHA}" ]; then
              echo "ERROR: ${RELEASE_TAG} resolves to ${tag_oid}, not ${GITHUB_SHA}." >&2
              echo "The tag moved while this job was building. Stopping before any producer runs." >&2
              exit 1
            fi
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 1 post-build guard)." >&2
            exit 1
          }
          dirty=""
          while IFS= read -r st || [ -n "${st}" ]; do
            [ -n "${st}" ] || continue
            case "${st}" in
            '?? release-commit.txt') continue ;;
            # go.work.sum: the Go toolchain APPENDS workspace checksums during the build when the
            # published tree's module set differs from the source tree's (measured 2026-09-17, run
            # 35234189801: the only modification after goreleaser was ` M go.work.sum`). Toolchain
            # bookkeeping, not a product file rewritten in silence: its diff is printed here as
            # evidence; the phase-2 binding reads the run's recorded tree, not this file.
            ' M go.work.sum') echo "note: the Go toolchain rewrote go.work.sum during the build:" >&2; "${GIT_BIN}" --no-pager diff --stat -- go.work.sum >&2; continue ;;
            # The second evidence file the same `before` hook writes. Allow-listed BY NAME
            # here and pinned BY BYTES below, exactly like the first: a name in this list
            # that nothing pins is a path the build may rewrite in silence.
            '?? release-build-context.json') continue ;;
            esac
            dirty="${dirty}${st}"$'\n'
          done <<<"${status_raw}"
          if [ -n "${dirty}" ]; then
            echo "ERROR: the build left the checkout modified." >&2
            printf '%s\n' "${dirty}" >&2
            # HONEST ABOUT WHERE WE ARE. GoReleaser has already run by this point: it built,
            # signed and created the draft. Saying "nothing has been generated or uploaded"
            # here would be false, and claiming a rollback this step does not perform would be
            # worse. What is still true is that no manifest has been produced from this tree
            # and nothing further will be attached.
            echo "The build already ran: its artefacts and the draft exist. This step performs" >&2
            echo "no rollback. What it stops is every producer and upload that follows." >&2
            exit 1
          fi
          # THE NAME IS NOT THE BYTES. `?? release-commit.txt` stays `?? release-commit.txt`
          # whatever it contains, so allow-listing the path lets the build rewrite the very
          # evidence phase 2 binds to while the status output never changes. Its content is
          # pinned here: exactly the triggering commit and a single LF.
          if [ ! -f release-commit.txt ]; then
            echo "ERROR: release-commit.txt is missing after the build." >&2
            exit 1
          fi
          # BYTE-EXACT, by digest. Reading the first line and counting lines is not the same
          # claim: `GITHUB_SHA` + LF + arbitrary bytes with no trailing LF satisfies both
          # `read` and `wc -l == 1`, so the build could append to the very evidence phase 2
          # binds to and this check would still pass.
          want_sum="$(printf '%s\n' "${GITHUB_SHA}" | "${TRUSTED_BIN}/sha256sum")" || want_sum=""
          want_sum="${want_sum%% *}"
          have_sum="$("${TRUSTED_BIN}/sha256sum" release-commit.txt)" || have_sum=""
          have_sum="${have_sum%% *}"
          if [ -z "${want_sum}" ] || [ "${have_sum}" != "${want_sum}" ]; then
            echo "ERROR: release-commit.txt is not exactly this run's commit and a newline." >&2
            echo "  expected sha256 ${want_sum:-<unreadable>}" >&2
            echo "  found    sha256 ${have_sum:-<unreadable>}" >&2
            echo "The build rewrote the evidence phase 2 binds to. Stopping before any producer" >&2
            echo "or upload runs." >&2
            exit 1
          fi
          # ⛔ AND THE BUILD CONTEXT, THE SAME WAY AND FOR THE SAME REASON. This file says
          # WHICH RUN produced the artifact set, and the finalizer refuses to publish
          # without it. Its bytes are canonical by construction
          # (scripts/release-commit-evidence.sh writes one line, fixed field order, one LF),
          # so the expected sequence is rebuilt HERE from the Actions context and compared
          # by digest. Allow-listing the name and trusting the content would let the build
          # name another run — the exact defect the commit-evidence pin above exists for,
          # one file over.
          if [ ! -f release-build-context.json ]; then
            echo "ERROR: release-build-context.json is missing after the build." >&2
            echo "Phase 2 binds the published artifact set to it, so a release that cannot" >&2
            echo "say which run produced it must not continue." >&2
            exit 1
          fi
          want_ctx="$(printf '{"schema":"olivares.ai/release-build-context/v1","schema_version":1,"repository_id":"%s","repository":"%s","event":"%s","ref":"%s","commit":"%s","run_id":"%s","run_attempt":"%s"}\n' \
            "${GITHUB_REPOSITORY_ID}" "${GITHUB_REPOSITORY}" "${GITHUB_EVENT_NAME}" \
            "${GITHUB_REF}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" |
            "${TRUSTED_BIN}/sha256sum")" || want_ctx=""
          want_ctx="${want_ctx%% *}"
          have_ctx="$("${TRUSTED_BIN}/sha256sum" release-build-context.json)" || have_ctx=""
          have_ctx="${have_ctx%% *}"
          if [ -z "${want_ctx}" ] || [ "${have_ctx}" != "${want_ctx}" ]; then
            echo "ERROR: release-build-context.json is not exactly this run's context." >&2
            echo "  expected sha256 ${want_ctx:-<unreadable>}" >&2
            echo "  found    sha256 ${have_ctx:-<unreadable>}" >&2
            echo "The build rewrote the run evidence phase 2 binds to. Stopping before any" >&2
            echo "producer or upload runs." >&2
            exit 1
          fi
          echo "checkout intact after the build; producers and uploads may run"
      - name: generate unsigned stable OTA channel manifest
        if: needs.preflight.outputs.publish_ota_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every manifest needs an expiry to bound stale mirror responses.
          # Default: 2160h (90 days). OLIVARES_MANIFEST_EXPIRES_IN overrides it with a
          # Go duration, such as 720h. Renew and sign before expiry; stale manifests
          # block upgrades.
          MANIFEST_EXPIRES_IN: ${{ vars.OLIVARES_MANIFEST_EXPIRES_IN }}
        run: |
          set -euo pipefail
          # Tag/version come from the JOB env — the §C.4 validated outputs, not the raw
          # ref context. The preflight already pinned the bare MAJOR.MINOR grammar.
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "ERROR: empty validated version" >&2; exit 1; }
          expires_in="${MANIFEST_EXPIRES_IN:-2160h}"
          echo "manifest freshness window: ${expires_in}"
          go run ./cmd/olivares release manifest \
            --dir dist --channel stable --version "${version}" \
            --expires-in "${expires_in}" \
            --out dist/stable-manifest.json
          # Bind the manifest to the artifacts THIS run built and cosign-signed:
          # every manifest digest must equal the checksums.txt entry for the same
          # file, and every archive on disk must re-hash to it. A divergence here
          # means the generator and the signed release disagree at the origin — the
          # draft must never carry a manifest that fails this.
          # A freshness bound, plausible policy and platform-correct artifact names are
          # all REQUIRED by default now — there is no flag to forget.
          go run ./cmd/olivares release verify-manifest \
            --manifest dist/stable-manifest.json --checksums dist/checksums.txt \
            --dir dist --expect-channel stable --expect-version "${version}"
          # This draft asset is the exact byte sequence signed off-box in the ceremony.
          # It is not an accepted channel manifest until phase 2 verifies and uploads
          # stable-manifest.json.sig; the GitHub Release itself remains a draft.
          # CREATE-ONLY (INT-22, M60/M67-M73). `--clobber` was here and it OVERWRITES an
          # asset that is already on the release. On a draft that is merely untidy; on a
          # second pass over a release whose bytes someone may already hold, it rewrites
          # delivered evidence, and that is the one property of this chain that cannot be
          # undone. Without the flag `gh` refuses when the name is taken, which is exactly
          # the guarantee we want: a re-run stops and a human decides, instead of the
          # ceremony quietly replacing a signed manifest.
          #
          # The ceremony ALREADY treats the flag as a hazard: the OTA gate below refuses
          # "BEFORE THE DRAFT IS TOUCHED" with the written reason that "the upload below is
          # a --clobber, so refusing afterwards would already have rewritten the stable
          # pair". That workaround exists because of this flag; removing it removes the
          # reason for the workaround.
          # ⛔ Y SE FIRMA AQUÍ, DONDE SE ACABA DE GENERAR. Esto lo pide la orden 37 aunque no
          # lo diga: automatizar la firma OTA retira al humano que leía el bloque
          # «=== POLICY THE SIGNATURE WILL COVER — READ EVERY LINE BEFORE SIGNING ===», y ese
          # humano era lo único que ataba SIETE campos que `--checksums` no toca — `expires`,
          # `released_at`, `min_version`, `rollout`, `security`/`advisories`, `notes` y
          # `channel`. El propio verificador lo dice: «OK: means plausible, not intended».
          #
          # `CheckPolicy` rehúsa los valores imposibles (un `min_version` que nadie puede
          # satisfacer, un `rollout` de 0), pero no puede distinguir una política PLAUSIBLE de
          # la política INTENCIONADA — para eso estaba la lectura. Sin sustituirla, la fase 2
          # firmaría con la clave de producción unos bytes que descarga de un asset de BORRADOR,
          # reemplazable por cualquiera con `contents:write`.
          #
          # La sustitución no es restaurar la lectura: es ATAR LOS BYTES. Firmados aquí con la
          # identidad keyless de este workflow, la fase 2 puede probar que el manifiesto es el
          # que ESTE pipeline generó, y entonces la política es la salida determinista de la
          # release y no la elección de nadie. Cierra los siete campos de una vez.
          bash scripts/cosign-verified.sh sign-blob --yes \
            --output-signature dist/stable-manifest.json.pipeline.sig \
            --output-certificate dist/stable-manifest.json.pipeline.pem \
            dist/stable-manifest.json
          gh release upload "${RELEASE_TAG}" dist/stable-manifest.json
          gh release upload "${RELEASE_TAG}" \
            dist/stable-manifest.json.pipeline.sig \
            dist/stable-manifest.json.pipeline.pem

      # The tagged release/advisories/<version>.txt declares security updates.
      # An absent file is a no-op; an invalid declaration fails.
      # Security manifests remain unsigned here, and phase 2 refuses their publication.
      # LTS production needs a defined policy.
      - name: generate unsigned security OTA channel manifest (deny-closed)
        if: needs.preflight.outputs.publish_ota_stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_EXPIRES_IN: ${{ vars.OLIVARES_MANIFEST_EXPIRES_IN }}
        run: |
          set -euo pipefail

          # ⛔ THE COMMIT IS NOT THE BYTES. Matching HEAD, the tag and an OID proves WHICH
          # commit was checked out; it says nothing about what is on disk NOW. Eight `uses:`
          # steps run before this one in this job — setup-node, pnpm/action-setup, syft,
          # cosign-installer, three docker actions, goreleaser — and any of them executes code
          # in this workspace. A custom action can rewrite scripts/release-ota-channel.sh, or
          # the verifier it will run, WITHOUT touching HEAD: every OID check still passes and
          # the release rule is no longer the reviewed one.
          #
          # So the tree is checked against its commit HERE, immediately before it is read,
          # instead of being trusted from the checkout onwards. `git status --porcelain`
          # covers the three ways it can differ — staged in the index, modified in the working
          # tree, and untracked additions — and any of them is a tree that is not the release.
          # ⛔ THE TOOL IS PART OF THE CONTROL. The byte check below asks `git` what changed,
          # and GitHub documents that an earlier action can prepend a directory to PATH for the
          # rest of the job by writing to GITHUB_PATH. A shim that answers `status --porcelain`
          # with silence and delegates everything else keeps every OID identical and every
          # clean-direction case green, while modified, staged and untracked bytes all sail
          # through. Measured against these exact blocks: producer 20/24, ceremony 59/61
          # (the model repair audit, 2026-08-10, P1-02).
          #
          # So the tools are named by ABSOLUTE PATH instead of being resolved through PATH, and
          # a `git` that PATH resolves elsewhere is itself evidence that something ran before
          # this step: it refuses rather than quietly using the trusted copy.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            echo "Something earlier in this job put another git ahead of it, so the byte check" >&2
            echo "would be asking the wrong tool. Nothing was produced or uploaded." >&2
            exit 1
          fi
          # WHAT THIS JOB IS ALLOWED TO HAVE CREATED, NAMED HERE. The positive flow writes
          # into the workspace before these guards run, and the first version of this check
          # denied its own release for it: phase 1 writes release-commit.txt at the root and
          # the producer answered `?? release-commit.txt`; phase 2 downloads into ota-dist/ and
          # the ceremony answered `?? ota-dist/`. Both refused every legitimate release
          # (the model, #638@1fc91ed8, measured on the real .gitignore).
          #
          # The fix is NOT a .gitignore rule. `git status --porcelain` stops reporting ignored
          # paths at all, so anything dropped inside an ignored directory becomes invisible to
          # this control, and a repo-wide ignore line would silently become load-bearing for a
          # release guard — remove it and the denial comes back. The permitted set is declared
          # HERE, beside the check it qualifies, and it admits ONLY untracked paths: a modified
          # or staged TRACKED file never matches, which is the tampering this exists to catch.
          #
          # `-uall` because untracked DIRECTORIES are otherwise collapsed into one entry, and a
          # single `?? ota-dist/` would then cover any file placed inside it.
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (producer)." >&2
            exit 1
          }
          dirty=""
          while IFS= read -r st || [ -n "${st}" ]; do
            [ -n "${st}" ] || continue
            case "${st}" in
            '?? release-commit.txt') continue ;;
            # go.work.sum: the Go toolchain APPENDS workspace checksums during the build when the
            # published tree's module set differs from the source tree's (measured 2026-09-17, run
            # 35234189801: the only modification after goreleaser was ` M go.work.sum`). Toolchain
            # bookkeeping, not a product file rewritten in silence: its diff is printed here as
            # evidence; the phase-2 binding reads the run's recorded tree, not this file.
            ' M go.work.sum') echo "note: the Go toolchain rewrote go.work.sum during the build:" >&2; "${GIT_BIN}" --no-pager diff --stat -- go.work.sum >&2; continue ;;
            # Written by the same `before` hook, and byte-pinned by the post-build guard
            # above before this step ever runs.
            '?? release-build-context.json') continue ;;
            esac
            dirty="${dirty}${st}"$'\n'
          done <<<"${status_raw}"
          if [ -n "${dirty}" ]; then
            echo "ERROR: the workspace no longer matches the commit for ${RELEASE_TAG} (producer)." >&2
            printf '%s\n' "${dirty}" >&2
            echo "Something wrote to the checkout after it was made. The release rule and the" >&2
            echo "verifier are read from this tree, so a modified tree is not this release." >&2
            exit 1
          fi
          version="${RELEASE_VERSION}"
          [ -n "${version}" ] || { echo "ERROR: empty validated version" >&2; exit 1; }
          expires_in="${MANIFEST_EXPIRES_IN:-2160h}"

          # Fail-closed on the CLASSIFIER too: a refusal (exit 2) or any other non-zero is
          # "I could not decide", which must stop the release rather than quietly skip the
          # security manifest — the whole point of this step is that a security release
          # cannot be downgraded to an ordinary one without somebody seeing it.
          set +e
          verdict="$(bash scripts/release-ota-channel.sh "${version}")"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "ERROR: OTA channel gate refused for ${version}: ${verdict}" >&2
            exit 1
          fi
          # The consumer must recognise the verdict vocabulary EXACTLY, not just test for
          # "security". A predicate of the form `kind != security -> skip` treats a blank
          # first field, a `refuse`, a missing tab and any multi-line corruption as the
          # ordinary no-security path and exits 0 — so a classifier corrupted into
          # "exit 0 + bad output" would silently downgrade a security release, which is
          # the exact failure this step exists to make impossible (the model contrast,
          # 2026-08-09, finding 3). Unknown verdict is a hard error, never a skip.
          if [ "${verdict}" != "${verdict#*$'\n'}" ]; then
            echo "ERROR: OTA channel gate emitted more than one line for ${version}" >&2
            exit 1
          fi
          case "${verdict}" in
          *$'\t'*) ;;
          *)
            echo "ERROR: OTA channel gate emitted no TAB-separated detail for ${version}: ${verdict}" >&2
            exit 1
            ;;
          esac
          kind="${verdict%%$'\t'*}"
          detail="${verdict#*$'\t'}"
          case "${kind}" in
          none)
            echo "no security channel for ${version}: ${detail}"
            exit 0
            ;;
          security) ;;
          *)
            echo "ERROR: OTA channel gate emitted an unknown verdict ${kind} for ${version}" >&2
            exit 1
            ;;
          esac
          # The classifier already refuses an empty id list, but the consumer enforces the
          # invariant it depends on rather than trusting it: with `security<TAB>` the array
          # below expands to nothing and `release manifest` would be called with no
          # --advisory at all, which only fails later at verify-manifest's CheckPolicy —
          # a correct refusal at a much less diagnostic layer.
          if [ -z "${detail}" ]; then
            echo "ERROR: OTA channel gate declared security for ${version} with no advisory ids" >&2
            exit 1
          fi

          echo "security channel declared for ${version}: ${detail}"
          # Advisory ids are passed as REPEATED --advisory flags, never as one joined
          # string: the generator bounds and validates each id separately
          # (core/release/manifest.go:593-602), and a single joined argument would smuggle
          # a whole list past the per-id length and control-character bounds.
          adv_flags=()
          IFS=',' read -r -a adv_ids <<<"${detail}"
          for id in "${adv_ids[@]}"; do
            adv_flags+=(--advisory "${id}")
          done

          go run ./cmd/olivares release manifest \
            --dir dist --channel security --version "${version}" \
            "${adv_flags[@]}" \
            --expires-in "${expires_in}" \
            --out dist/security-manifest.json
          # Same binding as stable: every manifest digest must equal the checksums.txt
          # entry for the same file, and every archive on disk must re-hash to it.
          go run ./cmd/olivares release verify-manifest \
            --manifest dist/security-manifest.json --checksums dist/checksums.txt \
            --dir dist --expect-channel security --expect-version "${version}"
          # ⛔ DRAFT ASSET, AND UNSIGNED — and phase 2 does NOT yet sign it.
          #
          # An earlier revision of this comment said phase 2 "verifies and uploads
          # security-manifest.json.sig", and that was FALSE: every phase-2 binding is
          # stable-only (the single dispatch signature input at :40-49, the download at
          # :935, the .sig write at :999, both verification legs, and the upload at :1083).
          # the model named it as the principal NO-LAND finding, and it was right: a
          # channel is a sequence of SIGNED manifests
          # (an internal design note (not shipped):47-52), so producing an
          # unsigned one is not yet producing a channel.
          #
          # The gap is NOT closed by deleting this step — that would restore the original
          # defect, where nothing produces the channel at all. It is closed by the ceremony
          # gaining a second signature, which changes the human contract of phase 2 and
          # travels in its own movement. What this step MUST NOT do meanwhile is let the
          # half-state be silent, so the guard below makes phase 2 refuse to finish green
          # while an unsigned security manifest sits on the draft.
          # CREATE-ONLY: see the stable-manifest upload above for why the flag is gone.
          gh release upload "${RELEASE_TAG}" dist/security-manifest.json
          echo "::warning::${version} published an UNSIGNED security manifest to the draft. The phase-2 ceremony does not sign it yet; publishing this draft would expose security-channel bytes that every conforming client rejects."

      # SLSA subjects are the base64-encoded checksums.txt entries.
      - name: compute base64 subjects for SLSA provenance
        id: hashes
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: |
          set -euo pipefail
          checksum_file="$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')"
          echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

      # Require one bare versioned image manifest, resolve its registry digest,
      # and compare it with the digest recorded by GoReleaser.
      - name: resolve the exact versioned bare-manifest digest
        id: image
        env:
          # Image coordinates and version come from the validated job environment.
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
        run: bash scripts/resolve-bare-manifest-digest.sh

      # The release SBOM: ONE SPDX document, generated from the shipped image (its binary carries
      # the Go module set every archive ships), attested to the image by digest and attached to
      # the release. Archives carry no per-archive SBOM: the signed checksums cover them.
      - name: release SBOM + image attestation + CISA-2025-draft fields check
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${OCI_IMAGE_REPO}@${DIGEST}"
          bash scripts/sbom-generate.sh "registry:${ref}" spdx-json olivares.spdx.sbom.json
          bash scripts/sbom-check-cisa.sh olivares.spdx.sbom.json
          bash scripts/cosign-verified.sh attest --yes --type spdxjson --predicate olivares.spdx.sbom.json "${ref}"

      # OpenVEX reachability analysis and attestations.
      - name: generate + attest OpenVEX
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin govulncheck to the version used by the other repository checks.
          GOVULNCHECK_VERSION: "v1.3.0"
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          bash scripts/gen-vex.sh --mode source --out olivares.vex.openvex.json
          # ONE OpenVEX for the release, attested to the image by digest; no per-archive copies.
          bash scripts/cosign-verified.sh attest --yes --type openvex --predicate olivares.vex.openvex.json "${OCI_IMAGE_REPO}@${DIGEST}"
          # CREATE-ONLY: see the stable-manifest upload for why the flag is gone.
          gh release upload "${RELEASE_TAG}" olivares.vex.openvex.json olivares.spdx.sbom.json
        # gh is preinstalled on the runner; GH_TOKEN (above) authorises the uploads.

  # Provenance signing runs separately from the build. Keep generator semver
  # tag pins: slsa-verifier uses the tag in the builder identity.
  provenance-binaries:
    needs: [preflight, goreleaser]
    # Run provenance generation only when the validated profile enables it.
    if: needs.preflight.outputs.run_slsa == 'true'
    permissions:
      actions: read # read the build environment for provenance
      id-token: write # keyless Sigstore signing
      contents: write # upload the .intoto.jsonl to the (draft) release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
      draft-release: true
      # Preserve the preflight acknowledgment for repositories that declare that profile.
      private-repository: ${{ github.event.repository.private }}

  # SLSA provenance for the image.
  provenance-image:
    needs: [preflight, goreleaser]
    if: needs.preflight.outputs.run_slsa == 'true'
    permissions:
      actions: read
      id-token: write
      packages: write # push the provenance attestation to ghcr.io
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.goreleaser.outputs.image }}
      digest: ${{ needs.goreleaser.outputs.digest }}
      registry-username: ${{ github.actor }}
      private-repository: ${{ github.event.repository.private }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # The build produces versioned images. Verify their signatures before aliasing
  # latest* through scripts/alias-image-digest.sh, which requires digest equality.
  # Single-manifest sources use --prefer-index=false to preserve their digest.
  # This job has no protected-environment approval; Homebrew remains in the build.
  promote-latest:
    needs: [preflight, goreleaser, provenance-image]
    # Preflight decides whether this profile may publish latest aliases.
    if: github.event_name == 'push' && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod') && needs.preflight.outputs.publish_latest == 'true'
    # Use a GitHub-hosted runner for mutations covered by provenance.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the latest* alias tags to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Use the same cosign pin and signing contract as the build job.
          cosign-release: 'v2.6.4'
      # Verify the installed cosign digest before using it.
      - name: assert the cosign binary is the reviewed artifact
        run: bash scripts/assert-cosign-binary.sh --isolate
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: verify each versioned digest, then alias latest* to it
        env:
          # Use validated preflight outputs.
          DIGEST: ${{ needs.goreleaser.outputs.digest }}
          OCI_IMAGE_REPO: ${{ needs.preflight.outputs.oci_image_repo }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
          # Derive the certificate identity from this repository, workflow and exact
          # tag.
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          # Compare the identity repository with the independently validated
          # destination.
          PREFLIGHT_RELEASE_REPO: ${{ needs.preflight.outputs.release_github_repo }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Escape the repository name before using it in the certificate-identity expression.
          repo_rx="$(printf '%s' "${GITHUB_REPOSITORY}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Preserve a supplied identity pattern so validation can reject it. Otherwise derive
          # the identity from this workflow, the running repository and the exact release tag.
          # Escape regex metacharacters and require a fully anchored pattern.
          tag_rx="$(printf '%s' "${RELEASE_TAG}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          CERT_IDENTITY_REGEXP="${CERT_IDENTITY_REGEXP:-^https://github\.com/${repo_rx}/\.github/workflows/release\.yml@refs/tags/${tag_rx}\$}"
          case "${CERT_IDENTITY_REGEXP}" in
            '^'*'$') ;;
            *) echo "ERROR: OLIVARES_CERT_IDENTITY must be fully anchored (^…\$); got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
              # ⛔ EL CRUCE VA CONTRA OTRA FUENTE. Preguntar si la cadena que acabo de construir
              # con ${repo_rx} contiene ${repo_rx} no puede fallar nunca: sería decoración, el
              # mismo defecto que `release-preflight.sh` documenta haber matado en §C.4.8
              # («printing a fingerprint is not comparing it»). La afirmación real es que el
              # repositorio con el que se construye el ancla es el MISMO que el preflight validó
              # contra §C.4.1, §C.4.2 y §C.4.6 — dos caminos distintos que deben coincidir.
              [ -n "${PREFLIGHT_RELEASE_REPO:-}" ] || {
                echo "ERROR: the preflight's validated destination did not reach this step" >&2; exit 1; }
              [ "${GITHUB_REPOSITORY}" = "${PREFLIGHT_RELEASE_REPO}" ] || {
                echo "ERROR: the identity is being built for '${GITHUB_REPOSITORY}' but the preflight validated '${PREFLIGHT_RELEASE_REPO}'" >&2; exit 1; }
          case "${CERT_IDENTITY_REGEXP}" in
            *"/${repo_rx}/"*'workflows/'*) ;;
            *) echo "ERROR: OLIVARES_CERT_IDENTITY must pin the repository AND the workflow path; got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
          case "${CERT_IDENTITY_REGEXP##*workflows/}" in
            *'.*'*|*'.+'*) echo "ERROR: OLIVARES_CERT_IDENTITY must not wildcard the workflow path (no '.*'/'.+' after workflows/); got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
          verify_and_alias() {
            src_digest="$1"; alias_tag="$2"
            [[ "${src_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "ERROR: refusing to alias '${alias_tag}': source digest '${src_digest}' is not a sha256 digest" >&2
              exit 1
            }
            bash scripts/cosign-verified.sh verify \
              --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
              "${OCI_IMAGE_REPO}@${src_digest}" >/dev/null
            # Format-preserving, digest-asserting alias (P1-01): --prefer-index=false for
            # single-manifest sources, then digest(alias) MUST equal src_digest or it fails.
            SRC_DIGEST="${src_digest}" ALIAS_TAG="${alias_tag}" \
              bash scripts/alias-image-digest.sh
          }
          # Bare `latest` <- the exact versioned bare-manifest digest the build resolved.
          verify_and_alias "${DIGEST}" "latest"
          # Per-arch aliases <- each versioned arch image, re-resolved by digest here.
          for arch in amd64 arm64; do
            d="$(docker buildx imagetools inspect "${OCI_IMAGE_REPO}:${RELEASE_VERSION}-${arch}" --format '{{.Manifest.Digest}}')"
            verify_and_alias "${d}" "latest-${arch}"
          done

  # Build and sign in GHCR, then copy images, signatures and attestations to
  # Docker Hub, the primary pull coordinate. GHCR remains the build origin and
  # fallback; scripts/verify-release.sh verifies either registry.
  # An enabled mirror requires both credentials and fails if either is missing.
  # Copy after attestations, provenance and latest aliases are ready.
  mirror-dockerhub:
    needs: [preflight, goreleaser, provenance-image, promote-latest]
    # Explicit false skips the mirror; production auto requires credentials.
    if: needs.preflight.outputs.release_mode == 'production' && needs.preflight.outputs.publish_dockerhub != 'false'
    # Use a GitHub-hosted runner for mutations covered by provenance.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read GHCR packages to authenticate the source pull before copying to Docker Hub.
      packages: read
    steps:
      - name: detect Docker Hub configuration
        id: cfg
        env:
          DH_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # BOTH-or-NEITHER (D.1): login AND the repo-description update below both
          # consume DOCKERHUB_USERNAME, so a username-only or token-only half-config must
          # FAIL loudly, not silently half-run. The old check looked at the token alone.
          if [ -n "${DH_USERNAME}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${DH_USERNAME}" ] && [ -z "${DH_TOKEN}" ]; then
            # ⛔ ERROR, NOT A WARNING, SINCE 2026-08-23. This branch used to emit
            # `enabled=false` and let the release finish GREEN. That is a false green of the
            # automatic-sale chain: `docker.io/olivaresai/olivares` is the OFFICIAL coordinate
            # by the maintainer decision of 2026-07-25 — it is what `deploy/helm/olivares/
            # values.yaml:20` sets as the chart default and what INSTALL.md, the quickstarts
            # and every `docker run` in the docs lead with. Publishing to ghcr.io only and
            # calling the release a success means the documented pull command answers
            # `manifest unknown` to the first stranger who copies it, and nothing anywhere
            # said so.
            #
            # The repair is fail-closed applied to DELIVERY: the credentials stop being a
            # silent option and become a DECLARED PRECONDITION. The workflow's own comment
            # already asked for exactly this ("Treat the secrets as a release precondition")
            # while the code did the opposite.
            #
            # ⚠ WHY THIS DOES NOT BREAK THE REHEARSAL, checked before writing it: the T3
            # rehearsal profile sets PUBLISH_DOCKERHUB=false (scripts/release-preflight.sh:132),
            # and the job's own `if:` skips on 'false', so this branch is unreachable there.
            # Production sets `auto` (:118) and the preflight emits it VERBATIM (:270), so the
            # job runs and this check is what decides. The deliberate opt-out therefore still
            # works and only the production path is now fail-closed.
            #
            # This does NOT re-decide which registry is official — it makes the decision that
            # already exists TRUE for the first time. Reversing the roles would be a different
            # question and it belongs to.
            echo "::error::Docker Hub credentials absent, and docker.io/olivaresai/olivares is the OFFICIAL coordinate (maintainer decision 2026-07-25) that the chart default, INSTALL.md and every quickstart point at. Publishing only to ghcr.io would leave those documented pull commands answering 'manifest unknown'. Set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN, or set PUBLISH_DOCKERHUB=false to opt out DELIBERATELY."
            exit 1
          else
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be both set or both absent."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Use the same cosign pin and signing contract as the build job.
          cosign-release: 'v2.6.4'
        if: steps.cfg.outputs.enabled == 'true'
      # Verify the installed cosign digest before using it.
      - name: assert the cosign binary is the reviewed artifact
        # Checkout, installer, digest assertion and copy share the same enabled
        # predicate.
        if: steps.cfg.outputs.enabled == 'true'
        run: bash scripts/assert-cosign-binary.sh --isolate
      # Authenticate both source and destination when mirroring is enabled.
      # Source pulls must not depend on the package's anonymous access setting.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: cosign copy build origin -> validated production mirror — image + signatures + attestations
        if: steps.cfg.outputs.enabled == 'true'
        env:
          # Both coordinates come from validated preflight outputs; the production
          # mirror is docker.io/olivaresai/olivares.
          SRC: ${{ needs.preflight.outputs.oci_image_repo }}
          DST: ${{ needs.preflight.outputs.mirror_image_repo }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          # goreleaser renders {{ .Version }} WITHOUT the leading "v"; the preflight
          # output already carries exactly that form.
          ver="${RELEASE_VERSION}"
          # Copy each multi-arch manifest tag by digest. cosign copy transfers the
          # image index, its child manifests AND the referring signatures/attestations
          # (SBOM, OpenVEX, SLSA) — so the digest and every verification are preserved.
          for tag in "${ver}" "latest"; do
            echo "==> mirroring ${SRC}:${tag} -> ${DST}:${tag}"
            bash scripts/cosign-verified.sh copy --force "${SRC}:${tag}" "${DST}:${tag}"
            src_manifest="$(docker buildx imagetools inspect --raw "${SRC}:${tag}" | sha256sum | cut -d' ' -f1)"
            dst_manifest="$(docker buildx imagetools inspect --raw "${DST}:${tag}" | sha256sum | cut -d' ' -f1)"
            [ "${src_manifest}" = "${dst_manifest}" ] || {
              echo "::error::manifest bytes differ for ${tag}: source=${src_manifest}, destination=${dst_manifest}" >&2
              exit 1
            }
            echo "${tag} sha256:${src_manifest} — identical manifest bytes"
          done
      - name: sync Docker Hub repository description (best-effort)
        if: steps.cfg.outputs.enabled == 'true'
        continue-on-error: true
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          jwt="$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DH_USER}\",\"password\":\"${DH_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)"
          full="$(jq -Rs . < packaging/docker/dockerhub-overview.md)"
          short="Ground truth for enterprise AI — self-hosted, one static binary."
          curl -fsS -X PATCH \
            -H "Authorization: JWT ${jwt}" -H 'Content-Type: application/json' \
            -d "{\"full_description\": ${full}, \"description\": \"${short}\"}" \
            "https://hub.docker.com/v2/repositories/olivaresai/olivares/" >/dev/null
          echo "Docker Hub repository description synced from packaging/docker/dockerhub-overview.md"

  # Preprod exercises the same authenticated image-copy path inside its
  # validated GHCR namespace.
  mirror-preprod:
    needs: [preflight, goreleaser, provenance-image, promote-latest]
    if: needs.preflight.outputs.release_mode == 'preprod' && needs.preflight.outputs.publish_dockerhub == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.4'
      - name: assert the cosign binary is the reviewed artifact
        run: bash scripts/assert-cosign-binary.sh --isolate
      # Authenticate the source with the scoped token that can write the sibling mirror.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: copy signed images to the side mirror and compare manifest bytes
        env:
          SRC: ${{ needs.preflight.outputs.oci_image_repo }}
          DST: ${{ needs.preflight.outputs.mirror_image_repo }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          set -euo pipefail
          for tag in "${RELEASE_VERSION}" latest; do
            echo "==> mirroring ${SRC}:${tag} -> ${DST}:${tag}"
            bash scripts/cosign-verified.sh copy --force "${SRC}:${tag}" "${DST}:${tag}"
            src_manifest="$(docker buildx imagetools inspect --raw "${SRC}:${tag}" | sha256sum | cut -d' ' -f1)"
            dst_manifest="$(docker buildx imagetools inspect --raw "${DST}:${tag}" | sha256sum | cut -d' ' -f1)"
            [ "${src_manifest}" = "${dst_manifest}" ] || {
              echo "::error::manifest bytes differ for ${tag}: source=${src_manifest}, destination=${dst_manifest}" >&2
              exit 1
            }
            echo "${tag} sha256:${src_manifest} — identical manifest bytes"
          done

  # AUTHORIZATION CONTRACT OF THIS DISPATCH
  # Phase 2 verifies and publishes an existing draft using protected approval
  # and repository/profile guards. Tag and commit inputs select the candidate;
  # they cannot redirect destinations. Verify its pipeline signature and artifact
  # digests before signing with the protected OTA key.
  publish-ota-manifest:
    needs: [release-environment-policy]
    if: github.event_name == 'workflow_dispatch' && (github.repository == 'olivaresai/olivares' || vars.OLIVARES_RELEASE_PROFILE == 'preprod')
    # Use a GitHub-hosted runner for signing and publication.
    runs-on: ubuntu-latest
    # Keep the protected ota-release-ceremony environment name. A new name may
    # create an environment without approval rules. Preprod uses its own environment.
    environment:
      # The production repository always uses ota-release-ceremony.
      # Only a different repository with the preprod profile may select preprod.
      name: ${{ (github.repository != 'olivaresai/olivares' && vars.OLIVARES_RELEASE_PROFILE == 'preprod') && 'preprod' || 'ota-release-ceremony' }}
    permissions:
      contents: write
      # Read the producing phase-1 run and attempt to require completed, successful
      # status.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the fully qualified tag ref so a same-named branch cannot win checkout.
          # Phase 2 must use the object phase 1 built.
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Use the same cosign pin and signing contract as the build job.
          cosign-release: 'v2.6.4'
      # Install slsa-verifier before the checkout-integrity window; no later setup
      # action may precede code consumed from that verified checkout.
      # Strict publication verification requires it. Keep its action SHA-pinned;
      # SLSA generators use tags for builder identities.
      - uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      # Check the installed verifier digest and version before relying on its results.
      - name: assert the slsa-verifier binary is the reviewed artifact
        env:
          # Upstream v2.7.1 linux/amd64 digest for this GitHub-hosted Linux runner.
          EXPECTED_SLSA_VERIFIER_SHA256: '946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339'
          EXPECTED_SLSA_VERIFIER_VERSION: 'v2.7.1'
        run: |
          set -euo pipefail
          TRUSTED_BIN="/usr/bin"
          for t in sha256sum readlink grep chmod; do
            [ -x "${TRUSTED_BIN}/${t}" ] || { echo "ERROR: no trusted ${t} at ${TRUSTED_BIN}" >&2; exit 1; }
          done
          resolved="$(command -v slsa-verifier || true)"
          if [ -z "${resolved}" ]; then
            echo "ERROR: slsa-verifier is not on PATH after the installer step." >&2
            echo "scripts/verify-release.sh --strict-publication requires it; it is never skipped." >&2
            exit 1
          fi
          # Follow symlinks so the digest is of the file that actually executes.
          abs="$("${TRUSTED_BIN}/readlink" -f "${resolved}")"
          # The installer writes the binary execute-only (measured 2026-09-17, run 35243925445:
          # `sha256sum: …/.slsa/bin/v2.7.1/slsa-verifier: Permission denied`). Digesting it is the
          # whole point of this step; the file is the runner user's own, so u+r moves no trust line.
          # BY ABSOLUTE PATH, like the other three tools of this step: the public form
          # (0cceaf1c75's parent c19994b22b) called `chmod` through PATH, which an earlier action
          # owns — the exact hole TRUSTED_BIN exists to close, in the step that decides whether
          # the verifier is the reviewed artifact.
          "${TRUSTED_BIN}/chmod" u+r "${abs}"
          # Split in the shell rather than piping: a failing sha256sum inside a pipeline would
          # leave an EMPTY digest that matches nothing and reports the wrong reason.
          sum_line="$("${TRUSTED_BIN}/sha256sum" "${abs}")"
          digest="${sum_line%% *}"
          [ "${#digest}" -eq 64 ] || { echo "ERROR: could not digest ${abs}" >&2; exit 1; }
          if [ "${digest}" != "${EXPECTED_SLSA_VERIFIER_SHA256}" ]; then
            echo "ERROR: slsa-verifier at ${abs} is not the reviewed artifact." >&2
            echo "  expected sha256: ${EXPECTED_SLSA_VERIFIER_SHA256}" >&2
            echo "  actual   sha256: ${digest}" >&2
            echo "Publication verification will not run against an unreviewed verifier." >&2
            exit 1
          fi
          # Second, independent statement of the same fact. `v?` is a MEASUREMENT, not
          # sloppiness: the released linux/amd64 binary prints `GitVersion:    2.7.1` with no
          # leading v (injected by ldflags at release time), while a `go install ...@v2.7.1`
          # build prints `v2.7.1` (version taken from the module path). An anchored `v2.7.1`
          # pattern rejects the artifact this installer actually delivers.
          # HERE-STRING, NOT A PIPE: `producer | grep -q` exits 141 when grep closes the pipe
          # early, and under pipefail that reads as a failure on a successful match.
          version_out="$(slsa-verifier version 2>&1)"
          "${TRUSTED_BIN}/grep" -qE '^GitVersion: +v?2\.7\.1$' <<<"${version_out}" || {
            echo "ERROR: slsa-verifier does not report ${EXPECTED_SLSA_VERIFIER_VERSION}." >&2
            printf '%s\n' "${version_out}" >&2
            exit 1
          }
          echo "slsa-verifier verified: ${abs} (${EXPECTED_SLSA_VERIFIER_VERSION}, sha256 ${digest})"
      # Check the workspace after setup actions and before any tracked script runs.
      - name: assert the checkout is untouched before anything consumes it (phase 2)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # ⛔ EARLY, BECAUSE A LATE REFUSAL DOES NOT UNBIND WHAT ALREADY HAPPENED. The guard
          # further down runs immediately before the release rule is read, which is right and
          # is not enough: by then this job has already built, signed, generated and uploaded.
          # Refusing there leaves those effects standing and merely declines to add one more.
          # This step runs after the LAST setup `uses:` and before the first thing that
          # consumes the tree, so a tampered checkout stops the phase before it produces
          # anything at all (the model, report 56aeafd4c, R2).
          #
          # STRICTEST FORM: at this point the job has generated nothing, so NOTHING untracked,
          # modified or staged is acceptable. The permitted-artifact list belongs to the later
          # guard, where those artifacts legitimately exist.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            echo "An earlier action put another git ahead of it. Nothing has been consumed yet." >&2
            exit 1
          fi
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          tag_oid="$("${GIT_BIN}" rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${head_oid}" != "${tag_oid}" ]; then
            echo "ERROR: the checkout (${head_oid}) is not ${RELEASE_TAG} (${tag_oid})." >&2
            exit 1
          fi
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (phase 2 early guard)." >&2
            exit 1
          }
          if [ -n "${status_raw}" ]; then
            echo "ERROR: the checkout was modified before this phase consumed it." >&2
            printf '%s\n' "${status_raw}" >&2
            echo "Nothing has been built, generated or uploaded. Stopping here." >&2
            exit 1
          fi
          echo "checkout verified before phase 2 consumes it"
      - name: bind this checkout to phase 1 before any tracked code runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          # Derive the certificate identity from this repository, workflow and exact
          # tag.
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
          # Pin the cosign linux-amd64 digest here and in
          # scripts/assert-cosign-binary.sh.
          # A repository variable could change without review; validation requires the
          # versioned digest.
          COSIGN_EXPECTED_SHA256: 309779b0c4e409186b0a80daba99041fe2cf65a920ce645013901df6211895a9
          COSIGN_EXPECTED_VERSION: v2.6.4
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Escape the repository name before using it in the certificate-identity expression.
          repo_rx="$(printf '%s' "${GITHUB_REPOSITORY}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Preserve a supplied identity pattern so validation can reject it. Otherwise derive
          # the identity from this workflow, the running repository and the exact release tag.
          # Escape regex metacharacters and require a fully anchored pattern.
          tag_rx="$(printf '%s' "${RELEASE_TAG}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          CERT_IDENTITY_REGEXP="${CERT_IDENTITY_REGEXP:-^https://github\.com/${repo_rx}/\.github/workflows/release\.yml@refs/tags/${tag_rx}\$}"
          # ⛔ IDENTITY, CRYPTOGRAPHICALLY, BEFORE ANY CHECKOUT CODE RUNS.
          #
          # The previous version of this step compared the evidence digest against
          # checksums.txt and said in its own comment that checksums.txt was not yet
          # authenticated. That is not a binding: an actor with contents:write moves the tag,
          # the checkout and the input together AND replaces both files, the digests agree,
          # and the job goes on to execute scripts/assert-cosign-binary.sh from a checkout
          # nothing has vouched for (the model, R2 second follow-up, finding 1).
          #
          # So the signature is verified HERE, first, with:
          #   · tools resolved by ABSOLUTE PATH, never through PATH — GITHUB_PATH lets an
          #     earlier action prepend a shim, and a shimmed `gh` or `git` would be choosing
          #     what this step gets to see;
          #   · cosign from the SHA-pinned installer, checked to be the reviewed version and
          #     refused if it resolves inside the workspace;
          #   · the anchored identity/issuer this repository already requires elsewhere,
          #     invoked inline rather than through the checkout's wrapper script.
          #
          # OLIVARES_TRUSTED_BIN exists so the battery can run this exact block against stub
          # tools. It is not set by this workflow; changing it requires editing this file,
          # which is the same privilege as editing the step itself.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          GH_BIN="${TRUSTED_BIN}/gh"
          for tool in "${GIT_BIN}" "${GH_BIN}"; do
            [ -x "${tool}" ] || { echo "ERROR: no trusted tool at ${tool}" >&2; exit 1; }
          done
          for name in git gh; do
            resolved="$(command -v "${name}" || true)"
            if [ "${resolved}" != "${TRUSTED_BIN}/${name}" ]; then
              echo "ERROR: PATH resolves ${name} to ${resolved:-<none>}, not ${TRUSTED_BIN}/${name}." >&2
              echo "An earlier action put another one ahead of it. No tracked code has run." >&2
              exit 1
            fi
          done
          # gh IS IDENTIFIED, NOT MERELY LOCATED (INT-22, M78). Until 2026-08-18 gh was checked
          # for existence and for PATH resolution and nothing else, while cosign — the other
          # tool this ceremony trusts — is pinned by sha256 AND version a few steps below, under
          # a comment that says "THE BINARY, NOT ITS SELF-DESCRIPTION". gh uploads and downloads
          # the release's assets, so it is in the same trust position and had none of the same
          # checks.
          #
          # ⚠️ WHAT THIS IS AND IS NOT, said plainly so nobody reads it as the cosign treatment.
          # This is a VERSION FLOOR plus a recorded digest. It is NOT a digest pin. A digest pin
          # is the stronger form and it is what this should become, but the value has to be the
          # sha256 of /usr/bin/gh ON THE RUNNER, and a deny-closed pin with the value left empty
          # would refuse every release until somebody filled it in. Landing that days before a
          # cut would trade one hole for an outage. The digest is printed on every run, so the
          # value the pin needs is one release away from being known.
          # ⛔ SIN TUBERIA Y CON EL CODIGO DE SALIDA A LA VISTA, y las dos mitades son por lo
          # mismo: este `||` convertia CUALQUIER fallo en una cadena vacia, y el error de abajo
          # solo enseñaba la cadena. `X | head -1` bajo `pipefail` puede devolver 141 —SIGPIPE—
          # cuando el escritor sigue escribiendo despues de que head cierre, y `gh --version`
          # imprime DOS lineas; que ese sea el caso aqui NO esta demostrado (no se reprodujo con
          # un stub de dos lineas cortas el 2026-08-19), pero un `head` que no aporta nada frente
          # a una expansion de parametro no merece ni la duda. Lo que si esta medido es el
          # sintoma: `release mechanics` fallo dos veces en runners distintos con
          # `could not read a version from …/gh: ''`, sin una sola pista de por que la lectura
          # devolvio vacio.
          gh_ver_rc=0
          gh_ver_raw="$("${GH_BIN}" --version 2>/dev/null)" || gh_ver_rc=$?
          gh_ver_raw="${gh_ver_raw%%$'\n'*}"
          case "${gh_ver_raw}" in
          "gh version "*) ;;
          *)
            echo "ERROR: could not read a version from ${GH_BIN}: '${gh_ver_raw}' (exit ${gh_ver_rc})." >&2
            echo "A tool that moves release assets must identify itself. No tracked code has run." >&2
            echo "  126 = not executable or a noexec mount; 127 = missing shebang interpreter" >&2
            echo "  141 = SIGPIPE; 0 with an empty string = started but printed nothing" >&2
            ls -l -- "${GH_BIN}" >&2 || true
            exit 1
            ;;
          esac
          gh_ver="${gh_ver_raw#gh version }"
          gh_ver="${gh_ver%% *}"
          gh_major="${gh_ver%%.*}"
          gh_rest="${gh_ver#*.}"
          gh_minor="${gh_rest%%.*}"
          case "${gh_major}${gh_minor}" in
          *[!0-9]*|"")
            echo "ERROR: ${GH_BIN} reported an unparseable version '${gh_ver}'." >&2
            exit 1
            ;;
          esac
          # Floor, not equality: the ceremony needs `release upload` to refuse a name that
          # already exists, which is the create-only property the uploads now rely on.
          if [ "${gh_major}" -lt 2 ] || { [ "${gh_major}" -eq 2 ] && [ "${gh_minor}" -lt 40 ]; }; then
            echo "ERROR: ${GH_BIN} is gh ${gh_ver}; this ceremony requires >= 2.40." >&2
            exit 1
          fi
          gh_sum="$("${TRUSTED_BIN}/sha256sum" "${GH_BIN}")" || gh_sum=""
          echo "gh: version ${gh_ver}, sha256 ${gh_sum%% *}"
          # THE BINARY, NOT ITS SELF-DESCRIPTION. Asking `command -v cosign` and believing the
          # `GitVersion:` it prints trusts the very thing under suspicion: a shim on
          # GITHUB_PATH answers with the reviewed version and returns 0 from verify-blob. The
          # artefact is identified by DIGEST against a value pinned outside this job, and it
          # must live where the SHA-pinned installer put it — never in the workspace.
          COSIGN_BIN="$(command -v cosign || true)"
          [ -n "${COSIGN_BIN}" ] || { echo "ERROR: cosign is not installed" >&2; exit 1; }
          case "${COSIGN_BIN}" in
          "${GITHUB_WORKSPACE}"/*)
            echo "ERROR: cosign resolves inside the checkout (${COSIGN_BIN})." >&2
            echo "No tracked code has run." >&2
            exit 1
            ;;
          # The reviewed cosign installer action, v4.1.2, installs to $HOME/.cosign/cosign on
          # hosted runners (measured 2026-09-17, run 35244623296: "/home/runner/.cosign/cosign");
          # the digest assertion that follows still pins the binary to COSIGN_EXPECTED_SHA256.
          # The action is named here in PROSE ONLY: lint:cosign-pins reads `sigstore/`+the
          # installer name inside a run: scalar as an acquisition of cosign outside the reviewed
          # step, and it is right to — this comment is not how the binary got here.
          /opt/hostedtoolcache/* | /usr/local/bin/* | "${HOME}"/.cosign/cosign) ;;
          *)
            echo "ERROR: cosign resolves to ${COSIGN_BIN}, outside the installer's locations." >&2
            echo "No tracked code has run." >&2
            exit 1
            ;;
          esac
          # DENY-CLOSED ON AN UNPINNED DIGEST. Without the reviewed artefact's sha256 there is
          # nothing to compare against, and "I could not check" is not "it is fine".
          if [ -z "${COSIGN_EXPECTED_SHA256}" ]; then
            echo "ERROR: the reviewed cosign digest is not pinned in this workflow." >&2
            echo "A tool that verifies a release must itself be identified. No tracked code has run." >&2
            exit 1
          fi
          # VERSION TOO, after the digest and never instead of it. The digest is what
          # identifies the artefact; the version check is what turns "these bytes are not the
          # ones we approved" into a diagnosis an operator can act on when the installer pin
          # moves. A location allow-list alone was never sufficient: /usr/local/bin is
          # writable by an earlier step on a hosted runner.
          cosign_sum="$("${TRUSTED_BIN}/sha256sum" "${COSIGN_BIN}")" || cosign_sum=""
          cosign_sum="${cosign_sum%% *}"
          if [ "${cosign_sum}" != "${COSIGN_EXPECTED_SHA256}" ]; then
            echo "ERROR: cosign at ${COSIGN_BIN} is not the reviewed artefact." >&2
            echo "  expected ${COSIGN_EXPECTED_SHA256}" >&2
            echo "  got      ${cosign_sum:-<unreadable>}" >&2
            echo "No tracked code has run." >&2
            exit 1
          fi
          cosign_ver=""
          while IFS= read -r _l || [ -n "${_l}" ]; do
            case "${_l}" in
            *GitVersion:*)
              cosign_ver="${_l##*: }"
              cosign_ver="${cosign_ver// /}"
              ;;
            esac
          done <<<"$("${COSIGN_BIN}" version 2>/dev/null)"
          if [ "${cosign_ver}" != "${COSIGN_EXPECTED_VERSION}" ]; then
            echo "ERROR: the approved bytes report ${cosign_ver:-<unknown>}, not ${COSIGN_EXPECTED_VERSION}." >&2
            echo "The pinned digest and the installer pin disagree. No tracked code has run." >&2
            exit 1
          fi
          # The identity pattern is a repo variable, settable without review; an unanchored
          # override turns the verification into theatre.
          # THE SAME CONTRACT AS THE LATE STEP, not a weaker echo of it. Checking only that
          # the pattern is anchored accepts `^.*$`, which matches every identity there is.
          case "${CERT_IDENTITY_REGEXP}" in
          '^'*'$') ;;
          *) echo "ERROR: OLIVARES_CERT_IDENTITY must be fully anchored (^…\$)" >&2; exit 1 ;;
          esac
          # ⛔ AQUÍ NO HAY CRUCE CONTRA EL PREFLIGHT, Y NO PUEDE HABERLO. Este job responde a
          # `workflow_dispatch` y **no declara `needs:`**, asi que `needs.preflight.outputs.*`
          # no existe para el — actionlint rechaza el intento con «property "preflight" is not
          # defined». Lo intente, y de la peor manera: retire la DEFINICION y deje el
          # CONSUMIDOR, con lo que este paso moria siempre bajo `set -euo pipefail` y la fase 2
          # entera no llegaba ni a descargar la evidencia. Lo cazo un contraste adversarial
          # contra mi propio diseño, no una revision mia.
          #
          # El cruce equivalente esta mas abajo y es MAS FUERTE que una comparacion en shell:
          # `--certificate-github-workflow-repository "${GITHUB_REPOSITORY}"` exige que la
          # reclamacion del CERTIFICADO nombre al repositorio que corre, asi que un ancla
          # construida para otro repositorio no se satisface ni pasando esta gramatica.
          case "${CERT_IDENTITY_REGEXP}" in
          *"/${repo_rx}/"*'workflows/'*) ;;
          *) echo "ERROR: the derived identity does not pin the repository AND the workflow path" >&2; exit 1 ;;
          esac
          case "${CERT_IDENTITY_REGEXP##*workflows/}" in
          *'.*'* | *'.+'*)
            echo "ERROR: OLIVARES_CERT_IDENTITY must not wildcard the workflow path" >&2
            exit 1
            ;;
          esac

          [ -n "${RELEASE_COMMIT}" ] || { echo "ERROR: release_commit is empty" >&2; exit 1; }
          case "${RELEASE_COMMIT}" in
          *[!0-9a-f]* | "") echo "ERROR: release_commit is not lowercase hex" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_COMMIT}" -eq 40 ] || { echo "ERROR: release_commit is not a full OID" >&2; exit 1; }

          mkdir -p ota-dist
          "${GH_BIN}" release download "${RELEASE_TAG}" --dir ota-dist --clobber \
            --pattern release-commit.txt --pattern checksums.txt \
            --pattern checksums.txt.sig --pattern checksums.txt.pem || {
            echo "ERROR: could not download phase 1's evidence and its signature." >&2
            exit 1
          }
          for f in release-commit.txt checksums.txt checksums.txt.sig checksums.txt.pem; do
            [ -f "ota-dist/${f}" ] || {
              echo "ERROR: the draft is missing ${f}; phase 1 published no verifiable evidence." >&2
              exit 1
            }
          done

          # THE SIGNATURE FIRST. Everything below reads checksums.txt, so it is authenticated
          # before it is read — not after.
          "${COSIGN_BIN}" verify-blob \
            --certificate ota-dist/checksums.txt.pem \
            --signature ota-dist/checksums.txt.sig \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            ota-dist/checksums.txt || {
            echo "ERROR: checksums.txt is not signed by the release identity." >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          }

          ev_sum="$("${TRUSTED_BIN}/sha256sum" ota-dist/release-commit.txt)" || ev_sum=""
          ev_sum="${ev_sum%% *}"
          [ -n "${ev_sum}" ] || { echo "ERROR: could not digest the evidence" >&2; exit 1; }
          ev_bound=0
          while IFS= read -r _cs || [ -n "${_cs}" ]; do
            [ "${_cs%$'\r'}" = "${ev_sum}  release-commit.txt" ] && ev_bound=1
          done <ota-dist/checksums.txt
          [ "${ev_bound}" -eq 1 ] || {
            echo "ERROR: the evidence does not match its entry in the SIGNED checksums." >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          }
          IFS= read -r phase1_oid <ota-dist/release-commit.txt || true
          phase1_oid="${phase1_oid%$'\r'}"
          case "${phase1_oid}" in
          *[!0-9a-f]* | "") echo "ERROR: evidence is not a bare OID: ${phase1_oid}" >&2; exit 1 ;;
          esac
          [ "${#phase1_oid}" -eq 40 ] || { echo "ERROR: evidence is not a full OID" >&2; exit 1; }
          # Byte-exact here too. The signed checksum already pins these bytes, but the OID is
          # taken with `read`, so the shape is asserted rather than inferred.
          want_ev="$(printf '%s\n' "${phase1_oid}" | "${TRUSTED_BIN}/sha256sum")" || want_ev=""
          want_ev="${want_ev%% *}"
          if [ -z "${want_ev}" ] || [ "${want_ev}" != "${ev_sum}" ]; then
            echo "ERROR: the evidence file is not exactly one OID and a newline." >&2
            echo "No tracked code has run." >&2
            exit 1
          fi

          tag_oid="$("${GIT_BIN}" rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${phase1_oid}" != "${RELEASE_COMMIT}" ] ||
            [ "${tag_oid}" != "${phase1_oid}" ] || [ "${head_oid}" != "${phase1_oid}" ]; then
            echo "ERROR: this checkout is not the commit phase 1 built." >&2
            echo "  phase 1 built  : ${phase1_oid}" >&2
            echo "  dispatched for : ${RELEASE_COMMIT}" >&2
            echo "  tag resolves to: ${tag_oid}" >&2
            echo "  checkout is    : ${head_oid}" >&2
            echo "No tracked script has been executed. Stopping here." >&2
            exit 1
          fi
          echo "checkout bound to phase 1 commit ${phase1_oid}, on a cosign-verified checksums.txt"
      # Check draft state before signing or replacing assets; refuse a published
      # or unreadable release. scripts/release-finalize-stable.sh can inspect a
      # published candidate without repeating publication.
      - name: reconcile the release state before signing or clobbering
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TRUSTED_BIN="/usr/bin"
          GH_BIN="${TRUSTED_BIN}/gh"
          [ -x "${GH_BIN}" ] || { echo "ERROR: no trusted gh at ${GH_BIN}" >&2; exit 1; }
          state_rc=0
          state="$("${GH_BIN}" release view "${RELEASE_TAG}" --json isDraft --jq '"DRAFT \(.isDraft)"')" || state_rc=$?
          if [ "${state_rc}" -ne 0 ]; then
            echo "ERROR: could not read the state of ${RELEASE_TAG} (gh exit ${state_rc})." >&2
            echo "A ceremony that cannot tell a draft from a published release must not sign" >&2
            echo "or clobber one. Nothing has been signed or uploaded." >&2
            exit 1
          fi
          case "${state}" in
          "DRAFT true")
            echo "${RELEASE_TAG} is a draft; the ceremony may sign, verify and publish it."
            ;;
          "DRAFT false")
            echo "ERROR: ${RELEASE_TAG} is ALREADY PUBLISHED." >&2
            echo "This dispatch signs, verifies and publishes a DRAFT. Re-running it over a" >&2
            echo "published release would re-sign and clobber bytes users may already hold," >&2
            echo "and no rollback puts those back. Nothing has been signed or uploaded." >&2
            echo "" >&2
            echo "To INSPECT and VERIFY the published candidate without repeating any effect:" >&2
            echo "  bash scripts/release-finalize-stable.sh ${RELEASE_TAG} <release-commit>" >&2
            echo "It detects the published state and reports it; it publishes nothing." >&2
            exit 1
            ;;
          *)
            echo "ERROR: ${RELEASE_TAG} reports an unreadable draft posture: '${state}'." >&2
            echo "An unknown state is not a draft. Nothing has been signed or uploaded." >&2
            exit 1
            ;;
          esac
      - name: assert the cosign binary is the reviewed artifact
        run: bash scripts/assert-cosign-binary.sh --isolate
      - name: download draft manifest, signed checksums and every published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # Same tag grammar the §C.4 preflight pins for production (the old check
          # accepted any v* string). Prereleases are deliberately outside the contract —
          # see the policy note at PROD_TAG_RE in scripts/release-preflight.sh.
          # Bare MAJOR.MINOR under the release version policy. A v-prefixed input gets its own
          # message because the reflexive mistake is to paste the old shape, and "wrong
          # shape" alone sends the operator to the grammar instead of to the prefix.
          if [[ "${RELEASE_TAG}" =~ ^v[0-9] ]]; then
            echo "ERROR: release_tag '${RELEASE_TAG}' carries a v prefix. Release tags are bare MAJOR.MINOR (e.g. 1.0) under the release version policy." >&2
            exit 1
          fi
          [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "ERROR: release_tag must be bare MAJOR.MINOR (e.g. 1.0), got '${RELEASE_TAG}'" >&2; exit 1; }
          version="${RELEASE_TAG}"
          mkdir -p ota-dist
          # ALL platform archives, not just linux/amd64: the cross-check below binds
          # EVERY manifest artifact to its published bytes, so every one must be here.
          # ONLY WHAT IS STILL MISSING. The binding step above already fetched
          # release-commit.txt, checksums.txt, its signature and its certificate into this same
          # directory, and it verified the cosign signature over them before anything from the
          # checkout ran. Asking for them again here refused the whole step: `gh release
          # download` will not overwrite an existing destination without --clobber, so the
          # ceremony denied itself on files it had just authenticated. Re-downloading them
          # would also be the wrong instinct — the bytes verified above are the bytes the rest
          # of this job must use, not a second copy fetched later.
          gh release download "${RELEASE_TAG}" --dir ota-dist \
            --pattern stable-manifest.json \
            --pattern stable-manifest.json.pipeline.sig \
            --pattern stable-manifest.json.pipeline.pem \
            --pattern "olivares_${version}_*.tar.gz"
          # El par del manifiesto es OBLIGATORIO, no opcional: sin el, los bytes que se van a
          # firmar con la clave OTA no estan atados a nada mas que a los digests, y los siete
          # campos de politica quedarian a merced de quien pueda reescribir un asset de borrador.
          for f in stable-manifest.json.pipeline.sig stable-manifest.json.pipeline.pem; do
            [ -s "ota-dist/${f}" ] || {
              echo "::error::the draft is missing ${f}; phase 1 published no binding for the manifest bytes" >&2
              exit 1; }
          done

      # Authenticate checksums.txt with the release identity, then cross-check the
      # manifest and every archive before OTA signing.
      - name: verify the cosign signature over checksums.txt
        env:
          # Pin verification to this exact release tag.
          RELEASE_TAG: ${{ inputs.release_tag }}
          # Derive the certificate identity from this repository, workflow and exact
          # tag.
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Escape the repository name before using it in the certificate-identity expression.
          repo_rx="$(printf '%s' "${GITHUB_REPOSITORY}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          # shellcheck disable=SC2016 # The sed pattern needs literal regex metacharacters.
          # Preserve a supplied identity pattern so validation can reject it. Otherwise derive
          # the identity from this workflow, the running repository and the exact release tag.
          # Escape regex metacharacters and require a fully anchored pattern.
          tag_rx="$(printf '%s' "${RELEASE_TAG}" | sed 's/[.[\*^$()+?{}|]/\\&/g')"
          CERT_IDENTITY_REGEXP="${CERT_IDENTITY_REGEXP:-^https://github\.com/${repo_rx}/\.github/workflows/release\.yml@refs/tags/${tag_rx}\$}"
          # The identity pattern is a REPO VARIABLE, i.e. settable by anyone with repo
          # admin and never reviewed in a PR. An unanchored or over-broad override
          # turns this whole step into theatre, so validate the var before trusting it.
          case "${CERT_IDENTITY_REGEXP}" in
            '^'*'$') ;;
            *) echo "ERROR: OLIVARES_CERT_IDENTITY must be fully anchored (^…\$); got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
              # ⛔ EL CRUCE VA CONTRA OTRA FUENTE. Preguntar si la cadena que acabo de construir
              # con ${repo_rx} contiene ${repo_rx} no puede fallar nunca: sería decoración, el
              # mismo defecto que `release-preflight.sh` documenta haber matado en §C.4.8
              # («printing a fingerprint is not comparing it»). La afirmación real es que el
              # repositorio con el que se construye el ancla es el MISMO que el preflight validó
              # contra §C.4.1, §C.4.2 y §C.4.6 — dos caminos distintos que deben coincidir.
              # ⛔ AQUÍ NO HAY CRUCE CONTRA EL PREFLIGHT, Y NO ES UN OLVIDO: este job es la fase 2
              # por `workflow_dispatch` y NO depende del preflight — no hay output validado que
              # consultar. El cruce equivalente lo hace cosign más abajo, y es más fuerte que
              # una comparación en shell: `--certificate-github-workflow-repository
              # "${GITHUB_REPOSITORY}"` exige que la reclamación del CERTIFICADO nombre al
              # repositorio que corre, así que un ancla construida para otro repositorio no
              # podría satisfacerse ni aunque pasara esta gramática.
          case "${CERT_IDENTITY_REGEXP}" in
            *"/${repo_rx}/"*'workflows/'*) ;;
            *) echo "ERROR: OLIVARES_CERT_IDENTITY must pin the repository AND the workflow path; got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
          # Anchored and repo-pinned is not enough on its own: '^…/workflows/.*$'
          # satisfies both while still matching ANY workflow on ANY ref, which is
          # the same over-broad identity the anchoring is meant to prevent. Refuse
          # a wildcard in the workflow-path segment so the override must name it.
          case "${CERT_IDENTITY_REGEXP##*workflows/}" in
            *'.*'*|*'.+'*) echo "ERROR: OLIVARES_CERT_IDENTITY must not wildcard the workflow path (no '.*'/'.+' after workflows/); got '${CERT_IDENTITY_REGEXP}'" >&2; exit 1;;
          esac
          bash scripts/cosign-verified.sh verify-blob \
            --certificate ota-dist/checksums.txt.pem \
            --signature ota-dist/checksums.txt.sig \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            ota-dist/checksums.txt
          echo "checksums.txt is the one this repository's release workflow signed."

          # --- Y LOS BYTES DEL MANIFIESTO, atados al mismo pipeline -------------------
          # ⛔ AQUÍ, NO EN EL PASO DE FIRMA, y por dos razones. La mecánica: el ancla y el
          # emisor se derivan en ESTE paso, así que consumirlos en otro los dejaría vacíos —
          # lo intenté y creé ese consumidor huérfano, el mismo defecto que acababa de
          # arreglar unas líneas más abajo. La de orden: este paso ES el que verifica la
          # evidencia, y el manifiesto es evidencia; firmar viene después, cuando ya no queda
          # nada por comprobar.
          #
          # QUÉ CIERRA. `--checksums` ata los ARTEFACTOS del manifiesto, pero no `expires`,
          # `released_at`, `min_version`, `rollout`, `security`/`advisories`, `notes` ni
          # `channel`. A esos siete los ataba la lectura humana de la ceremonia — el bloque
          # «READ EVERY LINE BEFORE SIGNING», cuyo propio verificador advierte que «OK: means
          # plausible, not intended» —, y la orden 37 retira a ese humano. `CheckPolicy` rehúsa
          # lo imposible; no distingue lo plausible de lo intencionado.
          #
          # La sustitución no es restaurar la lectura: es ATAR LOS BYTES. Verificada la firma
          # que la fase 1 puso sobre ESTOS bytes, la política pasa a ser la salida determinista
          # del pipeline en vez de la elección de quien pueda reescribir un asset de borrador.
          bash scripts/cosign-verified.sh verify-blob \
            --certificate ota-dist/stable-manifest.json.pipeline.pem \
            --signature ota-dist/stable-manifest.json.pipeline.sig \
            --certificate-identity-regexp "${CERT_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${CERT_OIDC_ISSUER}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            ota-dist/stable-manifest.json
          echo "stable-manifest.json are the bytes this repository's phase 1 produced."

      - name: sign the OTA manifest in-job and bind it to the signed release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # The OTA key must be an environment secret available only after protected
          # approval.
          OTA_PRIVATE_KEY: ${{ secrets.OLIVARES_OTA_PRIVATE_KEY }}
          OLIVARES_LICENSE_PUBKEY: ${{ vars.OLIVARES_LICENSE_PUBKEY }}
          OLIVARES_OTA_PUBKEY: ${{ vars.OLIVARES_OTA_PUBKEY }}
        run: |
          set -euo pipefail
          sh scripts/check-release-pubkey.sh
          version="${RELEASE_TAG}"


          # --- La firma se produce AQUÍ (orden 37) -----------------------------------
          # ⛔ LA CLAVE NO PASA POR LA LÍNEA DE MANDATO. `--sign-key` acepta `@ruta` y es la
          # forma que se usa: un valor en argv es visible en la tabla de procesos del runner
          # y acaba en cualquier traza que imprima el mandato. `umask 077` antes de crearlo,
          # y se borra en cuanto se usa — con `trap`, para que también desaparezca si algo
          # de en medio falla.
          [ -n "${OTA_PRIVATE_KEY:-}" ] || {
            echo "::error::OLIVARES_OTA_PRIVATE_KEY is not set on the ota-release-ceremony environment; phase 2 cannot sign" >&2
            exit 1; }
          echo "::add-mask::${OTA_PRIVATE_KEY}"
          keyfile="${RUNNER_TEMP}/ota-signing.key"
          ( umask 077; printf '%s' "${OTA_PRIVATE_KEY}" > "$keyfile" )
          trap 'rm -f "$keyfile"' EXIT

          # `--checksums` NO es opcional aquí: ata el manifiesto a los digests del
          # checksums.txt que este mismo job acaba de verificar con cosign unas líneas más
          # arriba. Sin ese cruce se firmaría JSON bien formado que podría describir OTROS
          # bytes — exactamente la ventana que el paso anterior existe para cerrar.
          go run ./cmd/olivares release sign-manifest \
            --manifest ota-dist/stable-manifest.json \
            --checksums ota-dist/checksums.txt \
            --sign-key "@${keyfile}" \
            --out ota-dist/stable-manifest.json.sig
          rm -f "$keyfile"
          trap - EXIT

          # --- Break the circular bootstrap ------------------------------------------
          # Everything below extracts and RUNS the binary out of the published archive
          # and treats what it prints as verification. That is only meaningful if the
          # archive was bound to the cosign-verified checksums.txt FIRST, by a tool
          # that shares no code with it: the fingerprints this job greps for are PUBLIC
          # repo variables (docs/RELEASE-VERIFICATION.md), so a substituted archive can
          # print every expected value, print `OK:` and exit 0. sha256sum + awk, before
          # the tar is opened, is what makes the rest of this job non-vacuous.
          bash scripts/verify-archive-digest.sh ota-dist/checksums.txt \
            "ota-dist/olivares_${version}_linux_amd64.tar.gz"

          # The digest/policy verdict itself comes from the CHECKOUT, not from the
          # artifact under test — `go run` at the release tag, with the public OTA
          # anchor supplied explicitly (a `go run` build embeds none). If this and the
          # shipped-binary run below ever disagree, the artifact is the suspect.
          go run ./cmd/olivares release verify-manifest \
            --manifest ota-dist/stable-manifest.json \
            --sig ota-dist/stable-manifest.json.sig \
            --pubkey "${OLIVARES_OTA_PUBKEY}" \
            --checksums ota-dist/checksums.txt \
            --dir ota-dist \
            --expect-channel stable --expect-version "${version}"

          mkdir -p ota-dist/community ota-dist/bundle
          # ⛔ SYMLINK CONTRACT (INT-22, M79-M81). What follows extracts an entry from a
          # downloaded archive, chmods it and RUNS it. tar happily creates a symlink, and a
          # crafted archive whose `olivares` member is a link — to /usr/bin/env, to a path
          # outside the extraction dir, to anything — turns `ota-dist/community/olivares`
          # into a name that executes something else entirely. The verification above proves
          # the ARCHIVE's bytes; it says nothing about the SHAPE of what comes out.
          #
          # Refused BEFORE extraction by reading the member list, and re-checked AFTER on the
          # file that actually landed. Listing alone is not enough — it describes what tar
          # says it will do, not what it did — and the post-check alone is not enough either,
          # because by then the link exists on disk.
          members="$(tar -tzf "ota-dist/olivares_${version}_linux_amd64.tar.gz")" || {
            echo "ERROR: could not list the archive members; nothing was extracted." >&2
            exit 1
          }
          bad="$(tar -tvzf "ota-dist/olivares_${version}_linux_amd64.tar.gz" | grep -E '^[hl]' || true)"
          if [ -n "${bad}" ]; then
            echo "ERROR: the published archive contains link entries:" >&2
            printf '%s\n' "${bad}" >&2
            echo "A release archive carries regular files only. Nothing was extracted." >&2
            exit 1
          fi
          case "${members}" in
          *..*) echo "ERROR: an archive member contains '..'; refusing to extract." >&2; exit 1 ;;
          /*) echo "ERROR: an archive member is an absolute path; refusing to extract." >&2; exit 1 ;;
          esac
          tar -xzf "ota-dist/olivares_${version}_linux_amd64.tar.gz" \
            -C ota-dist/community olivares
          # AFTER the fact, on the thing that exists: -L follows a link, -h does not, so a
          # symlink is the one case where these two disagree. If they disagree, what landed
          # is not a regular file and must not be chmod-ed or run.
          if [ -L ota-dist/community/olivares ] || [ ! -f ota-dist/community/olivares ]; then
            echo "ERROR: the extracted olivares is not a regular file." >&2
            ls -l ota-dist/community/olivares >&2 || true
            echo "Nothing has been chmod-ed or executed." >&2
            exit 1
          fi
          chmod 0755 ota-dist/community/olivares
          cp ota-dist/stable-manifest.json ota-dist/bundle/manifest.json
          cp ota-dist/stable-manifest.json.sig ota-dist/bundle/manifest.json.sig

          license_fp="$(printf '%s' "${OLIVARES_LICENSE_PUBKEY}" | base64 -d | sha256sum | cut -c1-8)"
          ota_fp="$(printf '%s' "${OLIVARES_OTA_PUBKEY}" | base64 -d | sha256sum | cut -c1-8)"
          version_out="$(ota-dist/community/olivares version)"
          grep -F "license-key=release/${license_fp}" <<<"${version_out}"
          grep -F "ota-key=release/${ota_fp}" <<<"${version_out}"
          # A binary built around the anchor gate (direct -ldflags) can embed ONE key in
          # both trust domains; it says so on stderr. Never ship such an artifact.
          version_err="$(ota-dist/community/olivares version 2>&1 >/dev/null || true)"
          if grep -q "SAME key" <<<"${version_err}"; then
            echo "ERROR: the shipped binary reuses one key across the licence and OTA trust domains:" >&2
            echo "${version_err}" >&2
            exit 1
          fi

          # THE proof, run by the SHIPPED community binary with NO --pubkey override.
          # The archive it came out of was bound to checksums.txt above, so this run
          # adds what the checkout cannot: that the EMBEDDED client-side anchor — the
          # one every user's binary carries — accepts these exact published bytes.
          #   1. the off-box signature verifies under the binary's own embedded OTA anchor;
          #   2. channel/version are the ones being released;
          #   3. the manifest carries a freshness bound and is not already stale;
          #   4. its POLICY (expires window, min_version, rollout, security/advisories,
          #      notes) is within plausibility bounds — the fields checksums.txt does
          #      NOT bind and which alone can block or suppress every upgrade;
          #   5. EVERY manifest digest equals the cosign-verified checksums.txt entry,
          #      and each filename is the archive that platform must carry (not the
          #      FIPS variant, not another platform's);
          #   6. EVERY published archive is re-hashed and bound to that digest.
          # Steps 5-6 are the ones `upgrade --check` can never give us here: with a
          # manifest at the SAME version as the binary, upgrade returns at
          # plan.IsUpToDate() long before VerifyArtifactSHA256, so it proves nothing
          # about digests. verify-manifest has no version-comparison shortcut.
          ota-dist/community/olivares release verify-manifest \
            --manifest ota-dist/stable-manifest.json \
            --sig ota-dist/stable-manifest.json.sig \
            --checksums ota-dist/checksums.txt \
            --dir ota-dist \
            --expect-channel stable --expect-version "${version}"

          # Belt and braces: exercise the REAL updater entry point too. This one is
          # about the upgrade code path (bundle discovery, VerifyManifest, planning),
          # NOT about digests — see above.
          ota-dist/community/olivares upgrade --bundle ota-dist/bundle --check \
            --target ota-dist/community/olivares --data-dir ota-dist/data \
            --os linux --arch amd64
      - name: attach the verified OTA pair, then verify and PUBLISH the complete candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          # The finalizer uses the public OTA anchor and the profile's latest-pointer
          # policy.
          OLIVARES_OTA_PUBKEY: ${{ vars.OLIVARES_OTA_PUBKEY }}
          OLIVARES_RELEASE_PROFILE: ${{ vars.OLIVARES_RELEASE_PROFILE }}
          OLIVARES_PREPROD_MAKE_LATEST: ${{ vars.OLIVARES_PREPROD_MAKE_LATEST }}
        run: |
          set -euo pipefail

          # ⛔ THE AUTHORIZATION IS THE TAG'S OWN DECLARATION, NOT THE DRAFT'S ASSET LIST.
          #
          # This gate used to rest entirely on `gh release view`, and a GET is a SNAPSHOT of a
          # MUTABLE draft — never a durable attestation about it. Reproduced against the real
          # block with a hermetic state server: the response is formed WITHOUT the security
          # manifest, a writer outside this workflow uploads it (the `concurrency:` key at the
          # top serializes the two phases of ONE release, so the in-workflow interleaving is
          # excluded; another actor with contents:write is not), `gh` then
          # returns the older body, and the ceremony finishes `rc=0` while the draft already
          # carries security bytes nothing verified. Measured: `block_rc=0
          # remote_security_manifest=present` (the model re-audit, 2026-08-09, P1-01).
          #
          # No second read fixes that — a later GET is just a second snapshot, and two
          # snapshots that disagree cannot decide anything. What CAN decide is a fact that
          # does not move: `release/advisories/<version>.txt` in THIS checkout, which is the
          # tagged commit itself (`ref: inputs.release_tag` above). That file is what made
          # phase 1b produce a security manifest in the first place, so asking it is asking
          # the same question one layer earlier, where the answer is immutable.
          #

          # ⛔ THE COMMIT IS NOT THE BYTES. Matching HEAD, the tag and an OID proves WHICH
          # commit was checked out; it says nothing about what is on disk NOW. Eight `uses:`
          # steps run before this one in this job — setup-node, pnpm/action-setup, syft,
          # cosign-installer, three docker actions, goreleaser — and any of them executes code
          # in this workspace. A custom action can rewrite scripts/release-ota-channel.sh, or
          # the verifier it will run, WITHOUT touching HEAD: every OID check still passes and
          # the release rule is no longer the reviewed one.
          #
          # So the tree is checked against its commit HERE, immediately before it is read,
          # instead of being trusted from the checkout onwards. `git status --porcelain`
          # covers the three ways it can differ — staged in the index, modified in the working
          # tree, and untracked additions — and any of them is a tree that is not the release.
          # ⛔ THE TOOL IS PART OF THE CONTROL. The byte check below asks `git` what changed,
          # and GitHub documents that an earlier action can prepend a directory to PATH for the
          # rest of the job by writing to GITHUB_PATH. A shim that answers `status --porcelain`
          # with silence and delegates everything else keeps every OID identical and every
          # clean-direction case green, while modified, staged and untracked bytes all sail
          # through. Measured against these exact blocks: producer 20/24, ceremony 59/61
          # (the model repair audit, 2026-08-10, P1-02).
          #
          # So the tools are named by ABSOLUTE PATH instead of being resolved through PATH, and
          # a `git` that PATH resolves elsewhere is itself evidence that something ran before
          # this step: it refuses rather than quietly using the trusted copy.
          # ABSOLUTE, WITH NO OVERRIDE. This was briefly `${OLIVARES_TRUSTED_BIN:-/usr/bin}`
          # "so the battery can point at stubs", and that is not a test seam: an earlier action
          # writes OLIVARES_TRUSTED_BIN through GITHUB_ENV and owns git, gh and sha256sum for
          # every guard in this job. The harness mutates a COPY of this workflow instead; a
          # control must not be configurable by the thing it guards against.
          TRUSTED_BIN="/usr/bin"
          GIT_BIN="${TRUSTED_BIN}/git"
          [ -x "${GIT_BIN}" ] || { echo "ERROR: no trusted git at ${GIT_BIN}" >&2; exit 1; }
          path_git="$(command -v git || true)"
          if [ "${path_git}" != "${GIT_BIN}" ]; then
            echo "ERROR: PATH resolves git to ${path_git:-<none>}, not ${GIT_BIN}." >&2
            echo "Something earlier in this job put another git ahead of it, so the byte check" >&2
            echo "would be asking the wrong tool. Nothing was produced or uploaded." >&2
            exit 1
          fi
          # WHAT THIS JOB IS ALLOWED TO HAVE CREATED, NAMED HERE. The positive flow writes
          # into the workspace before these guards run, and the first version of this check
          # denied its own release for it: phase 1 writes release-commit.txt at the root and
          # the producer answered `?? release-commit.txt`; phase 2 downloads into ota-dist/ and
          # the ceremony answered `?? ota-dist/`. Both refused every legitimate release
          # (the model, #638@1fc91ed8, measured on the real .gitignore).
          #
          # The fix is NOT a .gitignore rule. `git status --porcelain` stops reporting ignored
          # paths at all, so anything dropped inside an ignored directory becomes invisible to
          # this control, and a repo-wide ignore line would silently become load-bearing for a
          # release guard — remove it and the denial comes back. The permitted set is declared
          # HERE, beside the check it qualifies, and it admits ONLY untracked paths: a modified
          # or staged TRACKED file never matches, which is the tampering this exists to catch.
          #
          # `-uall` because untracked DIRECTORIES are otherwise collapsed into one entry, and a
          # single `?? ota-dist/` would then cover any file placed inside it.
          status_raw="$("${GIT_BIN}" status --porcelain -uall)" || {
            echo "ERROR: could not read the workspace state (signing ceremony)." >&2
            exit 1
          }
          dirty=""
          while IFS= read -r st || [ -n "${st}" ]; do
            [ -n "${st}" ] || continue
            case "${st}" in
            '?? ota-dist/'*) continue ;;
            '?? ota-staging/'*) continue ;;
            esac
            dirty="${dirty}${st}"$'\n'
          done <<<"${status_raw}"
          if [ -n "${dirty}" ]; then
            echo "ERROR: the workspace no longer matches the commit for ${RELEASE_TAG} (signing ceremony)." >&2
            printf '%s\n' "${dirty}" >&2
            echo "Something wrote to the checkout after it was made. The release rule and the" >&2
            echo "verifier are read from this tree, so a modified tree is not this release." >&2
            exit 1
          fi

          # Same classifier as the producer, so the two cannot drift apart.
          version="${RELEASE_TAG}"
          [ -n "${version}" ] || { echo "ERROR: empty version from ${RELEASE_TAG}" >&2; exit 1; }
          set +e
          declaration="$(bash scripts/release-ota-channel.sh "${version}")"
          decl_rc=$?
          set -e
          if [ "${decl_rc}" -ne 0 ]; then
            echo "ERROR: the OTA channel gate refused for ${version}: ${declaration}" >&2
            echo "A ceremony that cannot tell whether this is a security release must not finish it." >&2
            exit 1
          fi
          if [ "${declaration}" != "${declaration#*$'\n'}" ]; then
            echo "ERROR: the OTA channel gate emitted more than one line for ${version}" >&2
            exit 1
          fi
          case "${declaration}" in
          *$'\t'*) ;;
          *) echo "ERROR: the OTA channel gate emitted no TAB-separated detail: ${declaration}" >&2; exit 1 ;;
          esac
          case "${declaration%%$'\t'*}" in
          none) ;;
          security)
            # REFUSED BEFORE THE DRAFT IS TOUCHED. The upload below is a --clobber, so
            # refusing afterwards would already have rewritten the stable pair on a release
            # this ceremony cannot complete.
            echo "ERROR: ${RELEASE_TAG} DECLARED a security release: ${declaration#*$'\t'}" >&2
            echo "This ceremony signs the stable channel only, so it cannot complete a security" >&2
            echo "release: the security manifest would go out unsigned, and every conforming" >&2
            echo "client rejects it. Cryptographic verification of that channel is #644." >&2
            echo "Nothing was uploaded. Do not publish this draft." >&2
            exit 1
            ;;
          *)
            echo "ERROR: unknown verdict from the OTA channel gate: ${declaration}" >&2
            exit 1
            ;;
          esac

          # ⛔ THE SAME OBJECT AS PHASE 1, NOT MERELY THE SAME NAME. A fully qualified
          # `refs/tags/<tag>` fixes the NAMESPACE; it does not fix the OBJECT. A tag can be
          # moved between the run that built the draft and the ceremony that completes it, and
          # the contrast demonstrated exactly that on the same qualified ref:
          #
          #   qualified_ref=refs/tags/v26.8.0
          #   phase1=1866293202ea…  phase2=5a9295bdbe…  moved=yes
          #
          # So the dispatch NAMES the commit phase 1 ran on, and this step refuses unless the
          # tag still resolves to it AND the checkout is that same commit. Everything this
          # ceremony treats as durable — above all the advisories declaration that authorizes
          # it — then comes from an object identified by digest, not by a movable label.
          [ -n "${RELEASE_COMMIT}" ] || { echo "ERROR: release_commit is empty" >&2; exit 1; }
          case "${RELEASE_COMMIT}" in
          *[!0-9a-f]* | "") echo "ERROR: release_commit is not lowercase hex: ${RELEASE_COMMIT}" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_COMMIT}" -eq 40 ] || { echo "ERROR: release_commit must be a full 40-hex OID" >&2; exit 1; }
          # ⛔ AND THE INPUT IS NOT EVIDENCE. Comparing the input against the tag and the
          # checkout compares three values that all move together: moving the tag, moving the
          # checkout and passing the matching OID satisfied every comparison, and phase 2
          # completed over artifacts that may belong to the earlier run (the model repair
          # audit, 2026-08-10, P1-01 — measured rc=0).
          #
          # So the authority is phase 1's own record: release-commit.txt, written by
          # GoReleaser's own `before` hook and declared in BOTH `checksum.extra_files` — which
          # puts its digest inside the checksums.txt this job has already cosign-verified — and
          # `release.extra_files`, which is what uploads it to the draft at all. Neither key
          # implies the other in v2.17.0, and the comment that used to sit here named only the
          # first while the config carried neither (the model, 2026-08-15, P0-A).
          # The input, the tag and the checkout must all equal THAT.
          evidence="ota-dist/release-commit.txt"
          [ -f "${evidence}" ] || {
            echo "ERROR: ${evidence} is missing from the draft; phase 1 published no commit evidence." >&2
            echo "Without it the commit would only be this dispatch's own claim. Nothing was uploaded." >&2
            exit 1
          }
          # sha256sum by absolute path, and its output split in the shell: `cut` would be one
          # more PATH lookup inside a control whose whole point is not to depend on one.
          ev_sum="$("${TRUSTED_BIN}/sha256sum" "${evidence}" 2>/dev/null)" || ev_sum=""
          ev_sum="${ev_sum%% *}"
          [ -n "${ev_sum}" ] || { echo "ERROR: could not digest ${evidence}" >&2; exit 1; }
          # The digest must be the one checksums.txt records, and checksums.txt is the file
          # cosign verified earlier in this job. That is the link that makes it evidence.
          # Matched in the shell, for the same reason the asset names are: no binary that can
          # be missing or shimmed, no pattern that can be interpreted. The checksums line is
          # `<sha256>  <name>`, compared whole.
          ev_bound=0
          while IFS= read -r _cs_line || [ -n "${_cs_line}" ]; do
            [ "${_cs_line%$'\r'}" = "${ev_sum}  release-commit.txt" ] && ev_bound=1
          done <ota-dist/checksums.txt
          if [ "${ev_bound}" -ne 1 ]; then
            echo "ERROR: ${evidence} does not match its entry in the cosign-verified checksums." >&2
            echo "Its digest: ${ev_sum}" >&2
            echo "The commit evidence was replaced after phase 1 signed the checksum set." >&2
            exit 1
          fi
          IFS= read -r phase1_oid <"${evidence}" || true
          phase1_oid="${phase1_oid%$'\r'}"
          case "${phase1_oid}" in
          *[!0-9a-f]* | "") echo "ERROR: phase-1 evidence is not a bare OID: ${phase1_oid}" >&2; exit 1 ;;
          esac
          [ "${#phase1_oid}" -eq 40 ] || { echo "ERROR: phase-1 evidence is not a full OID" >&2; exit 1; }

          tag_oid="$("${GIT_BIN}" rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_oid="$("${GIT_BIN}" rev-parse --verify "HEAD^{commit}")"
          if [ "${phase1_oid}" != "${RELEASE_COMMIT}" ]; then
            echo "ERROR: the dispatched commit is not the one phase 1 recorded." >&2
            echo "  phase 1 built  : ${phase1_oid}" >&2
            echo "  dispatched for : ${RELEASE_COMMIT}" >&2
            echo "A tag and an input that moved together cannot impersonate phase 1." >&2
            exit 1
          fi
          if [ "${tag_oid}" != "${phase1_oid}" ] || [ "${head_oid}" != "${phase1_oid}" ]; then
            echo "ERROR: ${RELEASE_TAG} does not resolve to the commit this ceremony was dispatched for." >&2
            echo "  phase 1 built  : ${phase1_oid}" >&2
            echo "  tag resolves to: ${tag_oid}" >&2
            echo "  checkout is    : ${head_oid}" >&2
            echo "The tag moved, or the wrong commit was named. Nothing was uploaded." >&2
            exit 1
          fi

          # ⛔ THE CUSTODY CEREMONY CONTINUES IN THE SAME WINDOW, IN A VERSIONED SCRIPT.
          # Everything from here on — the single draft read, the draft/immutable refusals, the
          # staging, the clobbering upload, the exact-snapshot rollback and the deny-closed
          # verdict on a security manifest — lives in scripts/release-attach-stable-pair.sh.
          #
          # It moved because this `run:` measured 21,600 characters against GitHub's documented
          # 21,000-character limit for a single `run:`, so a legitimate release could not
          # execute this step at all (the model, 2026-08-15, P0-B, NO-LAND).
          #
          # WHAT DID NOT MOVE IS THE GUARANTEE. The `git status` above, the classifier call
          # that reads the release rule and the binding to phase 1's evidence are all still in
          # THIS one scalar, so no step — and therefore no `uses:` — can be scheduled between
          # the check and the consumption. The script below is invoked from inside that same
          # verified window, exactly as scripts/release-ota-channel.sh already is: it is
          # tracked code, and the tree it is read from was checked a few lines above. Cutting
          # the block at the check instead would have destroyed the property the check exists
          # for. `set -e` is in force, so its refusal is this step's refusal.
          bash scripts/release-attach-stable-pair.sh "${RELEASE_TAG}"

          # ⛔ AND THE CEREMONY FINISHES THE JOB IT STARTED, IN THIS SAME WINDOW.
          #
          # Until this line, a successful phase 2 left a DRAFT with a verified pair on it and
          # the last step was a human pressing Publish in the GitHub UI. That is not a gap in
          # discipline, it is a gap no workflow can close from outside: QA2334 measured the
          # result on the live v26.8.0 stable channel — manifest 200, REQUIRED `.sig` 404,
          # the product's own `upgrade --check` failing.
          #
          # The finalizer runs HERE, after the attachment succeeded and inside the same
          # `run:` scalar, so no step boundary — and therefore no `uses:` — can be scheduled
          # between the `git status` above and the code that publishes. It re-resolves the
          # release by immutable identity, downloads the COMPLETE remote candidate by exact
          # asset id into its own directory, re-verifies source, run, signatures, the whole
          # derived inventory and both OTA anchors, and only then PATCHes the retained
          # release id with draft:false. `set -e` is in force, so its refusal is this step's
          # refusal — and its PUBLICATION_UNKNOWN (exit 3) is a red job that has told the
          # truth rather than a rollback it cannot perform.
          bash scripts/release-finalize-stable.sh "${RELEASE_TAG}" "${RELEASE_COMMIT}"
