        if: always()
        timeout-minutes: 2
        env:
          PG_PRIMARY_ID: ${{ job.services.postgres.id }}
          PG_OTHER_ID: ${{ job.services.postgres_other.id }}
        run: |
          OUT="$RUNNER_TEMP/repro/$SEL"
          mkdir -p "$OUT"
          docker logs --details "$PG_PRIMARY_ID" > "$OUT/postgres-primary.log" 2>&1 || echo "COULD NOT LOOK" >> "$OUT/postgres-primary.log"
          docker logs --details "$PG_OTHER_ID" > "$OUT/postgres-other.log" 2>&1 || echo "COULD NOT LOOK" >> "$OUT/postgres-other.log"
      - name: retain every trial's stream, exit, results and the server logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainline-20b3-repro-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro/a_history_rollback/
          retention-days: 7
