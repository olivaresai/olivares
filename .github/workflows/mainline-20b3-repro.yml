            tee "$OUT/roles.txt"
          case "$(cat "$OUT/postgres-version.txt")" in 16*) : ;; *) fail "the primary server is not PostgreSQL 16" ;; esac
          [ "$(awk '$1 == "olivares_app" {print $2, $3, $4, $5}' "$OUT/roles.txt")" = "f f f f" ] || fail "the application role is privileged"
          [ "$(awk '$1 == "olivares_admin" {print $2, $3, $4, $5}' "$OUT/roles.txt")" = "f t f f" ] || fail "the admin role is not BYPASSRLS-only"
      - name: record the toolchain
        id: toolchain
        timeout-minutes: 2
        run: |
          eval "$REPRO_LIB"
          {
            go version
            go env GOVERSION GOOS GOARCH GOFLAGS CGO_ENABLED GOCACHE
            printf 'nproc %s\n' "$(nproc)"
            printf 'cgroup memory.max %s\n' "$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unreadable)"
            printf 'TMPDIR %s\n' "${TMPDIR:-unset}"
            jq --version
            psql --version
            timeout --version | head -n1
          } 2>&1 | tee "$OUT/toolchain.txt"
      - name: b · build the -race test binary once (a build failure is an inability for every trial)
        id: build
        timeout-minutes: 30
        run: |
          eval "$REPRO_LIB"
          mkdir -p "$RUNNER_TEMP/build"
          run_logged "$SEL.build" "$GITHUB_WORKSPACE/core" go test -c -race -o "$RUNNER_TEMP/build/$SEL.test" ./internal/store/sqlstore
      - name: b · trials of the complete parent (every trial kept; judged inline, inability first)
        id: trials
        timeout-minutes: 100
        env:
          # The largest per-trial clock: the whole budget at its 90-minute maximum. The workflow
          # timeout gate reads this static value; each trial is given only the budget that remains.
          TRIAL_CLOCK: 5400s
        run: |
          eval "$REPRO_LIB"
          bounded() { local TRIAL_CLOCK="${1}s"; shift; timeout -k 30s "$TRIAL_CLOCK" "$@"; }
          trials_loop "$GITHUB_WORKSPACE/core" \
            bash ../scripts/with-pg-env.sh go test -race -count=1 -p 1 -timeout 90m -v -p 1 -run "$RUN_PATTERN" -json ./internal/store/sqlstore
      - name: b · rate and completeness (describes the instrument, not the product)
        if: always()
        timeout-minutes: 3
        env:
          SETUP_OUTCOMES: >-
            input=${{ steps.input.outcome }} identity=${{ steps.identity.outcome }} caches=${{ steps.caches.outcome }}
            setup-go=${{ steps.setup-go.outcome }} tmpdir=${{ steps.tmpdir.outcome }}
            pg-port=${{ steps.pg-port.outcome }} pg-roles=${{ steps.pg-roles.outcome }}
            posture=${{ steps.posture.outcome }} toolchain=${{ steps.toolchain.outcome }}
            build=${{ steps.build.outcome }} trials=${{ steps.trials.outcome }}
        run: |
          eval "$REPRO_LIB"
          finalize "$SETUP_OUTCOMES"
      - name: keep both PostgreSQL server logs
        if: always()
        timeout-minutes: 2
        env:
          PG_PRIMARY_ID: ${{ job.services.postgres.id }}
          PG_OTHER_ID: ${{ job.services.postgres_other.id }}
        run: |
          OUT="$RUNNER_TEMP/repro/$SEL"
          mkdir -p "$OUT"
          docker logs --details "$PG_PRIMARY_ID" > "$OUT/postgres-primary.log" 2>&1 || echo "COULD NOT LOOK" >> "$OUT/postgres-primary.log"
          docker logs --details "$PG_OTHER_ID" > "$OUT/postgres-other.log" 2>&1 || echo "COULD NOT LOOK" >> "$OUT/postgres-other.log"
      - name: retain every trial's stream, exit, results and the server logs
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mainline-20b3-repro-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repro/b_holder_loss/
          retention-days: 7
          if-no-files-found: error
