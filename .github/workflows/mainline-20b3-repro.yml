      # The complete named parent: its seven subtests run in source order on one shared estate.
      RUN_PATTERN: '^TestCommunicationChannelHistoryWritesHTTPPostgres$'
      PARENT: TestCommunicationChannelHistoryWritesHTTPPostgres
      LEAF: TestCommunicationChannelHistoryWritesHTTPPostgres/a_failed_mutation_leaves_no_partial_act
      # Quoted from the bound source (the sha is pinned, so these lines cannot drift).
      NAMED_RE: 'communicationchannelhistorywrites_http_test\.go:677: a committed grant at budget [^ ]+ moved the census by '
      WITNESS_RE: 'communicationchannelhistorywrites_http_test\.go:688: K3_WRITER_ROLLBACK[|]interrupted=[0-9]+[|]committed=[0-9]+'
      # The only log lines the source prints in the parent (:242, the posture of helper :200) and in the
      # target leaf (:688, the witness). Any other file:line line there is another assertion.
      ALLOWED_LOG_RE: 'communicationchannelhistorywrites_http_test\.go:(242: K3_HTTP_PG_POSTURE|688: K3_WRITER_ROLLBACK)[|]'
      # Every result name the parent produces at the bound source: the parent and its seven t.Run
      # subtests (:266, :312, :386, :419, :447, :451, :455), in Go's rewritten form. None nests further.
      EXPECTED_SET: |-
        TestCommunicationChannelHistoryWritesHTTPPostgres
        TestCommunicationChannelHistoryWritesHTTPPostgres/a_configuration_change_no_longer_depends_on_the_grant_history
        TestCommunicationChannelHistoryWritesHTTPPostgres/revoke_the_exact_deep_generation_and_issue_its_successor
        TestCommunicationChannelHistoryWritesHTTPPostgres/revoking_an_old_generation_never_retires_its_successor
        TestCommunicationChannelHistoryWritesHTTPPostgres/cross-tenant_and_cross-workspace_mutations_reach_nothing
        TestCommunicationChannelHistoryWritesHTTPPostgres/concurrent_mutations_on_one_ETag_leave_exactly_one_act
        TestCommunicationChannelHistoryWritesHTTPPostgres/authority_is_re-established_at_the_refreshed_instant
        TestCommunicationChannelHistoryWritesHTTPPostgres/a_failed_mutation_leaves_no_partial_act
    steps:
      - name: the input names the bound source (any other sha is refused before checkout)
        id: input
        timeout-minutes: 1
        run: |
          eval "$REPRO_LIB"
          validate_inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: 20b3d0b1c632e8d4bef7b4ce15f4960293cc6e86
          persist-credentials: false
          fetch-depth: 0
      - name: the checkout is the bound source, clean, with the quoted test-file blobs
        id: identity
        timeout-minutes: 2
        env:
          RUNNER_PLACEMENT: ${{ runner.environment }}
        run: |
          eval "$REPRO_LIB"
          identity
      - name: Go caches under RUNNER_TEMP (as in the job that went red)
        id: caches
        timeout-minutes: 1
        run: |
