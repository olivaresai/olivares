[build-system]
# >=77: first release supporting the PEP 639 license expression string and
# license-files used below — an older floor would accept builds that fail.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olivares-client"
version = "0.1.0"
description = "First-party Python client for the Olivares AI control plane API (v1)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Standard library only, by design (the dependency surface is part of the
# threat model); keep it that way.
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://olivares.ai"
Documentation = "https://olivares.ai/docs"
StabilityPolicy = "https://olivares.ai/docs"

[tool.setuptools.packages.find]
where = ["src"]
