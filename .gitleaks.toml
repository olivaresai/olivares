#
# gitleaks configuration for Olivares AI. The CI `secrets` job runs
# `gitleaks detect` against the full history and FAILS the build on any finding.
#
# We extend gitleaks' built-in ruleset (every default rule stays active) and add
# path-scoped exemptions only where a whole class of files cannot hold a real
# secret (generated output, session logs) PLUS exact-value regexes for decoy
# strings that tests must keep recognisable. Production source is NOT
# path-allowlisted — a real secret committed there blocks CI, which is the point.
#
# ⛔ A-04: `_test.go` and `testdata/` are scanned. A real private key in a test
# file is a finding. The previous whole-detector path exemption is gone.
#
# Run locally:  task lint:secrets   (scripts/check-secrets.sh — same scan, but it NAMES what
#               it finds and says whether the commit is part of what you are merging).

[extend]
useDefault = true
#
# ⛔ AQUÍ HUBO UN PUNTERO A `.gitleaksignore`, Y SE RETIRA CON EL FICHERO. La supresión por
# HUELLA (`<commit>:<fichero>:<regla>:<línea>`) **es ciega en el árbol exportado**: la huella cita un
# SHA de NUESTRA historia y el export construye una historia limpia con `git init`, así que los SHA
# son otros y la huella no casa. Medido/adjudicado el 2026-08-29 (CC3 r2 + N, asiento 174 de PLAN
# r4): la primera corrida de `secrets` en preprod y en el público habría salido DIRTY sobre un
# README traducido, con el gate de `.dev` en verde. ⇒ **las supresiones se expresan por
# ruta + regla + razón, nunca por huella de commit.**

# ⛔ FORMATO PLURAL, y el motivo es medido. La entrada de `credential_sha256` de abajo necesita
# `regexTarget = "match"` —el nombre del campo NO está en el secreto capturado—, y ponerlo en
# ESTE bloque le cambiaría el objetivo a todas sus regexes: medido el 2026-08-16 sobre la
# historia completa, eso rompe **72 exenciones existentes** y los hallazgos pasan de 21 a 81+.
# Con el formato plural cada bloque lleva su propio objetivo y éste se queda como estaba.
[[allowlists]]
description = "Test/decoy fixtures, generated build output, and doc prose — none are real secrets."
# Path-scoped exemptions; everything else is scanned.
paths = [
  # ⛔ A-04 (CFG-13, 2026-08-18): `.*_test.go$` and `.*/testdata/.*` used to sit
  # here and exempted the ENTIRE detector. Measured 2026-08-06 (licencias-sweep-2)
  # and re-measured today: the same ephemeral RSA is findings=0 under `_test.go`
  # and findings=1 in a production path. Decoy values those paths used to hide
  # are exact-anchored in the A-04 allowlist below. The canary that the path
  # never again exempts is cases 9-10 of scripts/test-check-secrets.sh.
  '''web/e2e/.*\.(spec|test)\.ts$''', # Playwright e2e fixtures (test login creds)
  '''.*\.gen\.ts$''',           # generated API client (no secrets, large file)
  '''docs-site/dist/.*''',      # Astro/Starlight BUILD OUTPUT (generated HTML; the
                                # generic-api-key rule hits class names / asset hashes,
                                # not secrets). Regenerated by `astro build`; stays in
                                # history even after we stop tracking it.
  '''web/src/.*\.test\.tsx?$''',      # web unit-test fixtures (decoy tokens/creds)
  # Licence-worker unit tests (TypeScript). Same class as the three entries above and added
  # for the same reason, not as a widening: these files carry NO secret. What trips the
  # generic-api-key rule is a variable NAME — `const SIGNING_KEY = VECTORS.private_key_b64`
  # — whose value is read at runtime from core/license/testdata/wireformat_vectors.json.
  # That testdata path is NO LONGER path-exempt (A-04); the vector's exact Secret
  # is in the A-04 regex block. Measured 2026-08-11 on commit 8b3cf6936,
  # where two such lines reddened the secrets leg of every OTHER branch in the repository,
  # because the scan reads full history across every ref in the clone.
  #
  # Deliberately scoped to this test directory rather than to `.*\.test\.ts$` anywhere: a
  # blanket rule would exempt any file someone chooses to name that way, and the point of
  # the three entries above is that each names a place where fixtures live by convention.
  '''commercial/license-worker/test/.*\.test\.ts$''',
  '''cloud/staging/.*''',             # internal staging E2E evidence (test UUIDs/scenario IDs; never ships)
  '''sessions/.*\.md$''',             # internal per-session logs (never ship; export-gate-blocked)
  '''design/launch-video/out/render-manifest\.json$''',  # GENERATED provenance manifest: SHA-256 digests of
                                # every render input and output, and nothing else. generic-api-key fires on
                                # a 64-hex digest the same way it fires on a token. This is the ONE case
                                # where the exact-value convention below cannot be used: the digests change
                                # on every re-render, so an anchored regex would go stale the next time the
                                # reel is rebuilt and hand back the same red. Path-scoped instead, to the
                                # single generated file — design/ never ships, the file is machine-written,
                                # and a credential has no reason to exist in it.
                                # RESIDUAL, stated because path-scoping always has one: a real secret
                                # planted in THIS file would not be seen. Nothing writes it but the render
                                # pipeline, and its content is checked by the manifest gate itself.
]
# Specific NON-SECRET strings the generic-api-key rule mis-flags: slash-joined doc
# prose and package paths, public key fingerprints / image digests, and named constants.
# Matched against the captured secret string (NOT the path), so a real secret in the
# same file is still caught — this is why the pgstore/agentops entries are safe on
# shipping/production files rather than path-allowlisting them.
regexes = [
  # ⛔ CLAVES DE REGISTRO, NO CREDENCIALES. `store.WorkspaceInitializer` tiene un campo llamado
  # `Key` y la regla `generic-api-key` casa por el NOMBRE DEL IDENTIFICADOR, no por la entropia del
  # valor: `Key: "initprobe.a.v1"` le parece una clave de API. Son nombres de inicializador de
  # workspace que el propio test registra y vuelve a buscar, y el campo NO se puede renombrar
  # porque es de la interfaz publica de `store`.
  #
  # PRUEBA de que no son credenciales: el valor no se envia a ningun sitio ni autoriza nada — se
  # usa como CLAVE DE MAPA en el registro (`core/internal/store/sqlstore/workspace_initializer_test.go`,
  # lineas 251, 268 y 294) y el test comprueba precisamente que registrar dos veces la misma falla.
  # Rotarlo no significaria nada: no hay nada que rotar.
  #
  # Bloqueaban el job `secrets` de `mainline-ci` sobre `main` desde el 2026-08-15 (incidencia #1499),
  # con el gate ROJO y por tanto SIN veredicto de secretos para todo lo que aterrizo despues.
  '''^initprobe\.[a-z]+\.v1$''',

  # ⛔ IDEMPOTENCY-KEY, NO SECRETO — y la distincion es del protocolo, no una opinion. Un
  # `Idempotency-Key` es un identificador de PETICION que el cliente elige y envia EN CLARO en una
  # cabecera para que un reintento no duplique el efecto. Publicarlo no autoriza nada: sin el token
  # de la peticion no sirve para nada, y con el token sobra.
  #
  # PRUEBA: en `cmd/olivares/cmd_protocol_binding_test.go` el valor viaja como
  # `r.Header.Get("Idempotency-Key")` (lineas 62 y 99) y como `--idempotency-key` (78 y 114),
  # SIEMPRE acompanado de un `--token` distinto que es el que autoriza. Ademas es un UUIDv7, no
  # material de clave.
  '''^01989d7d-54e1-76ad-8ee4-f2fd4d3d3d84$''',
  # ⛔ DIGEST, NO SECRETO. La evidencia de la barrera D1 registra `credential_sha256`: el SHA-256
  # DE la credencial, que es exactamente lo que hay que guardar EN VEZ de la credencial. La regla
  # generic-api-key ve hex de alta entropía y no distingue un digest de una clave.
  #
  # Medido el 2026-08-15 sin imprimir un solo valor: 12 ocurrencias, 12 de 12 con forma hex de 64.
  # Y los doce se reportaron NOT reachable from HEAD, arrastrados por el clon PERSISTENTE del
  # runner desde otra rama: acusaban a ramas que nunca los llevaron.
  #
  # ESTRECHA A PROPÓSITO, y ésta es la parte que importa: se ancla al NOMBRE DE CAMPO y a la forma
  # hex-64, NO a una ruta. Las exenciones por ruta de este fichero ya dejan el 31,5 % del árbol
  # (3.469 de 11.023) fuera de alcance, y ensancharlo es exactamente cómo se esconde un hallazgo
  # real. Con esta forma, una credencial de VERDAD en ese mismo fichero se sigue cazando.
  # Generalizado al PATRÓN DE CAMPO tras medir: la misma evidencia lleva `request_body_sha256`,
  # idéntica forma. Un campo cuyo nombre TERMINA en `_sha256` y cuyo valor es exactamente hex
  # de 64 es un digest por construcción — no una clave que se pueda usar. Sigue sin ser una
  # exención por ruta: si mañana aparece `api_key` con hex-64 en ese mismo fichero, se caza.
  '''"[a-z0-9_]*_sha256"\s*:\s*"[0-9a-f]{64}"''',
  # ⛔ NOMBRE, NO SECRETO. `generic-api-key` marco
  # `core/internal/store/sqlstore/workspace_initializer_test.go:294`, que es
  #     Key: "initprobe.closed.v1", Initialize: callback,
  # — el NOMBRE de un inicializador de workspace en un test. Lo dispara que el campo se
  # llame `Key:`, no el valor. Entro con la cadena del kernel (B1) y dejo `secrets` en rojo
  # para toda la caja; antes de B1 ese job estaba en verde.
  #
  # NO hay nada que rotar: no es una credencial y no lo ha sido nunca.
  #
  # ESTRECHA POR LA FORMA DEL VALOR, no por la ruta — la misma disciplina que la entrada de
  # arriba, y por la misma razon que ella explica: las exenciones por ruta ya dejan el 31,5 %
  # del arbol fuera de alcance y ensancharlas es como se esconde un hallazgo real.
  #
  # Medido sobre origin/main antes de escribirla: 162 apariciones casan esta forma y las 162
  # son identificadores estructurados —`olivares.commercial.credential.v3`,
  # `eventing.egress.destination.v1`, `olivares.audit.v1`—. Minusculas, punteados, con sufijo
  # de version: entropia cero por construccion. Una clave de VERDAD en ese mismo fichero se
  # sigue cazando, porque no tendria esta forma.
  # ⚠ SIN COMILLAS a proposito: gitleaks casa contra el SECRETO CAPTURADO, no contra la linea.
  # Para `Key: "initprobe.closed.v1"` el Secret es `initprobe.closed.v1` PELADO. La primera
  # version de esta entrada las incluia y NO EXIMIA NADA — verificado CORRIENDO gitleaks, no
  # razonando: 3 hallazgos con la exencion y 3 sin ella, identicos.
  '''^[a-z][a-z0-9]*(\.[a-z0-9]+)+\.v[0-9]+$''',
  '''whsec_d2hzZWNfcG9sYXJfbWF0ZXJpYWw=''',                             # Derivation transcript: base64 of the LITERAL
                                                                        # "whsec_polar_material". PROVEN, not assumed: decoding the
                                                                        # part after the whsec_ prefix yields that placeholder string,
                                                                        # so there is nothing to rotate. generic-api-key fires on its
                                                                        # SHAPE (base64 after a known prefix) — the rule working
                                                                        # correctly on a decoy. Anchored to the EXACT value and not to
                                                                        # an internal design note (not shipped), because that directory is precisely where a
                                                                        # real credential could be pasted by accident: any OTHER
                                                                        # whsec_ in that same file still blocks. Fixed here rather than
                                                                        # on its branch because the scan reads every ref in the clone,
                                                                        # so on a self-hosted runner it reddened the `secrets` leg of
                                                                        # branches that never carried it — measured 2026-08-12 twice,
                                                                        # once against main and once against the commerce PR whose
                                                                        # four required checks it was blocking.
  '''FOCUS/forecasting/budgets''',
  '''health/forensic''',
  '''olivares\.migrate\.v1''',                                          # pgstore advisory-lock name (const migrateLockKey)
  '''31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE''',                       # agentops signing-key FINGERPRINT (public verification material)
  '''395759c1f7449ef4cdef305a42e820f3c766d6090d142634ebdb049f113168b6''', # agentops image/pkg SHA-256 digest (public)
  '''^1f45b2984fe464f551037d23a9a76b3503019e340ab9ca6557332fb30c476663\.?$''', # K2 auth.test binary SHA-256. The same public build-artifact digest is
                                                                        # quoted in the mutation matrix and its independent closure audit;
                                                                        # generic-api-key joins the nearby word "auth" to this opaque digest
                                                                        # and captures the audit sentence's terminal full stop with it.
                                                                        # Exact-value scoping keeps both audit files scanned for every other
                                                                        # secret and preserves the immutable evidence hash.
  '''^subjectKind=$''',                                                 # doc-prose field name in core/auth/delegation.go (delegation verifier):
                                                                        # generic-api-key mis-flags `subjectKind="token"` inside a comment. Not a
                                                                        # secret (a struct field-name assignment); anchored to the exact captured
                                                                        # string, so a real secret in that file is still caught.
  '''^sk-s504-withheld$''',                                             # decoy api_key fixture from the evidence-gate release-anchor tests
                                                                        # (rs_s504_release_*_test.go asserts this value is WITHHELD); also quoted
                                                                        # as literal go-test output in maintainer audit notes kept in history.
                                                                        # Anchored to the exact decoy, so real secrets in those files still block.
  '''^rfq_01JZQAP6C8M4R2T7V9W1X3Y5ZA$''',                               # example ULID in a `"idempotency_key"` field of a JSON wire sample
                                                                        # (the olivares.refund-request.v1 schema) quoted in maintainer audit
                                                                        # notes. generic-api-key fires on the keyword "key" next to a long
                                                                        # opaque token. It is documentation of a wire format, committed in
                                                                        # history, so it recurs on EVERY history scan. Anchored to the exact
                                                                        # sample value rather than path-allowlisting the audit-notes tree —
                                                                        # see the note below on why that tree stays scanned.
  '''^cmd/olivares$''',                                                 # the CLI's own package path. generic-api-key fires on the prose
                                                                        # "…, API handlers, `cmd/olivares`, and `web/`" in maintainer audit
                                                                        # notes — the keyword "API" next to a slashed token. It is a
                                                                        # repository path, committed in history, so the finding recurs on
                                                                        # EVERY history scan. Anchored to the exact path string rather than
                                                                        # path-allowlisting the audit-notes tree, which would stop scanning a
                                                                        # directory where command output is routinely pasted.
  '''^whsec_MDEyMzQ1Njc4OWFiY2RlZg==$''',                               # a webhook-signing FIXTURE whose value decodes, in full, to the
                                                                        # string "0123456789abcdef" — the hexadecimal digits in order. It is
                                                                        # the key of a reproduction pasted into maintainer audit notes that
                                                                        # document how a signature check was verified (padding, clock skew,
                                                                        # tolerance). generic-api-key fires because a `whsec_` prefix sits
                                                                        # beside the keyword "secret". Committed in history, so it recurs on
                                                                        # EVERY history scan. Anchored to the exact decoded-provable value:
                                                                        # a real signing key in the same file still blocks, and so does any
                                                                        # other value carrying the same prefix.
  '''^AbCdEf0123456789xyzXYZ0123$''',                                   # the WITNESS token of the console-log redaction tests. Its literal home is
                                                                        # core/api/log_redaction_test.go (const witnessURLToken): the suite asserts
                                                                        # that this exact value is REDACTED out of /v1/console/logs/stream, so the
                                                                        # value must stay recognisable or the test stops discriminating. It is also
                                                                        # pasted verbatim into the reproduction that documents the leak, inside a
                                                                        # URL query (`?access_token=…`) pointed at a fake host, which is why
                                                                        # generic-api-key fires: the keyword sits beside a long opaque token. It is
                                                                        # committed in history, so it recurs on EVERY history scan and cannot be
                                                                        # cleared by editing the file. Anchored to the exact witness rather than
                                                                        # path-allowlisting an internal design note (not shipped) — the same reasoning as the entries above,
                                                                        # and a real credential in either file still blocks.
  '''^whsec_probeSecret2026$''',                                        # the POLAR_WEBHOOK_SECRET of a LOCAL probe run, pasted verbatim with
                                                                        # its command line into a maintainer audit note (the run drove a
                                                                        # python stub on 127.0.0.1:18080, not a Dodo/Polar endpoint). Provably
                                                                        # not a credential on two independent grounds: the literal spells its
                                                                        # own purpose ("probeSecret"), and the value occurs in exactly ONE
                                                                        # tracked file in the whole tree — no config, no worker binding, no
                                                                        # environment ever carried it. Committed in history, so it recurs on
                                                                        # EVERY history scan. Anchored to the exact value: any OTHER whsec_
                                                                        # in that same file still blocks.
  '''^eyJoIjoic3ViXzBOa094\.\.\.$''',                                   # a download-link token from probe OUTPUT quoted in a maintainer audit
                                                                        # note. It is unusable by construction, which is why it is safe to
                                                                        # anchor: the document TRUNCATES it — the captured string ends in three
                                                                        # literal dots — and its host is `licenses.example`, a domain RFC 2606
                                                                        # reserves so it can never resolve. The visible base64 prefix decodes
                                                                        # to `{"h":"sub_0NkOx` — the opening of a JSON header, not a whole
                                                                        # token. generic-api-key fires on `token=` beside a long opaque
                                                                        # string. Committed in history, so it recurs on EVERY history scan.
                                                                        # Anchored to the exact truncated sample: a COMPLETE token pasted into
                                                                        # the same file would not match this entry and still blocks.
]


# ── A-04 · decoys that the former `*_test.go` / testdata path exemption hid ──
# Working-tree set measured 2026-08-18 after deleting those two paths
# (51 findings → 41 unique Secrets still in HEAD) plus 5 history-only
# Secrets (HEAD scan: 6 findings, 5 unique). One private-key hit was a
# scanner misfire across a Go string concatenation in
# modules/security/redact_export_test.go; current source is split so the
# detector sees no contiguous PEM. The historical capture of that same
# concatenation is allowlisted below as an exact Secret. Every remaining
# value is a fixture, a redaction witness, or a generic-api-key false
# positive (`OLIVARES_DB_MAX_CONNS=20`, `v1.compute.instances.get`,
# `olvOccurredAt=`). Anchored to the EXACT captured Secret so a
# different value in the same file still blocks.
# Residual, stated: a NEW decoy committed under `_test.go` without an entry
# here will redden the gate — that is the point; add the exact value, never
# the path. Canary: scripts/test-check-secrets.sh cases 9-10.
[[allowlists]]
  description = "A-04: exact decoy Secrets formerly hidden by _test.go/testdata path exemptions"
  regexes = [
    '''^AKIAQQQWWWEEERRRTTTY$''',
    '''^AKIAZZZXXXCCCVVVBBBN$''',
    '''^live-test-token$''',
    '''^a1b2c3d4e5f6$''',
    '''^abcdef123456$''',
    '''^s3cr3t-bind-pw$''',
    '''^apikey_live_123$''',
    '''^cn=svc-olivares$''',
    '''^0123456789abcdef$''',
    '''^ABCDEF1234567890$''',
    '''^azhzLXNlY3JldA==$''',
    '''^dG9rZW49czM3Mw==$''',
    '''^dg_ephemeral_123$''',
    '''^correct-key-12345$''',
    '''^ist\.minted\.abc123$''',
    '''^sk-s504-ambiguous$''',
    '''^AbCdEf0123456789xyz$''',
    '''^s3cr3t-never-logged$''',
    '''^API_KEY=THIS_IS_SECRET$''',
    '''^OLIVARES_DB_MAX_CONNS=20$''',
    '''^correct-bearer-key-12345$''',
    '''^v1\.compute\.instances\.get$''',
    '''^v1\.compute\.instances\.insert$''',
    '''^sk-opsgenie-secret-key-123456$''',
    '''^8f742231b10e8888abcd99yyyzzz85a5$''',
    '''^16787ed7-d805-434a-9cec-5e5a3e5c9e4f$''',
    '''^3f2a1c64-8b7d-4e19-9a05-6c8d2e4f7b31$''',
    '''^abcdefgVENDEDSECRETMUSTNOTAPPEAR1234567$''',
    '''^c2VjcmV0LWZvci10ZXN0cy1vbmx5LW5vdC1hLXJlYWwta2V5$''',
    '''^whsec_b2xpdmFyZXMtZG9kby10ZXN0LWtleS0zMmJ5dGVzISE=$''',
    '''^MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC7Zz$''',
    '''^AA11BB22CC33DD44EE55FF6677889900AA11BB22CC33DD44EE55FF6677889900$''',
    '''^B3CC9D5C64B3351573D806751312317FE4E910877E7CBAFA9D95E0BE923DD25C$''',
    '''^MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC7aBcDeFgHiJkLm$''',
    '''^b2xpdmFyZXMgd2lyZS1mbXQgZ29sZGVuIHNlZWQgdjGb/YN9yxakUPMwg9MkggrAwh7i0rbu\+ZRl6dqoG4RGBw==$''',
    '''^ghp_012345678901234567890123456789012345$''',
    '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.signature1234$''',
    '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3OCJ9\.dBjftJeZ4CVPmB92K27uhb$''',
    '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N$''',
    '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3OCJ9\.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXk$''',
    '''^-----BEGIN PRIVATE KEY-----\\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQ\\n-----END PRIVATE KEY-----$''',
    '''^-----BEGIN PRIVATE KEY-----\\n" \+ body \+ "\\n-----END PRIVATE KEY-----\\n"\n\n	if !ContainsSecretOrPII\(in\) \{\n		t\.Fatal\("ContainsSecretOrPII did not recognize a complete private-key block"\)\n	\}\n	out, redactions := RedactText\(in\)\n	for _, leaked := range \[\]string\{"-----BEGIN PRIVATE KEY-----$''',
    '''^olvOccurredAt=$''',
    '''^AIzaSyA1234567890abcdefghijklmnopqrstuv$''',
