# ── 2026-09-15 · connect-v1 PoP cross-language conformance vector · generic-api-key ────────────
# Two findings, one per language side, on the SAME 86-char value at line 56 of the canonical
# vector set for domain `olivares.connect.v1`. Classified NON-CREDENTIAL before this entry was
# written, and the classification is checkable from the files themselves:
#
#   · The value is an Ed25519 SIGNATURE (64 bytes, base64url) — the `Olivares-Connect-New-Key-Proof`
#     header of the `rotate-key` vector — over that vector's own `canonical` string. The private
#     seed that produced it, `vectors[1].keys.new.seed_hex`, is PUBLISHED IN THE SAME FILE a few
#     lines above. A signature derived from a seed printed beside it grants nothing the seed does
#     not already give, which is the ordinary shape of a conformance vector (cf. RFC 8032).
#   · It is a proof of possession, so it is bound to its message and to nothing else: the signed
#     canonical pins `challenge = n_rotatenonce`, `exp = 1780000120`, `target = dep_example`,
#     `binding_epoch = 1`, `method = POST` and that path. It authorizes no live deployment.
#   · Measured, not assumed: the proof value, and the new key's `public_key` and `kid`, occur in
#     EXACTLY these two files and nowhere else in the tree — no config, no manifest, no keyring.
#
# Why the rule fires HERE and not on its neighbours, which matters for how narrow this must be:
# `generic-api-key` keys on the IDENTIFIER, and only this header name contains `Key`. The sibling
# `Olivares-Connect-Proof` one line above and the two `mismatches[].signature` values are the same
# 86-char base64url shape and are NOT reported. So this is an identifier-name match, not a
# classification of the value — and the entry is therefore anchored to the whole captured MATCH
# (identifier, colon and value together), never to the value alone.
#
# Both paths carry byte-identical bytes ON PURPOSE: `core/license/connectv1/testdata/` is the Go
# side and `commercial/license-worker/src/connect/` the TypeScript Worker side of one
# cross-language vector, and the suites assert the two agree. Exempting one and not the other
# would redden whichever side is scanned second.
#
# Residual, stated: a different value on that line, this value under any other identifier, this
# expression in any other file, or any other rule on either path is STILL a finding. Nothing is
# exempted as a whole — not a directory, not a file, not a rule, not a commit.
[[allowlists]]
  description = "connect-v1 PoP conformance vector: the captured match is the New-Key-Proof Ed25519 signature over the vector's own canonical, produced by a seed published in the same file, not a credential"
  targetRules = ["generic-api-key"]
  condition = "AND"
  paths = ['''^core/license/connectv1/testdata/canonical-vectors\.b-c04256a\.json$''']
  regexTarget = "match"
  regexes = ['''^Olivares-Connect-New-Key-Proof": "oQ4kdmdnB_Gi2fhgBHh58xEB1ApsBu-OT2nKiMyzv-0SRCxj-2UEMRVNYWdAeX6Sa1U6uO62J5btnULWNdexCg"$''']

# Same vector, TypeScript Worker side. A separate block, not a second `paths` entry: with
# `condition = "AND"` every listed term is mandatory, so two paths in one block can never both
# hold for a single finding and the exemption would silently never apply. Measured here before
# landing — the two-path form left both findings reported.
[[allowlists]]
  description = "connect-v1 PoP conformance vector (Worker side): the captured match is the New-Key-Proof Ed25519 signature over the vector's own canonical, produced by a seed published in the same file, not a credential"
  targetRules = ["generic-api-key"]
  condition = "AND"
  paths = ['''^commercial/license-worker/src/connect/canonical-vectors\.json$''']
  regexTarget = "match"
  regexes = ['''^Olivares-Connect-New-Key-Proof": "oQ4kdmdnB_Gi2fhgBHh58xEB1ApsBu-OT2nKiMyzv-0SRCxj-2UEMRVNYWdAeX6Sa1U6uO62J5btnULWNdexCg"$''']

# ── The workspace qualification pin of workspace_api.go, and ONLY that pin ───────────────────
#
# `ci/iam-qualification/<family>.json` pins every input to the SHA-256 of its public bytes. The
# workspace registry keys one pin by `modules/sessions/workspace_api.go`, and `generic-api-key`
# reads the `api` in that FILE NAME as a key word and the digest beside it as the secret
# (measured 2026-09-23: the scanner reported workspace.json:247, one finding). A digest of a
# public source file publishes nothing. Exact form, bound to the registry path and to this one
# value: a re-pin of that file reappears as a finding and is adjudicated again; an `api_key`
# with the same value in the same file, the same line under another path, and any other value
# under that key are still reported (controlled on decoys before landing).
[[allowlists]]
  description = "the workspace qualification pin of workspace_api.go is the SHA-256 of a public file"
  targetRules = ["generic-api-key"]
  condition = "AND"
  regexTarget = "line"
  paths = ['''^ci/iam-qualification/workspace\.json$''']
  regexes = ['''^\s*"modules/sessions/workspace_api\.go": "1fcd9aac4b9a52fb542e64f7d57f8c994139528502660fec345ac49ebaf9d0bf",?\s*$''']
