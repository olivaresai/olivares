    '''^ZmFrZS1jb25qdXItYWNjZXNzLXRva2Vu$''',
    # Anadidos 2026-08-20 por the integrator: los DOS hallazgos que #902 no cierra.
    # Valor exacto, nunca la ruta, siguiendo la regla que encabeza este bloque.
    #
    # 1) cloud/control-plane/internal/config/config_test.go:286 — la fila "space inside" de
    #    TestLoad_RefusesASecretThisDeploymentCannotRead: un secreto de Dodo que ese test
    #    existe para RECHAZAR. El detalle que explica por que se colo: esta misma lista ya
    #    tiene la cadena SIN el espacio. Con el espacio es OTRO valor, y el ancla ^...$ de la
    #    entrada anterior no lo cubre. Un allowlist de valor exacto NO generaliza — por diseno,
    #    y es justo la propiedad que hace que anadir uno no ciegue el gate para nada mas.
    #    ⛔ CORREGIDO 2026-08-20: mi primera entrada aqui llevaba la cadena COMPLETA con el
    #    espacio, y NUNCA casaba. Medido corriendo gitleaks a mano sobre el fichero:
    #        Secret : 'whsec_b2xpdmFyZXMtZG9kby10ZXN0'
    #        Match  : 'POLAR_WEBHOOK_SECRET", "whsec_b2xpdmFyZXMtZG9kby10ZXN0\n'
    #    El detector CORTA el valor en el espacio. La leccion, que vale para toda esta lista:
    #    el valor exacto es el que el detector CAPTURA, no el que tu lees en el fuente.
    '''^whsec_b2xpdmFyZXMtZG9kby10ZXN0$''',
    #
    # 2) connectors/grok/session/pep_test.go:44 — dentro de una cabecera curl en el cuerpo de
    #    prueba del PEP; su propio texto dice lo que es.
    '''^SECRETO-QUE-NO-DEBE-VIAJAR$''',
  ]

# ── credential_sha256: un DIGEST, no una credencial ────────────────────────────────────────
# ⛔ ENTRADA ESTRECHA Y ANCLADA A LA CLAVE, no a la forma. Reproducida ANTES de escribirla, sobre
# la historia COMPLETA (7738 commits, 7m53s), porque en el árbol de trabajo y en los últimos 400
# commits da CERO: de 21 hallazgos, **12 son este campo**, todos del MISMO commit (1253e0def) y
# del MISMO fichero de evidencia, que **ya no existe en el árbol**. Ahí está el porqué de que
# borrar no lo arregle: el fichero se fue y los hallazgos se quedan, porque el CI lee la historia.
#
# Un `^[0-9a-f]{64}$` a secas eximiría CUALQUIER hash de 64 del repositorio, que es justo donde un
# secreto real podría esconderse. La clave delante es lo que la hace estrecha, y anclarla exige
# `regexTarget = "match"` porque el nombre del campo no está en el secreto capturado. Va en su
# PROPIO bloque: puesto en el de arriba rompía 72 exenciones, medido.
#
# Controlado en las dos direcciones sobre un señuelo fabricado: el digest legítimo deja de saltar,
# mientras que un secreto con forma de Stripe bajo una clave vecina y el mismo 64-hex bajo
# `api_key` siguen saltando. `credential_sha256` es por definición el SHA-256 DE una credencial:
# publicar el digest no publica la credencial.
[[allowlists]]
  description = "credential_sha256 is the digest OF a credential, not the credential"
  regexTarget = "match"
  regexes = [
    '''credential_sha256"\s*:\s*"[0-9a-f]{64}"''',
  ]

# Two narrow exemptions for two measured false-positive shapes. Neither exempts a directory: a wide
# path exemption would silence the scanner exactly where a real credential is most likely to be pasted
# by mistake, so the exemptions are keyed to WHY each match fired.
#
#   · `sourcegraph-access-token` fires on bare 40-hex strings, and a git commit id IS a bare 40-hex
#     string. A real Sourcegraph token carries the `sgp_` prefix, so a bare 40-hex is never one.
#   · `generic-api-key` fires on the value of `idempotency_key`, which is a client-generated REQUEST
#     ID, not a credential — it is meant to be visible in request examples.
#
# Controlled in both directions on decoys before landing: a realistic `sgp_`-prefixed token under an
# `api_key` field is STILL reported, while a commit id in prose and an `idempotency_key` example are
# not. An allowlist without that control is just a smaller scanner.
#
# Why it matters that these are gone: findings that are always present train readers to skip the
# report, and the value of a scanner is entirely in the day it says something new.
[[allowlists]]
  description = "a bare 40-hex git SHA is not a Sourcegraph token (those carry the sgp_ prefix)"
  regexTarget = "match"
  regexes = [
    # The match carries whatever delimiter follows the id -- measured: a closing backtick -- so the
    # anchor allows one trailing non-hex character. Anchoring on a bare 40 alone silently exempted
    # nothing, and the decoy that "proved" it did was never fired on by the rule: a control that does
    # not make the finding appear cannot show that it disappeared.
    '''^[0-9a-f]{40}[^0-9a-fA-Z]?$''',
  ]

[[allowlists]]
  description = "idempotency_key is a client-generated request id, not a credential"
  regexTarget = "line"
  regexes = [
    '''idempotency_key"\s*:\s*"[A-Za-z0-9_-]{8,}"''',
  ]

# ── El falso positivo HISTÓRICO del README alemán, y SÓLO ése ───────────────────────────────
#
# `generic-api-key` busca una palabra clave del tipo `api` y toma el token siguiente como VALOR. En
# un README traducido eso casa con prosa: medido el 2026-08-29 sobre el árbol entero, el único
# hallazgo del repositorio era `README.de.md` · secreto `A2A-Delegation` · entropía 3,52 — la frase
# «… Stopp in der Sessions-API, A2A-Delegation an autorisierte Peers …». El compuesto alemán tiene
# 14 caracteres con mayúscula, minúscula, dígito y guion y pasa el umbral; el inglés pone
# `API, A2A` (3 caracteres) y el resto `API, los` / `API, les` / `API path`, que no llegan.
#
# **El arreglo primario es de CONTENIDO y ya está aplicado** (`README.de.md`: «Sessions-API;
# Delegation via A2A»). Ése es el que limpia el árbol de trabajo, el export y el público, porque no
# depende de la historia. Esta entrada NO existe para eso: existe sólo para que el barrido de la
# historia PRIVADA —que conserva el commit viejo para siempre— no siga rojo.
#
# ⛔ AQUÍ HUBO UNA EXCEPCIÓN DE CLASE (ruta `README\.[a-z]{2}\.md` + forma «API <compuesto>») Y SE
# RETIRÓ ANTES DE ATERRIZAR, por un contraste que la midió en vez de leerla. Tres defectos, los tres
# demostrados con señuelos sintéticos:
#   1 · sin `targetRules` NO era una excepción de `generic-api-key`: era GLOBAL, y podía silenciar
#       cualquier otra regla que casara en esos ficheros.
#   2 · el regex admitía credenciales reales: `API, PROD-<alta entropía>` casa igual que un
#       compuesto alemán. **No hay frontera sintáctica fiable entre «palabra compuesta larga» y
#       «token con espacio de nombres y guion»**, y en un control de secretos esa frontera es justo
#       la que no se puede aproximar.
#   3 · en modo `--no-git`/`dir` gitleaks usa `paths` como filtro PREVIO y la composición `AND` no
#       llega a aplicarse, así que un `api_key = "<alta entropía>"` en uno de esos ficheros
#       desaparecía del informe sin dejar rastro.
# ⇒ La forma correcta para un control de secretos es la EXACTA: si mañana otra traducción vuelve a
# disparar, que **falle y se adjudique**, no que caiga dentro de una clase abierta.
[[allowlists]]
  description = "exact historical German README false positive (A2A-Delegation), superseded by the content fix"
  targetRules = ["generic-api-key"]
  condition = "AND"
  commits = ["b5d913a43aceb3fa521b90eb66f9cef31370fa9c"]
  paths = ['''^README\.de\.md$''']
  regexTarget = "secret"
  regexes = ['''^A2A-Delegation$''']

# ── Dos hechos históricos MÍOS, exactos, y por qué no llevan regex ──────────────────────────
#
# Los dos son de y los dos son autoinfligidos. Van con la MISMA forma que este fichero ya
# estableció: `targetRules` + `commits` + ruta anclada. Limpian historia inmutable y **nada más**:
# en el árbol de trabajo, en el export y en el público no aplican y no hacen falta, porque ahí lo
# limpia el contenido.
#
# ⛔ POR QUÉ NO LLEVAN `regexes`, que sería más estrecho: los valores a eximir SON los señuelos con
# forma de credencial que estamos retirando del informe. Escribirlos aquí los volvería a meter en la
# historia — el mismo error, en otro fichero. Commit + ruta ya acota a **un commit y un fichero**,
# que es tan exacto como se puede ser sin reproducir el valor.
[[allowlists]]
  description = "gitleaks contrast report: synthetic decoys committed in b7dbbc943e87, scrubbed from the tree"
  targetRules = ["generic-api-key"]
  condition = "AND"
  commits = ["b7dbbc943e877173b83306a608e112d415b45320"]
  # ⛔ LA RUTA VUELVE, PERO SIN EL TOKEN DE SESIÓN — no había que elegir entre las dos cosas.
  #
  # Historia corta, porque las dos correcciones eran ciertas y la primera no vio el coste de la
  # segunda. La ruta original era `^design-CONTRASTE-…$`: el nombre del fichero LLEVA el
  # número de sesión, dentro de un VALOR, y `.gitleaks.toml` **sí viaja al export** mientras que
  # `design/` no — el escrubador sólo limpia COMENTARIOS, así que ahí era una fuga medida. Quitar
  # `paths` cerró la fuga y abrió otra cosa: la excepción pasó a ser `(regla) AND (commit)`, y ese
  # commit toca **NUEVE** ficheros, entre ellos `scripts/export-public.sh`, `scripts/check-spdx.sh`,
  # `scripts/test-check-secrets.sh` y `README.de.md`, que **viajan**. Un `generic-api-key` en
  # cualquiera de los otros ocho habría quedado exento sin que nadie lo viera.
  #
  # El comodín `[^/]*` casa el prefijo de sesión sin nombrarlo: conserva la ruta anclada a UN
  # fichero y no contiene ningún `S<dígitos>`. Verificado contra los nueve ficheros del commit.
  paths = ['''^design/[^/]*CONTRASTE-GITLEAKS-2026-08-29\.md$''']

# El séptimo, y es una recursión con nombre: el fichero `.gitleaksignore` que #2104 añadió para
# SUPRIMIR un hallazgo contiene una línea con forma de clave —la propia huella
# `<sha40>:<fichero>:<regla>:<línea>`— y es, él mismo, un hallazgo. El fichero ya está retirado del
# árbol por #2124; esto cubre el commit que lo introdujo.
[[allowlists]]
  description = "the fingerprint line of the retired .gitleaksignore is itself key-shaped, in c66f8f72aca4"
  targetRules = ["generic-api-key"]
  condition = "AND"
  commits = ["c66f8f72aca4b2dd853ebe6c733d170b0000f82a"]
  paths = ['''^\.gitleaksignore$''']

# ⛔ 2026-08-31, señuelos de `debe_cortar`: LA TABLA `debe_cortar` DE `verify-seed-payloads.py` ES EL CORPUS DE
# PRUEBA DE UN REDACTOR, y por eso hace saltar al detector. Sus entradas son señuelos con
# FORMA de credencial cuyo único cometido es acreditar que el redactor los corta; el propio
# fichero lo dice en :1155 al explicar por qué cambió un valor que casaba `github-token`.
#
# Medido sobre `origin/main` con la config de esta casa: `gitleaks detect` da 3 hallazgos
# —`jwt`:1145, `stripe-access-token`:1148, `generic-api-key`:1152— todos de `c369f7739`
# (2026-08-31T05:54Z) y REACHABLE desde HEAD. Es lo que dejó rojo el job `secrets` del
# `mainline-ci` del espejo público (corrida 33411523747), y con él una de las dos
# condiciones que el ensayo del release necesita en verde.
#
# ANCLADO AL VALOR EXACTO, NO A LA RUTA, que es la decisión que esta casa ya tomó en el
# bloque A-04 (:251-253): «add the exact value, never the path». Una exención por ruta
# escondería también el secreto REAL que alguien commitee mañana en ese fichero.
#
# Residual, dicho: un señuelo NUEVO en esa tabla sin entrada aquí pondrá el gate en rojo.
# Eso es el comportamiento correcto, no un defecto.
[[allowlists]]
  description = "exact decoy Secrets from the `debe_cortar` fixture table of verify-seed-payloads.py"
  regexes = [
    '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJkZW1vIn0\.c2lnbmF0dXJlX2Zha2U$''',   # jwt — fixture de `debe_cortar`, :1145
    '''^sk_test_abcdefghijklmnopqrstuvwx$''',   # stripe-access-token — fixture de `debe_cortar`, :1148
    '''^0123456789abcdef0123456789abcdef01234567$''',   # generic-api-key — fixture de `debe_cortar`, :1152
  ]
