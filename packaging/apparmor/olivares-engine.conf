# Permit the engine's own session sandbox on Ubuntu's restricted userns hosts.
# This grants no host capability and leaves the global restriction unchanged.
abi <abi/4.0>,
include <tunables/global>

profile olivares-engine /usr/bin/olivares flags=(unconfined) {
  userns,
  include if exists <local/usr.bin.olivares>
}
