#
# Managed by install-agentops.sh (olivares.ai/agentops-dropin/v1): regenerated on reinstall.
# This file is rendered from the recorded layout every time install-agentops.sh runs. Do
# not edit it: put operator changes in a separate drop-in (for example 50-local.conf) so
# they survive a reinstall and can be told apart from generated configuration.
#
# "Operate Claude Code" drop-in for the hardened olivares.service (FASE V). It turns
# the bare-metal engine into the native co-deployment: the SAME `olivares` service
# CONDUCTS governed `claude` sessions as child processes via the procRunner — no
# separate claude daemon exists, because the control plane launches and governs claude
# itself (that IS the model).
#
# There is deliberately NO standalone claude unit: a long-running claude service would
# put its stdin/stdout out of the engine's reach (the governed transport is stdio). The
# engine owns the process; this drop-in just gives that conducted child what it needs
# WITHOUT widening the engine's own sandbox more than necessary.
#
# Rendered layout: data @DATA_DIR@ · workspace @WORKSPACE_DIR@
[Service]
# Operate-runtime configuration (token file, TTL, base URL, claude bin). Absent is fine
# (leading '-'); install-agentops.sh creates it from packaging/olivares-agentops.env.example.
EnvironmentFile=-@RUNTIME_ENV@

# claude needs a WRITABLE HOME for ~/.claude (settings + session history). Keep it UNDER
# the data dir, NOT under /home — so ProtectHome=true (from the base unit) still shields
# real users' homes while this path stays writable.
Environment=HOME=@CLAUDE_HOME@
# Disable Claude Code's background auto-updater (a managed host pins versions via the
# package manager / image rebuild, not a self-mutating process).
Environment=DISABLE_AUTOUPDATER=1

# Ensure the conducted runtime's writable surfaces under the data dir exist (idempotent;
# runs under the service sandbox, inside the data dir's ReadWritePaths). The token dir
# holds the short-lived inference bearer, so it is 0700 (the file is 0600).
ExecStartPre=/usr/bin/install -d -m 0750 @CLAUDE_HOME@
ExecStartPre=/usr/bin/install -d -m 0700 @RUN_DIR@
@WORKSPACE_PRE@
# The workspace root must be writable through ProtectSystem=strict: ReadWritePaths=
# re-exposes it, and systemd resolves the path itself (a textual prefix is not
# containment). The default entry is prefixed with "-" because the data dir already
# covers it. ReadWritePaths= cannot undo ProtectHome=true or PrivateTmp=true from the
# base unit; BindPaths= can, for exactly one directory, and the two lines below are
# rendered from the workspace location:
#   under /home, /root or /run/user  ProtectHome=tmpfs + BindPaths=<workspace>, so every
#                                    other home stays hidden from the service;
#   under /tmp or /var/tmp           PrivateTmp=true is KEPT and only BindPaths=<workspace>
#                                    is added, so the rest of the host's temporary tree
#                                    stays hidden (systemd 235 and later, upstream
#                                    a227a4be creates the destination inside the private
#                                    /tmp; install-agentops.sh checks the running version);
#   under /dev, /proc or /sys        refused by install-agentops.sh.
# Both lines are absent for any other location, which ReadWritePaths= alone reaches.
ReadWritePaths=@WORKSPACE_RW@
@WORKSPACE_PROTECT_HOME@
@WORKSPACE_BIND@

# RELAXATION (scoped, deliberate, documented): the base unit sets
# MemoryDenyWriteExecute=true, but the conducted `claude` runtime JIT-compiles and
# needs writable-then-executable memory, so W^X must be lifted for the engine+child.
# This is the ONE hardening property the Operate role loosens; everything else from
# the base unit (NoNewPrivileges, ProtectSystem=strict, cap-drop, the syscall filter,
# RestrictNamespaces, …) stays in force. If your claude version also needs broader
# syscalls or user namespaces (e.g. claude's own bubblewrap sandbox, which Olivares
# does not require since IT governs the session), relax those here too — explicitly,
# in your own drop-in.
MemoryDenyWriteExecute=false
