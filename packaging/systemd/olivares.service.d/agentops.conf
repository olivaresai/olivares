#
# Managed by install-agentops.sh (olivares.ai/agentops-dropin/v1): regenerated on reinstall.
# Compatibility for existing native AgentOps layouts. The normal install and
# console provide agent tools; existing subscription state stays in this HOME.
# Rendered layout: data /var/lib/olivares · workspace /var/lib/olivares/workspaces
[Service]
EnvironmentFile=-/etc/olivares/agentops.env
Environment=HOME=/var/lib/olivares/claude-home
Environment=DISABLE_AUTOUPDATER=1
ExecStartPre=/usr/bin/install -d -m 0750 /var/lib/olivares/claude-home
ExecStartPre=/usr/bin/install -d -m 0700 /var/lib/olivares/run
ExecStartPre=/usr/bin/install -d -m 0750 /var/lib/olivares/workspaces
ReadWritePaths=-/var/lib/olivares/workspaces
# Chosen folders stay visible. The product confines session and MCP children.
ProtectSystem=full
ProtectHome=false
PrivateTmp=false
MemoryDenyWriteExecute=false
SystemCallFilter=@system-service landlock_create_ruleset landlock_add_rule landlock_restrict_self
