#
# "Operate Claude Code" drop-in for the hardened olivares.service (FASE V).
# Install it at /etc/systemd/system/olivares.service.d/agentops.conf, then
# `systemctl daemon-reload`. It turns the bare-metal engine into the native
# co-deployment: the SAME `olivares` service CONDUCTS governed `claude` sessions as
# child processes via the procRunner — no separate claude daemon exists,
# because the control plane launches and governs claude itself (that IS the model).
#
# There is deliberately NO standalone claude unit: a long-running claude service would
# put its stdin/stdout out of the engine's reach (the governed transport is stdio).
# The engine owns the process; this drop-in just gives that conducted child what it
# needs WITHOUT widening the engine's own sandbox more than necessary.
[Service]
# Operate-runtime configuration (token file, TTL, base URL, claude bin). Absent is
# fine (leading '-'); the install-agentops.sh installer drops the example here.
EnvironmentFile=-/etc/olivares/agentops.env

# claude needs a WRITABLE HOME for ~/.claude (settings + session history). Keep it
# UNDER the state dir (/var/lib/olivares), NOT under /home — so ProtectHome=true (from
# the base unit) still shields real users' homes while this path stays writable.
Environment=HOME=/var/lib/olivares/claude-home
# Disable Claude Code's background auto-updater (a managed host pins versions via the
# package manager / image rebuild, not a self-mutating process).
Environment=DISABLE_AUTOUPDATER=1

# Ensure the conducted runtime's writable surfaces exist (idempotent; runs under the
# service sandbox — these live inside the StateDirectory, already ReadWritePaths). The
# token dir holds the short-lived inference bearer, so it is 0700 (the file is 0600);
# this keeps the drop-in self-sufficient even when installed standalone (.deb/.rpm),
# not only via scripts/install-agentops.sh.
ExecStartPre=/usr/bin/install -d -m 0750 /var/lib/olivares/workspaces /var/lib/olivares/claude-home
ExecStartPre=/usr/bin/install -d -m 0700 /var/lib/olivares/run

# RELAXATION (scoped, deliberate, documented): the base unit sets
# MemoryDenyWriteExecute=true, but the conducted `claude` runtime JIT-compiles and
# needs writable-then-executable memory, so W^X must be lifted for the engine+child.
# This is the ONE hardening property the Operate role loosens; everything else from
# the base unit (NoNewPrivileges, ProtectSystem=strict, cap-drop, the syscall filter,
# RestrictNamespaces, …) stays in force. If your claude version also needs broader
# syscalls or user namespaces (e.g. claude's own bubblewrap sandbox, which Olivares
# does not require since IT governs the session), relax those here too — explicitly.
MemoryDenyWriteExecute=false
