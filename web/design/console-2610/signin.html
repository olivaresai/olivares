<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in — Olivares AI</title>
    <link rel="stylesheet" href="console.css" />
    <script src="console.js" defer></script>
  </head>
  <body>
    <div class="auth">
      <main class="auth-main">
        <div class="auth-card">
          <div style="color: var(--mark-ink)">
            <svg
              class="mark"
              viewBox="3.5 2 28 28"
              fill="none"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path
                d="M16 5.5A10.5 10.5 0 0 1 16 26.5"
                stroke="currentColor"
                stroke-width="3"
              />
              <path
                d="M8.4 10.5H13.2"
                stroke="currentColor"
                stroke-width="2.6"
              />
              <path d="M8.4 14.5H15.4" stroke="#f08000" stroke-width="3.1" />
              <path d="M8.4 18.5H15" stroke="currentColor" stroke-width="2.6" />
              <path
                d="M8.4 22.5H13.4"
                stroke="currentColor"
                stroke-width="2.6"
              />
            </svg>
          </div>
          <h1>Sign in</h1>
          <p class="lead">Demo Estate · ops.example.internal</p>
          <form class="form" action="now.html">
            <button class="btn btn-primary btn-lg" type="submit">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="6" cy="5.5" r="2.5" />
                <path
                  d="M1.8 13.5c.4-2.4 2.1-3.8 4.2-3.8.9 0 1.7.2 2.4.7M12 8.5v5M12 13.5l1.5-1.2M12 11l1.2-1"
                />
                <circle cx="12" cy="7.5" r="1.4" /></svg
              ><span class="need">Sign in with a passkey</span>
            </button>
            <button class="btn btn-lg" type="submit">
              <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M8 1.8 13 4v4c0 3-2.1 5.3-5 6.2C5.1 13.3 3 11 3 8V4Z"
                /></svg
              ><span class="need">Continue with Okta</span>
            </button>
            <div class="pw">
              <details>
                <summary>
                  <span class="need">Use a password instead</span>
                </summary>
                <div>
                  <label
                    >Email<input class="input" value="grace@example.com"
                  /></label>
                  <label
                    >Password<input
                      class="input"
                      type="password"
                      value="correct horse battery"
                  /></label>
                  <button class="btn btn-lg" type="submit">Sign in</button>
                </div>
              </details>
            </div>
          </form>
        </div>
      </main>
      <footer class="auth-foot">
        <span>Olivares AI 26.10.0 · Community</span
        ><button
          class="icon-btn"
          type="button"
          data-theme-toggle
          aria-label="Switch theme"
          style="width: 24px; height: 24px"
        >
          <svg class="ico ico-sm" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3" />
            <path
              d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"
            />
          </svg>
        </button>
      </footer>
    </div>
  </body>
</html>
