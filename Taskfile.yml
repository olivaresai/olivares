  lint:brief-effort:
    desc: >-
      A LIVE session brief must not order `/effort ultracode` as the session's first action.
      Measured 2026-08-05 (escalated by the orchestrator): `/effort` is a CLI command and a
      LAUNCHED session cannot invoke it on itself, so the instruction — copied into twelve briefs
      from one template — asked every one of them for something impossible, and an honest session
      then spent context explaining why it could not comply. The second edge is worse: ultracode
      fixes xhigh, BELOW the `--effort max` used at launch, so the rule read as strictly better
      while being a downgrade. Closed sessions' briefs are HISTORY and are deliberately not
      checked: rewriting them would erase what those sessions were actually told.
    cmds:
      # ITS BATTERY RUNS FIRST, HERE — the fast lane calls this task by name. The battery proves
      # WHICH relay the gate reads, which is the half that can be silently wrong, and it had
      # never executed: the mtime defect it was written for would have come back unseen.
      - task: lint:brief-effort:selftest
      - bash scripts/hub-leg.sh lint:brief-effort scripts/check-brief-effort.sh

  lint:brief-effort:selftest:
    desc: >-
      Prove WHICH relay the brief gate reads, which is the half of it that can be silently wrong.
      Measured 2026-08-06: it picked the live relay by mtime, and mtime is not versioned —
      `git checkout` stamps every file with the checkout instant, so in a fresh clone the relays
      TIE, `-nt` is false on a tie, and the winner was whichever tied first. It read RELEVO3 of
      08-04 instead of RELEVO9 of 08-05, rejecting a push over a HISTORY file on the hub's own
      main. The loud direction is the lucky one: the same tie can read a clean old relay while the
      live one orders the impossible thing and report OK. Selection is now by name (`sort -V`, so
      RELEVO10 follows RELEVO9) and both verdicts name the file they read.
    cmds:
      - bash scripts/hub-leg.sh lint:brief-effort:selftest scripts/test-brief-effort.sh

  lint:unreachable-build-guards:
    desc: >-
      No Dockerfile asserts on `go tool nm` output over a binary the SAME RUN block just stripped
      with `-s -w`. Such a guard can never pass: stripping removes the symbol table, the grep
      cannot match, and the `||` branch fires every time, so the image is deterministically
      unbuildable while its labels and the public docs rest a FIPS/STIG claim on it. Measured
      2026-08-08 on this tree with both controls, no container needed: the same build WITHOUT the
      flags yields 72220 symbol lines, WITH them `go tool nm` prints 0 and says "no symbol
      section". Dockerfile.fips had exactly this and was repaired by RUNNING the binary and
      asserting on its output — strictly stronger, since a symbol proves a package was linked
      while running it proves the module initialises AND is the validated one. Dockerfile.stig had
      the identical line and was left behind, so the class outlived the case for months and an
      external contrast on gate S-5 found it. The corpus is DERIVED from `git ls-files`, not a
      hand-written list of Dockerfiles, because a list is precisely how the second copy survived.
      It reads CODE and not prose: the repaired file quotes the old broken command in a comment,
      and that contrast reported the repaired file as still broken for exactly that reason. Three
      answers — CLEAN / DIRTY naming file and line / COULD NOT LOOK (no git, no Dockerfile at all,
      unreadable file), never a silent green.
    cmds:
      # ITS BATTERY RUNS FIRST, HERE — and running it from the gate is what found the defect in
      # the battery itself: its truncated-enumeration case put a `git` shim under ${TMPDIR:-/tmp},
      # which is noexec in this container, so the shim never ran and the case graded the real git.
      # A battery is not proved by existing; it is proved by running where the gate runs.
      - task: lint:unreachable-build-guards:selftest
      - bash scripts/check-unreachable-build-guards.sh

  lint:unreachable-build-guards:selftest:
    desc: >-
      Prove the gate above by MUTATION in both directions, 10 cases. The half that matters is the
      NOT-catching one: stripping without a symbol assertion, reading symbols without stripping,
      the pattern split across two RUN layers, and above all a COMMENT that quotes the old broken
      command next to a live `-s -w` build — a gate that reads prose sends someone to un-fix
      correct code. One case here exists only because mutation found it: forcing the subject to
      judge prose left the battery fully green, which meant the case meant to prove that behaviour
      was measuring nothing — a comment line does not end in a backslash, so the block closed at
      the comment and the defect below it was never read. A surviving mutant is not a passing
      gate; it is a gate that is not looking.
    cmds:
      - bash scripts/with-clean-tmp.sh bash scripts/test-unreachable-build-guards.sh

  lint:program-anchors:
    desc: >-
      A programme document that nothing links from ESTADO-PROYECTO.md WILL be lost, and this
      repository has paid for it twice: once with the licensing programme and once with the TOPS
      derivation, which four relays carried and the fifth silently dropped. The diagnosis that
      matters: the loss was never a lack of analysis -- both times the analysis existed and was
      good. What was missing is that nothing linked it from the file every session opens first,
      and documentation nobody is routed to is indistinguishable from documentation that does not
      exist. Three entries, each earned: the licensing programme (the original loss), the product
      shape (approved 2026-08-08 and carrying ZERO anchors, while a June logbook entry still
      described pricing as undecided -- so a session searching the board concluded exactly that),
      and the pricing canon (the approved INVARIANTS -- also zero anchors, while main was
      violating commercial_crl_scope through a five-link chain nobody had joined up). It checks
      BOTH directions, because either alone is half a measure: the document exists, and the anchor
      exists. It deliberately does NOT read either side's CONTENT -- it cannot tell a living
      programme from a stale one, and pretending otherwise would be the "gate that reads as
      coverage" this repository keeps finding. Three answers: CLEAN / DIRTY naming what is orphaned
      or missing / COULD NOT LOOK (no git, no board, or an EMPTY list -- which would certify
      nothing while looking green).
    cmds:
      # ITS BATTERY RUNS FIRST, HERE — the fast lane calls this task by name. Its own description
      # says the ratchet shipped WITHOUT a battery because a hand run "proves it worked ONCE on a
      # tree that no longer exists". The battery it then got was wired to nothing, which is the
      # same sentence one level up: 17 cases that could not fire when someone edits the gate.
      - task: lint:program-anchors:selftest
      - bash scripts/check-program-anchors.sh

  lint:program-anchors:selftest:
    desc: >-
      Prove the ratchet above by MUTATION, 14 cases, both directions. It shipped WITHOUT a battery:
      its author mutated it by hand and wrote the results in a relay, which proves it worked ONCE
      on a tree that no longer exists and cannot fire again when someone edits it. The load-bearing
      cases are the ones a hand run does not repeat: an EMPTY list must be COULD NOT LOOK rather
      than CLEAN, EVERY entry is enforced and not just the first, and a path is not a PATTERN --
      dropping the -F would let a board mentioning "…-DISTRIBUCIONXmd" satisfy the check for
      "…-DISTRIBUCION.md". That last case exists because mutation found the first version of this
      battery could not kill it: the near-miss fixture differed in LETTERS, where a wildcard cannot
      help, so the case meant to prove -F was measuring something else.
    cmds:
      - bash scripts/with-clean-tmp.sh bash scripts/test-program-anchors.sh
  lint:go-toolchain:
    desc: >-
      A module inside the go.work `use` list must not carry its own `toolchain` line, and its `go`
      directive must not exceed the workspace's. That line is DEAD in the workspace (the workspace
      wins) and ALIVE under GOWORK=off, so the two drift apart and only the standalone build — the
      one that publishes an Apache module — ever notices. Ten were removed on 2026-08-08 and the
      adversarial contrast of that change found the real defect: a one-line mutant putting one back
      passed every gate in the repository. Outside the use list that line is the only pin a module
      has, so it is deliberately NOT forbidden there; the membership test is what makes the rule
      safe. An empty use list or a missing go.work is exit 2, never clean.
    cmds:
      - bash scripts/test-go-toolchain.sh
      - bash scripts/check-go-toolchain.sh

  lint:gofmt:
    desc: >-
      Every tracked Go source is gofmt-clean. Measured 2026-08-05: seventy-nine were not, across
      six top-level trees, and nothing in this repository was reporting it — `fmt:` formats only
      clients/go, and .golangci.yml declares gofmt under `formatters:`, which golangci-lint v2
      APPLIES rather than fails on. Three answers: clean / dirty naming each file / could not look.
    cmds:
      # ITS BATTERY RUNS FIRST, HERE, because this is the task the fast lane calls by name.
      # `lint:gofmt:selftest` existed from the first commit and NOTHING invoked it — five cases
      # that had never executed once, which is worse than no battery: the cases look like proof.
      - task: lint:gofmt:selftest
      - bash scripts/check-gofmt.sh

  lint:gofmt:selftest:
    desc: Prove all three answers of the gofmt gate against throwaway trees (clean, dirty, unverified).
    cmds:
      - bash scripts/check-gofmt.sh --selftest

  lint:kms-backends:
    desc: >-
      Verify every public surface agrees with the KMS providers derived from
      core/secure/kmswrap. On 2026-08-04 the front page, six translations, the launch post,
      the trust matrix and two design documents all claimed four backends where the code has
      three, and the matrix named a 'local' backend that does not exist. Five documentation
      gates passed over it because none of them reads the providers from the source. Refuses a
      wrong count in any locale, a hedge, and a backend named that is not there.
    cmds:
      - bash scripts/check-kms-backends.sh

  lint:brand-parity:
    desc: >-
      The console's DTCG tokens (web/tokens) and the public website's
      hand-maintained palette (the website checkout's src/styles/global.css)
      must declare the SAME brand. Pins brand.manifest.json (repo root — inside web/ it perturbs the embedded-console build hashes) to the DTCG
      sources always; when the website tree is present (dev workspace), also checks
      its live @theme/light-dark() values and its vendored manifest copy. The second
      command is the fixture battery — flipped hexes MUST go red (lint:boundary
      pattern: a detector nobody has seen fail is not a detector).
    cmds:
      - node scripts/check-brand-parity.mjs
      - node scripts/check-brand-parity.mjs --selftest

  lint:email-brand:
    desc: >-
      An outgoing email may not decide how the brand looks. Three questions, all of
      which must be answerable: are the generated template bundles what
      web/tokens + email/copy currently produce (and is every colour pair still AA);
      does any hand-written email surface name a colour, typeface or image in a
      STRING literal (comments are prose, and a hex in one is documentation); and is
      there an email surface nobody classified — candidates are discovered by the
      marks they leave, so a gate over a hand-written list cannot be walked around by
      adding a file. The second command is the fixture battery (lint:boundary
      pattern): a detector nobody has seen fail is not a detector. Cheap, no build.
    cmds:
      - node scripts/check-email-brand.mjs
      - node scripts/check-email-brand.mjs --selftest

  lint:commits:
    desc: Lint this branch's commit messages against Conventional Commits.
    cmds:
      - pnpm exec commitlint --from origin/main --to HEAD --verbose

  proto:tools:
    desc: Install the protobuf/gRPC code generators (buf + protoc-gen-go[-grpc]).
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@v1.50.0
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

  proto:lint:
    desc: Lint both wire contracts (connector/module SDK + core ControlPlane API).
    cmds:
      - cmd: cd sdk/plugin/proto && buf lint
      - cmd: cd core/api/proto && buf lint

  proto:generate:
    desc: Regenerate both contracts' Go code from the .proto (buf).
    cmds:
      - cmd: cd sdk/plugin/proto && buf generate
      - cmd: cd core/api/proto && buf generate

  proto:check:
    desc: Fail if any committed generated code is stale vs the .proto.
    deps: [proto:generate]
    cmds:
      - git diff --exit-code -- sdk/plugin/genpb core/api/genpb || { echo "generated code is stale; run 'task proto:generate' and commit"; exit 1; }

  openapi:dump:
    desc: Regenerate the committed OpenAPI snapshots — stable core + beta module routes.
    cmds:
      # ⛔ `go run … > destino` TRUNCA EL DESTINO ANTES de que go run corra: el shell
      # abre el fichero primero. Si la compilacion falla —y falla en cuanto el bundle
      # empotrado no esta, por el //go:embed all:dist de core/internal/webui/embed.go—
      # el snapshot COMMITEADO se queda a CERO. Medido por KERNEL-INTEGRADOR el
      # 2026-08-20: openapi.json perdio 9.405 lineas DOS veces, y una de ellas el
      # envoltorio lo informo como «exited with code 0».
      # El temporal se nombra en una VARIABLE, no como literal con forma de ruta: un
      # `web/openapi/.openapi.json.tmp` escrito a mano lo lee `lint:export-closure`
      # como una referencia colgante del arbol publicado, y con razon — no existe.
      - |
        d="$(mktemp -d "${TMPDIR:-/tmp}/openapi.XXXXXX")"
        trap 'rm -rf "$d"' EXIT
        go run ./cmd/olivares openapi > "$d/stable.json"
        mv "$d/stable.json" web/openapi/openapi.json
      - |
        d="$(mktemp -d "${TMPDIR:-/tmp}/openapi.XXXXXX")"
        trap 'rm -rf "$d"' EXIT
        go run ./cmd/olivares openapi --beta > "$d/beta.json"
        mv "$d/beta.json" web/openapi/openapi.beta.json

  docs-site:live-check:
    desc: >-
      Does the LIVE docs.olivares.ai keep the promises this tree makes? Parses docs-site/public/_redirects
      and discovers the sections/locales from docs-site/src/content/docs, so it demands what the tree
      declares rather than a list typed in the gate. 0 al día · 1 el sitio está rancio o roto · 2 NO HE
      PODIDO MIRAR. Deliberately NOT in the pre-push hook: it measures an EXTERNAL live site, and a lane's
      push must not go red because a deploy nobody asked it for is pending. It is the verification step of
      the docs-site-deploy workflow, and the integrator's probe.
    cmds:
      - bash scripts/check-docs-site-live.sh

  compliance:catalog:
    desc: >-
      Regenerate compliance.catalog.json — the public compliance control catalog and capability
      reference model, exported for the three olivares.ai/compliance/* URLs that modules/compliance
      SEALS into every OSCAL evidence package (oscal.go:109,195,242). The website vendors it
      byte-identical, the way it vendors brand.manifest.json.
    cmds:
      # Same trap as openapi:dump, same shape of remedy: `go run … > destino` TRUNCATES the
      # destination before go run starts, so a compile failure leaves the COMMITTED artifact at
      # zero bytes and the diff reads as a deliberate retirement. Write to a temp dir, then mv.
      - |
        d="$(mktemp -d "${TMPDIR:-/tmp}/compliance-catalog.XXXXXX")"
        trap 'rm -rf "$d"' EXIT
        go run ./modules/compliance/catalogexport > "$d/catalog.json"
        mv "$d/catalog.json" compliance.catalog.json

  compliance:catalog:check:
    desc: Fail if compliance.catalog.json is stale against modules/compliance (frameworks + capabilities).
    deps: [compliance:catalog]
    cmds:
      - git diff --exit-code -- compliance.catalog.json || { echo "compliance.catalog.json is stale; run 'task compliance:catalog' and commit"; exit 1; }

  openapi:content-coverage:
    desc: >-
      Measure operation summaries, raw requestBody coverage and the handler-reviewed request-body
      dispositions in the committed beta OpenAPI document. The meter is the sole source for these
      figures; it publishes declaration and typed-schema ceilings only after exhaustive, consistent
      classification, returns 1 for findings and 2 when it cannot inspect the document.
    cmds:
      - node scripts/measure-openapi-operation-content.mjs --by-feature

  openapi:content-coverage:selftest:
    desc: Prove all three meter answers and kill disposition, envelope and media-type mutants in disposable copies.
    cmds:
      - node scripts/measure-openapi-operation-content.selftest.mjs

  web:codegen:
    desc: Regenerate the typed web API client from the OpenAPI snapshot.
    deps: [openapi:dump]
    cmds:
      # ⛔ FAIL-CLOSED Y CON NOMBRE, 2026-08-30 (a repository gate). El script `codegen` de
      # web/package.json encadena DOS binarios que viven solo en web/node_modules/.bin, y
      # `pnpm run` los resuelve por ahi. Si el arbol no tiene esas dependencias instaladas,
      # lo que se ve es `sh: line 1: openapi-typescript: command not found` DENTRO de una
      # tarea que se llama «codegen drift»: el lector concluye que el snapshot se ha
      # desviado y sale a buscar una deriva que no existe. Medido el 2026-08-30 en la
      # corrida 33284926144: el paso que instala estas dependencias se salto por un rojo
      # ajeno (SPDX) y este canto la consecuencia.
      #
      # La guarda no evita el fallo: lo NOMBRA. Misma forma que la de #2149 en
      # .github/workflows/export-check.yml:150 — una herramienta que no se alcanza se dice
      # aqui, no se traslada al siguiente. Y vive en la TAREA, no en un workflow, porque
      # los otros dos consumidores (release.yml, release-rehearsal.yml) llaman a
      # `openapi:check` y heredarian el mismo rojo mudo.
      - cmd: |
          missing=""
          for t in openapi-typescript prettier; do
            [ -x "web/node_modules/.bin/$t" ] || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::web:codegen no puede correr: falta(n) en web/node_modules/.bin:$missing"
            echo "Instalalas con: pnpm --dir web install --frozen-lockfile"
            echo "(esto NO es una deriva del snapshot OpenAPI: es la cadena de herramientas)"
            exit 1
          fi
      - pnpm --dir web run codegen

  lint:cloud-roles-partial:
    desc: The cloud roles step degrades PARTIAL only when the MODULE is absent, never on a broken script (T3-A).
    cmds:
      - sh scripts/test-cloud-roles-partial.sh

  lint:openapi-provisioning:
    desc: The openapi:check consumer never runs without its provider, and a missing tool is NAMED (a repository gate).
    cmds:
      - sh scripts/test-openapi-check-provisioning.sh

  openapi:check:
    desc: Fail if the committed OpenAPI snapshots (stable + beta) or generated web client are stale.
    deps: [web:codegen]
    cmds:
      # web:codegen runs openapi:dump (both snapshots) then the web client codegen,
      # which consumes only the STABLE openapi.json — the beta document feeds the
      # SDKs and the docs-site, not the web app, so the web client stays unchanged.
      - git diff --exit-code -- web/openapi/openapi.json web/openapi/openapi.beta.json web/src/lib/api/openapi.gen.ts || { echo "OpenAPI snapshot/client is stale; run 'task web:codegen' and commit"; exit 1; }

  proto:breaking:
    desc: buf breaking vs origin/main for both FROZEN wire contracts (the check behind the "breaking-change-checked" claim; manual — needs git history).
    env:
      # buf clones the repo into $TMPDIR — keep it on the workspace disk; /tmp
      # is a small near-full tmpfs in the dev container.
      TMPDIR: '{{.ROOT_DIR}}/.buftmp'
    cmds:
      - mkdir -p '{{.ROOT_DIR}}/.buftmp'
      - defer: rm -rf '{{.ROOT_DIR}}/.buftmp'
      # origin/main, not main: a local main ref can lag the
      # merge base.
      - cmd: cd sdk/plugin/proto && buf breaking --against '../../../.git#ref=origin/main,subdir=sdk/plugin/proto'
      - cmd: cd core/api/proto && buf breaking --against '../../../.git#ref=origin/main,subdir=core/api/proto'

  sdk:generate:
    desc: Regenerate the client SDK operation layers (Go/Python/TS/Java) from the OpenAPI snapshots (stable + beta).
    deps: [openapi:dump]
    cmds:
      - go run ./clients/generator -spec web/openapi/openapi.json -beta web/openapi/openapi.beta.json -out clients
      - gofmt -w clients/go

  sdk:check:
    desc: Fail if any committed client SDK generated code is stale vs the spec (in the pre-push gate and CI).
    deps: [sdk:generate]
    cmds:
      - git diff --exit-code -- clients/go/operations.gen.go clients/go/version.gen.go clients/python/src/olivares_client/_operations.py clients/typescript/src/operations.gen.ts clients/typescript/src/version.gen.ts clients/java/src/main/java/ai/olivares/client/Client.java clients/java/src/main/java/ai/olivares/client/ApiMetadata.java || { echo "client SDK generated code is stale; run 'task sdk:generate' and commit"; exit 1; }

  sdk:test:python:
    desc: Run the Python client SDK smoke tests (not part of the Go gate).
    dir: clients/python
    cmds:
      - python3 -m unittest discover -s tests -v

  sdk:test:ts:
    desc: Run the TypeScript client SDK typecheck + smoke tests (not part of the Go gate).
    cmds:
      - pnpm --dir clients/typescript install
      - pnpm --dir clients/typescript typecheck
      - pnpm --dir clients/typescript test

  sdk:test:java:
    desc: Run the Java client SDK tests (needs a JDK 17+ and Maven on PATH; not part of the Go gate).
    dir: clients/java
    cmds:
      # clean: the operation layer is regenerated by sdk:generate, so a stale
      # incremental target/ from a prior op-set must not shadow the fresh sources.
      - mvn -B clean test

  manifests:gen:
    desc: Regenerate the flat kubectl-apply install manifest from the Helm chart.
    cmds:
      - sh scripts/gen-install-manifest.sh

  manifests:check:
    desc: Fail if deploy/manifests/install.yaml drifts from the chart, plus a content guard.
    deps: [manifests:gen]
    cmds:
      - git diff --exit-code -- deploy/manifests/install.yaml || { echo "install.yaml is stale; run 'task manifests:gen' and commit"; exit 1; }
      - sh scripts/check-install-manifest.sh

  provider:docs:
    desc: Regenerate the Terraform/OpenTofu provider's Registry docs (tfplugindocs). Needs tofu or terraform on PATH.
    dir: terraform-provider-olivares
    cmds:
      - bash scripts/gen-docs.sh

  provider:docs:check:
    desc: Fail if the provider's generated docs are stale vs the schema/examples. Needs tofu or terraform on PATH.
    dir: terraform-provider-olivares
    cmds:
      - bash scripts/gen-docs.sh --check

  fmt:
    desc: Auto-format Go and web sources.
    cmds:
      - bash scripts/lint.sh fmt-fix
      - pnpm --dir web run format

  fmt:check:
    desc: Check formatting without writing.
    cmds:
      - bash scripts/lint.sh fmt
      - pnpm --dir web run format:check

  lint:sast:
    desc: >-
      Static application security testing (gosec) over every Go module — the
      source-level SAST the gate previously lacked. Blocks on a curated high-signal
      rule set (SQL/command/template injection, SSRF, weak crypto, TLS misconfig);
      every reviewed exception carries a justified `#nosec Gxxx -- reason`. The
      full informational scan (all rules) lives in `task security:report`. Policy:
      .gosec.json + docs/security/SECURITY-GATE.md.
      Runs the gate AND its mutation matrix, like lint:ci-ports and lint:cosign-pins.
      That matrix exists because on 2026-08-01 this gate was found reporting "clean"
      for a module that did not compile — under `-quiet`, gosec gives a broken module
      and a clean one the same exit 0 and the same zero bytes — and reporting a
      finding COUNT it could never name, because its printer died of a SyntaxError on
      every run behind `2>/dev/null || true`.
    cmds:
      - bash scripts/sast.sh
      - bash scripts/test-sast-gate.sh

  fuzz:smoke:
    desc: >-
      Bounded fuzz smoke over every committed fuzz target — a short fuzztime from
      the checked-in seed corpus (no long discovery) so a parser/decoder regression
      is caught fast. Set OLIVARES_FUZZTIME to lengthen; the per-release
      CI runs a longer budget. See scripts/fuzz-smoke.sh.
    cmds:
      - task: fuzz:smoke:selftest
      - bash scripts/fuzz-smoke.sh

  fuzz:smoke:selftest:
    desc: Prove fuzz smoke caps worker processes and rejects the unbounded mutant.
    cmds:
      - bash scripts/test-fuzz-smoke.sh

  vuln:
    desc: Scan every workspace module with govulncheck.
    cmds:
      - bash scripts/go-work-each.sh govulncheck ./...

  vuln:gate:
    desc: >-
      Fail-closed dependency-vulnerability gate: govulncheck across every
      module, failing on any CALLED vulnerability that is not in the dated, justified
      allowlist (.govulncheck-allow.yaml). An expired or unknown-OSV allowlist entry
      also fails. This is the release-blocking form of `task vuln`.
    cmds:
      - bash scripts/govulncheck-gate.sh

  vuln:npm:gate:
    desc: >-
      Fail-closed dependency-vulnerability gate for the JavaScript surface: pnpm/npm audit
      across every TRACKED lockfile, failing on any high/critical advisory that is not in the
      dated, justified allowlist (.npm-vuln-allow.yaml). An expired entry also fails. It is the
      npm half of `vuln:gate`, and until 2026-08-07 it did not exist at all — nothing in this
      repository scanned npm dependencies, while the console those packages build is EMBEDDED
      in the published binary. Unlike govulncheck it has no reachability analysis, so severity
      is the only lever and the gate says so rather than implying a precision it lacks; it
      prints the full census on every run, clean or not.
    cmds:
      - bash scripts/npm-vuln-gate.sh

  lint:npm-vuln-gate:
    desc: >-
      The battery for vuln:npm:gate. Drives the gate with INJECTED audit binaries emitting
      fixtures, so it asserts the gate's three answers (refuse / block / clean) without ever
      touching the registry — a battery that needed the network would report "could not look"
      on a bad day and get read as flaky.
    cmds:
      - bash scripts/test-npm-vuln-gate.sh

  lint:build-bin-parity:
    desc: >-
      The engine binary is built ONE way outside a release. G-1 sweeps every shell script,
      Taskfile, Makefile and Dockerfile for a raw `go build` that writes the CANONICAL
      bin/olivares; G-2 builds through the helper and reads the artifact back to prove the
      stamps are there and the paths are trimmed.

      WIRED HERE BECAUSE IT WAS NOT, and that omission cost a real regression: the union of
      two pull requests was resolved with `git checkout --theirs scripts/web-e2e.sh`, which
      takes the WHOLE file and silently dropped the fix one of them had already landed. The
      ratchet that names this exact defect existed, was correct, went red for it — and NOTHING
      RAN IT, so `task e2e:web` went back to writing an untrimmed, unstamped binary into the
      canonical path. A guard with no caller is not a guard.

      FAST lane. Cost measured TWICE and it is not one number: 4.5 s with a warm build cache,
      21.9 s cold, because G-2 builds through the helper and reads the artifact back. The cold
      figure is the honest one to plan the lane against — quoting only the warm one is how a
      cost argument stops being true the first time somebody cleans a cache.
    cmds:
      - bash scripts/test-build-bin-parity.sh

  lint:web-e2e-boot:
    desc: >-
      The battery for scripts/lib/engine-boot.sh — the engine boot used by the web e2e run.
      It sources the SUBJECT and drives it with fake engines (a squatter on the HTTP port, a
      squatter on the gRPC port alone, a child that dies on start, one that never answers, one
      healthy but tokenless, one that works), so the FAILURE paths run without pnpm, a web
      bundle or a Go build. Inline in web-e2e.sh the only way they ever ran was the slow way,
      which is to say never — and the leak that produced left engines squatting ports for a
      day and five hours.

      FAST LANE, 26 s measured — and the number is here because it CORRECTED me. I first wired
      this into the heavy lane citing 142 s. An adversarial review then found that 120 s of
      those 142 were one defect in the battery itself: its squatter was started inside a
      command substitution, so the backgrounded process held the write end of the pipe and the
      substitution could not return until its 120 s sleep ran out. Fixing that dropped the run
      to 26 s and my heavy-lane argument with it. A cost figure used to justify a decision has
      to be re-measured when the thing it measured changes.
    cmds:
      - bash scripts/test-web-e2e-boot.sh

  lint:secrets:
    desc: Secret scanning over the history (gitleaks, docs/08 §7). Blocking in CI. Names what it finds.
    cmds:
      - bash scripts/check-secrets.sh

  lint:secrets-gate:
    desc: Regression battery for the secrets gate itself — clean / dirty / could-not-look, and reachability.
    cmds:
      - bash scripts/test-check-secrets.sh

  sbom:
    desc: Generate an SPDX SBOM for the built binary (syft). Run `task build:repro` first.
    cmds:
      - mkdir -p bin
      - syft bin/olivares --output spdx-json=bin/olivares.spdx.sbom.json
      - 'echo "SBOM written to bin/olivares.spdx.sbom.json"'

  security:report:
    desc: >-
      Consolidated security evidence: SAST (full informational gosec
      scan across every rule), dependency vulnerabilities (govulncheck), the
      secret-scan status (gitleaks) and SBOM presence, rendered to
      docs/security/gate-report.md. This is the product-led assurance artifact the
      trust center links in place of an external audit (D22). Regenerable; the
      re-executable adversarial security campaign consumes it.
    cmds:
      - bash scripts/security-report.sh

  security:campaign:
    desc: >-
      Run the pre-release internal adversarial security campaign floor: the deterministic
      security evidence (security:report) plus the campaign's confirmed-finding regression
      tests, then print how to launch the adversarial red-team workflow. The LLM red-team
      layer is launched from a Claude Code session; see design/audits/harness/README.md.
    cmds:
      - task: security:report
      - bash scripts/with-pg-env.sh bash scripts/go-work-each.sh go test -run Campaign ./...
      - |
        echo ""
        echo "Deterministic floor complete (docs/security/gate-report.md + Campaign regression tests)."
        echo "Launch the adversarial red-team layer from a Claude Code session:"
        echo "  Workflow({ scriptPath: \"design/audits/harness/campaign.workflow.js\","
        echo "             args: { root: \"$(pwd)\" } })"
        echo "Record findings in design/audits/<date>-adversarial-security-campaign.md"

  image:
    desc: Build the hardened distroless container image from source (docs/08 §7).
    cmds:
      - |
        docker build \
          --build-arg VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
          --build-arg COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)" \
          --build-arg SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct 2>/dev/null || echo 0)" \
          -t olivares:dev .

  image:ebpf:
    desc: Build the distroless eBPF backstop connector image (zero kernel caps).
    cmds:
      - docker build -f Dockerfile.ebpf-source -t ghcr.io/olivaresai/ebpf-source:dev .

  fips:verify:
    desc: FIPS 140-3 build + self-check (SCP-09) — GOFIPS140=v1.0.0 build, CMVP #5247 module linked, runtime toggle + `version` self-report. States MODE, never a validation claim.
    cmds:
      - bash scripts/fips-verify.sh

  release:matriz-cierre:
    desc: >-
      Orden 15 de la RUTA DE RELEASE (§3): ¿puede CERRARSE la MATRIZ DE VALOR? Mide tres cosas
      distintas sobre `design/MATRIZ-DE-VALOR-RELEASE-2026-08.md` — secciones `pendiente` en la
      tabla de cabecera, secciones DESFASADAS (corre el generador que cada una nombra y compara
      su cifra de `NO MEDIDO` con la que el documento declara) y filas abiertas `NO MEDIDO` /
      `parcial` (y `NO MEDIDOS`, que es la misma clase de celda) en superficie vendible, exentas
      SÓLO con el marcador literal `NO-VENDIBLE:` y su razón. La lista de generadores NO se deriva
      sólo del documento: se CENSA `scripts/matriz-valor-*.py` en el árbol y un generador que la
      matriz no nombre es una sección que nadie comprueba, o sea 2.
      TRES RESPUESTAS por código de salida: 0 cierre posible · 1 hallazgo · 2 NO HE PODIDO
      MIRAR (matriz ausente, o el generador de una sección rehúsa su `--selftest`, o su salida no
      se puede leer: la cifra de esa sección no la sostiene nadie, así que no absuelve ni condena).
      ⛔ ESE CÓDIGO NO SOBREVIVE A `task` A SECAS, y es la distinción entera del gate: `task`
      aplasta todo fallo a **201**, así que «hallazgo» y «no he podido mirar» salen iguales
      (medido: `task release:matriz-cierre` → 201 · `task -x release:matriz-cierre` → 2 ·
      `bash the closure-matrix gate → 2). Para leer la respuesta, `task -x` o el guion.
      ⛔ Es un gate de RELEASE y se espera ROJO hasta que la matriz cierre: NO se engancha al
      `pre-push` ni a ninguna tarea `lint:`, porque un lint rápido en rojo bloquea a los cinco
      carriles. `-- --no-generators` salta los generadores y entonces el veredicto es PARCIAL y
      no puede ser 0 nunca (deny-closed).
      0,72 s medidos el 2026-08-23 (load 12,61 sobre 16 cpu, incluidos los dos generadores);
      la cifra va con su carga a propósito, que es lo que este repo pide de toda duración.
    cmds:
      - bash scripts/hub-leg.sh release:matriz-cierre scripts/check-matriz-cierre.sh {{.CLI_ARGS}}

  release:matriz-cierre:selftest:
    desc: >-
      Calibración del gate anterior: 61 aserciones sobre fixtures desechables bajo $TMPDIR, cada
      regla en LAS DOS DIRECCIONES (con el defecto y sin él) — cabecera `pendiente`, fila
      `NO MEDIDO`, fila `parcial`, el PLURAL `NO MEDIDOS`, las minúsculas que NO cuentan, la
      MISMA fila exenta con `NO-VENDIBLE:` y su razón, marcador sin razón que NO exime, matriz
      ausente, matriz SIN tabla de cabecera, tabla-leyenda que no se cuenta y que no se traga la
      sección siguiente, generador cuyo `--selftest` rehúsa, generador que sale rc≠0, generador
      mudo, generador cuya salida NO es UTF-8, generador con dígitos en el nombre, generador
      presente en el árbol que el documento no nombra, generador desfasado, generador al día, el
      modo `--no-generators` que nunca sale 0 y las tres guardas del envoltorio `.sh`.
      Incluye el CONTROL DE MUTACIÓN: el mismo fixture se corre con
      `OLIVARES_MATRIZ_CIERRE_MUTANTE` —costura que desactiva el conteo de filas— y exige que el
      veredicto CAMBIE, así que la batería falla si ese paso dejara de ejecutarse; y exige
      TAMBIÉN que la variable A PELO no absuelva, porque la costura sólo vale con el testigo
      aleatorio que la batería genera por corrida. 0 pasa · 1 falla alguna aserción · 2 la
      batería NO HA PODIDO CORRER (p. ej. `$TMPDIR` inexistente), que no es lo mismo que fallar.
      Mismo aviso que arriba: `task` a secas aplasta 1 y 2 a 201; usa `task -x` o el guion.
      1,85 s medidos el 2026-08-23 (load 12,61 sobre 16 cpu).
    cmds:
      - bash scripts/hub-leg.sh release:matriz-cierre:selftest scripts/check-matriz-cierre.sh --selftest

  release:check:
    desc: >-
      Validate the GoReleaser release config (build/SBOM/sign/distroless pipeline)
      under BOTH reviewed profiles (release-rehearsal design §E.1.9). The config is
      profile-parameterized and `goreleaser check` renders the release templates, so
      an unclassified bare `goreleaser check` fails by design (measured: missingkey
      error on RELEASE_GITHUB_NAME) — each validation below declares its profile.
    cmds:
      - |
        set -eu
        echo "release:check — production profile"
        RELEASE_GITHUB_OWNER=olivaresai RELEASE_GITHUB_NAME=olivares \
        OCI_IMAGE_REPO=ghcr.io/olivaresai/olivares \
        SOURCE_REPOSITORY_URL=https://github.com/olivaresai/olivares \
        COSIGN_MODE=keyless PUBLISH_HOMEBREW=auto \
          goreleaser check
        echo "release:check — rehearsal profile"
        # NEUTRAL stand-in identity, deliberately: goreleaser check validates that the
        # key-mode/no-homebrew profile RENDERS, not where it points, and this Taskfile
        # ships publicly — the internal rehearsal identity lives only in the internal
        # rehearsal workflow (export gate).
        RELEASE_GITHUB_OWNER=rehearsal-org RELEASE_GITHUB_NAME=olivares-rehearsal \
        OCI_IMAGE_REPO=ghcr.io/rehearsal-org/olivares-rehearsal \
        SOURCE_REPOSITORY_URL=https://github.com/rehearsal-org/olivares-rehearsal \
        COSIGN_MODE=key PUBLISH_HOMEBREW=false \
          goreleaser check

  release:snapshot:
    desc: >-
      Local dry-run release — build + SBOM + checksums into dist/, NO publish/sign.
      goreleaser hard-requires distinct license and OTA public anchors. Honour
      operator-set published anchors; otherwise mint two THROWAWAY keypairs for the
      dry-run (a snapshot is never published, so their identities are immaterial).
    cmds:
      - |
        set -eu
        if [ -n "${OLIVARES_LICENSE_PUBKEY:-}" ] || [ -n "${OLIVARES_OTA_PUBKEY:-}" ]; then
          sh scripts/check-release-pubkey.sh
        else
          export OLIVARES_LICENSE_PUBKEY="$(go run ./cmd/olivares license keygen 2>/dev/null | awk '/public_key/{print $2}')"
          export OLIVARES_OTA_PUBKEY="$(go run ./cmd/olivares license keygen 2>/dev/null | awk '/public_key/{print $2}')"
        fi
        echo "release:snapshot using distinct license + OTA throwaway anchors"
        # .goreleaser.yaml is profile-parameterized ({{ .Env.RELEASE_GITHUB_OWNER }} …)
        # and a MISSING value is a hard template error by design — nothing may run
        # unclassified (release-rehearsal design §C.2). A snapshot never publishes, so
        # exporting the production-shaped tuple here only affects rendered names/labels.
        export RELEASE_GITHUB_OWNER=olivaresai RELEASE_GITHUB_NAME=olivares
        export OCI_IMAGE_REPO=ghcr.io/olivaresai/olivares
        export SOURCE_REPOSITORY_URL=https://github.com/olivaresai/olivares
        export COSIGN_MODE=keyless PUBLISH_HOMEBREW=auto
        # Snapshot mode skips publishing but still runs configured signers and
        # Docker image builds unless they are explicitly skipped. A local binary
        # smoke must not require OIDC, write a transparency-log entry, or require
        # a Docker daemon; the release workflow exercises those separate pipes.
        goreleaser release --snapshot --clean --skip=sign,docker

  release:smoke:
    desc: >-
      Release-artifact truth smoke: run the FINAL artifact and assert it carries the
      COMMIT it was built from, embeds + extracts the first-party connector plugins,
      and its command tree matches the source at this commit.
      ⛔ LO QUE EXIGE ES EL COMMIT, no las tres marcas: `release-smoke.sh:61` rechaza
      `commit none`; la version le da igual; y `:62` solo rechaza el literal `built
      unknown`, asi que una fecha CERO (`built 0001-01-01T00:00:00Z`) PASA. Hueco real
      del gate, anotado aparte y NO tocado aqui.
      Y el sello depende de DONDE se compile, no del modo:
        · desde un checkout CON historia git, `task release:snapshot` SI sella: el
          `.goreleaser.yaml` pone los ldflags `-X main.commit=<ShortCommit>` y
          `-X main.date=<CommitDate>` tambien en snapshot. (Ahi van con sus llaves de
          plantilla; AQUI se escriben sin ellas a proposito, porque `desc:` PASA POR
          PLANTILLA y las vaciaria en pantalla, que es lo que hacia la version anterior
          de este texto.) Medido 2026-08-30 reproduciendo ese vector de ldflags:
          `olivares 26.8.1-SNAPSHOT-3df6798c1 (commit 3df6798c1, built 2026-...)`, las
          tres comprobaciones de `release-smoke.sh:59-62` en verde.
        · sobre el arbol EXPORTADO hay DOS estados y solo UNO falla ruidosamente:
          (1) recien exportado, SIN `.git`, goreleaser no encuentra metadatos, sale
          `commit none` y el smoke muere — el gate haciendo su trabajo; (2) tras el
          `git init` de la ceremonia (runbook §3) el espejo YA tiene historia, el
          snapshot SI sella y el smoke PASA — pero con el commit DEL ESPEJO, que no
          identifica al candidato. ⛔ Ese verde es el caso peligroso: el rojo avisa,
          este no.
      Por eso alli la via es UNA: `task release:smoke -- <binario sellado>` — el de la
      corrida de release, o uno compilado con `-X main.commit` y `-X main.date`
      explicitos tomados de `release-commit.txt`. Detalle y testigos: runbook §7.0.
    cmds:
      - bash scripts/release-smoke.sh {{.CLI_ARGS}}

  lint:release-smoke-stamp:
    desc: >-
      Prove the build-metadata leg of release:smoke asserts the SHAPE of a stamp rather than
      the absence of three literal strings. cmd/olivares/main.go:36-38 defaults to
      dev/none/unknown, so rejecting those three by name only covers an ldflags run that did
      not happen; the reachable case is an ldflags run whose template resolved to nothing
      (`-X main.date=`), which prints `built )` and used to be called traceable. Twelve cases
      in both directions, real stamps included so the battery cannot be satisfied by a leg
      that rejects everything. Run it against a pre-cure copy with SMOKE_UNDER_TEST to see it
      fail the six it exists for.
    cmds:
      - bash scripts/test-release-smoke-stamp.sh

  lint:release-smoke-answers:
    desc: >-
      Prove release-smoke.sh gives THREE answers and not one. Every path used to exit 1 or leak
      a raw code (3 from `go build`, 126/127 from the shell), so "there is no artifact to look
      at" and "the artifact is wrong" were indistinguishable to the caller. The case that
      matters most is the reference build: if the binary it compares the command tree against
      cannot be built, `set -e` used to kill the script with go's exit code and the run read as
      "the tree diverges" — a finding invented out of a box with no toolchain. Seven cases, and
      the last is the negative control that stops answer 2 from swallowing real findings: an
      artifact that runs but carries no stamp is still 1. Run it against a pre-cure copy with
      OLIVARES_SMOKE_UNDER_TEST to see it fail the four it exists for.
    cmds:
      - bash scripts/test-release-smoke-answers.sh

  version:
    desc: Build and print the olivares version.
    deps: [build:bin]
    cmds:
      - ./bin/olivares version

  clean:
    desc: Remove build artifacts (binary + built web assets).
    cmds:
      - rm -rf bin
      - rm -rf core/internal/webui/dist/assets
