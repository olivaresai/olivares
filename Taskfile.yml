  lint:badge-vacio-filas:
    desc: >-
      Trinquete de F-04: un `<ListTruncationBadge>` que convive con un `<EmptyState>` tiene que
      decir cuantas filas hay.
      ⛔ El componente se pinta con `has_more === true && !error`, asi que con
      `{items: [], has_more: true}` saca el aviso ENCIMA del estado vacio: «no hay nada» y
      «cargadas 0, hay mas» a la vez, un mensaje que se contradice solo. La prop `filas` lo corta
      pero es OPCIONAL a proposito —hay ~84 montajes y no todos pasan un sobre con `items`, asi que
      exigirla dentro apagaria avisos ajenos EN SILENCIO—; este gate convierte esa opcionalidad en
      una deuda que solo puede bajar.
      ⛔ El conjunto NO son «los que no pasan filas»: un aviso sin estado vacio al lado no puede
      superponerse a nada. Son 68 de los 76, y confundirlos mandaria a tocar ocho ficheros que no lo
      necesitan. La baseline va por FICHERO y cuenta, no por fichero:linea, porque una linea se
      desplaza con cualquier edicion de arriba y un gate que miente se desactiva.
    cmds:
      - bash scripts/check-badge-vacio-filas.sh

  lint:badge-vacio-filas:selftest:
    desc: >-
      La bateria del trinquete anterior, en las dos direcciones. La asercion que la justifica es la
      que separa los dos conjuntos: un montaje SIN `filas` pero SIN `<EmptyState>` al lado NO
      cuenta. Ademas: subir es rojo, y BAJAR sin actualizar la baseline TAMBIEN —si no, el trinquete
      no aprieta nunca—, y sin fuente o sin baseline dice «no puedo mirar» (rc 2) en vez de verde.
    cmds:
      - bash scripts/test-badge-vacio-filas.sh

