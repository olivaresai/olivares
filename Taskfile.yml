  lint:addon-sets-gate:
    desc: >-
      The battery for lint:addon-sets, in the FAST lane for the same reason lint:hooks-path-gate
      is: a battery nothing runs is a battery that proves nothing. Nine cases, half of them the
      NON-FIRING direction — a deriver that refuses every canon passes every "it refuses" case
      while making the cut impossible. Mutation 5/5 with named witnesses.

      SCOPED IN THE PUBLIC EXPORT (2026-08-31). This gate validates hub-only commercial
      artifacts end to end — design/PRICING-CANON.md, commercial/module-slug-package.json —
      and the curated export drops both ON PURPOSE. Measured from an exported tree with
      `git init`: of the 217 scripts it invokes, 182 died with `cp: cannot stat .../design/`
      and the gate exited 1, which the canon's fail-closed rule turns into a rejected push.
      Guarding them one by one is chasing a chain that leaves holes behind, so the verdict
      is taken at the gate. NOT a bare marker file: hub-leg.sh keys on the generator's
      sentence AND the absence of every hub-only path, because adversarial review X-07
      showed a lone marker is a password a stray copy can type.
    cmds:
      # ONE call: the wrapper takes the scoped verdict when this tree is the stamped
      # public export, and otherwise execs the real battery below, propagating its code.
      - >-
        bash scripts/hub-only-gate.sh lint:addon-sets-gate
        "the pricing canon and the sold slug map (design/PRICING-CANON.md,
        commercial/module-slug-package.json)" lint:addon-sets-gate:legs

