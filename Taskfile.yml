#
# Taskfile (go-task) — the developer interface for the Olivares AI monorepo.
# Install go-task: https://taskfile.dev  (or `go install github.com/go-task/task/v3/cmd/task@latest`)
# Run `task` (no args) to list available tasks.
version: "3"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-time dev bootstrap — git hooks + cosign containment + commit tooling + web deps.
    deps: [hooks]
    cmds:
      # Containment BEFORE anything else can invoke cosign. An adversarial review of
      # was right that a guard nobody installs is not a control, and equally right that a
      # setup step which IGNORES its own failure has not installed anything either — it has
      # only produced the appearance of having tried. This is no longer best-effort: the
      # guard installs with or without cosign present (so the window between installing
      # cosign and re-running setup is covered), and `cosign:guard` asserts activation.
      - task cosign:guard
      # Node is optional locally (CI installs it); never block setup on it.
      - cmd: pnpm install --frozen-lockfile --ignore-scripts
        ignore_error: true
      - cmd: pnpm --dir web install --frozen-lockfile
        ignore_error: true

  hooks:
    desc: Point git at the versioned hooks (Conventional Commits enforcement).
    cmds:
      - git config core.hooksPath .githooks
      - chmod +x .githooks/* scripts/*.sh 2>/dev/null || true
    status:
      - test "$(git config --get core.hooksPath)" = ".githooks"

  tools:
    desc: Install pinned Go dev tools into GOPATH/bin (checksum-verified via go.sum, no curl|bash).
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

  build:
    desc: Build the full olivares binary with the web UI and first-party connectors embedded.
    deps: [build:web, build:connectors]
    cmds:
      - task: build:bin

  build:connectors:
    desc: >-
      Compile the first-party SOURCE-connector plugin binaries embedded into the
      single artifact (CB-1 transport B). Each is a standalone go-plugin binary so
      its dependency tree never links into the engine; the engine extracts and runs
      it as an isolated subprocess (cmd/olivares/firstparty). Built for the host
      platform here; GoReleaser runs the SAME script per release target through
      scripts/goreleaser-build-wrapper.sh, and the Dockerfile build stage runs it
      too — the canonical connector list lives in the script.
    cmds:
      - bash scripts/build-connectors.sh

  build:bin:
    desc: Compile the olivares binary (assumes the web bundle and connectors are present).
    deps: [build:connectors]
    cmds:
      - mkdir -p bin
      # The flag set (CGO_ENABLED=0, -trimpath, the three -X stamps) lives in ONE
      # place — scripts/lib/build-bin.sh — with the measurement that put it there.
      # It used to be written out longhand here AND in five scripts that overwrite
      # this same bin/olivares; five of the six had drifted, three of them dropping
      # -trimpath and re-embedding 1507 repo paths + 2236 $HOME paths.
      - 'bash -c ''. scripts/lib/build-bin.sh && build_olivares_bin bin/olivares'''

  build:repro:
    desc: >-
      Reproducible/verifiable build (docs/08 §7). Same source + same inputs →
      byte-identical binary: CGO off, -trimpath, build id stripped, embedded date
      pinned to the commit timestamp. This is the flag set GoReleaser uses. To
      reproduce a RELEASE artifact and compare SHA-256, set the PUBLISHED
      OLIVARES_LICENSE_PUBKEY and OLIVARES_OTA_PUBKEY anchors
      (docs/RELEASE-VERIFICATION.md) — both embedded keys AND -tags release are
      part of the reproducible input vector. Without both, this builds the DEV-keyed
      binary and will NOT match a release SHA-256. Supplying only one fails closed.
    cmds:
      - mkdir -p bin
      - |
        set -eu
        EPOCH="$(git log -1 --pretty=%ct 2>/dev/null || echo 0)"
        DATE="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo unknown)"
        REL_TAGS=""
        REL_LD=""
        # ONE gate for every anchor variable: check-release-pubkey.sh rejects the
        # obsolete shared OLIVARES_RELEASE_PUBKEY, an empty/malformed anchor, and two
        # equal anchors. Calling it whenever ANY of the three is set keeps the legacy
        # variable ALONE aborting the build (instead of silently producing a DEV
        # binary) without a second, can-only-fail invocation.
        if [ -n "${OLIVARES_RELEASE_PUBKEY:-}" ] || [ -n "${OLIVARES_LICENSE_PUBKEY:-}" ] || [ -n "${OLIVARES_OTA_PUBKEY:-}" ]; then
          sh scripts/check-release-pubkey.sh
          REL_TAGS="-tags release"
          REL_LD=" -X github.com/olivaresai/olivares/core/license.releasePublicKeyB64=${OLIVARES_LICENSE_PUBKEY} -X github.com/olivaresai/olivares/core/release.artifactVerifyKeyB64=${OLIVARES_OTA_PUBKEY}"
          echo "build:repro -> RELEASE binary (-tags release, distinct license + OTA anchors)"
        else
          echo "build:repro -> DEV binary (no release anchors set; will NOT match a release SHA-256)" >&2
        fi
        CGO_ENABLED=0 go build -trimpath $REL_TAGS \
          -ldflags "-s -w -buildid= -X main.version=$(git describe --tags --always 2>/dev/null || echo dev) -X main.commit=$(git rev-parse --short HEAD 2>/dev/null || echo none) -X main.date=${DATE}${REL_LD}" \
          -o bin/olivares ./cmd/olivares
      - sha256sum bin/olivares

  build:web:
    desc: Build the web UI into the Go embed dir (core/internal/webui/dist).
    cmds:
      - pnpm --dir web install --frozen-lockfile
      - pnpm --dir web run build
      # ⛔ EL SELLO DE ORIGEN, y no es contabilidad: `lint:web-bundle-freshness` juzgaba «¿cambió
      #    el bundle?», y eso es FALSO como condición necesaria. Medido el 2026-08-18: un cambio de
      #    TIPOS toca 53 fuentes empaquetadas y deja el bundle byte a byte idéntico, porque los
      #    tipos se borran al compilar — o sea, un gate que reconstruir NO puede poner verde, cuya
      #    única salida era `--no-verify`. El sello contesta la pregunta que sí vale: de qué
      #    fuentes salió este bundle.
      # ⛔ PASO HUB-ONLY, GUARDADO EN EL PUNTO DE LLAMADA — y es la regla que
      #    the export-closure gate enuncia: todo lo que invoca un target PUBLICADO
      #    debe estar publicado, «or be declared, AT THE CALL SITE, as hub-only and guarded
      #    there, so the published tree says so instead of dying».
      #
      #    Medido el 2026-08-29 con `task export:check` (la pata autoritativa): el árbol
      #    exportado construye el bundle (`✓ built in 14.99s`) y MUERE aquí, porque el
      #    digest enumera las fuentes con `git ls-files` (web-bundle-source-digest.sh:75) y
      #    en un export no hay `.git`: cero rutas → `NO HE PODIDO MIRAR` → exit 2 → cae
      #    `build:web` → cae `build`. Veredicto del gate: «BROKEN: the published tree does
      #    not build its own binary, so nobody who clones it has a product».
      #
      #    El guion hace BIEN en negarse —un digest de un conjunto vacío sería peor que
      #    ninguno—: el defecto era llamarlo sin guarda. Y saltarlo aquí no pierde nada: el
      #    sello VIAJA commiteado en el export con su valor correcto, y re-sellarlo en el
      #    clon de un consumidor no responde a ninguna pregunta que él pueda hacerse.
      - cmd: |
          if [ -f .olivares-public-export ]; then
            echo "build:web: NOT APPLICABLE — el sello de origen necesita git y este es un export público curado; el sello commiteado viaja tal cual."
          else
            bash scripts/web-bundle-source-digest.sh > core/internal/webui/bundle-source.stamp
          fi

  rebase:web:
    desc: >-
      Rebase the CURRENT branch onto main resolving only the rebuildable bundle, refusing
      any other conflict, and re-measuring the console ratchet. Add -- --push to publish.
    # Un helper sin llamante es un helper que nadie usa. Este existe porque cada PR que toca
    # web trae ~70 ficheros de dist regenerados, asi que cada merge web hace chocar a todos
    # los demas: medido el 2026-08-20, tres ramas rebasadas DOS veces en una jornada, con la
    # misma forma cada vez — ~71 conflictos generados y exactamente UNO real, el trinquete.
    cmds:
      - bash scripts/rebase-web-branch.sh {{.CLI_ARGS}}

  lint:rebase-web-branch:
    desc: Self-test of scripts/rebase-web-branch.sh (refusals, anchoring, third answer).
    cmds:
      - bash scripts/test-rebase-web-branch.sh

  web:check:
    desc: Fail if the committed embedded console is stale vs web/ sources.
    # The console is a COMMITTED BUILD ARTIFACT: core/internal/webui/dist is
    # `//go:embed all:dist` (core/internal/webui/embed.go:21), so whatever is in
    # git is what ships in the binary — and until 2026-07-29 no gate rebuilt it.
    # The hook and mainline-ci call build:go, which does not depend on build:web;
    # only `build` does, and no gate invokes `build`.
    #
    # Measured 2026-07-29, which is why this check exists rather than a warning:
    # the committed bundle had 214 files, a rebuild produced 213, and only 27
    # paths were byte-identical. `otlp_log_record` (web/src/features/audit/types.ts)
    # appeared 9 times in the rebuild and ZERO times in the committed bundle — a
    # feature present in the reviewed, unit-tested source and absent from the
    # console that ships.
    #
    # ⛔ Y EL 2026-08-18 SE VOLVIO A MEDIR, porque una cifra de julio sobre un arbol de
    # agosto no dice nada. La de arriba NO se reescribe: es lo que se midio ese dia y el
    # motivo por el que este check existe. Lo de hoy, con `pnpm install --frozen-lockfile`
    # sobre un arbol con base `main`:
    #
    #   el build reescribio los 224 ficheros de core/internal/webui/dist
    #   `git status` sobre esa ruta salio VACIO   ->   224/224 identicos
    #
    # Cierra dos cosas. (1) El ALCANCE de esta nota estaba caducado: 213/214 ficheros en
    # julio, 224 hoy. (2) El bundle commiteado NO esta rancio: es byte a byte lo que
    # produce el fuente actual, asi que la consola que se envia ES la del repositorio.
    # `mainline-ci` decia que la medicion de reproducibilidad «is in flight»; ya no, y
    # alli queda con este dato y con el de the orchestrator (dos builds seguidos, 224/224
    # con el mismo SHA-256).
    #
    # Same shape as proto:check below, and viable for the same reason: two full
    # builds from a clean snapshot produced identical file lists and identical
    # SHA-256 for all 213 files, so the diff is signal, not build nondeterminism.
    # Cost measured at ~41s wall-clock with node_modules present.
    #
    # Untracked outputs are checked separately: `git diff` alone cannot see a NEW
    # asset the rebuild produced, and a bundle that gained a file is exactly as
    # stale as one that changed a file.
    deps: [build:web]
    cmds:
      - git diff --quiet --exit-code -- core/internal/webui/dist || { echo "the committed console bundle is STALE vs web/ sources; run 'task build:web' and commit core/internal/webui/dist"; exit 1; }
      - |
        untracked="$(git ls-files --others --exclude-standard -- core/internal/webui/dist)"
        if [ -n "$untracked" ]; then
          echo "the rebuild produced files the commit does not have:"
          echo "$untracked"
          echo "run 'task build:web' and commit core/internal/webui/dist"
          exit 1
        fi

  build:go:
    desc: Compile every Go module in the workspace.
    cmds:
      - bash scripts/go-work-each.sh go build ./...
      - task build:cloud
      - task build:commerce
      - task build:commerce-core

  build:commerce:
    desc: >-
      Compile the commercial canon lint (its own module, outside go.work).
      HUB-PRIVATE: commercial/ never ships, so this runs through
      scripts/private-leg.sh — in the public export it reports NOT APPLICABLE in
      the job summary rather than failing on a directory the curation removed.
    env:
      GOWORK: "off"
    cmds:
      - bash scripts/private-leg.sh build:commerce commercial/commerce-lint go build ./...

  build:commerce-core:
    desc: >-
      Compile the commerce domain module (commercial/commerce — orders, money
      subledger, refund saga, webhook inbox, admission gate). Its own module,
      outside go.work for the same export reason as commerce-lint/cloud.
      HUB-PRIVATE, through scripts/private-leg.sh like build:commerce and
      build:cloud — see the note below for why it was the odd one out.
    # ⛔ ESTE ERA EL UNICO DE LOS TRES SIN GUARDA, y por eso `build:go` fallaba DESDE LA
    # EXPORTACION PUBLICA. Medido el 2026-08-19 exportando el arbol curado y corriendo el
    # gate dentro: los once modulos publicos compilan, `build:cloud` y `build:commerce`
    # dicen NOT APPLICABLE como deben, y este moria con
    #   `pattern ./...: directory prefix . does not contain main module`
    # porque `dir: commercial/commerce` apunta a un directorio que la curacion RETIRA.
    #
    # El fallo no era visible desde el hub: aqui el directorio existe y compila, asi que el
    # gate estaba verde en el unico arbol donde nadie necesita que lo este. La forma correcta
    # ya estaba escrita al lado — dos veces — y a esta le faltaba: `private-leg.sh` recibe el
    # directorio como ARGUMENTO y contesta NOT APPLICABLE cuando no existe, en vez de dejar
    # que `dir:` falle antes de que ninguna guarda pueda mirar.
    env:
      GOWORK: "off"
    cmds:
      - bash scripts/private-leg.sh build:commerce-core commercial/commerce go build ./...

  build:cloud:
    desc: >-
      Compile the cloud control plane Go module. HUB-PRIVATE, same wiring as
      build:commerce.
    env:
      GOWORK: "off"
    cmds:
      - bash scripts/private-leg.sh build:cloud cloud/control-plane go build ./...

  # NOTE: build:enterprise / test:enterprise moved to the separate, private enterprise
  # distribution — `-tags enterprise` is no longer compilable from this public
  # repo (the commercial enterprise/ tree and its cmd/olivares wiring live there).

  build:release:
    desc: >-
      Compile-check the `-tags release` trust-anchor paths the default gate excludes.
      `-tags release` drops the dev license seed (embedded_dev.go) and
      compiles embedded_release.go instead. It injects the independent license and
      OTA public anchors from OLIVARES_LICENSE_PUBKEY and OLIVARES_OTA_PUBKEY.
      Validation rejects empty/malformed/equal anchors BEFORE building so a broken
      release pipeline fails clearly. This is how goreleaser builds every artifact.
    deps: [build:connectors] # -tags release refuses to compile without the embedded plugins
    cmds:
      - sh scripts/check-release-pubkey.sh
      - go build -tags release -ldflags "-X github.com/olivaresai/olivares/core/license.releasePublicKeyB64=$OLIVARES_LICENSE_PUBKEY -X github.com/olivaresai/olivares/core/release.artifactVerifyKeyB64=$OLIVARES_OTA_PUBKEY" ./core/license/... ./core/release/... ./cmd/olivares/...

  test:key-domains:
    desc: Prove license and OTA anchors cannot verify each other's signed objects.
    cmds:
      - bash scripts/test-key-domain-separation.sh

  test:archive-gate:
    desc: >-
      Prove the OTA phase-2 archive gate is not a circular bootstrap: a substituted
      release archive is rejected against the cosign-verified checksums.txt BEFORE it
      is extracted, so its payload never executes.
    cmds:
      - bash scripts/test-archive-digest-gate.sh

  test:release:
    desc: >-
      Test the `-tags release` license path with NO key injected: asserts a
      release build degrades safely to license-key=none (nil DefaultPublicKey, nil
      DevPrivateKey, no dev seed) and never panics — the live releaseKey() resolution
      and the safe-degradation contract embedded_release_test.go pins.
    deps: [build:connectors] # -tags release refuses to compile without the embedded plugins
    cmds:
      - go test -tags release -race -count=1 ./core/license/...
      - go build -tags release ./cmd/olivares/...

  test:functional:
    desc: >-
      Full Go test suite across every workspace module WITHOUT the race detector —
      the push gate's fast correctness leg (pairs with test:race-hot). No test
      coverage is lost vs `task test`; only race DETECTION on the slow cmd/olivares
      e2e tail is deferred to the WEEKLY race-full sweep. See test:race-hot.
    cmds:
      # ⛔ 15m → 45m EL 2026-08-23, Y VA ATADO al techo del PASO (45→120) y del JOB (180→240) de
      #    `control-plane` en mainline-ci, que se mueven en este mismo commit.
      #
      #    Medido sobre la corrida 32605874242 (`main` en ffd0538b2), leyendo el log y no el
      #    veredicto: CUATRO paquetes mueren en el MISMO numero —`panic: test timed out after
      #    15m0s`, 900,09x s— y un quinto esta a un dia lento de acompanarlos:
      #
      #        modules/sessions      15,0 de 15 min  FAIL      modules/eventing      13,2 de 15  (88,2 %)
      #        modules/knowledge     15,0 de 15 min  FAIL      modules/orchestration 11,8 de 15  (78,4 %)
      #        modules/governance    15,0 de 15 min  FAIL
      #        modules/compliance    15,0 de 15 min  FAIL
      #
      #    (`scripts/check-test-timeout-headroom.sh --fetch 32605874242`: 11 de 572 paquetes por
      #    encima del 75 % de su tope.)
      #
      # ⛔ Y EL PASO TAMBIEN TOPABA, que es lo que cambia la lectura: duro **2713 s contra un techo
      #    de 2700** — trece segundos de mas. Asi que la lista de tests fallidos que este job
      #    publicaba era el PREFIJO DE UNA CORRIDA CORTADA, no el inventario. Es la misma forma que
      #    convirtio «cinco rojos heredados» en OCHO el 2026-08-22, en el otro carril.
      #    `control-plane` es uno de los cuatro contextos que la proteccion de `main` EXIGE, asi que
      #    mientras los dos techos muerdan no puede dar un veredicto completo NI ponerse verde.
      #
      # ⚠ LOS TRES NUMEROS SON COTAS, NO MEDIDAS: ningun paquete de los cuatro ha TERMINADO nunca
      #    en esta pata, asi que su duracion real sigue sin conocerse. El orden si esta elegido: el
      #    tope del BINARIO muerde primero (panico de Go, con volcado de goroutines y nombre), luego
      #    el del PASO, y el del JOB queda de backstop — de mas informativo a menos. El numero de
      #    verdad lo dara la primera corrida que termine; leedlo de `task ci:timeout-headroom
      #    --fetch`, nunca de esta linea.
      - bash scripts/with-pg-env.sh bash scripts/go-work-each.sh go test -count=1 -timeout 45m ./...
      - task test:cloud:norace
      - task test:commerce
      - task test:commerce-core:norace

  test:race-hot:
    desc: >-
      Race detector on the concurrency-critical paths — the push gate's -race leg.
      Races EVERY workspace module except cmd/olivares's pathological ROOT package
      (its cheap subpackages ARE raced), then races the root's concurrency-hot
      tests via the ANCHORED, fail-closed regex from scripts/race-hot-tests.sh
      (manifest of hot files — new tests in those files auto-include; a renamed
      file fails the gate loudly instead of silently unracing). The long-poll
      root e2e tail (…StoryE2E) is NOT raced here — the WEEKLY race-full workflow
      races it, so nothing is permanently unraced. Cloud races here (once).
      Composed of the sub-legs below so CI can run/report them as separate
      steps (the workspace leg alone exceeds 45 min on a 2-vCPU runner); running
      this composite locally is unchanged and still covers every module.
    cmds:
      - task: test:race-hot:workspace
      - task: test:race-hot:modules
      - task: test:race-hot:root
      - task: test:race-hot:hot
      - task: test:cloud

  test:race-hot:workspace:
    desc: -race over every workspace module EXCEPT cmd/olivares's root and ./modules (sub-leg).
    # ⛔ 20m → 45m el 2026-08-19, MEDIDO en las dos puntas. En CI tres paquetes murieron a
    # **1200,4 s exactos** —el limite, no una duracion—: core/api, core/auth y
    # core/internal/store/sqlstore. En el gate pesado sobre arbol ANCLADO esos mismos tardan
    # **410 s, 415 s y 298 s**. Factor de contencion >=3x (nueve runners sobre menos maquinas),
    # asi que 20m no era holgura: era una carrera perdida.
    #
    # El modo de fallo es el que ya documenta la receta de 150m: `go-work-each` ABORTA, los
    # modulos POSTERIORES no se ejecutan, y se lee un rojo creyendo cubierto lo que nunca corrio.
    # Mismo precedente que modules/governance, que usa 45m «not the 20m the other modules use».
    #
    # ⛔ 45m → 60m EL 2026-08-30, TERCERA SUBIDA, Y LOS MISMOS TRES PAQUETES OTRA VEZ.
    # En la corrida 33299071121 (candidato 3) murieron a **2 700,x s exactos** —el limite otra vez,
    # no una duracion—: core/api 2 700,662 · core/auth 2 700,453 · sqlstore 2 700,414.
    #
    # Y esta vez hay el dato que faltaba en las dos subidas anteriores: **CUATRO HORAS ANTES, el
    # mismo dia, los tres terminaron VERDES** en la corrida 33296406847 —core/api **1 666,5 s
    # (27,8 min)**, core/auth **1 649,0 s (27,5)**, sqlstore **1 800,7 s (30,0)**—. O sea que NO es
    # una ralentizacion nueva y no hay commit culpable: es varianza del runner contra un techo
    # rozado, factor **>=1,6** (y solo *>=* porque el corte impide saber el maximo).
    #
    # Y Go dijo que NO se cuelga nada: su `running tests:` al agotar nombra la prueba en curso y
    # llevaba **1 s** (core/api) y **2 s** (core/auth). El corte pillo al paquete en medio de una
    # prueba rapida tras 45 min de trabajo normal.
    #
    # 60 CABE, y esto se midio antes de elegirlo: los paquetes corren en PARALELO, asi que el paso
    # no es la suma. El paso duro 47m12s en la corrida verde y **72m05s en la roja, bajo su techo de
    # 90** — no se agoto. Con los tres terminando, la roja habria pedido ~80 min de paso, que entra,
    # y el reloj sigue POR DEBAJO del techo del paso: el diagnostico de Go sigue siendo alcanzable,
    # que es la propiedad que no se puede perder (`check-ci-inner-timeouts` lo impone).
    #
    # ⚠ 60 ES UNA COTA RAZONADA, NO UNA MEDIDA: sale de 27-30 min mas el margen de varianza
    # observado. La duracion real cuando no se les corta SIGUE SIN MEDIRSE. Si vuelve a agotarse,
    # la cifra siguiente sale de ESE dato — y entonces la pregunta ya no es el reloj, es por que un
    # paquete de 7 min en arbol anclado (410/415/298 s, medido arriba) tarda 45 en el runner.
    cmds:
      - bash scripts/with-pg-env.sh env GO_WORK_EACH_SKIP=cmd/olivares,modules bash scripts/go-work-each.sh go test -race -count=1 -timeout 60m ./...

  test:race-hot:modules:
    desc: -race over the ./modules module alone (sub-leg — CI runs it as its own job, race-modules).
    # ./modules is two thirds of the workspace -race leg on its own. Measured in CI
    # 2026-07-25 (run 30138745627): modules 47m27s vs core 15m39s, connectors 4m04s,
    # operator 2m23s, clients 36s — a ~70m serial total that overran the 70-minute
    # step ceiling, leaving sdk/* and terraform-provider-olivares UNRACED that run.
    # Splitting it out lets CI run the two legs concurrently. No coverage moves:
    # the composite above still runs both.
    #
    # -timeout 45m (not the 20m the other modules use): modules/governance measured
    # 1120s (18m41s) in that same run, i.e. 93% of a 20m per-binary cap, so the cap
    # was one slow runner away from failing a passing suite. A real hang still fails,
    # at the ceiling.
    #
    # THROUGH with-pg-env.sh again since 2026-08-01, and the history is the point.
    # The wrapper was dropped on 2026-07-30 on a measured premise — ./modules
    # referenced no pgtest/POSTGRES_DSN and jackc/pgx was `// indirect` — and
    # scripts/test-pg-test-env.sh (task lint:pg-env) was written the same day as the
    # fail-closed tripwire for that premise rather than an honor-system comment.
    # unit H then put 12 writer-fence ENFORCEMENT tests on real PostgreSQL in
    # modules/eventing, and the tripwire went red before they could ever run: without
    # a server they would have SKIPPED, silently, under a green race-modules.
    #
    # So the premise flipped and the wiring flipped with it: race-modules provisions
    # Postgres identically to race-rest, this leg goes through the wrapper like every
    # other go-test entry point in this file, and the tripwire now asserts THAT
    # consistency instead of the old absence. It was never deleted — a gate that is
    # removed the first time it fires is a gate that only ever agreed with you.
    cmds:
      #
      # ⛔ Y EL 30m SE AGOTÓ. Medido el 2026-08-18 en `mainline-ci` sobre `main`:
      # `modules/governance` tardó **1800.178s — exactamente el techo**, y el binario murió con
      # `panic: test timed out after 30m0s`. NO era un cuelgue: el test que el panic NOMBRA,
      # `TestStepUpRequiredForBreakGlass`, llevaba **2 SEGUNDOS** — es el que corría cuando se
      # agotó el presupuesto del PAQUETE, no el culpable. El nombre más ruidoso de un panic
      # vuelve a no ser la causa.
      #
      # ⛔⛔ LO QUE IMPORTA NO ES ESTE NÚMERO, ES LA PENDIENTE. governance pasó de **18m41s a
      # 30m00s** entre las dos medidas (**+60%**), y detrás viene `modules/sessions` con
      # **1466.8s (24m27s)**: a esa pendiente choca contra el techo siguiente. Subirlo una
      # tercera vez sería la cinta de correr — se sube AHORA porque un `race-modules` rojo
      # bloquea el release y el suite crece de verdad, no porque subirlo sea la respuesta. El
      # trabajo real es por qué governance tarda media hora bajo `-race`, y es del carril dueño
      # de ese módulo, no del integrador.
      #
      # ⛔⛔⛔ Y SE PERDIÓ UNA VEZ, el mismo día: el merge de #856 revirtió esta línea a 30m
      # dejando las 20 anclas de `scripts/test-pg-test-env.sh` en 45m, y `lint:pg-env` —que está
      # en el carril rápido— se fue a 35 fixtures «MUTATION DID NOT APPLY» y puso ROJO el
      # contexto EXIGIDO `control-plane` en `main`. Un merge limpio no es un merge correcto.
      #
      # Los cuatro más caros de esa corrida, para que la próxima medida tenga contra qué
      # compararse: governance 1800.2s · sessions 1466.8s · compliance 1071.9s · knowledge 1066.3s
      # ⛔ 45m → 90m EL 2026-08-21, y el reparto sale de CRUZAR dos corridas del MISMO job sobre dos
      #    arboles, no de leer una:
      #
      #                   main        lote 56
      #      eventing    2701.6s      1249.8s   ← el MISMO paquete CABE en la otra corrida
      #      compliance  2701.2s      2253.3s
      #      finops      2701.1s       820.7s
      #      governance  2700.4s      2700.2s   ← topa en las DOS
      #      inventory    165.2s        40.6s
      #
      #    TODOS van ~2x mas lentos en la corrida que topa, `inventory` incluido: eso es el RUNNER,
      #    no el codigo — quince binarios -race compitiendo con un `-timeout` que cuenta RELOJ DE
      #    PARED. Tres de los cuatro topes son CONTENCION (les falta holgura) y `governance` topa en
      #    las dos (le falta PRESUPUESTO). Un techo mas alto resuelve las dos causas.
      #
      # ⛔ Y SE HIZO ASI, EN UNA SOLA RECETA ESTATICA, PORQUE EL GATE LO EXIGE. La primera version
      #    partia ./modules en dos patas derivando los paquetes en tiempo de ejecucion; la capa 1 de
      #    `test-pg-test-env.sh` NO puede resolver eso estaticamente y respondio UNVERIFIED en 59
      #    casos. El gate tenia razon: una receta que un lector estatico no puede leer no se puede
      #    garantizar. La medida no cambia; la FORMA de aplicarla, si.
      #
      #    El pin y sus veinte copias en scripts/test-pg-test-env.sh se mueven EN ESTE MISMO COMMIT,
      #    que es lo que su guardia de acoplamiento exige.
      #
      # ⛔ 90m → 150m EL 2026-08-23 (r24), Y NO VA SOLO: el techo del PASO (180→210) y el del JOB
      #    (200→240) de `race-modules` se mueven en ESTE MISMO COMMIT. Medido por PASOS sobre la
      #    corrida 32598987269 —no por el job, que no lo dice—: el paso `race` tardó 129,1 min y
      #    dentro de él `modules/sessions` agotó **90,0 de 90 (100 %)**, y es el ÚNICO de 584
      #    paquetes por encima del 75 % de su tope. Proyección con 150m: 129,1 − 90 + 150 ≈ 189 min,
      #    que SE PASA del techo de paso de 180 ⇒ subir sólo esta línea habría devuelto la muerte
      #    MUDA que el 08-22 se acababa de quitar. Los tres números se mueven juntos o no sirven.
      #
      # ⚠ Y ESTO NO ES EL ARREGLO, ES LA COTA. `modules/sessions` no ha TERMINADO nunca bajo -race:
      #    su duración real sigue sin conocerse. Lo que sí se midió es por qué creció — **+128 681
      #    líneas en catorce días** (K3-K5) — y que corre **769 tests con sólo 18 `t.Parallel()``.
      #    Ése es el arreglo, y es del carril del KERNEL. Subir el tope ya se probó tres veces
      #    (20m → 45m → 90m) y cada vez compró semanas, que es justo lo que
      #    `scripts/check-test-timeout-headroom.sh` existe para dejar de pagar a ciegas.
      - bash scripts/with-pg-env.sh bash -c 'cd modules && go test -race -count=1 -timeout 150m ./...'

  test:race-hot:root:
    desc: -race over cmd/olivares's cheap subpackages (sub-leg).
    cmds:
      - bash scripts/with-pg-env.sh bash -c 'cd cmd/olivares && go test -race -count=1 -timeout 10m ./exitcode/... ./firstparty/... ./seed/...'

  test:race-hot:hot:
    desc: -race over the root's hot tests from the fail-closed manifest (sub-leg).
    cmds:
      - RUN_REGEX="$(bash scripts/race-hot-tests.sh)" && bash scripts/with-pg-env.sh bash -c 'cd cmd/olivares && go test -race -count=1 -timeout 15m -run "$0" .' "$RUN_REGEX"

  test:
    desc: >-
      Full Go test suite under -race across every workspace module. The heaviest,
      slowest gate — runs WEEKLY (race-full workflow) and locally on demand. Since
      2026-08-02 the pre-push hook runs it ONLY for main and tags (see
      lint:prepush-refclass); on a feature branch you invoke it yourself, or the
      integrator does for the batch. The push CI gate uses test:functional +
      test:race-hot instead (this suite's cmd/olivares -race tail is ~36m, over the
      2-vCPU runner's 35m ceiling). See test:race-hot for the split rationale.
    cmds:
      # -timeout 35m (default is 10m, PER test binary): the cmd/olivares package under -race
      # exceeded 20m after the 2026-07-09 integrations landed ~1.8k lines of new e2e tests
      # there — measured 1247s (20m47s) on an IDLE machine at GOMAXPROCS=8, ~101% CPU, i.e.
      # the suite is wall-clock-bound (poll/converge loops), so cores don't help. Raising the
      # ceiling never hides a real hang (that still fails, at the ceiling) — it only stops a
      # genuinely-slow -race suite from a false timeout. 35m→60m 2026-07-24: the (#372)
      # inferenceproxy tests pushed the measured root -race wall past 35m (gate red by
      # timeout with ZERO races and verifiable progress). The push gate no longer runs this
      # whole suite (see test:race-hot); it is the weekly/local full-fidelity race sweep.
      # 60m→150m 2026-07-26: MEASURED twice on this host — ./cmd/olivares alone needs 4070s
      # (68m) under contention, so 60m failed with `panic: test timed out` and ZERO --- FAIL.
      # That failure mode is worse than slow: go-work-each ABORTS on it, so every LATER
      # module goes unrun while the operator reads a "failed gate" and assumes coverage it
      # never had. The ceiling still catches a real hang — it just stops being reached by
      # arithmetic on a loaded machine.
      - bash scripts/with-pg-env.sh bash scripts/go-work-each.sh go test -race -count=1 -timeout 150m ./...
      - task test:cloud
      - task test:commerce
      - task test:commerce-core

  test:cloud:
    desc: >-
      Run the cloud control plane Go test suite under -race. HUB-PRIVATE (see
      build:cloud).
    env:
      GOWORK: "off"
    cmds:
      # ⛔ A TRAVÉS DE `with-pg-env.sh`, y esto es un CAMBIO de 2026-08-30 con su motivo.
      # `cloud/control-plane` figuraba en la lista de exenciones de
      # `scripts/test-pg-test-env.sh` porque no leía el arnés de Postgres. Dejó de ser cierto
      # cuando `privilege_posture_test.go` entró: ese test pide una base REAL para interrogar
      # `pg_proc.proacl`, que es justo lo que no se puede fingir con un doble. La exención no
      # era una regla, era un HECHO — y el hecho cambió, así que se retira en vez de ampliarse.
      # Es el mismo razonamiento que `test:commerce` deja escrito unas líneas más abajo: un
      # invariante que se sostiene por construcción gana a uno que se sostiene por una lista
      # que crece.
      - bash scripts/with-pg-env.sh bash scripts/private-leg.sh test:cloud cloud/control-plane go test -race -count=1 -timeout 10m ./...

  test:cloud:norace:
    desc: >-
      Cloud control plane suite WITHOUT -race (push gate correctness leg).
      HUB-PRIVATE (see build:cloud).
    env:
      GOWORK: "off"
    cmds:
      # Igual que `test:cloud`: ver la nota de arriba.
      - bash scripts/with-pg-env.sh bash scripts/private-leg.sh test:cloud:norace cloud/control-plane go test -count=1 -timeout 10m ./...

  test:commerce:
    desc: >-
      Commercial canon lint suite (commercial/commerce-lint). Its own module, like
      cloud/: it is hub-internal (design/PRICING-CANON.md never ships) so it must
      stay OUT of go.work — the public export ships go.work, and a `use` entry
      pointing at a directory the export blocks would break the exported build.
      ~3s; includes the regression guard that keeps the canon YAML machine-readable.
    env:
      GOWORK: "off"
    cmds:
      # Through with-pg-env.sh like every other go-test entry point. This module
      # reads no OLIVARES_TEST_POSTGRES_* variable, so it could have been added to
      # the reviewed exemption list in scripts/test-pg-test-env.sh instead — but an
      # invariant that holds by construction beats one that holds by a growing list
      # of exceptions, and lint:pg-env caught this omission on the first push.
      # HUB-PRIVATE, so it also goes through private-leg.sh (see build:commerce);
      # the wrapper is INSIDE, because with-pg-env.sh must still decide the env for
      # the run that actually happens.
      - bash scripts/private-leg.sh test:commerce commercial/commerce-lint bash {{.ROOT_DIR}}/scripts/with-pg-env.sh go test -race -count=1 -timeout 5m ./...

  test:commerce-core:
    desc: >-
      Commerce domain suite (commercial/commerce) under -race. Postgres-only
      module: its schema-invariant tests provision a private database per test
      via OLIVARES_TEST_POSTGRES_SUPERUSER_DSN (with-pg-env.sh supplies it in
      the gate; tests skip loudly when unset).
    cmds:
      # SIN `dir:` a proposito: el export cura `commercial/` fuera y `task` moria ANTES de
      # correr nada, con el error de un directorio ausente. El guion clasifica el arbol y da
      # la tercera respuesta (SCOPED) en vez de un rojo que no mide nada.
      - bash scripts/commerce-core-leg.sh --race

  test:commerce-core:norace:
    desc: Commerce domain suite WITHOUT -race (push gate correctness leg).
    cmds:
      # Misma razon que su hermana con -race: sin `dir:`, y la clasificacion en el guion.
      - bash scripts/commerce-core-leg.sh

  cover:
    desc: Measure total Go coverage separately for every workspace module (not a gate).
    cmds:
      - bash scripts/go-cover.sh

  test:web:
    desc: Run the web UI unit/component tests (vitest).
    # Mirrors the CI worker cap (079cf939): on this shared host the uncapped fork pool
    # dies with EAGAIN/heap SIGABRT under load (reds measured at 8->14->27 across runs
    # with only 3 in common at load average 122-187 — flake, not product). Invoke
    # vitest DIRECTLY: `pnpm run test -- --maxWorkers=N` puts the flag behind `--`
    # where vitest treats it as a name filter and the cap silently never applies
    # (proven in CI run 30214868317). Override with OLIVARES_VITEST_WORKERS.
    cmds:
      - pnpm --dir web exec vitest run --maxWorkers={{.OLIVARES_VITEST_WORKERS | default "2"}}
    vars:
      OLIVARES_VITEST_WORKERS:
        sh: echo "${OLIVARES_VITEST_WORKERS:-2}"

  test:integration:
    desc: >-
      Run the Tier-1 interop QUALIFICATION jobs: integration-tagged conformance
      tests that run each declared Tier-1 connector against a REFERENCE/vendor endpoint,
      not a fixture. NOT in the default gate — Actions is OFF in this repo, so these run
      per-release. Each job SKIPS cleanly unless its endpoint env var is set (see
      connectors/interop/tier1-matrix.json), so a bare run just proves the jobs compile
      under the `integration` tag and do not rot. Provide e.g. OLIVARES_A2A_CONFORMANCE_URL
      / OLIVARES_MCP_CONFORMANCE_URL to actually qualify, then record last_verified in the
      matrix.
    cmds:
      - bash scripts/go-work-each.sh go test -tags integration -run Conformance ./...

  test:license-worker:
    desc: >-
      Run the license Worker's conformance (Go-authored wire vectors, Polar AND
      Dodo) + unit tests + hermetic E2E + typecheck. NOT in the local Go gate —
      the worker is TypeScript — but it IS in mainline-ci as its own
      `license-worker` job, because "run this whenever it changes"
      made every guarantee in that directory a habit rather than a gate. Run it
      locally whenever commercial/license-worker, commercial/commerce's inbox
      vectors, or the core/license wire format changes.
    cmds:
      - bash scripts/private-leg.sh test:license-worker commercial/license-worker npm run typecheck
      - bash scripts/private-leg.sh test:license-worker commercial/license-worker npm run test:all

  tokens:check:
    desc: Fail if the committed DTCG design tokens output (src/styles/tokens.css) is stale.
    cmds:
      - pnpm --dir web run tokens:check

  check:web:
    desc: >-
      Typecheck the embedded console (tsc -b) so a route/type regression in web/
      cannot reach main silently. The console is go:embed'd into the binary, so a
      red `tsc -b` means a release build ships a stale dist — this is the gate that
      would have caught the FEATURE_VIEWS literal-path drift (WS-console-build).
    cmds:
      - pnpm --dir web install --frozen-lockfile
      - pnpm --dir web run typecheck

  bench:
    desc: >-
      Reproducible capacity benchmarks (OPS-6): per-node durable-write
      throughput + p50/p95/p99, the SQLite single-writer scaling ceiling, and bus
      fan-out. Set OLIVARES_TEST_POSTGRES_DSN to also measure Postgres. The runner
      records hardware/storage provenance — see docs/SIZING-AND-CAPACITY.md.
    cmds:
      - bash scripts/bench-capacity.sh

  bench:check:
    desc: >-
      Anti-bit-rot smoke for the capacity/scale benchmarks: builds and runs each
      one once so a harness/seeding regression is caught. NOT a threshold gate
      (bench numbers are hardware-dependent). Pass --full for the RAG end-to-end
      corpus + 1M ranker curve (nightly). See scripts/bench-check.sh.
    cmds:
      - bash scripts/bench-check.sh {{.CLI_ARGS}}

  e2e:
    desc: >-
      End-to-end suite: the full in-process nuclear flow — install→discover→
      R/RW graph + PERMITTED-vs-OBSERVED diff→govern→dashboards, cross-module event
      integration, multi-tenant isolation, self-audit and contract tests — plus the
      gated real-binary smoke. Deterministic (fixed fixtures, external providers
      mocked). The in-process tests also run under -race in the `go` job.
    cmds:
      - bash scripts/with-pg-env.sh bash -c "cd cmd/olivares && go test -count=1 -tags e2e -run 'TestE2E' ./..."

  e2e:work-kernel:
    desc: >-
      Walk the cross-session WORK KERNEL against a RUNNING engine and report a verdict:
      create → ready → lease → HANDOFF → event chain, through the same three-phase
      command plane (validate/plan/apply) the console uses, carrying the plan_hash from
      plan into apply so a pass means "I checked THIS" and not "I checked". It exists
      because nothing else drives it end to end: the unit tests exercise the service in
      process and never see the HTTP contract, and a green console says nothing about
      whether a SESSION can hold its own lease. Needs OLIVARES_E2E_BASE/TOKEN/TENANT/
      WORKSPACE/USER; with OLIVARES_E2E_SID_A/TOKEN_A and _B it also measures the real
      handoff between two managed sessions, and WITHOUT them it says NOT MEASURED for
      those steps rather than passing them. Three answers, and the exit code carries
      them: 0 clean, 1 finding, 2 could not look. `--selftest` proves it can give all
      three before anyone believes a green from it. ⚠ `task` collapses every non-zero exit
      to 201, so read the harness's own last line for the verdict, or run the script
      directly when you need the 1-vs-2 distinction the exit code carries.
    cmds:
      - bash scripts/e2e-work-kernel.sh {{.CLI_ARGS}}

  dr:drill:
    desc: >-
      Disaster-recovery drill (docs/DR-RUNBOOK.md §8): a full round trip in a
      throwaway dir — seed a signed, checkpointed ledger → back it up → destroy the
      estate → restore into a clean dir → re-verify chain + per-event signatures +
      checkpoints + tip continuity — printing the MEASURED RTO. Touches no real data
      dir, so it is CI-safe. A non-zero exit is a DR incident. Set DR_DRILL_EVENTS to
      size the ephemeral ledger (default 1000).
    cmds:
      - go run ./cmd/olivares dr drill --events {{.DR_DRILL_EVENTS | default 1000}}

  security:drill:
    desc: >-
      PSIRT advisory-pipeline drill (docs/PSIRT-RUNBOOK.md §7): producer → signed
      feed → offline affected/patched/boundary checks → tamper and wrong-key
      refusals, with measured end-to-end time. Touches no real data, so it is
      CI-safe. A non-zero exit means the advisory pipeline is broken.
    cmds:
      - go run ./cmd/olivares security drill

  security:feed:package:
    desc: >-
      Package + verify a signed out-of-band advisory feed per the runbook, NEVER
      publishes.
    cmds:
      - >-
        sh scripts/package-security-feed.sh --draft {{.DRAFT}} --sign-key
        {{.SIGN_KEY}} {{if .PUBKEY}}--pubkey {{.PUBKEY}}{{end}} --out-dir
        {{.OUT_DIR | default "dist/security-feed"}}

  security:feed:selftest:
    desc: >-
      CI-safe end-to-end proof of the packaging path with ephemeral TEST keys and
      the drill fixture.
    cmds:
      - sh scripts/package-security-feed.sh --selftest

  at:gate:
    desc: >-
      Formal assistive-technology gate: axe-core WCAG 2.2 A+AA +
      landmark/heading structure + live-region inventory + contrast over every
      AUTH route, in BOTH Warm Terminal themes, exiting non-zero on any blocking
      issue. The contrast pairs are DERIVED from the console's own source
      (`web/e2e-visual/at-pairs.ts`, one row per SITE) instead of read off a
      hand-written list that goes stale the day a screen composes two tokens
      nobody wrote down — the same move `console:walk` made for routes. The COUNT
      is measured and printed on every run, never frozen in this text: it was 1054
      when the description was written and 1131 the day it landed, so a number
      here is a number that lies as soon as the console grows one screen.
      That matters because it reaches what
      a rendered scan cannot: axe-core measures every text node it can SEE, but
      a composition that only exists in a JSX conditional (`selected ?
      'bg-accent' : …`) never renders during a walk, so nothing measured it. One
      such row's label sat at 1.17:1 under a green gate. The 43 hand-written
      TOKEN pairings stay as the palette's own contract, and known measured debt
      is carried per-site in `CONTRAST_DEBT` — re-measured every run, failing if
      it regresses, if it starts passing (stale), or if new debt appears.
      A MANDATORY release step, run per-release rather than as continuous CI.
      Needs the web deps + the Playwright chromium
      (`pnpm --dir web run e2e:install`) once.
    cmds:
      - pnpm --dir web install --frozen-lockfile
      - pnpm --dir web run at:gate

  e2e:web:
    desc: Playwright e2e smoke (setup→login→shell) against the embedded binary.
    cmds:
      - bash scripts/web-e2e.sh

  e2e:web:demo:
    desc: Playwright against the REAL binary seeded with the demo estate (R/RW graph renders from live data).
    cmds:
      - bash scripts/web-e2e-demo.sh

  demo:governed-rag:
    desc: >-
      Reference E2E demo: Claude Code MCP retrieval over governed live data with
      semantic, scope, deny and source_mode timings.
    cmds:
      - bash scripts/demo-governed-rag.sh

  smoke:quickstart:
    desc: >-
      Time-to-value contract: run the EXACT quickstart commands against the
      real binary and assert the hero — the R/RW graph + PERMITTED-vs-OBSERVED drift —
      on both the demo estate and a real pgAudit connector. Fails if the page's
      install→value path or its drift numbers stop being true.
    deps: [build:bin]
    cmds:
      - bash scripts/quickstart-smoke.sh

  smoke:quickstart-argv:
    desc: >-
      FIRST CONTACT: run `olivares quickstart` BY ARGV on the built binary and assert what a
      new user actually sees — the first-run header, the welcome panel, the console URL, a
      setup token of the shape core/secure mints, and the engine answering /healthz over the
      self-signed HTTPS it starts with. It is NOT smoke:quickstart: that one boots the engine
      through `serve --insecure --seed-demo`, which is the documentation page's hero and a
      DIFFERENT verb. Measured 2026-08-27, the tree had zero executions of `quickstart` — the
      command README.md and INSTALL.md name as the first thing to run — and
      design/MATRIZ-DE-VALOR-RELEASE-2026-08.md marked that row NOT MEASURED for exactly that
      reason. It also runs from the EXPORT inside `task export:check`, which is where it
      answers the question the hub cannot: that the tree a stranger clones starts.
      Three answers: CLEAN, BROKEN, or COULD NOT LOOK (no curl, no free port, no toolchain).
    deps: [build:bin]
    cmds:
      - bash scripts/quickstart-argv-smoke.sh

  smoke:examples:
    desc: >-
      Examples contract: run every examples/<scenario>/smoke.sh against the
      real binary and assert the documented outcome — governed Claude Code tool-calls
      (allow/deny/rewrite), OpenTelemetry GenAI ingest → FinOps cost, the
      connector scaffold (build + lifecycle test + license-boundary), and the
      bring-your-own-protocol content source (scaffold + fill + sign + deny-closed
      admission). Fails if any example's README stops being true against the
      current binary.
    deps: [build:bin]
    cmds:
      - bash examples/govern-claude-code/smoke.sh
      - bash examples/otel-genai-ingest/smoke.sh
      - bash examples/build-a-connector/smoke.sh
      - bash examples/bring-your-own-protocol/smoke.sh

  vet:
    desc: >-
      go vet across every workspace module — and the load-bearing half is that vet COMPILES THE
      TEST FILES, which `build:go` does not. Measured 2026-08-13, and it cost `main` ninety
      minutes of a trunk that did not compile its own tests: K2 widened `resumeRun` with an
      `agentIdentity` argument and three calls in modules/sessions/templateapply_test.go still
      passed four. `build:go` was GREEN over that tree — `go build ./...` never looks at
      `_test.go` — so the batch was verified by a leg that structurally could not see it. The
      only other leg that catches it is the full `test`/-race run, which costs 50-65 minutes on
      cmd/olivares alone; this costs seconds and answers the same question about compilability.
      Found by the orchestrator, who had predicted exactly this shape six hours earlier.
    cmds:
      - bash scripts/go-work-each.sh go vet ./...

  lint:
    desc: Run all linters (SPDX, brand parity, boundary, migrations, i18n parity, datatable empty states, docs parity, ADR sync, docs anchors, public counts, security.txt, cosign pins, pg-env, commerce canon, Go, web).
    deps:
      [
        lint:spdx,
        lint:brand-parity,
        lint:boundary,
        lint:migrations,
        lint:i18n,
        lint:i18n-anchors,
        lint:engine-output,
        lint:datatable-empty,
        lint:error-mappers,
        lint:docs-parity,
        lint:adr-not-published,
        lint:public-counts,
        lint:guide-docs,
        lint:release-version,
        lint:security-txt,
        lint:cosign-pins,
        lint:release-mechanics,
        lint:pg-env,
        lint:status-ref,
        lint:prepush-refclass,
        lint:session-numbers,
        lint:session-duplicates,
        lint:commerce,
        lint:pin-distance,
        lint:conflict-markers,
      ]
    cmds:
      - task: lint:go
      - task: lint:web

  report:blind-verdict:
    desc: >
      INFORME, no gate: qué contesta cada scripts/check-*.sh cuando NO PUEDE MIRAR. Ciega cada uno
      copiándolo a un árbol vacío y EJECUTÁNDOLO, y clasifica por CÓDIGO DE SALIDA — no por la
      prosa, porque la tercera respuesta no tiene ortografía canónica: medido el 2026-08-15, 18
      dicen sólo «UNVERIFIED», 6 sólo «NO HE PODIDO MIRAR», 1 las dos y 26 ninguna. Por eso dos
      censos por cadena dieron 11 y 14 y ninguno era el comportamiento. Corre el self-test primero,
      con gates fabricados para las cuatro clases.
    cmds:
      - bash scripts/census-blind-verdict.sh --selftest
      - bash scripts/census-blind-verdict.sh --run

  report:orphan-branches:
    desc: >-
      REPORT, not a gate: remote branches carrying commits outside main with NO open pull request.
      Written 2026-08-15 after three of them turned up BY ACCIDENT while cleaning worktrees for
      disk -- 60 commits, 5 and 2. A pushed branch with no PR is the worst way to hold work: it
      outlives the worktree that made it, appears in no queue, is read by no gate, and the next
      relay has no way to learn it exists. First run: 125 of 164 branches, one of them 255 commits
      ahead. It PRINTS and refuses to grade, because whether a branch is alive or abandoned is a
      judgement its author makes and nothing here can measure -- and because a permanent warning on
      the push path is the shape this repository already measured as worthless in the nightly drift
      detector. Exit 0 with the report, 2 if it could not look. There is no exit 1.
    cmds:
      - bash scripts/report-orphan-branches.sh

  report:hub-hygiene:
    desc: >-
      REPORT, not a gate: worktrees that are candidates for MANUAL retirement, with four answers --
      CANDIDATO, CONSERVAR, EVIDENCIA and NO HE PODIDO MIRAR. It never deletes anything, and its own
      header says why: recovering disk never justifies risking unpublished work.
      Wired 2026-08-15 because it was invoked by NOTHING. The tool and its 650-line battery each had
      exactly one reference in the whole tree -- themselves -- so neither had ever run, while this
      seat spent an afternoon doing that census by hand at 105 worktrees and 86% disk. The lesson is
      the day's constant: the instrument existed, the cable did not.
      ITS BATTERY: corrected here, because the first reading was published and was wrong. One run
      answered 13 ok and 1 not ok on special_paths, and that was written into this description as the
      battery's state. Three runs immediately after answered 17 ok and 0 not ok -- and the CASE
      COUNTS DIFFER, 14 against 17, with invalid_size_output, local_process_cwd and stash_guard
      absent from the first. So those were not two results of one battery: they were two different
      sets, because the battery adapts to its environment, and the first ran while this container
      held 105 worktrees, live processes with their cwd inside them and a foreign stash in the clone.
      The failure is not reproducible and is not a code defect. It is also not nothing: a battery
      whose verdict depends on ambient conditions is one an intermittent red would teach a lane to
      ignore, which is why it runs HERE, beside the report, rather than as a gate on the push path.
    cmds:
      - bash scripts/test-hub-hygiene.sh
      - bash scripts/hub-hygiene.sh --dry-run

  lint:release-disk-floor:
    desc: >-
      REL-56 — el suelo de disco de release.yml, ejercitado con `df` señuelo. Fija que un `df`
      que SALE 0 y no trae dígitos REHÚSA: dejaba `after` vacío, el pipeline salía 0 (ni
      `pipefail` ni `set -e` lo ven) y `[ "" -lt 20480 ]` devuelve 2, que en la condición de un
      `if` no dispara `set -e` — se tomaba el `else` y el suelo quedaba satisfecho por una
      medida que no existe. Extrae el bloque `run:` del workflow commiteado, no lo copia.
    cmds:
      - bash scripts/test-release-disk-floor.sh

  lint:run-block-syntax:
    desc: >-
      a repository gate — que el shell de cada bloque `run:` de un workflow PARSEE. El 2026-08-29 un `if …
      else …` sin su `fi` mato al job `hook-only-legs` en su estreno (run 33284926144) con exit 2
      y NI UNA LINEA de salida: bash sale 2 ante un error de sintaxis y no imprime nada del guion.
      El job midio 1 de 14 pasos. NADA en el arbol podia verlo — `lint:actions` corre actionlint,
      que valida el WORKFLOW y no el shell de dentro de `run:`, y se cito como testigo de ese paso
      en commit tras commit estando verde. Sin esto, un error de sintaxis en un `run:` solo se
      descubre CUANDO ESE JOB CORRE, que para release.yml es el dia del release. 1,9 s sobre 277
      bloques (medido 2026-08-30). Las expresiones de GitHub se sustituyen por un token antes de
      parsear: es un limite declarado, no una omision. (No se escriben aqui con sus llaves porque
      go-task las lee como PLANTILLA y la tarea muere con «missing value for command» — la misma
      clase que este gate vigila: un literal que significa algo para la herramienta.)
    cmds:
      - bash scripts/check-run-block-syntax.sh
  lint:run-block-syntax:selftest:
    desc: >-
      a repository gate — bateria: el defecto REAL (`if` sin `fi`, con su id nombrado), la direccion de no
      disparo con una expresion de GitHub DENTRO de un heredoc y como comando entero, el shell
      no-bash omitido y
      DECLARADO, el shell del job frente al del paso, cero bloques -> 2, YAML ilegible -> 2.
    cmds:
      - bash scripts/test-run-block-syntax.sh
  lint:conflict-markers:
    desc: >-
      Refuse a tree that still carries merge conflict markers. Written 2026-08-15 after a
      composition where `git merge` reported ONE conflicted file and FOUR had markers: the other
      three were produced without the paths being flagged, `git add -A` then marked them RESOLVED
      with the markers inside, and `git commit` accepted it. What stopped that push was luck
      wearing the costume of a control -- one file was a shell script, so `<<<<<<<` was a syntax
      error and the lint that ran it exited 2. In Markdown, YAML, JSON or a Go comment the push
      would have been GREEN. The census is the index PLUS unignored working files, so the author
      staging a bad resolution is covered and another lane's scratch worktree is not. The triple
      must appear IN ORDER, or every document with a setext underline becomes a false positive and
      the gate gets deleted for crying wolf. Eleven cases; four mutations, four reds.
    cmds:
      - bash scripts/test-conflict-markers.sh
      - bash scripts/check-conflict-markers.sh

  lint:pin-distance:
    desc: >-
      The distance between a superproject's submodule pin and the branch that tree comes from.
      Written 2026-08-15 because both sides of that seam were green and both were telling the
      truth: the enterprise CI honestly measures what it assembles, the hub gate honestly
      measures the hub, and NOBODY measured the gap — so the binary we sell was being built from
      a hub tree pinned at 08-08, 2083 commits back, declaring `toolchain go1.26.5`, i.e. with
      the seven CALLED vulnerabilities #775 had closed the night before. A stale pin does not
      fail; it checks out, it compiles and it ships.
      HERE this runs only the battery: the hub has no submodule of its own, so the check itself
      belongs in the enterprise workflow (`public/scripts/check-submodule-pin-distance.sh`, and
      `--release` on the release job, where the pin must BE the audited tree rather than
      approximately it). Running the battery in the hub is not ceremony — the gate's own
      `rev-parse` bug, which made it answer STALE for a branch it had never found, was caught by
      this battery and by nothing else.
    cmds:
      - bash scripts/test-submodule-pin-distance.sh

  lint:release-version:
    desc: >-
      One first-release version, stated everywhere or nowhere: every product-version-shaped
      token (CalVer vYY.M.PATCH) on a release-bearing surface — README ×7, CHANGELOG,
      docs-site install/verify pages, trust and launch material — must equal the canon in
      RELEASE-VERSION or a derived form (-fips/-stig image variants, the next-patch upgrade
      example). Since 2026-08-14 it also walks the SHIPPED COORDINATES that documentation
      cannot show: deploy/ (the chart appVersion that a default helm install resolves, and
      the generated kubectl manifest), packaging/ (the Docker Hub page uploaded verbatim at
      release) and operator/ — the three roots that were declaring 26.7.0 while this gate
      printed OK for a v26.8.0 canon. docs/ is WALKED too, not listed: top-level docs/*.md
      was in neither arm, so 46 stale tokens in 7 files sat green — including the runbooks
      that cut the tag and the upgrade guide a customer follows. Dated ADRs and archived
      records stay out by directory, because sweeping a record falsifies it.
      Compatibility floors (`olivares >= X`, `--min-version`, an advisory's `introduced`)
      are NOT swept to the canon; they are checked against the invariant that a floor may
      never exceed it, and the allowance is scoped to the TOKEN, not the line — an advisory
      writes `introduced` and `fixed` together and only the first of them is a bound.
      An empty or shrunken walk is UNVERIFIED + exit 2, never green. While the canon is
      UNDECIDED (the choice is the owner's) this prints the divergence census and exits 0 —
      the lint:commerce report-mode precedent; the moment a version is written it enforces.
      Red-fixture battery runs first.
    cmds:
      - sh scripts/check-release-version.sh --selftest
      - sh scripts/check-release-version.sh

  lint:release-diagrams:
    desc: >-
      Fail when the four public diagrams in .github/assets (and their docs-site copies) are not
      what scripts/gen-release-diagrams.mjs produces. The predecessor set had no regeneration
      path at all, so its output and its source could only drift and nobody could tell that they
      had — the same defect the assets ledger records for the P04 set. The generator also refuses
      to emit at all when a label would spill out of its node, when a text pair measures under
      4.5:1 against the surface it sits on, or when a composition carries more than one accented
      element. Three answers by exit code: 0 clean, 1 the tree differs from its source, 2 the
      source could not be read. Zero dependencies (node stdlib only), ~140 ms.

      Its battery runs FIRST, the way lint:guide-docs runs its --self-test: seven mutants, each
      building a scratch tree, changing exactly one input and running the program in it. The
      unmutated case leads, because a battery of refusals proves only that the program can fail.
      It is one task and two commands ON PURPOSE — a second `lint:` leg would have to be declared
      in the hook's call list, in its FAST banner and in FAST_LINTS, and that triple is what cost
      a 157-minute push on 2026-08-29.
    cmds:
      - node scripts/gen-release-diagrams.mjs --selftest
      - node scripts/gen-release-diagrams.mjs --check

  lint:guide-docs:
    desc: >-
      Fail when the console reference, the gRPC reference or the upgrade guide's claims disagree
      with the tree. Promovida desde lint:public-counts: NECESITA el compilador de
      TypeScript para volcar las rutas de consola, y el carril rapido no puede correr node — en
      un worktree recien creado el delegado decia CANNOT LOOK y tumbaba el push de cualquiera.
      Va en el carril PESADO, al lado de lint:format-ratchet, y en mainline-ci con las deps que
      ese job ya instala. El gate no cambia: conserva su --self-test y su 1-vs-2.
    cmds:
      - bash scripts/check-guide-docs.sh --self-test
      - bash scripts/check-guide-docs.sh

  lint:public-counts:
    desc: >-
      The numeric-truth gate: derive the public counts — modules, integrations, framework
      catalogs, enforcement points — from the tree itself and FAIL if any public surface
      states another value or hedges one. Covers the README family ×7 (localized
      digit-noun pairs), docs-site live content and sidebar labels, trust docs, launch
      material where present, the assets ledger's latest declaration, and the launch
      reel: its baked scene data, its spelled-out EN/ES subtitle numbers, and rendered
      masters pinned to a content-hash provenance manifest written by the pipeline
      itself. Dated history (frozen snapshots, ADRs, and a VERSIONED allowlist of
      `counts-gate: historical-quote` lines) is exempt explicitly, never silently.
      Runs its red-fixture battery first — the properties that matter are the red ones,
      and this gate's first version passed seven adversarial mutations.
    cmds:
      # AND the THREE-ANSWER battery (C15-P6). The red-fixture battery above proves the gate
      # catches wrong figures; this one proves it does not answer «wrong figure» to an ABSENCE.
      # The gate's prose already said so — «an unmeasurable claim is not a passing one» — while
      # `sys.exit("FAIL …")` returned 1, which in this repo means a public claim is FALSE. It
      # carries its own negative control: breaking a real figure must still exit 1, or a gate
      # that returned 2 for everything would pass the whole battery.
      - bash scripts/test-public-counts-verdicts.sh
      - sh scripts/check-public-counts.sh --selftest
      - sh scripts/check-public-counts.sh

  lint:boundary:
    desc: >-
      Enforce that the Apache SDK/connectors never import the AGPL engine, then assert
      that this gate and its tool-dependent siblings FAIL CLOSED. The second command
      costs a second and exists because on 2026-08-01 both this gate and the
      release-blocking vulnerability gate were measured approving with their tool
      unavailable — `PATH=/usr/bin:/bin bash scripts/check-boundary.sh` printed
      "Boundary check OK" after inspecting zero packages.
    cmds:
      - bash scripts/check-boundary.sh
      - bash scripts/test-gates-failclosed.sh fast

  cosign:guard:
    desc: >-
      Install the cosign containment shim, which REFUSES any cosign command that could
      write to the public Sigstore transparency log, then assert it is active. It does not
      cover absolute paths, `command -p` or shells that never exported its directory.
    cmds:
      # Directory is overridable for machines laid out differently; the default matches
      # the dev container. Resolved in shell, not in a go-task template, so a quoted
      # default cannot break the parse.
      - bash scripts/cosign-guard.sh --install "${OLIVARES_GUARD_DIR:-/workspace/.tools/bin-guard}"
      - bash scripts/test-cosign-guard.sh
      # ACTIVATION IS ASSERTED, NOT ASSUMED. Measured 2026-07-25: go-task 3.51.1 cannot
      # override PATH from `env:` at global OR per-task scope — a sibling variable in the
      # same block received its templated value while PATH passed through unchanged. Only
      # an in-command prefix works, which is what scripts/with-cosign-guard.sh does and
      # what this line proves before setup is allowed to report success.
      - PATH="${OLIVARES_GUARD_DIR:-/workspace/.tools/bin-guard}:$PATH" bash scripts/cosign-guard.sh --status

  cosign:guard:test:
    desc: Prove the containment properties of the cosign guard (hermetic, no network).
    cmds:
      - bash scripts/test-cosign-guard.sh

  cosign:contract:
    desc: >-
      Prove the installed cosign honours this repository's signing contract — key
      sign-blob/verify-blob and attest-blob/verify-blob-attestation with the transparency
      log disabled. Runs THROUGH the containment shim, whose activation is asserted first.
    cmds:
      # The fixture signs, with a throwaway key and --tlog-upload=false. Running it under
      # the guard is deliberate and is the reason the guard permits provably-contained
      # signing instead of denying every publisher: a containment that forces the fixture
      # off would be switched off itself. The wrapper proves the shim is actually on PATH
      # before the first signature is produced.
      - bash scripts/with-cosign-guard.sh bash scripts/check-cosign-contract.sh

  lint:actions:
    desc: >-
      Validate every GitHub Actions workflow with actionlint (pinned), plus the
      self-hosted toolchain gate. The local gate never parses workflows — only
      GitHub does — which is how an invalid job-level runner-context expression
      shipped to main on 2026-07-30 and turned every push into an instant startup
      failure. Same day, second class: jobs assumed the runner ships node
      preinstalled (true of ubuntu-latest, false of a bare self-hosted runner), so
      control-plane died at 'console i18n parity' and no required context could
      report. Both classes are closed here.
      Also runs lint:ci-ports (the port policy rides with workflow validity).
    cmds:
      # BOTH extensions, and a refusal when there are none. GitHub Actions accepts
      # *.yml AND *.yaml; a bare `*.yml` glob silently skips every *.yaml sibling in
      # a mixed directory, which is a linter reporting clean on files it never read.
      # (An ALL-yaml directory was already safe here — the unexpanded glob makes
      # actionlint exit 1, measured — but "safe by accident in one of two cases" is
      # not a property worth relying on.) The explicit zero-file refusal is the same
      # third answer check-workflow-node-setup.sh gives: could not look ≠ clean.
      - >-
        bash -c 'shopt -s nullglob;
        wf=(.github/workflows/*.yml .github/workflows/*.yaml);
        if [ ${#wf[@]} -eq 0 ]; then
        echo "lint:actions: no workflow files found — refusing to report clean" >&2; exit 2; fi;
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 "${wf[@]}"'
      - bash scripts/check-workflow-node-setup.sh
      # NOTE on placement: in mainline-ci `task lint:actions` runs inside the
      # control-plane job — the job that DIES at "Initialize containers" when a
      # host-port bind fails, i.e. the CI copy of this gate can never witness the
      # failure it exists to prevent. For that regression the pre-push invocation
      # of this task is the effective line of defense (spec §4).
      - task: lint:ci-ports

  check:d1-trunk-parity:
    desc: >-
      Release criterion C-10: can the TRUNK reproduce the D1 schema it deploys against? Measured
      2026-08-17 and it cannot -- production had 13 migrations applied and main 9, with four applied
      whose SQL is absent from the trunk. Git cannot see this: the files are not in main, so there is
      no conflict and no diff. The only way to know is to ask the DATABASE. NOT a push gate: it makes
      a network call to production and only the hub holds the token. Its caller is a person running
      the release checklist, and saying otherwise would be worse than admitting it. ~3s.
    cmds:
      - bash scripts/hub-leg.sh check:d1-trunk-parity scripts/check-d1-trunk-parity.sh

  publish:enterprise-artifacts:
    desc: >-
      INT-15: uploads to R2 what the download gate expects to serve. Measured 2026-08-17 against the
      Cloudflare API with two independent endpoints, both http 200: all three enterprise buckets report
      objectCount=0, and the SAME endpoint on an unrelated bucket with content reports 248, so the zero
      is a measurement and not a broken probe. A grep for any upload form over workflows and scripts
      returned ZERO matches: the publication step did not exist, so a customer pays, gets a licence, and
      there is nothing to download. UPLOADS NOTHING without --apply: publishing is a deploy-class action
      and those are authorised by the owner. Idempotent, IMMUTABLE (an existing object with different bytes is
      REFUSED, never overwritten) and verified by reading each object back after the put.
      ⛔ ESTA TAREA FUERZA `OLIVARES_REQUIRE_MANIFEST_SIG=1`, y no es cosmético. La afirmación de la
      firma vive dentro del condicional del ancla, así que un guion invocado SIN ancla ni REQUIRE
      sube objetos sin haber afirmado nada (contraste `sol max` 2026-08-29: `--apply` + objeto
      ausente + REQUIRE≠1 + ancla vacía → salta el bloque y ejecuta el `put`). El workflow ya lo
      fuerza; el camino de PERSONA es éste, y ahora también. La batería sigue invocando el guion
      directamente, que es donde esa permisividad se necesita para cubrir inmutabilidad y relectura.
    cmds:
      - OLIVARES_REQUIRE_MANIFEST_SIG=1 bash scripts/hub-leg.sh publish:enterprise-artifacts scripts/publish-enterprise-artifacts.sh {{.CLI_ARGS}}

  test:publish-enterprise-artifacts:
    desc: >-
      The publisher's battery, against a FAKE wrangler that implements an object store in a directory:
      it proves the guarantees with no network and no R2. 24 checks -- dry-run writes nothing,
      idempotence, the immutability refusal leaving the remote byte-identical, a put that lies caught by
      the read-back, a broken get answering "could not look" instead of "absent", zero artifacts refused
      rather than passing silently, and the keys matching artifacts.ts/manifests.ts exactly.
    cmds:
      - bash scripts/hub-leg.sh test:publish-enterprise-artifacts scripts/test-publish-enterprise-artifacts.sh

  check:commerce-preflight:
    desc: >-
      Can this environment DELIVER what it is about to CHARGE? Measured 2026-08-17 from the live worker
      configuration: production's DODO_CATALOG holds twelve sellable items and its PRODUCT_MAP is EMPTY,
      and products.ts fails closed -- an id absent from the map never becomes an entitlement. So the only
      thing preventing charging without delivering is that FULFILLMENT_ENABLED is off. It charges ONLY
      the dangerous combination (selling enabled and unable to deliver); with selling off it reports what
      is missing and exits 0, because an environment that does not sell cannot mis-sell and reddening
      there teaches people to ignore it. Also checks ENTERPRISE_VERSION has the project shape (0.0.0 is
      the exact value release-version.ts exists to reject) and, when selling a real version, that at
      least one object exists in R2 for it. Human-called: it queries live config and R2.
    cmds:
      - bash scripts/hub-leg.sh check:commerce-preflight scripts/check-commerce-preflight.sh {{.CLI_ARGS}}

  check:published-domains:
    desc: >-
      Does every domain the PRODUCT publishes as a URL actually exist? Re-measured 2026-08-19:
      docs.olivares.ai is not merely unreachable, it is WITHDRAWN -- an independent resolver returns
      NXDOMAIN while the same getent run resolves olivares.ai, alma. and licenses. That calibration is
      the point: a bare 000 from this container once caused a WORKING canonical to be deleted (see
      scripts/check-security-txt.sh), so five samples of one probe are not evidence -- a positive control
      on sibling hosts plus a second resolver are.
      FIGURES WITH THEIR REFERENT, because the previous ones had none: over the export manifest (7912
      paths), counting URL form, main carried 45 files / 85 occurrences before the 2026-08-19 sweep and
      carries 6 after it -- re-measured on main the moment this line landed. Each of the 6 has a
      written reason: the archived 2026-06 snapshot (2 files), deploy-time site config, the two
      gates' own measurement records, and one history note in topbar.tsx recording what the host
      used to be. The figure was 7 until the console fix took the built bundle off the list, which
      is why a count in prose is only true as of a commit and this one says so.
      The earlier text said "the real count is 137", and that number REPRODUCES IN NO POPULATION tried --
      URL or bare host, files or occurrences, manifest or whole tree -- so it is retired rather than
      copied forward. It also said a client package's npm homepage was affected;
      clients/typescript/package.json already reads https://olivares.ai/docs.
      The denominator is DERIVED from the exporter manifest, so it cannot age on its own, and it counts
      only URLs: two earlier versions produced false positives on Kubernetes API groups
      (health.olivares.ai, ops.olivares.ai), which are not hostnames and which no generic boundary can
      separate from a URL. It does NOT choose the destination -- subdomain or path is a product decision.
      Human-called: it does DNS, which is exactly why it is not in the fast lane.
    cmds:
      - bash scripts/hub-leg.sh check:published-domains scripts/check-published-domains.sh

  check:claims:
    desc: >-
      Crosses the LIVE integration claims against their written adjudication in
      sessions/status/claims/. Measured 2026-08-17: the only rule was prose saying "wait if a claim is
      under 3h", so by omission a claim OVER 3h read as abandoned -- and one claim had been held for
      three and a half days WITHOUT being abandoned, because its lane was paused deliberately.
      Raising the threshold does not fix it: a STOPPED lane cannot declare itself paused, so the state
      must be recordable by someone else (the integrator) or never at all. What this charges is a live
      claim with NO adjudication -- not a claim being old, since a legitimately paused one will be old
      for days. NOT a push gate: it queries the remote, and only the integrator adjudicates. Use
      --local for a network-free (and explicitly STALE) reading.
    cmds:
      - bash scripts/hub-leg.sh check:claims scripts/check-claims.sh

  check:worktree-push-free:
    desc: >-
      Does THAT worktree have a push in flight? 0 free, 1 push alive so it is READ-ONLY, 2 could not
      look. `check:` and not `lint:` on purpose: it is a TOOL for the operator, not a gate on the tree.

      ⛔ IT IS NOT WIRED INTO pre-push, and that is a condition of its adjudication (the planner,
      2026-08-25T23:50Z), not an oversight: during a push there is ALWAYS a push in flight on that
      worktree -- its own -- so a gate calling this from the hook would return 1 on every legitimate
      run. It is invoked BY HAND before editing, or by a push harness as its layer 0.

      ⚠ AND THE THREE ANSWERS DO NOT SURVIVE THIS WRAPPER. `task` flattens every failure to 201
      (measured in this repo with a decoy Taskfile: `exit 1` and `exit 2` both come out 201), so a
      caller that needs to tell "push alive" from "could not look" must invoke the SCRIPT, not the
      task: `bash scripts/check-worktree-push-free.sh <worktree>`. The task is for a human reading
      the message; the script is for anything that branches on the code.

      Why it exists, measured: editing a worktree while its own push is in the gate does two
      distinct damages. `check-tree-untouched` compares the tree at start and end, sees the edit and
      blames a gate -- "no es tuyo", it prints, and it was; the push dies rc=1 on a false cause. And
      git transfers the ref RESOLVED AT TRANSFER TIME, not the sha the hook gated, so the commit
      added on top ships with no fast-lints. the orchestrator broke this rule THREE times in one night
      after writing it down and warning the other four lanes -- which is the argument for a check
      rather than for more care.
    cmds:
      - bash scripts/check-worktree-push-free.sh {{.CLI_ARGS}}

  check:worktree-push-free:battery:
    desc: >-
      Six cases, and the one that matters is the RED one: a green over a tree with no processes would
      also be given by a guard that looks at nothing. The battery FABRICATES a push -- a process whose
      argv carries `olivares-prepush` and whose /proc/<pid>/cwd is the worktree -- which forces an
      EXECUTABLE directory, because /tmp is noexec on these boxes and the decoy would die 126, read
      as "no push". It uses olivares_pick_exec_workdir, which does not CHOOSE a directory: it PROVES
      it can create and execute in one. ~2s, hermetic.
    cmds:
      - bash scripts/test-worktree-push-free.sh

  check:deployed-config-drift:
    desc: >-
      Does the DEPLOYED licence worker carry what the repository declares? Not fast-lane: it queries the
      Cloudflare API, so it needs network and a token, and without one it exits 2 rather than 0. Written
      2026-08-17 after measuring both sides for the first time: production shows FIVE drifts and sandbox
      THREE, including variables the repository declares and the deployment does not have at all
      (ISSUER_PURPOSE, LICENSE_KEY_EPOCH, DODO_PORTAL_URL). The one that mattered most: the repository
      maps 12 of 12 catalogue ids while the live worker answers PRODUCT_MAP={"products":{}} -- so the
      blocker recorded as "the map still has to be written" was mis-measured, and is a deployment step
      rather than an authoring one. Same family as dashboard-set secrets creating a version nobody
      deploys. Three answers, and fewer than five readable variables is COULD NOT LOOK, never clean,
      because a verdict over zero variables passes by vacuity. Usage: `bash
      scripts/check-deployed-config-drift.sh <sandbox|production>`.
    cmds:
      - bash scripts/check-deployed-config-drift.sh sandbox

  lint:baseline-shrink:
    desc: >-
      Fast lane, pure git: if a push REMOVES entries from a ratchet baseline, it must also touch
      something it removes. A commit that only deletes lines is indistinguishable from silencing the
      gate. Written 2026-08-18 and paid for with main red for all five lanes: the translation-drift
      baseline landed at 75 entries, a branch then committed "tighten the drift baseline from 75 to 35"
      touching EXACTLY ONE FILE with 40 lines removed and zero translations retranslated, and merging it
      made the ratchet redden on files nobody had touched -- all 40 were still drifted that same day.
      What makes that failure expensive is WHEN it shows: on the branch the gate is green, because
      baseline and tree agree there; it reddens on LANDING, where it already blocks everyone, and the
      person who wrote it is not the one who pays. It does not judge whether an entry DESERVED to go --
      that needs reading each ratchet's subject and belongs to its owner. Three answers, and a missing
      trunk is COULD NOT LOOK rather than clean.
    cmds:
      - bash scripts/check-baseline-shrink.sh

  lint:relay-pointer:
    desc: >-
      Fast lane, pure filesystem: the live-relay pointer in an internal mailbox must name a file
      that EXISTS and is the HIGHEST-numbered relay on disk. That section declares itself the single
      source of truth and says whoever writes a new relay changes the line in the same commit -- and it
      was broken TWICE IN A ROW, pointing at RELEVO19 for three days while 21 and 22 both existed. The
      text that fixed it named the cause better than a gate description can: the defect is not the stale
      pointer, it is that updating it depends on the writer REMEMBERING, and two of two did not. It
      judges nothing about the relay's CONTENT -- only whether the pointer names the newest file, which
      is a total predicate. Three answers, and zero relays on disk is COULD NOT LOOK, never clean.
    cmds:
      - bash scripts/check-relay-pointer.sh

  lint:session-record:
    desc: >-
      Fast lane, pure git: a branch that changes CODE must add or update a file under sessions/. A PR
      with no session record cannot be attributed to a lane, and the whole claim protocol rests on
      attribution. Written 2026-08-17 out of a finding the integrator got WRONG: a CLI branch carried
      no session file, its owner was inferred from the contents, and a duplicated-work finding went to
      two mailboxes claiming two lanes had spent two days building the same bootstrap. They were
      SIBLING BRANCHES OF ONE LANE executing that lane's own relay, and the planning lane refuted it
      from the tree. Detecting
      "duplicated work" needs judgement and this does not pretend to it; "this branch changed Go and
      touched nothing under sessions/" is a total predicate, so that is what it checks. Three answers:
      0 clean, 1 code with no record, 2 could not look — and a MISSING trunk is 2, never 0, which is
      the shape that made a sibling gate report CLEAN in CI where actions/checkout leaves no
      origin/main. Generated console bundles are excluded (an artefact of building, not authorship) and
      its battery has the mutant proving that exclusion does not swallow every .js in the repository.
    cmds:
      - bash scripts/check-session-record.sh

  lint:session-record:selftest:
    desc: >-
      The battery for lint:session-record: eight cases over REAL throwaway repositories, each red case
      carrying a mutant leg that must flip it green, because a guard whose removal changes nothing was
      never testing anything.
    cmds:
      - bash scripts/hub-leg.sh lint:session-record:selftest scripts/test-check-session-record.sh

  lint:web-bundle-freshness:
    desc: >-
      Fast lane, pure git, no build: if a push changes console sources that DO ship in the bundle and
      does not change core/internal/webui/dist, it says so here instead of two hours later on main. The
      embedded bundle fell behind FOUR times on 2026-08-17, each time reddening the `web` job on main --
      the trunk of five lanes -- and each time the fix was the same one-line command. A failure that
      repeats four times in a day and is always fixed identically is not carelessness: it is a missing
      gate. NECESSARY condition, not sufficient: that the bundle changed would not prove it is the right
      bundle, and only `task web:check` proves that by rebuilding, which is why that one stays heavy.
    cmds:
      - bash scripts/check-web-bundle-freshness.sh

  lint:push-preflight:selftest:
    desc: >-
      Trece casos de scripts/check-push-preflight.sh, el guion que mira el árbol ANTES de arrancar
      un push en vez de descubrirlo al final. Existe por una medida del 2026-08-26: un push murió a
      1h48 porque un gate reconstruyó core/internal/webui/dist mientras lo comprobaba, y el residuo
      seguía en su worktree horas después, así que el re-push habría muerto igual. La comprobación
      cuesta un segundo. El selftest lleva control positivo (un árbol limpio DEBE dar 0, o un guion
      que siempre dijera «sucio» pasaría) y dos casos de «no he podido mirar», que nunca son limpio.
      No se re-invoca por "$0": ese modo de fallo convierte un TMPDIR noexec en «todo en rojo».
      Tres casos adicionales demuestran que la poda TMP retira sólo raíces viejas y muertas, preserva
      una vieja usada como cwd por un proceso vivo y también preserva cualquier raíz todavía joven.
    cmds:
      - bash scripts/check-push-preflight.sh --selftest

  race:report:
    desc: >-
      La tabla que rellena el acta: lee por API los jobs de una corrida de race-full y da, por
      grupo, duración del PASO (no del job), techo leído de scripts/race-groups.json, margen, % del
      techo y veredicto POR PASOS. `cancelled` nunca es verde — y se distingue el cancelado EN SU
      TECHO (muerte por tiempo) del cancelado DESDE FUERA, porque en la corrida 33305274935
      race-root salió cancelled al 56 % de su techo y llamarlo «se agotó» mandaría a subir un techo
      que no era el problema. De race-root, si el artefacto está, saca los tests más lentos y —lo
      que de verdad falta para la cuenta del reloj— cuánto tardó la COMPILACIÓN con -race.
      Uso: task race:report -- <owner/repo> <run_id>
    cmds:
      - bash scripts/race-full-report.sh {{.CLI_ARGS}}

  lint:race-report:selftest:
    desc: >-
      Doce casos sobre DOS fixtures: uno REAL guardado de la corrida 33305274935 tal y como lo
      devolvió la API —para que el banco no se escriba contra una API imaginada— y uno de matriz con
      la misma forma de campos. Varios MUTAN EL GUION, no el fixture: el central prueba que leer
      `cancelled` como verde CAMBIA el veredicto, y su gemelo enseña el fallo concreto que evita —
      con ese mutante, la corrida real publicaría race-root como VERDE. Lleva control positivo (una
      corrida sana sale CLEAN, o un guion que siempre dijera «rojo» pasaría) y comprueba que la
      duración sale del paso y no del job, y que el techo se LEE de la spec.
    cmds:
      # export-closure: hub-only scripts/test-race-full-report.sh — sus fixtures viven en
      # `test/fixtures/race-full-report/*.json` y esta curacion retira `test` ENTERO
      # (scripts/export-public.sh). Uno es la captura real de la corrida 33305274935 de este
      # repositorio: no es material publicable, y sin el la bateria no tiene con que correr.
      # Guardada como sus hermanas, para que en el arbol publicado la pata NOMBRE la razon en
      # vez de morir con exit 127. El guion que prueba, `race-full-report.sh`, SI viaja: lee
      # por API y no toca `test/`.
      - bash scripts/hub-leg.sh ci:race-full-report:selftest scripts/test-race-full-report.sh

  lint:mcp-pinned-schema:
    desc: >-
      El esquema MCP FINAL pinado vive en design/specs/ (original curado, NO viaja) y en
      cmd/olivares/testdata/ (la copia que lee el test, que SI viaja). Este control ata las dos para
      que no deriven. Existe por el primer fallo de test real de la race-full publica: el test abria
      ../../design/… sobre el arbol exportado, donde design/ no esta, y moria con «no such file» tras
      23 min de job, 0 DATA RACE y sin timeout.
    cmds:
      # export-closure: hub-only scripts/check-mcp-pinned-schema.sh — compara contra design/, que
      # el export retira; alli su ausencia es correcta y su pata NOMBRA la razon.
      - bash scripts/hub-leg.sh ci:mcp-pinned-schema scripts/check-mcp-pinned-schema.sh

  lint:race-groups:
    desc: >-
      El control de UNIÓN del reparto de race-full: cada paquete con tests del workspace pertenece a
      EXACTAMENTE un grupo de scripts/race-groups.json, ningún patrón está rancio, ninguno está
      declarado en dos grupos, y cloud_task_group nombra un grupo que existe. Existe porque el
      barrido corría en UN paso y murió en el techo de los 75 min con catorce paquetes verdes y
      finops/governance sin empezar — y porque partirlo en jobs sólo es seguro si algo comprueba que
      los trozos suman el todo. Un paquete fuera de todos los grupos saldría VERDE sin haberse
      corrido, y release.yml publica binarios sobre ese verde. Corre en el propio workflow (job
      `setup`) antes de gastar siete Postgres.
    cmds:
      - bash scripts/race-groups.sh check

  lint:race-groups:selftest:
    desc: >-
      Once casos con mutantes sobre el reparto: un grupo entero retirado deja 178 paquetes huérfanos,
      y —el caso que de verdad importa— UN SOLO paquete descubierto también muere, porque un control
      que necesita un agujero grande para verlo no sirve. Además: patrón rancio, exclusión rancia,
      patrón duplicado en dos grupos, el grupo del `task test:cloud` renombrado (que desactivaría esa
      pata EN SILENCIO, porque un `if:` que no casa se salta y saltarse se lee como verde), grupo
      desconocido separado de grupo vacío, spec ausente como COULD NOT LOOK, el ensamblado de la
      orden y que el -timeout de Go quede POR DEBAJO del techo del paso — que es exactamente como
      murió race-root a los 152 minutos, mudo.
    cmds:
      - bash scripts/test-race-groups.sh

  lint:hub-web-fidelity:
    desc: >-
      INT-05: runs the web repo's hub-fidelity RE-DERIVATION, which until now ran nowhere
      automatic. The web repo's own build checks the snapshot CONTRACT (shape, digests, freshness)
      and says so itself: source re-derivation runs in npm test with the hub present. Each repo's CI
      checks out only one tree, so this workspace is the only place the live comparison can happen --
      the same reason lint:brand-parity lives here. Cost of nobody running it, measured 2026-08-14:
      six fidelity checks red and the evaluator-facing OpenAPI spec 151 lines behind. ~2s.
    cmds:
      - bash scripts/hub-leg.sh lint:hub-web-fidelity scripts/check-hub-web-fidelity.sh

  lint:docsite-versions:
    desc: >-
      Crosses VERSIONS in docs-site/src/site-locales.mjs against the snapshot directories under
      docs-site/src/content/docs, BOTH ways. Measured with a mutant on 2026-08-24: an invented slug
      with no directory left lint:docs-parity, lint:i18n-anchors and lint:adr-sync all green
      (that third gate was withdrawn on 2026-08-25 with the ADR section it guarded; the
      measurement stands as taken, and lint:adr-not-published replaced it).
      check-docs-parity validates the manifest's INTERNAL consistency (ARCHIVED_SLUGS vs VERSIONS)
      and never checks that a slug has content. Unwatched, starlight-versions publishes a selector
      entry that 404s, or an archived snapshot drops out of the selector and becomes unreachable.
      It matters now because the T3 version cut is the operation that adds an entry to that list.
    cmds:
      - bash scripts/check-docsite-versions.sh

  lint:docsite-versions:selftest:
    desc: Seven cases, including both mutants — a declared slug with no directory, and a snapshot nobody declares.
    cmds:
      - bash scripts/check-docsite-versions.sh --self-test

  lint:docs-redirects:
    desc: Las redirecciones de cortesia de docs-site apuntan a paginas que existen.
    cmds:
      - bash scripts/check-docs-redirects.sh
  lint:docs-redirects:selftest:
    desc: Selftest de check-docs-redirects (mutantes y controles negativos).
    cmds:
      - bash scripts/test-docs-redirects.sh
  lint:classify-allowlist:
    desc: >-
      Guards the `case` arm in mainline-ci's `classify` job -- the one list that can switch off nine
      gated jobs silently, because a SKIPPED job is not a red one. Refuses an allowlist entry that
      something depends on, asking the only question that decides: is it read by anything that STOPS
      RUNNING when the job is skipped? Two branches: a script is a hole if mainline-ci invokes it and
      the fast-lints do not; a _test.go is a hole if it ESCAPES its directory with ../ to that path,
      because tests only run in the gated jobs. Measured 2026-08-24: of 56 design/ mentions in tests
      exactly ONE escapes -- commercial/commerce-lint/canon_test.go:12, ../../design/PRICING-CANON.md
      -- and it runs under test:commerce-core inside race-rest, which IS gated. That is why design/*
      stays out. Set OLIVARES_CLASSIFY_WF to point it at a mutated workflow and prove it can go red.
    cmds:
      - bash scripts/check-classify-allowlist.sh

  lint:classify-allowlist:selftest:
    desc: Nine cases, including a mutant that forgives design/* and must go red naming canon_test.go.
    cmds:
      - bash scripts/check-classify-allowlist.sh --self-test

  lint:md-links:
    desc: >-
      Ratchet over RELATIVE markdown links, images and HTML src attributes that resolve to nothing.
      Born as the export leak gate's missing leg -- a shipped document linking to a path the curated
      export dropped renders a 404 exactly where the public repo tries to prove a claim. It existed,
      hardened, self-testing and WITH ZERO CALLERS until 2026-08-26, and its main() returned 0
      unconditionally, so wiring it as-is would have produced a permanently green gate. Scoped to the
      TRACKED set (this box holds 26363 markdown files under .claude/worktrees against 4417 tracked)
      and to RELATIVE targets (absolute ones are Starlight routes that resolve at build time, 7670 of
      them). The baseline names the five live dead links with their owner and ratchets BOTH ways.
    cmds:
      - >-
        python3 scripts/check-md-links.py --tracked --routes
        --skip sessions --skip design --baseline docs/md-links-baseline.tsv .

  lint:md-links:selftest:
    desc: Self-test of scripts/check-md-links.py (exit code, tag context, code spans, tracked, routes).
    cmds:
      - python3 scripts/check-md-links.py --self-test

  lint:download-contract:
    desc: >-
      El contrato de la puerta de descarga que el ESPEJO necesita, `ci/download-contract.txt`, tiene
      que ser exactamente lo que sus fuentes dicen hoy — y se comprueba REGENERANDOLO, no leyendolo.
      Existe porque el overlay comprueba que su productor publica la clave que la puerta lee, y para
      eso necesita `commercial/license-worker/src/download/{artifacts,sets}.ts`; en el espejo
      publicado su `public/` apunta al export, que retira `commercial/` entero, y DOS de sus quince
      patas se quedan sin poder mirar (medido 2026-08-30: `lint:set-producer` era su unico rojo y
      `lint:release-manifests` habria caido detras). Los .ts NO viajan y no deben: son
      `LicenseRef-Olivares-Commercial` y `check-spdx.sh:58` dice «never exported». Viajan TRES
      HECHOS bajo AGPL. Y se regenera en vez de compararse consigo mismo porque `sets.ts:24-25`
      cuenta lo que cuesta lo contrario: 17 slugs en vez de 33, 404 para sus compradores, con el
      test en verde. 16 ms.
    cmds:
      - bash scripts/check-download-contract.sh

  lint:download-contract:selftest:
    desc: >-
      Cinco casos. El que justifica el gate es el tercero: se anade un slug a `sets.ts` y se exige
      que el gate lo vea — si sigue verde, es que compara el contrato contra su propia copia, que es
      exactamente el fallo que `sets.ts` documenta. Ademas: no-fire, el fichero versionado
      manipulado, y las dos formas de «no he podido mirar» (sin la fuente, sin el contrato). 117 ms.
    cmds:
      - bash scripts/test-check-download-contract.sh

  lint:claim-lector:selftest:
    desc: >-
      Banco de scripts/claim-lector.sh y de la guarda que el gancho corre ANTES de honrar el `skip`
      de un claim. El numero de casos NO se escribe aqui, y el porque esta en el commit que lo
      retiro: una cifra en prosa envejece sin que nadie toque el fichero. El generador es el
      propio banco; se lee ahi.
      Coste 7,3-9,3 s medido en TRES pasadas con load1 21 sobre cuota 4 —
      cinco veces la cuota—: en una caja tranquila baja, y por eso la cifra viaja con su carga. Lo
      caro NO es la guarda (296 ms una invocacion del gancho, 12 ms su `ls-remote`), es la
      contencion. Hermetismo IMPUESTO: transporte acotado a `file`, el remoto del banco se llama
      `banco` y no `origin`, y una fila de CONTROL exige que un intento de https muera POR EL
      PROTOCOLO y no por DNS. Cada rama nueva tiene su mutante y muere sola: movido-bajo-lector,
      señal-sin-fuente y autoridad-versionada. NO acredita que el mecanismo este adoptado.
    cmds:
      - bash scripts/test-claim-lector.sh

  lint:sigpipe-booleans:selftest:
    desc: >-
      Witness for the ratchet above, which had none while it decided pushes. A ratchet cannot
      verify its own probe: break the pattern and the census drops, NUEVOS comes out 0, and the
      gate says OK -- a broken detector and a clean tree produce the same line. Its only positive
      control ("zero matches AND no baseline" -> 2) fires solely when the baseline file is ABSENT,
      so today the entries of debt act as the witness by accident, and whoever pays that debt down
      removes it. The count is deliberately NOT written here: a figure in prose goes stale without
      anybody touching the file -- this description said 30 while the tree held 29, and the hook
      said 68 while it held 81. `--list` is the generator; read it there. This battery plants real pipes in throwaway copies and demands they be
      caught by name in all three forms (bare, `command grep`, `VAR=val`), and pins what must NOT
      fire: a file without pipefail, a comment quoting the form, and a `grep -q A || grep -q B`
      whose second bar used to be counted. It composes the planted pipes at RUNTIME, because
      written literally the ratchet catches its own battery.
    cmds:
      - bash scripts/test-sigpipe-booleans.sh

  lint:sigpipe-booleans:
    desc: >-
      Ratchet over `producer | grep -q PATTERN` inside files that set pipefail. grep -q exits at the
      first match and closes the pipe, so the producer dies of SIGPIPE and the pipeline returns 141
      EXACTLY WHEN IT SUCCEEDED -- an `if` reads that as false and declares absent what is present.
      It is a race decided by output size and machine load, which is why the same tree can be green
      locally and red in CI. Cost one day on 2026-08-17 through a REQUIRED context. Correct forms:
      `l="$(list)"; case "$l" in ...` or `grep -q X <(list)`. Use --list to seed or lower the floor.
    cmds:
      - bash scripts/check-sigpipe-booleans.sh

  lint:translation-drift:
    desc: >-
      Ratchet over translations that are OLDER than the page they translate. Parity gates already
      catch missing pages and unresolved keys; none of them sees a translation that exists and is
      stale, so a reader in that language sees an earlier product. Measured 2026-08-16: 834
      source-translation pairs, 75 stale. It does NOT measure meaning drift -- a file can be freshly
      committed and say the opposite of its source; that needs a reading pass, not a timestamp.
      Use --list to print the full census when seeding or lowering the baseline.
    cmds:
      - bash scripts/check-translation-drift.sh

  lint:phone-home-claims:
    desc: >-
      Ratchet over absolute "zero phone-home" promises on LIVE surfaces. The entitlement model
      permits phone-home, so a NEW absolute promise would state the opposite of what the product
      does. It does NOT forbid: it only stops the count from rising, and a count that DROPS is
      applauded, not reported as new (that inversion cost a red push on 2026-08-28). Surfaces are
      the docs-site, docs/, web/src AND the two that reach the customer -- email/copy and the
      license Worker's portal -- plus INSTALL/README/LICENSING; the frozen 2026-06 archive, the
      generated email bundle, test files and the baseline itself are excluded, each with its reason
      in the script. The pattern recognises the FORMS MEASURED in this tree for the seven published
      locales, and no more: a new way of saying it is invisible until it is added, which the script
      says in its own header. Every alternative has a positive control in the battery, and the
      script refuses to judge (rc 2) if a known promise stops matching.
      Rationale and controls: scripts/check-phone-home-claims.sh.
    cmds:
      - bash scripts/check-phone-home-claims.sh

  lint:phone-home-claims:selftest:
    desc: >-
      a repository gate -- battery: a positive control per published locale (en/de/es/fr/ja/ru/zh), the
      up-vs-down direction, the no-fire direction on the SCOPED wording that C09-05 landed, the
      frozen archive, test files, the generated email bundle, and the three "could not look" arms.
      A multilingual pattern without a control per language is a guess: this battery found that the
      Russian alternative never fired.
    cmds:
      - bash scripts/test-phone-home-claims.sh

  lint:taskfile-executable:
    desc: >-
      Ninguna tarea NUEVA puede quedar sin `cmds:`, `deps:` ni `cmd:`. Medido el 2026-08-20 sobre
      main: DIECISEIS tareas habian perdido sus claves en un bloque contiguo de 77 lineas — 7 con
      valor de CADENA, que `task` manda al shell y mueren con 127, y 9 con solo `desc:`, que
      corren y SALEN 0. Las nueve son las peores: un gate que no falla, certifica. Ninguna la
      llamaba el hook ni el CI, asi que nada estuvo rojo en ningun momento.
      La linea base se DERIVA de origin/main en cada corrida en vez de escribirse en un fichero:
      main arrastra hoy esas 16, un gate absoluto rechazaria todos los push por un daño ajeno
      («baseline rojo») y un fichero de base envejece. Asi el gate se aprieta SOLO segun se
      reparan, hasta tolerancia cero, sin un commit mas.
    cmds:
      - bash scripts/hub-leg.sh lint:taskfile-executable scripts/check-taskfile-executable.sh

  lint:taskfile-executable:selftest:
    desc: >-
      Bateria: rompe una tarea y exige que la nombre; una tarea con SOLO `deps:` es legitima y no
      se marca (ese falso positivo es la razon por la que casi no escribo el gate); lo heredado de
      la base no se cobra, pero romper una MAS sobre esa misma base si; base inexistente y
      gramatica que no encaja son «no he podido mirar», nunca «limpio».
    cmds:
      - bash scripts/hub-leg.sh lint:taskfile-executable:selftest scripts/test-check-taskfile-executable.sh

  lint:taskfile-shape:
    desc: >-
      La FORMA del Taskfile: tarea encadenada, tarea sin `cmds` ni `deps`, y clave DUPLICADA
      dentro de una tarea. El lector existía desde el 2026-08-20 y NO lo invocaba nada; y
      cableado a pelo tampoco valdría, porque siempre sale 0 — incluso al imprimir `NOPUEDO`.
      La puerta convierte eso en tres respuestas: 0 limpio · 1 hallazgo · 2 no he podido mirar.
    cmds:
      - bash scripts/check-taskfile-shape.sh

  lint:taskfile-shape:selftest:
    desc: Batería de check-taskfile-shape.sh — clave duplicada, tarea-cadena, y las dos formas de «no he podido mirar».
    cmds:
      - bash scripts/test-taskfile-shape.sh

  buzon:censo:
    desc: >-
      Censo del coste de los buzones: tamano, versiones y BRUTO (tamano x versiones) por buzon,
      con su REV. Existe por la misma razon que `misspell-census.sh`: una cifra copiada a mano en
      prosa envejece en silencio, y estas crecen POR HORA — medido el 2026-08-28, +134 versiones
      y +1,9 GiB brutos en una sola hora sin que nadie hiciera nada extraordinario.
      ⛔ `bruto` NO es disco: es una COTA SUPERIOR. El pack deltifica estas versiones casi por
      completo; sueltas ocupan enteras, que es el estado real con `gc.auto=0`. Para el disco,
      `git count-objects -v`.
      Sale 1 si las filas no suman su total: una particion que no cuadra no es una particion.
      NO esta cableado en el hook: es un censo, no un gate.
    cmds:
      - bash scripts/mailbox-cost-census.sh {{.CLI_ARGS}}
  rerere:build-postimages:
    desc: >-
      Lista las resoluciones de `rerere` cuyo postimage es una SALIDA DE BUILD — un sello de
      bundle, no texto. `rerere` graba «ante ESTE conflicto, ESTA respuesta»; para un fichero
      generado esa respuesta describe el arbol de quien construyo, no el de quien la reutilice.
      El `rr-cache` vive en el git-common-dir, compartido por los ~48 worktrees.
      ⛔ NO ESTA CABLEADA EN EL HOOK Y ES DELIBERADO: es un CENSO, no un gate — hoy da 55 sobre
      este clon y colgarla del push bloquearia a los cinco carriles por algo que no es un defecto
      del codigo. Y NO BORRA NADA sin `--purge` explicito: el almacen es de todos.
      La regla que lo hace inocuo sigue siendo `task build:web` incondicional tras cualquier
      merge que toque `core/internal/webui/`.
    cmds:
      - bash scripts/rerere-build-postimages.sh

  rerere:build-postimages:selftest:
    desc: Bateria del censo — cuenta solo forma de sello, respeta el texto, y --purge es exacto.
    cmds:
      - bash scripts/rerere-build-postimages.sh --selftest

  lint:taskfile-graph:
    desc: >-
      D-2 del hook: comprueba con el GRAFO DE go-task (`task --dry`) que ninguna tarea del carril
      rápido alcanza una del gate pesado. Cierra la mitad de la garantía del split que la
      LIMITACIÓN N-3 declaraba sin observar — el hook gatea lo que LLAMA, no lo que sus
      herramientas expanden, así que un `deps:` bastaba para que una rama feature pagase el gate
      pesado sin que ninguna batería lo viera. La ronda 11 lo intentó con un parser de YAML propio
      y lo dejó abierto (L-01): era ciego a `deps: ['x']` y `deps: [{task: x}]`, formas que go-task
      acepta y ejecuta. Aquí la autoridad es go-task, no una lectura del fichero. Las dos listas se
      DERIVAN del hook, así que no caducan. ~3 s.
    cmds:
      - bash scripts/check-taskfile-graph.sh

  lint:ci-ports:
    desc: >-
      CI port policy: no fixed HOST ports in any workflow. Every
      jobs.<id>.services.<sid>.ports[] / jobs.<id>.container.ports[] entry must
      be a bare container port — `5432:5432` reserved the host's 5432 and the
      second job on the same runner host died in "Initialize containers" with
      "port is already allocated" (run 30541550811). Jobs resolve the ephemeral
      host port from job.services.<id>.ports in their first step instead.
      Structural YAML walk, not a grep (the k8s `ports:` heredoc in
      e2e-operator-kind.yml lives inside a run scalar and must not be flagged).
      Runs the gate AND its mutation matrix, like lint:cosign-pins: a gate that
      has only ever been seen passing has never been seen working.
    cmds:
      - bash scripts/check-ci-ports.sh
      - bash scripts/test-ci-ports-gate.sh

  lint:cosign-pins:
    desc: >-
      Supply-chain gate: every cosign installer in the tree must be the reviewed
      action revision AND request the one exact version whose signing contract is
      proven by check-cosign-contract.sh. Also runs the gate's own mutation matrix.
    cmds:
      # YAML-decoding check (no cosign needed) — invoked by the local pre-push hook AND
      # mainline-ci, not only by the `lint:` aggregate. Without a pin an installer takes
      # its action revision's DEFAULT, which is how the pipeline came to run cosign
      # v3.0.6 and v2.5.2 at once with incompatible signing contracts.
      - bash scripts/check-cosign-pins.sh
      # The matrix runs WITH the gate, not beside it (~1.5s). Two earlier text-scanning
      # implementations passed this repository's own tree while accepting valid YAML that
      # installs an unpinned cosign; a gate whose properties are only proven in a target
      # nobody invokes is a gate that silently regresses.
      - bash scripts/test-cosign-pins-gate.sh
      # AND the battery for the EXECUTION-TIME INVARIANT, which is the actual control after
      # the reframe. For a while the DEMOTED half had 52 cases and the guarantee had
      # none — and the demoted half is the one people keep editing. Hermetic: stub binaries,
      # no network, no real cosign needed.
      - bash scripts/test-assert-cosign-binary.sh
      # AND the THREE-ANSWER battery for check-cosign-contract.sh (C15-P6). It rides HERE and
      # not beside its own gate for a measured reason: the contract gate needs a real cosign and
      # does not run in the fast lane, so a battery hung there would almost never execute. This
      # one is hermetic — decoy binaries under the worktree, no cosign, no network — so it runs
      # everywhere this task runs. It exists because the difference between «broken» and «could
      # not look» is invisible to any shape lint: the gate used to answer 1 for a cosign that
      # simply was not installed.
      - bash scripts/test-cosign-contract-verdicts.sh
      # AND the seams. An adversarial round found the invariant correct but NOT load-bearing:
      # it authenticated one binary while every signer re-resolved bare `cosign`. No battery
      # could catch that, because each one tested a script in isolation.
      #
      # The checker is STRUCTURAL, not a grep: the grep version was itself broken by two
      # ordinary edits (`cmd: bash` -> `cmd: true`, and using the verified PATHNAME without
      # the re-check) that left every count identical. It also pins the GoReleaser property
      # `goreleaser check` cannot see — a signing `cmd:` is executed literally, so it must
      # never be a template.
      - bash scripts/check-cosign-wiring.sh
      # AND the air-gap mirror, which is the other end of the same chain and until
      # 2026-08-01 had no test at all — no Taskfile entry, no workflow, so nobody had
      # ever seen it refuse anything. Three of its checks did not: a digest that CHANGED
      # while mirroring was a WARN and the run still closed "OK — mirrored + verified
      # offline"; a chart with no .tgz.sig skipped verification and was pushed anyway;
      # a bundle with no images verified nothing and reported the same OK. Stubbed
      # binaries, no registry, no keys, ~1s.
      - bash scripts/test-airgap-mirror-gate.sh
      # Every row of the matrix is a MUTATION that the previous version accepted.
      - bash scripts/test-cosign-wiring.sh

  lint:release-anchor-identity:selftest:
    desc: >-
      §C.4.8 IDENTITY: the release anchors in effect must BE the reviewed anchors, not merely
      well-formed ones. Exists because of a measured five-day window: commit 9354dd555 rotated
      both production public anchors on 2026-08-23 "after a traced command exposed the private
      halves", the rotation landed in the tree and never in the repository Variables, and
      NOTHING went red — check-release-pubkey validates FORM (a compromised key is well-formed)
      and release-preflight only PRINTED a fingerprint. Measured 2026-08-28 with the exposed
      anchor injected: preflight rc=0, "production profile validated". The mutant survived, so
      the check was decoration. This battery is HERMETIC and OFFLINE — toy anchors, toy table,
      no network — and carries that exact mutant as a case, plus a positive control (a gate that
      always said MISMATCH would pass every rejection case). The NETWORK form is a separate task
      on purpose; see lint:release-anchor-identity:live.
    cmds:
      - sh scripts/test-release-anchor-identity.sh

  lint:release-anchor-identity:live:
    desc: >-
      The same identity check against the LIVE repository Variables of olivaresai/olivares. ⛔ NOT
      for the per-push fast lane and deliberately absent from .githooks/pre-push: it needs `gh`
      and the network, so contention or a rate limit would show up as a false red on somebody
      else's push — the class this house already pays for elsewhere. Its homes are
      release-preflight (which now calls the offline comparison at §C.4.8) and a scheduled run.
      Run it by hand whenever you want to know whether the deployment still matches the tree.
    cmds:
      - sh scripts/check-release-anchor-identity.sh --live

  # ⛔ NO HAY `lint:publish-target` A SECAS, Y NO ES UN OLVIDO. Este guion valida el ENTORNO de
  # una publicación (perfil, destino declarado, repositorio que corre), no el árbol, así que
  # correrlo sin esas variables no puede dar más que un fallo: lo probé y da rc=1 con
  # «RELEASE_PROFILE is required». Es un paso de workflow, como `release-preflight.sh`, que por
  # el mismo motivo tampoco tiene tarea propia — sólo su batería. Lo que SÍ se puede comprobar
  # contra el árbol es que la herramienta funciona, y eso es la pata de abajo.
  lint:publish-target:selftest:
    desc: >-
      The battery for lint:publish-target: twelve cases, every accepted one paired with the
      refusal that proves it was not accepted by accident, and four mutant legs — remove the
      production coordinate check, let a run publish to another repository, disarm the
      production-surface tripwire, allow publication secrets — each of which must turn its own
      cases red. The preprod identity is a NEUTRAL stand-in because this file ships in the
      exported tree.
    cmds:
      - bash scripts/hub-leg.sh lint:publish-target:selftest scripts/test-check-publish-target.sh

  lint:step-env-closure:
    desc: >-
      Refuse a workflow step that CONSUMES a shell variable whose `env:` lives in ANOTHER step.
      Written after two defects of mine on the same day, both in release.yml: actionlint rejected
      an `env:` line referencing a context the job could not reach, I removed the DEFINITION and
      left the CONSUMER, and with `set -euo pipefail` phase 2 of the release died on every run
      before downloading evidence, before cosign and before signing. actionlint validates the
      the expression syntax expressions and catches a bad CONTEXT name; it does not read the `run:` body as
      shell, so a shell variable whose env: was moved away is invisible to it.
      The heuristic is deliberately NARROW and got there the long way: accusing every undeclared
      shell variable gave 41 findings for one real defect, and 33 after honouring $GITHUB_ENV, because
      a `read -r A B < file` assigns in the same block and telling those apart means parsing
      shell. What IS precise is "the name exists as an env: key elsewhere in the file but not
      here" — the signature of a definition that was moved or deleted.
    cmds:
      - bash scripts/check-step-env-closure.sh

  lint:step-env-closure:selftest:
    desc: >-
      Eight cases, every red paired with the green that proves it does not fire at anything: own
      env:, workflow env:, job env:, a variable exported to $GITHUB_ENV by an earlier step, and a
      pure-shell variable that was never an env: at all (which it must NOT accuse — it does not
      parse shell and says so).
    cmds:
      - bash scripts/hub-leg.sh lint:step-env-closure:selftest scripts/test-check-step-env-closure.sh

  lint:release-mechanics:
    desc: >-
      Release-mechanics batteries (rehearsal unit E.1p2): the fail-closed target
      preflight — both accepted tuples, every rejected cross-product of design §E.1.7,
      and a mutation case proving the production-surface tripwire is live; the exact
      bare-manifest digest resolver — ambiguity refuses, never first-match; and the
      mode-aware signing launcher — key mode appends --key/--tlog-upload=false LAST
      (pflag last-occurrence-wins) and refuses every partial configuration; and the OTA
      channel gate, which decides whether a tag ALSO produces a `security` manifest —
      deny-closed on an absent declaration, REFUSING a half-made one, and never firing for
      a release that did not declare one; and the WORKSPACE-INTEGRITY guards that refuse to
      let a step consume a checkout that no longer matches its commit — run as the workflow's
      own extracted `run:` blocks, because a git that CANNOT ANSWER must be a red release and
      not a silent skip. Hermetic: stub binaries, no network, no
      registry, nothing signed.
    cmds:
      - bash scripts/test-private-leg.sh
      - bash scripts/test-release-ota-channel.sh
      - bash scripts/test-release-workspace-e2e.sh
      - bash scripts/test-release-security-producer.sh
      - bash scripts/test-release-security-sig-guard.sh
      - bash scripts/test-release-preflight.sh
      - bash scripts/test-resolve-bare-manifest-digest.sh
      - bash scripts/test-cosign-verified-mode.sh
      # R1 contrast additions: format-preserving digest-asserted latest* aliasing
      # (P1-01), the §C.4 authorization wiring of both release workflows (P1-02/P2-02/
      # P3-02), and the verifier-summary honesty regression (P2-04).
      - bash scripts/test-alias-image-digest.sh
      - bash scripts/test-release-wiring.sh
      - bash scripts/test-verify-release-summary.sh

  lint:pg-env:
    desc: >-
      Prove the THREE regimes of the Postgres gate wiring, and the CI consistency of the
      -race legs. Without a DSN the helper is fail-closed (exit 1); with the local opt-in
      and no server it exits 0 and says loudly which coverage it lacks; under
      OLIVARES_GATE_STRICT_PG=1 an unreachable server is a hard failure. Also asserts that
      every -race leg discovered in the workflow has a digest-pinned postgres service and
      runs through with-pg-env.sh.
    cmds:
      - bash scripts/test-pg-test-env.sh

  lint:status-ref:
    desc: >-
      Run disposable SHA-1 Git fixtures for status-only bootstrap, one-path CAS updates,
      the race loser, complete newly reachable history, hostile tree/path/mode/object
      refusal in read and publish, exact main projection OIDs/modes/deletions, the literal
      sanctioned identity, the local/worktree-only Git config boundary with two remotes,
      SSH-over-HTTPS transport selection with inherited GIT_SSH_COMMAND, the 512-commit
      validation budget, the real pre-push hook, independent Git-command failures,
      fresh-main/bootstrap-push guards, and whole-protocol documentation mutations.
      Named code and dependency mutants must die. Hermetic: no hosted remote, SHA-256
      object workflow, or server-side custom-ref policy is exercised.
    cmds:
      # A través de hub-leg.sh, no directo: este Taskfile SE PUBLICA y el script no. Sin el
      # envoltorio, el árbol público correría un fichero que no tiene y saldría 127 — un error de
      # "no existe el comando" que se lee como avería, no como "esta pata es del hub".
      # Mismo tratamiento que sus hermanos de lint:session-numbers y lint:commit-identity.
      - bash scripts/hub-leg.sh lint:status-ref scripts/test-status-ref.sh

  lint:channel-parity:
    desc: >-
      The release channels live in TWO languages and must say the same thing:
      core/release/manifest.go:50 and commercial/license-worker/src/download/manifests.ts:15.
      Nothing compiles both, so this is the only place the drift can be seen. Measured
      2026-08-19: Go and TS agreed while the enterprise artifact publisher carried an
      INVERTED copy — it accepted beta and edge, which the gate does not serve, and rejected
      lts, which it does, so the LTS line could not be published at all. Order does not
      matter; membership does. Three answers, 0/1/2.
    cmds:
      - bash scripts/hub-leg.sh lint:channel-parity scripts/check-channel-parity.sh
      - bash scripts/hub-leg.sh lint:channel-parity scripts/check-channel-parity.sh --selftest

  lint:tree-untouched:
    desc: >-
      Assert the working tree is EXACTLY as it was before the gates ran. A gate that modifies
      the tree while checking it is not discovered by whoever wrote it — it is discovered by
      another lane's `git add -A`, already committed. Measured 2026-08-19: nothing in the
      pre-push hook or in mainline-ci looked at the tree afterwards, and one battery mutates
      README.md on purpose as its negative control. Two modes, so it can bracket a run:
      `--snapshot <file>` before, `--compare <file>` after.
    cmds:
      - bash scripts/check-tree-untouched.sh --selftest

  lint:unbound-env:
    desc: >-
      Catch reads of environment variables that CI runners do not always set (HOME above
      all: absent on six of the nine) from scripts that run under `set -u`, where the
      result is not a warning but the death of the script on that line. It has bitten four
      times; the last one, 2026-08-19, took down the whole `control-plane` job under the
      heading "license boundary" while the boundary check had just reported OK across 259
      package graphs — the symptom does not resemble the cause, which is exactly why this
      is a gate and not a fix to whichever script broke last.
    cmds:
      - bash scripts/check-unbound-env.sh
      - bash scripts/check-unbound-env.sh --selftest

  lint:branch-protection:
    desc: >-
      Prove the branch-protection verifier: the correct configuration passes (a `false` is not
      "absent" — jq's `//` returns the alternative for false too, which made the gate call an
      impeccable protection broken), each control switched off is NAMED, a missing required context
      is NAMED, a genuinely absent field is still ROTO, and an unreadable answer is
      NO_HE_PODIDO_MIRAR. Hermetic: the API answer is injected from a file, no network.
    cmds:
      - bash scripts/test-check-branch-protection.sh

  ci:branch-protection:
    desc: >-
      Read the LIVE branch protection of this repo and compare it against what
      apply-branch-protection.sh declares for the hub profile. NOT a fast lint: it is one
      authenticated network call, the same reason check:claims stays out of the pre-push lane.
    cmds:
      - bash scripts/check-branch-protection.sh

  lint:timeout-headroom:
    desc: >-
      Prove the per-binary timeout headroom gate: a package at 90% of its cap is NAMED, the
      same log with a smaller number is clean, the cap is read from the run's own `-timeout`
      (never hardcoded), two jobs are judged against their own caps, and no durations means
      NO_HE_PODIDO_MIRAR rather than green. Hermetic: synthetic logs, no network, no CI.
    cmds:
      - bash scripts/test-check-test-timeout-headroom.sh

  ci:timeout-headroom:
    desc: >-
      Report how close each test package ran to its per-binary `-timeout` in the last
      mainline-ci run. NOT a fast lint: it is one network call, the same reason check:claims
      stays out of the pre-push lane. For the integrator and the lane watchdogs.
    cmds:
      - bash scripts/check-test-timeout-headroom.sh --fetch {{.CLI_ARGS}}

  lint:hub-battery:
    desc: >-
      Self-test of scripts/hub-battery.sh's verdict discriminator. The battery is the integrator's
      ONLY gate -- he pushes to main with --no-verify -- so a defect in how it classifies a verdict
      is a defect in the last filter before main. Six cases, four of them in the NON-firing
      direction, because turning a finding into "I could not look" is worse than the original red:
      this repository has already measured that exact regression once. Mutation 3/3 with
      named witnesses, plus a negative control that must survive.
    cmds:
      - bash scripts/hub-battery.sh --selftest

  lint:ci-timeout-arithmetic:
    desc: >-
      Refuse a workflow job whose timeout-minutes sits at or below the SUM of its steps'. Steps
      run in series, so that sum is the worst case; a ceiling under it is not a backstop but the
      effective limit, and a job-level timeout cancels the remaining steps so the failure
      reporter never posts. The red comes out mute. On 2026-08-22 control-plane carried 75
      against 150 and had ZERO successes in fourteen runs, nine of them pinned at 75.4 minutes --
      on one of the four contexts branch protection REQUIRES, so main's protection was
      unsatisfiable and nothing said so. Two more jobs carried the same shape, one of them in a
      workflow nobody was looking at.
    cmds:
      - bash scripts/check-ci-timeout-arithmetic.sh

  lint:ci-timeout-arithmetic:selftest:
    desc: >-
      Battery for the timeout-arithmetic gate: finding, clean, the exact boundary (a ceiling
      EQUAL to the sum is a finding, so the comparison is <= and not <), a job with no step
      guards, a workflow that does not parse answering 2 and not CLEAN, the real tree being
      clean, and a NEGATIVE CONTROL that lowers a real job's ceiling and requires the gate to
      catch it.
    cmds:
      - bash scripts/test-ci-timeout-arithmetic.sh

  lint:ci-step-guard:
    desc: >-
      SECOND ceiling invariant, and the sibling of ci-timeout-arithmetic: a job that can take
      long must carry at least ONE step-level timeout-minutes. A job-level timeout CANCELS the
      remaining steps, so the failure reporter never posts and the red comes out mute -- which
      is how control-plane went fourteen runs with no readable verdict. A step-level timeout
      fails the step and lets the reporter publish. Threshold 30 min, and it is MEASURED, not
      invented: of the guardless jobs, the four that never approach trouble run 0.1/0.1/6.4/1.6
      against ceilings of 5/5/15/30, while the seven above 30 do real unbounded work. The census
      also corrected the debt: THIRTEEN jobs across six workflows carried no step guard, not the
      seven that had been counted from mainline-ci alone -- and the two worst, race-root (170)
      and race-workspace (90), were in a workflow nobody had opened.
    cmds:
      - bash scripts/check-ci-step-guard.sh

  lint:ci-step-guard:selftest:
    desc: >-
      Battery for the step-guard gate: the finding, the same job made clean by one guard, the
      boundary from BOTH sides (30 is not a finding, 31 is), a cheap job that must NOT be
      flagged, two offenders both named, the configurable threshold, the three answers each by
      exit CODE (missing dir, empty dir, unreadable file, non-numeric threshold), the real tree
      being clean, and a NEGATIVE CONTROL so the battery cannot be measuring its own fixture.
    cmds:
      - bash scripts/test-ci-step-guard.sh

  lint:test-hook-parallelism:
    desc: >-
      A test that assigns a PACKAGE-level var must not be parallel. Whoever installs a test hook
      does not control who fires it: another test in the same package reaching that point writes
      into the first one's variable, and its assertion then judges somebody else's work -- a
      borrowed number looks exactly like your own. Found 2026-08-24 by the kernel lane auditing its own
      observer; the package census turned up SEVEN in sqlstore with 27 installation sites, all safe
      today by a property NOBODY declares (none of the eight installing tests is parallel) in a
      package with 171 t.Parallel() and a parallelisation campaign under way. Keys on the
      ASSIGNMENT and not the call site, and that is measured, not chosen: two of the seven return
      ZERO call sites because they are captured into a local first -- which is the CORRECT fix, so
      good practice is exactly what blinds a call-site census.
    cmds:
      - bash scripts/check-test-hook-parallelism.sh

  lint:demo-agent:
    desc: >-
      Prove the documentation estate's observed-session/run join key agrees across the engine
      seed, API seeder and hermetic demo agent, and that the agent speaks init/resume. A drift
      leaves separate Discovered and Launched rows while every producer still returns success.
      Exit 0 clean, 1 drift, 2 could-not-inspect.
    cmds:
      - bash scripts/test-demo-agent.sh

  lint:test-hook-parallelism:selftest:
    desc: >-
      Battery for the hook-parallelism gate. The case that MATTERS is the realistic mutant: the two
      REAL package files pulled from git, with t.Parallel() added to the test that actually installs
      the hook -- not a toy fixture. Plus both INVERSE controls, which is the other half of the
      condition and which caught a real defect: the checker collected local shadows and never
      consulted them. Also the blank identifier (41 of 41 false positives before it was excluded), a
      local shadowing the global name, a synthetic mutant proving those greens are not vacuous, and
      the three answers by exit CODE.

      Runs BOTH batteries, and the order is the point. The inherited shell battery goes FIRST
      because it is the one that found the hole: when the gate moved from awk to go/ast, the new
      Go battery covered `:=` shadowing but NOT the local declared and then REASSIGNED with a
      plain `=` -- syntactically identical to overwriting the global. The inherited 20 caught
      that false positive. A replacement whose own battery is weaker than the one it replaces
      has not earned the replacement, so both stay.
    cmds:
      - bash scripts/test-test-hook-parallelism.sh
      - sh -c 'cd scripts/hookpar && GOWORK=off go test ./...'
  lint:ci-inner-clocks:
    desc: >-
      CUARTA invariante de los techos, y la unica que mira DENTRO de un `run:`. Un reloj interior
      (`timeout 80m`, `go test -timeout 45m`) que no puede disparar antes que el `timeout-minutes`
      del paso convierte su rama fail-closed en INALCANZABLE por construccion: GitHub mata el paso
      y el diagnostico que el guion tenia escrito no llega nunca. Exige techo >= interior +
      kill-after + margen. Medido el 2026-08-30 sobre el job `secrets` del candidato 3, que murio
      mudo a los 60 min con un reloj interior de 80m.
    cmds:
      - bash scripts/check-ci-inner-timeouts.sh
  lint:ci-inner-clocks:selftest:
    desc: Bateria de lint:ci-inner-clocks — el paso real que cayo, la frontera donde el kill-after decide, y dos mutantes.
    cmds:
      - bash scripts/test-ci-inner-timeouts.sh
  lint:ci-sibling-legs:
    desc: >-
      THIRD ceiling invariant, and the one about DEPENDENCE rather than ceilings: in a race* job,
      every leg after the first must carry `!cancelled()`, or a red in one leg silently skips the
      rest. Measured 2026-08-24 on runs 32741025007 and 32753234715: step 10 failed in both and
      steps 11-14 were skipped in both -- including `race (commerce domain)`, the ONLY place
      commerce-core runs under -race. The job is already red by then, so nobody reads further
      down and the coverage is lost without a message. Scope is deliberately narrow: the general
      rule would flag dozens of control-plane steps and that is a policy call, not a gate's.
    cmds:
      - bash scripts/check-ci-sibling-legs.sh

  lint:ci-sibling-legs:selftest:
    desc: >-
      Battery for the sibling-legs gate. The case that MATTERS is the second: it rebuilds the
      mainline-ci.yml that was in origin/main on the morning of 2026-08-24 and demands the gate
      reddens on it -- a gate written after the fix and tested only against the fixed tree proves
      nothing, because green-before and green-after look identical. Plus: the three answers by
      exit CODE, a one-leg race job and a non-race job that must NOT be flagged, a step without
      timeout-minutes that is not a leg, always() refused in place of !cancelled(), and a third
      leg caught while the second is correct.
    cmds:
      - bash scripts/test-ci-sibling-legs.sh

  lint:ci-secrets-cap:
    desc: >-
      Prove that running out of time in the CI secrets sweep is a RED WITH A REASON and not the
      job dying, which GitHub labels `cancelled` and everyone reads as supersession. On
      2026-08-22 nine of the last fourteen runs died at 45.4 minutes flat and the blocking
      secrets gate had been giving no verdict for days. Extracts the real `run:` from the
      workflow so what is tested is what runs, checks the internal cap sits below the job
      ceiling, and carries a NEGATIVE CONTROL: reading the pipe's status instead of
      PIPESTATUS[0] turns an exhausted sweep green. Refuses with 2 if no scratch directory can
      execute, since /tmp is noexec here and a stub that cannot run measures the real sweep.
    cmds:
      - bash scripts/test-ci-secrets-cap.sh

  lint:claim-safety:selftest:
    desc: >-
      Bateria de check-claim-safety.sh, el guion que cuenta lo que un claim DESTRUIRIA al
      materializarse. Va CABLEADA y no suelta porque su propia clase lo exige: el 2026-08-30
      publique un claim declarado «un fichero, +14/-3» que borraba 32 lineas en CADA uno de los
      nueve buzones, y `git merge-tree` daba rc 0 sin mentir — decia «no conflicta», que es otra
      pregunta. Una bateria que nadie invoca no habria cazado nada de eso.
    cmds:
      - bash scripts/test-claim-safety.sh

  lint:classify-paths-parity:
    desc: >-
      Las dos listas de rutas de bitacora de `mainline-ci.yml` —`paths-ignore` del disparador y el
      `case` de `classify`— tienen que decir LO MISMO. Lo exige el propio workflow en su comentario
      («the two move together or this fires again on a prose commit») y hasta hoy nadie lo
      comprobaba: `docs/ai-context/**` entro en una y no en la otra el 2026-08-23 y estuvo una
      semana asi, creando corridas que se saltaban las 41 patas gateadas y no median nada.
    cmds:
      - bash scripts/check-classify-paths-parity.sh

  lint:classify-paths-parity:selftest:
    desc: >-
      Bateria de check-classify-paths-parity.sh — 17 casillas, con el fixture de sangria desplazada
      que prueba la tolerancia al reformateo (sin el, un mutante de sangria fija no mataba ninguna
      fila) y los dos mutantes juzgados por su mensaje.
    cmds:
      - bash scripts/test-classify-paths-parity.sh
  lint:orphan-batteries:
    desc: >-
      Censo con LINEA BASE de baterias que NADIE ejecuta. Nace de una medida: el 2026-08-30
      aparecieron CUATRO baterias huerfanas en TRES sesiones distintas, y a las cuatro las encontro
      un lector humano, una por una. Un banco que nadie corre no corta — y ademas informa VERDE
      mientras no corta. Resuelve por el GRAFO de go-task, no por texto: una bateria puede colgar
      de otra tarea por `deps:` y correr sin aparecer en el gancho.
    cmds:
      - bash scripts/check-orphan-batteries.sh

  lint:orphan-batteries:selftest:
    desc: >-
      Bateria de check-orphan-batteries.sh — 12 casillas sobre un repo de fixtures propio, con el
      control positivo (una huerfana fuera de la base CORTA), las dos clases distinguidas (sin
      tarea / con tarea que nadie alcanza) y el mutante que resuelve por texto en vez de por grafo.
    cmds:
      - bash scripts/test-orphan-batteries.sh

  lint:hook-leg-wiring:
    desc: >-
      Una pata cableada vive en TRES sitios —la llamada del gancho, el banner que la anuncia y la
      lista declarada del banco— y el defecto es siempre el mismo: se actualiza uno. Nace de una
      medida del 2026-08-31: `8f2edda97` añadio `lint:mute-pipefail` solo a las llamadas, y eso puso
      ROJA a `lint:prepush-refclass`, que ES pata del gancho, asi que todo push moria ahi. Sus 8
      casos decian rc=0 y no nombraban la causa. Esto NO añade una cuarta lista: verifica la
      coherencia de las tres que ya existen, en sub-segundo, y NOMBRA la pata y el sitio que falta.
    cmds:
      - bash scripts/check-hook-leg-wiring.sh

  lint:hook-leg-wiring:selftest:
    desc: >-
      Banco de lint:hook-leg-wiring. Lleva como casos los DOS falsos positivos que cometi al
      construirlo —un banner que acaba en '+' sin espacio detras, y una pata declarada en
      HEAVY_TASKS en vez de FAST_LINTS—, la guarda de extractores en vacio (un gancho reformateado
      daria cero hallazgos y saldria verde) y un mutante que acredita la comparacion del banner.
    cmds:
      - bash scripts/test-hook-leg-wiring.sh

  lint:purge-scratch:selftest:
    desc: >-
      Bateria de purge-scratch.sh, el barrido de scratch que enumera lo que BORRA en vez de lo
      que conserva y mira el TIPO antes de un rm -rf. Va cableada porque su hermana
      lint:orphan-batteries la marcaria si no lo estuviera, y porque el guion nace de un corte
      medido: una purga con seis guardas de «esta en uso» se llevo el socket del bus de una
      sesion, que no falla ninguna de esas seis. Cuesta menos de un segundo.
    cmds:
      - bash scripts/test-purge-scratch.sh

  lint:prepush-treesnap:
    desc: >-
      Prove the pre-push tree-snapshot block leaves nothing behind in TMPDIR. Its mktemp used to
      sit ABOVE its own guard, so the file was created unconditionally and the guard decided
      afterwards whether it was ever used; the guard reads scripts/check-tree-untouched.sh from
      the tree of the BRANCH BEING PUSHED, which on 2026-08-22 was missing from all forty open
      branches, and the if fell through with no else to collect it. 9,691 zero-byte files in
      /tmp, one per push per lane. Four cases including a NEGATIVE CONTROL that restores the old
      form and requires it to leak, plus a syntax check so a mutant that cannot run is not read
      as a mutant that does not leak.
    cmds:
      - bash scripts/test-prepush-treesnap.sh

  lint:prepush-refclass:
    desc: >-
      Prove the branch-aware pre-push classification (GATES v3): main and tags take the
      full gate, feature refs take fast lints only, the strictest ref of a multi-ref push
      wins, the mutex ref gates nothing, OLIVARES_FAST_PUSH cannot downgrade main or a
      tag, any line the rule cannot parse is promoted to full, and a missing toolchain, a
      missing classifier or a verdict that is not exactly one
      "<full|fast|skip|delete><TAB><reason>" line REFUSES the push instead of passing it —
      with the ONE named exception, a pure-deletion push, which needs no toolchain because
      it runs no gate. The parsing is checked BYTE by byte: a NUL, an unterminated last
      record and a 255-byte sweep against git check-ref-format itself. It also RUNS THE
      HOOK end to end against stub task/git — comparing the WHOLE observed task sequence
      against the declared lists (the seven heavy ones in order for main and tags, the
      declared fast lints and an EMPTY heavy list for a feature ref), and asserting that
      main and tags TAKE the host mutex while a feature ref never reaches it. The mutex
      itself is unchanged by this split and its lifecycle is NOT exercised here — see the
      hook's declared limitations. It kills one mutant per heavy task, one per fast lint,
      one per heavy task LEAKING into the fast lane (synchronously and deferred to a
      background subshell), plus three that force the wrong lane, because assertions that
      cannot go red prove nothing. Plus a
      legacy-regression section replaying every scenario against the pre-split rule, which
      must keep disagreeing. Hermetic: no gate and no remote is touched. It PRINTS its own
      wall time with the tally — this description claims none, because a duration in prose
      goes stale in silence (it said "~5s" until a round-9 run measured 112s).
    cmds:
      - bash scripts/test-prepush-refclass.sh

  lint:cpu-quota:
    desc: >-
      La bateria de scripts/cpu-quota.sh, el resolvedor de CPUs UTILES de esta caja. Existe
      porque `nproc` responde por el HOST y no por el cgroup: aqui dice 16 mientras
      `cpu.max` concede 400000/100000, o sea CUATRO. El divisor equivocado no rompe nada
      ruidosamente — falsea toda medida de paralelismo que se publique, y `time-fast-lints.sh`
      lo imprime en cada duracion que citamos. La bateria cubre cgroup v2, cgroup v1, la
      ausencia de cuota (donde `nproc` SI es la respuesta), el redondeo hacia arriba y el
      minimo de 1, y su PRIMER caso es la CAJA VIVA, que debe decir 4 y no 16: un banco que
      solo mira ficheros sinteticos no habria cazado el defecto que lo motivo.
      ⚠ NO la llama el hook todavia. Cablearla toca TRES sitios —la linea en el hook, el
      banner y la lista DECLARADA de `scripts/test-prepush-refclass.sh`, que compara la
      secuencia observada contra ella— y equivocarse ahi mata el push de todos los carriles.
      Se deja como tarea ejecutable y el cableado como una accion aparte, con sus tres sitios
      nombrados.
    cmds:
      - bash scripts/test-cpu-quota.sh

  lint:r8-preflight-selftest:
    desc: >-
      La bateria de `r8-preflight.sh`, el pre-vuelo que deja el arnes de captura APUNTANDO a un SHA
      sin capturar nada.
      ⛔ La asercion que justifica esta bateria es «NO CAPTURA». Lo demas —disco, binario,
      Playwright— falla ruidosamente si me equivoco; lo que puede fallar en SILENCIO y arruinar la
      manana del dia D es que un guion que existe para PREPARAR acabe disparando media hora de
      motores y navegadores contra un arbol que igual no es el del corte. Se comprueba por CONDUCTA
      (no deja un solo PNG ni crea el worktree por su cuenta) y por FUENTE (ninguna linea ejecutable
      invoca docs-captures.sh), porque las dos pueden mentir por separado: hoy no captura por falta
      de precondiciones, y el dia que esten todas cumplidas la conducta ya no distinguiria.
      Ademas: un ref inexistente es 2 «no he podido mirar» y NO 1 «falta algo» —confundirlos haria
      que alguien preparase un arbol para un corte que no existe—, y el control de TMPDIR va en las
      dos direcciones. Hermetica: no construye, no captura, no toca el arbol vivo.
    cmds:
      - bash scripts/test-r8-preflight.sh

  lint:r8-curar-superficies-selftest:
    desc: >-
      La bateria de `r8-curar-superficies.sh`, que clasifica las superficies de un manifest.json de
      capturas y mide la rancidez por sha256.
      ⛔ La asercion que la justifica es que `filas: 0` NO ES UN VEREDICTO: significa dos cosas
      distintas —«la tabla esta vacia» y «no hay tabla»— y confundirlas convertiria formularios
      legitimos en huecos de sembrado. El propio arnes midio `killswitch` en 1672 caracteres e
      `inference-proxy` en 2274: dos pantallas de conmutadores sin una sola tabla. Lo que separa los
      casos es `tablas_vacias`, no el texto, y el fixture del formulario esta puesto para que
      romperlo se note. Ademas: cuenta SUPERFICIES y no tomas (cada una se captura en claro y
      oscuro, y contarlas dos veces haria que «23 superficies» y «46 tomas» se usaran como
      sinonimos), la rancidez se mide por `sha256` de la imagen y nunca por fecha —una captura
      re-tomada sobre un arbol que no cambio da el MISMO png—, y sin manifiesto anterior dice que no
      lo miro en vez de declarar cero cambios. Hermetica: fixtures sinteticos, no captura nada.
    cmds:
      - bash scripts/test-r8-curar-superficies.sh

  lint:cli-session-claims:
    desc: >-
      ¿Los ejemplos de CLI de la documentacion citan comandos y flags que EXISTEN HOY? Es el
      defecto que este repo ha medido una y otra vez —documentacion que cita un flag retirado— en
      la superficie donde mas duele, porque el lector la copia y la pega, y ningun lint la miraba:
      los de markdown ven enlaces y formato, no si `--foo` sigue existiendo.
      LA AUTORIDAD ES EL BINARIO, no un `grep` del fuente: un comando puede estar declarado y no
      registrarse, y un flag declararse en una funcion que nadie llama. Lo que el lector va a
      teclear es lo que el binario acepta, asi que la pregunta se le hace a el.
      Resuelve SOLO lo que el documento cita (la primera version recorria el arbol entero: 65
      comandos de primer nivel y mas de dos minutos sin terminar) y toma el PREFIJO MAS LARGO que
      responde, porque una ruta citada mezcla comandos con argumentos.
      Fail-closed: sin binario sale 2 y lo dice. La bateria es `lint:cli-session-claims-selftest`.
      ⚠ NO la llama el hook: necesita `bin/olivares` construido, y un gate del carril rapido que
      exige un `task build` de minutos no es un gate rapido. Va en el carril del integrador o a
      mano; su bateria, que es hermetica, si puede ir donde sea.
    cmds:
      # ⛔ VIA `hub-leg.sh`: el guion esta declarado hub-only (`export-public.sh`) porque audita
      #    `docs/launch/`, que la curacion retira entera. Sin esta envoltura el arbol publico
      #    tendria una tarea llamando a un fichero ausente y saldria 127; con ella dice NO
      #    APLICABLE nombrando el guion, que es la respuesta honesta.
      - bash scripts/hub-leg.sh lint:cli-session-claims scripts/check-cli-session-claims.sh

  lint:cli-session-claims-selftest:
    desc: >-
      La bateria de `check-cli-session-claims.sh`. HERMETICA: fabrica un binario señuelo que imita
      la salida de cobra, asi que no construye el CLI ni depende de su estado de hoy.
      Doce casos, cada verde con su mutante. Los dos que de verdad separan: un flag que existe en
      OTRO subcomando (el error mas probable, copiar un ejemplo de un comando a otro) y una
      PLANTILLA `olivares <subcommand> [flags]`, que describe una forma y no afirma que exista un
      comando llamado `<subcommand>` — era el unico hallazgo del verificador contra la
      documentacion real, y era falso.
    cmds:
      # Misma envoltura y por la misma razon: la bateria prueba un guion que no viaja.
      - bash scripts/hub-leg.sh lint:cli-session-claims-selftest scripts/test-cli-session-claims.sh

  lint:session-duplicates:
    desc: >-
      La bateria del censo de numeros duplicados (scripts/test-session-duplicates.sh). El CENSO
      no es una puerta —su tarea es census:session-duplicates y la cabecera del guion dice por
      que—, pero su bateria SI corre en el carril rapido: cuesta menos de un segundo, construye
      sus propios repositorios señuelo y nunca mira el arbol vivo, y sin ella el guion se pudre
      sin que nadie lo note. Un censo roto contesta "cero duplicados" con la misma cara.
    cmds:
      - bash scripts/test-session-duplicates.sh

  census:session-duplicates:
    desc: >-
      CENSO (no gate) de números de sesión con más de un fichero en origin/main. Existe porque
      lint:session-numbers pregunta "¿este cambio reclama un número tomado?" y con los dos lados
      ya aterrizados NO HAY CAMBIO que mirar: el 2026-08-20 main llevó dos ficheros del mismo
      número y ninguna corrida iba a nombrarlos. Deliberadamente FUERA del carril rápido, y la cabecera del
      guion dice por qué con las dos medidas: la regla global reporta cuarenta no-colisiones (52
      números, 37 tras colapsar anexos) y además enrojecería a una sesión que aterriza su brief y
      su informe en el mismo push. Se CORRE, no bloquea.
    cmds:
      - bash scripts/check-session-duplicates.sh

  lint:session-numbers:
    desc: >-
      Refuse to land a brief that claims a session number another brief already claimed.
      The check is INCREMENTAL against origin/main, not a corpus property, because "one
      number, one brief" is FALSE here by design: a number legitimately hosts several
      branches over its life — measured, one carries nine slugs and another eight — and one
      session owns several files (brief, log, sub-encargos), so a global uniqueness rule
      reports forty non-collisions and gets ignored. What it enforces is the shape that
      actually bit us twice: eleven annexes claiming a range of numbers four hours after
      briefs under sessions/ had taken them, in ONE commit; and a renumbering that assigned
      a number verified free and landed eight hours later with that number taken. A free
      number expires between the measurement and the merge, so the answer is only true at
      merge time. Four declaration forms are read in precedence (the ENCARGO heading, the
      session table row, new-session.sh, the worktree path) and the harness kills a mutant
      per form, because a detector matching only new-session.sh reported ZERO with live
      collisions. It also proves the NOT-catching direction — a brief that deliberately
      reuses another lane's worktree, which three of them do; a lettered sibling, whose
      suffix makes it a different session from its parent; a brief editing itself; a board
      merely mentioning a number — since a check tested in one direction only is half a
      check. An unresolvable base or a missing repository exits 2 as "could not look" and is
      NEVER reported clean: a SKIP inside a guard is a PASS under another name. Hermetic:
      the harness builds throwaway repositories under a temp dir and writes nothing to this
      one.
    cmds:
      # Through hub-leg.sh, not directly: this Taskfile ships to the public export
      # VERBATIM while export-public.sh curates both scripts OUT of it, so a direct
      # invocation would die there at exit 127 — a tree that looks broken rather than
      # curated. The wrapper answers NOT APPLICABLE in a proven export and REFUSES
      # anywhere else, which is the point: it will not guess which tree it is in.
      - bash scripts/hub-leg.sh lint:session-numbers scripts/test-session-numbers.sh
      - bash scripts/hub-leg.sh lint:session-numbers scripts/check-session-numbers.sh

  e2e:request-id-live:
    desc: >-
      El `X-Request-ID` en pantalla, contra un MOTOR REAL. Ve lo que el unit test no puede: que
      `client.ts` lea la cabecera de una respuesta HTTP de verdad, que el `ErrorState` se monte en
      la ruta real y que `errors:requestId` resuelva en el bundle SERVIDO. Dos casos con
      precondicion explicita (si la consola no llega a pedir la lista, falla diciendo ESO) y un
      control negativo que exige ver el error pintado antes de afirmar que no hay id.
      NO va al carril rapido: necesita `serve --seed-demo` y PLAYWRIGHT_BASE_URL.
    dir: web
    cmds:
      - npx playwright test e2e/request-id-live.spec.ts --reporter=list

  console:walk:
    desc: >-
      Drive the embedded console with a REAL browser against a RUNNING engine and report what
      an operator would actually hit: console errors, uncaught page errors, and requests the
      engine answered 4xx/5xx or never completed. Not a screenshot test and it asserts no
      layout — it reports three facts per screen. It exists because nothing else opens a
      browser: test:web runs the console against mocks and web:check only proves the committed
      bundle matches its sources, so a TYPED API CLIENT CALLING AN ENDPOINT THE ENGINE NEVER
      REGISTERS is invisible to both — the console asks, the engine answers 404, and every unit
      test stays green because the mock answered. The first run found exactly that, twice, on
      one screen, across 52 screens whose routes it discovers from the app's own navigation
      rather than from a hand-written list that goes stale the day a screen is added. Screens
      that hold a server-sent-events stream open are walked to domcontentloaded and reported as
      STREAMING, because waiting for network idle on a connection designed to stay open reports
      the feature working as a failure — that cost a false finding on the first run. Three
      answers: 0 clean, 1 findings, 2 could not look (no browser, no playwright, or zero routes
      discovered — an empty walk is never a clean one). RUN IT AS `task -x console:walk`:
      measured 2026-08-07, plain `task` collapses EVERY failing code to 201 (probed with a
      throwaway Taskfile: `exit 1` and `exit 2` both surface as 201), which silently merges
      "found defects" with "could not look" — the one distinction this tool exists to make.
      `-x` passes the code through, verified 1 -> 1 and 2 -> 2. Needs an engine: start one with
      `olivares quickstart` and pass OLIVARES_WALK_BASE, plus OLIVARES_WALK_TOKEN on a first
      boot so it can create the first administrator. It resolves playwright from web/'s own
      dependency graph; the repo root's node_modules holds commitlint and nothing else.
    cmds:
      - node scripts/console-walk.mjs

  lint:commit-identity:
    desc: >-
      Refuse to push a commit carrying a private e-mail address. CLAUDE.md and the canon have
      required the project noreply address since 2026-08-02 and NOTHING checked it: measured
      2026-08-10, `git config --global user.email` in two containers still held the personal
      address, and only a --local override kept one clone clean — 59 of the last 60 commits in the
      web repository carry it. The author address travels with every commit, these repos are
      exported publicly, and a published private address is never withdrawn. Scoped to the commits
      the push INTRODUCES and authored on or after the cutoff: main already carries 2210 older
      ones, and charging a pusher for history they cannot rewrite is the premise error that got
      the unpublished-work ratchet withdrawn the same day it landed. ~1s.
    cmds:
      - bash scripts/hub-leg.sh lint:commit-identity scripts/check-commit-identity.sh

  fastlane:
    desc: >-
      Corre EXACTAMENTE el carril rápido del hook (84 tareas hoy), sin gate pesado y sin mutex.
      Para el integrador: el gate pesado en `main` es aritmética imposible —63 min medidos en vivo
      el 2026-08-18 mientras `main` avanzaba dos commits— y el remedio sancionado es `--no-verify`,
      que salta el pesado PERO TAMBIÉN el rápido. Ese día dos baterías con `printf | grep -q`
      aterrizaron así y rechazaron el push de los cinco carriles. Esto paga el rápido a mano, ~10
      min, antes de un push declarado. La lista se DERIVA del hook: no hay cuarta copia.
    cmds:
      - bash scripts/run-fastlane.sh

  lint:holds:
    desc: >-
      INT-23 — ningún lote pisa un HOLD o un veto VIGENTE. La fuente es
      design/HOLDS-Y-VETOS-VIGENTES.md y este gate la EJECUTA: un registro que sólo se lee no
      impide nada. Sólo cuenta un MERGE de verdad (dos padres) que nombre el PR vetado —
      citarlo en prosa no bloquea, porque hay commits de este árbol que lo citan para explicar
      por qué NO se mergea. Batería de 6 casillas. ~0,2 s.
    cmds:
      - bash scripts/check-holds.sh

  lint:holds-selftest:
    desc: INT-23 — batería de check-holds.sh (6 casillas, con el control del falso positivo).
    cmds:
      - bash scripts/test-check-holds.sh

  lint:tenant-bound-reads:
    desc: >-
      El trinquete de LECTURA del binding de inquilino: toda clave de react-query de datos por
      inquilino tiene que LLEVAR el inquilino. Una clave sin el hace que dos inquilinos compartan
      entrada de cache y la victima no ve un error, ve DATOS DE OTRO -- la clave es la unica
      segregacion, porque nadie limpia la cache al cambiar de inquilino (medido y escrito en
      web/src/lib/api/search.ts sobre este mismo defecto ya corregido). Es un TRINQUETE, no una
      campana: el arbol esta limpio (406 claves, 377 con inquilino, 29 globales legitimas). La
      exencion se DERIVA DEL MOTOR -- authzSystem, handler que ignora el contexto, o el recurso ES
      el inquilino -- y vive en docs/tenant-bound-reads-baseline.txt con su razon.
    cmds:
      - bash scripts/check-tenant-bound-reads.sh

  lint:tenant-bound-reads:selftest:
    desc: >-
      Bateria de check-tenant-bound-reads.sh -- 6 casillas, y una existe por un falso positivo
      propio: una firma MULTILINEA con inquilino salia como hallazgo. Un patron de una linea
      inventa hallazgos, y aqui el falso positivo es peor que el negativo: manda a «arreglar» una
      clave correcta anadiendole un parametro que sus llamadores no pasan.
    cmds:
      - bash scripts/check-tenant-bound-reads.sh --selftest

  lint:tenant-bound-writes:
    desc: >-
      En un fichero de cliente que YA ata el inquilino, una escritura que NO lo ata es un
      SUPERVIVIENTE. La peticion normal ya queda acotada (el cliente fija el inquilino al entrar);
      lo que queda abierto es la MUTACION PAUSADA — offline, reintento — que se reanuda DESPUES de
      un cambio de inquilino. Alcance deliberado: solo los ficheros que ya importan
      `TenantRequestOptions`, porque un trinquete sobre las ~363 escrituras del arbol naceria con
      ~330 exenciones y eso no es un trinquete. Y CRECE SOLO: cuando alguien ata la primera
      escritura de otro fichero, ese fichero entra en el alcance.
      ⛔ NO va en el gate de push: el mecanismo nace en #1613 y hasta que aterrice contesta
      3 → «NO APLICA TODAVIA», que NO es CLEAN y lo dice con esas palabras.
      Cuatro respuestas: 0 limpio · 1 supervivientes · 2 NO PUDE MIRAR · 3 no aplica todavia.
    cmds:
      - bash scripts/check-tenant-bound-writes.sh

  lint:tenant-bound-writes:selftest:
    desc: >-
      Bateria de check-tenant-bound-writes.sh — 7 casillas, y DOS de ellas no pueden correr en
      `main` porque el mecanismo aun no existe ahi: cuando pasa, el resumen dice «5/7 … 2 SIN
      CORRER» en vez de fingir 7, y explica como calibrarlas (OLIVARES_SELFTEST_SRC apuntando a un
      arbol de #1613). Esas dos son las que importan: la primera version imprimio CLEAN sobre un
      arbol lleno de supervivientes porque el awk de estas cajas es mawk y NO soporta
      `{2}` en una expresion regular, asi que el patron no casaba nada y todas las escrituras se
      saltaban en silencio.
    cmds:
      - bash scripts/test-tenant-bound-writes.sh

  lint:list-truncation-witness:
    desc: >-
      Una feature de consola que consulta una LISTA VIVA y no publica en NINGUNA vista si esa
      lista viene RECORTADA. El motor pagina a 100 por defecto y publica `has_more`; una vista
      que lee solo `items` ensena una lista completa que no lo es, sin fallar ni avisar.
      ⛔ NO ESTA EN EL GATE DE PUSH, Y ES DELIBERADO: hoy da 1 con 19 features, asi que colgarlo
      del hook bloquearia a los cinco carriles por deuda ajena y preexistente. Es el INSTRUMENTO
      del censo — la Matriz marca `parcial` (no `completo`) cada pantalla con lista viva sin
      testigo mientras esto pase de 0. Se cuelga del hook cuando llegue a 0, no antes.
      El censo es un SUELO: va por FEATURE (una cubierta puede esconder vistas sin cubrir) y por
      FUENTE (no prueba alcanzabilidad). Y NO mide el motor: lo que drena con `listAll` no tiene
      recorte que declarar y sale del censo con su file:line. Tres respuestas: 0 / 1 / 2.
    cmds:
      - bash scripts/check-list-truncation-witness.sh

  lint:list-truncation-witness:selftest:
    desc: >-
      Bateria de check-list-truncation-witness.sh — 6 casillas: CONTROL NEGATIVO (una feature
      fabricada sin testigo TIENE que cazarse; su primera corrida cazo que el guion era ciego por
      un `| grep -q` bajo pipefail, que devuelve 141 EN EXITO), control positivo, una feature sin
      lista viva que no es asunto suyo, un directorio ausente que sale 2 y nunca 0, y la
      calibracion contra el arbol REAL por los dos lados: `health` no sale (declara en 3 vistas) y
