      Derive the four self-hosted business add-on sets from design/PRICING-CANON.md, which is the
      source the entitlement design names (DISENO-ENTITLEMENT-POR-MODULO 2.1) and NOT the
      activation catalogue, which is cumulative by tier and lacks compliance-packs entirely. The
