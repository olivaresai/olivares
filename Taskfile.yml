      NOT published from this tree. It no longer freezes the old
      https://olivares.ai/updates literal — that path had no producer and no server
      (404 measured 08-20 and 08-27), so freezing it pinned every community binary to
      a dead endpoint and would have gone red on the change that carried the signature
      out. What it checks instead is the coupling nothing else compares: the CLIENT
