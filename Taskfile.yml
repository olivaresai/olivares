      Bateria de check-cli-transport-exempt.sh — 9 casillas, cada una en las DOS direcciones: sin
      exencion / con exencion valida, marcador pelado, razon demasiado corta, y las dos que fijan
      la regla de adyacencia (un comentario de 13 lineas NO agota la exencion; una linea de CODIGO
      entre medias SI la corta). Mas el mensaje nombrando la regla, la poblacion insuficiente
      saliendo 2 y la raiz inexistente saliendo 2 — nunca 0.
    cmds:
      - bash scripts/test-cli-transport-exempt.sh

  lint:gate-lock-order:
    desc: D-1/L-02 — el robo del mutex se evalúa ANTES de rendirse (WAIT > STALE)
    cmds:
      - bash scripts/test-gate-lock-order.sh

  lint:screenshot-freshness:
    desc: a repository gate — ¿cuánto van las capturas por detrás de la UI? (margen de 7 días)
    cmds:
      # ⛔ LA BATERÍA VA PRIMERA Y **SIN** `|| true`, y la distinción es la que le faltaba a este
      #    gate: que el gate no bloquee es una decisión; que su batería no bloquee sería no tener
      #    batería. El 2026-08-17 se le encontró que su patrón seleccionaba 10 ficheros y los 10
      #    eran archivo histórico — cero cobertura del material vivo — y nada lo vio porque nada
      #    comprobaba QUÉ examina.
      - bash scripts/test-screenshot-freshness.sh
      # ⛔ EL `|| true` SE RETIRA AQUÍ, y no porque la deuda se haya cerrado: porque `|| true` no
      #    distingue «siguen las 38 de siempre» de «ahora son 60». El gate que existe para que nada
      #    envejezca en silencio dejaba crecer su propia deuda en silencio.
      #
      #    Lo sustituye un MARGEN DE RETRASO, y no un techo de conteo: un techo por número de
      #    obsoletas vuelve a su máximo con CADA commit de UI —las capturas quedan por detrás por
      #    mecánica, no por descuido—, así que enrojecería siempre y acabaría otra vez en `|| true`.
      #    Lo que distingue lo sano de lo podrido es CUÁNTO va por detrás una captura: una tomada
      #    hoy con un commit de UI esta tarde es correcta; las 8 del reel iban 23 días. La política
      #    es una semana, y se cambia cuando cambie la política, no cuando el árbol esté al día.
      #    ⚠ 2026-08-28 (the planner / a repository gate): la política pasa TEMPORALMENTE de 7 a 14 días hasta que
      #    aterrice el gate por diff o hasta el 2026-09-04, lo que llegue antes. Medido: las cuatro
      #    capturas de login/setup cruzaron los 7 días por reloj (8) sin que nadie tocara nada; regenerarlas da
      #    bytes IDÉNTICOS (la UI no cambió), así que no hay commit posible que las «refresque», y a 7 días el
      #    gate mataba TODO push de rama de la caja desde las 16:19Z. Es un cambio de política registrado, no
      #    un `|| true`: el gate sigue midiendo y sigue matando a quien vaya más de 14 días por detrás.
      #    ⛔ Y LO QUE NO SE HACE EL 4 DE SEPTIEMBRE: si esto vuelve, la respuesta NO es subir el
      #    número otra vez. La solución es medir cada captura contra la fuente que RETRATA (a repository gate),
      #    no contra el último commit de la UI entera — que es lo que hace insatisfacible el gate
      #    para una pantalla que nadie ha tocado. Frase traída de #2024 al integrar: es la única
      #    parte de su versión que este bloque no decía ya.
      #    ⛔ Y POR QUE a una rama de consola le hace falta este margen, traido de #2049/#2063 al
      #    integrar: una rama que arregla ficheros de `web/src/features` mueve `UI_TS` a HOY, y si su
      #    base es de hace seis dias sus capturas quedan a ONCE dias de un reloj que ella misma acaba
      #    de adelantar. No estan rancias: `UI_TS` mide la UI ENTERA, no la pantalla que cada captura
      #    retrata. Con margen 14 pasa (la peor va por 11). Es la misma causa que a repository gate cierra.
      - OLIVARES_SCREENSHOT_MAX_LAG_DAYS=${OLIVARES_SCREENSHOT_MAX_LAG_DAYS:-14} bash scripts/check-screenshot-freshness.sh

  lint:config-coverage:
    desc: a repository gate — variables que el CÓDIGO LEE y están documentadas (trinquete)
    cmds:
      - OLIVARES_CONFIG_DOC_FLOOR=${OLIVARES_CONFIG_DOC_FLOOR:-7} bash scripts/check-config-coverage.sh

  lint:ci-env-reach:
    desc: >-
      Que la variable que ENCIENDE la suite del cloud llegue AL JOB QUE LA EJECUTA.
      GITHUB_ENV es por job: fijarla en otro no la hace llegar, y la suite se salta en
      silencio mientras se la da por ejecutada. Deriva las variables de
      os.Getenv() en las fuentes, no de una lista escrita a mano.
      Portado a Go el 2026-08-19: la version python hacia `import yaml` y NINGUN
      contenedor nuestro tiene PyYAML ni pip, asi que contestaba 2 en todos ellos y
      rechazaba TODOS los push. Corre el gate Y su matriz de mutacion, como
      lint:ci-ports: un gate que solo se ha visto pasar nunca se ha visto funcionar.
    cmds:
      - bash scripts/check-ci-env-reach.sh
      - bash scripts/test-ci-env-reach-gate.sh
  lint:prose:
    desc: >-
      CUATRO gates baratos que la prosa rompe —export, inbox, spdx, actions— en un comando.
      Se corre antes de un push que anade comentarios: `--no-verify` —el bypass sancionado
      para main— tambien salta los fast-lints, y con ellos lint:export, que es el
      bloqueante n1 de publicacion.
      NO cubre la clase entera y por eso dice cuatro y no «los»: la prosa tambien rompe
      lint:docs-honesty (106 s) y lint:public-counts, fuera a proposito por coste.
      Y NO es un control: nada obliga a correrlo. Es una costumbre, con el mismo modo de
      fallo que la enfermedad que dice curar — la barrera de verdad seria CI automatico
      sobre lint:export. Distingue las tres respuestas: 0 limpio, 1 roto, 2 no he podido
      mirar (un arbol ilegible NO es un arbol publicable).
    cmds:
      - bash scripts/check-prose-gates.sh
  lint:console-route-docs:
    desc: >-
      a repository gate (consola): cuantas rutas del censo aparecen en la documentacion inglesa.
      Mide MENCION, no explicacion, y lo dice: una ruta que nadie nombra no puede estar
      documentada, asi que el conjunto marcado es un limite superior honesto. Ratchet con
      suelo; nombra las que faltan en vez de dar solo un numero.
    cmds:
      - bash scripts/check-console-route-docs.sh
  lint:cli-coverage:
    desc: a repository gate — cuántos comandos del CLI están documentados (trinquete, no exige el 100 %)
    cmds:
      - OLIVARES_CLI_DOC_FLOOR=${OLIVARES_CLI_DOC_FLOOR:-12} bash scripts/check-cli-coverage.sh

  lint:client-callers:
    desc: C07-04 — ¿tiene PANTALLA cada método del cliente de la consola? (trinquete)
    cmds:
      - node scripts/check-client-callers.mjs

  lint:client-callers-selftest:
    desc: Batería de casos rojos del trinquete de llamantes (árbol señuelo, sin puerta trasera)
    cmds:
      - node scripts/check-client-callers.selftest.mjs
  lint:unpublished-work:
    desc: >-
      A RATCHET on work that exists only in this clone. Measured 2026-08-10: 41 local branches
      had no counterpart on the remote and 20 carried ~73 commits whose patches were not in
      main, thirty of them from July. Their only copy was this clone's .git. The canon has
      required "commit + push + PR" for weeks and nothing ever checked it. A ratchet rather
      than a refusal, because the session that never pushes is precisely the one a push-time
      gate cannot catch: what it can do is stop the pile GROWING. Published means a branch on
      the remote OR an entry under refs/archive/, so abandoned work can be preserved without
      minting branches that look live.
    cmds:
      - bash scripts/hub-leg.sh lint:unpublished-work scripts/check-unpublished-work.sh

  lint:overlay-seal:
    desc: >-
      a repository gate-C — the ONE fetch of the sibling overlay clone per act, and the
      freshness seal the seven checkers that read its origin/main require. A
      frozen ref is not a verdict: on 2026-08-29 the whole box compared against
      an overlay main a merge behind, because the clone fetches over SSH (silent
      failure without a key) and pushes over HTTPS. Runs first, before any leg
      that reads that clone.
    cmds:
      - bash scripts/fetch-overlay-seal.sh

  lint:overlay-seal:selftest:
    desc: >-
      a repository gate-C — the bench: a fixture overlay plus the five mutants (stale seal,
      fresh seal naming another ref, sealed failed fetch, no seal, malformed),
      each moving only its own dimension, and the positive.
    cmds:
      - bash scripts/test-overlay-seal.sh

  lint:disk-headroom:
    desc: >-
      Refuse to start a gate the disk cannot finish. Measured 2026-08-10: the eleven-module
      build died with `link: mapping output file failed: no space left on device`, which reads
      exactly like a compiler error and was not one — /workspace was at 100% with 1.3G free,
      filled by 31 single-use GOCACHE directories, one per finished agent run. Freeing the dead
      ones took it to 22G and the same build returned 0. This is the THREE ANSWERS applied to
      the machine: without it a gate cannot tell "the code is broken" from "I could not look",
      and the reading a human makes at speed is the wrong one. Floor 15G (one full local gate
      links eleven modules plus the connector plugins), warning band 30G so a lane is told
      BEFORE the next agent's cache pushes it over. Instant: one `df`.
    cmds:
      - bash scripts/check-disk-headroom.sh
      - bash scripts/check-disk-headroom.sh --selftest

  lint:nul:
    desc: >-
      Refuse a raw NUL byte in anything this repository treats as text. It is not a style rule:
      grep classifies a file containing a NUL as BINARY and answers `binary file matches` — a
      match with NO line and NO content — so `grep -q` and `grep -c` keep working while every
      pipeline that reads LINES gets nothing. This project gates a great deal by grepping its
      own sources (the Dodo source anchors, check-spdx, export-closure, the fast lane's text
      ratchets), so one NUL can silently blind the gate guarding a file while every other signal
      stays green. MEASURED 2026-08-07 by walking into it: six raw NULs entered two
      license-worker sources and passed tsc, 223 unit tests, lint:spdx and the whole fast lane.
      Real binaries are skipped by a DECLARED extension list plus anything .gitattributes marks
      `binary`, and the verdict PRINTS both counts — a check that will not say what it skipped
      is the fail-open shape docs/08 §7 forbids. Incompleteness of that list is safe by
      construction: a new binary format goes RED and names the file (loud, one line of config),
      never quiet on a text file. Three answers: 0 clean, 1 dirty (named, with byte offset and
      line), 2 could not look. 0.7s over 10118 tracked files.
    cmds:
      - bash scripts/check-nul-in-sources.sh

  lint:nul-gate:
    desc: >-
      The battery for lint:nul — seven cases over real throwaway repositories, with mutants in
      BOTH directions: removing the binary-extension skip must flag a .png, removing the
      .gitattributes skip must flag a declared binary, and a gate that never looks for a NUL
      must report CLEAN on a dirty tree. A skip that is too wide and a scan that does not scan
      fail in opposite ways, so one mutant cannot cover both. 0.3s.
    cmds:
      - bash scripts/test-check-nul-in-sources.sh

  lint:hooks-path:
    desc: >-
      The gate that runs every other gate has to be reachable, and nothing was watching
      whether it still was. core.hooksPath lives in .git/config, which every LINKED WORKTREE
      of a clone SHARES — 39 of them in the hub when this was written — and `task setup`
      asserts it exactly once, at install time. Four states make the hooks go silent and all
      four look identical from outside, a push that sails through: UNSET (git falls back to
      $GIT_COMMON_DIR/hooks, shared, which is not this repo's .githooks), ABSOLUTE (every
      worktree runs one fixed tree's hooks, so a branch runs a hook newer than its checkout
      while the tasks it invokes resolve against the branch's older Taskfile — its push then
      fails asking for a task its tree does not define, with an unrelated diff; reported by
      the orchestrator on 2026-08-07), MISSING, and NOT EXECUTABLE — the quietest of the four,
      because git SKIPS a hook it cannot execute with no error and no exit code. Three
      answers: 0 clean, 1 broken (naming WHICH of the four, its consequence and the one-line
      repair), 2 could not look. Its battery drives real throwaway repositories and gives
      every red case a MUTANT leg that must flip it green, since a guard whose removal
      changes nothing was never testing anything; a leg that cannot RUN counts as a failure,
      never a skip. ⚠ Honest limit, spelled out in the script: invoked FROM the pre-push
      hook it can only catch ABSOLUTE, because the other three mean no hook ran at all.
      They are caught when this task is run directly. ~0s.
    cmds:
      - bash scripts/check-hooks-path.sh

  lint:emitted-urls:
    desc: >-
      Una URL que el producto MANDA tiene que ser una URL que responda. `core/api/stability.go:52`
      va en la cabecera `Link` de toda respuesta deprecada y apunta a
      `docs.olivares.ai/reference/api-stability/` (sin esquema a propósito: documentar una URL
      muerta no debe publicarla) — medido el 2026-08-13, cinco intentos:
      404 las cinco veces. La página EXISTE en este repo y no está desplegada en ese host. Dos
      URLs de docs más hacen lo mismo. Un cliente que sigue nuestra propia política de estabilidad
      de API aterriza en un 404, y nada lo medía porque nadie unía «el producto emite una URL» con
      «esa URL contesta»: que la página esté en el repo no es que esté en la web. La membresía se
      DERIVA del código publicado; el registro lleva la fecha de medición y caduca a los 45 días;
      un 404 declarado exige dueño y se NOMBRA en cada corrida para que no se vuelva mobiliario.
      Sin red en el hook: `--probe` la usa, cinco intentos, y escupe las líneas que pegar.
    cmds:
      - bash scripts/check-emitted-urls.sh --selftest
      - bash scripts/check-emitted-urls.sh
  lint:readme-task-claims:
    desc: >-
      Los siete READMEs que publicamos decían «CI walks the same path: `task smoke:quickstart`»
      y `.github/` no lo referenciaba EN NINGÚN SITIO: la tarea existía y funcionaba, pero nada
      la corría, así que la ruta install→valor del quickstart y sus cifras de drift no las
      vigilaba nadie. Radio ×7, porque las seis traducciones llevan la misma frase. Y las cifras
      ERAN ciertas: lo falso era que algo las mantuviera ciertas — una promesa sobre el FUTURO,
      que sólo un gate sostiene. Distingue promesa de instrucción (`task build` es para el
      lector, no para CI), casa el token EXACTO (`task build` casaba con `task build:bin`) y
      exige que las traducciones nombren el MISMO conjunto. Con su propia batería de casos rojos.
    cmds:
      - bash scripts/check-readme-task-claims.sh --selftest
      - bash scripts/check-readme-task-claims.sh

  lint:portal-brand:
    desc: >-
      El portal de licencias es una superficie de MARCA y hasta 2026-08-13 NINGÚN gate lo miraba:
      lint:brand-parity compara web/tokens con la web pública por un mapa fijo y no toca
      commercial/; lint:email-brand descubre por marcas de CORREO, que el portal no lleva; y
      `grep -n portal Taskfile.yml` daba cero líneas. De los 17 colores literales que el portal
      escribe, sólo DOS existen en el canon — el mismo cliente abre un correo pintado con los
      tokens y pulsa un botón que le lleva a un portal que no comparte una sola superficie con él.
      Comprueba las dos cosas que un cliente NOTA: contraste AA de los pares que lee, y que el
      relleno de marca sea el del canon. La membresía se DERIVA de src/portal/, nunca una lista.
      FAST: no toca red, ~1s.
    cmds:
      - node scripts/check-portal-brand.mjs

  lint:commit-identity-gate:
    desc: >-
      The battery for lint:commit-identity — eleven cases, each acceptance paired with the
      refusal that proves it discriminates, plus a mutation control that removes the App-account
      exception and requires the dependabot case to go RED. The gate landed 2026-08-10 with NO
      test and was found on 2026-08-13 refusing every dependabot commit in the repository
      (origin/main carries none in its last 500). Nothing had ever asked it what it said about a
      bot. One case is about the battery itself: the hook EXPORTS OLIVARES_PUSH_REFS_FILE, so the
      first version measured the outer push instead of its own fixtures and passed 10/10 by hand
      while failing 4 from a real push. FAST lane: throwaway repositories, no network, ~1s.
    cmds:
      - bash scripts/hub-leg.sh lint:commit-identity-gate scripts/test-check-commit-identity.sh

  lint:hooks-path-gate:
    desc: >-
      The battery for lint:hooks-path — nine cases, each red one with a mutant that must
      flip it green. FAST lane: it touches no network and builds only throwaway
      repositories, so it is deterministic and costs a second. It needs scratch space whose
      EXECUTE BIT IS REAL: on a noexec mount `test -x` answers false even when the bit is
      set (measured 2026-08-07), which would turn the clean case red and the
      not-executable case green — both directions broken, one silently. See
      scripts/lib/exec-workdir.sh.
    cmds:
      - bash scripts/test-check-hooks-path.sh

  cli:walk:
    desc: >-
      Walk EVERY command of the binary and report what an operator would hit. The sibling of
      console:walk for the other half of the product, and it did not exist: measured 2026-08-19,
      185 commands across three levels and nothing drove them against an engine. Two checks are
      local — every command's --help works, and an unknown flag returns 2, which the binary's own
      help publishes as its usage code — and one needs a live engine: a command whose route the
      engine answers 404 is calling something that is not registered, exactly what console:walk
      found on the web side. A 401/403 is NOT a finding: it is a door working.
      ⛔ IT DECLARES ITS OWN REACH, and that is the point. The first manual pass reported «0
      findings across 33 read-only commands»; 25 of those 33 exited 2 for missing arguments and
      NEVER TOUCHED THE ENGINE. A walk that reaches nothing is not clean, it is blind — with an
      engine configured and zero commands reaching it, this exits 2.
      Needs OLIVARES_CLI_BIN; OLIVARES_CLI_BASE and OLIVARES_CLI_PIN add the live half.
      RUN IT AS `task -x cli:walk`: plain `task` collapses every failing code to 201, which merges
      «found defects» with «could not look» — the one distinction this tool exists to make.
    cmds:
      - node scripts/cli-walk.mjs

  test:cli-walk:
    desc: >-
      Prove cli:walk tells its three answers apart, against DECOY binaries rather than the real
      one — thirteen cases, each constructing the shape it asserts. It carries the case this tool
      exists for: a decoy whose read-only commands all exit 2 (never reaching the engine) must
      answer «could not look», not «clean». That is the exact mistake the tool was written after.
    cmds:
      # El guion ELIGE su scratch en vez de recibirlo impuesto: prueba $TMPDIR, luego un dir
      # repo-local gitignorado, luego /var/tmp, y se queda con el primero que sea escribible Y
      # ejecutable. Antes esta tarea fijaba TMPDIR aqui, como lint:error-mappers, y el contraste
      # `sol max` de mostro los dos filos de hacerlo a ciegas: rechaza en un checkout de CI
      # read-only, y ANULA un TMPDIR bueno que el runner pudiera aportar. Cada caso escribe un
      # binario senuelo y lo EJECUTA, y /tmp es tmpfs+noexec en el contenedor de desarrollo: con el
      # TMPDIR por defecto los quince casos salian "3 pasan, 12 fallan" -- doce hallazgos FALSOS
      # contra un producto sano, peor que no correr, porque manda a depurar defectos que no existen.
      - cmd: |
          bash scripts/test-cli-walk.sh

  test:console-walk:
    desc: >-
      Prove the browser walk tells its three answers apart, against a DECOY console rather
      than the real one. console:walk is the only thing here that opens a browser, so every
      "the console works" rests on it — and on 2026-08-07 it was wrong in two ways at once,
      both of which made it QUIETER than the truth: it could not resolve playwright and
      exited 2 ("could not look", which reads like clean in a log), and its finding predicate
      ignored navigation timeouts, so a screen that never loaded printed its timeout and was
      then counted CLEAN, exit code and all. The decoy serves four screens with four known
      answers — a held-open text/event-stream (the feature working), a held-open NON-stream
      (a real stall), a 404, and a quiet page — because those first two are indistinguishable
      by anything except content-type. It owns its port and a throwaway directory, touches no
      repository state and needs no engine. NOT in the push gate: it needs Chromium, like
      at:gate and e2e:web, so it belongs to the release run alongside them.
    cmds:
      - bash scripts/test-console-walk.sh

  lint:worktree-identity:
    desc: >-
      Does git operate on the tree this repository IS? On 2026-08-16 at 03:36 the shared clone's
      .git/config acquired core.worktree pointing at another session's worktree, so every git
      command run there described someone else's files: status reported 54 modified, 194 deleted
      and 214 untracked, and the measurement that closed it is symmetric — all 194 "deleted"
      existed and none of the 214 "untracked" did. A probe file created in the clone was invisible
      to git. Nothing was dirty; the lens was. The cost is not the confusion but what the obvious
      remedies do under it: reset --hard or checkout -- . from there destroys the OTHER tree, which
      is the class of both 2026-08-08 losses, and the hub's own config still carries
      rescue/s441-canonical-worktree-2026-08-05 from an earlier round. Third occurrence. It
      compares the script's OWN physical path against rev-parse --show-toplevel rather than
      reading core.worktree, because reading the key is wrong in both directions: measured on git
      2.39.5, GIT_CONFIG_PARAMETERS='core.worktree=X' makes `config --get` print X while git keeps
      using the real root (false alarm), and GIT_WORK_TREE=X redirects the tree while `config
      --get` prints nothing at all (blind). Comparing paths measures the property and catches any
      mechanism, including the next one. Three answers: OK / FAIL naming both paths / UNVERIFIED
      (exit 2 — git absent or not a repository), never a silent green. Under a second, with seven
      fabricated fixtures including a linked worktree, which is legitimate and must stay green.
    cmds:
      - bash scripts/check-worktree-identity.sh

  lint:mute-pipefail:
    desc: >
      RATCHET for scripts that can die MUTE. Under `set -euo pipefail`, an assignment whose command
      uses the rc as DATA (grep/comm/diff/cmp) kills the script — and what it kills is the NEXT
      line, usually the one that explains the problem. Measured 2026-08-31 on a real house gate:
      rc=1 with EMPTY stderr, and the `fail` that names the guard was unreachable exactly when its
      condition was true. It fails BOTH ways: `grep | head -1` dies with no matches AND with many
      (head closes the pipe, grep gets SIGPIPE 141, pipefail propagates) — so it is green on a
      small fixture and mute in production. Fast lane: bash + python3 only, no node. The baseline
      is a LIST keyed by file+VARIABLE (ci/mute-pipefail-baseline.txt — under ci/ because it must
      TRAVEL with the gate in the public export, and design/ publishes zero paths), not a count and not a
      line number: a count lets substitution through, and line numbers move with any edit above.
    cmds:
      - bash scripts/test-check-mute-pipefail.sh
      # `--gate`: la puerta de producción rechaza cualquier anulación; la batería inyecta porque
      # llama SIN --gate. Mismo filo que midió el contraste en el trinquete de formato.
      - bash scripts/check-mute-pipefail.sh --gate

  lint:mid-operation:
    desc: >-
      Refuse to publish from a git operation left half-done. A stopped rebase, an unresolved
      merge or cherry-pick leaves a tree that is INTERNALLY CONSISTENT, so every content gate
      passes on it and a push publishes a PARTIAL state. Measured 2026-08-19 in the hub: a
      rebase flattened a merge commit, stopped on the same conflict twice, and the publish
      chain ran three gates that all passed before pushing a detached HEAD to main. Reads
      .git, not the tree, so it costs milliseconds. Does NOT duplicate lint:conflict-markers,
      which reads file CONTENT: a resolved-but-uncommitted rebase has no markers left.
    cmds:
      - bash scripts/test-check-mid-operation.sh
      - bash scripts/check-mid-operation.sh

  ci:run-skipped-steps:
    desc: >-
      Ask whether a CI run gave a COMPLETE verdict: per job it CLASSIFIES every skipped step as
      structural or substantive, and reports the ones that cost coverage — with or without a
      failure in front of them. A `skipped` is not "it was not needed", it is "it was not
      measured". Structural skips are decided by scripts/lib/skips-estructurales.txt (exact names,
      shared with ci:run-table so the two probes cannot drift) plus the runner pairing: a
      `Post Run X` is excused only when `Run X` exists in the same job. It reads the RUN object,
      not just its jobs, because while a run is open its job set is not stable; and it demands
      shape (steps present, conclusions non-null, total_count matching) before answering 0.
      Anything it cannot look at is a 2, never a 0. Needs `gh`; or feed it BOTH
      OLIVARES_RUN_JOBS_JSON and OLIVARES_RUN_JSON.
    cmds:
      - bash scripts/check-run-skipped-steps.sh {{.CLI_ARGS}}

  ci:run-skipped-steps:selftest:
    desc: >-
      Battery for the probe above: both verdicts, the two A-01 holes in opposite directions (a
      costly skip with no failure in front; an innocent `Post Run` beside a failure), an orphan
      `Post Run` that must NOT be excused, every "could not look" answer with its MESSAGE pinned
      — not just its code — and six mutants, each with its own discriminating fixture. One of
      those fixtures is deliberately synthetic and says so: on real API data an open run also
      carries a null conclusion, so without it the run-status mutant dies by the neighbouring
      guard and vouches for nothing. Fixtures are JSON, so it never touches the network.
    cmds:
      # export-closure: hub-only scripts/test-check-run-skipped-steps.sh — sus fixtures viven en
      # `test/fixtures/run-jobs/*.json` y esta curacion retira `test` ENTERO
      # (the export curation script). Son capturas reales de corridas de ESTE repo: no son material
      # publicable, y sin ellas la bateria no tiene con que correr. Guardada como sus hermanas, de
      # modo que en el arbol publicado la pata NOMBRE la razon en vez de morir con exit 127.
      - bash scripts/hub-leg.sh ci:run-skipped-steps:selftest scripts/test-check-run-skipped-steps.sh

  lint:git-env:selftest:
    desc: >-
      Witness for the damage detector of lint:git-env's poisoned-environment probe: four damages,
      each moving ONE observable, and for each one the fingerprint WITHOUT that observable, which
      must go blind. Answers the contrast finding that "removing refs= blinds it" did not
      discriminate — HEAD= alone already caught that damage.
    cmds:
      # hub-leg.sh porque el guion es HUB-ONLY: el export lo retira (junto a su sujeto
      # check-git-env-isolation.sh), y una llamada directa dejaria en el arbol publicado un
      # exit 127 en vez de un NOT APPLICABLE con nombre. Lo caza lint:export-closure.
      - bash scripts/hub-leg.sh lint:git-env:selftest scripts/test-git-env-huella.sh
      # La SEGUNDA VIA del trinquete —el dictamen por EJECUCION— va en la misma pata: mismo
      # sujeto, y una pata nueva serian tres declaraciones mas y otra fila en un registro
      # derivado. Cuesta 3 s medidos. Por hub-leg.sh por lo mismo que su hermana: su banco
      # conduce un fixture de test/ y una bateria del hub, y en el arbol publico solo podria
      # dar 127.
      - bash scripts/hub-leg.sh lint:git-env:selftest scripts/test-probe-git-env-exec.sh

  lint:git-env:
    desc: >-
      A script that builds a throwaway git repository must not be able to reach the
      repository it was run FROM. git exports GIT_DIR to hooks from a LINKED worktree and
      never from the main checkout, and GIT_DIR OUTRANKS `-C`: so `git -C "$tmp" …` inside
      a self-test drives the live repo, and `git init "$tmp"` initialises GIT_DIR itself,
      stamping core.bare=true on a repo that has a worktree. Measured 2026-08-06 and
      reproduced in a sandbox before this gate existed: running lint:session-numbers from a
      linked worktree left a live branch pointing at a fixture commit, wrote user.name=t and
      core.bare=true into the shared config, created refs/tags/base, and moved the worktree
      onto a synthetic branch. A checkout that is not a linked worktree cannot reproduce any
      of it BY CONSTRUCTION — it is the one topology where the variable is not exported,
      which is why pushes from there stayed clean while every worktree's did not, and why
      the first attempt to refute the vector, run in a flat repo, came back negative and
      proved nothing. The fix is scripts/lib/git-env.sh, sourced by every member of the
      class. This gate keeps it true two ways: a RATCHET derives the class (a script that
      pairs `mktemp -d` with a git invocation) instead of trusting a hand-written list, so
      a NEW member cannot appear unnoticed — a hand-written enumeration missed five of the
      fifteen the derivation finds; and a BEHAVIOURAL leg runs a real member for real,
      inside a sandbox repository with a linked worktree and GIT_DIR exported, and fails if
      that sandbox moved by one byte. A third leg runs the SAME subject with the isolation
      REMOVED and demands the sandbox BE damaged, because an isolation assertion whose
      harness cannot see damage is a decoration. Three answers: CLEAN / BROKEN /
      UNVERIFIED (exit 2 — git absent, a fixture unreadable, or the mutant failing to
      build), never a silent green. Two seconds. Through hub-leg.sh because its behavioural
      subject is one of the scripts the public export curates out.
    cmds:
      - bash scripts/hub-leg.sh lint:git-env scripts/check-git-env-isolation.sh

  lint:commit-msg-closing:
    desc: >-
      Prove the `commit-msg` guard against ACCIDENTAL issue/PR closures. GitHub closes on
      close/closes/closed, fix/fixes/fixed and resolve/resolves/resolved followed by a
      number from ANYWHERE in a commit body — not just the header, not just inside a pull
      request, not just in commits that touch code. Board and status files narrate PR
      state BY NUMBER, so they carry more of this risk than any source file here: on
      2026-08-04 a one-markdown board commit whose body read "is closed: #484" closed a
      live pull request with 25 files, and the lane then worked for an hour against a
      board that claimed it was delivered. The guard does NOT ban the keyword — closing an
      issue from a commit is a legitimate feature and this repo removes none — it requires
      it to be DELIBERATE: refused when the commit ships no code, untouched when it does.
      This battery checks eleven keyword spellings including capitalisation, that the same
      meaning without the trigger passes, that a bare number reference passes, that a
      code-bearing commit may still close, and that .txt is covered too. It kills FOUR
      mutants — no keyword set, no case-insensitivity, no code exception (inverted so the
      branch actually goes red rather than returning early) and the guard never invoked —
      because an assertion that cannot go red proves nothing. Hermetic: disposable repos
      under TMPDIR, no gate and no remote touched.
    cmds:
      - bash scripts/test-commit-msg-closing.sh

  lint:json-decoders:
    desc: >-
      Every request-body JSON decoder must refuse a body that is not ONE JSON
      document. json.Decoder.Decode reads the first value and stops, so a helper
      that decodes once and returns success accepts {…}{…}, discards the rest in
      silence and mutates — measured at 201 Created on a module route while core
      answered 400 for the same bytes.
    cmds:
      - bash scripts/check-json-decoders.sh

  lint:error-mappers:
    desc: >-
      Every func(http.ResponseWriter, error) in modules/ must reach
      api.StoreErrorStatus, so a store or licence sentinel gets the same answer
      everywhere. Measured 2026-08-12: thirty-six hand-written copies, and four
      sentinels core/api had long mapped (tenant_suspended, tenant_not_in_service,
      not_leader, residency_violation) were in at most two of them — a suspended
      tenant was answered 423 by /v1/orgs and 500 "internal error" by every /v1/m/
      route for the same refusal.
    cmds:
      # THE RED CASES RUN FIRST AND ON EVERY PUSH, like lint:datatable-empty. A gate
      # nobody has watched fail reports green because it looked at nothing: the
      # self-test builds fourteen throwaway trees, nine of them RED by construction
      # (including a mapper that only NAMES api.StoreErrorStatus in a comment and a
      # string, which is what a text gate would have approved).
      #
      # TMPDIR IS SET HERE AND NOT LEFT TO THE CALLER, same as lint:export above and
      # proto:breaking below. The gate builds a small Go helper and then EXECUTES it, and
      # /tmp is tmpfs+noexec in the dev container: measured on 2026-08-12, a build under
      # the default TMPDIR dies at exit 126 with "permission denied" on a file whose exec
      # bit is set. Depending on the caller's environment would mean a fast lint that
      # refuses every push of every lane unless someone remembered an export.
      - cmd: |
          TMPDIR="{{.ROOT_DIR}}/.error-mappers-tmp" bash scripts/check-error-mappers.sh --self-test
      - cmd: |
          TMPDIR="{{.ROOT_DIR}}/.error-mappers-tmp" bash scripts/check-error-mappers.sh

  lint:compliance-cites:
    desc: >-
      Every architectural capability's `cite` must resolve to something the RECIPIENT can
      obtain: a file in the public export closure, or a declared /v1/ route. The field ships
      as EvidenceRef{Kind:"design"} (capabilities.go:439), so it reaches auditors as proof.
      Measured 2026-08-29: ten of twelve pointed at something unfollowable — four at
      `docs/08 §n`, whose file is in DOCS_BLOCK and deliberately withheld; two truncated to
      `module VI /`; three at an unnamed "Contract §n"; one at "modules I/II + audit".
    cmds:
      # THE SELF-TEST FIRST: it builds synthetic capability tables, four RED by construction
      # on the exact shapes that shipped (a withheld doc, a truncated cite, an undeclared
      # route, an empty cite). A gate nobody has watched fail reports green on nothing.
      # ⛔ POR `hub-leg.sh`, como sus hermanas de `lint:export-closure`: este gate LEE
      #    `export-public.sh` y por tanto NO viaja en el export. Llamarlo directo hacia que el
      #    arbol publicado ejecutara un fichero ausente — 127, no un veredicto. `hub-leg.sh` es lo
      #    que convierte eso en NOT APPLICABLE dicho en voz alta. Lo cazo `lint:export-closure`.
      - bash scripts/hub-leg.sh lint:compliance-cites scripts/check-compliance-cites.sh --self-test
      - bash scripts/hub-leg.sh lint:compliance-cites scripts/check-compliance-cites.sh
  lint:list-page-discarded:
    desc: >-
      A caller that throws away the model.Page a List returns AND declares no Limit
      ships a truncated list as if it were the whole list. Measured 2026-08-29 with
      go/ast over 549 List calls: the blind intersection was THREE, all of them the
      `olivares eventing` ls verbs, where a tenant with 101 subscriptions saw 100 rows
      and was told nothing. Those three were fixed in main by 445f9c0bf; this gate is
      what stops the fourth from arriving, and it reports CLEAN against that fix.
    cmds:
      # THE SELF-TEST RUNS FIRST, for the reason lint:error-mappers states: a gate
      # nobody has watched fail reports green because it looked at nothing. It builds
      # six throwaway trees, TWO of them red by construction on the exact two shapes
      # that shipped -- the empty literal and the variable that never gets a Limit.
      - cmd: |
          TMPDIR="{{.ROOT_DIR}}/.list-page-discarded-tmp" bash scripts/check-list-page-discarded.sh --self-test
      - cmd: |
          TMPDIR="{{.ROOT_DIR}}/.list-page-discarded-tmp" bash scripts/check-list-page-discarded.sh

  lint:verifier-truth:
    desc: >-
      Anti-theater gate: public assurance verifiers must not assert literal
      boolean success (:= true, || true, Field: true) without evidence.
    cmds:
      # Pure POSIX sh, no network — invoked directly by the Go-toolchain CI gate
      # and local pre-push hook, not only by the unused `lint:` aggregate.
      - sh scripts/check-verifier-truth.sh

  lint:connector-onboard:
    desc: >-
      A wired connector is OFFERED and PUBLISHED. It runs the two tests that already prove it -
      TestConnectorCatalogCoversSwitch and TestConnectorDocsListEveryWiredKind - rather than
      reimplementing them, because they are the authority and a second copy of a predicate
      diverges. What changes is WHEN they run: today only `go test ./...` over cmd/olivares
      reaches them, which cost 4484s in the run that found connectors/grok wired but never
      offered and absent from the public connectors page, both live in main. These two cost 13s
      cold and 2s warm. The script REFUSES (exit 2) unless it sees each test report by name,
      because `go test -run` with a regex that matches nothing exits 0 - a renamed test would
      leave this green forever without running one assertion.
    cmds:
      - bash scripts/check-connector-onboard.sh

  lint:agent-surfaces:
    desc: >-
      The agent-surfaces census follows the canon's TIER table instead of drifting behind it.
      AGT-01 closed by making the census a SCRIPT rather than a document, precisely so it could
      not go stale - but nothing invoked it, which is a document with extra steps. It went a full
      day answering ZERO for connectors/grok, a surface that existed on disk and that the owner
      had raised to TIER 1 on 2026-08-17. The scope list is deliberate (connectors/ holds ~140 dirs
      and enumerating them all would turn a census into an inventory); what rots silently is the
      CRITERION, so the guard reads the TIER 1 row of CANON-OPERATIVO 0.2 and requires every
      provider named there to own at least one surface. Fails closed: an unreadable or ambiguous
      table exits 2, never 0. ~2s.
    cmds:
      - bash scripts/agent-surfaces-census.sh

  lint:cli-registries:
    desc: >-
      The CLI's REGISTRIES are complete: a visible command appears in the themed help, a help
      group names a command that exists, and every env key this package READS is declared in
      config_registry.go. It runs the three tests that already prove it - TestEveryVisibleCommandIsGrouped and
      TestCadaGrupoDeAyudaNombraUnComandoQueExiste - rather than reimplementing them. Both gates
      ALREADY EXISTED and neither stopped anything: on 2026-08-19 `grok-hook` landed on main
      visible and ungrouped, and a person caught it at integration. The reason is the one already
      measured with connectors/grok: only `go test` over cmd/olivares reaches those tests, which
      is the HEAVY gate, so a branch lane never runs them. A correct test that does not run where
      you push is not a guard. 2s. The script REFUSES (exit 2) unless it sees each test report by
      name, because `go test -run` with a regex that matches nothing exits 0. It is not called
      `command-groups` because the same PR also landed SEVEN env keys read and none registered:
      the name would have aged with the third instance.
    cmds:
      - bash scripts/check-cli-registries.sh

  lint:connector-inventory:
    desc: >-
      The connector INVENTORY gate: every connectors/ directory carrying Go code has a row in
      docs/ai-context/CONNECTORS.md, no row names a directory that is gone, and the summary's
      "Connector directories" figure is re-derived rather than transcribed. It exists because
      connectors/grok landed on 2026-08-18 with code, cells, registration and three green Go
      gates and NO row — check-connectors.sh derives classes from source and says so explicitly
      ("rather than trusting docs/ai-context/CONNECTORS.md"), which is right for classification
      and leaves the table unwatched. A person caught it. Runs its own battery (10 cases,
      hermetic decoys) alongside the gate, because a gate whose properties are only proven in a
      target nobody invokes regresses in silence.
    cmds:
      - bash scripts/check-connector-inventory.sh
      - bash scripts/test-connector-inventory-gate.sh

  lint:connectors:
    desc: Verify connector inventory honesty signals (no stray no-op Gather, no unclassified dirs).
    cmds:
      # E4 exposes the connector lint as an on-demand task only; wiring it into
      # .githooks/pre-push belongs to session so this task intentionally does
      # not change the hook gate.
      - sh scripts/check-connectors.sh

  lint:migrations:
    desc: >-
      Enforce expand-contract online-safety on SQL migrations (zero-downtime upgrades). Carries
      lint:d1-migrations as a dependency rather than living beside it in the `lint` aggregate,
      because the aggregate is NOT what runs: the pre-push hook and CI call individual `lint:*`
      tasks by name, so a new task hung off `lint` alone would never execute. This one is called
      by the fast lane, which makes it the correct parent. lint:migrations:coverage joins it for
      the same reason, and it is not optional: the gate graded 55 of the 94 migration-shaped
      files in the tree -- the 30 with a three-digit prefix, 22 of them the control plane's own,
      were never opened -- and check-migrations.sh's own self_test was GREEN throughout, because
      every case in it hands scan_sql a name and a body directly. It tests the RULES and is silent
      about WHICH FILES REACH THEM. The coverage battery is the half that was missing.
    deps: [lint:d1-migrations, lint:migrations:coverage, lint:migration-contiguity]
    cmds:
      - bash scripts/check-migrations.sh

  lint:migration-contiguity:
    desc: >-
      Refuse a GAP in a migration directory, because a gap is a migration that will never run and
      it fails in silence. golang-migrate keeps ONE scalar version per database and Up() applies
      only Next(current), so a database that reaches 016 never applies a 014 or 015 that lands
      afterwards. Hung off lint:migrations rather than beside it in the `lint` aggregate, for the
      reason that task's own description gives: the aggregate is not what runs, the hook calls
      individual `lint:*` tasks by name. Written after a session did exactly this to itself -- it
      censused every remote branch, found 014 and 015 claimed by live branches, and took 016 to
      avoid a name collision. Right about names, wrong about the direction of failure: a duplicate
      number is LOUD (the migrator refuses at boot and the integrator renumbers at merge), a gap is
      SILENT. The rule for a scalar migrator is max(existing)+1 in the tree you merge into.
    cmds:
      # RETIRADA EL 2026-08-29 LA BATERIA `test-migration-contiguity` (sin ruta a proposito: el
      # verificador de cierre del export lee las rutas que aparecen en los comentarios y una ruta
      # a un fichero borrado le parece una llamada rota — me costo un push de 13m55s).
      #
      # Probaba la implementacion de backend-r1 (`git ls-tree` del SHA pedido, mensaje «CONTIGUO
      # en <sha>») y el choque con KERNEL se adjudico hacia la de KERNEL, que se repliega a disco
      # y por eso sigue viva en el arbol exportado, donde no hay `.git`. La bateria quedo probando
      # codigo inexistente: exigia el <sha> en la salida y mutaba un enumerador ausente. MEDIDO:
      # mato el push de un lote a los 74m53s con rc=2 mientras el guion a pelo daba rc=0 en el
      # mismo arbol — la bateria era lo unico que fallaba.
      #
      # NO se pierde testigo: su sucesora es la de `lint:migration-contiguity:selftest`, abajo, que
      # backend-r1 MISMO amplio a doce casos en 012aadbaa cubriendo los dos mutantes (volver a `ls`
      # y hacer que GITHUB_SHA caiga a HEAD).
      - bash scripts/check-migration-contiguity.sh

  lint:migration-contiguity:selftest:
    desc: >-
      The battery this gate never had — written the day its absence broke `mainline-ci` for every
      lane. Twelve cases over a REAL throwaway repository with the gate copied inside it (it
      resolves its root from BASH_SOURCE, so invoking it from elsewhere measures nothing), and
      the one that carries the fix: an UNTRACKED `.up.sql` left by a previous run on a persistent
      self-hosted runner must NOT count, while the same file once tracked MUST open the gap. Its
      mutants put the gate back to reading the directory with `ls` or make GITHUB_SHA fall back to
      HEAD. The export-without-git case keeps GITHUB_SHA set and must still use the disk fallback.
    cmds:
      - bash scripts/hub-leg.sh lint:migration-contiguity:selftest scripts/test-check-migration-contiguity.sh

  lint:migrations:coverage:
    desc: >-
      Pin the SUBJECT of check-migrations.sh, not just its SQL rules. That gate has been wrong twice
      and neither time was the SQL at fault: a four-digit-only glob left 30 real Postgres migrations
      unread while it printed a confident "55 migration(s)", and a raw `find .` census then graded
      whatever was lying in the tree -- 55 files in a clean worktree, 163 in the shared clone, 96 of
      them another lane's scratch checkout. Both were fixed without a test, so both fixes were
      themselves unverified. Eleven cases, every fixture a real git repository because the census IS
      the index; case 0 is the calibration and cases 1-2 are the width counterfactual. Case 6 is the
      one that earned its place immediately: it caught the census control filtering BOTH sides with
      the same numbering pattern, which made it vacuous for a pattern that stops matching -- the
      script's founding defect reproduced inside its own safeguard.
    cmds:
      - bash scripts/test-migrations-coverage.sh

  lint:d1-migrations:
    desc: >-
      Two migrations that create the SAME TABLE do not conflict in git, and CREATE TABLE IF NOT
      EXISTS turns that collision into a silent no-op. Measured 2026-08-08: three unmerged
      branches carried a 0006, and two created dodo_cohort_fragments with incompatible primary
      keys. Every instrument said the tree was fine -- git merge-tree reported seven conflicts and
      the two 0006 files were NOT among them (to git they are different files), tsc was silent
      because the schemas differ and the TypeScript does not, and check-migrations.sh leaves this
      tree out DELIBERATELY and correctly, since it is Cloudflare D1 whose SQLite schema does not
      follow the engine's Postgres expand-contract rules. Removing that exclusion was the first
      proposed fix and was withdrawn after reading the code: it would apply Postgres rules to
      SQLite. This is the narrow check instead. (Since 2026-08-14 that tree is no longer PRUNED
      from the walk -- it is enumerated and then DECLARED out of scope with its reason printed on
      every run, because a directory has to be counted to be accounted for, and a silent prune is
      how 39 files went unread. The boundary is unchanged; only its visibility is.) The failure mode is the quiet one: wrangler
      keys d1_migrations on the FULL FILENAME, so two files sharing a prefix both apply and both
      get recorded, ordered by readdir, which is unsorted -- reproduced against node:sqlite, one
      order fails loudly on "no such column" and the other applies everything with no error and
      breaks at the first real webhook. RENUMBERING DOES NOT FIX IT, and the battery proves that
      case explicitly: the ledger stores the name, so renaming an applied migration is a new
      unapplied one, and the duplicate table survives the rename. Three answers, and zero
      migrations found is RED, not green.
    cmds:
      # ITS BATTERY RUNS FIRST, HERE. This task is reached by the fast lane through
      # `lint:migrations`' deps (the parent chosen for exactly that reason), so it is the point
      # where the 19 mutation cases can stop being a decoration. They had run ZERO times since
      # the gate landed: the counterfactual the description calls "the point" had never fired
      # in any gate, only by hand on a tree that no longer exists.
      - task: lint:d1-migrations:selftest
      - bash scripts/check-d1-migrations.sh

  lint:d1-migrations:selftest:
    desc: >-
      Prove the gate above by MUTATION, 11 cases, both directions -- and the counterfactual is the
      point, asked for by name: the real 0006 clash is fabricated from the two branches and seen
      RED before anything is believed. A check that has not seen its own case has proved nothing.
      The second case that matters is the one that would have prevented a wrong instruction: after
      renumbering, the prefix clash is gone and the table is still created twice, so the gate must
      stay red -- if it ever goes green it has started endorsing the withdrawn advice. The
      NOT-catching half is equally load-bearing: IF NOT EXISTS with a single creator is ordinary
      and stays clean, measured, because all four tables on main use it and a universal rule would
      open with four findings on a correct tree.
    cmds:
      - bash scripts/with-clean-tmp.sh bash scripts/test-d1-migrations.sh

  lint:i18n:
    desc: Fail if console translations drift, literal t() keys do not resolve, or a chunk renders a namespace it never registers.
    cmds:
      # Pure Node (no pnpm/deps) so it runs inside the Go-toolchain gate.
      - node scripts/check-i18n-parity.mjs
      - node scripts/check-i18n-usage.mjs
      # THE GAP THIS CLOSES. The two checks above ask "does the key exist?" and
      # "do the languages agree?" — both were GREEN while the first-boot wizard
      # printed `assurance.stepUpTitle` on the button it told the operator to press.
      # The key existed (identity/i18n/en.json); nothing loaded its bundle, because
      # the module that translates trusted its caller to import the namespace and
      # every view is its own lazy chunk. This one asks the missing question: is the
      # namespace REGISTERED in the chunk that renders it?
      #
      # Its red cases run FIRST and on every push: a gate nobody has watched fail is
      # a gate that reports green because it looked at nothing. The battery builds
      # throwaway module trees under TMPDIR (four of them RED by construction) and
      # touches nothing in the repo.
      - node scripts/check-i18n-namespaces.mjs --self-test
      - node scripts/check-i18n-namespaces.mjs
      # AND THE GAP ALL THREE SHARE. Every check above starts from the console:
      # a key, a language, a registered namespace. None can see a user-facing sentence
      # that never reaches a catalog at all — and the Compliance console's front page
      # rendered "NOT a certification and NOT legal advice" in English under Spanish
      # copy with every i18n gate green, because the sentence is a BACKEND constant the
      # console prints verbatim. This one starts from the ENGINE instead, and counts
      # what is still English-only so the residue is a published number.
      - node scripts/check-i18n-disclaimers.mjs --self-test
      - node scripts/check-i18n-disclaimers.mjs

  lint:engine-output:
    desc: Fail if documentation quotes a string no engine literal still contains, names an identifier the engine no longer has, or captures the first-boot banner with a window too small to reach its token.
    cmds:
      # THE CLASS: changing a string the product PRINTS obliges you to sweep everything
      # that CITES it. Nothing checked that, so changed the first-boot TLS line and
      # the fingerprint_sha256 log key, swept reference/, and left two other trees quoting
      # the old output in seven locales — and sweeping for those found a third case nobody
      # had noticed, `grep -A4 "FIRST-BOOT SETUP"` against a banner whose Token: line is
      # six lines down, in 60 places including the Helm NOTES.txt an operator reads right
      # after `helm install`. (Recorded as 59 until the contrast recounted it: the fixing
      # script's total was quoted as the measurement, and the sixtieth was fixed by hand.)
      #
      # It reads LITERALS, not source text: after the rename the bare token still occurred
      # twice in the tree and both were comments describing the defect, so a grep-based
      # gate would have reported green about a key the binary stopped emitting.
      #
      # Neither completeness ratchet is a COUNT — the lesson from check-i18n-disclaimers.mjs,
      # which a pull request can satisfy by adding one member and removing another. They are
      # not the same shape either, and saying so was itself an overclaim: the identifier
      # ratchet is set equality in both directions, while the fence check is a coverage
      # relation, because one registered multi-line chunk covers several quoted lines.
      # Its red cases run FIRST, on throwaway trees under TMPDIR.
      - bash scripts/test-with-clean-tmp.sh
      - bash scripts/with-clean-tmp.sh node scripts/check-engine-output-citations.mjs --self-test
      - node scripts/check-engine-output-citations.mjs

  lint:datatable-empty:
    desc: Fail if a console table or chart can render the GENERIC empty state instead of its own.
    cmds:
      # Pure Node (no pnpm/deps), like the i18n gates, so it runs inside the
      # Go-toolchain leg too. Its RED cases run FIRST and on every push: `empty` is
      # a required ReactElement, so tsc already rejects omission and
      # `empty={undefined}` — this catches what a TYPE cannot, namely an element
      # that renders nothing (`<></>`) and a caller hand-rolling `states.noResults`
      # back in. A gate nobody has watched fail reports green because it looked at
      # nothing, so the battery builds throwaway trees under TMPDIR (8 of 13 RED by
      # construction) and asserts each clause does work.
      - node scripts/check-datatable-empty.mjs --self-test
      - node scripts/check-datatable-empty.mjs

  lint:console-perms:
    desc: >-
      Fail if the console gates on a permission the engine declares nowhere, or if can()
      answers anything other than membership of the set the engine handed it.
    cmds:
      # THE GAP THIS CLOSES. web/src/lib/auth/rbac.ts USED to re-implement the engine's
      # rule in TypeScript, and the copy was more permissive than the original: verbOf
      # fell back to 'read' where the engine's Verb() returns "", and the verb tier was
      # applied to core permissions where the engine consults an explicit set. Measured
      # on main then: 13 permissions the engine declares in NO form, and 6 more it
      # grants at a higher role than the console did.
      #
      # deleted the mirror — the engine hands each grant its effective permission
      # set in whoami and can() is set membership — which MOVES the failure mode rather
      # than removing it, so this gate still earns its runtime on two counts. A string
      # the engine declares nowhere can be in no set, so the action is now hidden for
      # every role, forever, with no 403 to notice it by: it granted silently, now it
      # hides silently. And can() must stay honest set membership, so the console half
      # is executed with the ENGINE's own set and any difference means verb arithmetic,
      # a role rank or a special case has grown back on top of the lookup.
      #
      # It runs BOTH implementations rather than modelling either — `go run
      # ./tools/permsdump` for auth.RoleGrants and the module/route declarations,
      # and an import of rbac.ts for can(). That is not fastidiousness: the engine's
      # core permissions are CONCATENATED at init, so "session:read" exists as a
      # literal nowhere, and cross-checking the console against grep-able
      # declarations flags 48 candidates of which 45 are perfectly real.
      #
      # Red cases first, on every push, same reasoning as lint:i18n's battery: they
      # build throwaway consoles under TMPDIR (25 of the 32 red by construction,
      # including the fail-closed exits, the false-positive control, the four value-
      # carrying shapes a closing review found disappearing, and the two rbac.ts mutants
      # that are now the ONLY way to stage a divergence) and touch nothing in the repo.
      #
      # It installs web deps itself, like check:web, because it needs the console's OWN
      # TypeScript to parse the console. Every other task in the fast lane is documented
      # as pure Node precisely so it runs without them, and wiring a gate that goes red
      # on a correct tree only teaches the lane to reach for --no-verify. Measured warm:
      # install 1.8s + battery 15.5s + check 3.9s.
      - pnpm --dir web install --frozen-lockfile
      - node scripts/check-console-perms.selftest.mjs
      - node scripts/check-console-perms.mjs

  lint:i18n-anchors:
    desc: Fail on dangling in-page #anchors in the docs-site (translated headings change slugs).
    cmds:
      # Pure Node (no pnpm/deps), same as lint:i18n — runs inside the Go-toolchain gate.
      # check-links.mjs skips same-page anchors; this is the i18n bug class fixed
      # for the README, swept across the 115x6 translated pages (an internal design note (not shipped)).
      - node scripts/check-docs-anchors.mjs

  lint:docs-parity:
    desc: >-
      Fail if a docs-site page exists in English but not in a published locale.
    cmds:
      # THE GAP THIS CLOSES. `lint:i18n` compares console UI translation KEYS and
      # `lint:i18n-anchors` compares #anchors INSIDE pages that already exist —
      # neither can see a missing PAGE. That is how 44 English docs-site pages came
      # to have no translation in any of the six locales without a single red gate,
      # and how commit 98c1cbcc reopened the gap in all six locales hours after it
      # was cleared, by adding ADR-0025 and ADR-0026. Every new English page opens
      # six holes; this makes them visible on the next push instead of at the next
      # manual audit.
      #
      # Locales and archived English-only snapshots are IMPORTED from
      # docs-site/src/site-locales.mjs — the same declaration astro.config.mjs and
      # the ADR publisher use, so a seventh locale is covered automatically and a new
      # version snapshot does not flood the report. An earlier version text-scanned
      # astro.config.mjs; an adversarial round broke it with five legal Astro configs,
      # each producing a NON-EMPTY WRONG locale set — zero findings while checking the
      # wrong thing. There is no second parser.
      #
      # INFORMED PARITY since 2026-08-01, and deliberately NOT --report. Project
      # policy from that date: public surface is authored in US English only, and
      # the translations already published are kept as they are. A gate demanding
      # six translations of every new English page would break the build on the
      # first page written under that policy.
      #
      # --report was the obvious move and it is the wrong one: an adversarial round
      # recorded that under --report the original regression — a new English page,
      # six unnoticed holes — still passes both push and CI. A gate that cannot fail
      # is not a gate, and turning a blocking gate into a non-blocking one is how a
      # fail-open gets built on purpose.
      #
      # --informed SPLITS the findings instead of lowering the bar, and the split is
      # DERIVED, not declared. A route missing in EVERY locale is the English-only
      # backlog: reported with its page list, to stdout and to the job summary, and
      # not blocking. A route missing in SOME but not all was being kept in parity
      # and lost a locale — the regression this gate exists for — and still fails.
      # Orphans, route collisions, a missing locale directory and every waiver defect
      # stay blocking in both modes. No manifest to maintain, nothing to sync.
      #
      # Declared limit: deleting EVERY locale of one page in a single commit drops it
      # to zero coverage, so it lands in the backlog rather than going red. This
      # classifier reads the tree, not its history; the diff of removing six files is
      # what catches that, and `orphan` does not — orphans are the other direction.
      # Waivers stay explicit and dated in docs-site/i18n-parity-waivers.json; a
      # waiver that stops suppressing anything is itself a finding, so the file
      # cannot rot into a blanket mute.
      #
      # A missing/malformed locale manifest, an unreadable directory at ANY depth, an
      # empty English tree or a broken waiver file is exit 2 in EVERY mode — a parity
      # checker that parsed zero locales, or read an unreadable subtree as empty, would
      # report zero findings forever.
      - node scripts/check-docs-parity.mjs --informed --summary
      # Prove the RED cases, not just that a green tree stays green: missing page,
      # orphan translation, stale/expired/malformed waiver, new locale, snapshot
      # exclusion, and the hard-error branches. ~3s, hermetic (temp fixtures).
      - bash scripts/test-docs-parity.sh

  lint:adr-not-published:
    desc: Fail if the ADR section comes back to the public docs site.
    cmds:
      # ⛔ REPLACES `lint:adr-sync`, WITHDRAWN 2026-08-25 WITH THE SECTION IT GUARDED.
      # That gate asked "does the published register match docs/adr/?" — a question that
      # only has meaning while something is published. order that day took the whole
      # ADR section off the public site: architecture decision records are internal
      # development documentation, and publishing them can compromise the integrity and
      # security of the project and its paid business/enterprise part. 229 generated pages,
      # the generator `docs-site/scripts/sync-adr.mjs`, its strings file and its battery went
      # with it. `docs/adr/` in this repository is UNTOUCHED — canonical, committed, private.
      #
      # Deleting the old gate and stopping there would have left the decision resting on
      # nobody re-running the generator. This one holds the line in the other direction and
      # is what made the removal safe: it fails on an ADR directory, on an ADR-shaped
      # filename with the directory renamed away, on a live link to the withdrawn route
      # anywhere under docs-site (that is how the archived `src/content/versions/2026-06.json`
      # sidebar was found — no reading of the CONTENT would have seen it), and on the
      # generator itself reappearing.
      #
      # Three answers by exit code: 0 clean · 1 finding · 2 could not look (no site tree).
      - bash scripts/check-adr-not-published.sh
      # Nine cases, both halves of every claim, hermetic (temp fixtures): clean · directory ·
      # filename shape · live link · generator back · NO SUBJECT (empty tree must answer 2,
      # never 0) · the route NAMED in docs-site/README.md stays green while the SAME text in a
      # published page is a finding · and docs/adr/ in the dev repo staying green, because
      # this gate's subject is the public surface and not the private register.
      - bash scripts/check-adr-not-published.sh --selftest

  lint:security-txt:
    desc: Fail if the RFC 9116 /.well-known/security.txt drifts (missing/expired/inconsistent contact, lost Content-Type).
    cmds:
      # Pure POSIX sh, no network — runs in the Go-toolchain CI gate AND the local
      # pre-push hook (invoked directly, not via the `lint:` aggregate which nothing runs).
      - sh scripts/check-security-txt.sh

  test:export-sponsor-exemption:
    desc: >-
      The two halves of the export sponsor exemption, proved by PLANTING the defect: the private org
      URL and a bare prose mention must still leak, while the public sponsors URL and FUNDING.yml's
      bare handle must not. NOT in the fast lane on purpose -- it re-runs the whole export (233s on a
      quiet box; it tracks lint:export, so it scales with the machine), a cost lint:export already
      pays once per push. Run it by hand when the filter changes. Via hub-leg.sh: it calls
      export-public.sh, which is hub-only.
    cmds:
      - bash scripts/hub-leg.sh test:export-sponsor-exemption scripts/test-export-sponsor-exemption.sh

  lint:video-scene-anchors:
    desc: >-
      A launch-video script is a LIST OF SCREENS somebody will go looking for. Twice the material has
      pointed at UI that no longer existed (0263dd4fe, and scenes 7/8/10 of video-demo-script.md on
      2026-08-29, where an earlier change had moved /agentops). Each scene declares route + file + symbol; the gate
      proves the file exists, still contains the symbol on a NON-COMMENT line, and that the route is
      in web/src/features/registry.tsx. It does NOT prove the element paints -- that needs a browser
      and is the capture harness's job; two instruments, cited separately. Under a second.
    cmds:
      # ⛔ VIA hub-leg.sh: los dos guiones razonan sobre docs/launch/, que el export retira, asi que
      #    estan curados fuera del arbol publicado. Sin el envoltorio la pata moriria alli con exit 127
      #    en vez de decir por que no corre. Lo encontro check-export-closure.
      - bash scripts/hub-leg.sh lint:video-scene-anchors scripts/test-video-scene-anchors.sh
      - bash scripts/hub-leg.sh lint:video-scene-anchors scripts/check-video-scene-anchors.sh

  lint:export:
    desc: Public-export gate — every tracked path is classified (allow/block) and no internal ref leaks.
    cmds:
      # 122s measured 2026-08-20 under load 9.15 on 16 cpu, selecting 7,869 of 11,429 tracked
      # paths — and that is `export-public.sh --check` ALONE; this target also runs
      # `lint:export-license:selftest` below. THE FIGURE HERE READ "~1.2s", which is 100x off and
      # was load-bearing prose: it is the sentence that calls this "the cheapest gate" and uses
      # that to justify running it first. The ORDER is still right for a reason the number never
      # supplied — it is the #1 publication blocker, so failing on it early beats failing after
      # the heavy build — but "cheapest" is now false, and a wrong reason for a right decision is
      # how the decision gets reversed later by someone who re-measures. Same family as the "~5s"
      # at line ~1389 that a round-9 run found to be 112s, the 4m15s that had aged 2.5x, and the
      # "~56s" for the closure leg that measured 98s: a duration without the load it was taken
      # under is citable, not comparable, so this one carries its conditions.
      # The publication blocker made non-regressable: a new UNCLASSIFIED top-level
      # path OR any internal-ref/identity leak in the curated tree fails the push and CI, so
      # the export can never silently re-break between now and go-live. /tmp is tmpfs+noexec
      # in the dev container and the gate builds the export-scrub helper, so run it under a
      # repo-local exec dir (same reason as .buftmp/ .examples-tmp/); the script trap-cleans
      # its mktemp subdir. Runs as the FIRST content step of the pre-push hook.
      #
      # ⛔ AND IT IS CONFIGURED IN mainline-ci, WHICH IS NOT THE SAME AS ENFORCED THERE. This line
      # read "Runs in mainline-ci (the enforcement that survives `--no-verify`)", and the pre-push
      # hook repeats that claim beside its own call. Measured 2026-08-20 from the workflow files:
      # `mainline-ci.yml` is `on: workflow_dispatch:` and nothing else, so its copy of this task
      # never runs unless a person dispatches it; and `export-check.yml`, which DOES trigger on
      # push and is filtered to exactly `scripts/**`, `Taskfile.yml` and `.github/workflows/**`,
      # is scoped `branches: [main]`. Neither one looks at a feature branch.
      #
      # ⇒ On a branch this hook is the ONLY reader of an export leak, so a `--no-verify` push is
      # unseen until someone assembles a batch — measured the same day as five PRs pulled from one
      # lot for leaks the branch-tip check reports with file and line. Naming a backstop that does
      # not run is worse than naming none: it invites exactly the bypass it claims to cover.
      - mkdir -p .export-tmp
      # LEG 7's BATTERY RUNS HERE, and the reason it is HERE and not on `lint:export-license`
      # is the whole defect class: `lint:export-license` is a task NOTHING CALLS. The check it
      # names does run — as leg 7 inside export-public.sh, which this target invokes — so
      # hanging the battery off that task would have looked like wiring and executed never.
      # This is the task the pre-push hook and mainline-ci call by name, so this is where the
      # 25 mutation cases become enforcement. Wrapped in hub-leg.sh already, so the published
      # copy of this Taskfile answers NOT APPLICABLE instead of dying at 127. ~4s.
      - task: lint:export-license:selftest
      - task: lint:export-tmpdir-noexec:selftest
      # Through hub-leg.sh, not directly: this Taskfile ships to the public export
      # VERBATIM, but export-public.sh is curated OUT of it (SCRIPTS_BLOCK). Invoked
      # directly, the published copy of this target died at exit 127 with the shell's own
      # "No such file or directory" — a published target that cannot run and does not say
      # why. hub-leg gives the three answers: run it (hub) / NOT APPLICABLE (stamped
      # export) / refuse (neither). In the hub the executed command is unchanged.
      - cmd: |
          TMPDIR="{{.ROOT_DIR}}/.export-tmp" \
            bash scripts/hub-leg.sh lint:export scripts/export-public.sh --check

  lint:js-lexer:
    desc: >-
      UNIT battery for the JS lexer of check-export-closure.sh — the LAYER that was missing.
      It drives strip_comment_js directly, one case per table line, and it does NOT replace
      lint:export-closure, which measures the whole gate end to end. Both are needed: on
      2026-08-30 the end-to-end bank stood at 118 green while a change to this very lexer
      discarded every executable node script in the tree, because `#!/usr/bin/env node`
      carries slashes and the new rule read them as a possible regex literal. No fixture in
      that bank had a shebang, a division or a regex — and it had none because each of its
      cases costs a tree, a manifest and a Taskfile, so the COST of writing a case decided
      which cases existed. Here a case is one line. Carries its own NEGATIVE CONTROL: it runs
      against a frozen copy of the broken lexer and fails if it does not catch it, because a
      battery never tried against something broken does not show that it discriminates.
    cmds:
      # export-closure: hub-only scripts/test-js-lexer.sh — prueba el lexer de
      # `check-export-closure.sh`, que es hub-only, y sus fixtures son declaraciones de EJEMPLO que la
      # guarda lee como reales. Guardada como sus hermanas para que el arbol publicado NOMBRE la razon
      # en vez de morir con exit 127.
      - bash scripts/hub-leg.sh lint:js-lexer scripts/test-js-lexer.sh

  lint:export-closure:
    desc: >-
      STATIC NET over the KNOWN break patterns of the public export — not a proof of
      transitive closure. The rule it looks for: every path a PUBLISHED script, a
      PUBLISHED workflow step (resolved through its working-directory) or a PUBLISHED
      Taskfile target invokes should itself be published — or be declared hub-only at
      that CALL SITE and guarded there, so the exported tree names a reason instead
      of dying at exit 127. A green means "no known-pattern breaks found" over an
      ENUMERATED set of call-site shapes; six escape classes were measured outside it
      on 2026-08-02 (design/audits/2026-08-02-codex-f10-export-closure-review.md,
      Y-01..Y-06) and are listed under LIMITATIONS in the checker's header. The
      authoritative pre-publication control is export:check. Static, hermetic, ~20s,
      no network. It exists because lint:export cannot see this class at all: --check
      scrubs and leak-scans, it never RUNS the acceptance from the copy, and on
      2026-08-02 a real export was measured failing the very first command the export
      prescribes to its reader (`task lint:spdx lint:boundary`) because the published
      battery invoked the provider export script, which the same curation removes. The
      gate runs with its own mutation matrix, like lint:ci-ports and lint:cosign-pins:
      a checker that has only ever been seen passing has never been seen working — and
      the matrix pins the enumerated classes, which is why it cannot be read as closure.
      NOT wired into the pre-push gate on purpose — its enforcement point is the
      export-check workflow, which is REQUIRED before publication, not per PR.
    cmds:
      - bash scripts/hub-leg.sh lint:export-closure scripts/check-export-closure.sh
      - bash scripts/hub-leg.sh lint:export-closure scripts/test-export-closure.sh

  lint:export-license:
    desc: >-
      Refuse to PUBLISH privately-licensed source — ANY `LicenseRef-` identifier — or
      enterprise-tagged Go wiring, on the public-export surface. The identifier is a FAMILY
      since 2026-08-14, and it was a single hardcoded name until then: the repo declares two
      private identifiers (286 files `-Commercial`, 151 `-Internal`), this gate looked for one, and
      the same file on the same shipped path answered rc 1 as `-Commercial` and rc 0 as
      `-Internal`. Live damage, not a hypothesis — scripts/gen-dodo-product-art.mjs was one of
      the 7,553 manifest paths declaring `-Internal` while lint:export signed CLEAN over it;
      it is now curated out, and the rule now catches identifiers nobody has invented yet
      instead of the two we happen to have. Widening was measured first: the only identifiers
      declared on the real surface are AGPL-3.0-only (3,400 files) and Apache-2.0 (1,554), so a
      standard open licence can never match. ADR-0020:39-41 (status accepted, not superseded) forbids the
      PRESENCE of that material in the public repository, not merely its delivery, and until
      2026-08-08 the claim was false: cmd/olivares/circuitbreaker_enterprise.go — 405 lines,
      SPDX LicenseRef-Olivares-Commercial on line 2, //go:build enterprise on line 4 — sat at
      position 191 of the 7,184-path manifest, the ONLY one of the 7,184 declaring a
      commercial licence, shipping beside a LICENSING.md that told the reader commercial code
      lives in a separate private repository. Deleting one file would have closed one
      instance: the pattern was BLESSED BY A RULE (`cmd/*/*_enterprise.go` in
      scripts/check-spdx.sh, now a single named debt), and a rule outlives its file. Both
      discriminators were chosen by measuring the false positives they avoid on the real
      surface: a DECLARATION is an anchored SPDX line, not a mention, because ~34 shipped
      documents name the identifier in prose and email/build.mjs EMITS it as a string; the
      build constraint is read only in .go and only POSITIVELY, because ADR-0020 quotes
      `//go:build enterprise` in seven locales and three cmd/olivares files carry
      `//go:build !enterprise` and are exactly what the public tree must ship. No allowlist,
      deliberately — the rule this replaces was the hatch. Three answers: clean, found, or
      unreadable (an empty surface, an absent or unreadable path, a colon in a path). Also
      runs as leg 7 of the leak gate inside lint:export, over the tree about to be written.
      ~3s.
    cmds:
      - bash scripts/hub-leg.sh lint:export-license scripts/check-export-license.sh

  lint:export-license:selftest:
    desc: >-
      Prove lint:export-license by MUTATION, in both directions — 32 cases, and the
      NOT-catching half is the larger one because that is where the gate would be turned off:
      an ADR quoting both strings in prose, a fenced //go:build enterprise at column zero in
      markdown, a generator emitting the header as a quoted string, LICENSING.md naming the
      identifier, the three open !enterprise stubs, `enterprisey` and `superenterprise`. Seven
      cases were added on 2026-08-14 with the family rule, and they are what pins BOTH of its
      edges: the -Internal declaration that really shipped, its <!-- --> form, an identifier
      declared nowhere in the repo, the finding NAMING what it matched, prose naming
      -Internal, and — the lower edge — a standard AGPL and a standard Apache declaration
      staying green, without which the rule could be widened to "any identifier" and redden
      all 4,956 open declaration LINES on the real surface (measured: that mutant reports
      exactly 4,956). Ten mutants were run against the
      original; nine die here. The one that SURVIVES is recorded rather than hidden: swapping
      the classifier's ENVIRON regex handover for -v changes nothing under mawk 1.3.4, which
      passes undefined escapes through unchanged, and no gawk or busybox awk is installed in
      this image to show the difference.
    cmds:
      - bash scripts/hub-leg.sh lint:export-license:selftest scripts/test-export-license.sh

  lint:export-tmpdir-noexec:selftest:
    desc: >-
      The noexec preflight in export-public.sh, both directions. It exists because the guard
      it replaces was WORSE THAN ABSENT: it named noexec in the error text of `go build`, and
      `go build` SUCCEEDS on a noexec mount, so it never fired and the failure surfaced 340
      lines later as "Permission denied" — pointing at chmod, not at the mount. Negative: a
      real noexec TMPDIR exits 2 and names the mount. Positive: an executable TMPDIR gets past
      it, so it is not a guard that refuses everything. This battery was retired once, on
      2026-08-29, because it opened export-closure references it had not declared; it is back
      with them declared, since a preflight without a battery is the exact condition that let
      the guard it replaces rot unnoticed for months.
    cmds:
      # export-closure: hub-only scripts/test-export-tmpdir-noexec.sh — guarded by scripts/hub-leg.sh
      - bash scripts/hub-leg.sh lint:export-tmpdir-noexec:selftest scripts/test-export-tmpdir-noexec.sh

  lint:gate-parity:
    desc: >-
      a repository gate — which legs run in the hook, which in mainline-ci, and which in only ONE of
      the two. Both directions matter and for different reasons: a SOLO-CI leg is invisible
      to the push, so a failure surfaces after landing; a SOLO-HOOK leg is invisible to
      mainline-ci, so a red leaves main poisoned and EVERY branch in EVERY box dies there,
      each finding out an hour in. Measured 2026-08-29: three of the four deaths of the
      candidate batch were exactly that. The lists are DERIVED from the hook banner and
      mainline-ci and compared against design/GATE-PARITY-2026-08-29.md, so a parity change
      is a written decision instead of a silent drift.
    cmds:
      - bash scripts/check-gate-parity.sh

  lint:gate-parity:selftest:
    desc: >-
      Six cases, and the main mutant is a real error: comparing CI's 'lint:spdx' against the
      hook's short 'spdx' left the lists disjoint and the result — '64 of 64 absent' — looked
      like a finding. That is why the assertion is a FLOOR of matches (ambas >= 20) and not a
      ceiling of differences: a threshold on the difference cannot tell 'no divergence' from
      'the comparison matched nothing'. Includes the no-fire case, without which a gate that
      refuses everything would pass every red one.
    cmds:
      # export-closure: hub-only scripts/test-check-gate-parity.sh — guarded by scripts/hub-leg.sh
      - bash scripts/hub-leg.sh lint:gate-parity:selftest scripts/test-check-gate-parity.sh

  lint:fiscal-id:
    desc: >-
      Refuse to publish a Spanish fiscal identifier (NIF/DNI/NIE) on any surface the public
      export would carry. Today the founder's real number is in the working tree twice and
      does NOT reach the export — but only because `design` and `sessions` happen to be in
      the curation blocklist. That is a decision, not a property: take either off the list,
      publish the repository instead of the export, or move a paragraph one directory over,
      and the datum travels. A PUBLISHED FISCAL NUMBER IS NOT WITHDRAWN, so the surface gets
      a check that answers the question directly. The control letter is COMPUTED, never
      assumed — `8 digits + a letter` is also the shape of build ids and truncated digests,
      and of the 14 pattern candidates in this repository only 4 survive the modulo (2 of the
      4 on the export surface, both the PII detector's own synthetic fixture). NIE is covered
      by the same arithmetic after X/Y/Z becomes 0/1/2; omitting it would leave half the door
      open. The exportable set is DERIVED from `export-public.sh --manifest`, never
      hand-written, so it moves with the curation in the same commit. The allowlist is BY
      PATH and EXPIRES: an entry that names nothing makes the gate refuse to rule. The value
      is never printed — not on stdout, not on stderr, not under --verbose: a gate that
      echoes what it protects has published it to every CI log that ever ran it. ~4s.
    cmds:
      # ITS BATTERY RUNS FIRST, HERE — the fast lane calls this task by name. 24 cases, including
      # the one that asserts the RED report never prints the number on either stream, and none of
      # them had ever executed in a gate. ~5s, which is the price of the assertion being true.
      - task: lint:fiscal-id:selftest
      - bash scripts/hub-leg.sh lint:fiscal-id scripts/check-fiscal-id.sh

  lint:fiscal-id:selftest:
    desc: >-
      Prove lint:fiscal-id by MUTATION, in both directions — 23 cases, ten mutants, all ten
      dead. Catching: NIF, NIE for each of X/Y/Z, the dash-separated written form, a number
      in a PATH NAME, and the fixture reddening once the allowlist is removed (which is the
      only way to know the exception is what saves it). NOT catching: the same number with an
      invalid letter, an invalid NIE, a non-exported path, digests and build ids. Refusing:
      an empty surface, an absent path, an UNREADABLE file, a git-quoted path, an expired
      allowlist entry, and a derivation that fails — each asserted on its REASON, not just
      its exit code, because two controls that answer for each other are one control. One
      case captures both streams of a RED run and fails if the literal appears in either.
      The NIE specimens are Y/Z/X-with-a-body on purpose: an all-zero X specimen cannot tell
      the X-to-0 substitution from its absence (awk reads both as zero), and the mutant that
      deleted that substitution survived the first draft because of it. This description used
      to spell that specimen out, and THIS GATE CAUGHT IT HERE, on line 1221 of a file that
      ships — a checksum-valid identifier in the documentation of the check that forbids
      them. The fix was at the source, which is the fix the gate asks for.
    cmds:
      - bash scripts/hub-leg.sh lint:fiscal-id:selftest scripts/test-fiscal-id.sh

  export:check:
    desc: >-
      THE AUTHORITATIVE PRE-PUBLICATION CONTROL, and the empirical twin of
      lint:export-closure: produce a REAL export into an execve-capable directory and
      RUN, from its root, exactly the acceptance the export prescribes to its reader —
      `task lint:spdx lint:boundary`. It answers by construction, so none of the static
      leg's enumerated blind spots (LIMITATIONS in the export-closure gate)
      apply to it; its own stated scope is that acceptance, not every published target.
      Minutes, not seconds, which is why it is a workflow job and not a push gate —
      and why the static net exists alongside it, as a cheap early warning rather than
      as the assurance. Three answers: CLEAN, BROKEN (the published tree cannot satisfy
      its own acceptance) or UNVERIFIED (a tool or the export itself could not run —
      nothing was measured).
      The working directory is removed on exit unless OLIVARES_KEEP_EXPORT=1; /tmp is
      noexec in the dev container, so the location is PROBED with a real execve
      (override with OLIVARES_EXPORT_CHECK_DIR).
    cmds:
      - bash scripts/hub-leg.sh export:check scripts/check-export-closure.sh --empirical

  lint:commerce:
    desc: >-
      Commercial canon consistency (design/PRICING-CANON.md §Regla). Every PUBLIC
      copy surface — the export manifest filtered to markdown, console i18n and
      pricing data modules — is checked against the canon: currency, plan set,
      seat model, published prices, per-plan price×cadence, internal-only figures,
      merchant of record and the copy phrases the canon itself prohibits. STRICT,
      pinned: the mode is not caller-selectable (an ambient variable used to be
      interpolated as shell text — sol-max B14) — use lint:commerce:report to
      inspect without failing. In the hub the canon is REQUIRED: a missing canon
      fails the gate; only a tree without the lint tool itself (the public
      export) is a no-op (sol-max B15).
    cmds:
      # The guard used to be an inline `echo … ; exit 0`: a SILENT GREEN, so in the
      # public tree the whole commercial enforcement reported success without
      # having looked at anything. Now it is the same three-answer discriminator
      # every other private leg uses, and "not applicable" reaches the job summary.
      # `go build` + execute, not `go run`: go run does NOT propagate the exit
      # code — it prints `exit status 2` and exits 1 — which would collapse this
      # tool's clean/dirty/could-not-look verdict into two answers.
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.ROOT_DIR}}/.commerce-tmp"
          bash scripts/private-leg.sh lint:commerce commercial/commerce-lint \
            env GOWORK=off go build -o "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" .
          if [ -x "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" ]; then
            "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" -root "{{.ROOT_DIR}}" -strict
          fi

  lint:commerce-entity-fks:
    desc: >-
      The postflight that guards commerce startup carries a TYPED allowlist of the foreign keys
      pointing at commerce.legal_entities, and nothing derived it from the migrations that create
      them. On 2026-08-20 migration 010 added commerce.legal_entity_decisions with such a key and
      the list, last touched on 08-13, did not learn it: the service classified it as an
      UNEXPECTED foreign key and refused to serve. Eight race-rest tests went red for two days
      saying "run exited before serving", and the commerce service would not have started against
      a database migrated to 010. This derives the list from the .up.sql files and compares. Three
      answers: 0 clean, 1 the two lists disagree, 2 a form it cannot attribute to a table -- it
      refuses rather than hand back a list it had to guess at. 17 ms.
    cmds:
      - bash scripts/check-commerce-entity-fks.sh
  
  lint:commerce-entity-fks:selftest:
    desc: >-
      Battery for the above, with a NEGATIVE CONTROL: a gate only exercised with failing cases
      cannot tell "finds the defect" from "always shouts". Nine cases, and the ALTER TABLE one
      caught a real defect in the checker itself -- it attributed an orphan REFERENCES to the last
      CREATE TABLE seen and answered 1 with an invented list where it owed a 2.
    cmds:
      - bash scripts/test-commerce-entity-fks.sh
  
  lint:commerce:report:
    desc: >-
      Inspection twin of lint:commerce — lists the same findings, never fails.
    cmds:
      - cmd: |
          set -euo pipefail
          mkdir -p "{{.ROOT_DIR}}/.commerce-tmp"
          bash scripts/private-leg.sh lint:commerce:report commercial/commerce-lint \
            env GOWORK=off go build -o "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" .
          if [ -x "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" ]; then
            "{{.ROOT_DIR}}/.commerce-tmp/commerce-lint" -root "{{.ROOT_DIR}}" -report
          fi

  lint:cra-pack:
    desc: CRA pack presence/freshness.
    cmds:
      # Exposes this as an on-demand task; gate wiring is decision.
      - sh scripts/check-cra-pack.sh

  lint:decision-index:
    desc: MEM-03 — el indice de decisiones esta al dia con el arbol.
    cmds:
      # El GUION da tres respuestas: 0 al dia · 1 el arbol y el indice discrepan (cada razon
      # nombrada) · 2 NO PUDE MIRAR.
      #
      # ⛔ PERO ESTA FRONTERA LAS APLASTA, y el contraste `sol max` del 2026-08-22 lo midio: go-task
      # convierte 1, 2 y hasta 127 en **201**. El hook sigue rechazando —no es fail-open— pero un
      # consumidor automatico NO puede distinguir «hallazgo» de «no pude mirar» por el codigo si
      # llama a la TAREA. Para esa distincion hay que invocar el guion directamente:
      #     bash scripts/build-decision-index.sh --check ; echo $?
      # Se deja escrito aqui en vez de prometer un contrato que esta capa no puede cumplir.
      #
      # Coste medido (mediana de cinco corridas, esta caja): **208 ms**. Antes decia «0s», que no
      # era reproducible.
      - bash scripts/build-decision-index.sh --check

  lint:decision-index:selftest:
    desc: MEM-03 — los testigos nombrados del constructor del indice (22 hoy; el propio selftest
      rehusa si bajan de 21, porque una bateria que solo puede pasar no es una bateria).
    cmds:
      - bash scripts/build-decision-index.sh --self-test

  lint:docs-honesty:
    desc: C3/C6 supply-chain wording + the OTLP format-token and OCSF/Security-Lake guards.
    cmds:
      # Pure POSIX sh, no network; runs in mainline CI and the local pre-push gate.
      - sh scripts/check-docs-honesty.sh
      # Occurrence-aware guard for the export-token remap (bash + grep only); its
      # embedded self-test proves the patterns still catch the known stale families.
      # El self-test primero, como sus hermanos: prueba la guarda anti-vacuidad en las DOS
      # direcciones (barrido sin sujeto ⇒ 2; con sujeto y sin vocabulario obsoleto ⇒ 0). Sin la
      # segunda, la primera se cumpliría rechazando siempre.
      - bash scripts/check-format-docs.sh --selftest
      - bash scripts/check-format-docs.sh
      #a CODE surface may not promise Amazon Security Lake ingest without
      # naming the limit that makes it false (OCSF 1.3 in Parquet). The public
      # reference page was honest while five comments were not; the comment is
      # what a maintainer reads. Windows are whole comment blocks, so a claim
      # split across newlines is caught — three of the five hid from a
      # line-oriented grep exactly that way. `--selftest` proves both directions.
      - bash scripts/check-ocsf-claims.sh
      # A-22: a public documentation surface may not claim data never leaves the
      # perimeter without the bound README.md:44 states (model APIs, SIEM/webhook
      # outputs, an embedding provider you provision). F3-SUPERFICIE-LEGAL.md:358
      # named ONE file; later censuses found more phrasings and translated twins, and
      # NOTHING in the gate looked for them. Wired HERE, not on the `lint` aggregate, because
      # this task is what .githooks/pre-push:522 and mainline-ci.yml:477 actually
      # call — hanging it off `lint` would never run it.
      # Through hub-leg.sh, not directly: this Taskfile ships to the public export but
      # the guard does not. Its scope is DERIVED from `export-public.sh --manifest` (one
      # place decides what is public), and that generator is hub-only — so in the export
      # this leg reports NOT APPLICABLE instead of exiting 127. Same shape as its two
      # manifest-reading siblings, lint:fiscal-id and lint:export-license.
      - bash scripts/hub-leg.sh lint:docs-honesty scripts/check-egress-claims.sh --selftest
      - bash scripts/hub-leg.sh lint:docs-honesty scripts/check-egress-claims.sh --run

  lint:launch-image-refs:
    desc: Ninguna imagen del material de lanzamiento apunta a un fichero ausente (deuda con motivo)
    cmds:
      - bash scripts/check-launch-image-refs.sh

  lint:screenshot-coverage:
    desc: Cuántas rutas de la consola NO tienen captura publicada (techo que sólo baja)
    cmds:
      # El techo va aquí y no dentro del guion para que subirlo sea un cambio VISIBLE en el diff
      # del Taskfile, como el de config-coverage.
# ⛔ TECHO 6, DECLARADO, Y ANTES ERA 0 SOBRE UN DENOMINADOR CORTO. El gate leia 52 rutas de
# registry.tsx mientras route-census.json declara 58, asi que cantaba «0 de 52 sin captura»
# —un pleno— con SEIS rutas fuera de su cuenta y ninguna con captura: /login, /setup,
# /accept-invite, /settings, /status-page y /session-viewer/$id. Es el camino que recorre un
# cliente NUEVO. Medido y corregido el 2026-08-18: el denominador es ahora la UNION de las dos
# fuentes, de modo que ninguna puede esconder una ruta por si sola.
# El techo subio a 6 porque la deuda EXISTIA y no se veia — no porque se aceptase. Se pago:
# el valor efectivo llevaba tiempo en 0 mientras este parrafo seguia diciendo 6. Corregido el
# 2026-08-29 al tocarlo; una cifra en prosa envejece en silencio.
#
# ⛔ TECHO 1 DESDE EL 2026-08-29, Y LA RUTA VA NOMBRADA: es `/accept-invite`, y no es deuda de
#    sembrado sino una AUSENCIA DECIDIDA. Su unica toma posible sin token es la pantalla de error
#    «This invitation link is incomplete», y el estado CON token exige sembrar una invitacion viva
#    que choca con step-up AAL3 —el mismo control que el manifiesto ya declara para `console`—.
#    Debilitar AAL3 por una foto esta descartado de raiz. Adjudicado por the planner: se retira la
#    toma entera y se borran sus dos PNG publicados, en ESTE mismo commit, que es la reparacion
#    que este gate documenta en su propia salida.
#
#    NO se baja sembrando una captura: se baja el dia que el arnes pueda satisfacer AAL3. Si
#    alguien la ve a 1 y busca «que captura falta», la respuesta esta aqui y en
#    `not_captured_by_control` del manifiesto.
      - OLIVARES_SCREENSHOT_UNCOVERED_MAX=${OLIVARES_SCREENSHOT_UNCOVERED_MAX:-1} bash scripts/check-screenshot-coverage.sh

  lint:launch-placeholders:
    # ⛔ NI LA DESC NI EL SCRIPT PUEDEN DELETREAR EL TOKEN: lleva el nombre de pila del fundador y el
    # gate de exportacion lo prohibe en cualquier superficie publicada. Remedio ya escrito en este
    # repositorio para check-commit-identity.sh y check-fiscal-id.sh: el script se cura FUERA del
    # export y su pata va por hub-leg.sh, de modo que el arbol publicado responde NOT APPLICABLE.
    desc: El material de lanzamiento no acumula huecos de relleno en silencio (techo que sólo baja)
    cmds:
      - bash scripts/hub-leg.sh lint:launch-placeholders scripts/check-launch-placeholders.sh

  lint:launch-placeholders:selftest:
    # La bateria del gate de arriba, y va por hub-leg.sh por la MISMA razon: para probar el
    # trinquete tiene que PLANTAR el token literal como fixture, asi que no se publica.
    # Prueba el GATE, no el numero de hoy: un marcador de mas tiene que ponerlo ROJO, y los dos
    # casos ciegos (sin linea base, cero ficheros) tienen que salir rc 2 y no 0.
    desc: El trinquete de huecos de relleno se pone ROJO con un marcador de mas (y rc 2 si no puede mirar)
    cmds:
      - bash scripts/hub-leg.sh lint:launch-placeholders:selftest scripts/test-launch-placeholders.sh

  lint:launch-counts:
    # El material de lanzamiento publica numeros SOBRE SI MISMO (longitud del titulo de Show HN,
    # chars por tuit, la descripcion de Product Hunt). Ese numero es el unico control de que la
    # pieza cabe en el tope de su plataforma, y al editar el texto se queda atras en silencio:
    # AGT-08 encontro DOS recuentos caducos en docs/launch/README.md que ningun gate miraba.
    # No es un techo, es una IGUALDAD — no oscila con las mejoras de redaccion.
    desc: Los recuentos que el material de lanzamiento declara sobre si mismo coinciden con el texto real
    cmds:
      - bash scripts/check-launch-counts.sh

  lint:cloud-availability-claims:
    # Una superficie publica NO puede prometer el cloud ALOJADO en presente mientras el canon de
    # precios siga diciendo que ese tier esta `launch-gated`. Medido el 2026-08-28: dos piezas de
    # lanzamiento decian «launching together with the public release. No waitlist, no early-access
    # gating» y «Cloud Standard is also offered … our infrastructure», con deploy/aws/main.tf
    # declarando «NEVER APPLIED» y cloud/staging/polar-sandbox.md diciendo que solo una URL
    # desplegada probara la entrega alojada. El barrido encontro 18 afirmaciones en OCHO ficheros,
    # dos de ellos fuera de las cinco piezas que el encargo nombraba.
    #
    # Lo que habia en su lugar era un COMENTARIO («S-12 gate: do not publish it anywhere before
    # that flip»), y un comentario no ha parado nunca un push. Ademas cubria el PRECIO, que es la
    # mitad barata: la afirmacion de DISPONIBILIDAD no tenia nada.
    #
    # La condicion se DERIVA del `availability:` de cloud.standard en an internal design note (not shipped), asi
    # que el gate SE APAGA SOLO cuando el apply lo voltee: no hay fecha, ni cifra, ni allowlist que
    # nadie tenga que acordarse de tocar. La bateria va PRIMERA y sin `|| true`: si el gate deja de
    # encontrar su sujeto sale 2 o 0 y parece sano, que es su unico modo de fallo silencioso.
    desc: Ninguna superficie publica promete el cloud alojado en presente mientras el canon lo declare launch-gated
    cmds:
      - bash scripts/test-cloud-availability-claims.sh
      - bash scripts/check-cloud-availability-claims.sh

  lint:raw-palette:
    desc: >
      Enforce `olivares/no-raw-palette` over web/src/features with the real eslint.config.js.
      Was a vitest case (web/src/features/raw-palette.test.ts) that ran a full programmatic
      ESLint pass over 777 files INSIDE a vitest worker: 148s and 113s alone, and 300 892 ms
      under suite load — its own 300s ceiling, already raised once from 60s per its comment.
      That is how it failed: the wall clock, not the assertion. It is a lint, so it runs in
      the lint lane, in the HEAVY one for the same reason as its neighbour above — it needs
      web deps and the fast lane cannot run node. Same config, same rule, same file set,
      same verdict; only the lane changes.
    cmds:
      - bash scripts/check-raw-palette.sh

  lint:format-ratchet:
    desc: >
      Formatting RATCHET for web/: prints how many files prettier rejects on every run and fails
      only when that set GROWS. `format:check` hangs off lint:web (skipped by the push gate on
      purpose) and off fmt:check, and NO workflow invokes either — so measured 2026-08-15 against
      origin/main, 191 files under web/ do not pass the formatter and nothing said so. Wired in
      the HEAVY lane, next to the other legs that need web deps: the fast lane cannot run node, so
      putting it there would fail every push from a tree without `task setup`. The baseline is a
      LIST (web/format-ratchet-baseline.txt), not a count, because a count lets substitution through
      — fix one file, break another, the total holds and the ratchet stays quiet.
    cmds:
      - bash scripts/test-format-ratchet.sh
      # `--gate`: el punto de entrada de producción RECHAZA cualquier variable de anulación. El
      # contraste midió que un FORMAT_RATCHET_CMD heredado hacía pasar este Task entero, 16/16
      # casillas incluidas, sin ejecutar prettier. La batería inyecta porque llama SIN --gate.
      - bash scripts/format-ratchet.sh --gate

  lint:go:
    desc: golangci-lint across every workspace module.
    cmds:
      - bash scripts/lint.sh

  lint:web:
    desc: ESLint + Prettier check for the web UI (+ DTCG token freshness).
    cmds:
      # Design tokens (brandv4) are generated from DTCG sources via Style
      # Dictionary; fail if the committed src/styles/tokens.css drifted (ADM-CORE-04).
      - pnpm --dir web run tokens:check
      - pnpm --dir web run lint
      - pnpm --dir web run format:check

  lint:spdx:awk-selftest:
    desc: >-
      Narrow witness for `classify()` in check-spdx.sh over the `.awk` extension, added with the
      first `.awk` in the tree. It exercises the FUNCTION, not the whole gate, and the reason is
      written in the file: the gate carries a fail-closed floor (SPDX_MIN_CHECKED=4200), so over a
      toy tree it answers 2 CANNOT LOOK and rows "pass" for the wrong reason. It pins the new
      extension, its bucket neighbours and one data extension, proves the classification is
      load-bearing (without it the same file stops being source, which is why the gate returned 2),
      and runs the real gate once end to end. Not a battery for the whole checker: that is another
      lane's work.
    cmds:
      - bash scripts/test-spdx-awk.sh

  lint:spdx:
    desc: Verify the SPDX header on every source file is present and module-correct.
    cmds:
      - sh scripts/check-spdx.sh

  lint:spdx-gate:
    desc: >-
      The battery for lint:spdx — 41 legs over throwaway repositories plus ONE contrafactual
      over the real tree, because the gate had no battery at all and that is how it stayed
      blind to 44 tracked files: the same 200 bytes answered rc=1 as .js and "OK: 4855
      files" as .mjs/.cjs/.mts/.cts. Eight mutants, each naming the witness that kills it —
      the ESM/CJS family back in the silent bucket, the unknown-extension answer turned into
      "data", the population floor removed (it then prints OK over a three-file tree), the
      shebang sniff removed, the licence verdict decided before the could-not-look verdict,
      and three on the named licence debt D-2: widened from its one path to scripts/*.mjs,
      excepting nothing at all, and its ratchet removed so it can outlive its subject. The
      real-tree leg plants a defect as .mjs AND as .js in one run: the widened enumeration
      has to catch the new one WITHOUT losing the old one, and only a run over the tree that
      ships can say that. ~15s, most of it that one run.
    cmds:
      - bash scripts/test-check-spdx.sh

  lint:inbox:selftest:
    desc: >-
      La bateria de `check-inbox-headings.sh`. Existe porque el gate crecio un control del SELLO
      —21 cabeceras del tronco llevan `__SELLO__` literal y el buzon se ORDENA por el— y un
      control que nadie ve cortar es una intencion, no una guarda.
      ⛔ Su caso (f) es el que protege a los cinco carriles: una entrada VIEJA sin sello NO puede
      enrojecer. Si (f) cae, el gate ha dejado de mirar el DIFF y mira el fichero entero, y
      bloquearia a todos por deuda ajena que nadie puede reparar desde su rama — el fallo exacto
      por el que `lint:unpublished-work` se retiro de este hook dos veces.
      Y su caso (a) es un CONTROL POSITIVO deliberado: si un buzon valido no pasa, ningun rojo de
      los demas significa nada.
    cmds:
      - bash scripts/test-inbox-headings.sh

  lint:publish-inbox-shape:
    desc: >-
      The bench of publish-inbox.sh's SHAPE guard (4-bis: a message is an entry, not a whole
      mailbox; a probe that fails is NO HE PODIDO MIRAR, never "clean"). Every firing row demands
      its message AND rc 2 AND that the publisher did not reach the `cd` — an `exit 2` mutated to
      `exit 0` used to pass a text-only bench. Rows 7/7b shadow awk from an EXECUTABLE tmpdir
      (scripts/lib/exec-tmpdir.sh): /tmp is noexec here and PATH silently skips it. ~1 s.
    cmds:
      - bash scripts/hub-leg.sh lint:inbox-shape scripts/test-publish-inbox-shape.sh

  lint:inbox:
    desc: >-
      Verify each mailbox carries exactly its five structural headings. A message body that
      starts a line with '##' creates a section nobody wrote, and every script that splits
      these files by heading then sees it — one such split deleted 240 lines and seven
      messages on 2026-08-04. The artefact came back three times before this check existed.
    cmds:
      - bash scripts/check-inbox-headings.sh

