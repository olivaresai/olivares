  watchdog:unpublished-work:
    desc: >-
      a repository gate — despierta al DUEÑO del trabajo sin publicar, sin bloquear a nadie. NO va en
      ningún gate a propósito: el ratchet que sí lo era se retiró el mismo día que aterrizó
      (2026-08-10) porque en un clon compartido por tres contenedores cobraba al que empuja
      por trabajo ajeno, y su único remedio era el `--no-verify` que la propia regla prohíbe.
      Lo que le faltaba al censo no era el sitio, era la EDAD: en vuelo (<45m) no se toca,
      45m-4h avisa, >4h es la clase que se pierde. Lo corre el vigía del hub, no el push.
    cmds:
      - bash scripts/watchdog-unpublished-work.sh

  watchdog:hook-only-legs:
    desc: >-
      a repository gate — centinela POST-MERGE de las patas que el gancho corre y `mainline-ci` no ve (149 el
      2026-08-29). No es un gate y no bloquea: corre sobre `main` limpio tras cada merge de lote e
      informa con el rc POR PATA y el SHA que midio. La diferencia entera con correr tres patas
      elegidas a mano es que CONSUME la lista que `check-gate-parity.sh --print` deriva en cada
      corrida — una lista elegida envejece con el criterio de quien la eligio; una derivada, con el
      arbol. Rehusa (2) sobre arbol sucio, sobre un SHA que no este en origin/main, sin `task`, sin
      el comando de paridad y con la lista por debajo del minimo: un centinela que calla cuando no
      puede medir se lee como verde en el sitio donde nadie vuelve a mirar.
    cmds:
      - bash scripts/watchdog-hook-only-legs.sh
  watchdog:hook-only-legs:selftest:
    desc: >-
      a repository gate — bateria del centinela, con los tres mutantes que r4 exige: lista congelada -> rojo,
      silencio -> rojo, SHA no publicado -> rojo. Mas la direccion de no-disparo, sin la cual un
      centinela que rehusara siempre pasaria todas las casillas de rechazo.
    cmds:
      - bash scripts/test-watchdog-hook-only-legs.sh
  lint:watchdog-unpublished-work:
    desc: >-
      a repository gate — batería del watchdog (9 casillas). ESTA sí va en el carril rápido: el watchdog
      no bloquea, pero si se pudre en silencio deja de avisar y nadie lo nota. Cuesta ~2s.
    cmds:
      - bash scripts/test-watchdog-unpublished-work.sh

  lint:cli-transport-exempt:
    desc: >-
      Toda ruta de red de `cmd/olivares` pasa por `cliTransport` o DECLARA por escrito por que no.
      El invariante ya lo comprueba `TestOnlyOneCLITransport`, pero ese test vive en
      `test:functional`, que NO esta en el hook —ni rapido ni pesado— y solo corre en
      `mainline-ci` por push a `main`: el autor de una ruta de red no veia su propio rojo hasta
      DESPUES de aterrizar. Esto es glob + comparacion de lineas, sin motor ni BD, asi que nada
      justificaba que viviera a una hora del autor. El test de CI se queda como testigo de
      integracion; esto acerca el invariante a quien escribe el codigo.
    cmds:
      - bash scripts/check-cli-transport-exempt.sh

