  lint:pr-ci-regime:
    desc: >-
      The public repository's PULL-REQUEST regime is coherent with the branch protection that
      consumes it. Measured 2026-08-27: apply-branch-protection.sh's public profile required ten
      mainline-ci contexts, and mainline-ci has NO pull_request trigger — so every required check
      on a public PR would have waited forever for a job nothing starts, and the first external
      contribution would have been unmergeable. Both files were plausible alone; only their
      PAIRING was broken, which is why it needs a gate. Pins three things: every pr-ci.yml job
      carries the repository guard (a job that lost it would run on the private hub, the
      automatic-CI regime the owner closed on 2026-08-02); the guard names the same repository the
      export targets (a rename turns the regime into skipped jobs, and skipped jobs SATISFY
      required checks — green with nothing run); and the required contexts are exactly pr-ci.yml's
      job ids, in both directions. Three answers: CLEAN, FAIL, COULD NOT LOOK.
    cmds:
      - bash scripts/hub-leg.sh lint:pr-ci-regime scripts/check-pr-ci-regime.sh

  lint:pr-ci-regime:selftest:
    desc: >-
      PR-CI regime — battery: an unguarded job, a guard naming another repository, a required
      context with no job, a job that is not required, each of the three files absent, an
      unreadable contexts line, and the two non-firing directions (clean stays clean; the same
      set in another order does not fire).
    cmds:
      - bash scripts/hub-leg.sh lint:pr-ci-regime:selftest scripts/test-pr-ci-regime.sh

