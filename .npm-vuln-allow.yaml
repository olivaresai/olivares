#
# Dated, justified allowlist for the fail-closed npm/JS dependency-vulnerability gate
# (scripts/npm-vuln-gate.sh). Same rules and same reader as .govulncheck-allow.yaml:
#   - A blocking-severity advisory NOT listed here fails the gate.
#   - Every entry MUST carry an `expires` date (YYYY-MM-DD, UTC); past it the gate fails,
#     so a temporary exception can never become a silent forever-exception.
#
# ⛔ THESE ENTRIES ARE NOT A VERDICT, AND NOBODY HAS ASSESSED THEM.
#
# They are the advisories that ALREADY EXISTED on the day this gate was introduced
# (2026-08-07), recorded so the gate can start blocking REGRESSIONS from its first run instead
# of waiting for a triage that had never happened at all — before today nothing in this
# repository scanned npm dependencies, so none of these had ever been seen by a gate.
#
# They share one expiry ON PURPOSE. That date is when somebody has to look, and the gate turns
# red until they do. Whoever triages should SPLIT this list: real exceptions keep an entry with
# their own reason and their own date; everything else gets fixed by bumping the dependency.
#
# npm audit has NO reachability analysis, so unlike govulncheck none of these can be dismissed
# with "the vulnerable symbol is not reachable". Triage means reading each one.
#
# Derived from the gate's OWN run, not from a separate sweep by hand: a hand sweep missed one
# (GHSA-8r6m-32jq-jx6q, in connectors/backstage/plugin-frontend) because it looked at six
# workspaces where the gate enumerates eight from git.
allow:
