#
# Dated, justified allowlist for the fail-closed dependency-vulnerability gate
# (scripts/govulncheck-gate.sh/E4).
#
# A vulnerability acceptance requires no upstream fix yet; a reviewed scanner
# false positive additionally requires exact finding scope. Rules the gate enforces:
#   - A vulnerability that IS called and is NOT listed here fails the gate.
#   - Every entry MUST carry an `expires` date (YYYY-MM-DD, UTC); once that date
#     passes the gate fails, forcing a re-review (no silent forever-exceptions).
#   - An actual vulnerability WITH an available fix is never allowlisted — bump the
#     dependency instead. False positives require the exact scope below.
#
# Keep this list empty whenever possible. It is audited by the adversarial
# campaign and surfaced in docs/security/gate-report.md.
# Reviewed scanner false positives also require an exact scan/module/version,
# package set and govulncheck OSV-record hash. Every called finding must match.
# Expiry or a changed scope/record forces re-review; real affected calls still block.
allow: []
