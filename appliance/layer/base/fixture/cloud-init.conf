#
# cloud-init configuration of the appliance base fixture container, installed as
# /etc/cloud/cloud.cfg.d/99-appliance-fixture.cfg. A single datasource skips detection. The
# fixture boot command supplies the container-assigned address as cloud-init network config.
# NetworkManager renders and owns it; the container manager sets the hostname. Only the modules run:
# write_files emits the answers, users_groups authorizes the declared key, ssh generates the
# instance's host keys.
datasource_list: [ NoCloud ]
datasource:
  NoCloud:
    seedfrom: file:///var/lib/cloud/seed/nocloud/
preserve_hostname: true
cloud_init_modules:
  - write_files
  - users_groups
  - ssh
cloud_config_modules: []
cloud_final_modules: []
