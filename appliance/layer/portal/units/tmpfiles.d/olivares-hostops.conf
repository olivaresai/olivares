# f creates a missing lock without truncating or replacing an existing inode.
d /run/olivares-lifecycle 0750 root olivares-lifecycle - -
f /run/olivares-lifecycle/lifecycle.lock 0640 root olivares-lifecycle - -
d /run/olivares-portal-api 0755 root root - -
# StateDirectory owns only the operations leaf below this protected parent.
d /var/lib/olivares-portal 0755 root root - -
