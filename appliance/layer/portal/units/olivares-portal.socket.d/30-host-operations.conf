# Keep the TCP and local activation sockets in the same finite limit envelope.
# Credential-loss backoff is supplied by the service's direct restart policy.
[Socket]
PollLimitIntervalSec=15s
PollLimitBurst=1
TriggerLimitIntervalSec=10s
TriggerLimitBurst=5
