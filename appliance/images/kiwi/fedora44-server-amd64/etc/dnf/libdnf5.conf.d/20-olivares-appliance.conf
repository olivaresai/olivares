#
# installonly_limit (F5 r3 §8; the A2 recipe's decision). A4's retained points boot their own store objects, so the only
# live kernels they reference are the current entry's and, until the next witness, next_pair's: two. A transaction that
# installs a new kernel adds one, so 3 keeps every referenced kernel installed; the package-phase plan still refuses any
# removal of one. /etc/dnf/dnf.conf loads last (dnf5.conf(5)), and config.sh fails a build whose dnf.conf sets it.
[main]
installonly_limit=3
