#
# Code generation for the wire contract. Run from sdk/plugin/proto with:
#   buf generate
# Requires protoc-gen-go and protoc-gen-go-grpc on PATH (see Taskfile `proto`).
# Output lands in ../genpb/olivaresv1 (paths=source_relative keeps the
# olivaresv1/ subdir, matching the go_package import path).
version: v2
plugins:
  - local: protoc-gen-go
    out: ../genpb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../genpb
    opt: paths=source_relative
