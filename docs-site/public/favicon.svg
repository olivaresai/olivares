<!-- The Olivares "Ledger O": arc + stacked audit-ledger rows, one orange flagged
     WRITE. Ink adapts to the browser chrome (light/dark); the accent stays brand
     orange (#F08000). Same geometry as the in-app BrandMark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 2 28 28" fill="none">
  <style>
    .ink { stroke: #28282b; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #fafaf9; } }
  </style>
  <path class="ink" d="M16 5.5A10.5 10.5 0 0 1 16 26.5" stroke-width="3" stroke-linecap="round"/>
  <path class="ink" d="M8.4 10.5H13.2" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M8.4 14.5H15.4" stroke="#f08000" stroke-width="3.1" stroke-linecap="round"/>
  <path class="ink" d="M8.4 18.5H15" stroke-width="2.6" stroke-linecap="round"/>
  <path class="ink" d="M8.4 22.5H13.4" stroke-width="2.6" stroke-linecap="round"/>
</svg>
